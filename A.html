async function sendInvitationForSlot(service, provider) {
    const providerUid = getProviderUid(provider);

    if (!providerUid) {
        console.warn('[Zone21 Invite] ✗ Provider has no UID — skipping');
        return { skipped: true, reason: 'no_provider_uid' };
    }

    const messageText = buildInviteMessage(service, provider.name);
    const requestRef = db.collection('bookingRequests').doc();

    const requestDoc = {
        userId: currentUser.uid,
        eventId: currentSessionId,
        eventName: currentEventData.name,
        date: currentEventData.date,
        time: currentEventData.time,
        location: currentEventData.location,
        country: currentEventData.country,
        organiserUid: currentUser.uid,
        organiserName: currentUser.displayName || currentUser.email || 'Organiser',
        organiserContact: currentEventData.contact,
        providerId: providerUid,
        providerName: provider.name || 'Provider',
        providerDocId: provider.id || '',
        service,
        budget: currentEventData.budget,
        notes: currentEventData.notes,
        package: userPackage,
        status: 'invited',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    try { await requestRef.set(requestDoc); } catch (e) { console.error('[Zone21 Invite] bookingRequests write failed:', e); }

    try {
        await db.collection('messages').add({
            sender: 'user', senderId: currentUser.uid, senderType: 'organizer',
            senderName: currentEventData.name,
            subject: `Service Invitation: ${service} → ${provider.name || 'Provider'}`,
            message: messageText, type: 'service_invitation',
            recipientId: 'admin', status: 'unread',
            eventId: currentSessionId, eventName: currentEventData.name,
            country: currentEventData.country,
            service, providerId: providerUid, providerName: provider.name || 'Provider',
            date: currentEventData.date, time: currentEventData.time,
            location: currentEventData.location, budget: currentEventData.budget,
            requestId: requestRef.id,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (e) { console.warn('admin message failed:', e.message); }

    if (providerUid && providerUid !== 'admin') {
        try {
            const chatId = getChatId(currentUser.uid, providerUid);
            await db.collection('threads').doc(chatId).set({
                participants: [currentUser.uid, providerUid],
                jobTitle: service,
                lastMessageText: messageText.substring(0, 80),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            await db.collection(`threads/${chatId}/messages`).add({
                senderId: currentUser.uid, text: messageText,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                isSystemRequest: true
            });
        } catch (e) { console.error('vendor chat message failed:', e); showToast('⚠️ Chat message could not be sent.', 'error'); }
    }

    try {
        await db.collection('messages').add({
            sender: 'system', senderId: 'system', senderType: 'system', senderName: 'Zone21 System',
            subject: `Invitation Sent: ${service} → ${provider.name || 'Provider'}`,
            message: `You have successfully sent the following invitation to ${provider.name || 'Provider'}:\n\n${messageText}`,
            type: 'service_invitation_sent',
            recipientId: currentUser.uid, status: 'read',
            eventId: currentSessionId, eventName: currentEventData.name,
            country: currentEventData.country,
            service, providerId: providerUid, providerName: provider.name || 'Provider',
            date: currentEventData.date, time: currentEventData.time,
            location: currentEventData.location, budget: currentEventData.budget,
            requestId: requestRef.id,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (e) { console.warn('organiser inbox message failed:', e.message); }

    markLocallyInvited(service, providerUid);
    return { requestId: requestRef.id, providerId: providerUid, service, providerName: provider.name };
}

async function sendAllInvitations() {
    if (!currentUser || !currentEventData) { showToast('Not ready. Please generate a blueprint first.', 'error'); return; }
    if (!currentSessionId) { showToast('No active event session. Please regenerate the blueprint.', 'error'); return; }

    const checkboxes = document.querySelectorAll('input[data-approve-provider]:checked');
    if (checkboxes.length === 0) {
        showToast('No providers selected. Tick "Include" next to the providers you want to invite.', 'info');
        return;
    }

    const btn = document.getElementById('invite-all-btn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...'; }

    let sentCount = 0, failCount = 0, skipCount = 0;

    for (const cb of checkboxes) {
        const service = cb.getAttribute('data-approve-service');
        const providerId = cb.getAttribute('data-approve-provider');

        if (isLocallyInvited(service, providerId)) { skipCount++; continue; }

        const provider = findProviderById(providerId);
        if (!provider) { failCount++; continue; }

        try {
            const result = await sendInvitationForSlot(service, provider);
            if (result.skipped) failCount++;
            else {
                sentCount++;
                activeRequests[service] = { ...result, status: 'invited', providerName: provider.name };
            }
        } catch (e) { console.error('[Zone21] Invite error:', e); failCount++; }
    }

    saveBlueprintState(lastGeneratedHTML);
    refreshSlotUI();

    let msg = '';
    if (sentCount > 0) msg += `✅ ${sentCount} invitation(s) sent. `;
    if (skipCount > 0) msg += `ℹ️ ${skipCount} already invited. `;
    if (failCount > 0) msg += `❌ ${failCount} failed. `;

    showToast(msg || '❌ No invitations sent.', sentCount > 0 ? 'success' : 'error');

    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Invite All Selected'; }
    updateInviteButtonState();
}

function updateInviteButtonState() {
    const btn = document.getElementById('invite-all-btn');
    if (!btn) return;
    const anyChecked = Array.from(document.querySelectorAll('input[data-approve-provider]'))
        .some(cb => cb.checked && !cb.disabled);
    btn.disabled = !anyChecked;
}

// ============================================================
//  LIVE STATUS
// ============================================================
function subscribeToBookingRequests() {
    if (bookingUnsubscribe) { bookingUnsubscribe(); bookingUnsubscribe = null; }
    if (!currentSessionId) return;

    bookingUnsubscribe = db.collection('bookingRequests')
        .where('eventId', '==', currentSessionId)
        .onSnapshot(snapshot => {
            const latestByService = {};
            snapshot.forEach(doc => {
                const r = { id: doc.id, ...doc.data() };
                const svc = r.service;
                if (!latestByService[svc] || (r.createdAt && latestByService[svc].createdAt && r.createdAt.toMillis() > latestByService[svc].createdAt.toMillis())) {
                    latestByService[svc] = r;
                }
            });
            Object.keys(latestByService).forEach(svc => {
                activeRequests[svc] = {
                    requestId: latestByService[svc].id,
                    providerId: latestByService[svc].providerId,
                    providerName: latestByService[svc].providerName,
                    status: latestByService[svc].status,
                    service: svc
                };
            });
            refreshSlotUI();
            checkAllConfirmed();
        }, err => console.error('booking subscription:', err));
}

function refreshSlotUI() {
    if (!currentEventData) return;
    (currentEventData.services || []).forEach(service => {
        const active = activeRequests[service];
        const slotStatusEl = document.querySelector(`[data-slot-status="${CSS.escape(service)}"]`);

        document.querySelectorAll(`.vendor-card[data-service="${CSS.escape(service)}"]`).forEach(card => {
            const badge = card.querySelector('.vendor-status-badge');
            if (badge) { badge.className = 'vendor-status-badge not_sent'; badge.textContent = 'Not yet invited'; }
            card.classList.remove('is-invited', 'is-accepted', 'is-declined');
        });

        if (!active) {
            if (slotStatusEl) { slotStatusEl.className = 'slot-status not_sent'; slotStatusEl.textContent = 'Not yet invited'; }
            document.querySelectorAll(`input[data-approve-service="${CSS.escape(service)}"]`).forEach(cb => {
                const providerId = cb.getAttribute('data-approve-provider');
                const isInvited = (currentEventData.invitedHistory && currentEventData.invitedHistory[service] || []).includes(providerId);
                if (isInvited) {
                    cb.checked = true; cb.disabled = true;
                    const wrapper = cb.closest('.approve-checkbox');
                    if (wrapper) { wrapper.classList.add('invited'); const label = wrapper.querySelector('.cb-label'); if (label) label.textContent = 'Invited'; }
                } else {
                    cb.disabled = false;
                    const wrapper = cb.closest('.approve-checkbox');
                    if (wrapper) { wrapper.classList.remove('invited'); const label = wrapper.querySelector('.cb-label'); if (label) label.textContent = 'Include'; }
                }
            });
            updateInviteButtonState();
            return;
        }

        if (slotStatusEl) {
            slotStatusEl.className = `slot-status ${active.status}`;
            slotStatusEl.textContent = statusLabel(active.status);
        }

        const card = document.querySelector(`.vendor-card[data-provider-id="${CSS.escape(active.providerId)}"][data-service="${CSS.escape(service)}"]`);
        if (card) {
            const badge = card.querySelector('.vendor-status-badge');
            if (badge) { badge.className = `vendor-status-badge ${active.status}`; badge.textContent = statusLabel(active.status); }
            card.classList.add('is-invited');
            if (active.status === 'accepted') card.classList.add('is-accepted');
            if (active.status === 'declined') card.classList.add('is-declined');
        }

        document.querySelectorAll(`input[data-approve-service="${CSS.escape(service)}"]`).forEach(cb => {
            const providerId = cb.getAttribute('data-approve-provider');
            const isInvited = (currentEventData.invitedHistory && currentEventData.invitedHistory[service] || []).includes(providerId);
            if (isInvited) {
                cb.checked = true; cb.disabled = true;
                const wrapper = cb.closest('.approve-checkbox');
                if (wrapper) { wrapper.classList.add('invited'); const label = wrapper.querySelector('.cb-label'); if (label) label.textContent = 'Invited'; }
            }
        });
    });
    updateInviteButtonState();
}

function checkAllConfirmed() {
    if (!currentEventData) return;
    const services = currentEventData.services || [];
    if (!services.length) return;
    const allConfirmed = services.every(s => activeRequests[s] && activeRequests[s].status === 'accepted');

    let banner = document.getElementById('all-confirmed-banner');
    if (allConfirmed) {
        if (!banner) {
            banner = document.createElement('div');
            banner.id = 'all-confirmed-banner';
            banner.className = 'confirm-banner';
            banner.innerHTML = `<i class="fas fa-circle-check"></i><div><div class="txt">All services confirmed</div><div class="sub">Every required provider has accepted for ${currentEventData.date}.</div></div>`;
            finalBlueprint.insertBefore(banner, finalBlueprint.firstChild);
        }
        if (currentSessionId) {
            db.collection('events').doc(currentSessionId).set({
                status: 'confirmed',
                confirmedAt: firebase.firestore.FieldValue.serverTimestamp(),
                organiserUid: currentUser.uid,
                eventName: currentEventData.name,
                date: currentEventData.date,
                time: currentEventData.time,
                country: currentEventData.country,
                package: userPackage
            }, { merge: true }).catch(() => {});
        }
    } else if (banner) {
        banner.remove();
    }
}

// ============================================================
//  HISTORY
// ============================================================
function saveBlueprintState(htmlOutput) {
    const title = currentEventData.name || `${currentEventData.location} Event`;
    const chatData = {
        id: currentSessionId,
        title: title,
        formData: currentEventData,
        blueprintHtml: htmlOutput,
        updatedAt: new Date().toISOString()
    };
    let localSessions = JSON.parse(localStorage.getItem('zone21_events') || '{}');
    localSessions[currentSessionId] = chatData;
    localStorage.setItem('zone21_events', JSON.stringify(localSessions));
    renderHistorySidebar();
}

function renderHistorySidebar() {
    const historyList = document.getElementById('history-list');
    if (!historyList) return;
    historyList.innerHTML = '';

    const allSessions = JSON.parse(localStorage.getItem('zone21_events') || '{}');
    const filtered = Object.values(allSessions).filter(s => {
        const pkg = s?.formData?.package;
        if (!pkg) return true;
        return pkg === userPackage;
    });

    if (filtered.length === 0) {
        historyList.innerHTML = `
            <div style="padding:14px 12px;text-align:center;font-size:0.72rem;color:rgba(255,255,255,0.35);line-height:1.5;">
                <i class="fas fa-folder-open" style="font-size:1.4rem;display:block;margin-bottom:6px;opacity:0.4;"></i>
                No ${userPackageName || ''} blueprints yet.<br>Generate one to see it here.
            </div>`;
        return;
    }

    filtered
        .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
        .forEach(session => {
            const countryTag = session?.formData?.country
                ? (getCountryMeta(session.formData.country)?.flag || '') + ' '
                : '';
            const item = document.createElement('div');
            item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
            item.innerHTML = `
                <span class="title"><i class="fas fa-clipboard-list"></i>${countryTag}${escapeHtml(session.title)}</span>
                <button class="delete-btn" onclick="deleteBlueprintSession('${session.id}', event)"><i class="fas fa-trash"></i></button>`;
            item.onclick = () => loadBlueprintSession(session.id);
            historyList.appendChild(item);
        });
}

function loadBlueprintSession(sessionId) {
    closeSidebar();
    const allSessions = JSON.parse(localStorage.getItem('zone21_events') || '{}');
    const session = allSessions[sessionId];
    if (!session) return;

    const sessionPkg = session?.formData?.package;
    if (sessionPkg && userPackage && sessionPkg !== userPackage) {
        showToast(`This blueprint belongs to the "${sessionPkg}" package. Switch plans to view it.`, 'error');
        return;
    }

    currentSessionId = session.id;
    currentEventData = session.formData;
    if (!currentEventData.invitedHistory) currentEventData.invitedHistory = {};
    if (!currentEventData.inviteQueues) currentEventData.inviteQueues = {};

    // Make sure country tag is present (backwards compat)
    if (!currentEventData.country) {
        currentEventData.country = detectCountryFromLocation(currentEventData.location);
    }

    formSection.style.display = 'none';
    loadingDiv.style.display = 'none';
    blueprintContainer.style.display = 'block';
    finalBlueprint.innerHTML = session.blueprintHtml;
    activeRequests = {};
    subscribeToBookingRequests();
    refreshSlotUI();
    renderHistorySidebar();
}

function deleteBlueprintSession(sessionId, event) {
    if (event) event.stopPropagation();
    if (!confirm('Delete this event blueprint?')) return;
    let localSessions = JSON.parse(localStorage.getItem('zone21_events') || '{}');
    delete localSessions[sessionId];
    localStorage.setItem('zone21_events', JSON.stringify(localSessions));
    if (currentSessionId === sessionId) startNewSession();
    else renderHistorySidebar();
}

function startNewSession() {
    closeSidebar();
    currentSessionId = null;
    currentEventData = null;
    serviceMatches = {};
    activeRequests = {};
    if (bookingUnsubscribe) { bookingUnsubscribe(); bookingUnsubscribe = null; }
    form.reset();
    blueprintContainer.style.display = 'none';
    loadingDiv.style.display = 'none';
    formSection.style.display = 'block';
    updateCountryBanner();
    renderHistorySidebar();
}

window.closeBlueprintProfile = closeBlueprintProfile;

// ============================================================
//  INIT
// ============================================================
document.addEventListener('DOMContentLoaded', async function() {

    const bpProfileModal = document.getElementById('blueprintProfileModal');
    const bpProfileCloseBtn = document.getElementById('blueprintProfileCloseBtn');
    if (bpProfileCloseBtn) bpProfileCloseBtn.addEventListener('click', closeBlueprintProfile);
    if (bpProfileModal) {
        bpProfileModal.addEventListener('click', function(e) {
            if (e.target === this) closeBlueprintProfile();
        });
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const m = document.getElementById('blueprintProfileModal');
            if (m && m.classList.contains('active')) closeBlueprintProfile();
        }
    });

    // Initial country banner state
    updateCountryBanner();

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            headerUserEmail.textContent = user.email || 'user@example.com';
            await loadUserAndPackage();
            renderHistorySidebar();
        } else {
            showToast('Please log in to continue.', 'error');
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        }
    });

    if (auth.currentUser) {
        currentUser = auth.currentUser;
        headerUserEmail.textContent = auth.currentUser.email || 'user@example.com';
        await loadUserAndPackage();
        renderHistorySidebar();
    }
});
</script>
