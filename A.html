<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Zone21 | Event Blueprint Generator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --navy: #1A2A3A;
    --navy-light: #2C3E50;
    --slate: #4A6A7F;
    --mint: #6B9F9F;
    --mint-light: #B5D4D4;
    --mint-soft: rgba(107, 159, 159, 0.10);
    --coral: #D4856B;
    --coral-soft: rgba(212, 133, 107, 0.08);
    --grey: #E8EDF0;
    --grey-light: #F5F7F9;
    --text-primary: #1A2A3A;
    --text-secondary: #4A6A7F;
    --text-muted: #7A9BAE;
    --bg-page: #F0F3F5;
    --bg-surface: #FFFFFF;
    --bg-input: #F5F7F9;
    --border-light: #E8EDF0;
    --border-strong: #D5DDE3;
    --shadow-sm: 0 1px 3px rgba(26, 42, 58, 0.06);
    --shadow-md: 0 4px 16px rgba(26, 42, 58, 0.08);
    --shadow-lg: 0 8px 32px rgba(26, 42, 58, 0.10);
    --shadow-xl: 0 16px 48px rgba(26, 42, 58, 0.14);
    --radius: 10px;
    --radius-xl: 18px;
    --radius-full: 9999px;
    font-size: 15px;
}

html, body {
    height: 100%; height: -webkit-fill-available;
    overflow: hidden; margin: 0; padding: 0;
    background: var(--bg-page);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text-primary); font-size: 0.95rem; line-height: 1.55;
}

.app { display: flex; height: 100dvh; width: 100vw; overflow: hidden; background: var(--bg-page); }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--mint); border-radius: 5px; }

.sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(26, 42, 58, 0.4); z-index: 999; opacity: 0; transition: opacity 0.3s ease; }
.sidebar-overlay.active { display: block; opacity: 1; }

.sidebar { width: 280px; min-width: 280px; background: var(--navy); color: white; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; height: 100dvh; z-index: 1000; transition: transform 0.3s ease; }

.sidebar-header { padding: 18px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.sidebar-header h2 { font-size: 0.85rem; font-weight: 600; color: var(--mint-light); letter-spacing: 0.3px; display: flex; align-items: center; gap: 8px; }
.sidebar-header h2 i { color: var(--mint-light); font-size: 0.9rem; }
.sidebar-header .badge { font-size: 0.6rem; background: var(--mint); color: white; padding: 3px 10px; border-radius: 20px; font-weight: 600; text-transform: uppercase; }

.sidebar-body { flex: 1; overflow-y: auto; padding: 14px 16px; }

.new-chat-btn { width: 100%; padding: 10px; background: var(--mint); color: white; border: none; border-radius: var(--radius); font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
.new-chat-btn:hover { background: #5A8A8A; transform: translateY(-1px); }

.history-item { padding: 8px 12px; background: rgba(255, 255, 255, 0.03); border-radius: var(--radius); margin-bottom: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; transition: 0.2s; border-left: 2px solid transparent; }
.history-item:hover { background: rgba(255, 255, 255, 0.06); }
.history-item.active { border-left-color: var(--mint-light); background: rgba(255, 255, 255, 0.05); }
.history-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(255, 255, 255, 0.8); font-weight: 400; }
.history-item .title i { color: var(--mint-light); margin-right: 8px; font-size: 0.75rem; }
.history-item .delete-btn { color: rgba(255, 255, 255, 0.2); padding: 2px 6px; border-radius: 4px; transition: 0.2s; cursor: pointer; background: none; border: none; font-size: 0.75rem; }
.history-item .delete-btn:hover { color: var(--coral); background: rgba(212, 133, 107, 0.12); }

.sidebar-footer { padding: 10px 20px; border-top: 1px solid rgba(255, 255, 255, 0.04); font-size: 0.65rem; color: rgba(255, 255, 255, 0.25); text-align: center; flex-shrink: 0; }

.workspace { flex: 1; background: var(--bg-page); display: flex; flex-direction: column; overflow: hidden; min-width: 0; height: 100dvh; }

.workspace-header { background: var(--navy); color: white; padding: 10px 20px; display: flex; align-items: center; gap: 14px; border-bottom: 2px solid var(--mint); flex-shrink: 0; flex-wrap: wrap; }
.workspace-header .menu-btn { display: none; background: transparent; border: none; color: white; font-size: 1.3rem; cursor: pointer; padding: 2px 4px; }
.workspace-header .brand h1 { font-size: 0.95rem; color: var(--mint-light); margin: 0; font-weight: 600; letter-spacing: -0.2px; }
.workspace-header .brand p { font-size: 0.6rem; color: rgba(255, 255, 255, 0.3); margin: 0; }
.workspace-header .right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.workspace-header .package-tag { background: var(--mint); color: white; padding: 3px 12px; border-radius: 20px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }
.workspace-header .user-email { font-size: 0.65rem; color: rgba(255, 255, 255, 0.35); max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.workspace-header .logout-btn { background: transparent; border: 1px solid rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.4); padding: 3px 12px; border-radius: 20px; font-size: 0.65rem; cursor: pointer; transition: 0.2s; }
.workspace-header .logout-btn:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--coral); color: white; }

.workspace-content { flex: 1; overflow-y: auto; padding: 16px 20px 20px 20px; background: var(--bg-page); overflow-x: hidden; }

.package-banner { background: var(--navy); color: white; padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.package-banner .pkg-label { font-size: 0.6rem; color: rgba(255, 255, 255, 0.35); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
.package-banner .pkg-name { font-size: 0.9rem; font-weight: 600; color: var(--mint-light); }
.package-banner .pkg-limit { font-size: 0.65rem; background: rgba(255, 255, 255, 0.05); padding: 3px 12px; border-radius: 20px; color: rgba(255, 255, 255, 0.6); }
.package-banner .pkg-limit span { color: var(--mint-light); font-weight: 600; }
.package-banner .pkg-action { background: var(--mint); color: white; border: none; padding: 5px 14px; border-radius: 20px; font-weight: 600; font-size: 0.65rem; cursor: pointer; transition: 0.2s; text-decoration: none; }
.package-banner .pkg-action:hover { background: #5A8A8A; }

.country-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 14px; font-size: 0.85rem; font-weight: 600; border: 1px solid; }
.country-banner.detected { background: var(--mint-soft); border-color: var(--mint-light); color: var(--navy); }
.country-banner.unknown { background: var(--coral-soft); border-color: var(--coral); color: var(--coral); }
.country-banner i { font-size: 1.1rem; flex-shrink: 0; }
.country-banner .flag { font-size: 1.2rem; }

.form-section { background: white; padding: 18px 20px; border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }

.input-group { display: flex; flex-direction: column; gap: 3px; }
.input-group label { font-weight: 600; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; color: var(--text-secondary); letter-spacing: 0.2px; }
.input-group .hint { font-size: 0.65rem; color: var(--text-muted); font-weight: 400; }
.input-group input, .input-group select, .input-group textarea { padding: 9px 12px; border: 1px solid var(--border-light); border-radius: 6px; outline: none; transition: 0.3s; font-size: 0.9rem; background: var(--bg-input); width: 100%; color: var(--text-primary); font-family: 'Inter', sans-serif; }
.input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--mint); background: white; box-shadow: 0 0 0 2px var(--mint-soft); }
.input-group textarea { resize: vertical; min-height: 50px; }

.limit-badge { display: inline-block; font-size: 0.6rem; background: var(--mint-soft); color: var(--mint); padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-left: 4px; border: 1px solid var(--mint-light); }

.services-wrapper { margin-top: 12px; }
.services-wrapper>label { font-weight: 600; font-size: 0.85rem; display: block; border-bottom: 1px solid var(--border-light); padding-bottom: 4px; margin-bottom: 8px; color: var(--text-secondary); }
.services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 5px; }
.service-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; background: var(--bg-input); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border-light); cursor: pointer; transition: 0.2s; color: var(--text-secondary); }
.service-item:hover { background: white; border-color: var(--mint); }
.service-item input[type="checkbox"] { accent-color: var(--coral); width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
.service-item .zone21-badge { background: var(--mint); color: white; padding: 0 6px; border-radius: 8px; font-size: 0.5rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2px; margin-left: auto; }

.submit-btn { width: 100%; padding: 11px; background: var(--navy); color: white; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.submit-btn:hover { background: var(--navy-light); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.submit-btn:disabled { background: var(--grey); color: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none; }

#loading { display: none; text-align: center; padding: 40px 20px; background: white; border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); }
#loading .spinner { border: 3px solid var(--grey); width: 36px; height: 36px; border-radius: 50%; border-top-color: var(--mint); animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading h3 { color: var(--text-primary); font-size: 0.95rem; font-weight: 600; }
#loading p { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px; }

#blueprint-container { display: none; }
.blueprint-wrapper { animation: fadeUp 0.35s ease forwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.blueprint-result { background: white; padding: 22px 24px; border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); line-height: 1.65; color: var(--text-primary); width: 100%; max-width: 100%; font-size: 0.95rem; overflow-x: hidden; overflow-y: visible; word-wrap: break-word; word-break: break-word; position: relative; }
.blueprint-result *, .blueprint-result *::before, .blueprint-result *::after { max-width: 100%; word-break: break-word; box-sizing: border-box; }

.blueprint-result table { width: 100%; border-collapse: collapse; margin: 10px 0 16px; font-size: 0.85rem; border-radius: var(--radius); overflow: hidden; background: white; box-shadow: var(--shadow-sm); display: table; table-layout: auto; min-width: 0; max-width: 100%; }
.blueprint-result table th { background: var(--navy); color: white; padding: 8px 12px; text-align: left; font-weight: 600; white-space: nowrap; font-size: 0.8rem; }
.blueprint-result table td { padding: 7px 12px; border-bottom: 1px solid var(--border-light); color: var(--text-secondary); max-width: 300px; overflow-wrap: break-word; font-size: 0.85rem; }
.blueprint-result table tr:nth-child(even) td { background: var(--grey-light); }
.blueprint-result table tr:last-child td { border-bottom: none; }

.table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 10px 0 16px; border-radius: var(--radius); border: 1px solid var(--border-light); max-width: 100%; }
.table-responsive table { margin: 0; border-radius: 0; border: none; box-shadow: none; min-width: 0; width: 100%; }

.blueprint-result h1 { color: var(--navy); font-size: 1.35rem; border-bottom: 2px solid var(--mint-light); padding-bottom: 8px; margin-bottom: 16px; text-align: left; font-weight: 700; max-width: 100%; overflow-wrap: break-word; line-height: 1.3; }
.blueprint-result h2 { color: var(--navy); font-size: 1.1rem; border-bottom: 1px solid var(--mint-light); padding-bottom: 5px; margin-top: 22px; margin-bottom: 10px; font-weight: 600; clear: both; max-width: 100%; overflow-wrap: break-word; line-height: 1.3; }
.blueprint-result h2:first-child { margin-top: 0; }
.blueprint-result h3 { color: var(--coral); font-size: 0.95rem; margin-top: 16px; margin-bottom: 6px; font-weight: 600; max-width: 100%; overflow-wrap: break-word; line-height: 1.3; }
.blueprint-result h4 { color: var(--navy); font-size: 0.9rem; margin-top: 12px; margin-bottom: 4px; font-weight: 600; max-width: 100%; overflow-wrap: break-word; line-height: 1.3; }
.blueprint-result ul, .blueprint-result ol { list-style-position: inside; padding-left: 4px; margin-bottom: 12px; max-width: 100%; }
.blueprint-result ul { list-style: none; padding-left: 0; }
.blueprint-result li { margin-bottom: 5px; font-size: 0.9rem; padding-left: 18px; position: relative; color: var(--text-secondary); max-width: 100%; overflow-wrap: break-word; line-height: 1.5; }
.blueprint-result li:before { content: "▸"; color: var(--mint); position: absolute; left: 2px; font-weight: 700; font-size: 0.75rem; }
.blueprint-result p { margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary); max-width: 100%; overflow-wrap: break-word; line-height: 1.6; }
.blueprint-result hr { border: none; border-top: 1px dashed var(--border-light); margin: 16px 0; max-width: 100%; }
.blueprint-result strong { color: var(--text-primary); font-weight: 600; }
.blueprint-result em { color: var(--text-secondary); font-style: italic; }

.budget-success { background: var(--mint-soft); border-left: 3px solid var(--mint); padding: 12px 16px; border-radius: var(--radius); margin-bottom: 14px; max-width: 100%; overflow-wrap: break-word; }
.budget-neutral { background: rgba(74, 106, 127, 0.06); border-left: 3px solid var(--slate); padding: 12px 16px; border-radius: var(--radius); margin-bottom: 14px; max-width: 100%; overflow-wrap: break-word; }
.budget-warning { background: var(--coral-soft); border-left: 3px solid var(--coral); padding: 12px 16px; border-radius: var(--radius); margin-bottom: 14px; max-width: 100%; overflow-wrap: break-word; }

.vendor-card { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 12px 16px; margin: 8px 0; transition: 0.2s; border-left: 3px solid var(--mint); box-shadow: var(--shadow-sm); max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
.vendor-card:hover { border-color: var(--mint); box-shadow: var(--shadow-md); }
.vendor-card .vendor-name { font-weight: 600; color: var(--navy); font-size: 0.9rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; max-width: 100%; }
.vendor-card .vendor-name .type-badge { font-size: 0.55rem; font-weight: 600; padding: 2px 8px; border-radius: 12px; background: var(--mint-soft); color: var(--mint); letter-spacing: 0.02em; text-transform: uppercase; border: 1px solid var(--mint-light); flex-shrink: 0; }
.vendor-card .vendor-name .type-badge.venue { background: var(--coral-soft); color: var(--coral); border-color: var(--coral); }
.vendor-card .vendor-detail { font-size: 0.85rem; color: var(--text-secondary); margin: 3px 0; max-width: 100%; overflow-wrap: break-word; }
.vendor-card .vendor-detail i { width: 16px; color: var(--slate); flex-shrink: 0; font-size: 0.7rem; }
.vendor-card .reasoning-badge { display: inline-block; background: var(--mint-soft); color: var(--mint); padding: 2px 8px; border-radius: 10px; font-size: 0.6rem; font-weight: 500; margin: 2px 2px 2px 0; border: 1px solid var(--mint-light); max-width: 100%; overflow-wrap: break-word; }
.vendor-card .reasoning-badge.warning { background: var(--coral-soft); color: var(--coral); border-color: var(--coral); }
.vendor-card .reasoning-badge.info { background: rgba(74, 106, 127, 0.08); color: var(--slate); border-color: var(--border-strong); }
.vendor-card .reasoning-badge.success { background: var(--mint-soft); color: var(--mint); border-color: var(--mint-light); }
.vendor-card .vendor-actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.vendor-card .contact-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 20px; font-weight: 500; font-size: 0.75rem; text-decoration: none; transition: 0.2s; border: 1px solid var(--border-light); cursor: pointer; color: var(--text-secondary); background: white; flex-shrink: 0; }
.vendor-card .contact-btn:hover { transform: translateY(-1px); color: white; }
.vendor-card .contact-btn i { font-size: 0.75rem; }
.vendor-card .contact-btn.primary { color: var(--navy); border-color: var(--navy-light); }
.vendor-card .contact-btn.primary:hover { background: var(--navy); border-color: var(--navy); }
.vendor-card .contact-btn.whatsapp { color: #128C7E; border-color: #25D366; }
.vendor-card .contact-btn.whatsapp:hover { background: #25D366; border-color: #25D366; }
.vendor-card .contact-btn.email { color: #B23121; border-color: #D44638; }
.vendor-card .contact-btn.email:hover { background: #D44638; border-color: #D44638; }
.vendor-card .contact-btn.profile { color: var(--mint); border-color: var(--mint); }
.vendor-card .contact-btn.profile:hover { background: var(--mint); border-color: var(--mint); color: white; }

.vendor-card .reasoning-badge.exclusive { background: linear-gradient(135deg, rgba(212,133,107,0.18), rgba(212,133,107,0.08)); color: var(--coral); border-color: rgba(212,133,107,0.45); font-weight: 800; }
.vendor-card .vendor-name .type-badge.zone21 { background: linear-gradient(135deg, var(--coral), #c0132b); color: #fff; border-color: rgba(212,133,107,0.6); }
.service-slot.zone21-exclusive { border-color: rgba(212,133,107,0.35); box-shadow: 0 4px 20px rgba(212,133,107,0.12); }

.country-empty-state { background: linear-gradient(135deg, rgba(212,133,107,0.08), rgba(212,133,107,0.02)); border: 1px dashed rgba(212,133,107,0.45); border-radius: var(--radius); padding: 16px 18px; margin: 10px 0; text-align: left; }
.country-empty-state .ces-title { color: var(--coral); font-weight: 700; font-size: 0.92rem; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.country-empty-state .ces-text { color: var(--text-secondary); font-size: 0.82rem; line-height: 1.55; }
.country-empty-state .ces-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

.contact-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 20px; font-weight: 500; font-size: 0.75rem; text-decoration: none; transition: 0.2s; border: 1px solid var(--border-light); cursor: pointer; color: var(--text-secondary); background: white; flex-shrink: 0; }
.contact-btn:hover { transform: translateY(-1px); color: white; }
.contact-btn i { font-size: 0.75rem; }
.contact-btn.primary { color: var(--navy); border-color: var(--navy-light); }
.contact-btn.primary:hover { background: var(--navy); border-color: var(--navy); }
.contact-btn.whatsapp { color: #128C7E; border-color: #25D366; }
.contact-btn.whatsapp:hover { background: #25D366; border-color: #25D366; }
.contact-btn.email { color: #B23121; border-color: #D44638; }
.contact-btn.email:hover { background: #D44638; border-color: #D44638; }
.contact-btn.profile { color: var(--mint); border-color: var(--mint); }
.contact-btn.profile:hover { background: var(--mint); border-color: var(--mint); color: white; }

.external-source-card { background: var(--grey-light); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 12px 16px; margin: 8px 0; border-left: 3px solid var(--slate); max-width: 100%; overflow-wrap: break-word; }
.external-source-card .source-text { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.55; margin-bottom: 6px; max-width: 100%; overflow-wrap: break-word; }
.external-source-card .source-text strong { color: var(--navy); }
.external-source-card .zone21-contact { background: var(--navy); color: white; padding: 10px 16px; border-radius: var(--radius); display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 6px; font-size: 0.8rem; max-width: 100%; }
.external-source-card .zone21-contact a { color: var(--mint-light); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; flex-wrap: wrap; }
.external-source-card .zone21-contact a:hover { color: white; text-decoration: underline; }
.external-source-card .zone21-contact i { font-size: 0.8rem; flex-shrink: 0; }
.external-source-card.zone21-planning { border-left-color: var(--mint); background: var(--mint-soft); }
.external-source-card.zone21-planning .source-text { color: var(--text-primary); }

    // ============================================================
//  STRICT COUNTRY DETECTION ENGINE
//  - Resolves any location string to exactly one country key
//  - No fuzzy guesses, no fallbacks across borders
// ============================================================
function normalizeLocation(str) {
    if (!str) return '';
    return String(str)
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^\w\s,]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
}

function escapeRegex(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function detectCountryFromLocation(locationStr) {
    const norm = normalizeLocation(locationStr);
    if (!norm) return null;

    // PASS 1 — Explicit country name / alias (highest priority)
    for (const [key, meta] of Object.entries(COUNTRY_DB)) {
        for (const alias of meta.aliases) {
            const a = normalizeLocation(alias);
            if (!a) continue;
            const re = new RegExp(`(^|[\\s,])${escapeRegex(a)}($|[\\s,])`, 'i');
            if (re.test(norm)) return key;
        }
    }

    // PASS 2 — City names (word boundary, longest-first to avoid partial hits)
    const allCities = [];
    for (const [key, meta] of Object.entries(COUNTRY_DB)) {
        for (const city of meta.cities) {
            const c = normalizeLocation(city);
            if (c) allCities.push({ key, city: c });
        }
    }
    allCities.sort((a, b) => b.city.length - a.city.length);
    for (const { key, city } of allCities) {
        const re = new RegExp(`(^|[\\s,])${escapeRegex(city)}($|[\\s,])`, 'i');
        if (re.test(norm)) return key;
    }

    // PASS 3 — Region / province names
    for (const [key, meta] of Object.entries(COUNTRY_DB)) {
        for (const region of meta.regions) {
            const r = normalizeLocation(region);
            if (!r) continue;
            const re = new RegExp(`(^|[\\s,])${escapeRegex(r)}($|[\\s,])`, 'i');
            if (re.test(norm)) return key;
        }
    }

    return null;
}

/**
 * Detect a vendor's home country from its Firestore document.
 * Only location-ish fields are used — never the name, to avoid
 * a "Zimbabwe Wedding Planners" SA-based vendor being misfiled.
 */
function detectVendorCountry(vendor) {
    if (!vendor) return null;
    const candidates = [
        vendor.location,
        vendor.venueLocation,
        vendor.address,
        vendor.city && vendor.country ? `${vendor.city}, ${vendor.country}` : '',
        vendor.city,
        vendor.country,
        vendor.region
    ];
    for (const c of candidates) {
        if (!c) continue;
        const detected = detectCountryFromLocation(c);
        if (detected) return detected;
    }
    return null; // Unknown — will be excluded from all country-filtered results
}

function getCountryMeta(key) {
    if (!key) return null;
    return COUNTRY_DB[key] || null;
}

// ============================================================
//  COUNTRY BANNER (Live feedback as user types)
// ============================================================
function updateCountryBanner() {
    const banner = document.getElementById('country-detection-banner');
    const flagEl = document.getElementById('country-flag');
    const textEl = document.getElementById('country-detection-text');
    if (!banner || !flagEl || !textEl) return;

    const loc = (eventLocation && eventLocation.value) || '';
    if (!loc.trim()) {
        banner.className = 'country-banner detected';
        banner.style.display = 'flex';
        flagEl.textContent = '🌍';
        textEl.textContent = 'Type your city & country — we match vendors strictly within your country only.';
        return;
    }

    const key = detectCountryFromLocation(loc);
    if (key) {
        const meta = getCountryMeta(key);
        banner.className = 'country-banner detected';
        banner.style.display = 'flex';
        flagEl.textContent = meta.flag;
        textEl.innerHTML = `Location locked to <strong>${meta.display}</strong> — vendors outside ${meta.display} will not be shown.`;
    } else {
        banner.className = 'country-banner unknown';
        banner.style.display = 'flex';
        flagEl.textContent = '❓';
        textEl.innerHTML = `Country not recognised. Please include the country name (e.g. <strong>Johannesburg, South Africa</strong>).`;
    }
}

function showToast(msg, type = 'info') {
    const c = document.getElementById('toast-container');

    const t = document.createElement('div');
    t.className = `toast ${type}`;
    const icons = { success: 'fa-circle-check', error: 'fa-circle-exclamation', info: 'fa-circle-info' };
    t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${msg}`;
    c.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

// ============================================================

function toArray(v) {
    if (!v) return [];
    if (Array.isArray(v)) return v.filter(Boolean).map(x => String(x).toLowerCase().trim());
    if (typeof v === 'string') return v.split(/[,;\n|]+/).map(s => s.trim().toLowerCase()).filter(Boolean);
    return [];
}

function buildProviderSearchText(p) {
    const parts = [
        p.name, p.businessName, p.companyName, p.displayName, p.username, p.ownerName, p.fullName,
        p.category, p.serviceType, p.description, p.bio, p.about, p.tagline, p.secondaryServices
    ].filter(Boolean).map(x => String(x));
    parts.push(...toArray(p.services));
    parts.push(...toArray(p.amenities));
    return parts.join('  ').toLowerCase();
}

function buildVenueSearchText(v) {
    const parts = [
        v.name, v.businessName, v.companyName, v.displayName,
        v.venueType, v.description, v.bio, v.about
    ].filter(Boolean).map(x => String(x));
    parts.push(...toArray(v.services));
    parts.push(...toArray(v.amenities));
    return parts.join('  ').toLowerCase();
}

function scoreProviderForService(p, service) {
    const serviceLower = service.toLowerCase();
    const providerServices = toArray(p.services);
    const matches = [];

    if (providerServices.includes(serviceLower)) {
        return { score: 100, matches: [service], direct: true };
    }
    const keywords = SERVICE_KEYWORDS[service] || [serviceLower];
    const text = buildProviderSearchText(p);
    if (!text) return { score: 0, matches: [] };

    let score = 0;
    const seen = new Set();
    keywords.forEach(kw => {
        const k = String(kw).toLowerCase().trim();
        if (!k || seen.has(k)) return;
        seen.add(k);
        if (text.includes(k)) {
            const weight = k.length >= 8 ? 5 : k.length >= 5 ? 3 : 2;
            score += weight;
            matches.push(kw);
        }
    });
    if (text.includes(serviceLower)) score += 8;
    return { score, matches, direct: false };
}

function isExclusiveService(service) {
    return service === 'Zone21 Security - EXCLUSIVE' || service === 'Event Planner / Coordinator';
}

function isZone21Account(p) {
    const name = String(p.name || p.businessName || p.companyName || p.displayName || p.username || '').toLowerCase();
    return /zone\s*21|z-?21/.test(name);
}

function classifyZone21Account(p) {
    const name = String(p.name || p.businessName || p.companyName || p.displayName || p.username || '').toLowerCase();
    const cat = String(p.category || p.serviceType || '').toLowerCase();
    const desc = String(p.description || p.bio || '').toLowerCase();
    const sec = String(p.secondaryServices || '').toLowerCase();
    const servicesText = toArray(p.services).join(' ');
    const blob = [name, cat, desc, sec, servicesText].join(' ');

    const isSecurity = /security|guard|bouncer|protection|bodyguard/.test(blob);
    const isPlanner  = /planner|planning|coordinator|coordination|event management|event manager/.test(blob);

    if (isSecurity && !isPlanner) return 'Zone21 Security - EXCLUSIVE';
    if (isPlanner && !isSecurity) return 'Event Planner / Coordinator';
    if (isSecurity && isPlanner) {
        if (/security|guard/.test(name)) return 'Zone21 Security - EXCLUSIVE';
        if (/planner|planning|coordinator|event/.test(name)) return 'Event Planner / Coordinator';
        return 'Zone21 Security - EXCLUSIVE';
    }
    return null;
}

function isThirdPartySecurity(p) {
    if (isZone21Account(p)) return false;
    const core = [p.name, p.businessName, p.companyName, p.displayName, p.username, p.category, p.serviceType]
        .filter(Boolean).join(' ').toLowerCase();
    return /\bsecurity\b|\bguard\b|\bbouncer\b|\bprotection\b|\bbodyguard\b/.test(core);
}

function isThirdPartyPlanner(p) {
    if (isZone21Account(p)) return false;
    const core = [p.name, p.businessName, p.companyName, p.displayName, p.username, p.category, p.serviceType]
        .filter(Boolean).join(' ').toLowerCase();
    return /\bevent planner\b|\bevent planning\b|\bplanner\b|\bcoordinator\b|\bevent management\b|\bevent manager\b/.test(core);
}

function cleanVendorField(value, maxLen) {
    if (value == null) return '';
    maxLen = maxLen || 100;
    let s = String(value);
    s = s.replace(/<[^>]*>/g, ' ');
    s = s.replace(/\s+/g, ' ').trim();
    if (s.length > maxLen) s = s.slice(0, maxLen).trim() + '…';
    return s;
}
function safePrice(v) {
    const n = Number(v);
    if (!isFinite(n) || n <= 0) return 'Pricing TBD';
    return '$' + n.toLocaleString();
}
function safeServicesList(v, limit) {
    limit = limit || 3;
    if (!v) return '';
    let arr = Array.isArray(v) ? v : String(v).split(/[,;\n|]+/);
    arr = arr.map(s => String(s).replace(/<[^>]*>/g, '').trim()).filter(Boolean);
    if (arr.length === 0) return '';
    const shown = arr.slice(0, limit).join(', ');
    return arr.length > limit ? shown + ' +' + (arr.length - limit) : shown;
}

function findProviderById(id) {
    if (!id) return null;
    return cachedProviders.find(p => (p.uid || p.id) === id) ||
           cachedVenues.find(v => (v.uid || v.id) === id) ||
           cachedProviders.find(p => p.id === id) ||
           cachedVenues.find(v => v.id === id) || null;
}

function getProviderUid(p) {
    if (!p) return '';
    return p.uid || p.id || '';
}

function resolveVendorCollection(uid) {
    if (!uid) return null;
    if (cachedVenues.some(v => (v.uid || v.id) === uid)) return 'venues';
    if (cachedProviders.some(p => (p.uid || p.id) === uid)) return 'serviceProviders';
    return null;
}

function pickVenueTargetService(requiredServices) {
    return requiredServices.includes("Venue / Space Rental") ? "Venue / Space Rental" : null;
}

function makeSessionId() {
    return 'evt_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
}

function getChatId(uid1, uid2) {
    return [uid1, uid2].sort().join('_');
}

function isProviderAvailable(provider, dateStr) {
    if (!dateStr) return true;
    const unavailable = provider.unavailableDates || provider.blackoutDates || [];
    if (Array.isArray(unavailable) && unavailable.includes(dateStr)) return false;
    const confirmed = provider.confirmedDates || [];
    if (Array.isArray(confirmed) && confirmed.includes(dateStr)) return false;
    return true;
}

// ============================================================
//  ⭐ STRICT COUNTRY-SCOPED VENDOR SCOPING
//  Every match is filtered against a single resolved country.
//  Vendors whose location can't be resolved are EXCLUDED.
//  Zero cross-border results guaranteed.
// ============================================================
function getScopedVendors(targetCountryKey) {
    if (!targetCountryKey) {
        return { venues: [], providers: [], meta: null, unknownCount: 0 };
    }
    const meta = getCountryMeta(targetCountryKey);

    const scopedVenues = cachedVenues.filter(v => detectVendorCountry(v) === targetCountryKey);
    const scopedProviders = cachedProviders.filter(p => detectVendorCountry(p) === targetCountryKey);

    return { venues: scopedVenues, providers: scopedProviders, meta, unknownCount: 0 };
}

// ============================================================
//  VENUE MATCHING (STRICT COUNTRY)
// ============================================================
function matchVenues(location, attendees, budget, requiredServices) {
    const targetCountry = detectCountryFromLocation(location);

    // If we can't resolve a country, do NOT return anything
    if (!targetCountry) return [];

    const { venues } = getScopedVendors(targetCountry);
    if (!venues.length) return [];

    const locationLower = (location || '').toLowerCase().trim();
    const cityTerms = locationLower.split(/[,\s]+/).filter(t => t.length > 2);

    const scored = venues.map(v => {
        const capacity = Number(v.capacity) || 0;
        const price = Number(v.basePrice) || 0;
        const vLoc = (v.location || '').toLowerCase();

        const isNearby = cityTerms.some(t => vLoc.includes(t));

        const reasoning = [];
        let fitScore = 0;

        const vText = buildVenueSearchText(v);
        const venueSignals = ['venue','hall','space','banquet','premises','function room','garden','marquee','conference','event space'];
        const venueHits = venueSignals.filter(s => vText.includes(s)).length;
        if (venueHits > 0) { fitScore += 4 + venueHits; reasoning.push('🏛️ Confirmed venue'); }
        else return null;

        if (capacity > 0) {
            if (capacity >= attendees) { reasoning.push('✅ Capacity fits'); fitScore += 3; }
            else { reasoning.push('⚠️ Capacity may be limited'); fitScore -= 2; }
        } else reasoning.push('ℹ️ Capacity TBD');

        if (price > 0 && budget > 0) {
            const pct = (price / budget) * 100;
            if (pct <= 30) { reasoning.push('💰 Great value'); fitScore += 3; }
            else if (pct <= 50) { reasoning.push('💰 Reasonable'); fitScore += 2; }
            else if (pct <= 70) { reasoning.push('💰 Within budget'); fitScore += 1; }
            else reasoning.push('⚠️ Above budget');
        } else reasoning.push('ℹ️ Price TBD');

        if (isNearby) { reasoning.push('📍 Nearby'); fitScore += 3; }

        return { ...v, fitScore, reasoning };
    }).filter(Boolean);

    scored.sort((a, b) => b.fitScore - a.fitScore);
    return scored.slice(0, 3);
}

// ============================================================
//  PROVIDER MATCHING BY SERVICE (STRICT COUNTRY)
// ============================================================
function matchProvidersByService(location, services, budget, dateStr) {
    const targetCountry = detectCountryFromLocation(location);
    const out = {};

    // Nothing to match if country is unknown
    if (!targetCountry) {
        services.forEach(s => out[s] = []);
        return out;
    }

    const { providers } = getScopedVendors(targetCountry);
    const locationLower = (location || '').toLowerCase().trim();
    const cityTerms = locationLower.split(/[,\s]+/).filter(t => t.length > 2);

    const zone21Map = new Map();
    providers.forEach(p => {
        if (isZone21Account(p)) {
            const slot = classifyZone21Account(p);
            if (slot) zone21Map.set(p.id, slot);
        }
    });

    services.forEach(service => {
        if (service === 'Venue / Space Rental') { out[service] = []; return; }

        if (isExclusiveService(service)) {
            const matches = providers.filter(p => zone21Map.get(p.id) === service);
            const scored = matches.map(p => {
                const price = Number(p.basePrice) || 0;
                const rating = Number(p.rating) || 0;
                const available = isProviderAvailable(p, dateStr);
                const tag = service === 'Zone21 Security - EXCLUSIVE'
                    ? '🛡️ Zone21 Official Security'
                    : '🎯 Zone21 Official Event Planning';
                const reasoning = [tag];
                let fitScore = 50;

                if (price > 0 && budget > 0) {
                    const pct = (price / budget) * 100;
                    if (pct <= 20) { reasoning.push('💰 Competitive'); fitScore += 3; }
                    else if (pct <= 40) { reasoning.push('💰 Reasonable'); fitScore += 2; }
                }
                if (rating >= 4) { reasoning.push('⭐ Highly rated'); fitScore += 2; }
                if (available) { reasoning.push('📅 Available'); fitScore += 2; }
                else { reasoning.push('⚠️ Date clash'); fitScore -= 5; }

                return { ...p, fitScore, reasoning };
            });
            scored.sort((a, b) => b.fitScore - a.fitScore);
            out[service] = scored.slice(0, 3);
            return;
        }

        const scored = providers.map(p => {
            if (zone21Map.has(p.id)) return null;
            if (isThirdPartySecurity(p) || isThirdPartyPlanner(p)) return null;

            const { score, matches, direct } = scoreProviderForService(p, service);
            if (score <= 0) return null;

            const price = Number(p.basePrice) || 0;
            const rating = Number(p.rating) || 0;
            const pLoc = (p.location || '').toLowerCase();

            const isNearby = cityTerms.some(t => pLoc.includes(t));
            const available = isProviderAvailable(p, dateStr);

            const reasoning = [];
            let fitScore = score;

            if (direct) reasoning.push('✅ Listed service');
            else reasoning.push('✅ Service match');
            if (matches.length > 1 && !direct) {
                reasoning.push(`🎯 ${matches.length} keyword hits`);
                fitScore += Math.min(matches.length, 3);
            }

            if (price > 0 && budget > 0) {
                const pct = (price / budget) * 100;
                if (pct <= 20) { reasoning.push('💰 Competitive'); fitScore += 3; }
                else if (pct <= 40) { reasoning.push('💰 Reasonable'); fitScore += 2; }
                else if (pct <= 70) { reasoning.push('💰 Within budget'); fitScore += 1; }
                else reasoning.push('⚠️ Above budget');
            } else reasoning.push('ℹ️ Price TBD');

            if (rating >= 4.5) { reasoning.push('⭐ Top rated'); fitScore += 3; }
            else if (rating >= 4) { reasoning.push('⭐ Highly rated'); fitScore += 2; }
            else if (rating >= 3) { reasoning.push('⭐ Good rating'); fitScore += 1; }

            if (isNearby) { reasoning.push('📍 Nearby'); fitScore += 3; }

            if (available) { reasoning.push('📅 Available'); fitScore += 2; }
            else { reasoning.push('⚠️ Date clash'); fitScore -= 5; }

            return { ...p, fitScore, reasoning };
        }).filter(Boolean);

        scored.sort((a, b) => b.fitScore - a.fitScore);
        out[service] = scored.slice(0, 3);
    });

    return out;
}

function escapeHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) { return escapeHtml(s); }

function generateVenueHTML(vendors, venueTargetService, countryKey) {
    if (!countryKey) {

    if (!vendors || vendors.length === 0) {
        return countryEmptyStateHTML(countryKey, 'venues');
    }
    let html = `<div style="margin:8px 0;">`;
    if (venueTargetService) {
        html += `<p style="font-size:0.8rem;color:var(--text-secondary);margin:4px 0 8px;">Tick <strong>Include</strong> on any venue below to invite it as your <strong>${escapeHtml(venueTargetService)}</strong> provider.</p>`;
    }
    vendors.forEach((v, index) => {
        const providerUid = getProviderUid(v);
        const name = cleanVendorField(v.name || v.businessName, 60) || 'Unnamed';
        const location = cleanVendorField(v.location, 60) || 'Location TBD';
        const price = safePrice(v.basePrice);
        const capacity = v.capacity ? `${cleanVendorField(v.capacity, 20)} guests` : 'Capacity TBD';
        const rating = v.rating ? Number(v.rating).toFixed(1) : 'N/A';
        const servicesList = safeServicesList(v.services || v.amenities, 3);
        const reasoning = v.reasoning || ['Available for your event'];
        const borderColor = v.fitScore >= 4 ? 'var(--mint)' : v.fitScore >= 2 ? 'var(--slate)' : 'var(--coral)';
        const canInclude = !!venueTargetService && !!providerUid;

        html += `
            <div class="vendor-card" data-provider-id="${escapeAttr(providerUid)}" data-service="${escapeAttr(venueTargetService || '')}" data-venue-card="1" style="border-left-color:${borderColor};">
                <div class="vendor-name" style="justify-content:space-between;">
                    <span>${index + 1}. ${escapeHtml(name)} <span class="type-badge venue">Venue</span></span>
                    ${canInclude ? `
                        <label class="approve-checkbox" data-checkbox-wrapper="${escapeAttr(providerUid)}">
                            <input type="checkbox" data-approve-service="${escapeAttr(venueTargetService)}" data-approve-provider="${escapeAttr(providerUid)}" onchange="updateInviteButtonState()">
                            <span class="cb-label">Include</span>
                        </label>
                    ` : ''}
                </div>
                <div class="vendor-detail"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(location)}</div>
                <div class="vendor-detail"><i class="fas fa-users"></i> ${escapeHtml(capacity)}</div>
                <div class="vendor-detail"><i class="fas fa-tag"></i> ${escapeHtml(price)}</div>
                ${rating !== 'N/A' ? `<div class="vendor-detail"><i class="fas fa-star"></i> ${rating}/5</div>` : ''}
                ${servicesList ? `<div class="vendor-detail"><i class="fas fa-cog"></i> ${escapeHtml(servicesList)}</div>` : ''}
                <div style="margin:4px 0;">
                    ${reasoning.map(r => {
                        let cls = 'reasoning-badge';
                        if (r.includes('⚠️')) cls += ' warning';
                        else if (r.includes('✅')) cls += ' success';
                        else if (r.includes('ℹ️') || r.includes('📋')) cls += ' info';
                        return `<span class="${cls}">${escapeHtml(r)}</span>`;
                    }).join(' ')}
                </div>
                ${canInclude ? `
                    <div class="vendor-status-line">
                        <span class="vendor-status-badge not_sent" data-vendor-status="${escapeAttr(providerUid)}">Not yet invited</span>
                    </div>
                ` : ''}
                <div class="vendor-actions">
                    ${providerUid ? `<button class="contact-btn profile" onclick="openBlueprintVendorProfile('${escapeAttr(providerUid)}')"><i class="fas fa-user-circle"></i> View Profile</button>` : ''}
                    ${providerUid ? `<button class="contact-btn primary" onclick="openChatForVendor('${escapeAttr(providerUid)}')"><i class="fas fa-envelope"></i> Message</button>` : ''}
                    <button class="contact-btn whatsapp" onclick="openWhatsApp('${escapeAttr(providerUid)}')"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                </div>
            </div>`;
    });
    html += `</div>`;
    return html;
}

            const location = cleanVendorField(p.location, 60) || 'Location TBD';

                            else if (r.includes('⚠️')) cls += ' warning';

async function openChatForVendor(vendorId) {
    if (!currentUser) { showToast('Please sign in first', 'error'); return; }
    let vendor = findProviderById(vendorId);
    if (!vendor) { showToast('Vendor not found', 'error'); return; }

    const vendorUid = getProviderUid(vendor);
    chatOtherUid = vendorUid;
    chatOtherName = vendor.name || vendor.businessName || 'Vendor';
    chatOtherAvatar = vendor.avatar || null;
    chatThreadId = getChatId(currentUser.uid, vendorUid);

    document.getElementById('modalChatName').textContent = chatOtherName;
    document.getElementById('modalChatSub').textContent = vendor.category || vendor.serviceType || 'Service Provider';

    const avatarEl = document.getElementById('modalChatAvatar');
    const initialsEl = document.getElementById('modalChatInitials');
    const existingImg = avatarEl.querySelector('img');
    if (existingImg) existingImg.remove();

    const initials = chatOtherName.split(' ').map(w => w.charAt(0)).join('').substring(0, 2).toUpperCase() || '?';
    if (chatOtherAvatar) {
        initialsEl.style.display = 'none';
        const img = document.createElement('img');
        img.src = chatOtherAvatar; img.alt = chatOtherName;
        img.onerror = function() { this.style.display = 'none'; initialsEl.style.display = 'inline'; initialsEl.textContent = initials; };
        avatarEl.appendChild(img);
    } else {
        initialsEl.style.display = 'inline';
        initialsEl.textContent = initials;
    }

    document.getElementById('chatModal').classList.add('active');
    document.body.style.overflow = 'hidden';

    const msgContainer = document.getElementById('modalChatMessages');
    msgContainer.innerHTML = '<div class="empty-chat"><i class="fa-regular fa-comment-dots"></i><p>Loading conversation…</p></div>';

    await db.collection('threads').doc(chatThreadId).set({
        participants: [currentUser.uid, chatOtherUid],
        jobTitle: vendor.category || vendor.serviceType || 'Service Provider',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    subscribeToChatMessages(chatThreadId);
}

function subscribeToChatMessages(threadId) {
    if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
    const msgContainer = document.getElementById('modalChatMessages');
    chatUnsubscribe = db.collection(`threads/${threadId}/messages`).orderBy('timestamp', 'asc')
        .onSnapshot(snapshot => {
            if (snapshot.empty) {
                msgContainer.innerHTML = '<div class="empty-chat"><i class="fa-regular fa-comment-dots"></i><p>No messages yet.<br />Start the conversation!</p></div>';
                return;
            }
            msgContainer.innerHTML = '';
            let lastDate = '';
            snapshot.forEach(doc => {
                const msg = doc.data();
                const msgDate = msg.timestamp ? msg.timestamp.toDate() : new Date();
                const dateStr = msgDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                if (dateStr !== lastDate) {
                    const div = document.createElement('div');
                    div.className = 'chat-date-divider';
                    div.textContent = dateStr;
                    msgContainer.appendChild(div);
                    lastDate = dateStr;
                }
                const isOut = msg.senderId === currentUser.uid;
                const bubble = document.createElement('div');
                bubble.className = `chat-message ${msg.isSystemRequest ? 'system' : (isOut ? 'out' : 'in')}`;
                let content = msg.text || '';
                if (msg.imageBase64) {
                    content += `<div style="margin-top:4px;"><img src="${msg.imageBase64}" style="max-width:160px;max-height:120px;border-radius:6px;width:100%;height:auto;object-fit:cover;" /></div>`;
                }
                const timeStr = msg.timestamp ? msg.timestamp.toDate().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }) : '';
                content += `<div class="time">${timeStr}</div>`;
                bubble.innerHTML = content;
                msgContainer.appendChild(bubble);
            });
            msgContainer.scrollTop = msgContainer.scrollHeight;
        }, err => {
            console.error('Message subscription error:', err);
            msgContainer.innerHTML = '<div class="empty-chat"><i class="fas fa-exclamation-circle" style="color:var(--coral);"></i><p>Could not load messages.</p></div>';
        });
}

function closeChatModal() {
    document.getElementById('chatModal').classList.remove('active');
    document.body.style.overflow = '';
    if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
    chatThreadId = null;
}

async function sendModalMessage() {
    const input = document.getElementById('modalChatInput');
    const text = input.value.trim();
    if (!text || !chatThreadId || !currentUser) return;
    input.value = '';
    try {
        await db.collection(`threads/${chatThreadId}/messages`).add({
            senderId: currentUser.uid,
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        await db.collection('threads').doc(chatThreadId).update({
            lastMessageText: text.substring(0, 80),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast('Message sent', 'success');
    } catch (err) { console.error(err); showToast('Failed to send message', 'error'); }
}

function openWhatsApp(vendorId) {
    const vendor = findProviderById(vendorId);
    const name = vendor ? (vendor.name || vendor.businessName) : 'a vendor';
    const msg = `Hi Zone21, I'm interested in booking ${name} for my event. Can you help me connect with them or find similar options?`;
    window.open(`https://wa.me/${ZONE21.whatsapp.replace('+', '')}?text=${encodeURIComponent(msg)}`, '_blank');
}

async function openBlueprintVendorProfile(vendorId) {
    if (!vendorId) { showToast('Vendor not found', 'error'); return; }

    const modal = document.getElementById('blueprintProfileModal');
    const body = document.getElementById('blueprintProfileBody');
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    body.innerHTML = '<div class="pm-loading"><div class="pm-spinner"></div><p>Loading profile…</p></div>';

    currentProfileUid = vendorId;
    currentProfileCollection = null;

    try {
        let collectionName = resolveVendorCollection(vendorId);
        let data = null;

        if (collectionName) {
            try {
                const doc = await db.collection(collectionName).doc(vendorId).get();
                if (doc.exists) data = { uid: vendorId, ...doc.data() };
            } catch (e) { console.warn('profile fetch failed:', e); }
        } else {
            try {
                let doc = await db.collection('venues').doc(vendorId).get();
                if (doc.exists) {
                    collectionName = 'venues';
                    data = { uid: vendorId, ...doc.data() };
                } else {
                    doc = await db.collection('serviceProviders').doc(vendorId).get();
                    if (doc.exists) {
                        collectionName = 'serviceProviders';
                        data = { uid: vendorId, ...doc.data() };
                    }
                }
            } catch (e) { console.warn('profile fetch fallback failed:', e); }
        }

        if (!data) {
            const local = findProviderById(vendorId);
            if (local) {
                collectionName = collectionName || resolveVendorCollection(vendorId) || 'serviceProviders';
                data = { uid: vendorId, ...local };
            }
        }

        if (!data || !collectionName) {
            body.innerHTML = `
                <div class="pm-loading">
                    <i class="fas fa-exclamation-circle" style="font-size:2rem;color:var(--coral);margin-bottom:12px;display:block;"></i>
                    <p>Profile not found or no longer available.</p>
                </div>`;
            return;
        }

        try {
            const userSnap = await db.collection('users').doc(vendorId).get();
            if (userSnap.exists) {
                const uData = userSnap.data();
                if (!data.name && !data.businessName && !data.companyName) data.name = uData.name || '';
                if (!data.avatar && !data.avatarUrl) data.avatarUrl = uData.avatarUrl || null;
                if (!data.description && !data.bio) data.description = uData.bio || '';
                if (!data.email) data.email = uData.email || '';
                if (!data.phone) data.phone = uData.phone || uData.contact || '';
            }
        } catch (e) { /* ignore */ }

        currentProfileCollection = collectionName;
        renderBlueprintProfile(data, collectionName);
        loadBlueprintReviews(vendorId, collectionName);

    } catch (e) {
        console.error('Profile modal error:', e);
        body.innerHTML = `
            <div class="pm-loading">
                <i class="fas fa-exclamation-triangle" style="font-size:2rem;color:var(--coral);margin-bottom:12px;display:block;"></i>
                <p>Failed to load profile.</p>
            </div>`;
    }
}

function renderBlueprintProfile(item, collectionName) {
    const body = document.getElementById('blueprintProfileBody');

    const name = item.name || item.businessName || item.companyName || item.displayName || 'Unnamed';
    const initials = name.split(' ').map(w => w.charAt(0)).join('').substring(0, 2).toUpperCase() || '?';
    const avatarUrl = item.avatar || item.avatarUrl || null;
    const avatarHtml = avatarUrl ? `<img src="${escapeAttr(avatarUrl)}" alt="Avatar" onerror="this.style.display='none';this.parentNode.textContent='${escapeAttr(initials)}';">` : escapeHtml(initials);

    const isVenue = collectionName === 'venues' || item.type === 'venue';
    const category = item.category || item.serviceType || item.venueType || (isVenue ? 'Venue' : 'Service Provider');
    const rating = Number(item.rating) || 0;
    const reviewsCount = Number(item.reviewsCount) || 0;
    const description = cleanVendorField(item.description || item.bio || item.about || '', 600) || 'No description provided.';
    const basePrice = Number(item.basePrice) || 0;

    const fullStars = Math.floor(rating);
    const halfStar = rating % 1 >= 0.5;
    let starsHtml = '';
    for (let i = 1; i <= 5; i++) {
        if (i <= fullStars) starsHtml += '<i class="fas fa-star"></i>';
        else if (i === fullStars + 1 && halfStar) starsHtml += '<i class="fas fa-star-half-alt"></i>';
        else starsHtml += '<i class="far fa-star"></i>';
    }

    let services = [];
    if (Array.isArray(item.services) && item.services.length) services = item.services;
    else if (Array.isArray(item.amenities) && item.amenities.length) services = item.amenities;
    else if (typeof item.services === 'string' && item.services.trim()) services = item.services.split(/[,;\n|]+/).map(s => s.trim()).filter(Boolean);
    else if (typeof item.amenities === 'string' && item.amenities.trim()) services = item.amenities.split(/[,;\n|]+/).map(s => s.trim()).filter(Boolean);
    else if (item.secondaryServices) services = String(item.secondaryServices).split(/[,;\n|]+/).map(s => s.trim()).filter(Boolean);
    services = services.map(s => cleanVendorField(s, 40)).filter(Boolean);
    const tagsHtml = services.slice(0, 12).map(s => `<span class="pm-tag">${escapeHtml(s)}</span>`).join('');

    const details = [];
    if (isVenue) {
        if (item.capacity) details.push({ i: 'fa-users', l: 'Capacity', v: item.capacity + ' guests' });
        if (item.venueType) details.push({ i: 'fa-archway', l: 'Venue Type', v: item.venueType });
        if (item.operatingHours) details.push({ i: 'fa-clock', l: 'Operating Hours', v: item.operatingHours });
        if (item.parking) details.push({ i: 'fa-parking', l: 'Parking', v: item.parking });
        if (item.catering) details.push({ i: 'fa-utensils', l: 'Catering', v: item.catering });
        if (item.deposit) details.push({ i: 'fa-hand-holding-usd', l: 'Deposit', v: item.deposit });
        if (item.rentalPolicies) details.push({ i: 'fa-file-contract', l: 'Rental Policies', v: item.rentalPolicies });
        if (item.pricingPackages) details.push({ i: 'fa-layer-group', l: 'Pricing Packages', v: item.pricingPackages });
    } else {
        if (item.yearsExperience) details.push({ i: 'fa-award', l: 'Years of Experience', v: item.yearsExperience + ' years' });
        if (item.businessHours) details.push({ i: 'fa-clock', l: 'Business Hours', v: item.businessHours });
        if (item.serviceAreas) details.push({ i: 'fa-map-pin', l: 'Service Areas', v: item.serviceAreas });
        if (item.languages) details.push({ i: 'fa-language', l: 'Languages', v: item.languages });
        if (item.paymentMethods) details.push({ i: 'fa-credit-card', l: 'Payment Methods', v: item.paymentMethods });
        if (item.cancellationPolicy) details.push({ i: 'fa-file-contract', l: 'Cancellation Policy', v: item.cancellationPolicy });
    }
    if (item.location) details.push({ i: 'fa-map-marker-alt', l: 'Location', v: item.location });
    if (item.email) details.push({ i: 'fa-envelope', l: 'Email', v: item.email });
    if (item.phone) details.push({ i: 'fa-phone', l: 'Phone', v: item.phone });

    const detailHtml = details.length ?
        details.map(d => `
            <div class="pm-detail-item">
                <i class="fas ${d.i}"></i>
                <div>
                    <span class="pm-label">${escapeHtml(d.l)}</span>
                    <div class="pm-value">${escapeHtml(cleanVendorField(d.v, 240))}</div>
                </div>
            </div>
        `).join('') :
        '<p style="grid-column:1/-1;color:var(--text-muted);font-size:0.82rem;">No additional details available.</p>';

    const socials = [];
    if (item.facebook) socials.push({ c: 'facebook', i: 'fab fa-facebook-f', u: item.facebook, l: 'Facebook' });
    if (item.instagram) socials.push({ c: 'instagram', i: 'fab fa-instagram', u: item.instagram, l: 'Instagram' });
    if (item.tiktok) socials.push({ c: 'tiktok', i: 'fab fa-tiktok', u: item.tiktok, l: 'TikTok' });
    if (item.youtube) socials.push({ c: 'youtube', i: 'fab fa-youtube', u: item.youtube, l: 'YouTube' });
    if (item.website) socials.push({ c: 'website', i: 'fas fa-globe', u: item.website, l: 'Website' });
    const socialHtml = socials.length ? `<div class="pm-social">${socials.map(s => `<a href="${escapeAttr(s.u)}" target="_blank" rel="noopener" class="pm-social-link ${s.c}" title="${s.l}"><i class="${s.i}"></i></a>`).join('')}</div>` : '';

    let galleryHtml = '';
    const images = Array.isArray(item.images) ? item.images.filter(u => u && typeof u === 'string' && (u.startsWith('data:') || u.startsWith('http'))) : [];
    if (images.length) {
        galleryHtml = `
            <div class="pm-gallery">
                <h4><i class="fas fa-images"></i> Gallery (${images.length})</h4>
                <div class="pm-gallery-grid">
                    ${images.slice(0, 12).map((u, i) => `<div class="pm-gallery-item"><img src="${escapeAttr(u)}" alt="Photo ${i+1}" loading="lazy" onclick="window.open(this.src, '_blank')"></div>`).join('')}
                </div>
            </div>`;
    }

    const actionsHtml = `
        <div class="pm-actions">
            <button class="pm-btn secondary" onclick="closeBlueprintProfile(); openChatForVendor('${escapeAttr(item.uid)}')">
                <i class="fas fa-envelope"></i> Message
            </button>
            <button class="pm-btn primary" onclick="openWhatsApp('${escapeAttr(item.uid)}')">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </button>
            <button class="pm-btn outline" onclick="copyBlueprintVendorLink('${escapeAttr(item.uid)}')">
                <i class="fas fa-share-alt"></i> Share
            </button>
        </div>`;

    const reviewSection = `
        <div class="pm-reviews-section">
            <h4><i class="fas fa-comment"></i> Reviews</h4>
            <div class="pm-review-list" id="blueprintReviewList">
                <p style="color:var(--text-muted);font-size:0.8rem;">Loading reviews…</p>
            </div>
        </div>`;

    body.innerHTML = `
        <div class="pm-cover"></div>
        <div class="pm-avatar">${avatarHtml}</div>
        <div class="pm-info">
            <div class="pm-name">${escapeHtml(cleanVendorField(name, 100))}</div>
            <div class="pm-category">${escapeHtml(cleanVendorField(category, 100))}${basePrice ? ` • Starts at ${escapeHtml(safePrice(basePrice))}` : ''}</div>
            <div class="pm-rating-row">
                <span class="pm-stars">${starsHtml}</span>
                <span class="pm-rating-num">${rating.toFixed(1)}</span>
                <span class="pm-reviews-count">(${reviewsCount} review${reviewsCount === 1 ? '' : 's'})</span>
            </div>
            ${tagsHtml ? `<div class="pm-tags">${tagsHtml}</div>` : ''}
            ${description ? `<div class="pm-description">${escapeHtml(description)}</div>` : ''}
            ${details.length ? `<div class="pm-detail-grid">${detailHtml}</div>` : ''}
            ${socialHtml}
            ${galleryHtml}
            ${actionsHtml}
            ${reviewSection}
        </div>`;
}

async function loadBlueprintReviews(profileId, collectionName) {
    const list = document.getElementById('blueprintReviewList');
    if (!list) return;

    try {
        const snap = await db.collection(collectionName).doc(profileId).collection('reviews')
            .orderBy('createdAt', 'desc').limit(20).get();

        if (snap.empty) {
            list.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem;">No reviews yet.</p>';
            return;
        }

        list.innerHTML = '';
        snap.forEach(doc => {
            const r = doc.data();
            const rRating = Number(r.rating) || 0;
            const stars = '★'.repeat(rRating) + '☆'.repeat(Math.max(0, 5 - rRating));
            const date = r.createdAt && r.createdAt.toDate ? new Date(r.createdAt.toDate()).toLocaleDateString() : 'Recently';
            const div = document.createElement('div');
            div.className = 'pm-review-item';
            div.innerHTML = `
                <div class="pm-review-head">
                    <span class="pm-review-name">${escapeHtml(cleanVendorField(r.reviewerName || 'Anonymous', 60))}</span>
                    <span class="pm-review-date">${escapeHtml(date)}</span>
                </div>
                <div class="pm-review-stars">${stars}</div>
                <div class="pm-review-comment">${escapeHtml(cleanVendorField(r.comment || '', 500))}</div>
            `;
            list.appendChild(div);
        });
    } catch (e) {
        console.warn('Reviews load error:', e);
        list.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem;">Reviews unavailable.</p>';
    }
}

function copyBlueprintVendorLink(vendorId) {
    const url = window.location.origin + window.location.pathname + '?vendor=' + encodeURIComponent(vendorId);
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url)
            .then(() => showToast('Profile link copied!', 'success'))
            .catch(() => fallbackCopyBlueprint(url));
    } else {
        fallbackCopyBlueprint(url);
    }
}

function fallbackCopyBlueprint(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';

async function loadUserAndPackage() {
    try {
        const user = auth.currentUser;
        if (!user) {
            showToast('Please log in to continue.', 'error');
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            return false;
        }
        currentUser = user;
        headerUserEmail.textContent = user.email || 'user@example.com';

        await Promise.all([fetchVenues(), fetchServiceProviders()]);

        const PLAN_IDS = ['small', 'medium', 'large'];
        let foundPackage = null;
        let foundIsPending = false;

        for (const planId of PLAN_IDS) {
            try {
                const snap = await db.collection('subscriptions').doc(`${user.uid}_${planId}`).get();
                if (!snap.exists) continue;
                const data = snap.data();
                if (data.deletedAt) continue;

                const status = String(data.status || '').toLowerCase();
                const resolvedPlan = data.planId || data.plan || planId;
                if (!resolvedPlan || !PACKAGES[resolvedPlan]) continue;

                if (status === 'active' || status === 'approved') {
                    foundPackage = resolvedPlan;
                    foundIsPending = false;
                    break;
                }
                if (!foundPackage && status === 'pending_payment') {
                    foundPackage = resolvedPlan;
                    foundIsPending = true;
                }
            } catch (e) { console.warn('Direct read failed for', planId, e.message); }
        }

        if (!foundPackage) {
            try {
                const q1 = await db.collection('subscriptions')
                    .where('userId', '==', user.uid)
                    .where('status', 'in', ['active', 'approved'])
                    .limit(1).get();
                if (!q1.empty) {
                    const data = q1.docs[0].data();
                    if (!data.deletedAt) {
                        const planId = data.planId || data.plan;
                        if (planId && PACKAGES[planId]) {
                            foundPackage = planId;
                            foundIsPending = false;
                        }
                    }
                }
            } catch (e) {}
        }

        if (!foundPackage) {
            try {
                const q2 = await db.collection('subscriptions')
                    .where('userId', '==', user.uid)
                    .where('status', '==', 'pending_payment')
                    .limit(1).get();
                if (!q2.empty) {
                    const data = q2.docs[0].data();
                    if (!data.deletedAt) {
                        const planId = data.planId || data.plan;
                        if (planId && PACKAGES[planId]) {
                            foundPackage = planId;
                            foundIsPending = true;
                        }
                    }
                }
            } catch (e) {}
        }

        if (!foundPackage) {
            pkgBanner.style.display = 'flex';
            pkgBannerName.textContent = 'No active package';
            pkgBannerLimit.textContent = '—';
            pkgBannerAction.textContent = 'Subscribe';
            pkgBannerAction.href = 'subscription.html';
            headerPackageTag.textContent = 'No Plan';
            headerPackageTag.style.background = 'var(--slate)';
            sidebarPackageLabel.textContent = 'Package: No active plan';
            sidebarPackageBadge.textContent = 'No Plan';
            attendeeLimitBadge.textContent = '—';
            attendeeHint.textContent = 'Subscribe to generate blueprints.';
            eventAttendees.disabled = true;
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<i class="fas fa-lock"></i> Subscribe';
            showToast('Please subscribe to a package.', 'info');
            renderHistorySidebar();
            return false;
        }

        userPackage = foundPackage;
        const pkg = PACKAGES[foundPackage];
        userPackageName = pkg.name;
        userPackageLimit = pkg.maxAttendees;

        headerPackageTag.textContent = pkg.label;
        headerPackageTag.style.background = 'var(--mint)';
        headerPackageTag.style.color = 'white';
        sidebarPackageBadge.textContent = pkg.label;
        sidebarPackageLabel.textContent = `Package: ${pkg.name} (${pkg.limitDisplay})`;

        pkgBanner.style.display = 'flex';
        pkgBannerName.textContent = pkg.name;
        pkgBannerLimit.textContent = pkg.limitDisplay;
        pkgBannerAction.textContent = 'Manage';
        pkgBannerAction.href = 'subscription.html';

        const limitDisplay = pkg.maxAttendees === Infinity ? '∞' : `≤ ${pkg.maxAttendees}`;
        attendeeLimitBadge.textContent = limitDisplay;
        attendeeHint.textContent = `Maximum ${pkg.maxAttendees === Infinity ? 'unlimited' : pkg.maxAttendees} attendees.`;
        eventAttendees.disabled = false;
        eventAttendees.max = pkg.maxAttendees === Infinity ? Infinity : pkg.maxAttendees;
        budgetHint.textContent = pkg.budgetHint || 'Set your total budget.';
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<i class="fas fa-magic"></i> Generate Blueprint';

        eventAttendees.addEventListener('input', function() {
            const val = parseInt(this.value);
            if (pkg.maxAttendees !== Infinity && val > pkg.maxAttendees) {
                this.value = pkg.maxAttendees;
                showToast(`Attendees limited to ${pkg.maxAttendees}.`, 'info');
            }
        });

        if (foundIsPending) {
            showToast(`Payment pending for ${pkg.name}. You can still generate blueprints.`, 'info');
        } else {
            showToast(`Welcome! ${pkg.name} package active.`, 'success');
        }
        renderHistorySidebar();
        return true;

    } catch (err) {
        console.error('Package load error:', err);
        showToast('Failed to load subscription data.', 'error');
        renderHistorySidebar();
        return false;
    }
}

// ============================================================
//  SANITIZE AI OUTPUT
// ============================================================
function sanitizeAIOutput(rawHtml) {
    let html = rawHtml;
    html = html.replace(/```html\s*/gi, '').replace(/```\s*/g, '');
    html = html.replace(/```[a-zA-Z]*\s*/g, '');
    html = html.replace(/`/g, '');
    html = html.replace(/^#{1,6}\s+/gm, '');
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

    const dangerousTags = ['script', 'iframe', 'object', 'embed', 'link', 'meta', 'style', 'base', 'form', 'input', 'button', 'select', 'option', 'textarea'];
    dangerousTags.forEach(tag => {
        html = html.replace(new RegExp(`<${tag}[^>]*>`, 'gi'), '').replace(new RegExp(`</${tag}>`, 'gi'), '');
    });

    html = html.replace(/on\w+="[^"]*"/gi, '');
    html = html.replace(/on\w+='[^']*'/gi, '');
    html = html.replace(/javascript:[^"'\s]*/gi, '');

    const forbiddenWords = [
        'AI', 'artificial intelligence', 'DeepSeek', 'ChatGPT', 'Claude', 'GPT-4', 'GPT', 'LLM',
        'HTML', 'markdown', 'code block', 'language model', 'machine learning', 'neural network',
        'I generated', 'I created', 'As an AI', 'As a language model', 'my training', 'my knowledge',
        'based on my analysis', 'I recommend', 'I suggest', 'I think', 'I believe', 'in my opinion',
        'I have', 'I will', 'I can', 'I would', 'I\'ve', 'I\'m', 'I am'
    ];
    forbiddenWords.forEach(word => {
        const regex = new RegExp(`\\b${word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'gi');
        html = html.replace(regex, '');
    });
    html = html.replace(/\bI\s+(recommend|suggest|think|believe|would|will|can|have|am|feel|know)\s+/gi, '');
    html = html.replace(/<h[1-4][^>]*>\s*<\/h[1-4]>/gi, '');
    html = html.replace(/<p[^>]*>\s*<\/p>/gi, '');
    html = html.replace(/<li[^>]*>\s*<\/li>/gi, '');
    html = html.replace(/<div[^>]*>\s*<\/div>/gi, '');
    html = html.replace(/<span[^>]*>\s*<\/span>/gi, '');
    html = html.replace(/<strong>\s*<\/strong>/gi, '');
    html = html.replace(/<em>\s*<\/em>/gi, '');
    html = html.replace(/<table[^>]*>/gi, '<table style="width:100%;">');
    html = html.replace(/<td[^>]*>/gi, '<td>');
    html = html.replace(/<th[^>]*>/gi, '<th>');
    html = html.replace(/\n{3,}/g, '\n\n');
    html = html.replace(/\s{3,}/g, '  ');
    html = html.replace(/^(\s*)[-*]\s+/gm, '$1');
    html = html.replace(/^\s*[-*]\s+/gm, '');
    html = html.replace(/^\s*---+\s*$/gm, '<hr>');
    html = html.replace(/^\s*>\s?/gm, '');
    html = html.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"');
    html = html.replace(/<h[1-4][^>]*>\s*<strong>\s*<\/strong>\s*<\/h[1-4]>/gi, '');
    html = html.replace(/\bAI\b/gi, '').replace(/\bDeepSeek\b/gi, '').replace(/\bHTML\b/gi, '');
    html = html.replace(/<\/?code>/gi, '').replace(/<\/?pre>/gi, '');
    return html.trim();
}

function wrapTablesInResponsiveContainer(html) {
    return html.replace(/<table[\s\S]*?<\/table>/gi, m => `<div class="table-responsive">${m}</div>`);
}

function makeAiCacheKey(d) {
    return [d.country, d.location, d.type, d.budget, d.attendees, d.date, d.time, (d.services || []).slice().sort().join(','), d.notes].join('|');

function readAiCache(key) {
    try {
        const cache = JSON.parse(localStorage.getItem('zone21_ai_cache') || '{}');
        return cache[key] || null;
    } catch { return null; }
}
function writeAiCache(key, html) {
    try {
        const cache = JSON.parse(localStorage.getItem('zone21_ai_cache') || '{}');
        cache[key] = html;
        const keys = Object.keys(cache);
        if (keys.length > 30) delete cache[keys[0]];
        localStorage.setItem('zone21_ai_cache', JSON.stringify(cache));
    } catch {}
}

function isLocallyInvited(service, providerId) {
    const h = (currentEventData && currentEventData.invitedHistory) || {};
    return (h[service] || []).includes(providerId);
}

function markLocallyInvited(service, providerId) {
    if (!currentEventData.invitedHistory) currentEventData.invitedHistory = {};
    if (!currentEventData.invitedHistory[service]) currentEventData.invitedHistory[service] = [];
    if (!currentEventData.invitedHistory[service].includes(providerId)) {
