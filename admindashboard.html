<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Zone21 Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        /* ===== ROOT ===== */
        :root {
            --navy: #0a1f2e;
            --navy-light: #143040;
            --lime: #C0C800;
            --lime-glow: rgba(192, 200, 0, 0.25);
            --pink: #F80070;
            --pink-glow: rgba(248, 0, 112, 0.15);
            --bg: #f0f4fa;
            --card-bg: #ffffff;
            --text: #0f1a24;
            --text-secondary: #3d4f5e;
            --text-muted: #7a8a9a;
            --border: #e6eaf0;
            --radius: 20px;
            --radius-sm: 12px;
            --shadow: 0 8px 32px rgba(10, 31, 46, 0.06);
            --shadow-hover: 0 16px 48px rgba(10, 31, 46, 0.10);
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--lime); border-radius: 10px; }

        /* ===== OVERLAY ===== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 31, 46, 0.5);
            backdrop-filter: blur(4px);
            z-index: 998;
        }
        .sidebar-overlay.active { display: block; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            background: var(--navy);
            color: #fff;
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 999;
            border-right: 1px solid rgba(255,255,255,0.04);
            transform: translateX(0);
        }
        .sidebar.closed {
            transform: translateX(-100%);
        }

        .sidebar .brand {
            padding: 24px 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .brand .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--lime);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--navy);
        }
        .sidebar .brand h1 {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--lime);
            letter-spacing: -0.02em;
        }
        .sidebar .brand h1 span { color: #fff; font-weight: 400; }

        .sidebar .nav-section {
            padding: 16px 12px;
            flex: 1;
        }
        .sidebar .nav-section .section-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.3);
            padding: 0 12px 8px;
        }
        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: rgba(255,255,255,0.65);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            margin-bottom: 2px;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .sidebar .nav-item:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }
        .sidebar .nav-item.active {
            background: rgba(192, 200, 0, 0.12);
            color: var(--lime);
            box-shadow: inset 0 0 0 1px rgba(192, 200, 0, 0.10);
        }
        .sidebar .nav-item i { width: 20px; text-align: center; font-size: 1rem; }
        .sidebar .nav-item .badge {
            margin-left: auto;
            background: var(--pink);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .sidebar .nav-item .badge.lime { background: var(--lime); color: var(--navy); }

        .sidebar .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 0.65rem;
            color: rgba(255,255,255,0.3);
            text-align: center;
            letter-spacing: 0.04em;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin-left: var(--sidebar-width);
            transition: margin-left 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            width: calc(100% - var(--sidebar-width));
        }
        .main-content.expanded {
            margin-left: 0;
            width: 100%;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            background: rgba(255,255,255,0.80);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(230, 234, 240, 0.6);
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 900;
            gap: 16px;
            flex-wrap: wrap;
        }
        .top-bar .left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .top-bar .left .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.3rem;
            color: var(--navy);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: var(--transition);
        }
        .top-bar .left .menu-toggle:hover {
            background: var(--bg);
        }
        .top-bar .left .page-title h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--navy);
            letter-spacing: -0.02em;
        }
        .top-bar .left .page-title .sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
        }
        .top-bar .right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

            height: 38px;

            border:
