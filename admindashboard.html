<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone21 Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800;
            --pink: #F80070;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-muted: #6c757d;
            --border: #e0e0e8;
            --radius: 16px;
            --shadow: 0 8px 30px rgba(16, 40, 56, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }
        .sidebar {
            background: var(--navy);
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        .sidebar .logo {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--lime);
        }
        .sidebar .logo span { color: var(--pink); }
        .nav-item {
            padding: 12px 20px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
            border-left: 4px solid transparent;
            text-decoration: none;
            white-space: nowrap;
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active {
            background: rgba(255,255,255,0.1);
            border-left-color: var(--lime);
            color: white;
        }
        .nav-item i { width: 20px; text-align: center; }
        .main-content {
            flex: 1;
            padding: 20px;
        }
        .top-bar {
            background: white;
            padding: 15px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .top-bar h2 { font-size: 1.5rem; color: var(--navy); }
        .btn-signout {
            background: var(--pink);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stat-card .value { font-size: 2.5rem; font-weight: 800; color: var(--navy); }
        .stat-card .label { font-size: 0.9rem; color: var(--text-muted); margin-top: 5px; }

        /* Desktop: sidebar on left */
        @media (min-width: 769px) {
            body { flex-direction: row; }
            .sidebar {
                width: 260px;
                height: 100vh;
                position: sticky;
                top: 0;
            }
            .main-content { overflow-y: auto; height: 100vh; }
        }

        /* Mobile: sidebar fixed at bottom, horizontally scrollable */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                flex-direction: row;
                align-items: center;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 8px 10px;
                height: auto;
                min-height: 60px;
                border-top: 1px solid rgba(255,255,255,0.1);
                background: var(--navy);
            }
            .sidebar .logo { display: none; }
            .nav-item {
                padding: 8px 12px;
                font-size: 0.8rem;
                border-left: none;
                border-bottom: 2px solid transparent;
                flex-shrink: 0;
            }
            .nav-item.active { border-bottom-color: var(--lime); }
            .main-content {
                padding-bottom: 80px; /* avoid content hidden behind bottom bar */
                order: 1;
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="logo">Zone<span>21</span> Admin</div>
        <a class="nav-item active" href="admin-dashboard.html"><i class="fas fa-chart-line"></i> Overview</a>
        <a class="nav-item" href="adminevents.html"><i class="fas fa-check-circle"></i> Approve Events</a>
        <a class="nav-item" href="ticketsmanagement.html"><i class="fas fa-ticket-alt"></i> Manage Tickets</a>
        <a class="nav-item" href="adminpublishevents.html"><i class="fas fa-globe"></i> Publish Events</a>
        <a class="nav-item" href="adminrevenue"><i class="fas fa-dollar-sign"></i> Tickets Revenue</a>
        <a class="nav-item" href="#"><i class="fas fa-chart-bar"></i> Sales Data</a>
        <a class="nav-item" href="#"><i class="fas fa-credit-card"></i> Subscriptions Data</a>
        <a class="nav-item" href="managevendors"><i class="fas fa-store"></i> Vendors</a>
        <a class="nav-item" href="manageorganizers"><i class="fas fa-users"></i> Event Organizers</a>
        <a class="nav-item" href="#"><i class="fas fa-qrcode"></i> Scan Tickets</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">
            <h2>Dashboard Overview</h2>
            <button class="btn-signout" onclick="signOut()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
        </div>

        <!-- Live Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="value" id="stat-total-events">0</div>
                <div class="label">Total Events</div>
            </div>
            <div class="stat-card">
                <div class="value" id="stat-pending-events">0</div>
                <div class="label">Pending Approval</div>
            </div>
            <div class="stat-card">
                <div class="value" id="stat-tickets-sold">0</div>
                <div class="label">Tickets Sold</div>
            </div>
            <div class="stat-card">
                <div class="value" id="stat-revenue">$0</div>
                <div class="label">Total Revenue</div>
            </div>
        </div>
    </div>

    <script>
        // ============ FIREBASE ============
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============ AUTH CHECK & SIGN OUT ============
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'admin-login.html';
                return;
            }
            db.collection('admins').doc(user.uid).get().then(doc => {
                if (!doc.exists) {
                    auth.signOut();
                    window.location.href = 'admin-login.html';
                } else {
                    loadStats();
                }
            }).catch(err => {
                console.error('Admin check failed:', err);
                auth.signOut();
                window.location.href = 'admin-login.html';
            });
        });

        function signOut() {
            auth.signOut().then(() => window.location.href = 'admin-login.html');
        }

        // ============ LIVE STATS ============
        function loadStats() {
            // Total events
            db.collection('events').onSnapshot(snap => {
                document.getElementById('stat-total-events').textContent = snap.size;
            }, err => console.error('Total events listener error:', err));

            // Pending events
            db.collection('events').where('status', '==', 'pending').onSnapshot(snap => {
                document.getElementById('stat-pending-events').textContent = snap.size;
            }, err => console.error('Pending events listener error:', err));

            // Tickets sold (count of generated tickets)
            db.collection('tickets').onSnapshot(snap => {
                document.getElementById('stat-tickets-sold').textContent = snap.size;
            }, err => console.error('Tickets listener error:', err));

            // Revenue from paid invoices
            db.collection('invoices').where('status', '==', 'paid').onSnapshot(snap => {
                let total = 0;
                snap.forEach(doc => { total += doc.data().amount || 0; });
                document.getElementById('stat-revenue').textContent = '$' + total.toFixed(2);
            }, err => console.error('Invoices listener error:', err));
        }
    </script>
</body>
</html>
