<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zone21 Admin – Event Approvals</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>

    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800;
            --pink: #F80070;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-muted: #6c757d;
            --border: #e0e0e8;
            --radius: 16px;
            --shadow: 0 8px 30px rgba(16, 40, 56, 0.08);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--navy);
        }
        .header h1 i {
            color: var(--pink);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            text-align: center;
        }
        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--navy);
        }
        .stat-card .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .stat-card .stat-sub {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 4px;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: white;
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .filter-btn.active {
            background: var(--navy);
            color: var(--lime);
            border-color: var(--navy);
        }
        .filter-btn:hover:not(.active) {
            background: #eef0f4;
        }

        .event-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .event-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: 0.2s;
        }
        .event-card:hover {
            box-shadow: 0 12px 40px rgba(16, 40, 56, 0.12);
        }
        .event-card .poster {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #f0f0f0;
        }
        .event-card .event-body {
            padding: 20px;
        }
        .event-card .event-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 5px;
        }
        .event-card .event-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .event-card .event-meta i {
            width: 16px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-approved {
            background: #d4edda;
            color: #155724;
        }
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }
        .status-cancelled {
            background: #e2e3e5;
            color: #383d41;
        }
        .status-cancellation_requested {
            background: #ffeaa7;
            color: #6c5200;
        }
        .status-pending_payment {
            background: #cce5ff;
            color: #004085;
        }

        .event-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-approve {
            background: #28a745;
            color: white;
        }
        .btn-approve:hover {
            background: #218838;
        }
        .btn-reject {
            background: var(--pink);
            color: white;
        }
        .btn-reject:hover {
            background: #d0005e;
        }
        .btn-view {
            background: var(--navy);
            color: white;
        }
        .btn-view:hover {
            background: #1a3a4a;
        }
        .btn-cancel {
            background: #ffc107;
            color: var(--navy);
        }
        .btn-cancel:hover {
            background: #e0a800;
        }
        .btn-unpublish {
            background: #6f42c1;
            color: white;
        }
        .btn-unpublish:hover {
            background: #5a32a3;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-download {
            background: #6f42c1;
            color: white;
        }
        .btn-download:hover {
            background: #5a32a3;
        }
        .btn-copy {
            background: #fd7e14;
            color: white;
        }
        .btn-copy:hover {
            background: #dc6a0e;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 0.75rem;
        }
        .btn-approve-cancel {
            background: #17a2b8;
            color: white;
        }
        .btn-approve-cancel:hover {
            background: #138496;
        }
        .btn-reject-cancel {
            background: #fd7e14;
            color: white;
        }
        .btn-reject-cancel:hover {
            background: #dc6a0e;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 25px;
            max-width: 920px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            font-size: 1.5rem;
            color: var(--navy);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #888;
        }
        .modal-close:hover {
            color: #222;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .detail-item {
            margin-bottom: 10px;
        }
        .detail-item label {
            font-weight: 600;
            color: var(--navy);
            display: block;
            margin-bottom: 3px;
            font-size: 0.85rem;
        }
        .detail-item p {
            color: #444;
        }
        .ticket-detail {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .ticket-detail .ticket-img {
            max-width: 120px;
            height: auto;
            margin-top: 10px;
            border-radius: 8px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
        .no-events {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .no-events i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 15px;
            color: #ddd;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .badge-pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 6px;
        }
        .text-muted {
            color: var(--text-muted);
        }
        .mt-10 {
            margin-top: 10px;
        }
        .mb-10 {
            margin-bottom: 10px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cancel-reason-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 12px 0;
        }
        .cancel-reason-box strong {
            display: block;
            color: #6c5200;
        }

        @media (max-width: 600px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .event-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <h1><i class="fas fa-shield-alt"></i> Zone21 · Approvals</h1>
            <button class="btn btn-view" onclick="location.reload()"><i class="fas fa-sync"></i> Refresh</button>
        </div>

        <!-- STATS -->
        <div class="stats" id="stats-container">
            <div class="stat-card">
                <div class="stat-value" id="total-events">0</div>
                <div class="stat-label">Total (Review + Published + Cancellation Requests)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pending-events">0</div>
                <div class="stat-label">⏳ In Review</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="approved-events">0</div>
                <div class="stat-label">✅ Published</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="cancelreq-events">0</div>
                <div class="stat-label">⏳ Cancellation Requests</div>
            </div>
        </div>

        <!-- FILTER BAR -->
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">⏳ In Review</button>
            <button class="filter-btn" data-filter="approved">✅ Published</button>
            <button class="filter-btn" data-filter="cancellation_requested">⏳ Cancellation Requests</button>
        </div>

        <!-- EVENTS LIST -->
        <div id="events-list" class="event-list">
            <div class="loading">Authenticating &amp; loading events…</div>
        </div>

    </div>

    <!-- DETAIL MODAL -->
    <div class="modal" id="event-detail-modal">
        <div class="modal-content" id="modal-content">
            <!-- populated by JS -->
        </div>
    </div>

    <script>
        // ============================================================
        //  FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        //  STATE
        // ============================================================
        let allEvents = [];
        let currentFilter = 'all';

        // Allowed statuses for this page: pending, approved, cancellation_requested
        const ALLOWED_STATUSES = new Set(['pending', 'approved', 'cancellation_requested']);

        // ─── Helper: check if event is complete ───
        function isEventComplete(ev) {
            if (!ev.eventName || ev.eventName.trim() === '') return false;
            if (!ev.location || ev.location.trim() === '') return false;
            if (!ev.startDate || ev.startDate.trim() === '') return false;
            if (!ev.endDate || ev.endDate.trim() === '') return false;
            if (!ev.capacity || ev.capacity <= 0) return false;
            if (!ev.organizerName || ev.organizerName.trim() === '') return false;
            if (!ev.organizerEmail || ev.organizerEmail.trim() === '') return false;
            if (!ev.ticketTypes || !Array.isArray(ev.ticketTypes) || ev.ticketTypes.length === 0) return false;
            for (let t of ev.ticketTypes) {
                if (!t.name || t.name.trim() === '') return false;
                if (t.price === undefined || t.price === null || isNaN(parseFloat(t.price))) return false;
                if (!t.quantity || t.quantity <= 0) return false;
            }
            return true;
        }

        // ============================================================
        //  LOAD EVENTS
        // ============================================================
        function loadEvents() {
            const listDiv = document.getElementById('events-list');
            listDiv.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading events…</div>';

            db.collection('events')
                .orderBy('createdAt', 'desc')
                .get()
                .then(snapshot => {
                    allEvents = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const status = data.status;
                        if (status && ALLOWED_STATUSES.has(status) && isEventComplete(data)) {
                            allEvents.push({ id: doc.id, ...data });
                        }
                    });
                    updateStats();
                    applyFilter();
                })
                .catch(err => {
                    console.error('Error loading events:', err);
                    listDiv.innerHTML = `
                        <div class="no-events">
                            <i class="fas fa-exclamation-triangle"></i>
                            Failed to load events.<br>
                            <span class="text-muted">${err.message}</span>
                        </div>`;
                });
        }

        // ============================================================
        //  UPDATE STATS
        // ============================================================
        function updateStats() {
            const pending = allEvents.filter(e => e.status === 'pending');
            const approved = allEvents.filter(e => e.status === 'approved');
            const cancelReqs = allEvents.filter(e => e.status === 'cancellation_requested');
            document.getElementById('total-events').textContent = allEvents.length;
            document.getElementById('pending-events').textContent = pending.length;
            document.getElementById('approved-events').textContent = approved.length;
            document.getElementById('cancelreq-events').textContent = cancelReqs.length;
        }

        // ============================================================
        //  APPLY FILTER
        // ============================================================
        function applyFilter() {
            const listDiv = document.getElementById('events-list');
            listDiv.innerHTML = '';

            let filtered;
            if (currentFilter === 'all') {
                filtered = allEvents;
            } else {
                filtered = allEvents.filter(e => e.status === currentFilter);
            }

            if (filtered.length === 0) {
                listDiv.innerHTML = `
                    <div class="no-events">
                        <i class="fas fa-inbox"></i>
                        No complete events found for this filter.
                    </div>`;
                return;
            }

            filtered.forEach(event => {
                const card = createEventCard(event);
                listDiv.appendChild(card);
            });
        }

        // ============================================================
        //  CREATE EVENT CARD
        // ============================================================
        function createEventCard(event) {
            const card = document.createElement('div');
            card.className = 'event-card';

            const posterHtml = event.posterImage ?
                `<img src="${event.posterImage}" class="poster" alt="${event.eventName}">` :
                `<div class="poster" style="display:flex;align-items:center;justify-content:center;color:#ccc;background:#f7f7f7;">
                    <i class="fas fa-image fa-3x"></i>
                </div>`;

            const statusClass = `status-${event.status}`;
            let statusText = event.status === 'pending' ? 'In Review' :
                event.status === 'approved' ? 'Published' :
                event.status === 'cancellation_requested' ? 'Cancellation Requested' :
                event.status.replace(/_/g, ' ').toUpperCase();

            // Actions based on status
            let actionsHtml = '';

            // Always include Details and Delete (with warnings)
            actionsHtml += `
                <button class="btn btn-view" onclick="viewEventDetails('${event.id}')"><i class="fas fa-eye"></i> Details</button>
            `;

            if (event.status === 'pending') {
                actionsHtml += `
                    <button class="btn btn-approve" onclick="approveEvent('${event.id}')"><i class="fas fa-check"></i> Approve</button>
                    <button class="btn btn-reject" onclick="rejectEvent('${event.id}')"><i class="fas fa-times"></i> Reject</button>
                `;
            } else if (event.status === 'approved') {
                actionsHtml += `
                    <button class="btn btn-unpublish" onclick="unpublishEvent('${event.id}')"><i class="fas fa-undo"></i> Reject Publication</button>
                    <button class="btn btn-cancel" onclick="cancelApprovedEvent('${event.id}')"><i class="fas fa-ban"></i> Cancel</button>
                `;
            } else if (event.status === 'cancellation_requested') {
                actionsHtml += `
                    <button class="btn btn-approve-cancel" onclick="approveCancellation('${event.id}')"><i class="fas fa-check-circle"></i> Approve Cancel</button>
                    <button class="btn btn-reject-cancel" onclick="rejectCancellation('${event.id}')"><i class="fas fa-times-circle"></i> Reject Cancel</button>
                `;
            }

            // Delete button always with triple warning
            actionsHtml += `
                <button class="btn btn-danger" onclick="deleteEvent('${event.id}')"><i class="fas fa-trash"></i> Delete</button>
            `;

            const startDate = event.startDate ? new Date(event.startDate) : null;
            const endDate = event.endDate ? new Date(event.endDate) : null;
            const dateStr = startDate ?
                startDate.toLocaleDateString() + (endDate ? ' → ' + endDate.toLocaleDateString() : '') :
                'Date TBD';

            card.innerHTML = `
                ${posterHtml}
                <div class="event-body">
                    <div class="event-name">${event.eventName || 'Untitled Event'}</div>
                    <div class="event-meta">
                        <span><i class="far fa-calendar-alt"></i> ${dateStr}</span><br>
                        <span><i class="fas fa-map-marker-alt"></i> ${event.location || 'No location'}</span>
                    </div>
                    <span class="status-badge ${statusClass}">${statusText}</span>
                    <div class="event-actions">${actionsHtml}</div>
                </div>
            `;
            return card;
        }

        // ============================================================
        //  ACTION FUNCTIONS
        // ============================================================

        // ---- Approve (pending → approved) ----
        async function approveEvent(id) {
            if (!confirm('Approve this event? It will be published and visible to the public.')) return;
            try {
                await db.collection('events').doc(id).update({
                    status: 'approved',
                    published: true,
                    approvedAt: new Date().toISOString()
                });
                alert('✅ Event approved and is now live!');
                loadEvents();
            } catch (err) {
                console.error('Approval failed:', err);
                alert('Failed to approve event: ' + err.message);
            }
        }

        // ---- Reject (pending → rejected) ----
        async function rejectEvent(id) {
            const reason = prompt('Reason for rejection (optional):');
            try {
                await db.collection('events').doc(id).update({
                    status: 'rejected',
                    published: false,
                    rejectionReason: reason || '',
                    rejectedAt: new Date().toISOString()
                });
                alert('❌ Event rejected. Organizer can edit and resubmit.');
                loadEvents();
            } catch (err) {
                console.error('Rejection failed:', err);
                alert('Failed to reject event: ' + err.message);
            }
        }

        // ---- Unpublish (approved → pending) ----
        async function unpublishEvent(id) {
            if (!confirm('Reject publication? This will set the event back to "In Review" and the organizer can edit it again.')) return;
            try {
                await db.collection('events').doc(id).update({
                    status: 'pending',
                    published: false,
                    updatedAt: new Date().toISOString()
                });
                alert('⏳ Event moved back to review. Organizer can edit and resubmit.');
                loadEvents();
            } catch (err) {
                console.error('Unpublish failed:', err);
                alert('Failed to unpublish event: ' + err.message);
            }
        }

        // ---- Cancel (approved → cancelled) with 3 warnings ----
        async function cancelApprovedEvent(id) {
            // Triple confirm
            if (!confirm('⚠️ WARNING 1/3: You are about to CANCEL this published event. This will remove it from public view. Proceed?')) return;
            if (!confirm('⚠️ WARNING 2/3: This action is permanent unless you later re-approve it. Continue?')) return;
            if (!confirm('⚠️ WARNING 3/3: Are you absolutely sure you want to cancel this event?')) return;
            try {
                await db.collection('events').doc(id).update({
                    status: 'cancelled',
                    published: false
                });
                alert('⛔ Event cancelled.');
                loadEvents();
            } catch (err) {
                console.error('Cancel failed:', err);
                alert('Failed to cancel event: ' + err.message);
            }
        }

        // ---- Approve Cancellation (cancellation_requested → cancelled) ----
        async function approveCancellation(id) {
            if (!confirm('Approve the cancellation request? The event will be cancelled and removed from public view.')) return;
            try {
                await db.collection('events').doc(id).update({
                    status: 'cancelled',
                    published: false,
                    cancellationApprovedAt: new Date().toISOString()
                });
                alert('✅ Cancellation approved. Event is now cancelled.');
                loadEvents();
            } catch (err) {
                console.error('Approve cancellation failed:', err);
                alert('Failed to approve cancellation: ' + err.message);
            }
        }

        // ---- Reject Cancellation (cancellation_requested → approved) ----
        async function rejectCancellation(id) {
            if (!confirm('Reject the cancellation request? The event will remain published.')) return;
            try {
                await db.collection('events').doc(id).update({
                    status: 'approved',
                    published: true,
                    cancellationRejectedAt: new Date().toISOString()
                });
                alert('❌ Cancellation rejected. Event remains published.');
                loadEvents();
            } catch (err) {
                console.error('Reject cancellation failed:', err);
                alert('Failed to reject cancellation: ' + err.message);
            }
        }

        // ---- Delete (permanent) with 3 warnings ----
        async function deleteEvent(id) {
            if (!confirm('⚠️ WARNING 1/3: You are about to PERMANENTLY DELETE this event. This cannot be undone. Proceed?')) return;
            if (!confirm('⚠️ WARNING 2/3: All ticket data and sales records will be removed. Continue?')) return;
            if (!confirm('⚠️ WARNING 3/3: Are you absolutely sure you want to delete this event forever?')) return;
            try {
                await db.collection('events').doc(id).delete();
                alert('🗑️ Event permanently deleted.');
                loadEvents();
            } catch (err) {
                console.error('Delete failed:', err);
                alert('Failed to delete event: ' + err.message);
            }
        }

        // ============================================================
        //  VIEW DETAILS MODAL (includes cancellation reason/contact)
        // ============================================================
        async function viewEventDetails(id) {
            const event = allEvents.find(e => e.id === id);
            if (!event) {
                alert('Event not found.');
                return;
            }

            const modal = document.getElementById('event-detail-modal');
            const content = document.getElementById('modal-content');

            let ticketDetails = '';
            if (event.ticketTypes && event.ticketTypes.length > 0) {
                event.ticketTypes.forEach((t, idx) => {
                    ticketDetails += `
                        <div class="ticket-detail">
                            <strong>${t.name || 'Ticket'}</strong> — $${t.price || 0} (${t.quantity || 0} available)
                            <p style="font-size:0.9rem;margin-top:5px;">${t.description || 'No description'}</p>
                            ${t.imageBase64 ? `
                                <img src="${t.imageBase64}" class="ticket-img" alt="${t.name} ticket">
                                <div class="button-group">
                                    <button class="btn btn-download btn-sm" onclick="downloadBase64('${t.imageBase64}', '${event.eventName.replace(/[^a-z0-9]/gi,'_')}_${(t.name||'ticket').replace(/[^a-z0-9]/gi,'_')}.jpg')"><i class="fas fa-download"></i> Download</button>
                                    <button class="btn btn-copy btn-sm" onclick="copyText('<img src=\\'${t.imageBase64}\\' alt=\\'${t.name} ticket\\' />', 'Ticket HTML copied!')"><i class="fas fa-code"></i> Copy HTML</button>
                                </div>
                            ` : '<p class="text-muted" style="font-size:0.85rem;">No ticket image.</p>'}
                        </div>
                    `;
                });
            } else {
                ticketDetails = '<p class="text-muted">No ticket types defined.</p>';
            }

            // Plain text and HTML for copying
            const plainText = getEventAsPlainText(event);
            const htmlText = getEventAsHTML(event);

            const statusLabel = event.status === 'pending' ? 'In Review' :
                event.status === 'approved' ? 'Published' :
                event.status === 'cancellation_requested' ? 'Cancellation Requested' :
                event.status.replace(/_/g, ' ').toUpperCase();

            // Cancellation request details (if any)
            let cancelDetails = '';
            if (event.status === 'cancellation_requested') {
                cancelDetails = `
                    <div class="cancel-reason-box">
                        <strong><i class="fas fa-info-circle"></i> Cancellation Request Details</strong>
                        <p><strong>Reason:</strong> ${event.cancellationReason || 'Not provided'}</p>
                        <p><strong>Phone:</strong> ${event.cancellationPhone || 'Not provided'}</p>
                        <p><strong>Email:</strong> ${event.cancellationEmail || 'Not provided'}</p>
                        <p style="font-size:0.8rem;color:#856404;">Requested on: ${event.cancellationRequestedAt ? new Date(event.cancellationRequestedAt).toLocaleString() : 'Unknown'}</p>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="modal-header">
                    <h2>${event.eventName || 'Untitled'}</h2>
                    <button class="modal-close" onclick="closeDetailModal()">&times;</button>
                </div>

                <div class="button-group" style="margin-bottom:18px;">
                    <button class="btn btn-copy btn-sm" onclick="copyText(\`${plainText.replace(/`/g,'\\`')}\`, 'Event details copied as text!')"><i class="fas fa-copy"></i> Copy as Text</button>
                    <button class="btn btn-copy btn-sm" onclick="copyText(\`${htmlText.replace(/`/g,'\\`')}\`, 'Event details copied as HTML!')"><i class="fas fa-code"></i> Copy as HTML</button>
                </div>

                ${cancelDetails}

                <div class="detail-grid">
                    <div class="detail-item"><label>Status</label><span class="status-badge status-${event.status}">${statusLabel}</span></div>
                    <div class="detail-item"><label>Organizer</label><p>${event.organizerName || 'N/A'} <span class="text-muted">${event.organizerEmail ? '('+event.organizerEmail+')' : ''}</span></p></div>
                    <div class="detail-item"><label>Type</label><p>${event.type || 'N/A'}</p></div>
                    <div class="detail-item"><label>Location</label><p>${event.location || 'N/A'}</p></div>
                    <div class="detail-item"><label>Start</label><p>${event.startDate ? new Date(event.startDate).toLocaleString() : 'N/A'}</p></div>
                    <div class="detail-item"><label>End</label><p>${event.endDate ? new Date(event.endDate).toLocaleString() : 'N/A'}</p></div>
                    <div class="detail-item"><label>Capacity</label><p>${event.capacity || 'Unlimited'}</p></div>
                    <div class="detail-item"><label>Age Restriction</label><p>${event.ageRestriction || 'None'}</p></div>
                </div>

                <div class="detail-item"><label>Description</label><p>${event.description || 'No description.'}</p></div>

                <div class="detail-item">
                    <label>Flier / Poster</label>
                    ${event.posterImage ? `
                        <img src="${event.posterImage}" style="max-width:300px;border-radius:8px;margin-top:10px;border:1px solid #eee;">
                        <div class="button-group">
                            <button class="btn btn-download btn-sm" onclick="downloadBase64('${event.posterImage}', '${event.eventName.replace(/[^a-z0-9]/gi,'_')}_flier.jpg')"><i class="fas fa-download"></i> Download</button>
                            <button class="btn btn-copy btn-sm" onclick="copyText('<img src=\\'${event.posterImage}\\' alt=\\'${event.eventName} flier\\' />', 'Flier HTML copied!')"><i class="fas fa-code"></i> Copy HTML</button>
                        </div>
                    ` : '<p class="text-muted">No poster uploaded.</p>'}
                </div>

                <h3 style="margin:20px 0 10px;color:var(--navy);"><i class="fas fa-ticket-alt"></i> Ticket Types</h3>
                ${ticketDetails}

                ${event.rejectionReason ? `
                    <div class="detail-item" style="margin-top:16px;padding:12px;background:#fff5f5;border-radius:8px;border-left:4px solid var(--pink);">
                        <label style="color:var(--pink);">Rejection Reason</label>
                        <p>${event.rejectionReason}</p>
                    </div>
                ` : ''}
            `;

            modal.style.display = 'flex';
        }

        function closeDetailModal() {
            document.getElementById('event-detail-modal').style.display = 'none';
        }

        // ============================================================
        //  HELPERS: copy, download, plain/text, HTML
        // ============================================================

        function downloadBase64(base64, filename) {
            if (!base64) { alert('No image to download.'); return; }
            const a = document.createElement('a');
            a.href = base64;
            a.download = filename || 'image.jpg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function copyText(text, successMsg) {
            navigator.clipboard.writeText(text).then(() => {
                alert(successMsg || 'Copied to clipboard!');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert(successMsg || 'Copied (fallback).');
            });
        }

        function getEventAsPlainText(event) {
            let txt = `Event: ${event.eventName || 'Untitled'}\n`;
            txt += `Status: ${event.status}\n`;
            txt += `Type: ${event.type || 'N/A'}\n`;
            txt += `Description: ${event.description || 'N/A'}\n`;
            txt += `Start: ${event.startDate ? new Date(event.startDate).toLocaleString() : 'N/A'}\n`;
            txt += `End: ${event.endDate ? new Date(event.endDate).toLocaleString() : 'N/A'}\n`;
            txt += `Location: ${event.location || 'N/A'}\n`;
            txt += `Capacity: ${event.capacity || 'Unlimited'}\n`;
            txt += `Organizer: ${event.organizerName || 'N/A'} (${event.organizerEmail || 'no email'})\n`;
            txt += `Age Restriction: ${event.ageRestriction || 'None'}\n\n`;
            txt += `Ticket Types:\n`;
            if (event.ticketTypes && event.ticketTypes.length) {
                event.ticketTypes.forEach(t => {
                    txt += `  - ${t.name || 'Unnamed'}: $${t.price || 0} (${t.quantity || 0} avail) ${t.description || ''}\n`;
                });
            } else {
                txt += '  None\n';
            }
            if (event.status === 'cancellation_requested') {
                txt += `\nCancellation Request:\n`;
                txt += `  Reason: ${event.cancellationReason || 'N/A'}\n`;
                txt += `  Phone: ${event.cancellationPhone || 'N/A'}\n`;
                txt += `  Email: ${event.cancellationEmail || 'N/A'}\n`;
            }
            return txt;
        }

        function getEventAsHTML(event) {
            let html = `<h2>${event.eventName || 'Untitled'}</h2>`;
            html += `<p><strong>Status:</strong> ${event.status}</p>`;
            html += `<p><strong>Type:</strong> ${event.type || 'N/A'}</p>`;
            html += `<p><strong>Description:</strong> ${event.description || 'N/A'}</p>`;
            html += `<p><strong>Start:</strong> ${event.startDate ? new Date(event.startDate).toLocaleString() : 'N/A'}</p>`;
            html += `<p><strong>End:</strong> ${event.endDate ? new Date(event.endDate).toLocaleString() : 'N/A'}</p>`;
            html += `<p><strong>Location:</strong> ${event.location || 'N/A'}</p>`;
            html += `<p><strong>Capacity:</strong> ${event.capacity || 'Unlimited'}</p>`;
            html += `<p><strong>Organizer:</strong> ${event.organizerName || 'N/A'} (${event.organizerEmail || 'no email'})</p>`;
            html += `<p><strong>Age Restriction:</strong> ${event.ageRestriction || 'None'}</p>`;
            if (event.posterImage) {
                html += `<p><strong>Flier:</strong><br><img src="${event.posterImage}" style="max-width:300px;height:auto;" /></p>`;
            }
            if (event.status === 'cancellation_requested') {
                html += `<div style="background:#fff3cd;padding:12px;border-radius:8px;margin:12px 0;">`;
                html += `<h4>Cancellation Request</h4>`;
                html += `<p><strong>Reason:</strong> ${event.cancellationReason || 'N/A'}</p>`;
                html += `<p><strong>Phone:</strong> ${event.cancellationPhone || 'N/A'}</p>`;
                html += `<p><strong>Email:</strong> ${event.cancellationEmail || 'N/A'}</p>`;
                html += `</div>`;
            }
            html += `<h3>Ticket Types</h3>`;
            if (event.ticketTypes && event.ticketTypes.length) {
                event.ticketTypes.forEach(t => {
                    html += `<div style="padding:8px 0;border-bottom:1px solid #eee;">`;
                    html += `<strong>${t.name || 'Unnamed'}</strong> — $${t.price || 0} (${t.quantity || 0} avail)`;
                    if (t.description) html += `<br><span style="font-size:0.9rem;">${t.description}</span>`;
                    if (t.imageBase64) {
                        html += `<br><img src="${t.imageBase64}" style="max-width:100px;height:auto;margin-top:4px;" />`;
                    }
                    html += `</div>`;
                });
            } else {
                html += `<p>None</p>`;
            }
            return html;
        }

        // ============================================================
        //  FILTER BUTTONS
        // ============================================================
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                applyFilter();
            });
        });

        // ============================================================
        //  CLOSE MODAL ON OUTSIDE CLICK
        // ============================================================
        window.onclick = function(event) {
            const modal = document.getElementById('event-detail-modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };

        // ============================================================
        //  AUTH
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log('✅ Admin logged in:', user.uid);
                loadEvents();
            } else {
                const email = prompt('🔐 Admin Login — Enter your email:');
                if (email) {
                    const password = prompt('Enter your password:');
                    if (password) {
                        auth.signInWithEmailAndPassword(email, password)
                            .then(() => {
                                alert('✅ Login successful!');
                            })
                            .catch((err) => {
                                alert('❌ Login failed: ' + err.message);
                                document.body.innerHTML = `
                                    <div style="padding:40px;text-align:center;color:var(--navy);">
                                        <h2>Access Denied</h2>
                                        <p class="text-muted">Please refresh to try again.</p>
                                    </div>`;
                            });
                    }
                } else {
                    document.body.innerHTML = `
                        <div style="padding:40px;text-align:center;color:var(--navy);">
                            <h2>Authentication Required</h2>
                            <p class="text-muted">Refresh the page to log in.</p>
                        </div>`;
                }
            }
        });
    </script>

</body>
</html>
