<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone21 Admin – Event Publishing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800;
            --pink: #F80070;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-muted: #6c757d;
            --border: #e0e0e8;
            --radius: 16px;
            --shadow: 0 8px 30px rgba(16, 40, 56, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
        .container { max-width: 1300px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; flex-wrap: wrap; gap: 15px;
        }
        .header h1 { font-size: 2rem; font-weight: 800; color: var(--navy); }
        .btn {
            padding: 10px 20px; border-radius: 30px; font-weight: 600; font-size: 0.9rem;
            cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-lime { background: var(--lime); color: var(--navy); }
        .btn-lime:hover { background: #d0d800; transform: translateY(-2px); }
        .btn-pink { background: var(--pink); color: white; }
        .btn-pink:hover { background: #d0005e; transform: translateY(-2px); }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--navy); }
        .btn-outline:hover { background: #f0f0f0; }
        .btn-navy { background: var(--navy); color: var(--lime); }
        .btn-navy:hover { background: #1a3a4a; }
        .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
        .card h2 { font-size: 1.4rem; font-weight: 700; color: var(--navy); margin-bottom: 20px; border-bottom: 3px solid var(--lime); padding-bottom: 10px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: var(--navy); font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 0.9rem; outline: none; transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--lime); }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .helper { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        .poster-preview { width: 100%; max-width: 300px; height: auto; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border); }
        .ticket-type-row {
            background: #fafbfc; border: 1px solid var(--border); border-radius: 12px;
            padding: 15px; margin-bottom: 15px; position: relative;
        }
        .ticket-type-row .remove-btn {
            position: absolute; top: 10px; right: 10px; background: none; border: none;
            color: var(--pink); font-size: 1.2rem; cursor: pointer;
        }
        .ticket-preview { max-width: 120px; height: auto; margin-top: 10px; border-radius: 8px; }
        .add-ticket-btn { background: var(--navy); color: var(--lime); border: none; border-radius: 30px; padding: 10px 20px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .add-ticket-btn:hover { background: #1a3a4a; }
        .btn-submit { background: var(--lime); color: var(--navy); border: none; border-radius: 30px; padding: 14px 30px; font-size: 1.1rem; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-submit:hover { background: #d0d800; transform: translateY(-2px); }
        .btn-cancel-form { background: #f0f0f0; color: var(--navy); border: none; border-radius: 30px; padding: 12px 24px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .events-list { margin-top: 20px; }
        .event-item {
            background: white; border: 1px solid var(--border); border-radius: 12px;
            padding: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;
        }
        .event-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
        .event-info { flex: 1; min-width: 200px; }
        .event-info .name { font-weight: 700; color: var(--navy); }
        .event-info .meta { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .status-published { background: #d4edda; color: #155724; }
        .status-unpublished { background: #e2e3e5; color: #383d41; }
        .actions { display: flex; gap: 8px; }
        .hidden { display: none; }
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; }
            .event-item { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-globe" style="color:var(--pink);"></i> Zone21 Admin – Event Publishing</h1>
            <button class="btn btn-lime" id="show-create-form"><i class="fas fa-plus"></i> Create New Event</button>
        </div>

        <!-- Event Creation Form (hidden by default) -->
        <div class="card hidden" id="event-form-card">
            <h2>Event Information</h2>
            <form id="event-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Event Name *</label>
                        <input type="text" id="eventName" required>
                    </div>
                    <div class="form-group">
                        <label>Event Type *</label>
                        <select id="eventType" required>
                            <option value="">Select type...</option>
                            <option>Conference</option>
                            <option>Music Festival</option>
                            <option>Corporate Gala</option>
                            <option>Wedding</option>
                            <option>Brand Launch</option>
                            <option>Private Party</option>
                            <option>Exhibition</option>
                            <option>Sporting Event</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="eventDescription" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Start Date & Time *</label>
                        <input type="datetime-local" id="startDate" required>
                    </div>
                    <div class="form-group">
                        <label>End Date & Time *</label>
                        <input type="datetime-local" id="endDate" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Location / Venue *</label>
                        <input type="text" id="location" required>
                    </div>
                    <div class="form-group">
                        <label>Total Capacity *</label>
                        <input type="number" id="capacity" min="1" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Organizer Contact Name *</label>
                        <input type="text" id="organizerName" required>
                    </div>
                    <div class="form-group">
                        <label>Organizer Email *</label>
                        <input type="email" id="organizerEmail" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Organizer Phone</label>
                    <input type="tel" id="organizerPhone">
                </div>
                <div class="form-group">
                    <label>Event Poster Image</label>
                    <input type="file" id="posterUpload" accept="image/*">
                    <div class="helper">Recommended 1200x800px. Will be compressed.</div>
                    <img id="posterPreview" class="poster-preview" style="display:none;" alt="Poster Preview">
                </div>
                <div class="form-group">
                    <label>Age Restriction (optional)</label>
                    <input type="text" id="ageRestriction" placeholder="e.g., 18+">
                </div>
                <div class="form-group">
                    <label>Dress Code (optional)</label>
                    <input type="text" id="dressCode" placeholder="e.g., Formal / Smart Casual">
                </div>
                <div class="form-group">
                    <label>Visibility / Publication Status</label>
                    <select id="publishStatus">
                        <option value="published">Published (visible to public)</option>
                        <option value="unpublished">Unpublished (draft)</option>
                    </select>
                </div>
            </form>
        </div>

        <!-- Ticket Types -->
        <div class="card hidden" id="ticket-types-card">
            <h2>Ticket Types</h2>
            <div id="ticket-types-container"></div>
            <button type="button" class="add-ticket-btn" id="add-ticket-btn"><i class="fas fa-plus"></i> Add Ticket Type</button>
            <p class="helper" style="margin-top:10px;">Add at least one ticket type. Each can have its own price, quantity, description, and custom image.</p>
        </div>

        <!-- Submit -->
        <div class="card hidden" id="submit-card">
            <button type="button" class="btn-submit" id="submit-event"><i class="fas fa-paper-plane"></i> Save Event</button>
            <button type="button" class="btn-cancel-form" id="cancel-create">Cancel</button>
        </div>

        <!-- Events List -->
        <div class="card events-list">
            <h2>All Events</h2>
            <div id="events-list">
                <p class="helper">Loading events...</p>
            </div>
        </div>
    </div>

    <script>
        // ============ FIREBASE ============
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============ STATE ============
        let ticketCount = 0;
        let isEditing = false;
        let editingEventId = null;

        // ============ DOM ============
        const showCreateBtn = document.getElementById('show-create-form');
        const eventFormCard = document.getElementById('event-form-card');
        const ticketTypesCard = document.getElementById('ticket-types-card');
        const submitCard = document.getElementById('submit-card');
        const cancelCreateBtn = document.getElementById('cancel-create');
        const eventForm = document.getElementById('event-form');

        // ============ SHOW/HIDE FORM ============
        showCreateBtn.addEventListener('click', () => {
            resetForm();
            eventFormCard.classList.remove('hidden');
            ticketTypesCard.classList.remove('hidden');
            submitCard.classList.remove('hidden');
            showCreateBtn.style.display = 'none';
        });

        cancelCreateBtn.addEventListener('click', () => {
            eventFormCard.classList.add('hidden');
            ticketTypesCard.classList.add('hidden');
            submitCard.classList.add('hidden');
            showCreateBtn.style.display = 'block';
            resetForm();
        });

        function resetForm() {
            eventForm.reset();
            document.getElementById('ticket-types-container').innerHTML = '';
            document.getElementById('posterPreview').style.display = 'none';
            document.getElementById('posterPreview').src = '';
            document.getElementById('publishStatus').value = 'published';
            document.getElementById('submit-event').innerHTML = '<i class="fas fa-paper-plane"></i> Save Event';
            isEditing = false;
            editingEventId = null;
            addTicketType();
        }

        // ============ IMAGE HANDLING ============
        function fileToBase64(file, maxDimension = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > maxDimension || height > maxDimension) {
                            if (width > height) {
                                height = Math.round((height * maxDimension) / width);
                                width = maxDimension;
                            } else {
                                width = Math.round((width * maxDimension) / height);
                                height = maxDimension;
                            }
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function handlePosterUpload(file) {
            if (!file) return null;
            try {
                const base64 = await fileToBase64(file, 800, 0.7);
                document.getElementById('posterPreview').src = base64;
                document.getElementById('posterPreview').style.display = 'block';
                return base64;
            } catch (e) {
                alert('Failed to process poster image.');
                return null;
            }
        }

        async function handleTicketImageUpload(file, previewId) {
            if (!file) return null;
            try {
                const base64 = await fileToBase64(file, 400, 0.7);
                const preview = document.getElementById(previewId);
                if (preview) { preview.src = base64; preview.style.display = 'block'; }
                return base64;
            } catch (e) {
                alert('Failed to process ticket image.');
                return null;
            }
        }

        // ============ TICKET TYPES ============
        function addTicketType() {
            ticketCount++;
            const container = document.getElementById('ticket-types-container');
            const div = document.createElement('div');
            div.className = 'ticket-type-row';
            div.id = `ticket-row-${ticketCount}`;
            div.innerHTML = `
                <button type="button" class="remove-btn" onclick="removeTicketType(${ticketCount})"><i class="fas fa-times"></i></button>
                <div class="form-row">
                    <div class="form-group">
                        <label>Ticket Name *</label>
                        <input type="text" class="ticket-name" placeholder="e.g., Ordinary, VIP, VVIP" required>
                    </div>
                    <div class="form-group">
                        <label>Price (USD) *</label>
                        <input type="number" class="ticket-price" min="0" step="0.01" value="0" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Quantity Available *</label>
                        <input type="number" class="ticket-quantity" min="1" value="100" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" class="ticket-description" placeholder="e.g., Includes VIP lounge">
                    </div>
                </div>
                <div class="form-group">
                    <label>Custom Ticket Design (optional)</label>
                    <input type="file" class="ticket-image-upload" accept="image/*" onchange="previewTicketImage(this, ${ticketCount})">
                    <img id="ticket-preview-${ticketCount}" class="ticket-preview" style="display:none;" alt="Ticket Preview">
                </div>
            `;
            container.appendChild(div);
        }

        function removeTicketType(id) {
            const row = document.getElementById(`ticket-row-${id}`);
            if (row) row.remove();
        }

        function previewTicketImage(input, id) {
            const file = input.files[0];
            if (file) {
                const preview = document.getElementById(`ticket-preview-${id}`);
                const reader = new FileReader();
                reader.onload = function(e) { preview.src = e.target.result; preview.style.display = 'block'; };
                reader.readAsDataURL(file);
            }
        }

        async function collectTicketTypes() {
            const rows = document.querySelectorAll('.ticket-type-row');
            if (rows.length === 0) {
                alert('Add at least one ticket type.');
                return null;
            }
            const ticketTypes = [];
            for (let row of rows) {
                const name = row.querySelector('.ticket-name').value.trim();
                const price = parseFloat(row.querySelector('.ticket-price').value);
                const quantity = parseInt(row.querySelector('.ticket-quantity').value);
                const description = row.querySelector('.ticket-description').value.trim();
                const imageInput = row.querySelector('.ticket-image-upload');
                let imageBase64 = null;
                if (imageInput.files && imageInput.files[0]) {
                    imageBase64 = await handleTicketImageUpload(imageInput.files[0], `ticket-preview-${row.id.split('-')[2]}`);
                }
                if (!name || isNaN(price) || isNaN(quantity)) {
                    alert('Fill all required ticket fields.');
                    return null;
                }
                ticketTypes.push({ name, price, quantity, description, imageBase64, template: 'classic' });
            }
            return ticketTypes;
        }

        // ============ SAVE EVENT ============
        document.getElementById('submit-event').addEventListener('click', async () => {
            if (!eventForm.checkValidity()) {
                eventForm.reportValidity();
                return;
            }
            const posterInput = document.getElementById('posterUpload');
            let posterBase64 = document.getElementById('posterPreview').src || null;
            if (posterInput.files && posterInput.files[0]) {
                posterBase64 = await handlePosterUpload(posterInput.files[0]);
            }
            const ticketTypes = await collectTicketTypes();
            if (!ticketTypes) return;

            const eventData = {
                eventName: document.getElementById('eventName').value.trim(),
                type: document.getElementById('eventType').value,
                description: document.getElementById('eventDescription').value.trim(),
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                location: document.getElementById('location').value.trim(),
                capacity: parseInt(document.getElementById('capacity').value),
                organizerName: document.getElementById('organizerName').value.trim(),
                organizerEmail: document.getElementById('organizerEmail').value.trim(),
                organizerPhone: document.getElementById('organizerPhone').value.trim(),
                ageRestriction: document.getElementById('ageRestriction').value.trim(),
                dressCode: document.getElementById('dressCode').value.trim(),
                posterImage: posterBase64,
                ticketTypes: ticketTypes,
                status: 'approved',            // admin-created events are automatically approved
                published: document.getElementById('publishStatus').value === 'published' ? true : false,
                createdAt: isEditing ? (await db.collection('events').doc(editingEventId).get()).data().createdAt : new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                id: isEditing ? editingEventId : 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6)
            };

            try {
                if (isEditing) {
                    await db.collection('events').doc(editingEventId).update(eventData);
                    alert('Event updated successfully.');
                } else {
                    await db.collection('events').doc(eventData.id).set(eventData);
                    alert('Event created and published!');
                }
                resetForm();
                eventFormCard.classList.add('hidden');
                ticketTypesCard.classList.add('hidden');
                submitCard.classList.add('hidden');
                showCreateBtn.style.display = 'block';
                loadEvents();
            } catch (err) {
                console.error('Save error:', err);
                alert('Failed to save event.');
            }
        });

        // ============ LOAD EVENTS ============
        async function loadEvents() {
            const listDiv = document.getElementById('events-list');
            listDiv.innerHTML = '<p class="helper">Loading...</p>';
            try {
                const snapshot = await db.collection('events').orderBy('createdAt', 'desc').get();
                listDiv.innerHTML = '';
                if (snapshot.empty) {
                    listDiv.innerHTML = '<p class="helper">No events yet.</p>';
                    return;
                }
                snapshot.forEach(doc => {
                    const ev = doc.data();
                    ev.id = doc.id;
                    const div = document.createElement('div');
                    div.className = 'event-item';
                    const posterHtml = ev.posterImage ? `<img src="${ev.posterImage}" alt="${ev.eventName}">` : '<div style="width:70px;height:70px;background:#eee;border-radius:8px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-image"></i></div>';
                    const published = ev.published === true;
                    div.innerHTML = `
                        ${posterHtml}
                        <div class="event-info">
                            <div class="name">${ev.eventName}</div>
                            <div class="meta">
                                <i class="far fa-calendar-alt"></i> ${new Date(ev.startDate).toLocaleDateString()} ·
                                <i class="fas fa-map-marker-alt"></i> ${ev.location}
                            </div>
                        </div>
                        <span class="status-badge ${published ? 'status-published' : 'status-unpublished'}">${published ? 'Published' : 'Unpublished'}</span>
                        <div class="actions">
                            <button class="btn btn-navy" onclick="editEvent('${ev.id}')"><i class="fas fa-edit"></i></button>
                            <button class="btn ${published ? 'btn-pink' : 'btn-lime'}" onclick="togglePublish('${ev.id}', ${!published})">
                                <i class="fas ${published ? 'fa-eye-slash' : 'fa-eye'}"></i> ${published ? 'Unpublish' : 'Publish'}
                            </button>
                            <button class="btn btn-pink" onclick="deleteEvent('${ev.id}')"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    listDiv.appendChild(div);
                });
            } catch (err) {
                console.error('Load error:', err);
                listDiv.innerHTML = '<p class="helper">Failed to load events.</p>';
            }
        }

        // ============ EDIT & ACTIONS ============
        window.editEvent = function(eventId) {
            db.collection('events').doc(eventId).get().then(doc => {
                if (doc.exists) {
                    const ev = doc.data();
                    isEditing = true;
                    editingEventId = eventId;
                    showCreateBtn.style.display = 'none';
                    eventFormCard.classList.remove('hidden');
                    ticketTypesCard.classList.remove('hidden');
                    submitCard.classList.remove('hidden');

                    document.getElementById('eventName').value = ev.eventName;
                    document.getElementById('eventType').value = ev.type;
                    document.getElementById('eventDescription').value = ev.description;
                    document.getElementById('startDate').value = ev.startDate;
                    document.getElementById('endDate').value = ev.endDate;
                    document.getElementById('location').value = ev.location;
                    document.getElementById('capacity').value = ev.capacity;
                    document.getElementById('organizerName').value = ev.organizerName;
                    document.getElementById('organizerEmail').value = ev.organizerEmail;
                    document.getElementById('organizerPhone').value = ev.organizerPhone || '';
                    document.getElementById('ageRestriction').value = ev.ageRestriction || '';
                    document.getElementById('dressCode').value = ev.dressCode || '';
                    document.getElementById('publishStatus').value = ev.published ? 'published' : 'unpublished';
                    if (ev.posterImage) {
                        document.getElementById('posterPreview').src = ev.posterImage;
                        document.getElementById('posterPreview').style.display = 'block';
                    } else {
                        document.getElementById('posterPreview').style.display = 'none';
                    }
                    // ticket types
                    document.getElementById('ticket-types-container').innerHTML = '';
                    ticketCount = 0;
                    ev.ticketTypes.forEach(tt => {
                        addTicketType();
                        const lastRow = document.querySelector('.ticket-type-row:last-child');
                        lastRow.querySelector('.ticket-name').value = tt.name;
                        lastRow.querySelector('.ticket-price').value = tt.price;
                        lastRow.querySelector('.ticket-quantity').value = tt.quantity;
                        lastRow.querySelector('.ticket-description').value = tt.description || '';
                        if (tt.imageBase64) {
                            lastRow.querySelector('.ticket-preview').src = tt.imageBase64;
                            lastRow.querySelector('.ticket-preview').style.display = 'block';
                        }
                    });
                    document.getElementById('submit-event').innerHTML = '<i class="fas fa-save"></i> Update Event';
                }
            });
        };

        window.togglePublish = async function(eventId, newStatus) {
            try {
                await db.collection('events').doc(eventId).update({ published: newStatus });
                loadEvents();
            } catch (err) {
                alert('Update failed.');
            }
        };

        window.deleteEvent = async function(eventId) {
            if (confirm('Delete this event permanently?')) {
                try {
                    await db.collection('events').doc(eventId).delete();
                    loadEvents();
                } catch (err) {
                    alert('Delete failed.');
                }
            }
        };

        // ============ INIT ============
        document.getElementById('add-ticket-btn').addEventListener('click', addTicketType);
        document.getElementById('posterUpload').addEventListener('change', async function() {
            if (this.files[0]) await handlePosterUpload(this.files[0]);
        });

        // initial load
        loadEvents();
