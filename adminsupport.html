<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone21 | Admin Support Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root{--navy:#102838;--lime:#C0C800;--pink:#F80070;--bg:#f5f7fa;--card:#fff;--text:#1a1a2e;--muted:#6c757d;--border:#e0e0e8;--radius:16px;--shadow:0 8px 30px rgba(16,40,56,0.08)}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        body{background:var(--bg);color:var(--text);padding:20px;min-height:100vh}
        .container{max-width:1300px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:15px}
        .header h1{font-size:2rem;font-weight:800;color:var(--navy)}
        .btn{padding:10px 20px;border-radius:30px;font-weight:700;font-size:.9rem;cursor:pointer;border:none;transition:.3s;display:inline-flex;align-items:center;gap:8px}
        .btn-outline{background:#fff;border:1px solid var(--border);color:var(--navy)}.btn-outline:hover{background:#f0f0f0}
        .btn-lime{background:var(--lime);color:var(--navy)}.btn-lime:hover{background:#d0d800}
        .btn-pink{background:var(--pink);color:#fff}.btn-pink:hover{background:#d0005e}
        .btn-navy{background:var(--navy);color:var(--lime)}.btn-navy:hover{background:#1a3a4a}
        .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;margin-bottom:25px}
        .stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:var(--shadow);text-align:center}
        .stat-value{font-size:2rem;font-weight:800;color:var(--navy)}.stat-label{font-size:.8rem;color:var(--muted)}
        .tab-nav{display:flex;gap:5px;background:#fff;border-radius:40px;padding:6px;margin-bottom:25px;box-shadow:var(--shadow);overflow-x:auto}
        .tab-btn{flex:1;min-width:120px;padding:12px 18px;border-radius:30px;border:none;cursor:pointer;font-weight:700;font-size:.85rem;transition:.3s;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
        .tab-btn.active{background:var(--navy);color:var(--lime)}
        .tab-btn .badge{background:var(--pink);color:#fff;font-size:.7rem;padding:2px 8px;border-radius:15px;font-weight:700}
        .tab-content{display:none}.tab-content.active{display:block}
        .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:25px;margin-bottom:20px}
        .card h2{font-size:1.2rem;font-weight:700;color:var(--navy);margin-bottom:15px;border-bottom:3px solid var(--lime);padding-bottom:10px}
        .message-card{background:#fafbfc;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;transition:.2s}
        .message-card.unread{border-left:4px solid var(--pink);background:#fff5f8}
        .msg-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
        .msg-sender{font-weight:700;color:var(--navy)}
        .msg-type{font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:20px;text-transform:uppercase}
        .type-query{background:#e3f2fd;color:#1565c0}.type-payment{background:#fff3e0;color:#e65100}.type-chat{background:#e8f5e9;color:#2e7d32}
        .msg-body{font-size:.9rem;color:#444;margin-bottom:10px}
        .msg-proof{max-width:150px;border-radius:8px;margin:10px 0}
        .msg-actions{display:flex;gap:8px;flex-wrap:wrap}
        .msg-time{font-size:.75rem;color:#aaa;margin-top:8px}
        .reply-box{display:none;margin-top:12px;background:#fff;border-radius:10px;padding:15px;border:1px solid var(--border)}
        .reply-box textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;min-height:70px;resize:vertical;margin-bottom:10px;font-size:.9rem;outline:none}
        .template-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
        .template-btn{background:#f0f4f8;border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:.75rem;cursor:pointer;transition:.2s;font-weight:600}
        .template-btn:hover{background:var(--navy);color:var(--lime)}
        .form-group{margin-bottom:15px}
        .form-group label{display:block;font-weight:600;margin-bottom:5px;color:var(--navy);font-size:.85rem}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.9rem;outline:none;background:#fafbfc}
        .form-group textarea{min-height:80px;resize:vertical}
        .template-card{background:#fafbfc;border:1px solid var(--border);border-radius:10px;padding:15px;margin-bottom:10px}
        .template-card .template-title{font-weight:700;color:var(--navy);margin-bottom:5px}
        .template-card .template-content{font-size:.85rem;color:#555}
        .search-box{display:flex;gap:10px;margin-bottom:15px}
        .search-box input{flex:1;padding:10px 15px;border:1.5px solid var(--border);border-radius:25px;font-size:.9rem;outline:none}
        .user-list{max-height:300px;overflow-y:auto}
        .user-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #f0f0f0;cursor:pointer}
        .user-item:hover{background:#f5f7fa}
        .user-item img{width:40px;height:40px;border-radius:50%;object-fit:cover}
        .user-item .user-info{flex:1}
        .user-item .user-name{font-weight:600;color:var(--navy)}
        .user-item .user-email{font-size:.8rem;color:var(--muted)}
        .chat-messages{max-height:400px;overflow-y:auto;margin-bottom:12px}
        .chat-message{display:flex;gap:8px;margin-bottom:12px;max-width:85%}
        .chat-message.admin{margin-left:auto;flex-direction:row-reverse}
        .chat-message .msg-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--lime);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;flex-shrink:0}
        .chat-message.user .msg-avatar{background:var(--lime);color:var(--navy)}
        .chat-message .msg-bubble{background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;font-size:.85rem;line-height:1.4}
        .chat-message.user .msg-bubble{background:#fff;color:var(--text);border:1px solid var(--border)}
        .chat-message .msg-time{font-size:.65rem;color:#aaa;margin-top:3px}
        .chat-attachment{max-width:200px;border-radius:8px;margin-top:5px}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center}
        .modal-content{background:#fff;border-radius:16px;padding:25px;max-width:600px;width:95%;max-height:90vh;overflow-y:auto}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
        .modal-header h3{color:var(--navy)}
        .modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer}
        @media(max-width:700px){.tab-btn{min-width:80px;font-size:.7rem;padding:8px 10px}}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-headset" style="color:var(--pink);"></i> Admin Support Panel</h1>
        <a href="dashboard.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="stats-row">
        <div class="stat-card"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total Messages</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-unread">0</div><div class="stat-label">Unread</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-payments">0</div><div class="stat-label">Payment Proofs</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-queries">0</div><div class="stat-label">Queries</div></div>
    </div>

    <div class="tab-nav">
        <button class="tab-btn active" data-tab="inbox"><i class="fas fa-inbox"></i> Inbox <span class="badge" id="inbox-badge" style="display:none;">0</span></button>
        <button class="tab-btn" data-tab="search"><i class="fas fa-search"></i> Search Users</button>
        <button class="tab-btn" data-tab="broadcast"><i class="fas fa-bullhorn"></i> System Update</button>
        <button class="tab-btn" data-tab="templates"><i class="fas fa-envelope-open-text"></i> Templates</button>
    </div>

    <div class="tab-content active" id="tab-inbox">
        <div class="card"><h2>All Messages</h2><div id="inbox-list"></div></div>
    </div>

    <div class="tab-content" id="tab-search">
        <div class="card">
            <h2>Search Users & Send Direct Message</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search by name or email...">
                <button class="btn btn-lime" onclick="searchUsers()"><i class="fas fa-search"></i> Search</button>
            </div>
            <div class="user-list" id="user-list"></div>
        </div>
    </div>

    <div class="tab-content" id="tab-broadcast">
        <div class="card">
            <h2>Send System Update Notification</h2>
            <form id="broadcastForm">
                <div class="form-group"><label>Notification Title *</label><input type="text" id="broadcastTitle" required></div>
                <div class="form-group"><label>Notification Message *</label><textarea id="broadcastMessage" required></textarea></div>
                <div class="form-group"><label>Target Audience *</label><select id="broadcastTarget" required><option value="">Select...</option><option value="all">All Users</option><option value="organizers">Organizers Only</option><option value="service_providers">Service Providers Only</option><option value="attendees">Attendees Only</option></select></div>
                <button type="submit" class="btn btn-pink btn-block"><i class="fas fa-bullhorn"></i> Send</button>
            </form>
        </div>
    </div>

    <div class="tab-content" id="tab-templates">
        <div class="card">
            <h2>Notification Templates</h2>
            <div id="templates-list"></div>
            <button class="btn btn-lime" onclick="addNewTemplate()"><i class="fas fa-plus"></i> Add Template</button>
        </div>
    </div>
</div>

<!-- Direct Message Modal -->
<div class="modal" id="dmModal">
    <div class="modal-content">
        <div class="modal-header"><h3>Send Direct Message</h3><button class="modal-close" onclick="closeDmModal()">&times;</button></div>
        <div id="dm-user-info" style="margin-bottom:15px;"></div>
        <textarea id="dm-message" placeholder="Type your message..." style="width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;min-height:100px;resize:vertical;margin-bottom:10px;"></textarea>
        <input type="file" id="dm-image-input" accept="image/*" style="display:none;" onchange="previewDmImage(this)">
        <img id="dm-image-preview" style="max-width:100%;border-radius:8px;display:none;margin-bottom:10px;">
        <div style="display:flex;gap:10px;">
            <button class="btn btn-lime" onclick="sendDirectMessage()"><i class="fas fa-paper-plane"></i> Send</button>
            <button class="btn btn-outline" onclick="document.getElementById('dm-image-input').click()"><i class="fas fa-image"></i> Attach Image</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
        authDomain: "zone21.firebaseapp.com",
        projectId: "zone21",
        storageBucket: "zone21.firebasestorage.app",
        messagingSenderId: "405963057292",
        appId: "1:405963057292:web:80e9923ae84eb7029073a9",
        measurementId: "G-KE007Y89F1"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentReplyDocId = null;
    let currentDmUserId = null;
    let dmImageBase64 = null;

    auth.onAuthStateChanged(user => { if(user) loadAllData(); });

    const defaultTemplates = [
        { id:'tpl_payment_approved', title:'Payment Approved', content:'Your payment has been approved. Thank you for choosing Zone21! 🎉' },
        { id:'tpl_issue_resolved', title:'Issue Resolved', content:'Your issue has been resolved. If you need further assistance, please contact us.' },
        { id:'tpl_investigating', title:'We Are Investigating', content:'We are currently investigating your issue. We will update you shortly.' },
        { id:'tpl_more_info', title:'Need More Information', content:'We need more information to process your request. Please provide additional details.' },
        { id:'tpl_welcome', title:'Welcome to Zone21', content:'Welcome to Zone21! Your account has been successfully created. 🎉' }
    ];

    function loadAllData(){ loadInbox(); loadStats(); loadTemplates(); }
    function loadStats(){ db.collection('messages').onSnapshot(snap=>{ let total=0,unread=0,payments=0,queries=0; snap.forEach(d=>{ const data=d.data(); total++; if(data.status==='unread'||data.status==='pending') unread++; if(data.type==='payment_proof') payments++; if(data.type==='general_query') queries++; }); document.getElementById('stat-total').textContent=total; document.getElementById('stat-unread').textContent=unread; document.getElementById('stat-payments').textContent=payments; document.getElementById('stat-queries').textContent=queries; }); }
    function loadInbox(){ db.collection('messages').orderBy('createdAt','desc').limit(100).onSnapshot(snap=>{ const list=document.getElementById('inbox-list'); list.innerHTML=''; let unread=0; snap.forEach(doc=>{ const d=doc.data(); d.id=doc.id; if(d.status==='unread'||d.status==='pending') unread++; list.appendChild(createMessageCard(d)); }); const badge=document.getElementById('inbox-badge'); badge.style.display=unread>0?'inline':'none'; badge.textContent=unread; }); }
    function createMessageCard(d){ const div=document.createElement('div'); div.className=`message-card ${d.status==='unread'||d.status==='pending'?'unread':''}`; const typeClass=d.type==='payment_proof'?'type-payment':d.type==='general_query'?'type-query':'type-chat'; const typeLabel=d.type==='payment_proof'?'Payment Proof':d.type==='general_query'?'Query':'Chat'; let proofHtml=d.proofImage?`<img src="${d.proofImage}" class="msg-proof">`:''; let imgHtml=d.image?`<img src="${d.image}" class="msg-proof">`:''; div.innerHTML=`<div class="msg-header"><span class="msg-sender"><i class="fas fa-user"></i> ${d.name||d.sender||'Unknown'}</span><span class="msg-type ${typeClass}">${typeLabel}</span></div>${d.phone?`<div style="font-size:.8rem;color:#666;"><i class="fas fa-phone"></i> ${d.phone}</div>`:''}${d.email&&d.email!=='Not provided'?`<div style="font-size:.8rem;color:#666;"><i class="fas fa-envelope"></i> ${d.email}</div>`:''}${d.method?`<div style="font-size:.8rem;color:#666;"><i class="fas fa-credit-card"></i> ${d.method} - $${d.amount||0}</div>`:''}<div class="msg-body">${d.message||d.subject||''}</div>${proofHtml}${imgHtml}<div class="msg-time">${d.createdAt?d.createdAt.toDate().toLocaleString():'Just now'}</div><div class="msg-actions"><button class="btn btn-lime" onclick="openReplyModal('${d.id}','${d.senderId||''}')" style="padding:6px 14px;font-size:.75rem;"><i class="fas fa-reply"></i> Reply</button><button class="btn btn-navy" onclick="markResolved('${d.id}')" style="padding:6px 14px;font-size:.75rem;"><i class="fas fa-check"></i> Resolve</button></div>`; return div; }

    function openReplyModal(docId,userId){ currentReplyDocId=docId; currentDmUserId=userId; db.collection('messages').doc(docId).get().then(doc=>{ const d=doc.data(); document.getElementById('dm-user-info').innerHTML=`<strong>From:</strong> ${d.name||'User'}<br><strong>Message:</strong> ${d.message||d.subject||'Payment proof'}`; }); loadTemplatesIntoReply(); document.getElementById('dmModal').style.display='flex'; }
    function loadTemplatesIntoReply(){ const container=document.getElementById('replyTemplates'); container.innerHTML=''; db.collection('templates').get().then(snap=>{ if(snap.empty){ defaultTemplates.forEach(t=>{ container.innerHTML+=`<button class="template-btn" onclick="useTemplate('${t.content.replace(/'/g,"\\'")}')">${t.title}</button>`; }); } else { snap.forEach(doc=>{ const t=doc.data(); container.innerHTML+=`<button class="template-btn" onclick="useTemplate('${t.content.replace(/'/g,"\\'")}')">${t.title}</button>`; }); } }); }
    function useTemplate(content){ document.getElementById('dm-message').value=content; }
    function closeDmModal(){ document.getElementById('dmModal').style.display='none'; document.getElementById('dm-message').value=''; document.getElementById('dm-image-preview').style.display='none'; dmImageBase64=null; currentReplyDocId=null; currentDmUserId=null; }
    async function sendDirectMessage(){ const msg=document.getElementById('dm-message').value.trim(); if(!msg&&!dmImageBase64) return; try{ await db.collection('messages').add({ sender:'admin', senderId:currentDmUserId||'user', message:msg, image:dmImageBase64||null, type:'chat', status:'unread', createdAt:firebase.firestore.FieldValue.serverTimestamp() }); if(currentReplyDocId){ await db.collection('messages').doc(currentReplyDocId).update({status:'resolved'}); } closeDmModal(); alert('Message sent!'); loadInbox(); }catch(err){ alert('Failed to send.'); } }
    function previewDmImage(input){ const file=input.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=e=>{ dmImageBase64=e.target.result; document.getElementById('dm-image-preview').src=dmImageBase64; document.getElementById('dm-image-preview').style.display='block'; }; reader.readAsDataURL(file); }
    function markResolved(docId){ db.collection('messages').doc(docId).update({status:'resolved'}); loadInbox(); }

    function searchUsers(){ const query=document.getElementById('search-input').value.trim(); if(!query) return; db.collection('users').where('name','>=',query).where('name','<=',query+'\uf8ff').limit(10).get().then(snap=>{ const list=document.getElementById('user-list'); list.innerHTML=''; if(snap.empty){ list.innerHTML='<p>No users found.</p>'; return; } snap.forEach(doc=>{ const u=doc.data(); u.id=doc.id; const div=document.createElement('div'); div.className='user-item'; div.innerHTML=`<div class="user-info"><div class="user-name">${u.name||'No name'}</div><div class="user-email">${u.email||'No email'}</div></div><button class="btn btn-lime" onclick="openDm('${doc.id}','${u.name||'User'}')" style="padding:4px 12px;font-size:.75rem;">Message</button>`; list.appendChild(div); }); }); }
    function openDm(userId,userName){ currentDmUserId=userId; document.getElementById('dm-user-info').innerHTML=`<strong>To:</strong> ${userName}`; document.getElementById('dm-message').value=''; document.getElementById('dm-image-preview').style.display='none'; dmImageBase64=null; document.getElementById('dmModal').style.display='flex'; }

    function loadTemplates(){ const list=document.getElementById('templates-list'); list.innerHTML=''; db.collection('templates').get().then(snap=>{ if(snap.empty){ defaultTemplates.forEach(t=>{ const div=document.createElement('div'); div.className='template-card'; div.innerHTML=`<div class="template-title">${t.title}</div><div class="template-content">${t.content}</div>`; list.appendChild(div); }); } else { snap.forEach(doc=>{ const t=doc.data(); const div=document.createElement('div'); div.className='template-card'; div.innerHTML=`<div class="template-title">${t.title}</div><div class="template-content">${t.content}</div><button class="btn btn-outline" onclick="deleteTemplate('${doc.id}')" style="padding:4px 10px;font-size:.7rem;margin-top:8px;"><i class="fas fa-trash"></i></button>`; list.appendChild(div); }); } }); }
    function addNewTemplate(){ const title=prompt('Template title:'); if(!title) return; const content=prompt('Template content:'); if(!content) return; db.collection('templates').add({title,content,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); loadTemplates(); }
    function deleteTemplate(id){ db.collection('templates').doc(id).delete(); loadTemplates(); }

    document.getElementById('broadcastForm').addEventListener('submit',async function(e){ e.preventDefault(); try{ await db.collection('notifications').add({title:document.getElementById('broadcastTitle').value,message:document.getElementById('broadcastMessage').value,target:document.getElementById('broadcastTarget').value,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); alert('System notification sent!'); this.reset(); }catch(err){ alert('Failed.'); } });

    document.querySelectorAll('.tab-btn').forEach(btn=>{ btn.addEventListener('click',()=>{ document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active')); btn.classList.add('active'); document.getElementById('tab-'+btn.dataset.tab).classList.add('active'); }); });

    loadAllData();
</script>
</body>
</html>
