<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone21 AI Blueprint Chat</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800;
            --pink: #F80070;
            --white: #F8F8F8;
            --grey: #E0E0E8;
            --black: #101010;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e8eef4 50%, #f5f3f1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 60px rgba(16,40,56,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: var(--navy);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 4px solid var(--lime);
        }
        .chat-header img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background: white;
            padding: 5px;
        }
        .chat-header .bot-info h1 {
            font-size: 1.5rem;
            color: var(--lime);
        }
        .chat-header .bot-info p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fafbfc;
        }
        .message {
            display: flex;
            align-items: flex-start;
            max-width: 80%;
            animation: fadeInUp 0.4s ease forwards;
        }
        .message.bot {
            align-self: flex-start;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--lime);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--navy);
            margin: 0 10px;
        }
        .message.user .avatar {
            background: var(--pink);
            color: white;
        }
        .message .bubble {
            background: white;
            padding: 12px 18px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--grey);
            font-size: 0.95rem;
        }
        .message.bot .bubble {
            border-top-left-radius: 5px;
        }
        .message.user .bubble {
            background: var(--navy);
            color: white;
            border: none;
            border-top-right-radius: 5px;
        }
        .message .bubble p {
            line-height: 1.5;
        }
        .chat-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid var(--grey);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid var(--grey);
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
        }
        .chat-input-area input[type="text"]:focus {
            border-color: var(--navy);
        }
        .attach-btn, .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s;
        }
        .attach-btn {
            background: var(--grey);
            color: var(--navy);
        }
        .attach-btn:hover {
            background: #d0d0d8;
        }
        .send-btn {
            background: var(--lime);
            color: var(--navy);
        }
        .send-btn:hover {
            background: #d4dc00;
        }
        .file-preview-container {
            display: flex;
            gap: 10px;
            padding: 0 15px;
            background: white;
        }
        .file-preview {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 10px;
        }
        .loading-dots {
            display: inline-block;
            width: 50px;
            text-align: left;
        }
        .loading-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--navy);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .blueprint-result {
            background: #f0f4f8;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            overflow-x: auto;
        }
        .blueprint-result pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.85rem;
            color: var(--navy);
        }
    </style>
</head>
<body>
<div class="chat-container">

<script>
    // ====== CONFIGURATION ======
    const firebaseConfig = {
        apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
        authDomain: "zone21.firebaseapp.com",
        projectId: "zone21",
        storageBucket: "zone21.firebasestorage.app",
        messagingSenderId: "405963057292",
        appId: "1:405963057292:web:80e9923ae84eb7029073a9",

    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ====== GEMINI API SETUP ======
    // Key mapped directly from 1787694306239.jpeg
    const GEMINI_API_KEY = "AQ.Ab8RN6J930Znp8dLfHkOUnT5-s3MvpVe3TMK10gCNxY5-fnebw"; 
    const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";

    // ====== STATE ======
    const chat = document.getElementById('chat-messages');
    const textInput = document.getElementById('text-input');
    const sendBtn = document.getElementById('send-btn');
    const attachBtn = document.getElementById('attach-btn');
    const fileInput = document.getElementById('file-input');
    const previewContainer = document.getElementById('file-preview-container');
    
    let chatHistory = [];
    let pendingAttachments = [];
    let isProcessing = false;

    // ====== HELPER FUNCTIONS ======
    function addMessage(type, content) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = type === 'bot' ? 'Z' : 'U';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = content;
        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
    }

    function addTypingIndicator() {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message bot';
        msgDiv.id = 'typing-indicator';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'Z';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById('typing-indicator');
        if (indicator) indicator.remove();
    }

    function showFilePreview(file) {
        const preview = document.createElement('div');
        preview.className = 'file-preview';
        preview.innerHTML = `<i class="fas fa-image"></i> ${file.name}`;
        previewContainer.appendChild(preview);
    }

    // ====== DYNAMIC AI CHAT ENGINE ======
    async function sendToGemini(userText = null) {
        if (isProcessing) return;
        
        let parts = [];
        if (userText) {
            parts.push({ text: userText });
            addMessage('user', `<div style="white-space:pre-wrap;">${userText}</div>`);
        }
        
        // Attach any uploaded images directly to the conversation turn
        if (pendingAttachments.length > 0) {
            parts = parts.concat(pendingAttachments);
            pendingAttachments = [];
            previewContainer.innerHTML = ''; // Clear visual previews
        }

        // Only append to history if the user actually sent text or an image
        if (parts.length > 0) {
            chatHistory.push({
                role: "user",
                parts: parts
            });
        }

        isProcessing = true;
        textInput.disabled = true;
        addTypingIndicator();

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-goog-api-key': GEMINI_API_KEY // Fast Auth Key Validation
                },
                body: JSON.stringify({
                    system_instruction: {
                        parts: [{
                            text: "You are Zone21 AI, an expert event planning copilot. Your goal is to logically interview the user step-by-step to gather information and create an event blueprint.\n\nRequired Data: Event Name, Event Type, Date, Location, Expected Guests, and Budget.\n\nRULES:\n1. Ask only ONE question at a time.\n2. If the user says 'not sure' or doesn't know an answer, respond as an AI copilot: validate their uncertainty, provide 2-3 helpful suggestions or cost estimates based on context, and gently skip or transition to the next question.\n3. Keep your tone natural, enthusiastic, and empathetic.\n4. Once all necessary info is gathered (or if the user explicitly asks for the blueprint), generate the final blueprint.\n5. The final blueprint MUST be output as a valid JSON object enclosed in ```json ... ``` markdown tags. The JSON must contain: overview, timeline, budgetBreakdown, marketingStrategy, venueSuggestions, vendorRecommendations, staffingRequirements, securityPlan, guestManagement, riskConsiderations, ticketingRecommendations."
                        }]
                    },
                    contents: chatHistory
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);

            const replyText = data.candidates[0].content.parts[0].text;
            
            // Save model response to maintain live memory
            chatHistory.push({
                role: "model",
                parts: [{ text: replyText }]
            });

            removeTypingIndicator();
            
            // Parse for Markdown JSON Blocks dynamically
            const jsonMatch = replyText.match(/```json\s*([\s\S]*?)\s*
