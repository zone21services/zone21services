<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone21 AI Blueprint Chat</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800;
            --pink: #F80070;
            --white: #F8F8F8;
            --grey: #E0E0E8;
            --black: #101010;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e8eef4 50%, #f5f3f1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 60px rgba(16,40,56,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: var(--navy);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 4px solid var(--lime);
        }
        .chat-header img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background: white;
            padding: 5px;
        }
        .chat-header .bot-info h1 {
            font-size: 1.5rem;
            color: var(--lime);
        }
        .chat-header .bot-info p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fafbfc;
        }
        .message {
            display: flex;
            align-items: flex-start;
            max-width: 80%;
            animation: fadeInUp 0.4s ease forwards;
        }
        .message.bot {
            align-self: flex-start;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--lime);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--navy);
            margin: 0 10px;
        }
        .message.user .avatar {
            background: var(--pink);
            color: white;
        }
        .message .bubble {
            background: white;
            padding: 12px 18px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--grey);
        }
        .message.bot .bubble {
            border-top-left-radius: 5px;
        }
        .message.user .bubble {
            background: var(--navy);
            color: white;
            border: none;
            border-top-right-radius: 5px;
        }
        .message .bubble p {
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .option-btn {
            background: white;
            border: 2px solid var(--navy);
            border-radius: 30px;
            padding: 8px 18px;
            cursor: pointer;
            font-weight: 600;
            color: var(--navy);
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: var(--navy);
            color: white;
        }
        .chat-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid var(--grey);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid var(--grey);
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
        }
        .chat-input-area input[type="text"]:focus {
            border-color: var(--navy);
        }
        .attach-btn, .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s;
        }
        .attach-btn {
            background: var(--grey);
            color: var(--navy);
        }
        .attach-btn:hover {
            background: #d0d0d8;
        }
        .send-btn {
            background: var(--lime);
            color: var(--navy);
        }
        .send-btn:hover {
            background: #d4dc00;
        }
        .file-preview {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #555;
        }
        .loading-dots {
            display: inline-block;
            width: 50px;
            text-align: left;
        }
        .loading-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--navy);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .blueprint-result {
            background: #f0f4f8;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .blueprint-result pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.85rem;
            color: var(--navy);
        }
    </style>
</head>
<body>
<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjPnN7sH3Tr31O3qQpQGXpc8PVVARZ2kWqEDiyoggiJuvZiEOgTQaaDNWrrZbfDVNklA-LjjmvI3lXr9pc6SoilJME8VU5uXy0GsURUG1fAq_mPNKGKAGeDJwz3iZB7zYEuXo2YbbKKh4P1lKOBG2hmhyphenhyphenZysI-T3PsH3dS3M6zM-WkmMjZOKke3ENQiVdT_/s1600/file_00000000ee1081fd892f74d0cad0dc3f.png" alt="Zone21 AI">
        <div class="bot-info">
            <h1>Zone21 AI</h1>
            <p>Your event planning copilot</p>
        </div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-messages" id="chat-messages">
        <!-- Messages will appear here dynamically -->
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
        <button class="attach-btn" id="attach-btn"><i class="fas fa-paperclip"></i></button>
        <input type="file" id="file-input" multiple style="display:none;" accept="image/*,.pdf,.doc,.docx">
        <input type="text" id="text-input" placeholder="Type your answer...">
        <button class="send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
    // ====== CONFIGURATION ======
    const firebaseConfig = {
        apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
        authDomain: "zone21.firebaseapp.com",
        projectId: "zone21",
        storageBucket: "zone21.firebasestorage.app",
        messagingSenderId: "405963057292",
        appId: "1:405963057292:web:80e9923ae84eb7029073a9",
        measurementId: "G-KE007Y89F1"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ====== GEMINI API KEY ======
    const GEMINI_API_KEY = "AQ.Ab8RN6Jd8WEzuJrKgEcFsqvRBg8a2bzqMyr2T1GzUNJ2gmn-WQ"; // <-- Replace with your actual API key

    // ====== STATE ======
    const chat = document.getElementById('chat-messages');
    const textInput = document.getElementById('text-input');
    const sendBtn = document.getElementById('send-btn');
    const attachBtn = document.getElementById('attach-btn');
    const fileInput = document.getElementById('file-input');
    const questions = [
        { key: 'eventName', question: "What's the name of your event?", required: true },
        { key: 'eventType', question: "What type of event is it?", options: ["Concert", "Festival", "Corporate Event", "Wedding", "Conference", "Private Party", "Sporting Event", "Other"], required: true },
        { key: 'eventDate', question: "When is the event? (YYYY-MM-DD)", required: true },
        { key: 'eventLocation', question: "Where will it be held? (City, Venue)", required: true },
        { key: 'eventGuests', question: "How many guests are expected?", required: true },
        { key: 'eventBudget', question: "What is your estimated budget in USD?", required: true },
        { key: 'eventAudience', question: "Who is your target audience? (e.g., young professionals)" },
        { key: 'eventObjective', question: "What is the main objective of the event?" },
        { key: 'eventTheme', question: "Do you have a theme in mind?" },
        { key: 'eventDescription', question: "Briefly describe the event (optional)" }
    ];
    let currentQuestionIndex = 0;
    let answers = {};
    let attachments = [];
    let isProcessing = false;

    // ====== HELPER FUNCTIONS ======
    function addMessage(type, content, extraClass = '') {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type} ${extraClass}`;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = type === 'bot' ? 'Z' : 'U';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = content;
        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
        return bubble;
    }

    function addTypingIndicator() {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message bot';
        msgDiv.id = 'typing-indicator';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'Z';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
        return bubble;
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById('typing-indicator');
        if (indicator) indicator.remove();
    }

    function addOptions(options, callback) {
        const bubble = document.querySelector('.message.bot:last-child .bubble');
        if (!bubble) return;
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => {
                callback(opt);
                // remove options after selection
                optionsDiv.remove();
            };
            optionsDiv.appendChild(btn);
        });
        bubble.appendChild(optionsDiv);
    }

    function showFilePreview(file) {
        const preview = document.createElement('div');
        preview.className = 'file-preview';
        preview.innerHTML = `<i class="fas fa-file"></i> ${file.name}`;
        chat.appendChild(preview);
        chat.scrollTop = chat.scrollHeight;
    }

    // ====== ASK NEXT QUESTION ======
    function askNextQuestion() {
        if (currentQuestionIndex >= questions.length) {
            generateBlueprint();
            return;
        }
        const q = questions[currentQuestionIndex];
        addTypingIndicator();
        setTimeout(() => {
            removeTypingIndicator();
            const bubble = addMessage('bot', `<p>${q.question}</p>`);
            if (q.options) {
                addOptions(q.options, (answer) => {
                    answers[q.key] = answer;
                    addMessage('user', `<p>${answer}</p>`);
                    currentQuestionIndex++;
                    askNextQuestion();
                });
            } else {
                // enable text input for free text
                textInput.focus();
            }
        }, 800);
    }

    // ====== GENERATE BLUEPRINT ======
    async function generateBlueprint() {
        isProcessing = true;
        addTypingIndicator();
        // Build prompt from answers
        const prompt = `
You are Zone21 AI, the ultimate event planning expert. Create a comprehensive event blueprint in JSON format.

Event Details:
- Name: ${answers.eventName || 'N/A'}
- Type: ${answers.eventType || 'N/A'}
- Date: ${answers.eventDate || 'N/A'}
- Location: ${answers.eventLocation || 'N/A'}
- Expected Guests: ${answers.eventGuests || 'N/A'}
- Budget: $${answers.eventBudget || 'N/A'}
- Target Audience: ${answers.eventAudience || 'General'}
- Objective: ${answers.eventObjective || 'Not specified'}
- Theme: ${answers.eventTheme || 'Not specified'}
- Description: ${answers.eventDescription || 'No description provided'}

Generate a detailed blueprint with the following sections. Be specific, practical, and tailored to the event type and budget. For each recommendation, provide actionable items, approximate costs, and quantities where applicable.

Return ONLY valid JSON with this exact structure:
{
  "overview": "Brief summary",
  "timeline": [{"phase": "Pre-event", "tasks": ["task1", "task2"]}, {"phase": "Event Day", "tasks": ["task1"]}],
  "budgetBreakdown": [{"category": "Venue", "estimatedCost": 2000, "notes": "..."}, {"category": "Catering", "estimatedCost": 1500, "notes": "..."}, {"category": "Entertainment", "estimatedCost": 1200, "notes": "..."}, {"category": "Marketing", "estimatedCost": 800, "notes": "..."}, {"category": "Staffing", "estimatedCost": 600, "notes": "..."}, {"category": "Security", "estimatedCost": 400, "notes": "..."}, {"category": "Decor", "estimatedCost": 700, "notes": "..."}, {"category": "Other", "estimatedCost": 300, "notes": "..."}],
  "marketingStrategy": [{"channel": "Social Media", "action": "Create Facebook event, run ads", "target": "Local audience"}],
  "venueSuggestions": ["Venue 1", "Venue 2"],
  "vendorRecommendations": [
    {"category": "DJ", "suggestion": "DJ Example", "notes": "Popular in Harare, good reviews"},
    {"category": "Decor", "suggestion": "Decor Co.", "notes": "Modern designs"},
    {"category": "Catering", "suggestion": "Catering Ltd.", "notes": "Affordable for 500 guests"},
    {"category": "Photographer", "suggestion": "PhotoPro", "notes": "Experienced in concerts"},
    {"category": "Lighting", "suggestion": "LightTech", "notes": "Stage lighting specialists"},
    {"category": "PA System", "suggestion": "SoundMaster", "notes": "High-quality audio"}
  ],
  "staffingRequirements": [{"role": "Event Coordinator", "quantity": 1}, {"role": "Security Guard", "quantity": 10}, {"role": "Usher", "quantity": 8}, {"role": "Ticketing Staff", "quantity": 4}],
  "securityPlan": [{"measure": "Crowd control barriers", "details": "Place at entrance and stage"}],
  "guestManagement": "Strategy for check-in, VIP handling, etc.",
  "riskConsiderations": [{"risk": "Rain (if outdoor)", "mitigation": "Have tent backup"}],
  "ticketingRecommendations": [{"type": "Early Bird", "price": 20, "quantity": 100}, {"type": "General", "price": 30, "quantity": 300}, {"type": "VIP", "price": 60, "quantity": 100}]
}
`;
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro-latest:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            const text = data.candidates[0].content.parts[0].text;
            const jsonStart = text.indexOf('{');
            const jsonEnd = text.lastIndexOf('}') + 1;
            const jsonString = text.slice(jsonStart, jsonEnd);
            const blueprint = JSON.parse(jsonString);
            // Display result
            removeTypingIndicator();
            const formatted = `<div class="blueprint-result"><pre>${JSON.stringify(blueprint, null, 2)}</pre></div>`;
            addMessage('bot', `<p>Here is your event blueprint:</p>${formatted}`);
            // Optionally save to Firestore if event ID is known (not implemented)
        } catch (error) {
            console.error(error);
            removeTypingIndicator();
            addMessage('bot', `<p style="color:var(--pink);">Error generating blueprint: ${error.message}</p>`);
        } finally {
            isProcessing = false;
            textInput.disabled = false;
        }
    }

    // ====== EVENT LISTENERS ======
    sendBtn.addEventListener('click', () => {
        if (isProcessing) return;
        const text = textInput.value.trim();
        if (!text) return;
        // Answer current question
        const q = questions[currentQuestionIndex];
        if (q.options) {
            // Should not happen because options handled separately
            return;
        }
        answers[q.key] = text;
        addMessage('user', `<p>${text}</p>`);
        textInput.value = '';
        currentQuestionIndex++;
        askNextQuestion();
    });

    textInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendBtn.click();
        }
    });

    attachBtn.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
        for (const file of e.target.files) {
            attachments.push(file);
            showFilePreview(file);
        }
        // Clear input
        fileInput.value = '';
    });

    // Start conversation
    window.onload = () => {
        addMessage('bot', '<p>Hello! I am <strong>Zone21 AI</strong>, your event planning assistant. I will ask you a few questions to create a tailored blueprint. Let\'s begin! 🚀</p>');
        setTimeout(() => askNextQuestion(), 1000);
    };
</script>
</body>
</html>
