<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zone21 System | Event Blueprint Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800; 
            --pink: #F80070;
            --white: #F8F8F8;
            --grey: #E0E0E8;
            --radius: 16px;
            --radius-xl: 24px;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        html { height: -webkit-fill-available; }

        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e8eef4 50%, #f5f3f1 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            height: 100dvh; 
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
            color: var(--navy);
            margin: 0;
        }

        /* Sidebar */
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.4); z-index: 999; opacity: 0; transition: opacity 0.3s ease; }
        .sidebar { width: 300px; background: var(--navy); border-radius: var(--radius-xl); color: white; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(16,40,56,0.15); transition: transform 0.3s ease; z-index: 1000; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .new-chat-btn { background: var(--lime); color: var(--navy); border: none; padding: 12px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; transition: 0.2s; }
        .new-chat-btn:hover { background: white; }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; }
        .history-item { padding: 10px 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; transition: 0.2s; gap: 8px; }
        .history-item:hover { background: rgba(255,255,255,0.15); }
        .history-item.active { border-left: 4px solid var(--lime); background: rgba(255,255,255,0.1); }
        .history-item .item-info { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; }
        .history-item .item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white; }
        .history-item .delete-btn { color: rgba(255,255,255,0.4); padding: 4px; border-radius: 4px; transition: 0.2s; }
        .history-item .delete-btn:hover { color: var(--pink); background: rgba(248, 0, 112, 0.15); }

        /* Workspace */
        .workspace { flex: 1; background: white; border-radius: var(--radius-xl); box-shadow: 0 20px 60px rgba(16,40,56,0.15); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .workspace-header { background: var(--navy); color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 4px solid var(--lime); z-index: 10; }
        .menu-btn { display: none; background: transparent; border: none; font-size: 1.4rem; color: white; cursor: pointer; padding: 5px; }
        .workspace-header h1 { font-size: 1.3rem; color: var(--lime); margin: 0; }
        .workspace-header p { font-size: 0.8rem; color: rgba(255,255,255,0.8); margin: 0; }
        .workspace-content { flex: 1; overflow-y: auto; padding: 20px; background: #fafbfc; scroll-behavior: smooth; }
        
        /* Form */
        .form-section { background: white; padding: 25px; border-radius: 16px; border: 1px solid var(--grey); box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media(max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group.full-width { grid-column: 1 / -1; }
        .input-group label { font-weight: bold; font-size: 0.9rem; }
        .input-group input, .input-group select, .input-group textarea { padding: 12px; border: 1px solid var(--grey); border-radius: 8px; outline: none; transition: 0.3s; font-size: 0.95rem; background: #f9fafb; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--navy); background: white; }
        
        /* Highlight Package Box */
        .package-box { background: rgba(192, 200, 0, 0.1); border: 2px solid var(--lime); padding: 15px; border-radius: 12px; margin-bottom: 25px; }
        
        .services-wrapper { margin-top: 15px; }
        .services-wrapper > label { font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; display: block; border-bottom: 2px solid var(--lime); padding-bottom: 5px; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
        .service-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; background: #f0f4f8; padding: 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: 0.2s; }
        .service-item:hover { background: #e8eef4; border-color: var(--grey); }
        
        .submit-btn { width: 100%; background: var(--navy); color: var(--lime); border: none; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 25px; }
        .submit-btn:hover { background: var(--lime); color: var(--navy); }
        
        /* Blueprint Result */
        #loading { display: none; text-align: center; padding: 40px; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--pink); animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #blueprint-container { display: none; }
        .blueprint-result { background: white; padding: 30px; border-radius: 16px; border: 1px solid var(--grey); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .blueprint-result h2 { color: var(--navy); border-bottom: 3px solid var(--lime); padding-bottom: 8px; margin-top: 25px; margin-bottom: 15px; }
        .blueprint-result h3 { color: var(--pink); margin-top: 20px; }
        .blueprint-result li { margin-bottom: 10px; line-height: 1.6; display: flex; gap: 10px; }
        .blueprint-result li:before { content: "▪"; color: var(--lime); font-size: 1.2rem; }
        .budget-warning { background: rgba(248, 0, 112, 0.05); border-left: 4px solid var(--pink); padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        
        .blueprint-controls { display: flex; gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--grey); }
        .action-btn { padding: 10px 18px; border-radius: 30px; font-weight: bold; border: none; cursor: pointer; font-size: 0.9rem; }
        .btn-download { background: #28a745; color: white; }
        .btn-regen { background: #f0f4f8; color: var(--navy); border: 1px solid var(--grey); }

        @media (max-width: 768px) {
            body { padding: 0; gap: 0; }
            .workspace { border-radius: 0; }
            .menu-btn { display: block; }
            .sidebar { position: fixed; left: -320px; height: 100dvh; }
            .sidebar.active { transform: translateX(320px); }
            .sidebar-overlay.active { display: block; opacity: 1; }
        }
        @media print {
            body * { visibility: hidden; }
            #blueprint-container, #blueprint-container * { visibility: visible; }
            #blueprint-container { position: absolute; left: 0; top: 0; width: 100%; }
            .blueprint-controls { display: none !important; }
        }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header"><h2>Past Events</h2></div>
    <div style="padding: 0 20px;"><button class="new-chat-btn" onclick="startNewSession()">New Event</button></div>
    <div class="history-list" id="history-list"></div>
</div>

<div class="workspace">
    <div class="workspace-header">
        <button class="menu-btn" id="menu-btn"><i class="fas fa-bars"></i></button>
        <div>
            <h1>Zone21 System</h1>
            <p>Event Allocation & Blueprint Generation</p>
        </div>
    </div>

    <div class="workspace-content">
        <div class="form-section" id="form-section">
            <form id="eventForm">
                
                <!-- Package Manager -->
                <div class="package-box input-group full-width">
                    <label><i class="fas fa-crown"></i> Active Subscribed Package</label>
                    <select id="userPackage" required>
                        <option value="small">Small Event Package (Max 30 People)</option>
                        <option value="medium">Medium Event Package (Max 350 People)</option>
                        <option value="enterprise">Enterprise / Large Event (Unlimited Attendees)</option>
                    </select>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>Event Name</label>
                        <input type="text" id="eventName" required>
                    </div>
                    <div class="input-group">
                        <label>Location (City/Area)</label>
                        <input type="text" id="eventLocation" required>
                    </div>
                    <div class="input-group">
                        <label>Event Type</label>
                        <input type="text" id="eventType" required>
                    </div>
                    <div class="input-group">
                        <label>Total Budget (USD)</label>
                        <input type="number" id="eventBudget" required min="50">
                    </div>
                    <div class="input-group">
                        <label>Expected Attendees</label>
                        <input type="number" id="eventAttendees" required>
                    </div>
                </div>

                <div class="services-wrapper">
                    <label>Select Required Services</label>
                    <div class="services-grid" id="servicesContainer"></div>
                </div>

                <button type="submit" class="submit-btn"><i class="fas fa-magic"></i> Generate Blueprint</button>
            </form>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <h3>System Processing...</h3>
        </div>

        <div id="blueprint-container">
            <div class="blueprint-result" id="final-blueprint"></div>
            <div class="blueprint-controls">
                <button class="action-btn btn-download" onclick="window.print()">Download</button>
                <button class="action-btn btn-regen" onclick="generateBlueprint(true)">Regenerate</button>
            </div>
        </div>
    </div>
</div>

<script>
    const OPENROUTER_API_KEY = "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"; 
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";
    
    // Package Constraints
    const packageLimits = {
        'small': 30,
        'medium': 350,
        'enterprise': Infinity
    };

    const granularServices = [
        "Event Planner", "Venue", "Marquee/Tents", "PA System", "DJ", 
        "Lighting", "Décor", "Catering", "Beverages", "Photographer", 
        "Security", "Transport", "Cleaning"
    ];

    let currentSessionId = null;
    let currentEventData = null;

    document.getElementById('menu-btn').addEventListener('click', () => { 
        document.getElementById('sidebar').classList.add('active'); 
        document.getElementById('sidebar-overlay').classList.add('active'); 
    });
    document.getElementById('sidebar-overlay').addEventListener('click', () => {
        document.getElementById('sidebar').classList.remove('active'); 
        document.getElementById('sidebar-overlay').classList.remove('active'); 
    });

    const container = document.getElementById('servicesContainer');
    granularServices.forEach(service => {
        container.innerHTML += `<label class="service-item"><input type="checkbox" name="services" value="${service}"> ${service}</label>`;
    });

    document.getElementById('eventForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const selectedPackage = document.getElementById('userPackage').value;
        const attendees = parseInt(document.getElementById('eventAttendees').value);

        // SYSTEM VALIDATION: Package Limits
        if (attendees > packageLimits[selectedPackage]) {
            alert(`SYSTEM ALERT: Your current subscription package only supports up to ${packageLimits[selectedPackage]} attendees.\n\nPlease upgrade your package to Enterprise, or reduce the expected attendees.`);
            return;
        }

        const selectedServices = Array.from(document.querySelectorAll('input[name="services"]:checked')).map(cb => cb.value);
        if(selectedServices.length === 0) return alert("Select at least one service.");

        currentEventData = {
            package: selectedPackage,
            name: document.getElementById('eventName').value,
            location: document.getElementById('eventLocation').value,
            type: document.getElementById('eventType').value,
            budget: document.getElementById('eventBudget').value,
            attendees: attendees,
            services: selectedServices.join(", ")
        };

        generateBlueprint(false);
    });

    async function generateBlueprint(isRegenerating) {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('blueprint-container').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        if (!currentSessionId || !isRegenerating) currentSessionId = 'evt_' + Date.now();

        // Updated Prompt containing Package details
        const prompt = `
Generate a formal Event Blueprint. 
CRITICAL CONTEXT: The user is on the "${currentEventData.package}" subscription package. 
- Small: Intimate vendors, tight budget management.
- Medium: Standard scale vendors.
- Enterprise: Premium vendors, high-end production.

DETAILS:
Name: ${currentEventData.name} | Location: ${currentEventData.location} | Type: ${currentEventData.type}
Budget: $${currentEventData.budget} | Attendees: ${currentEventData.attendees} | Services: ${currentEventData.services}

INSTRUCTIONS: 
1. Evaluate if $${currentEventData.budget} is realistic for ${currentEventData.attendees} people. If not, add a "Budget Analysis" warning.
2. Allocate the budget across the requested services based on their package tier scale.
3. Suggest local vendors for ${currentEventData.location}.
4. Output strictly in HTML (<h2>, <h3>, <ul>). No markdown blocks.`;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${OPENROUTER_API_KEY}` },
                body: JSON.stringify({ model: "openrouter/auto", messages: [{ role: "user", content: prompt }] })
            });
            const data = await response.json();
            let htmlOutput = data.choices[0].message.content.replace(/```html|```/gi, '');
            htmlOutput = htmlOutput.replace(/(<h[23]>.*?Budget.*?<\/h[23]>[\s\S]*?(?=<(h[23]|div)>|$))/i, '<div class="budget-warning">$1</div>');
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('blueprint-container').style.display = 'block';
            document.getElementById('final-blueprint').innerHTML = htmlOutput;
            
            saveBlueprintState(htmlOutput);
        } catch (error) {
            alert("Error generating blueprint.");
            document.getElementById('loading').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
        }
    }

    function saveBlueprintState(htmlOutput) {
        let sessions = JSON.parse(localStorage.getItem('zone21_events') || '{}');
        sessions[currentSessionId] = { id: currentSessionId, title: currentEventData.name, formData: currentEventData, blueprintHtml: htmlOutput, updatedAt: new Date().toISOString() };
        localStorage.setItem('zone21_events', JSON.stringify(sessions));
        renderHistorySidebar();
    }

    function renderHistorySidebar() {
        const list = document.getElementById('history-list'); list.innerHTML = '';
        let sessions = JSON.parse(localStorage.getItem('zone21_events') || '{}');
        Object.values(sessions).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)).forEach(s => {
            list.innerHTML += `<div class="history-item" onclick="loadBlueprintSession('${s.id}')">
                <div class="item-info"><i class="fas fa-list"></i> <span class="item-title">${s.title}</span></div>
                <i class="fas fa-trash delete-btn" onclick="deleteBlueprintSession('${s.id}', event)"></i></div>`;
        });
    }

    function loadBlueprintSession(id) {
        document.getElementById('sidebar').classList.remove('active'); document.getElementById('sidebar-overlay').classList.remove('active'); 
        let session = JSON.parse(localStorage.getItem('zone21_events'))[id];
        currentSessionId = id; currentEventData = session.formData;
        document.getElementById('form-section').style.display = 'none'; document.getElementById('blueprint-container').style.display = 'block';
        document.getElementById('final-blueprint').innerHTML = session.blueprintHtml;
    }

    function deleteBlueprintSession(id, e) {
        e.stopPropagation();
        let sessions = JSON.parse(localStorage.getItem('zone21_events')); delete sessions[id];
        localStorage.setItem('zone21_events', JSON.stringify(sessions));
        if(currentSessionId === id) startNewSession(); else renderHistorySidebar();
    }

    function startNewSession() {
        document.getElementById('sidebar').classList.remove('active'); document.getElementById('sidebar-overlay').classList.remove('active'); 
        currentSessionId = null; currentEventData = null;
        document.getElementById('eventForm').reset();
        document.getElementById('blueprint-container').style.display = 'none';
        document.getElementById('form-section').style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', renderHistorySidebar);
</script>
</body>
</html>
