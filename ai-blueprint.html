<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zone21 AI Event Architect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800; 
            --pink: #F80070;
            --white: #F8F8F8;
            --grey: #E0E0E8;
            --radius-xl: 24px;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e8eef4 50%, #f5f3f1 100%);
            height: 100dvh; 
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }
        
        /* Mobile Overlay & Sidebar */
        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.4); z-index: 999; opacity: 0; transition: opacity 0.3s ease;
        }
        .sidebar {
            width: 300px; background: var(--navy); border-radius: var(--radius-xl); color: white;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 60px rgba(16,40,56,0.15); transition: transform 0.3s ease; z-index: 1000;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .new-chat-btn { background: var(--lime); color: var(--navy); border: none; padding: 12px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; transition: 0.2s; }
        .new-chat-btn:active { transform: scale(0.95); }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        /* History Item with Delete Button */
        .history-item { 
            padding: 10px 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 8px; 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; transition: 0.2s; gap: 8px;
        }
        .history-item:hover { background: rgba(255,255,255,0.15); }
        .history-item.active { border-left: 4px solid var(--lime); background: rgba(255,255,255,0.1); }
        .history-item .item-info { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; }
        .history-item .item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item .delete-chat-btn { color: rgba(255,255,255,0.4); padding: 4px 6px; border-radius: 4px; transition: 0.2s; }
        .history-item .delete-chat-btn:hover { color: var(--pink); background: rgba(248, 0, 112, 0.15); }
        
        /* Main Chat Container */
        .chat-container {
            flex: 1; background: white; border-radius: var(--radius-xl);
            box-shadow: 0 20px 60px rgba(16,40,56,0.15); display: flex; flex-direction: column; overflow: hidden; position: relative;
        }
        .chat-header { background: var(--navy); color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 4px solid var(--lime); z-index: 10; }
        .menu-btn { display: none; background: transparent; border: none; font-size: 1.4rem; color: white; cursor: pointer; padding: 5px; }
        .chat-header img { height: 45px; width: 45px; border-radius: 50%; background: white; padding: 2px; object-fit: cover; }
        .chat-header .bot-info h1 { font-size: 1.3rem; color: var(--lime); }
        .chat-header .bot-info p { font-size: 0.8rem; color: rgba(255,255,255,0.8); }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; background: #fafbfc; scroll-behavior: smooth; }
        
        /* Chat Bubbles */
        .message { display: flex; align-items: flex-start; max-width: 88%; animation: fadeInUp 0.3s ease forwards; }
        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message .avatar { width: 35px; height: 35px; border-radius: 50%; background: var(--lime); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; color: var(--navy); margin: 0 10px; flex-shrink: 0; }
        .message.user .avatar { background: var(--pink); color: white; }
        .message .bubble { background: white; padding: 14px 18px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid var(--grey); font-size: 0.95rem; line-height: 1.5; width: 100%; }
        .message.bot .bubble { border-top-left-radius: 4px; }
        .message.user .bubble { background: var(--navy); color: white; border: none; border-top-right-radius: 4px; }
        
        .options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .option-btn { background: white; border: 1px solid var(--navy); border-radius: 30px; padding: 8px 16px; cursor: pointer; font-weight: 600; color: var(--navy); transition: 0.2s; font-size: 0.85rem; }
        .option-btn:hover { background: var(--navy); color: white; }

        /* Actions Row */
        .action-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; align-items: center; }
        .continue-btn { background: var(--navy); color: var(--lime); border: none; border-radius: 30px; padding: 10px 18px; font-size: 0.9rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .continue-btn:hover { background: var(--lime); color: var(--navy); }
        .regen-btn { background: #f0f4f8; color: var(--navy); border: 1px solid var(--grey); border-radius: 30px; padding: 10px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .regen-btn:hover { background: var(--navy); color: white; }
        
        /* Custom Thoughts Input */
        .thoughts-container { margin-top: 12px; background: #f9fafb; padding: 12px; border-radius: 12px; border: 1px dashed var(--pink); display: flex; flex-direction: column; gap: 10px; animation: fadeInUp 0.3s ease; }
        .thoughts-container label { font-size: 0.85rem; font-weight: bold; color: var(--pink); display: flex; align-items: center; gap: 6px; }
        .thoughts-container textarea { width: 100%; border: 1px solid var(--grey); border-radius: 8px; padding: 10px; font-size: 0.9rem; resize: none; outline: none; transition: 0.2s; }
        .thoughts-container textarea:focus { border-color: var(--pink); }
        .thoughts-container button { align-self: flex-end; background: var(--pink); color: white; border: none; border-radius: 20px; padding: 8px 16px; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .thoughts-container button:hover { background: #d0005e; }

        /* Spinner */
        .loading-dots { display: inline-block; width: 50px; text-align: left; }
        .loading-dots span { display: inline-block; width: 8px; height: 8px; background: var(--navy); border-radius: 50%; animation: bounce 1.2s infinite; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        /* Input Area */
        .chat-input-wrapper { background: white; border-top: 1px solid var(--grey); padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; }
        .input-toolbar { display: flex; justify-content: flex-end; }
        .skip-btn { background: rgba(248, 0, 112, 0.08); color: var(--pink); border: 1px solid var(--pink); padding: 4px 14px; border-radius: 20px; font-weight: 600; font-size: 0.78rem; cursor: pointer; transition: 0.2s; }
        .skip-btn:hover { background: var(--pink); color: white; }
        
        .chat-input-area { display: flex; align-items: center; gap: 8px; transition: opacity 0.3s; }
        .chat-input-area.disabled-area { opacity: 0.4; pointer-events: none; }
        .chat-input-area input[type="text"] { flex: 1; padding: 12px 18px; background: #f0f4f8; border: 1px solid transparent; border-radius: 30px; font-size: 0.95rem; outline: none; transition: 0.2s; }
        .chat-input-area input[type="text"]:focus { background: #e8eef4; border-color: var(--navy); }
        .icon-btn { width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: 0.2s; flex-shrink: 0; }
        .send-btn { background: var(--lime); color: var(--navy); }

        /* Blueprint Rendering */
        .blueprint-result { background: white; padding: 25px; border-radius: 16px; border: 1px solid var(--grey); margin-top: 10px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .blueprint-result h2 { color: var(--navy); font-size: 1.3rem; border-bottom: 3px solid var(--lime); padding-bottom: 8px; margin-top: 25px; margin-bottom: 15px; }
        .blueprint-result h2:first-child { margin-top: 0; }
        .blueprint-result h3 { color: var(--pink); font-size: 1.05rem; margin-top: 15px; margin-bottom: 10px; }
        .blueprint-result ul { list-style: none; padding-left: 0; margin-bottom: 20px; }
        .blueprint-result li { margin-bottom: 10px; font-size: 0.92rem; line-height: 1.5; color: #333; display: flex; align-items: flex-start; gap: 10px; }
        .blueprint-result li i { color: var(--lime); margin-top: 3px; font-size: 1.1rem; }
        .blueprint-result p { margin-bottom: 15px; line-height: 1.6; color: #444; font-size: 0.93rem; }

        .blueprint-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; border-top: 1px solid var(--grey); padding-top: 15px; }
        .blueprint-btn { padding: 10px 18px; border-radius: 30px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.88rem; }
        .btn-download { background: #28a745; color: white; }
        .btn-refine { background: var(--navy); color: var(--lime); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        @media (max-width: 768px) {
            body { padding: 0; gap: 0; }
            .chat-container { border-radius: 0; box-shadow: none; }
            .menu-btn { display: block; }
            .sidebar { position: fixed; top: 0; left: -320px; height: 100dvh; width: 280px; border-radius: 0 24px 24px 0; }
            .sidebar.active { transform: translateX(320px); }
            .sidebar-overlay.active { display: block; opacity: 1; }
            .message { max-width: 96%; }
            .chat-messages { padding: 15px 10px; }
            .chat-input-wrapper { padding: 8px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        }

        @media print {
            body * { visibility: hidden; }
            .blueprint-result, .blueprint-result * { visibility: visible; }
            .blueprint-result { position: absolute; left: 0; top: 0; width: 100%; border: none; box-shadow: none; }
            .blueprint-controls { display: none !important; }
        }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div><h2>Past Events</h2></div>
    </div>
    <div style="padding: 0 20px;">
        <button class="new-chat-btn" onclick="startNewSession()"><i class="fas fa-plus"></i> New Blueprint</button>
    </div>
    <div class="history-list" id="history-list"></div>
</div>

<div class="chat-container">
    <div class="chat-header">
        <button class="menu-btn" id="menu-btn"><i class="fas fa-bars"></i></button>
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjPnN7sH3Tr31O3qQpQGXpc8PVVARZ2kWqEDiyoggiJuvZiEOgTQaaDNWrrZbfDVNklA-LjjmvI3lXr9pc6SoilJME8VU5uXy0GsURUG1fAq_mPNKGKAGeDJwz3iZB7zYEuXo2YbbKKh4P1lKOBG2hmhyphenhyphenZysI-T3PsH3dS3M6zM-WkmMjZOKke3ENQiVdT_/s1600/file_00000000ee1081fd892f74d0cad0dc3f.png" alt="Zone21 AI">
        <div class="bot-info">
            <h1>Zone21 AI</h1>
            <p>Interactive Event Architect</p>
        </div>
    </div>

    <div class="chat-messages" id="chat-messages"></div>

    <div class="chat-input-wrapper">
        <div class="input-toolbar">
            <button class="skip-btn" id="skip-btn" title="Not Sure? Get an AI Suggestion">
                <i class="fas fa-lightbulb"></i> Not Sure? Suggest Ideas
            </button>
        </div>
        <div class="chat-input-area" id="input-area">
            <input type="text" id="text-input" placeholder="Type answer or ask for recommendations...">
            <button class="icon-btn send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script>
    // ====== FIREBASE INITIALIZATION ======
    const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "123456789",
        appId: "YOUR_APP_ID"
    };

    let db = null;
    let currentUser = null;
    let currentSessionId = null;

    try {
        if (firebaseConfig.apiKey !== "YOUR_FIREBASE_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            firebase.auth().onAuthStateChanged(user => {
                currentUser = user;
                loadHistoryFromFirestore();
            });
        }
    } catch (e) {
        console.warn("Firestore not configured. Using LocalStorage.", e);
    }

    // ====== OPENROUTER API ======
    const OPENROUTER_API_KEY = "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"; 
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";

    // ====== QUESTIONS & FLOW ======
    const baseQuestions = [
        { key: 'eventName', question: "Let's build your blueprint! What is the official name of your event?" },
        { key: 'eventType', question: "What format or type of event are we planning?", options: ["Corporate Gala", "Music Festival / Concert", "Conference / Expo", "Wedding", "Brand / Product Launch", "Private Party"] },
        { key: 'eventLocation', question: "Where will this take place? (Mention city/area, e.g. Harare, Bulawayo, Cape Town)" },
        { key: 'eventDate', question: "When is the event scheduled, and how many hours or days will it last?" },
        { key: 'eventGuests', question: "Who is your target audience, and roughly how many guests are expected?" },
        { key: 'eventBudget', question: "What is your estimated total budget in USD?" },
        { key: 'eventObjective', question: "What is the primary objective or vibe of this event?" },
        { key: 'eventTheme', question: "Do you have a specific theme, dress code, or color palette in mind?" },
        { key: 'eventVendors', question: "Do you need recommendations for specific local vendors (Venues, Sound, Lighting, Catering, Decor, Photography)?" }
    ];

    let dynamicQuestions = [...baseQuestions];
    let currentQuestionIndex = 0;
    let answers = {};
    let isProcessing = false;
    
    // Core Regeneration Trackers
    let currentRegenCount = 0;
    let lastUserText = ""; 

    // ====== UI HELPERS ======
    const chat = document.getElementById('chat-messages');
    const textInput = document.getElementById('text-input');
    const sendBtn = document.getElementById('send-btn');
    const skipBtn = document.getElementById('skip-btn');
    const inputArea = document.getElementById('input-area');

    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    function closeSidebar() { sidebar.classList.remove('active'); overlay.classList.remove('active'); }
    if (menuBtn) menuBtn.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
    if (overlay) overlay.addEventListener('click', closeSidebar);

    function addMessage(type, content) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerHTML = `<div class="avatar">${type === 'bot' ? 'Z' : 'U'}</div><div class="bubble">${content}</div>`;
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
        saveCurrentChatState();
        return msgDiv.querySelector('.bubble');
    }

    function addTypingIndicator() {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message bot';
        msgDiv.id = 'typing-indicator';
        msgDiv.innerHTML = `<div class="avatar">Z</div><div class="bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>`;
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
    }

    function removeTypingIndicator() {
        const ind = document.getElementById('typing-indicator');
        if (ind) ind.remove();
    }

    function disableInput(disable) {
        isProcessing = disable;
        if (disable) {
            inputArea.classList.add('disabled-area');
            textInput.blur();
        } else {
            inputArea.classList.remove('disabled-area');
            setTimeout(() => textInput.focus(), 50);
        }
    }

    // ====== CORE INTERACTION LOOP ======
    function askNextQuestion() {
        currentRegenCount = 0; // Reset counter for the new question
        if (currentQuestionIndex >= dynamicQuestions.length) {
            generateFinalBlueprint();
            return;
        }
        
        disableInput(false);
        const q = dynamicQuestions[currentQuestionIndex];
        const bubble = addMessage('bot', `<p><strong>Question ${currentQuestionIndex + 1} of ${dynamicQuestions.length}:</strong>${q.question}</p>`);
        
        if (q.options) {
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn'; 
                btn.textContent = opt;
                btn.onclick = () => { optionsDiv.remove(); processAnswer(opt, q); };
                optionsDiv.appendChild(btn);
            });
            bubble.appendChild(optionsDiv);
        }
    }

    // The isRegen flag tells us if we are replacing an old bot message
    async function processAnswer(text, q, customThoughts = '', isRegen = false) {
        if (isProcessing) return;
        disableInput(true);
        
        // If this is a first-time answer, save the text and draw the user's chat bubble
        if (!isRegen) {
            lastUserText = text;
            const isSkip = (text === "SKIP_COMMAND" || text.toLowerCase().includes("not sure"));
            const displayUserText = isSkip 
                ? "<em>I'm not sure. Can you suggest something local and suitable?</em>" 
                : text;
            
            // Prevent duplicate user messages if they quickly double tap
            if (!document.querySelector(`.user-msg-${currentQuestionIndex}`)) {
                addMessage('user', `<p class="user-msg-${currentQuestionIndex}">${displayUserText}</p>`);
            }
        }

        addTypingIndicator();
        
        try {
            // If regenerating, strongly instruct the AI to provide a NEW alternative idea
            const regenInstruction = isRegen ? "CRITICAL: This is a REGENERATION request. You must provide a completely DIFFERENT, fresh alternative to your previous suggestions." : "";

            const promptContext = `
            You are Zone21 AI, an expert event architect.
            Event Name: "${answers.eventName || 'Upcoming Event'}"
            Event Location: "${answers.eventLocation || 'Harare/Zimbabwe or specified city'}"
            Current Question: "${q.question}"
            User Choice/Input: "${lastUserText}"
            Custom User Guidance/Thoughts: "${customThoughts}"
            
            Instructions:
            1. Provide a warm, enthusiastic, high-value 2-3 sentence feedback or suggestion.
            2. IF location or vendor details are involved, suggest 2-3 real, popular local venues or vendors. Include estimated pricing/contacts.
            ${regenInstruction}
            `;

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                    'HTTP-Referer': 'https://zone21-ai.local',
                    'X-Title': 'Zone21 AI'
                },
                body: JSON.stringify({ 
                    model: "openrouter/auto", 
                    messages: [{ role: "user", content: promptContext }] 
                })
            });
            
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            
            removeTypingIndicator();
            const aiReply = data.choices[0].message.content.trim();
            const safeAnswer = (lastUserText === "SKIP_COMMAND") ? `${q.key} - AI Suggested` : lastUserText;

            renderBotResponseWithActions(aiReply, q.key, safeAnswer);

        } catch (error) {
            console.error("Interceptor Error:", error);
            removeTypingIndicator();
            renderBotResponseWithActions("That sounds like a great direction! I've noted that down.", q.key, lastUserText);
        }
    }

    function renderBotResponseWithActions(aiReply, key, answerToSave) {
        let thoughtsMarkup = '';
        
        // Show custom text area if they've hit the regenerate limit
        if (currentRegenCount >= 4) {
            thoughtsMarkup = `
                <div class="thoughts-container">
                    <label><i class="fas fa-edit"></i> Not quite right? Tell me what you're looking for:</label>
                    <textarea id="custom-thought-text" rows="2" placeholder="e.g. Please suggest only outdoor garden venues..."></textarea>
                    <button onclick="submitCustomThoughts(this, '${key}')"><i class="fas fa-magic"></i> Apply & Regenerate</button>
                </div>
            `;
        }

        // Cap the display text at 4 visually
        let displayCount = currentRegenCount > 4 ? 4 : currentRegenCount;

        const botHtml = `
            <p>${aiReply}</p>${thoughtsMarkup}
            <div class="action-row">
                <button class="continue-btn" onclick="confirmAndMoveOn(this, '${key}', \`${answerToSave.replace(/`/g, "'")}\`)">
                    Yes, looks good! Next <i class="fas fa-check-circle"></i>
                </button>
                <button class="regen-btn" onclick="regenerateStep(this, '${key}')">
                    <i class="fas fa-rotate"></i> Regenerate Idea (${displayCount}/4)
                </button>
            </div>
        `;
        addMessage('bot', botHtml);
    }

    // ====== ACTION HANDLERS ======
    
    // REGENERATE: Removes the current bot message and fetches a new one
    window.regenerateStep = function(btnElement, key) {
        currentRegenCount++; // Increase attempt count
        
        // Remove the existing bot message from the DOM
        const botMsg = btnElement.closest('.message.bot');
        if (botMsg) botMsg.remove();
        
        const q = dynamicQuestions[currentQuestionIndex];
        
        // Call process answer with isRegen = true
        processAnswer(lastUserText, q, '', true);
    };

    // CUSTOM THOUGHTS: Takes user's typed instructions, removes old bot message, generates new response
    window.submitCustomThoughts = function(btnElement, key) {
        const thoughts = document.getElementById('custom-thought-text').value.trim();
        
        // Remove the existing bot message
        const botMsg = btnElement.closest('.message.bot');
        if (botMsg) botMsg.remove();
        
        const q = dynamicQuestions[currentQuestionIndex];
        
        // Call process answer with the custom thoughts injected and isRegen = true
        processAnswer(lastUserText, q, thoughts, true);
    };

    window.confirmAndMoveOn = function(btnElement, key, answerToSave) {
        const actionRow = btnElement.closest('.action-row');
        if (actionRow) actionRow.remove();
        
        answers[key] = answerToSave;

        // Dynamic Question Injection
        if (key === 'eventType' && !dynamicQuestions.some(q => q.key === 'entertainmentType')) {
            dynamicQuestions.splice(currentQuestionIndex + 1, 0, {
                key: 'entertainmentType',
                question: "What style of audio/visual, live performance, or DJ setup do you envision?"
            });
        }

        currentQuestionIndex++;
        askNextQuestion();
    };

    // ====== BLUEPRINT GENERATION ======
    async function generateFinalBlueprint(refinements = '') {
        disableInput(true);
        addMessage('bot', `<p>🎉 All details collected! Generating your comprehensive <strong>13-Step Event Hosting Blueprint</strong>...</p>`);
        addTypingIndicator();
        
        const prompt = `
You are Zone21 AI, the ultimate Master Event Architect.
Generate a high-detail Event Hosting Blueprint based on user choices below:

EVENT DETAILS:
${Object.entries(answers).map(([k, v]) => `- ${k}:${v}`).join('\n')}
${refinements ? `USER REFINEMENT NOTES: ${refinements}` : ''}

CRITICAL INSTRUCTIONS:
1. Under Section 8 (Venue Setup) & Section 10 (Event Team/Vendors), explicitly include REAL local service providers, venues, addresses, approximate pricing (USD), and contact details.
2. Return output strictly in clean HTML format. Use <h2>, <h3>, <ul>, and <li> with icons like <i class="fa-regular fa-square"></i>.
`;
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                    'HTTP-Referer': 'https://zone21-ai.local',
                    'X-Title': 'Zone21 AI'
                },
                body: JSON.stringify({ 
                    model: "openrouter/auto", 
                    messages: [{ role: "user", content: prompt }] 
                })
            });
            
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            
            removeTypingIndicator();
            let htmlOutput = data.choices[0].message.content.trim().replace(/^```html/i, '').replace(/^```/i, '').replace(/```$/i, '');
            
            const formattedBlueprint = `
                <div class="blueprint-result" id="final-blueprint">
                    ${htmlOutput}
                    <div class="blueprint-controls">
                        <button class="blueprint-btn btn-download" onclick="window.print()">
                            <i class="fas fa-file-pdf"></i> Download / Print PDF
                        </button>
                        <button class="blueprint-btn btn-refine" onclick="promptBlueprintRefinement()">
                            <i class="fas fa-pen-to-square"></i> Add Notes & Regenerate
                        </button>
                    </div>
                </div>
            `;
            
            addMessage('bot', formattedBlueprint);
            saveCurrentChatState(htmlOutput);

        } catch (error) {
            console.error("Blueprint Error:", error);
            removeTypingIndicator();
            addMessage('bot', `<p style="color:var(--pink);">Error generating blueprint. Click regenerate to try again.</p>`);
        }
    }

    window.promptBlueprintRefinement = function() {
        const notes = prompt("Enter additional notes, preferred vendors, or budget adjustments:");
        if (notes) generateFinalBlueprint(notes);
    };

    // ====== SMART CHAT NAMING & STORAGE ======
    function getSmartChatTitle() {
        if (answers.eventName && !answers.eventName.includes("AI Suggested") && !answers.eventName.includes("SKIP_COMMAND")) {
            return answers.eventName;
        }
        if (answers.eventType && answers.eventLocation) {
            const cleanType = answers.eventType.split('-')[0].trim();
            const cleanLoc = answers.eventLocation.split('-')[0].trim();
            return `${cleanLoc} ${cleanType}`;
        }
        if (answers.eventType) {
            return `${answers.eventType} Blueprint`;
        }
        return "New Event Blueprint";
    }

    function saveCurrentChatState(blueprintHtml = null) {
        if (!currentSessionId) currentSessionId = 'session_' + Date.now();
        
        const smartTitle = getSmartChatTitle();
        
        const chatData = {
            id: currentSessionId,
            title: smartTitle,
            answers: answers,
            messages: chat.innerHTML,
            blueprint: blueprintHtml,
            updatedAt: new Date().toISOString()
        };

        // Save to LocalStorage
        let localSessions = JSON.parse(localStorage.getItem('zone21_chats') || '{}');
        localSessions[currentSessionId] = chatData;
        localStorage.setItem('zone21_chats', JSON.stringify(localSessions));

        // Save to Firestore
        if (db && currentUser) {
            db.collection('users').doc(currentUser.uid).collection('chats').doc(currentSessionId).set(chatData, { merge: true });
        }

        renderHistorySidebar();
    }

    function deleteChatSession(sessionId, event) {
        if (event) event.stopPropagation();
        if (!confirm("Are you sure you want to delete this event chat?")) return;

        let localSessions = JSON.parse(localStorage.getItem('zone21_chats') || '{}');
        delete localSessions[sessionId];
        localStorage.setItem('zone21_chats', JSON.stringify(localSessions));

        if (db && currentUser) {
            db.collection('users').doc(currentUser.uid).collection('chats').doc(sessionId).delete().catch(e => console.error(e));
        }

        if (currentSessionId === sessionId) {
            startNewSession();
        } else {
            renderHistorySidebar();
        }
    }

    function renderHistorySidebar() {
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';

        let localSessions = JSON.parse(localStorage.getItem('zone21_chats') || '{}');
        
        Object.values(localSessions).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)).forEach(session => {
            const item = document.createElement('div');
            item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
            item.innerHTML = `
                <div class="item-info">
                    <i class="fas fa-calendar-check" style="color: var(--lime);"></i>
                    <span class="item-title">${session.title}</span>
                </div>
                <i class="fas fa-trash delete-chat-btn" title="Delete Chat" onclick="deleteChatSession('${session.id}', event)"></i>
            `;
            item.onclick = () => loadChatSession(session.id);
            historyList.appendChild(item);
        });
    }

    function loadChatSession(sessionId) {
        closeSidebar();
        let localSessions = JSON.parse(localStorage.getItem('zone21_chats') || '{}');
        const session = localSessions[sessionId];
        if (!session) return;

        currentSessionId = session.id;
        answers = session.answers || {};
        chat.innerHTML = session.messages;
        renderHistorySidebar();
    }

    function loadHistoryFromFirestore() {
        if (!db || !currentUser) return;
        db.collection('users').doc(currentUser.uid).collection('chats').orderBy('updatedAt', 'desc').get().then(snapshot => {
            snapshot.forEach(doc => {
                let localSessions = JSON.parse(localStorage.getItem('zone21_chats') || '{}');
                localSessions[doc.id] = doc.data();
                localStorage.setItem('zone21_chats', JSON.stringify(localSessions));
            });
            renderHistorySidebar();
        });
    }

    function startNewSession() {
        closeSidebar();
        currentSessionId = 'session_' + Date.now();
        currentQuestionIndex = 0;
        answers = {};
        dynamicQuestions = [...baseQuestions];
        chat.innerHTML = '';
        addMessage('bot', '<p>Hello! I am <strong>Zone21 AI</strong>. I will guide you step by step to architect your event blueprint with precise vendor recommendations! 🚀</p>');
        askNextQuestion();
    }

    // ====== LISTENERS ======
    sendBtn.addEventListener('click', () => {
        const text = textInput.value.trim();
        if (!text || isProcessing) return;
        textInput.value = '';
        processAnswer(text, dynamicQuestions[currentQuestionIndex]);
    });

    skipBtn.addEventListener('click', () => {
        if (isProcessing) return;
        textInput.value = ''; 
        processAnswer("SKIP_COMMAND", dynamicQuestions[currentQuestionIndex]);
    });

    textInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

    document.addEventListener('DOMContentLoaded', () => {
        startNewSession();
        renderHistorySidebar();
    });
</script>
</body>
</html>
