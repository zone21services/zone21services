<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone21 Event System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800; 
            --pink: #F80070;
            --white: #F8F8F8;
            --grey: #E0E0E8;
            --radius: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f4f8; padding: 20px; color: var(--navy); }
        
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: var(--radius); box-shadow: 0 10px 30px rgba(16,40,56,0.1); overflow: hidden; }
        .header { background: var(--navy); padding: 20px; color: white; text-align: center; border-bottom: 4px solid var(--lime); }
        .header h1 { color: var(--lime); font-size: 1.8rem; }
        
        .form-section { padding: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media(max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-weight: bold; font-size: 0.9rem; }
        .input-group input, .input-group select { padding: 12px; border: 1px solid var(--grey); border-radius: 8px; outline: none; transition: 0.3s; }
        .input-group input:focus, .input-group select:focus { border-color: var(--navy); }
        
        /* Checkbox Grid for Services */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
        .service-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; background: #f9fafb; padding: 10px; border-radius: 8px; border: 1px solid var(--grey); }
        .service-item input { accent-color: var(--pink); width: 16px; height: 16px; }
        
        .submit-btn { width: 100%; background: var(--navy); color: var(--lime); border: none; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        .submit-btn:hover { background: var(--lime); color: var(--navy); }
        
        /* Dashboard Results */
        #dashboard { display: none; padding: 30px; }
        .tier-card { text-align: center; padding: 20px; border-radius: var(--radius); background: var(--navy); color: white; margin-bottom: 30px; border: 2px solid var(--lime); }
        .tier-card h2 { color: var(--lime); font-size: 2rem; margin-bottom: 10px; }
        .tier-card p { font-size: 0.95rem; color: #ccc; margin-bottom: 15px; }
        .tier-features { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; list-style: none; }
        .tier-features li { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; }
        
        .budget-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .budget-table th, .budget-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--grey); }
        .budget-table th { background: #f0f4f8; font-weight: bold; }
        .security-row { background: rgba(248, 0, 112, 0.05); border-left: 4px solid var(--pink); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Zone21 System</h1>
        <p>Intelligent Event Allocation & Management</p>
    </div>

    <!-- STEP 1: The Questionnaire -->
    <div class="form-section" id="form-section">
        <form id="eventForm">
            <div class="form-grid">
                <div class="input-group">
                    <label>1. Event Name</label>
                    <input type="text" id="eventName" required placeholder="e.g. Sarah's Wedding">
                </div>
                <div class="input-group">
                    <label>2. Location</label>
                    <input type="text" id="eventLocation" required placeholder="e.g. Harare">
                </div>
                <div class="input-group">
                    <label>3. Event Type</label>
                    <select id="eventType" required>
                        <option value="Social & Private Events">Social & Private Events</option>
                        <option value="Weddings & Traditional">Weddings & Traditional Events</option>
                        <option value="Entertainment Events">Entertainment (Concerts/Shows)</option>
                        <option value="Corporate Events">Business & Corporate Events</option>
                        <option value="Community Events">Community & Cultural Events</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>4. Contact Details (Email/Phone)</label>
                    <input type="text" id="eventContact" required>
                </div>
                <div class="input-group">
                    <label>5. Total Budget (USD)</label>
                    <input type="number" id="eventBudget" required placeholder="10000" min="500">
                </div>
                <div class="input-group">
                    <label>7. Event Time</label>
                    <select id="eventTime">
                        <option>Morning</option><option>Afternoon</option><option>Evening</option><option>Full Day</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>8. Expected Attendees</label>
                    <input type="number" id="eventAttendees" required placeholder="250">
                </div>
            </div>

            <div class="input-group">
                <label>6. Select Needed Service Providers</label>
                <div class="services-grid" id="servicesContainer">
                    <!-- Populated via JS -->
                </div>
            </div>

            <button type="submit" class="submit-btn"><i class="fas fa-cogs"></i> Process & Allocate Budget</button>
        </form>
    </div>

    <!-- STEP 2: The Dashboard Result -->
    <div id="dashboard">
        <div class="tier-card" id="tierCard">
            <!-- Populated via JS -->
        </div>

        <h3 style="border-bottom: 2px solid var(--lime); padding-bottom: 10px; margin-top: 20px;">System Budget Allocation</h3>
        <table class="budget-table">
            <thead>
                <tr>
                    <th>Service Category</th>
                    <th>System Selected Provider</th>
                    <th>Allocated Budget (USD)</th>
                </tr>
            </thead>
            <tbody id="allocationBody">
                <!-- Populated via JS -->
            </tbody>
        </table>
        
        <button class="submit-btn" style="background: var(--pink); color: white;" onclick="location.reload()">Start New Allocation</button>
    </div>
</div>

<script>
    // System Data Configuration
    const serviceCategories = [
        "Event Planning & Management", "Venues & Infrastructure", "Sound, Lighting & Technical",
        "Décor & Styling", "Catering & Food", "Photography & Media", "Entertainment",
        "Zone21 Security - EXCLUSIVE", "Transport & Logistics", "Beauty & Grooming",
        "Fashion & Clothing", "Printing, Design & Branding", "Cleaning & Facilities"
    ];

    // Populate Checkboxes
    const container = document.getElementById('servicesContainer');
    serviceCategories.forEach(service => {
        container.innerHTML += `
            <label class="service-item">
                <input type="checkbox" name="services" value="${service}">
                ${service}
            </label>
        `;
    });

    document.getElementById('eventForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Gather Form Data
        const type = document.getElementById('eventType').value;
        const budget = parseFloat(document.getElementById('eventBudget').value);
        const attendees = parseInt(document.getElementById('eventAttendees').value);
        
        // Get selected services
        const selectedServices = Array.from(document.querySelectorAll('input[name="services"]:checked')).map(cb => cb.value);
        
        if(selectedServices.length === 0) {
            alert("Please select at least one service provider.");
            return;
        }

        // 1. Determine Tier Package
        let tierName, tierPrice, features;
        if (type.includes("Entertainment") || attendees > 500) {
            tierName = "Huge Event / Show Package";
            tierPrice = "$299+ (Custom Quote)";
            features = ["Budget Allocation", "Vendor Matching", "Ticket Creation & Sales", "Live Streaming", "Dashboard Tracking", "Platform Advertising"];
        } else if (type.includes("Wedding") || attendees > 100) {
            tierName = "Medium Event Package";
            tierPrice = "$199";
            features = ["Budget Allocation", "Vendor Matching", "Invitation Cards", "Live Recording", "Dashboard Tracking"];
        } else {
            tierName = "Small Event Package";
            tierPrice = "$99";
            features = ["Budget Allocation", "Vendor Matching", "Live Streaming", "Dashboard Tracking"];
        }

        // Render Tier Card
        document.getElementById('tierCard').innerHTML = `
            <p>Recommended Management Tier</p>
            <h2>${tierName} - ${tierPrice}</h2>
            <ul class="tier-features">
                ${features.map(f => `<li><i class="fas fa-check"></i> ${f}</li>`).join('')}
            </ul>
            <p style="margin-top:15px; font-size:0.8rem;">*Payment via EcoCash, USD Cash, or Bank Transfer available at checkout.</p>
        `;

        // 2. Budget Allocation Engine (Simulation)
        // In reality, this connects to Firestore to pull actual vendor prices.
        const tbody = document.getElementById('allocationBody');
        tbody.innerHTML = '';
        
        // Simple even distribution for mockup (You can add weighted logic later)
        const budgetPerService = (budget / selectedServices.length).toFixed(2);

        selectedServices.forEach(service => {
            let providerName = "System Matching Pending...";
            let rowClass = "";
            let finalBudget = budgetPerService;

            // Enforce Zone21 Security Rule
            if (service.includes("Security")) {
                providerName = "Zone21 Security Team";
                rowClass = "security-row";
            } else {
                // Mock vendor names based on category
                if(service.includes("Venues")) providerName = "Registered Venue Partner A";
                if(service.includes("Photography")) providerName = "Verified Studio B";
                if(service.includes("Catering")) providerName = "CaterPro Services";
            }

            tbody.innerHTML += `
                <tr class="${rowClass}">
                    <td>${service}</td>
                    <td>${providerName}</td>
                    <td>$${finalBudget}</td>
                </tr>
            `;
        });

        // Switch UI
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
    });
</script>
</body>
</html>
