<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone21 System | Event Blueprint Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800; 
            --pink: #F80070;
            --white: #F8F8F8;
            --grey: #E0E0E8;
            --radius: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f4f8; padding: 20px; color: var(--navy); }
        
        /* Main Container */
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: var(--radius); box-shadow: 0 10px 30px rgba(16,40,56,0.1); overflow: hidden; }
        .header { background: var(--navy); padding: 20px; color: white; text-align: center; border-bottom: 4px solid var(--lime); }
        .header h1 { color: var(--lime); font-size: 1.8rem; }
        .header p { font-size: 0.9rem; opacity: 0.9; }
        
        /* Form Styling */
        .form-section { padding: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media(max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-weight: bold; font-size: 0.9rem; }
        .input-group input, .input-group select { padding: 12px; border: 1px solid var(--grey); border-radius: 8px; outline: none; transition: 0.3s; font-size: 1rem; }
        .input-group input:focus, .input-group select:focus { border-color: var(--navy); }
        
        /* Services Checkboxes */
        .services-wrapper { margin-top: 15px; }
        .services-wrapper > label { font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; display: block; border-bottom: 2px solid var(--lime); padding-bottom: 5px; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .service-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; background: #f9fafb; padding: 10px; border-radius: 8px; border: 1px solid var(--grey); cursor: pointer; transition: 0.2s; }
        .service-item:hover { background: #f0f4f8; }
        .service-item input { accent-color: var(--pink); width: 16px; height: 16px; cursor: pointer; }
        
        /* Buttons & States */
        .submit-btn { width: 100%; background: var(--navy); color: var(--lime); border: none; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .submit-btn:hover { background: var(--lime); color: var(--navy); }
        .submit-btn:disabled { background: var(--grey); color: #888; cursor: not-allowed; }
        
        #loading { display: none; text-align: center; padding: 40px; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--pink); animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Blueprint Rendering */
        #blueprint-container { display: none; padding: 30px; background: white; }
        .blueprint-result { width: 100%; word-wrap: break-word; overflow-x: auto; color: #333; }
        .blueprint-result h2 { color: var(--navy); font-size: 1.4rem; border-bottom: 3px solid var(--lime); padding-bottom: 8px; margin-top: 25px; margin-bottom: 15px; }
        .blueprint-result h2:first-child { margin-top: 0; }
        .blueprint-result h3 { color: var(--pink); font-size: 1.1rem; margin-top: 20px; margin-bottom: 10px; }
        .blueprint-result ul { list-style: none; padding-left: 0; margin-bottom: 20px; }
        .blueprint-result li { margin-bottom: 10px; font-size: 0.95rem; line-height: 1.5; display: flex; align-items: flex-start; gap: 10px; }
        .blueprint-result li:before { content: "▪"; color: var(--lime); font-size: 1.2rem; line-height: 1; }
        .blueprint-result p { margin-bottom: 15px; line-height: 1.6; font-size: 0.95rem; }
        
        /* Budget Warning Highlight */
        .budget-warning { background: rgba(248, 0, 112, 0.1); border-left: 4px solid var(--pink); padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        
        .blueprint-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; border-top: 1px solid var(--grey); padding-top: 20px; }
        .action-btn { padding: 12px 20px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 1rem; transition: 0.2s; }
        .btn-download { background: #28a745; color: white; }
        .btn-download:hover { background: #218838; }
        .btn-reset { background: var(--navy); color: white; }
        .btn-reset:hover { background: #0a1924; }

        /* Print Formatting for A4 */
        @media print {
            @page { size: A4; margin: 20mm; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; border-radius: 0; }
            .header, .blueprint-controls { display: none !important; }
            #blueprint-container { padding: 0; }
            .blueprint-result { border: none; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Zone21 System</h1>
        <p>Intelligent Event Allocation & Blueprint Generation</p>
    </div>

    <!-- The Questionnaire -->
    <div class="form-section" id="form-section">
        <form id="eventForm">
            <div class="form-grid">
                <div class="input-group">
                    <label>1. Event Name</label>
                    <input type="text" id="eventName" required placeholder="e.g. Sarah's Wedding">
                </div>
                <div class="input-group">
                    <label>2. Location (City/Area)</label>
                    <input type="text" id="eventLocation" required placeholder="e.g. Harare, Zimbabwe">
                </div>
                <div class="input-group">
                    <label>3. Event Type</label>
                    <select id="eventType" required>
                        <option value="" disabled selected>Select Event Type...</option>
                        <option value="Social & Private Events">Social & Private Events</option>
                        <option value="Weddings & Traditional">Weddings & Traditional</option>
                        <option value="Entertainment Events">Entertainment (Concerts/Shows)</option>
                        <option value="Business & Corporate">Business & Corporate</option>
                        <option value="School & University">School & University</option>
                        <option value="Religious Events">Religious Events</option>
                        <option value="Community & Cultural">Community & Cultural</option>
                        <option value="Sports Events">Sports Events</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>4. Contact Details</label>
                    <input type="text" id="eventContact" required placeholder="Email or Phone">
                </div>
                <div class="input-group">
                    <label>5. Total Budget (USD)</label>
                    <input type="number" id="eventBudget" required placeholder="e.g. 5000" min="100">
                </div>
                <div class="input-group">
                    <label>6. Event Time</label>
                    <select id="eventTime" required>
                        <option value="" disabled selected>Select Time...</option>
                        <option value="Morning">Morning</option>
                        <option value="Afternoon">Afternoon</option>
                        <option value="Evening">Evening</option>
                        <option value="Full Day">Full Day</option>
                    </select>
                </div>
                <div class="input-group" style="grid-column: 1 / -1;">
                    <label>7. Expected Attendees</label>
                    <input type="number" id="eventAttendees" required placeholder="e.g. 250">
                </div>
            </div>

            <div class="services-wrapper">
                <label>8. Select Required Service Providers</label>
                <div class="services-grid" id="servicesContainer">
                    <!-- Checkboxes injected via JS -->
                </div>
            </div>

            <button type="submit" class="submit-btn" id="generateBtn">
                <i class="fas fa-magic"></i> Generate System Blueprint
            </button>
        </form>
    </div>

    <!-- Loading State -->
    <div id="loading">
        <div class="spinner"></div>
        <h3 style="color: var(--navy);">Zone21 System is processing your allocation...</h3>
        <p style="color: #666; font-size: 0.9rem; margin-top: 5px;">Analyzing budget, finding local vendors, and drafting blueprint.</p>
    </div>

    <!-- Blueprint Result -->
    <div id="blueprint-container">
        <div class="blueprint-result" id="final-blueprint">
            <!-- AI Generated HTML injected here -->
        </div>
        
        <div class="blueprint-controls">
            <button class="action-btn btn-download" onclick="window.print()">
                <i class="fas fa-file-pdf"></i> Download A4 Blueprint
            </button>
            <button class="action-btn btn-reset" onclick="location.reload()">
                <i class="fas fa-rotate-left"></i> Start New Event
            </button>
        </div>
    </div>
</div>

<script>
    // Configuration
    const OPENROUTER_API_KEY = "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"; 
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";

    // Categories List
    const serviceCategories = [
        "Event Planning & Management", "Venues & Event Infrastructure", "Sound, Lighting & Technical",
        "Décor & Styling", "Catering & Food", "Photography & Media", "Entertainment",
        "Zone21 Security - EXCLUSIVE", "Transport & Logistics", "Beauty & Grooming",
        "Fashion & Clothing", "Wedding Services", "Traditional & Cultural Events",
        "Printing, Design & Branding", "Gifts & Guest Services", "Cleaning & Facilities"
    ];

    // Populate the form checkboxes
    const container = document.getElementById('servicesContainer');
    serviceCategories.forEach(service => {
        container.innerHTML += `
            <label class="service-item">
                <input type="checkbox" name="services" value="${service}">
                ${service}
            </label>
        `;
    });

    // Form Submission
    document.getElementById('eventForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Ensure at least one service is selected
        const selectedServices = Array.from(document.querySelectorAll('input[name="services"]:checked')).map(cb => cb.value);
        if(selectedServices.length === 0) {
            alert("Please select at least one service provider.");
            return;
        }

        // Gather Inputs
        const eventData = {
            name: document.getElementById('eventName').value,
            location: document.getElementById('eventLocation').value,
            type: document.getElementById('eventType').value,
            contact: document.getElementById('eventContact').value,
            budget: document.getElementById('eventBudget').value,
            time: document.getElementById('eventTime').value,
            attendees: document.getElementById('eventAttendees').value,
            services: selectedServices.join(", ")
        };

        // UI State Change
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        // Construct System Prompt
        const prompt = `
You are the internal Zone21 Event System. 
Generate a formal, highly detailed Event Blueprint based on the following submitted criteria:

EVENT DETAILS:
- Event Name: ${eventData.name}
- Location: ${eventData.location}
- Event Type: ${eventData.type} - Total Budget: $${eventData.budget}
- Expected Attendees: ${eventData.attendees}
- Time: ${eventData.time}
- Services Requested: ${eventData.services}  CRITICAL INSTRUCTIONS: 1. BUDGET ANALYSIS & WARNING (Crucial): Evaluate if $${eventData.budget} is realistic for ${eventData.attendees} people with the requested services in${eventData.location}. 
   - If the budget is insufficient, start the blueprint with a highly visible "Budget Analysis" section. Clearly explain why it's not enough, suggest what the ideal budget should be, and specifically recommend which minor services to remove to make the current budget work.
2. VENDOR ALLOCATION: Allocate the budget across the requested services. Suggest REAL, popular local venues and specific vendor names for ${eventData.location}. Provide approximate price allocations in USD for each service.
3. ZONE21 SECURITY RULE: If "Zone21 Security - EXCLUSIVE" was selected, you MUST allocate the security budget strictly to "Zone21 Security". Do not suggest external security firms.
4. FORMAT: Output strictly in clean HTML format. Use <h2> for main sections, <h3> for sub-sections, and <ul>/<li> for lists. Do NOT include markdown blocks like \`\`\`html. 
`;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                    'HTTP-Referer': 'https://zone21-ai.local',
                    'X-Title': 'Zone21 System'
                },
                body: JSON.stringify({ 
                    model: "openrouter/auto", 
                    messages: [{ role: "user", content: prompt }] 
                })
            });
            
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            
            let htmlOutput = data.choices[0].message.content.trim().replace(/^```html/i, '').replace(/^```/i, '').replace(/```$/i, '');
            
            // Render Output
            document.getElementById('loading').style.display = 'none';
            document.getElementById('blueprint-container').style.display = 'block';
            
            // Wrap any "Budget Analysis" or "Warning" text in the warning CSS class for visibility
            htmlOutput = htmlOutput.replace(/(<h[23]>.*?Budget (Analysis|Warning).*?<\/h[23]>[\s\S]*?(?=<(h[23]|div)>|$))/i, '<div class="budget-warning">$1</div>');
            
            document.getElementById('final-blueprint').innerHTML = htmlOutput;

        } catch (error) {
            console.error("System Error:", error);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
            alert("The system encountered an error generating the blueprint. Please try again.");
        }
    });
</script>

</body>
</html>
