<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zone21 System | Event Blueprint Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK (Keep your credentials here if needed) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800; 
            --pink: #F80070;
            --white: #F8F8F8;
            --grey: #E0E0E8;
            --radius: 16px;
            --radius-xl: 24px;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e8eef4 50%, #f5f3f1 100%);
            height: 100dvh; 
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
            color: var(--navy);
        }

        /* Sidebar & History Layout */
        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.4); z-index: 999; opacity: 0; transition: opacity 0.3s ease;
        }
        .sidebar {
            width: 300px; background: var(--navy); border-radius: var(--radius-xl); color: white;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 60px rgba(16,40,56,0.15); transition: transform 0.3s ease; z-index: 1000;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .new-chat-btn { background: var(--lime); color: var(--navy); border: none; padding: 12px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; transition: 0.2s; }
        .new-chat-btn:hover { background: white; }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        .history-item { 
            padding: 10px 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 8px; 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; transition: 0.2s; gap: 8px;
        }
        .history-item:hover { background: rgba(255,255,255,0.15); }
        .history-item.active { border-left: 4px solid var(--lime); background: rgba(255,255,255,0.1); }
        .history-item .item-info { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; }
        .history-item .item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white; }
        .history-item .delete-btn { color: rgba(255,255,255,0.4); padding: 4px; border-radius: 4px; transition: 0.2s; }
        .history-item .delete-btn:hover { color: var(--pink); background: rgba(248, 0, 112, 0.15); }

        /* Main Workspace Container */
        .workspace {
            flex: 1; background: white; border-radius: var(--radius-xl);
            box-shadow: 0 20px 60px rgba(16,40,56,0.15); display: flex; flex-direction: column; overflow: hidden; position: relative;
        }
        .workspace-header { background: var(--navy); color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 4px solid var(--lime); z-index: 10; }
        .menu-btn { display: none; background: transparent; border: none; font-size: 1.4rem; color: white; cursor: pointer; padding: 5px; }
        .workspace-header h1 { font-size: 1.3rem; color: var(--lime); margin: 0; }
        .workspace-header p { font-size: 0.8rem; color: rgba(255,255,255,0.8); margin: 0; }

        .workspace-content { flex: 1; overflow-y: auto; padding: 20px; background: #fafbfc; scroll-behavior: smooth; }
        
        /* Form Styling */
        .form-section { background: white; padding: 25px; border-radius: 16px; border: 1px solid var(--grey); box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media(max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-weight: bold; font-size: 0.9rem; }
        .input-group input, .input-group select, .input-group textarea { padding: 12px; border: 1px solid var(--grey); border-radius: 8px; outline: none; transition: 0.3s; font-size: 0.95rem; background: #f9fafb; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--navy); background: white; }
        .input-group textarea { resize: vertical; min-height: 80px; }
        
        /* Services Checkboxes (Granular) */
        .services-wrapper { margin-top: 15px; }
        .services-wrapper > label { font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; display: block; border-bottom: 2px solid var(--lime); padding-bottom: 5px; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
        .service-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; background: #f0f4f8; padding: 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: 0.2s; }
        .service-item:hover { background: #e8eef4; border-color: var(--grey); }
        .service-item input { accent-color: var(--pink); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
        
        .submit-btn { width: 100%; background: var(--navy); color: var(--lime); border: none; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .submit-btn:hover { background: var(--lime); color: var(--navy); }
        .submit-btn:disabled { background: var(--grey); color: #888; cursor: not-allowed; }
        
        /* Loading & Blueprint Styling (From Original Neat Code) */
        #loading { display: none; text-align: center; padding: 40px; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--pink); animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #blueprint-container { display: none; }
        .blueprint-wrapper { width: 100%; margin-top: 10px; animation: fadeInUp 0.3s ease forwards; }
        
        .blueprint-result { 
            background: white; padding: 30px; border-radius: 16px; 
            border: 1px solid var(--grey); width: 100%; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            word-wrap: break-word; overflow-x: auto;
        }
        .blueprint-result h2 { color: var(--navy); font-size: 1.4rem; border-bottom: 3px solid var(--lime); padding-bottom: 8px; margin-top: 25px; margin-bottom: 15px; }
        .blueprint-result h2:first-child { margin-top: 0; }
        .blueprint-result h3 { color: var(--pink); font-size: 1.1rem; margin-top: 20px; margin-bottom: 10px; }
        .blueprint-result ul { list-style: none; padding-left: 0; margin-bottom: 20px; }
        .blueprint-result li { margin-bottom: 10px; font-size: 0.95rem; line-height: 1.6; color: #333; display: flex; align-items: flex-start; gap: 10px; }
        .blueprint-result li:before { content: "▪"; color: var(--lime); font-size: 1.2rem; line-height: 1; }
        .blueprint-result p { margin-bottom: 15px; line-height: 1.6; color: #444; font-size: 0.95rem; }
        
        /* Warning Box */
        .budget-warning { background: rgba(248, 0, 112, 0.05); border-left: 4px solid var(--pink); padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        .budget-warning h2, .budget-warning h3 { border-bottom: none; color: var(--pink); margin-top: 0; }

        .blueprint-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; border-top: 1px solid var(--grey); padding-top: 20px; }
        .action-btn { padding: 10px 18px; border-radius: 30px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; transition: 0.2s; }
        .btn-download { background: #28a745; color: white; }
        .btn-regen { background: #f0f4f8; color: var(--navy); border: 1px solid var(--grey); }
        .btn-regen:hover { background: var(--navy); color: white; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive & Print */
        @media (max-width: 768px) {
            body { padding: 0; gap: 0; }
            .workspace { border-radius: 0; box-shadow: none; }
            .menu-btn { display: block; }
            .sidebar { position: fixed; top: 0; left: -320px; height: 100dvh; width: 280px; border-radius: 0 24px 24px 0; }
            .sidebar.active { transform: translateX(320px); }
            .sidebar-overlay.active { display: block; opacity: 1; }
            .workspace-content { padding: 15px 10px; }
            .form-section { padding: 15px; border-radius: 12px; }
            .blueprint-result { padding: 15px; border-radius: 12px; }
        }

        @media print {
            @page { size: A4; margin: 20mm; }
            body * { visibility: hidden; }
            .blueprint-wrapper, .blueprint-wrapper * { visibility: visible; }
            .blueprint-wrapper { position: absolute; left: 0; top: 0; width: 100%; margin: 0; }
            .blueprint-result { border: none; box-shadow: none; padding: 0; max-width: 100%; }
            .blueprint-controls { display: none !important; }
            .workspace { box-shadow: none; overflow: visible; }
        }
    </style>
</head>
<body>

<!-- Sidebar Setup -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div><h2>Past Events</h2></div>
    </div>
    <div style="padding: 0 20px;">
        <button class="new-chat-btn" onclick="startNewSession()"><i class="fas fa-plus"></i> New Event</button>
    </div>
    <div class="history-list" id="history-list"></div>
</div>

<!-- Main Workspace -->
<div class="workspace">
    <div class="workspace-header">
        <button class="menu-btn" id="menu-btn"><i class="fas fa-bars"></i></button>
        <div>
            <h1>Zone21 System</h1>
            <p>Event Allocation & Blueprint Generation</p>
        </div>
    </div>

    <div class="workspace-content" id="workspace-content">
        
        <!-- The Questionnaire -->
        <div class="form-section" id="form-section">
            <form id="eventForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>1. Event Name</label>
                        <input type="text" id="eventName" required placeholder="e.g. Sarah's Wedding">
                    </div>
                    <div class="input-group">
                        <label>2. Location (City/Area)</label>
                        <input type="text" id="eventLocation" required placeholder="e.g. Harare, Zimbabwe">
                    </div>
                    <div class="input-group">
                        <label>3. Event Type</label>
                        <select id="eventType" required>
                            <option value="" disabled selected>Select Event Type...</option>
                            <option value="Social & Private Events">Social & Private Events</option>
                            <option value="Weddings & Traditional">Weddings & Traditional</option>
                            <option value="Entertainment Events">Entertainment (Concerts/Shows)</option>
                            <option value="Business & Corporate">Business & Corporate</option>
                            <option value="School & University">School & University</option>
                            <option value="Religious Events">Religious Events</option>
                            <option value="Community & Cultural">Community & Cultural</option>
                            <option value="Sports Events">Sports Events</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>4. Contact Details</label>
                        <input type="text" id="eventContact" required placeholder="Email or Phone">
                    </div>
                    <div class="input-group">
                        <label>5. Total Budget (USD)</label>
                        <input type="number" id="eventBudget" required placeholder="e.g. 500" min="50">
                    </div>
                    <div class="input-group">
                        <label>6. Expected Attendees</label>
                        <input type="number" id="eventAttendees" required placeholder="e.g. 50">
                    </div>
                </div>

                <!-- Optional Notes -->
                <div class="input-group" style="margin-bottom: 15px;">
                    <label>7. Additional Notes or Requests (Optional)</label>
                    <textarea id="eventNotes" placeholder="e.g. The budget is strict, prioritizing a good PA system over decorations..."></textarea>
                </div>

                <!-- Granular Services -->
                <div class="services-wrapper">
                    <label>8. Select Required Service Providers</label>
                    <div class="services-grid" id="servicesContainer">
                        <!-- Checkboxes injected via JS -->
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="generateBtn">
                    <i class="fas fa-magic"></i> Generate System Blueprint
                </button>
            </form>
        </div>

        <!-- Loading State -->
        <div id="loading">
            <div class="spinner"></div>
            <h3 style="color: var(--navy);">Zone21 System is processing your allocation...</h3>
            <p style="color: #666; font-size: 0.9rem; margin-top: 5px;">Analyzing budget, matching local vendors, and drafting blueprint.</p>
        </div>

        <!-- Blueprint Result -->
        <div id="blueprint-container">
            <div class="blueprint-wrapper">
                <div class="blueprint-result" id="final-blueprint">
                    <!-- AI Generated HTML injected here -->
                </div>
                
                <div class="blueprint-controls">
                    <button class="action-btn btn-download" onclick="window.print()">
                        <i class="fas fa-file-pdf"></i> Download Blueprint
                    </button>
                    <button class="action-btn btn-regen" onclick="generateBlueprint(true)">
                        <i class="fas fa-rotate"></i> Regenerate Allocations
                    </button>
                </div>
            </div>
        </div>
        
    </div>
</div>

<script>
    // Config
    const OPENROUTER_API_KEY = "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"; 
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";

    // Granular, Budget-Friendly Categories
    const granularServices = [
        "Event Planner / Coordinator", "Venue / Space Rental", "Marquee / Tents & Chairs", 
        "PA System & Basic Sound", "DJ Services", "Stage & Decorative Lighting", 
        "Event Décor & Draping", "Catering (Food & Buffet)", "Beverages & Mobile Bar", 
        "Cake Designer / Baker", "Photographer", "Videographer", 
        "MC (Master of Ceremonies)", "Makeup Artist", "Hairstylist", 
        "Zone21 Security - EXCLUSIVE", "Transport / Car Hire", 
        "Cleaning Services", "Ushers & Hostesses"
    ];

    let currentSessionId = null;
    let currentEventData = null; // Stores form data for regeneration

    // Sidebar Mobile Toggle
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    function closeSidebar() { sidebar.classList.remove('active'); overlay.classList.remove('active'); }
    if (menuBtn) menuBtn.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
    if (overlay) overlay.addEventListener('click', closeSidebar);

    // Populate the checkboxes
    const container = document.getElementById('servicesContainer');
    granularServices.forEach(service => {
        container.innerHTML += `
            <label class="service-item">
                <input type="checkbox" name="services" value="${service}">
                ${service}
            </label>
        `;
    });

    // Handle Form Submit
    document.getElementById('eventForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const selectedServices = Array.from(document.querySelectorAll('input[name="services"]:checked')).map(cb => cb.value);
        if(selectedServices.length === 0) {
            alert("Please select at least one service provider.");
            return;
        }

        currentEventData = {
            name: document.getElementById('eventName').value,
            location: document.getElementById('eventLocation').value,
            type: document.getElementById('eventType').value,
            contact: document.getElementById('eventContact').value,
            budget: document.getElementById('eventBudget').value,
            attendees: document.getElementById('eventAttendees').value,
            notes: document.getElementById('eventNotes').value,
            services: selectedServices.join(", ")
        };

        generateBlueprint(false);
    });

    // Core Generation Logic
    async function generateBlueprint(isRegenerating) {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('blueprint-container').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        
        // Ensure we have a session ID
        if (!currentSessionId || !isRegenerating) {
            currentSessionId = 'evt_' + Date.now();
        }

        const prompt = `
You are the Zone21 Event System. Generate a formal, highly detailed Event Blueprint based on these criteria:

EVENT DETAILS:
- Event Name: ${currentEventData.name}
- Location: ${currentEventData.location}
- Event Type: ${currentEventData.type} - Total Budget: $${currentEventData.budget}
- Expected Attendees: ${currentEventData.attendees}
- Additional Notes: ${currentEventData.notes || 'None'}
- Specific Services Required: ${currentEventData.services}  CRITICAL INSTRUCTIONS: 1. BUDGET ANALYSIS & WARNING (Crucial): Evaluate if $${currentEventData.budget} is realistic for ${currentEventData.attendees} people with the requested services in${currentEventData.location}. 
   - If the budget is insufficient, start the blueprint with a highly visible "Budget Analysis" section. Clearly explain why it's not enough, suggest what the ideal budget should be, and specifically recommend which minor services to remove to make the current budget work.
2. VENDOR ALLOCATION: Allocate the budget across the requested services. Suggest REAL, popular local vendors for ${currentEventData.location}. 
3. CONTACT DETAILS: You MUST include realistic or actual contact details (phone, email, or social media handles) for the suggested vendors if available.
4. ZONE21 SECURITY RULE: If "Zone21 Security - EXCLUSIVE" was selected, allocate the security budget strictly to "Zone21 Security Team".
5. FORMAT: Output strictly in clean HTML format. Use <h2> for main sections, <h3> for sub-sections, and <ul>/<li> for lists. Do NOT include markdown blocks like \`\`\`html. 
`;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                    'HTTP-Referer': 'https://zone21-ai.local',
                    'X-Title': 'Zone21 System'
                },
                body: JSON.stringify({ 
                    model: "openrouter/auto", 
                    messages: [{ role: "user", content: prompt }] 
                })
            });
            
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            
            let htmlOutput = data.choices[0].message.content.trim().replace(/^```html/i, '').replace(/^```/i, '').replace(/```$/i, '');
            
            // Format Warnings
            htmlOutput = htmlOutput.replace(/(<h[23]>.*?Budget (Analysis|Warning).*?<\/h[23]>[\s\S]*?(?=<(h[23]|div)>|$))/i, '<div class="budget-warning">$1</div>');
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('blueprint-container').style.display = 'block';
            document.getElementById('final-blueprint').innerHTML = htmlOutput;
            
            saveBlueprintState(htmlOutput);

        } catch (error) {
            console.error("System Error:", error);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
            alert("The system encountered an error generating the blueprint. Please try again.");
        }
    }

    // ====== STORAGE & HISTORY ======
    function saveBlueprintState(htmlOutput) {
        const title = currentEventData.name || `${currentEventData.location} Event`;
        
        const chatData = {
            id: currentSessionId,
            title: title,
            formData: currentEventData,
            blueprintHtml: htmlOutput,
            updatedAt: new Date().toISOString()
        };

        let localSessions = JSON.parse(localStorage.getItem('zone21_events') || '{}');
        localSessions[currentSessionId] = chatData;
        localStorage.setItem('zone21_events', JSON.stringify(localSessions));

        renderHistorySidebar();
    }

    function renderHistorySidebar() {
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';

        let localSessions = JSON.parse(localStorage.getItem('zone21_events') || '{}');
        
        Object.values(localSessions).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)).forEach(session => {
            const item = document.createElement('div');
            item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
            item.innerHTML = `
                <div class="item-info">
                    <i class="fas fa-clipboard-list" style="color: var(--lime);"></i>
                    <span class="item-title">${session.title}</span>
                </div>
                <i class="fas fa-trash delete-btn" title="Delete" onclick="deleteBlueprintSession('${session.id}', event)"></i>
            `;
            item.onclick = () => loadBlueprintSession(session.id);
            historyList.appendChild(item);
        });
    }

    function loadBlueprintSession(sessionId) {
        closeSidebar();
        let localSessions = JSON.parse(localStorage.getItem('zone21_events') || '{}');
        const session = localSessions[sessionId];
        if (!session) return;

        currentSessionId = session.id;
        currentEventData = session.formData;
        
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('blueprint-container').style.display = 'block';
        document.getElementById('final-blueprint').innerHTML = session.blueprintHtml;
        
        renderHistorySidebar();
    }

    function deleteBlueprintSession(sessionId, event) {
        if (event) event.stopPropagation(); 
        if (!confirm("Delete this event blueprint?")) return;

        let localSessions = JSON.parse(localStorage.getItem('zone21_events') || '{}');
        delete localSessions[sessionId];
        localStorage.setItem('zone21_events', JSON.stringify(localSessions));

        if (currentSessionId === sessionId) {
            startNewSession();
        } else {
            renderHistorySidebar();
        }
    }

    function startNewSession() {
        closeSidebar();
        currentSessionId = null;
        currentEventData = null;
        
        document.getElementById('eventForm').reset();
        document.getElementById('blueprint-container').style.display = 'none';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('form-section').style.display = 'block';
        
        renderHistorySidebar();
    }

    // Init Sidebar on load
    document.addEventListener('DOMContentLoaded', renderHistorySidebar);
</script>

</body>
</html>
