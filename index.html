    <style>
        :root {
            --navy: #102838;
            --navy-dark: #0A1B24;
            --lime: #C0C800;
            --lime-hover: #A8B000;
            --pink: #F80070;
            --pink-hover: #D60061;
            --white: #F8F8F8;
            --light-grey: #E0E0E8;
            --black: #101010;
            --border-grey: #d1d5db;
            --card-bg: #FFFFFF;
            --text-dark: #1a202c;
            --error-red: #DC2626;
            --success-green: #10B981;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 10px;
            --shadow-card: 0 8px 30px rgba(16, 40, 56, 0.07);
            --shadow-elevated: 0 15px 50px rgba(16, 40, 56, 0.12);
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.35s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(160deg, #f0f4f8 0%, #e8eef4 30%, #f5f3f1 70%, #fefefe 100%);
            background-attachment: fixed;
            color: var(--navy);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== APP CONTAINER ===== */
        .app-container {
            width: 100%; max-width: 960px; margin: 0 auto;
            padding: 40px 20px 100px;
            display: flex; flex-direction: column; align-items: center; gap: 24px;
            min-height: 100vh;
        }

        /* ===== TOAST ===== */
        #toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 99999;
            display: flex; flex-direction: column; gap: 12px; pointer-events: none;
        }
        .toast {
            padding: 1rem 1.4rem; border-radius: var(--radius-md); color: #fff;
            font-weight: 600; font-size: 0.9rem;
            box-shadow: 0 15px 50px rgba(16,40,56,0.12);
            animation: slideInToast 0.35s ease forwards;
            display: flex; align-items: center; gap: 12px; min-width: 280px;
            pointer-events: auto;
        }
        .toast.error { background: var(--error-red); }
        .toast.success { background: var(--success-green); }
        .toast.info { background: var(--navy); color: var(--lime); }
        @keyframes slideInToast {
            from { transform: translateX(40px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ===== AUTH CARD ===== */
        .auth-card {
            width: 100%; background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-grey);
            position: relative; overflow: hidden;
        }
        .auth-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--navy) 0%, var(--lime) 40%, var(--pink) 80%, var(--navy) 100%);
        }
        .auth-welcome { text-align: center; margin-bottom: 2rem; }
        .auth-welcome img {
            width: 80px; height: 80px; border-radius: 50%;
            object-fit: contain; margin-bottom: 1rem;
            background: var(--light-grey);
        }
        .role-switcher {
            display: flex; background: #f5f7fa; border-radius: 60px;
            padding: 6px; margin-bottom: 1.8rem; border: 1px solid var(--border-grey);
        }
        .role-btn {
            flex: 1; text-align: center; padding: 0.85rem 1rem;
            border-radius: 60px; cursor: pointer; font-weight: 600;
            color: #718691; transition: all 0.35s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            border: none; background: transparent;
        }
        .role-btn.active {
            background: var(--navy); color: #fff;
        }
        .role-btn.service-provider-active.active {
            background: var(--pink);
        }

        .form-group { margin-bottom: 1.2rem; }
        .form-label {
            display: block; font-weight: 700; font-size: 0.8rem;
            margin-bottom: 0.5rem; color: var(--navy);
            text-transform: uppercase;
        }
        .form-input, .form-select {
            width: 100%; padding: 0.95rem 1.2rem;
            border: 1.8px solid var(--border-grey);
            border-radius: var(--radius-md);
            font-size: 0.95rem; outline: none;
            background: #fafbfc; color: var(--navy);
        }
        .btn {
            padding: 0.95rem 1.6rem; border-radius: 60px;
            font-weight: 700; font-size: 0.95rem; cursor: pointer;
            border: none; display: inline-flex; align-items: center;
            justify-content: center; gap: 0.5rem;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--navy); color: #fff; }
        .btn-lime { background: var(--lime); color: var(--navy); }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-block { width: 100%; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .spinner {
            display: inline-block;
            width: 1.2rem;
            height: 1.2rem;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 3rem; }
        .password-toggle {
            position: absolute; right: 14px; top: 42px;
            cursor: pointer; color: var(--navy); font-size: 1.1rem;
        }
        .forgot-link { font-size: 0.85rem; color: var(--navy); font-weight: 700; text-decoration: none; }

        .back-link {
            display: block; text-align: center; margin-top: 1rem;
            color: var(--navy); cursor: pointer; font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>

    ];

    // Populate country dropdown
    function populateCountries() {
        const select = document.getElementById('reg-country');
        if (!select) return;
        countriesList.forEach(country => {
            const option = document.createElement('option');
            option.value = country;
            option.textContent = country;
            select.appendChild(option);
        });
    }

    // Call on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', () => {
        populateCountries();
    });

    // ================= HELPER FUNCTIONS =================
    window.showToast = (msg, type='info') => {
        const container = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.innerHTML = `<i class="fa-solid ${type==='success'?'fa-circle-check':type==='error'?'fa-circle-exclamation':'fa-circle-info'}"></i> ${msg}`;
        container.appendChild(t);
        setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 4000);
    };

    window.togglePassword = (inputId, icon) => {
        const inp = document.getElementById(inputId);
        inp.type = inp.type === 'password' ? 'text' : 'password';
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    };

    window.switchAuthView = (view) => {
        document.getElementById('login-view').style.display = view==='login'?'block':'none';
        document.getElementById('register-view').style.display = view==='login'?'none':'block';
    };

    window.selectRole = (role) => {
        window.activeRole = role;
        document.getElementById('role-organizer').classList.toggle('active', role==='organizer');
        document.getElementById('role-service').classList.toggle('active', role==='service_provider');
        // Show/hide fields
        document.getElementById('company-group').style.display = role==='organizer' ? 'block' : 'none';
        document.getElementById('service-type-group').style.display = role==='service_provider' ? 'block' : 'none';
        // Update required attribute
        document.getElementById('reg-company').required = (role==='organizer');
        document.getElementById('reg-service-type').required = (role==='service_provider');
    };

    // Initialize role
    selectRole('organizer');

    // ================= AUTH HANDLERS =================
    window.handleLogin = async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-password').value;
        const btn = document.getElementById('btn-login');
        const btnText = document.getElementById('login-btn-text');
        const spinner = document.getElementById('login-spinner');

        // Disable button and show spinner
        btn.disabled = true;
        btnText.style.display = 'none';
        spinner.style.display = 'inline-block';

        try {
            const cred = await window.fb.signInWithEmailAndPassword(window.auth, email, pass);
            const userDoc = await window.fb.getDoc(window.fb.doc(window.db, "users", cred.user.uid));
            const data = userDoc.exists() ? userDoc.data() : { email: cred.user.email, role: 'organizer' };
            window.currentUser = { uid: cred.user.uid, ...data };
            window.activeRole = data.role || 'organizer';
            showToast("Login successful!", 'success');

            // Redirect based on role
            if (window.activeRole === 'service_provider') {
                window.location.href = 'vendordashboard.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        } catch (err) {
            showToast(sanitizeError(err), 'error');
            // Re-enable button
            btn.disabled = false;
            btnText.style.display = 'inline';
            spinner.style.display = 'none';
        }
    };

    window.handleRegister = async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const country = document.getElementById('reg-country').value;
        const pass = document.getElementById('reg-password').value;
        const confirmPass = document.getElementById('reg-confirm-password').value;
        const btn = document.getElementById('btn-register');
        const btnText = document.getElementById('register-btn-text');
        const spinner = document.getElementById('register-spinner');

        // Disable button and show spinner
        btn.disabled = true;
        btnText.style.display = 'none';
        spinner.style.display = 'inline-block';

        if (pass !== confirmPass) {
            showToast("Passwords do not match!", 'error');
            btn.disabled = false;
            btnText.style.display = 'inline';
            spinner.style.display = 'none';
            return;
        }
        if (window.activeRole === 'organizer' && !document.getElementById('reg-company').value.trim()) {
            showToast("Company name is required for organizers.", 'error');
            btn.disabled = false;
            btnText.style.display = 'inline';
            spinner.style.display = 'none';
            return;
        }
        if (window.activeRole === 'service_provider' && !document.getElementById('reg-service-type').value) {
            showToast("Please select your service type.", 'error');
            btn.disabled = false;
            btnText.style.display = 'inline';
            spinner.style.display = 'none';
            return;
        }

        try {
            const cred = await window.fb.createUserWithEmailAndPassword(window.auth, email, pass);
            await window.fb.sendEmailVerification(cred.user);

            // Build base user data
            const userData = {
                uid: cred.user.uid,
                name,
                email,
                phone,
                country,
                role: window.activeRole,
                createdAt: window.fb.serverTimestamp(),
            };

            if (window.activeRole === 'organizer') {
                userData.company = document.getElementById('reg-company').value.trim();
            } else {
                userData.serviceType = document.getElementById('reg-service-type').value;
                // Create a corresponding service provider profile document
                const providerData = {
                    name: name,
                    email: email,
                    phone: phone,
                    location: country,
                    category: userData.serviceType,  // serviceType becomes the category
                    services: [userData.serviceType], // initial services list
                    description: '',
                    images: [],
                    rating: 0,
                    reviewsCount: 0,
                    status: 'approved', // or 'pending' depending on your workflow
                    createdAt: window.fb.serverTimestamp(),
                    updatedAt: window.fb.serverTimestamp()
                };
                // Save to serviceProviders using UID as document ID
                await window.fb.setDoc(window.fb.doc(window.db, "serviceProviders", cred.user.uid), providerData);
            }

            // Save user profile in users collection
            await window.fb.setDoc(window.fb.doc(window.db, "users", cred.user.uid), userData);

            window.currentUser = { uid: cred.user.uid, ...userData };
            window.activeRole = userData.role;
            showToast("Account created! Redirecting...", 'success');

            // Redirect based on role
            if (window.activeRole === 'service_provider') {
                window.location.href = 'vendordashboard.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        } catch (err) {
            showToast(sanitizeError(err), 'error');
            if (err.code === 'auth/email-already-in-use') {
                switchAuthView('login');
                document.getElementById('login-email').value = email;
            }
            // Re-enable button
            btn.disabled = false;
            btnText.style.display = 'inline';
            spinner.style.display = 'none';
        }
    };

    window.handleForgotPassword = (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        if (!email) {
            showToast("Please enter your email address first.", 'error');
            return;
        }
        // Use actionCodeSettings to improve deliverability and link back to this page
        const actionCodeSettings = {
            url: window.location.origin + window.location.pathname,
            handleCodeInApp: true
        };
        window.fb.sendPasswordResetEmail(window.auth, email, actionCodeSettings)
            .then(() => showToast("Password reset email sent. Check your inbox.", 'success'))
            .catch(err => showToast(sanitizeError(err), 'error'));
    };

    window.handleNewPasswordSubmit = (e) => {
        e.preventDefault();
        const pass = document.getElementById('new-reset-pass').value;
        const confirm = document.getElementById('confirm-reset-pass').value;
        const btn = document.getElementById('btn-reset-submit');
        if (pass !== confirm) {
            showToast("Passwords do not match", 'error');
            return;
        }
        btn.disabled = true;
        window.fb.confirmPasswordReset(window.auth, window.resetOobCode, pass)
            .then(() => {
                showToast("Password updated! Redirecting...", 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 2000);
            })
            .catch(err => {
                showToast(sanitizeError(err), 'error');
                btn.disabled = false;
            });
    };

    window.goBackToLogin = () => {
        document.getElementById('reset-password-panel').style.display = 'none';
        document.getElementById('auth-panel').style.display = 'block';
        window.history.replaceState({}, document.title, window.location.pathname);
        window.resetOobCode = null;
    };

    function sanitizeError(err) {
        const msg = (err?.message || '').toLowerCase();
        if (msg.includes('invalid-credential') || msg.includes('wrong-password')) return 'Incorrect email or password.';
        if (msg.includes('email-already-in-use')) return 'Email already registered.';
        if (msg.includes('weak-password')) return 'Password too weak.';
        if (msg.includes('too-many-requests')) return 'Too many attempts.';
        if (msg.includes('network')) return 'Connection error.';
        return 'An error occurred. Please try again.';
    }

    // ================= AUTH OBSERVER (no auto-redirect to avoid loops) =================
    window.fb.onAuthStateChanged(window.auth, async (user) => {
        if (user) {
            if (!window.currentUser) {
                const userDoc = await window.fb.getDoc(window.fb.doc(window.db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    window.currentUser = { uid: user.uid, ...data };
                    window.activeRole = data.role || 'organizer';
                }
            }
        }
    });

    // ================= PASSWORD RESET MODE =================
    (function() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') === 'resetPassword' && params.get('oobCode')) {
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('reset-password-panel').style.display = 'block';
            window.resetOobCode = params.get('oobCode');
        }
    })();
</script>

</body>
</html>
