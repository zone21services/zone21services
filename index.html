    <style>
        :root {
            --navy: #102838;
            --navy-dark: #0A1B24;
            --lime: #C0C800;
            --lime-hover: #A8B000;
            --pink: #F80070;
            --pink-hover: #D60061;
            --white: #F8F8F8;
            --light-grey: #E0E0E8;
            --black: #101010;
            --border-grey: #d1d5db;
            --card-bg: #FFFFFF;
            --text-dark: #1a202c;
            --error-red: #DC2626;
            --success-green: #10B981;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 10px;
            --shadow-card: 0 8px 30px rgba(16, 40, 56, 0.07);
            --shadow-elevated: 0 15px 50px rgba(16, 40, 56, 0.12);
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.35s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(160deg, #f0f4f8 0%, #e8eef4 30%, #f5f3f1 70%, #fefefe 100%);
            background-attachment: fixed;
            color: var(--navy);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== HEADER ===== */
        .smart-header {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 99990;
            box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 4px 24px rgba(16,40,56,0.05);
        }
        .smart-header-inner {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; height: 60px; max-width: 1200px; margin: 0 auto;
        }
        .smart-logo {
            display: flex; align-items: center; text-decoration: none;
        }
        .smart-logo img {
            height: 40px;
            width: auto;
        }
        .smart-hamburger {
            background: transparent; border: none; cursor: pointer;
            width: 40px; height: 40px; border-radius: 50%; color: var(--navy);
            position: relative;
        }

        /* ===== APP CONTAINER ===== */
        .app-container {
            width: 100%; max-width: 960px; margin: 0 auto;
            padding: 80px 20px 100px;
            display: flex; flex-direction: column; align-items: center; gap: 24px;
            min-height: 100vh;
        }

        /* ===== TOAST ===== */
        #toast-container {
            position: fixed; top: 80px; right: 20px; z-index: 99999;
            display: flex; flex-direction: column; gap: 12px; pointer-events: none;
        }
        .toast {
            padding: 1rem 1.4rem; border-radius: var(--radius-md); color: #fff;
            font-weight: 600; font-size: 0.9rem;
            box-shadow: 0 15px 50px rgba(16,40,56,0.12);
            animation: slideInToast 0.35s ease forwards;
            display: flex; align-items: center; gap: 12px; min-width: 280px;
            pointer-events: auto;
        }
        .toast.error { background: var(--error-red); }
        .toast.success { background: var(--success-green); }
        .toast.info { background: var(--navy); color: var(--lime); }
        @keyframes slideInToast {
            from { transform: translateX(40px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ===== AUTH CARD ===== */
        .auth-card {
            width: 100%; background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-grey);
            position: relative; overflow: hidden;
        }
        .auth-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--navy) 0%, var(--lime) 40%, var(--pink) 80%, var(--navy) 100%);
        }
        .auth-welcome { text-align: center; margin-bottom: 2rem; }
        .auth-welcome img {
            width: 80px; height: 80px; border-radius: 50%;
            object-fit: contain; margin-bottom: 1rem;
            background: var(--light-grey);
        }
        .role-switcher {
            display: flex; background: #f5f7fa; border-radius: 60px;
            padding: 6px; margin-bottom: 1.8rem; border: 1px solid var(--border-grey);
        }
        .role-btn {
            flex: 1; text-align: center; padding: 0.85rem 1rem;
            border-radius: 60px; cursor: pointer; font-weight: 600;
            color: #718691; transition: all 0.35s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            border: none; background: transparent;
        }
        .role-btn.active {
            background: var(--navy); color: #fff;
        }
        .role-btn.service-provider-active.active {
            background: var(--pink);
        }

        .form-group { margin-bottom: 1.2rem; }
        .form-label {
            display: block; font-weight: 700; font-size: 0.8rem;
            margin-bottom: 0.5rem; color: var(--navy);
            text-transform: uppercase;
        }
        .form-input, .form-select {
            width: 100%; padding: 0.95rem 1.2rem;
            border: 1.8px solid var(--border-grey);
            border-radius: var(--radius-md);
            font-size: 0.95rem; outline: none;
            background: #fafbfc; color: var(--navy);
        }
        .btn {
            padding: 0.95rem 1.6rem; border-radius: 60px;
            font-weight: 700; font-size: 0.95rem; cursor: pointer;
            border: none; display: inline-flex; align-items: center;
            justify-content: center; gap: 0.5rem;
        }
        .btn-primary { background: var(--navy); color: #fff; }
        .btn-lime { background: var(--lime); color: var(--navy); }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-block { width: 100%; }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 3rem; }
        .password-toggle {
            position: absolute; right: 14px; top: 42px;
            cursor: pointer; color: var(--navy); font-size: 1.1rem;
        }
        .forgot-link { font-size: 0.85rem; color: var(--navy); font-weight: 700; text-decoration: none; }

        /* ===== DASHBOARD ===== */
        #dashboard-area {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .welcome-message {
            background: var(--card-bg); border-radius: var(--radius-lg);
            padding: 2rem 1.8rem; box-shadow: var(--shadow-card);
            border: 1px solid var(--border-grey); text-align: center;
        }
        .stats-row {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
        }
        .stat-card {
            background: var(--card-bg); border-radius: var(--radius-md);
            padding: 1.3rem 1.2rem; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            border: 1px solid var(--border-grey); text-align: center;
            text-decoration: none; color: inherit; display: block;
            transition: all 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
        .stat-card i { font-size: 1.5rem; color: var(--lime); display: block; margin-bottom: 8px; }
        .stat-card .stat-number { font-size: 1.6rem; font-weight: 800; color: var(--navy); }
        .stat-card .stat-label { font-size: 0.75rem; color: #718691; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 4px;
        }
        .section-header h4 { font-weight: 700; color: var(--navy); }
        .section-header a { font-size: 0.8rem; font-weight: 700; color: var(--pink); text-decoration: none; }

        .card-list { display: flex; flex-direction: column; gap: 10px; }
        .list-card {
            background: var(--card-bg); border-radius: var(--radius-md);
            padding: 1rem 1.2rem; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            border: 1px solid var(--border-grey);
            display: flex; align-items: center; gap: 14px;
            text-decoration: none; color: inherit; transition: all 0.2s;
        }
        .list-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
        .list-card-icon {
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
        }
        .icon-calendar { background: #e8f4f8; color: var(--navy); }
        .icon-shield { background: #ffe0e0; color: #d32f2f; }
        .icon-dollar { background: #f0f6e8; color: #4caf50; }
        .list-card-info .title { font-weight: 700; color: var(--navy); font-size: 0.9rem; }
        .list-card-info .subtitle { font-size: 0.78rem; color: #718691; }
        .badge-unread {
            display: inline-block; background: var(--pink); color: #fff;
            font-size: 0.65rem; font-weight: 700; padding: 3px 9px; border-radius: 12px;
        }

        /* ===== BOTTOM NAV ===== */
        #footer-nav-wrapper {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            z-index: 99999;
        }
        #footer-nav-wrapper.dashboard-visible { display: block; }
        .footer-nav-scroll {
            display: flex; overflow-x: auto; padding: 10px 12px; gap: 8px;
            background: rgba(16, 40, 56, 0.95);
            backdrop-filter: blur(14px);
            border-top: 1px solid rgba(255,255,255,0.12);
        }
        .footer-nav-scroll a {
            display: flex; flex-direction: column; align-items: center;
            min-width: 72px; padding: 9px 6px; border-radius: 14px;
            background: rgba(255,255,255,0.04); color: #cbd5e1; text-decoration: none;
        }
        .footer-nav-scroll a i { font-size: 19px; margin-bottom: 5px; color: #94a3b8; }
        .footer-nav-scroll a span { font-size: 10px; font-weight: 600; text-transform: uppercase; }
        .footer-nav-scroll a:first-child { background: rgba(192, 200, 0, 0.95); color: #102838; }
        .footer-nav-scroll a.sign-out { background: rgba(248, 0, 112, 0.08); }

        @media (min-width: 769px) {
            #footer-nav-wrapper.dashboard-visible {
                display: flex !important; justify-content: center; bottom: 20px;
                background: transparent;
            }
        }
    </style>
</head>

<!-- Main App Script -->
<script>
    // ================= GLOBAL STATE =================
    window.activeRole = 'organizer'; // 'organizer' or 'service_provider'
    window.currentUser = null;
    window.resetOobCode = null;

    // ================= HELPER FUNCTIONS =================
    window.showToast = (msg, type='info') => {
        const container = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.innerHTML = `<i class="fa-solid ${type==='success'?'fa-circle-check':type==='error'?'fa-circle-exclamation':'fa-circle-info'}"></i> ${msg}`;
        container.appendChild(t);
        setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 4000);
    };

    window.togglePassword = (inputId, icon) => {
        const inp = document.getElementById(inputId);
        inp.type = inp.type === 'password' ? 'text' : 'password';
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    };

    window.switchAuthView = (view) => {
        document.getElementById('login-view').style.display = view==='login'?'block':'none';
        document.getElementById('register-view').style.display = view==='login'?'none':'block';
    };

    window.selectRole = (role) => {
        window.activeRole = role;
        document.getElementById('role-organizer').classList.toggle('active', role==='organizer');
        document.getElementById('role-service').classList.toggle('active', role==='service_provider');
        // Show/hide fields based on role
        document.getElementById('company-group').style.display = role==='organizer' ? 'block' : 'none';
        document.getElementById('service-type-group').style.display = role==='service_provider' ? 'block' : 'none';
    };

    // Initialize role on page load
    selectRole('organizer');

    // ================= AUTH HANDLERS =================
    window.handleLogin = async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-password').value;
        try {
            const cred = await window.fb.signInWithEmailAndPassword(window.auth, email, pass);
            const userDoc = await window.fb.getDoc(window.fb.doc(window.db, "users", cred.user.uid));
            const data = userDoc.exists() ? userDoc.data() : { email: cred.user.email, role: 'organizer' };
            window.currentUser = { uid: cred.user.uid, ...data };
            window.activeRole = data.role || 'organizer';
            showToast("Login successful!", 'success');
            showDashboard(data);
        } catch (err) {
            showToast(sanitizeError(err), 'error');
        }
    };

    window.handleRegister = async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const pass = document.getElementById('reg-password').value;
        const confirmPass = document.getElementById('reg-confirm-password').value;
        if (pass !== confirmPass) {
            showToast("Passwords do not match!", 'error');
            return;
        }
        try {
            const cred = await window.fb.createUserWithEmailAndPassword(window.auth, email, pass);
            await window.fb.sendEmailVerification(cred.user);
            const userData = {
                uid: cred.user.uid,
                name,
                email,
                role: window.activeRole,
                createdAt: window.fb.serverTimestamp(),
            };
            if (window.activeRole === 'organizer') {
                const company = document.getElementById('reg-company').value.trim();
                if (company) userData.company = company;
            } else {
                const serviceType = document.getElementById('reg-service-type').value;
                if (serviceType) userData.serviceType = serviceType;
            }
            await window.fb.setDoc(window.fb.doc(window.db, "users", cred.user.uid), userData);
            window.currentUser = { uid: cred.user.uid, ...userData };
            window.activeRole = userData.role;
            showToast("Account created! You are now logged in.", 'success');
            showDashboard(userData);
        } catch (err) {
            showToast(sanitizeError(err), 'error');
            if (err.code === 'auth/email-already-in-use') {
                switchAuthView('login');
                document.getElementById('login-email').value = email;
            }
        }
    };

    window.handleForgotPassword = () => {
        const email = document.getElementById('login-email').value.trim();
        if (!email) {
            showToast("Please enter your email address first.", 'error');
            return;
        }
        window.fb.sendPasswordResetEmail(window.auth, email)
            .then(() => showToast("Check your inbox or spam folder for the reset link.", 'success'))
            .catch(err => showToast(sanitizeError(err), 'error'));
    };

    window.handleNewPasswordSubmit = (e) => {
        e.preventDefault();
        const pass = document.getElementById('new-reset-pass').value;
        const confirm = document.getElementById('confirm-reset-pass').value;
        if (pass !== confirm) {
            showToast("Passwords do not match", 'error');
            return;
        }
        window.fb.confirmPasswordReset(window.auth, window.resetOobCode, pass)
            .then(() => {
                showToast("Password updated! Redirecting...", 'success');
                setTimeout(() => window.location.href = window.location.pathname, 2000);
            })
            .catch(err => showToast(sanitizeError(err), 'error'));
    };

    window.goBackToLogin = () => {
        document.getElementById('reset-password-panel').style.display = 'none';
        document.getElementById('auth-panel').style.display = 'block';
        window.history.replaceState({}, document.title, window.location.pathname);
        window.resetOobCode = null;
    };

    window.handleGlobalSignOut = () => {
        window.fb.signOut(window.auth)
            .then(() => {
                showToast('Signed out.', 'info');
                hideDashboard();
            });
    };

    function sanitizeError(err) {
        const msg = (err?.message || '').toLowerCase();
        if (msg.includes('invalid-credential') || msg.includes('wrong-password')) return 'Incorrect email or password.';
        if (msg.includes('email-already-in-use')) return 'Email already registered.';
        if (msg.includes('weak-password')) return 'Password too weak.';
        if (msg.includes('too-many-requests')) return 'Too many attempts.';
        if (msg.includes('network')) return 'Connection error.';
        return 'An error occurred. Please try again.';
    }

    // ================= DASHBOARD =================
    function showDashboard(userData) {
        document.getElementById('auth-panel').style.display = 'none';
        document.getElementById('reset-password-panel').style.display = 'none';
        document.getElementById('dashboard-area').style.display = 'flex';
        document.getElementById('footer-nav-wrapper').classList.add('dashboard-visible');

        const isOrganizer = window.activeRole === 'organizer';
        document.getElementById('dashboard-role-text').innerText =
            isOrganizer ? "You're signed in as an Event Organizer." : "You're signed in as a Service Provider.";

        // Stats cards
        const statsRow = document.getElementById('dash-stats-row');
        if (isOrganizer) {
            statsRow.innerHTML = `
                <a href="#" class="stat-card"><i class="fa-solid fa-calendar"></i><div class="stat-number" id="stat-events">0</div><div class="stat-label">Events</div></a>
                <a href="#" class="stat-card"><i class="fa-solid fa-ticket-alt"></i><div class="stat-number" id="stat-tickets">0</div><div class="stat-label">Tickets Sold</div></a>
                <a href="#" class="stat-card"><i class="fa-solid fa-dollar-sign"></i><div class="stat-number" id="stat-revenue">$0</div><div class="stat-label">Revenue</div></a>
            `;
        } else {
            statsRow.innerHTML = `
                <a href="#" class="stat-card"><i class="fa-solid fa-briefcase"></i><div class="stat-number" id="stat-jobs">0</div><div class="stat-label">Assigned</div></a>
                <a href="#" class="stat-card"><i class="fa-solid fa-check-circle"></i><div class="stat-number" id="stat-done">0</div><div class="stat-label">Completed</div></a>
                <a href="#" class="stat-card"><i class="fa-solid fa-star"></i><div class="stat-number" id="stat-rating">0.0</div><div class="stat-label">Rating</div></a>
            `;
        }

        // Quick actions
        const quickActions = document.getElementById('quick-actions-list');
        if (isOrganizer) {
            quickActions.innerHTML = `
                <a href="#" class="list-card">
                    <div class="list-card-icon icon-calendar"><i class="fa-solid fa-plus"></i></div>
                    <div class="list-card-info"><div class="title">Create Event</div><div class="subtitle">Start a new event</div></div>
                </a>
                <a href="#" class="list-card">
                    <div class="list-card-icon icon-shield"><i class="fa-solid fa-user-shield"></i></div>
                    <div class="list-card-info"><div class="title">Request Security</div><div class="subtitle">Get a quote</div></div>
                </a>
                <a href="#" class="list-card">
                    <div class="list-card-icon icon-dollar"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                    <div class="list-card-info"><div class="title">Let Zone21 Plan</div><div class="subtitle">Full event management</div></div>
                </a>
            `;
        } else {
            quickActions.innerHTML = `
                <a href="#" class="list-card">
                    <div class="list-card-icon icon-shield"><i class="fa-solid fa-magnifying-glass"></i></div>
                    <div class="list-card-info"><div class="title">View Security Requests</div><div class="subtitle">Find new jobs</div></div>
                </a>
                <a href="#" class="list-card">
                    <div class="list-card-icon icon-calendar"><i class="fa-solid fa-clock"></i></div>
                    <div class="list-card-info"><div class="title">Update Availability</div><div class="subtitle">Set your schedule</div></div>
                </a>
            `;
        }

        // Recent items / notifications placeholders
        document.getElementById('dash-section-title').innerText = isOrganizer ? "Recent Events" : "Recent Requests";
        document.getElementById('dash-card-list').innerHTML = '<p style="color:#718691;">No items yet.</p>';
        document.getElementById('dash-notif-list').innerHTML = '<p style="color:#718691;">No notifications.</p>';

        // Build bottom nav
        buildFooterNav(isOrganizer);

        // Fetch actual stats (optional, but we'll keep zeros for now)
        if (isOrganizer) {
            // fetchOrganizerStats();
        } else {
            // fetchServiceProviderStats();
        }
    }

    function hideDashboard() {
        document.getElementById('auth-panel').style.display = 'block';
        document.getElementById('dashboard-area').style.display = 'none';
        document.getElementById('footer-nav-wrapper').classList.remove('dashboard-visible');
        document.getElementById('login-view').style.display = 'block';
        document.getElementById('register-view').style.display = 'none';
        window.activeRole = 'organizer';
        document.getElementById('role-organizer').classList.add('active');
        document.getElementById('role-service').classList.remove('active');
    }

    function buildFooterNav(isOrganizer) {
        const nav = document.getElementById('footer-nav-scroll');
        nav.innerHTML = '';
        const items = isOrganizer ? [
            { icon:'fa-house', label:'Home', href:'#' },
            { icon:'fa-calendar', label:'Events', href:'#' },
            { icon:'fa-plus', label:'Create', href:'#' },
            { icon:'fa-chart-bar', label:'Analytics', href:'#' },
            { icon:'fa-envelope', label:'Inbox', href:'#' },
        ] : [
            { icon:'fa-house', label:'Home', href:'#' },
            { icon:'fa-briefcase', label:'Jobs', href:'#' },
            { icon:'fa-clock', label:'Availability', href:'#' },
            { icon:'fa-star', label:'Rating', href:'#' },
            { icon:'fa-envelope', label:'Inbox', href:'#' },
        ];
        items.forEach(item => {
            const a = document.createElement('a');
            a.href = item.href;
            a.innerHTML = `<i class="fa-solid ${item.icon}"></i><span>${item.label}</span>`;
            nav.appendChild(a);
        });
        // Logout
        const logoutBtn = document.createElement('a');
        logoutBtn.href = '#';
        logoutBtn.className = 'sign-out';
        logoutBtn.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>';
        logoutBtn.onclick = (e) => { e.preventDefault(); handleGlobalSignOut(); };
        nav.appendChild(logoutBtn);
    }

    // ================= AUTH OBSERVER =================
    window.fb.onAuthStateChanged(window.auth, async (user) => {
        if (user) {
            if (!window.currentUser) {
                const userDoc = await window.fb.getDoc(window.fb.doc(window.db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    window.currentUser = { uid: user.uid, ...data };
                    window.activeRole = data.role || 'organizer';
                    showDashboard(data);
                }
            }
        } else {
            if (document.getElementById('dashboard-area').style.display === 'flex') hideDashboard();
        }
    });

    // ================= PASSWORD RESET MODE =================
    (function() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') === 'resetPassword' && params.get('oobCode')) {
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('reset-password-panel').style.display = 'block';
            window.resetOobCode = params.get('oobCode');
        }
    })();
</script>

</body>
</html>
