<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zone21 | Invitation Card Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800;
            --pink: #F80070;
            --white: #F8F8F8;
            --grey: #E0E0E8;
            --gold: #D4AF37;
            --radius: 16px;
            --radius-xl: 24px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        html { height: -webkit-fill-available; }

        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e8eef4 50%, #f5f3f1 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            height: 100dvh;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
            color: var(--navy);
            margin: 0;
        }

        /* Sidebar */
        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.4); z-index: 999; opacity: 0; transition: opacity 0.3s ease;
        }
        .sidebar {
            width: 300px; background: var(--navy); border-radius: var(--radius-xl); color: white;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 60px rgba(16,40,56,0.15); transition: transform 0.3s ease; z-index: 1000;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .new-card-btn { background: var(--lime); color: var(--navy); border: none; padding: 12px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; transition: 0.2s; }
        .new-card-btn:hover { background: white; }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        .history-item { 
            padding: 10px 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 8px; 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; transition: 0.2s; gap: 8px;
        }
        .history-item:hover { background: rgba(255,255,255,0.15); }
        .history-item.active { border-left: 4px solid var(--lime); background: rgba(255,255,255,0.1); }
        .history-item .item-info { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; }
        .history-item .item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white; }
        .history-item .delete-btn { color: rgba(255,255,255,0.4); padding: 4px; border-radius: 4px; transition: 0.2s; }
        .history-item .delete-btn:hover { color: var(--pink); background: rgba(248, 0, 112, 0.15); }

        /* Workspace */
        .workspace {
            flex: 1; background: white; border-radius: var(--radius-xl);
            box-shadow: 0 20px 60px rgba(16,40,56,0.15); display: flex; flex-direction: column; overflow: hidden; position: relative;
        }
        .workspace-header { background: var(--navy); color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 4px solid var(--lime); z-index: 10; }
        .menu-btn { display: none; background: transparent; border: none; font-size: 1.4rem; color: white; cursor: pointer; padding: 5px; }
        .workspace-header h1 { font-size: 1.3rem; color: var(--lime); margin: 0; }
        .workspace-header p { font-size: 0.8rem; color: rgba(255,255,255,0.8); margin: 0; }

        .workspace-content { flex: 1; overflow-y: auto; padding: 20px; background: #fafbfc; scroll-behavior: smooth; }

        /* Form Styling */
        .form-section { background: white; padding: 25px; border-radius: 16px; border: 1px solid var(--grey); box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media(max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-weight: bold; font-size: 0.9rem; }
        .input-group input, .input-group select, .input-group textarea { padding: 12px; border: 1px solid var(--grey); border-radius: 8px; outline: none; transition: 0.3s; font-size: 0.95rem; background: #f9fafb; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--navy); background: white; }
        .input-group textarea { resize: vertical; min-height: 80px; }

        /* Guest List */
        .guest-list-section { margin-top: 20px; }
        .guest-input-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .guest-input-row input { flex: 1; padding: 10px; border: 1px solid var(--grey); border-radius: 8px; }
        .guest-input-row button { background: var(--pink); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1rem; }
        .guest-list-display { margin-top: 10px; }
        .guest-tag { display: inline-block; background: #f0f4f8; padding: 5px 12px; border-radius: 20px; margin: 3px; font-size: 0.85rem; }

        .submit-btn { width: 100%; background: var(--navy); color: var(--lime); border: none; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .submit-btn:hover { background: var(--lime); color: var(--navy); }
        .submit-btn:disabled { background: var(--grey); color: #888; cursor: not-allowed; }

        /* Loading */
        #loading { display: none; text-align: center; padding: 40px; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--pink); animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Invitation Cards List */
        #invitation-container { display: none; }
        .cards-list { display: flex; flex-direction: column; gap: 25px; }
        .card-item {
            background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid var(--grey); overflow: hidden;
        }
        .card-item-header {
            background: var(--navy); color: white; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .card-item-header .guest-label { font-weight: bold; color: var(--lime); }
        .card-item-header .card-actions { display: flex; gap: 8px; }
        .card-item-body { padding: 20px; display: flex; justify-content: center; }
        
        /* Preview Card */
        .preview-card {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 0; /* Adjusted for image */
            text-align: center;
            position: relative;
            background: #ffffff;
            overflow: hidden;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .preview-card img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
        }

        /* Add Guest Section */
        .add-guest-section {
            background: white; border-radius: 16px; padding: 20px;
            border: 1px solid var(--grey); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .add-guest-section h3 { color: var(--navy); margin-bottom: 15px; }
        .add-guest-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .add-guest-row input { flex: 1; padding: 12px; border: 1px solid var(--grey); border-radius: 8px; font-size: 0.95rem; }
        .add-guest-row button { background: var(--navy); color: var(--lime); border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; }

        .invitation-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; border-top: 1px solid var(--grey); padding-top: 20px; }
        .action-btn { padding: 10px 18px; border-radius: 30px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; transition: 0.2s; }
        .btn-download { background: #28a745; color: white; }
        .btn-download:hover { background: #218838; }
        .btn-regen { background: #f0f4f8; color: var(--navy); border: 1px solid var(--grey); }
        .btn-regen:hover { background: var(--navy); color: white; }

        @media (max-width: 768px) {
            body { padding: 0; gap: 0; }
            .workspace { border-radius: 0; box-shadow: none; }
            .menu-btn { display: block; }
            .sidebar { position: fixed; top: 0; left: -320px; height: 100dvh; width: 280px; border-radius: 0 24px 24px 0; }
            .sidebar.active { transform: translateX(320px); }
            .sidebar-overlay.active { display: block; opacity: 1; }
            .workspace-content { padding: 15px 10px; }
            .form-section { padding: 15px; border-radius: 12px; }
        }

        /* Print Styles */
        @media print {
            @page { size: A4 portrait; margin: 0; }
            body * { visibility: hidden; }
            .card-item-body, .card-item-body * { visibility: visible; }
            .card-item-body {
                position: absolute; left: 0; top: 0; width: 210mm; height: 297mm;
                margin: 0; padding: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
            }
            .preview-card {
                width: 210mm; height: 297mm; max-width: 210mm; min-height: 297mm;
                margin: 0; border: none; border-radius: 0; box-shadow: none;
                page-break-after: always; page-break-inside: avoid;
            }
            .card-item-header, .invitation-controls, .add-guest-section, .sidebar, .workspace-header { display: none !important; }
            .workspace { box-shadow: none; overflow: visible; }
            .workspace-content { padding: 0; overflow: visible; }
            .cards-list { gap: 0; }
            .card-item { border: none; box-shadow: none; margin: 0; padding: 0; }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div><h2>Past Invitations</h2></div>
    </div>
    <div style="padding: 0 20px;">
        <button class="new-card-btn" onclick="startNewCard()"><i class="fas fa-plus"></i> New Invitation</button>
    </div>
    <div class="history-list" id="history-list"></div>
</div>

<!-- Main Workspace -->
<div class="workspace">
    <div class="workspace-header">
        <button class="menu-btn" id="menu-btn"><i class="fas fa-bars"></i></button>
        <div>
            <h1>Zone21 Invitation Developer</h1>
            <p>Create beautiful AI invitation cards for your events</p>
        </div>
    </div>

    <div class="workspace-content" id="workspace-content">
        
        <!-- Card Form -->
        <div class="form-section" id="form-section">
            <form id="cardForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>1. Event Title</label>
                        <input type="text" id="eventTitle" required placeholder="e.g. Wedding Celebration of Sarah & John">
                    </div>
                    <div class="input-group">
                        <label>2. Host Name(s)</label>
                        <input type="text" id="hostName" required placeholder="e.g. Mr. & Mrs. Moyo">
                    </div>
                    <div class="input-group">
                        <label>3. Guest of Honor (if any)</label>
                        <input type="text" id="guestOfHonor" placeholder="Optional">
                    </div>
                    <div class="input-group">
                        <label>4. Date & Time</label>
                        <input type="datetime-local" id="eventDate" required>
                    </div>
                    <div class="input-group">
                        <label>5. Venue</label>
                        <input type="text" id="venue" required placeholder="e.g. Meikles Hotel, Harare">
                    </div>
                    <div class="input-group">
                        <label>6. Dress Code / Theme (Optional)</label>
                        <input type="text" id="dressCode" placeholder="Leave blank if not applicable">
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 15px;">
                    <label>7. Special Message (Optional)</label>
                    <textarea id="specialMessage" placeholder="e.g. Join us as we celebrate love..."></textarea>
                </div>

                <!-- Guest List -->
                <div class="guest-list-section">
                    <label style="font-weight: bold; margin-bottom: 10px; display: block;">8. Guest Names (Optional – leave empty for general invitation)</label>
                    <div class="guest-input-row">
                        <input type="text" id="guestNameInput" placeholder="Enter guest name">
                        <button type="button" onclick="addGuest()"><i class="fas fa-plus"></i></button>
                    </div>
                    <div class="guest-list-display" id="guestListDisplay"></div>
                    <input type="hidden" id="guestsHidden" value="">
                </div>

                <button type="submit" class="submit-btn" id="generateBtn">
                    <i class="fas fa-wand-magic-sparkles"></i> Generate AI Invitation
                </button>
            </form>
        </div>

        <!-- Loading -->
        <div id="loading">
            <div class="spinner"></div>
            <h3 style="color: var(--navy);">Designing your invitation...</h3>
            <p style="color: #666; font-size: 0.9rem; margin-top: 5px;">Using Cloudflare AI to generate a beautiful design.</p>
        </div>

        <!-- Invitation Result -->
        <div id="invitation-container">
            <div class="cards-list" id="cardsList"></div>
            
            <!-- Add New Guest Section -->
            <div class="add-guest-section" id="addGuestSection" style="display:none;">
                <h3><i class="fas fa-user-plus"></i> Add New Guest (Same Design)</h3>
                <div class="add-guest-row">
                    <input type="text" id="newGuestInput" placeholder="Enter new guest name">
                    <button onclick="addNewGuest()"><i class="fas fa-plus"></i> Add Guest</button>
                </div>
            </div>
            
            <div class="invitation-controls">
                <button class="action-btn btn-download" onclick="downloadAllInvitations()">
                    <i class="fas fa-print"></i> Print All Invitations
                </button>
                <button class="action-btn btn-regen" onclick="regenerateCard()">
                    <i class="fas fa-rotate"></i> Regenerate Design
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // CLOUDFLARE WORKER CONFIGURATION
    // ==========================================
    const INVITATION_API_URL = "https://blueprint.zone21services.workers.dev/";

    let currentSessionId = null;
    let currentCardData = null;
    let guestNames = [];
    let currentDesignImage = '';
    let isGenerating = false;

    // Mobile Sidebar Toggle
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    function closeSidebar() { sidebar.classList.remove('active'); overlay.classList.remove('active'); }
    if (menuBtn) menuBtn.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
    if (overlay) overlay.addEventListener('click', closeSidebar);

    // Escape HTML to prevent injection
    function escapeHTML(value) {
        if (!value) return "";
        return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Guest Management
    function addGuest() {
        const input = document.getElementById('guestNameInput');
        const name = input.value.trim();
        if (!name) return;
        if (guestNames.map(g => g.toLowerCase()).includes(name.toLowerCase())) {
            alert("Guest already added!");
            return;
        }
        guestNames.push(name);
        input.value = '';
        updateGuestDisplay();
    }

    function updateGuestDisplay() {
        const display = document.getElementById('guestListDisplay');
        display.innerHTML = guestNames.map((name, index) => 
            `<span class="guest-tag">${escapeHTML(name)} <i class="fas fa-times" style="cursor:pointer; margin-left:5px;" onclick="removeGuest(${index})"></i></span>`
        ).join('');
        document.getElementById('guestsHidden').value = JSON.stringify(guestNames);
    }

    function removeGuest(index) {
        guestNames.splice(index, 1);
        updateGuestDisplay();
    }

    // Allow Enter key to add guests
    document.getElementById('guestNameInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); addGuest(); }
    });

    // Form Submit
    document.getElementById('cardForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (isGenerating) return;

        currentCardData = {
            eventTitle: document.getElementById('eventTitle').value.trim(),
            hostName: document.getElementById('hostName').value.trim(),
            guestOfHonor: document.getElementById('guestOfHonor').value.trim(),
            date: document.getElementById('eventDate').value,
            venue: document.getElementById('venue').value.trim(),
            dressCode: document.getElementById('dressCode').value.trim(),
            message: document.getElementById('specialMessage').value.trim(),
            guests: [...guestNames]
        };
        generateInvitation(false);
    });

    // Build Prompt for Cloudflare Flux Worker
    function buildInvitationPrompt(data) {
        let dateObj = new Date(data.date);
        let formattedDate = isNaN(dateObj) ? data.date : new Intl.DateTimeFormat("en-ZA", {
            weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit"
        }).format(dateObj);

        let prompt = `A highly professional, elegant, and premium invitation card design.
Event Title: ${data.eventTitle}
Hosted by: ${data.hostName}\n`;
        if (data.guestOfHonor) prompt += `Guest of Honor: ${data.guestOfHonor}\n`;
        prompt += `Date: ${formattedDate}\nVenue: ${data.venue}\n`;
        if (data.dressCode) prompt += `Dress code: ${data.dressCode}\n`;
        if (data.message) prompt += `Message: ${data.message}\n`;

        prompt += `
Design Requirements:
- The text must be perfectly legible, centered, and written in a beautiful serif or calligraphy font.
- Premium visual aesthetic suitable for printing.
- Clean layout, beautiful borders based on the event type.
- Portrait orientation.
- Do NOT generate fake QR codes, watermarks, or "sample" text.`;
        return prompt;
    }

    async function generateInvitation(isRegenerating) {
        isGenerating = true;
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('invitation-container').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        if (!currentSessionId || !isRegenerating) currentSessionId = 'inv_' + Date.now();

        const prompt = buildInvitationPrompt(currentCardData);

        try {
            // CALL CLOUDFLARE WORKER
            const response = await fetch(INVITATION_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt })
            });

            if (!response.ok) {
                let errText = await response.text();
                throw new Error(errText || `Server error: ${response.status}`);
            }

            const data = await response.json();
            
            if (!data.image) {
                throw new Error("No image returned from server.");
            }

            let image = data.image;
            if (!image.startsWith("data:") && !image.startsWith("http")) {
                image = "data:image/jpeg;base64," + image;
            }

            currentDesignImage = image;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('invitation-container').style.display = 'block';
            renderCardsList();
            saveInvitationState();
            
            document.getElementById('invitation-container').scrollIntoView({ behavior: "smooth", block: "start" });

        } catch (error) {
            console.error("Design Error:", error);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
            alert("Error generating invitation: " + error.message);
        } finally {
            isGenerating = false;
        }
    }

    function renderCardsList() {
        const cardsList = document.getElementById('cardsList');
        const guests = currentCardData.guests.length > 0 ? currentCardData.guests : ['Guest'];
        cardsList.innerHTML = '';
        
        guests.forEach((guest, index) => {
            const safeGuest = escapeHTML(guest);
            const cardItem = document.createElement('div');
            cardItem.className = 'card-item';
            
            // Text to overlay if you want to composite the guest name on the frontend.
            // For now, it places the AI generated image.
            cardItem.innerHTML = `
                <div class="card-item-header">
                    <span class="guest-label"><i class="fas fa-user"></i> Guest: ${safeGuest}</span>
                    <div class="card-actions">
                        <button class="action-btn btn-download" onclick="downloadSingleCard('${safeGuest}', ${index})"><i class="fas fa-download"></i> Download</button>
                    </div>
                </div>
                <div class="card-item-body" id="card-body-${index}">
                    <div class="preview-card">
                        <img src="${currentDesignImage}" alt="Invitation for ${safeGuest}">
                    </div>
                </div>
            `;
            cardsList.appendChild(cardItem);
        });
        document.getElementById('addGuestSection').style.display = 'block';
    }

    function addNewGuest() {
        const input = document.getElementById('newGuestInput');
        const name = input.value.trim();
        if (!name) return;
        if (currentCardData.guests.map(g => g.toLowerCase()).includes(name.toLowerCase())) {
            alert("Guest already added!"); return;
        }
        
        currentCardData.guests.push(name);
        guestNames.push(name);
        input.value = '';
        
        const safeGuest = escapeHTML(name);
        const index = currentCardData.guests.length - 1;
        
        const cardsList = document.getElementById('cardsList');
        const cardItem = document.createElement('div');
        cardItem.className = 'card-item';
        cardItem.innerHTML = `
            <div class="card-item-header">
                <span class="guest-label"><i class="fas fa-user"></i> Guest: ${safeGuest}</span>
                <div class="card-actions">
                    <button class="action-btn btn-download" onclick="downloadSingleCard('${safeGuest}', ${index})"><i class="fas fa-download"></i> Download</button>
                </div>
            </div>
            <div class="card-item-body" id="card-body-${index}">
                <div class="preview-card">
                    <img src="${currentDesignImage}" alt="Invitation for ${safeGuest}">
                </div>
            </div>
        `;
        cardsList.appendChild(cardItem);
        saveInvitationState();
    }

    document.getElementById('newGuestInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); addNewGuest(); }
    });

    // Download Logic for Base64 Images
    async function downloadSingleCard(guestName, index) {
        const cardBody = document.getElementById(`card-body-${index}`);
        if (!cardBody) return;
        
        const image = cardBody.querySelector("img");
        if (!image) return alert("Image not ready.");

        try {
            const response = await fetch(image.src);
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.href = url;
            const safeName = String(guestName).replace(/[<>:"/\\|?*\x00-\x1F]/g, "").replace(/\s+/g, "_");
            link.download = `${currentCardData.eventTitle.replace(/\s+/g, "_")}_${safeName}.png`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (error) {
            console.error("Download failed, opening in new tab", error);
            const link = document.createElement("a");
            link.href = image.src;
            link.target = "_blank";
            link.download = "Invitation.png";
            link.click();
        }
    }

    function downloadAllInvitations() { window.print(); }
    function regenerateCard() { generateInvitation(true); }

    // Storage & History
    function saveInvitationState() {
        const title = `${currentCardData.hostName} - ${currentCardData.eventTitle}`;
        const cardData = {
            id: currentSessionId, 
            title: title,
            formData: currentCardData, 
            designImage: currentDesignImage,
            updatedAt: new Date().toISOString()
        };
        let localSessions = JSON.parse(localStorage.getItem('zone21_invitations') || '{}');
        localSessions[currentSessionId] = cardData;
        
        try {
            localStorage.setItem('zone21_invitations', JSON.stringify(localSessions));
        } catch (error) {
            console.warn("Storage full. Saving without image payload.");
            localSessions[currentSessionId].designImage = "";
            localStorage.setItem('zone21_invitations', JSON.stringify(localSessions));
        }
        renderHistorySidebar();
    }

    function renderHistorySidebar() {
        const historyList = document.getElementById('history-list');
        if (!historyList) return;
        historyList.innerHTML = '';
        let localSessions = JSON.parse(localStorage.getItem('zone21_invitations') || '{}');
        
        Object.values(localSessions).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)).forEach(session => {
            const item = document.createElement('div');
            item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
            item.innerHTML = `
                <div class="item-info"><i class="fas fa-envelope" style="color: var(--lime);"></i><span class="item-title">${escapeHTML(session.title)}</span></div>
                <i class="fas fa-trash delete-btn" title="Delete"></i>
            `;
            
            item.querySelector('.delete-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                deleteInvitationSession(session.id);
            });
            
            item.addEventListener('click', () => loadInvitationSession(session.id));
            historyList.appendChild(item);
        });
    }

    function loadInvitationSession(sessionId) {
        closeSidebar();
        let localSessions = JSON.parse(localStorage.getItem('zone21_invitations') || '{}');
        const session = localSessions[sessionId];
        if (!session) return;
        
        currentSessionId = session.id;
        currentCardData = session.formData;
        currentDesignImage = session.designImage || "";
        guestNames = session.formData.guests || [];
        
        if (!currentDesignImage) {
            // Image was cleared due to storage limits, regenerate it
            generateInvitation(true);
            return;
        }

        document.getElementById('form-section').style.display = 'none';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('invitation-container').style.display = 'block';
        renderCardsList();
        renderHistorySidebar();
    }

    function deleteInvitationSession(sessionId) {
        if (!confirm("Delete this invitation?")) return;
        let localSessions = JSON.parse(localStorage.getItem('zone21_invitations') || '{}');
        delete localSessions[sessionId];
        localStorage.setItem('zone21_invitations', JSON.stringify(localSessions));
        if (currentSessionId === sessionId) { startNewCard(); } else { renderHistorySidebar(); }
    }

    function startNewCard() {
        closeSidebar();
        currentSessionId = null; currentCardData = null; currentDesignImage = ''; guestNames = [];
        document.getElementById('cardForm').reset();
        document.getElementById('guestListDisplay').innerHTML = '';
        document.getElementById('guestsHidden').value = '';
        document.getElementById('invitation-container').style.display = 'none';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('form-section').style.display = 'block';
        document.getElementById('addGuestSection').style.display = 'none';
        renderHistorySidebar();
    }

    document.addEventListener('DOMContentLoaded', renderHistorySidebar);
</script>

</body>
</html>
