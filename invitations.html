<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zone21 | Invitation Card Developer</title>
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css)">
    
    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800;
            --pink: #F80070;
            --white: #F8F8F8;
            --grey: #E0E0E8;
            --gold: #D4AF37;
            --radius: 16px;
            --radius-xl: 24px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html { height: -webkit-fill-available; }
        body { background: linear-gradient(135deg, #f0f4f8 0%, #e8eef4 50%, #f5f3f1 100%); min-height: 100vh; display: flex; padding: 20px; gap: 20px; overflow: hidden; color: var(--navy); }

        /* Sidebar */
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.4); z-index: 999; }
        .sidebar { width: 300px; background: var(--navy); border-radius: var(--radius-xl); color: white; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(16,40,56,0.15); z-index: 1000; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .new-card-btn { background: var(--lime); color: var(--navy); border: none; padding: 12px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; transition: 0.2s; }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; }
        .history-item { padding: 10px 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .history-item:hover, .history-item.active { background: rgba(255,255,255,0.15); border-left: 4px solid var(--lime); }
        .history-item .delete-btn { color: rgba(255,255,255,0.4); padding: 4px; cursor: pointer; }

        /* Workspace */
        .workspace { flex: 1; background: white; border-radius: var(--radius-xl); box-shadow: 0 20px 60px rgba(16,40,56,0.15); display: flex; flex-direction: column; overflow: hidden; }
        .workspace-header { background: var(--navy); color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 4px solid var(--lime); }
        .menu-btn { display: none; background: transparent; border: none; font-size: 1.4rem; color: white; cursor: pointer; padding: 5px; }
        .workspace-header h1 { font-size: 1.3rem; color: var(--lime); margin: 0; }
        .workspace-content { flex: 1; overflow-y: auto; padding: 20px; background: #fafbfc; }

        /* Form */
        .form-section { background: white; padding: 25px; border-radius: 16px; border: 1px solid var(--grey); box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-weight: bold; font-size: 0.9rem; }
        .input-group input, .input-group textarea { padding: 12px; border: 1px solid var(--grey); border-radius: 8px; outline: none; background: #f9fafb; }
        .input-group textarea { resize: vertical; min-height: 80px; }

        /* Guest List */
        .guest-input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .guest-input-row input { flex: 1; padding: 10px; border: 1px solid var(--grey); border-radius: 8px; }
        .guest-input-row button { background: var(--pink); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        .guest-tag { display: inline-block; background: #f0f4f8; padding: 5px 12px; border-radius: 20px; margin: 3px; font-size: 0.85rem; }

        .submit-btn { width: 100%; background: var(--navy); color: var(--lime); border: none; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 10px; }

        #loading { display: none; text-align: center; padding: 40px; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--pink); animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Cards List */
        #invitation-container { display: none; }
        .cards-list { display: flex; flex-direction: column; gap: 25px; }
        .card-item { background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid var(--grey); overflow: hidden; }
        .card-item-header { background: var(--navy); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .card-item-header .guest-label { font-weight: bold; color: var(--lime); }
        .card-item-body { padding: 20px; display: flex; justify-content: center; background: #e8eef4;}
        
        /* The Actual CSS HTML Card generated by AI */
        .preview-card {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .invitation-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; border-top: 1px solid var(--grey); padding-top: 20px; }
        .action-btn { padding: 10px 18px; border-radius: 30px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .btn-download { background: #28a745; color: white; }
        .btn-regen { background: #f0f4f8; color: var(--navy); border: 1px solid var(--grey); }

        /* Add Guest Section */
        .add-guest-section { background: white; border-radius: 16px; padding: 20px; border: 1px solid var(--grey); margin-top: 20px; }
        .add-guest-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .add-guest-row input { flex: 1; padding: 12px; border: 1px solid var(--grey); border-radius: 8px; }
        .add-guest-row button { background: var(--navy); color: var(--lime); border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; }

        @media (max-width: 768px) {
            body { padding: 0; gap: 0; }
            .workspace { border-radius: 0; }
            .menu-btn { display: block; }
            .sidebar { position: fixed; left: -320px; height: 100dvh; width: 280px; transition: 0.3s; }
            .sidebar.active { transform: translateX(320px); }
            .sidebar-overlay.active { display: block; opacity: 1; }
            .form-grid { grid-template-columns: 1fr; }
        }

        /* Print formatting */
        @media print {
            @page { size: A4 portrait; margin: 0; }
            body * { visibility: hidden; }
            .card-item-body, .card-item-body * { visibility: visible; }
            .card-item-body { position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; }
            .preview-card { width: 210mm; height: 297mm; max-width: 210mm; min-height: 297mm; border: none; box-shadow: none; page-break-after: always; }
        }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div><h2>Past Invitations</h2></div>
    </div>
    <div style="padding: 0 20px;">
        <button class="new-card-btn" onclick="startNewCard()"><i class="fas fa-plus"></i> New Invitation</button>
    </div>
    <div class="history-list" id="history-list"></div>
</div>

<div class="workspace">
    <div class="workspace-header">
        <button class="menu-btn" id="menu-btn"><i class="fas fa-bars"></i></button>
        <div>
            <h1>Zone21 Invitation Developer</h1>
            <p>Create beautiful HTML/CSS invitation cards for your events</p>
        </div>
    </div>

    <div class="workspace-content" id="workspace-content">
        <div class="form-section" id="form-section">
            <form id="cardForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>1. Event Title</label>
                        <input type="text" id="eventTitle" required placeholder="e.g. Wedding Celebration">
                    </div>
                    <div class="input-group">
                        <label>2. Host Name(s)</label>
                        <input type="text" id="hostName" required placeholder="e.g. Mr. & Mrs. Moyo">
                    </div>
                    <div class="input-group">
                        <label>3. Guest of Honor (Optional)</label>
                        <input type="text" id="guestOfHonor">
                    </div>
                    <div class="input-group">
                        <label>4. Date & Time</label>
                        <input type="datetime-local" id="eventDate" required>
                    </div>
                    <div class="input-group">
                        <label>5. Venue</label>
                        <input type="text" id="venue" required placeholder="e.g. Meikles Hotel, Harare">
                    </div>
                    <div class="input-group">
                        <label>6. Theme / Color Palette</label>
                        <input type="text" id="dressCode" placeholder="e.g. Navy Blue and Gold Luxury">
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 15px;">
                    <label>7. Special Message</label>
                    <textarea id="specialMessage" placeholder="e.g. Join us as we celebrate love..."></textarea>
                </div>

                <div class="guest-list-section">
                    <label style="font-weight: bold; margin-bottom: 10px; display: block;">8. Guest Names (Leave blank for general)</label>
                    <div class="guest-input-row">
                        <input type="text" id="guestNameInput" placeholder="Enter guest name">
                        <button type="button" onclick="addGuest()"><i class="fas fa-plus"></i></button>
                    </div>
                    <div class="guest-list-display" id="guestListDisplay"></div>
                </div>

                <button type="submit" class="submit-btn" id="generateBtn">
                    <i class="fas fa-wand-magic-sparkles"></i> Generate AI Invitation
                </button>
            </form>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <h3 style="color: var(--navy);">Designing your invitation layout...</h3>
            <p style="color: #666; font-size: 0.9rem;">Using Cloudflare AI to write custom HTML/CSS.</p>
        </div>

        <div id="invitation-container">
            <div class="cards-list" id="cardsList"></div>
            
            <div class="add-guest-section" id="addGuestSection" style="display:none;">
                <h3><i class="fas fa-user-plus"></i> Add New Guest (Same Design)</h3>
                <div class="add-guest-row">
                    <input type="text" id="newGuestInput" placeholder="Enter new guest name">
                    <button onclick="addNewGuest()"><i class="fas fa-plus"></i> Add</button>
                </div>
            </div>
            
            <div class="invitation-controls">
                <button class="action-btn btn-download" onclick="window.print()">
                    <i class="fas fa-print"></i> Print All Invitations
                </button>
                <button class="action-btn btn-regen" onclick="regenerateCard()">
                    <i class="fas fa-rotate"></i> Regenerate Design
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // PUT YOUR CLOUDFLARE WORKER URL HERE
    // ==========================================
    const INVITATION_API_URL = "[https://blueprint.zone21services.workers.dev](https://blueprint.zone21services.workers.dev)"; // Update this!

    let currentSessionId = null;
    let currentCardData = null;
    let guestNames = [];
    let currentDesignTemplate = '';
    let isGenerating = false;

    // Sidebar
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    function closeSidebar() { sidebar.classList.remove('active'); overlay.classList.remove('active'); }
    if(menuBtn) menuBtn.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
    if(overlay) overlay.addEventListener('click', closeSidebar);

    // Guest Handling
    function addGuest() {
        const input = document.getElementById('guestNameInput');
        const name = input.value.trim();
        if (!name) return;
        if (!guestNames.includes(name)) guestNames.push(name);
        input.value = '';
        updateGuestDisplay();
    }

    function updateGuestDisplay() {
        const display = document.getElementById('guestListDisplay');
        display.innerHTML = guestNames.map((name, i) => 
            `<span class="guest-tag">${name} <i class="fas fa-times" style="cursor:pointer; margin-left:5px;" onclick="removeGuest(${i})"></i></span>`
        ).join('');
    }

    function removeGuest(i) { guestNames.splice(i, 1); updateGuestDisplay(); }
    document.getElementById('guestNameInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addGuest(); }});

    // Form Submission
    document.getElementById('cardForm').addEventListener('submit', e => {
        e.preventDefault();
        if (isGenerating) return;

        currentCardData = {
            eventTitle: document.getElementById('eventTitle').value.trim(),
            hostName: document.getElementById('hostName').value.trim(),
            guestOfHonor: document.getElementById('guestOfHonor').value.trim(),
            date: document.getElementById('eventDate').value,
            venue: document.getElementById('venue').value.trim(),
            dressCode: document.getElementById('dressCode').value.trim(), // Used as theme
            message: document.getElementById('specialMessage').value.trim(),
            guests: [...guestNames]
        };
        generateInvitation(false);
    });

    function buildPrompt(data) {
        let dateObj = new Date(data.date);
        let formattedDate = isNaN(dateObj) ? data.date : new Intl.DateTimeFormat("en-ZA", {
            weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit"
        }).format(dateObj);

        return `You are an elite web designer. Create ONE beautiful invitation card layout using HTML and inline CSS.
Event Details:
- Title: ${data.eventTitle}
- Host: ${data.hostName}
- Guest of Honor: ${data.guestOfHonor || 'None'}
- Date & Time: ${formattedDate}
- Venue: ${data.venue}
- Message: ${data.message || 'Join us to celebrate!'}
- Visual Theme / Colors requested: ${data.dressCode || 'Elegant, luxury, modern'}

CRITICAL RULES:
1. Output ONLY a single <div class="preview-card"> containing the design.
2. Use beautiful inline CSS (gradients, elegant borders, box-shadows, padding, Google Fonts).
3. Ensure high contrast so text is perfectly readable.
4. EXACTLY include the placeholder text "[GUEST_NAME]" somewhere prominent in the design so I can replace it dynamically in JavaScript later.
5. Make it look like a physical luxury invitation card.`;
    }

    async function generateInvitation(isRegenerating) {
        isGenerating = true;
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('invitation-container').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        if (!currentSessionId || !isRegenerating) currentSessionId = 'inv_' + Date.now();

        const prompt = buildPrompt(currentCardData);

        try {
            const response = await fetch(INVITATION_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error);
            if (!data.template) throw new Error("No template returned.");

            currentDesignTemplate = data.template;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('invitation-container').style.display = 'block';
            renderCardsList();
            saveInvitationState();
            document.getElementById('invitation-container').scrollIntoView({ behavior: "smooth" });

        } catch (error) {
            alert("Error generating invitation: " + error.message);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
        } finally {
            isGenerating = false;
        }
    }

    function renderCardsList() {
        const cardsList = document.getElementById('cardsList');
        const guests = currentCardData.guests.length > 0 ? currentCardData.guests : ['Valued Guest'];
        cardsList.innerHTML = '';
        
        guests.forEach((guest, index) => {
            // Dynamically inject the guest name into the AI's HTML template
            const personalizedHTML = currentDesignTemplate.replace(/\[GUEST_NAME\]/g, guest);
            
            const cardItem = document.createElement('div');
            cardItem.className = 'card-item';
            cardItem.innerHTML = `
                <div class="card-item-header">
                    <span class="guest-label"><i class="fas fa-user"></i> Guest: ${guest}</span>
                    <div class="card-actions">
                        <button class="action-btn btn-download" onclick="printSingleInvitation('${guest}', ${index})"><i class="fas fa-print"></i> Print</button>
                    </div>
                </div>
                <div class="card-item-body" id="card-body-${index}">
                    ${personalizedHTML}
                </div>
            `;
            cardsList.appendChild(cardItem);
        });
        document.getElementById('addGuestSection').style.display = 'block';
    }

    function addNewGuest() {
        const input = document.getElementById('newGuestInput');
        const name = input.value.trim();
        if (!name) return;
        currentCardData.guests.push(name);
        guestNames.push(name);
        input.value = '';
        renderCardsList();
        saveInvitationState();
    }
    document.getElementById('newGuestInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addNewGuest(); }});

    function regenerateCard() { generateInvitation(true); }

    function printSingleInvitation(guestName, index) {
        const cardBody = document.getElementById(`card-body-${index}`);
        if (!cardBody) return;
        const printWindow = window.open('', '_blank', 'width=800,height=1100');
        printWindow.document.write(`
            <html><head><title>Invitation - ${guestName}</title>
            <style>
                @page { size: A4 portrait; margin: 0; }
                * { -webkit-print-color-adjust: exact; print-color-adjust: exact; box-sizing: border-box; }
                body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: white; }
                .preview-card { width: 210mm; height: 297mm; max-width: 210mm; border: none !important; border-radius: 0 !important; margin: 0; }
            </style></head>
            <body>${cardBody.innerHTML}<script>window.onload=function(){setTimeout(window.print, 500);};<\/script></body></html>
        `);
        printWindow.document.close();
    }

    // Storage
    function saveInvitationState() {
        const cardData = {
            id: currentSessionId, 
            title: `${currentCardData.hostName} - ${currentCardData.eventTitle}`,
            formData: currentCardData, 
            designTemplate: currentDesignTemplate,
            updatedAt: new Date().toISOString()
        };
        let sessions = JSON.parse(localStorage.getItem('zone21_invitations') || '{}');
        sessions[currentSessionId] = cardData;
        localStorage.setItem('zone21_invitations', JSON.stringify(sessions));
        renderHistorySidebar();
    }

    function renderHistorySidebar() {
        const hl = document.getElementById('history-list');
        hl.innerHTML = '';
        let sessions = JSON.parse(localStorage.getItem('zone21_invitations') || '{}');
        Object.values(sessions).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)).forEach(s => {
            const item = document.createElement('div');
            item.className = `history-item ${s.id === currentSessionId ? 'active' : ''}`;
            item.innerHTML = `<div class="item-info"><i class="fas fa-envelope" style="color:var(--lime);"></i><span class="item-title">${s.title}</span></div><i class="fas fa-trash delete-btn"></i>`;
            item.querySelector('.delete-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteInvitationSession(s.id); });
            item.addEventListener('click', () => loadInvitationSession(s.id));
            hl.appendChild(item);
        });
    }

    function loadInvitationSession(id) {
        closeSidebar();
        let s = JSON.parse(localStorage.getItem('zone21_invitations') || '{}')[id];
        if (!s) return;
        currentSessionId = s.id; currentCardData = s.formData; currentDesignTemplate = s.designTemplate; guestNames = s.formData.guests || [];
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('invitation-container').style.display = 'block';
        renderCardsList(); renderHistorySidebar();
    }

    function deleteInvitationSession(id) {
        if (!confirm("Delete invitation?")) return;
        let s = JSON.parse(localStorage.getItem('zone21_invitations') || '{}');
        delete s[id]; localStorage.setItem('zone21_invitations', JSON.stringify(s));
        if (currentSessionId === id) startNewCard(); else renderHistorySidebar();
    }

    function startNewCard() {
        closeSidebar(); currentSessionId = null; currentCardData = null; currentDesignTemplate = ''; guestNames = [];
        document.getElementById('cardForm').reset(); document.getElementById('guestListDisplay').innerHTML = '';
        document.getElementById('invitation-container').style.display = 'none'; document.getElementById('form-section').style.display = 'block';
        renderHistorySidebar();
    }

    document.addEventListener('DOMContentLoaded', renderHistorySidebar);
</script>
</body>
</html>
