<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zone21 | Invitation Card Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800;
            --pink: #F80070;
            --white: #F8F8F8;
            --grey: #E0E0E8;
            --gold: #D4AF37;
            --radius: 16px;
            --radius-xl: 24px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        html { height: -webkit-fill-available; }

        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e8eef4 50%, #f5f3f1 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            height: 100dvh;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
            color: var(--navy);
            margin: 0;
        }

        /* Sidebar */
        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.4); z-index: 999; opacity: 0; transition: opacity 0.3s ease;
        }
        .sidebar {
            width: 300px; background: var(--navy); border-radius: var(--radius-xl); color: white;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 60px rgba(16,40,56,0.15); transition: transform 0.3s ease; z-index: 1000;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .new-card-btn { background: var(--lime); color: var(--navy); border: none; padding: 12px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; transition: 0.2s; }
        .new-card-btn:hover { background: white; }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        .history-item { 
            padding: 10px 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 8px; 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; transition: 0.2s; gap: 8px;
        }
        .history-item:hover { background: rgba(255,255,255,0.15); }
        .history-item.active { border-left: 4px solid var(--lime); background: rgba(255,255,255,0.1); }
        .history-item .item-info { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; }
        .history-item .item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white; }
        .history-item .delete-btn { color: rgba(255,255,255,0.4); padding: 4px; border-radius: 4px; transition: 0.2s; }
        .history-item .delete-btn:hover { color: var(--pink); background: rgba(248, 0, 112, 0.15); }

        /* Workspace */
        .workspace {
            flex: 1; background: white; border-radius: var(--radius-xl);
            box-shadow: 0 20px 60px rgba(16,40,56,0.15); display: flex; flex-direction: column; overflow: hidden; position: relative;
        }
        .workspace-header { background: var(--navy); color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 4px solid var(--lime); z-index: 10; }
        .menu-btn { display: none; background: transparent; border: none; font-size: 1.4rem; color: white; cursor: pointer; padding: 5px; }
        .workspace-header h1 { font-size: 1.3rem; color: var(--lime); margin: 0; }
        .workspace-header p { font-size: 0.8rem; color: rgba(255,255,255,0.8); margin: 0; }

        .workspace-content { flex: 1; overflow-y: auto; padding: 20px; background: #fafbfc; scroll-behavior: smooth; }

        /* Form Styling */
        .form-section { background: white; padding: 25px; border-radius: 16px; border: 1px solid var(--grey); box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media(max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-weight: bold; font-size: 0.9rem; }
        .input-group input, .input-group select, .input-group textarea { padding: 12px; border: 1px solid var(--grey); border-radius: 8px; outline: none; transition: 0.3s; font-size: 0.95rem; background: #f9fafb; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--navy); background: white; }
        .input-group textarea { resize: vertical; min-height: 80px; }

        /* Wedding Guest List */
        .guest-list-section { display: none; margin-top: 20px; }
        .guest-list-section.visible { display: block; }
        .guest-input-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .guest-input-row input { flex: 1; padding: 10px; border: 1px solid var(--grey); border-radius: 8px; }
        .guest-input-row button { background: var(--pink); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1rem; }
        .guest-list-display { margin-top: 10px; }
        .guest-tag { display: inline-block; background: #f0f4f8; padding: 5px 12px; border-radius: 20px; margin: 3px; font-size: 0.85rem; }

        .submit-btn { width: 100%; background: var(--navy); color: var(--lime); border: none; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .submit-btn:hover { background: var(--lime); color: var(--navy); }
        .submit-btn:disabled { background: var(--grey); color: #888; cursor: not-allowed; }

        /* Loading */
        #loading { display: none; text-align: center; padding: 40px; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--pink); animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Invitation Display */
        #invitation-container { display: none; }
        .invitation-wrapper { width: 100%; margin-top: 10px; animation: fadeInUp 0.3s ease forwards; }
        .invitation-result {
            background: white; padding: 40px 30px; border-radius: 16px;
            border: 1px solid var(--grey); width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            word-wrap: break-word; overflow-x: auto;
            position: relative;
        }
        .invitation-card {
            max-width: 650px; margin: 0 auto;
            border: 3px solid var(--gold);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            background: #fffdf8;
        }
        .invitation-card::before {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid var(--gold);
            border-radius: 10px;
            pointer-events: none;
        }
        .invitation-card .ornament {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 10px;
        }
        .invitation-card h1 {
            font-size: 1.8rem;
            color: var(--navy);
            margin-bottom: 5px;
            font-family: 'Georgia', serif;
        }
        .invitation-card .subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 20px;
            font-style: italic;
        }
        .invitation-card .guest-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--pink);
            margin: 15px 0;
            font-family: 'Georgia', serif;
        }
        .invitation-card .details {
            margin: 20px 0;
            font-size: 0.95rem;
            line-height: 1.8;
        }
        .invitation-card .details strong {
            color: var(--navy);
        }
        .invitation-card .footer-note {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .invitation-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; border-top: 1px solid var(--grey); padding-top: 20px; }
        .action-btn { padding: 10px 18px; border-radius: 30px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; transition: 0.2s; }
        .btn-download { background: #28a745; color: white; }
        .btn-regen { background: #f0f4f8; color: var(--navy); border: 1px solid var(--grey); }
        .btn-regen:hover { background: var(--navy); color: white; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            body { padding: 0; gap: 0; }
            .workspace { border-radius: 0; box-shadow: none; }
            .menu-btn { display: block; }
            .sidebar { position: fixed; top: 0; left: -320px; height: 100dvh; width: 280px; border-radius: 0 24px 24px 0; }
            .sidebar.active { transform: translateX(320px); }
            .sidebar-overlay.active { display: block; opacity: 1; }
            .workspace-content { padding: 15px 10px; }
            .form-section { padding: 15px; border-radius: 12px; }
            .invitation-card { padding: 25px 15px; }
        }

        @media print {
            @page { size: A5; margin: 0; }
            body * { visibility: hidden; }
            .invitation-wrapper, .invitation-wrapper * { visibility: visible; }
            .invitation-wrapper { position: absolute; left: 0; top: 0; width: 100%; margin: 0; }
            .invitation-card { border: 2px solid var(--gold); box-shadow: none; max-width: 100%; }
            .invitation-controls { display: none !important; }
            .workspace { box-shadow: none; overflow: visible; }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div><h2>Past Invitations</h2></div>
    </div>
    <div style="padding: 0 20px;">
        <button class="new-card-btn" onclick="startNewCard()"><i class="fas fa-plus"></i> New Invitation</button>
    </div>
    <div class="history-list" id="history-list"></div>
</div>

<!-- Main Workspace -->
<div class="workspace">
    <div class="workspace-header">
        <button class="menu-btn" id="menu-btn"><i class="fas fa-bars"></i></button>
        <div>
            <h1>Zone21 Invitation Developer</h1>
            <p>Craft Beautiful, Unique 2026 Invitation Cards</p>
        </div>
    </div>

    <div class="workspace-content" id="workspace-content">
        
        <!-- Card Form -->
        <div class="form-section" id="form-section">
            <form id="cardForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>1. Event / Occasion</label>
                        <select id="eventType" required onchange="toggleGuestList()">
                            <option value="" disabled selected>Select Occasion...</option>
                            <option value="Wedding">Wedding</option>
                            <option value="Traditional Lobola">Traditional Lobola</option>
                            <option value="Birthday">Birthday</option>
                            <option value="Cocktail Party">Cocktail Party</option>
                            <option value="Dinner Party">Dinner Party</option>
                            <option value="Baby Shower">Baby Shower</option>
                            <option value="Graduation">Graduation</option>
                            <option value="Corporate Event">Corporate Event</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>2. Host Name(s)</label>
                        <input type="text" id="hostName" required placeholder="e.g. Mr. & Mrs. Moyo">
                    </div>
                    <div class="input-group">
                        <label>3. Guest of Honor (if any)</label>
                        <input type="text" id="guestOfHonor" placeholder="Optional">
                    </div>
                    <div class="input-group">
                        <label>4. Date & Time</label>
                        <input type="datetime-local" id="eventDate" required>
                    </div>
                    <div class="input-group">
                        <label>5. Venue</label>
                        <input type="text" id="venue" required placeholder="e.g. Meikles Hotel, Harare">
                    </div>
                    <div class="input-group">
                        <label>6. Dress Code / Theme</label>
                        <input type="text" id="dressCode" placeholder="e.g. Formal, All White, Traditional">
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 15px;">
                    <label>7. Special Message (Optional)</label>
                    <textarea id="specialMessage" placeholder="e.g. Join us as we celebrate love..."></textarea>
                </div>

                <!-- Guest List for Weddings & Lobola -->
                <div class="guest-list-section" id="guestListSection">
                    <label style="font-weight: bold; margin-bottom: 10px; display: block;">8. Guest Names (Individual invitations will be generated)</label>
                    <div class="guest-input-row">
                        <input type="text" id="guestNameInput" placeholder="Enter guest name">
                        <button type="button" onclick="addGuest()"><i class="fas fa-plus"></i></button>
                    </div>
                    <div class="guest-list-display" id="guestListDisplay"></div>
                    <input type="hidden" id="guestsHidden" value="">
                </div>

                <button type="submit" class="submit-btn" id="generateBtn">
                    <i class="fas fa-wand-magic-sparkles"></i> Generate Invitation Card
                </button>
            </form>
        </div>

        <!-- Loading -->
        <div id="loading">
            <div class="spinner"></div>
            <h3 style="color: var(--navy);">Designing your invitation...</h3>
            <p style="color: #666; font-size: 0.9rem; margin-top: 5px;">Crafting a unique, beautiful 2026 design.</p>
        </div>

        <!-- Invitation Result -->
        <div id="invitation-container">
            <div class="invitation-wrapper">
                <div class="invitation-result" id="finalInvitation"></div>
                <div class="invitation-controls">
                    <button class="action-btn btn-download" onclick="downloadAllInvitations()">
                        <i class="fas fa-file-pdf"></i> Download All Invitations
                    </button>
                    <button class="action-btn btn-regen" onclick="regenerateCard()">
                        <i class="fas fa-rotate"></i> Regenerate Design
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Config
    const OPENROUTER_API_KEY = "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"; 
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";

    let currentSessionId = null;
    let currentCardData = null;
    let guestNames = [];

    // Mobile Sidebar Toggle
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    function closeSidebar() { sidebar.classList.remove('active'); overlay.classList.remove('active'); }
    if (menuBtn) menuBtn.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
    if (overlay) overlay.addEventListener('click', closeSidebar);

    // Toggle Guest List for Weddings & Lobola
    function toggleGuestList() {
        const type = document.getElementById('eventType').value;
        const guestSection = document.getElementById('guestListSection');
        if (type === 'Wedding' || type === 'Traditional Lobola') {
            guestSection.classList.add('visible');
        } else {
            guestSection.classList.remove('visible');
        }
    }

    // Guest Management
    function addGuest() {
        const input = document.getElementById('guestNameInput');
        const name = input.value.trim();
        if (!name) return;
        guestNames.push(name);
        input.value = '';
        updateGuestDisplay();
    }

    function updateGuestDisplay() {
        const display = document.getElementById('guestListDisplay');
        display.innerHTML = guestNames.map((name, index) => 
            `<span class="guest-tag">${name} <i class="fas fa-times" style="cursor:pointer; margin-left:5px;" onclick="removeGuest(${index})"></i></span>`
        ).join('');
        document.getElementById('guestsHidden').value = JSON.stringify(guestNames);
    }

    function removeGuest(index) {
        guestNames.splice(index, 1);
        updateGuestDisplay();
    }

    // Form Submit
    document.getElementById('cardForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        currentCardData = {
            eventType: document.getElementById('eventType').value,
            hostName: document.getElementById('hostName').value,
            guestOfHonor: document.getElementById('guestOfHonor').value || 'None',
            date: document.getElementById('eventDate').value,
            venue: document.getElementById('venue').value,
            dressCode: document.getElementById('dressCode').value || 'None specified',
            message: document.getElementById('specialMessage').value || 'None',
            guests: guestNames
        };

        generateInvitation(false);
    });

    async function generateInvitation(isRegenerating) {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('invitation-container').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        
        if (!currentSessionId || !isRegenerating) {
            currentSessionId = 'inv_' + Date.now();
        }

        const prompt = `
You are a world-class invitation card designer creating a stunning, unique 2026 invitation.

DETAILS:
- Occasion: ${currentCardData.eventType}
- Host: ${currentCardData.hostName}
- Guest of Honor: ${currentCardData.guestOfHonor}
- Date & Time: ${currentCardData.date}
- Venue: ${currentCardData.venue}
- Dress Code / Theme: ${currentCardData.dressCode}
- Special Message: ${currentCardData.message}
- Guest List: ${currentCardData.guests.length > 0 ? currentCardData.guests.join('; ') : 'No individual guests — general invitation'}

DESIGN REQUIREMENTS:
1. Create a BEAUTIFUL, MODERN 2026 invitation card using pure HTML/CSS inline styling.
2. Use elegant fonts (Georgia, serif), rich colors that match the occasion (gold for weddings, warm tones for lobola, vibrant for birthdays, etc.).
3. Include ornamental elements (✨, 🌸, 💍, 🕊️, etc. as appropriate).
4. If guest names are provided, generate INDIVIDUAL cards for EACH guest. Otherwise, create ONE general card.
5. Output ONLY pure HTML. Use <div class="invitation-card"> for each card. Separate multiple cards with a horizontal rule.
6. Each card must include: Occasion title, host name, guest name (if applicable), date, time, venue, dress code, and a warm closing message.
7. Make it printable and visually stunning. Use borders, shadows, and decorative elements.

FORMAT: Return ONLY the HTML content. No markdown blocks, no explanations.
`;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                    'HTTP-Referer': 'https://zone21-ai.local',
                    'X-Title': 'Zone21 Invitation Developer'
                },
                body: JSON.stringify({ 
                    model: "openrouter/auto", 
                    messages: [{ role: "user", content: prompt }] 
                })
            });
            
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            
            let htmlOutput = data.choices[0].message.content.trim().replace(/^```html/i, '').replace(/^```/i, '').replace(/```$/i, '');
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('invitation-container').style.display = 'block';
            document.getElementById('finalInvitation').innerHTML = htmlOutput;
            
            saveInvitationState(htmlOutput);

        } catch (error) {
            console.error("Design Error:", error);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
            alert("Error generating invitation. Please try again.");
        }
    }

    function regenerateCard() {
        generateInvitation(true);
    }

    function downloadAllInvitations() {
        window.print();
    }

    // Storage & History
    function saveInvitationState(htmlOutput) {
        const title = `${currentCardData.hostName} - ${currentCardData.eventType}`;
        const cardData = {
            id: currentSessionId,
            title: title,
            formData: currentCardData,
            invitationHtml: htmlOutput,
            updatedAt: new Date().toISOString()
        };

        let localSessions = JSON.parse(localStorage.getItem('zone21_invitations') || '{}');
        localSessions[currentSessionId] = cardData;
        localStorage.setItem('zone21_invitations', JSON.stringify(localSessions));

        renderHistorySidebar();
    }

    function renderHistorySidebar() {
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';

        let localSessions = JSON.parse(localStorage.getItem('zone21_invitations') || '{}');
        
        Object.values(localSessions).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)).forEach(session => {
            const item = document.createElement('div');
            item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
            item.innerHTML = `
                <div class="item-info">
                    <i class="fas fa-envelope" style="color: var(--lime);"></i>
                    <span class="item-title">${session.title}</span>
                </div>
                <i class="fas fa-trash delete-btn" title="Delete" onclick="deleteInvitationSession('${session.id}', event)"></i>
            `;
            item.onclick = () => loadInvitationSession(session.id);
            historyList.appendChild(item);
        });
    }

    function loadInvitationSession(sessionId) {
        closeSidebar();
        let localSessions = JSON.parse(localStorage.getItem('zone21_invitations') || '{}');
        const session = localSessions[sessionId];
        if (!session) return;

        currentSessionId = session.id;
        currentCardData = session.formData;
        guestNames = session.formData.guests || [];
        
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('invitation-container').style.display = 'block';
        document.getElementById('finalInvitation').innerHTML = session.invitationHtml;
        
        renderHistorySidebar();
    }

    function deleteInvitationSession(sessionId, event) {
        if (event) event.stopPropagation(); 
        if (!confirm("Delete this invitation?")) return;

        let localSessions = JSON.parse(localStorage.getItem('zone21_invitations') || '{}');
        delete localSessions[sessionId];
        localStorage.setItem('zone21_invitations', JSON.stringify(localSessions));

        if (currentSessionId === sessionId) {
            startNewCard();
        } else {
            renderHistorySidebar();
        }
    }

    function startNewCard() {
        closeSidebar();
        currentSessionId = null;
        currentCardData = null;
        guestNames = [];
        
        document.getElementById('cardForm').reset();
        document.getElementById('guestListDisplay').innerHTML = '';
        document.getElementById('guestsHidden').value = '';
        document.getElementById('guestListSection').classList.remove('visible');
        document.getElementById('invitation-container').style.display = 'none';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('form-section').style.display = 'block';
        
        renderHistorySidebar();
    }

    // Init
    document.addEventListener('DOMContentLoaded', renderHistorySidebar);
</script>

</body>
</html>
