<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Event Tools | Zone21</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ========== VARIABLES ========== */
        :root {
            --navy: #102838;
            --lime: #C0C800;
            --pink: #F80070;
            --white: #F8F8F8;
            --grey: #E0E0E8;
            --black: #101010;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ========== TOP BAR ========== */
        .topbar {
            background: white;
            padding: 16px 32px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar .brand .logo {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--navy);
            letter-spacing: -0.5px;
        }
        .topbar .brand .logo span { color: var(--lime); }
        .topbar .brand .back-btn {
            background: none;
            border: none;
            color: var(--navy);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: var(--transition);
        }
        .topbar .brand .back-btn:hover { background: var(--grey); }
        .topbar .right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar .right .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--navy);
        }
        .topbar .right .profile .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--lime);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--navy);
            font-size: 0.75rem;
        }
        .topbar .right .profile .name {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .topbar .right .logout-btn {
            background: none;
            border: none;
            color: var(--navy);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 6px;
            transition: var(--transition);
        }
        .topbar .right .logout-btn:hover { color: var(--pink); background: rgba(248,0,112,0.06); }

        /* ========== HERO HEADER ========== */
        .hero {
            padding: 40px 32px 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .hero .greeting {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 4px;
        }
        .hero .greeting h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--navy);
            letter-spacing: -0.5px;
        }
        .hero .greeting h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #888;
            letter-spacing: 0;
        }
        .hero .greeting .live-badge {
            background: var(--pink);
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: var(--transition);
        }
        .hero .greeting .live-badge:hover { transform: scale(1.02); }
        .hero .greeting .live-badge i { font-size: 0.6rem; }

        .hero .tagline {
            font-size: 1rem;
            color: #666;
            margin-top: 4px;
            font-weight: 400;
        }
        .hero .tagline strong { color: var(--navy); }

        /* ========== TOOL GRID ========== */
        .tools-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8px 32px 48px;
            width: 100%;
        }
        .tools-container .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--grey);
        }

        /* ===== 3 COLUMNS DESKTOP ===== */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        /* ========== TOOL CARD ========== */
        .tool-card {
            background: white;
            border-radius: var(--radius);
            padding: 24px 20px 20px;
            border: 1px solid rgba(0,0,0,0.04);
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .tool-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--lime);
        }
        .tool-card:active { transform: scale(0.97); }

        .tool-card .icon-wrap {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 14px;
            background: rgba(192, 200, 0, 0.08);
            color: var(--lime);
            transition: var(--transition);
        }
        .tool-card:hover .icon-wrap {
            background: var(--lime);
            color: var(--navy);
        }

        .tool-card .tool-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 4px;
        }
        .tool-card .tool-desc {
            font-size: 0.8rem;
            color: #888;
            line-height: 1.4;
            flex: 1;
        }
        .tool-card .tool-badge {
            margin-top: 12px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--lime);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tool-card .tool-badge i { font-size: 0.5rem; }

        /* Special card: Publish Event */
        .tool-card.publish {
            background: linear-gradient(135deg, var(--navy) 0%, #1a3f52 100%);
            border-color: var(--navy);
            color: white;
        }
        .tool-card.publish .icon-wrap {
            background: rgba(192, 200, 0, 0.15);
            color: var(--lime);
        }
        .tool-card.publish:hover .icon-wrap {
            background: var(--lime);
            color: var(--navy);
        }
        .tool-card.publish .tool-title { color: white; }
        .tool-card.publish .tool-desc { color: rgba(255,255,255,0.6); }
        .tool-card.publish .tool-badge { color: var(--lime); }
        .tool-card.publish:hover { border-color: var(--lime); transform: translateY(-6px); box-shadow: 0 8px 30px rgba(16,40,56,0.25); }

        /* ========== TOAST ========== */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            padding: 14px 20px;
            border-radius: 12px;
            background: var(--navy);
            color: white;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            font-size: 0.9rem;
            animation: slideIn 0.3s ease forwards;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: opacity 0.3s ease;
        }
        .toast.success { border-left: 4px solid var(--lime); }
        .toast.error { border-left: 4px solid var(--pink); }
        .toast.info { border-left: 4px solid #4a9eff; }
        .toast i { font-size: 1.2rem; }
        .toast.success i { color: var(--lime); }
        .toast.error i { color: var(--pink); }
        .toast.info i { color: #4a9eff; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 992px) {
            .tools-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }
        @media (max-width: 600px) {
            .topbar { padding: 12px 16px; }
            .topbar .brand .logo { font-size: 1rem; }
            .topbar .right .profile .name { display: none; }
            .hero { padding: 24px 16px 16px; }
            .hero .greeting h1 { font-size: 1.4rem; }
            .hero .tagline { font-size: 0.85rem; }
            .tools-container { padding: 4px 16px 32px; }
            .tools-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .tool-card { padding: 18px 14px 16px; }
            .tool-card .icon-wrap { width: 40px; height: 40px; font-size: 1rem; margin-bottom: 10px; }
            .tool-card .tool-title { font-size: 0.85rem; }
            .tool-card .tool-desc { font-size: 0.7rem; }
        }
        @media (max-width: 400px) {
            .tools-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ========== TOP BAR ========== -->
    <header class="topbar">
        <div class="brand">
            <button class="back-btn" onclick="window.location.href='organizer-dashboard.html'" title="Back to Dashboard">
                <i class="fas fa-arrow-left"></i>
            </button>
            <span class="logo">Zone<span>21</span></span>
        </div>
        <div class="right">
            <div class="profile">
                <div class="avatar" id="profile-avatar">O</div>
                <span class="name" id="profile-name">Organizer</span>
            </div>
            <button class="logout-btn" id="logout-btn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <!-- ========== HERO ========== -->
    <section class="hero">
        <div class="greeting">
            <h1>
                Event Tools
                <small>· Manage your event</small>
            </h1>
            <span class="live-badge" onclick="window.location.href='organizer-dashboard.html'">
                <i class="fas fa-circle"></i> LIVE PLATFORM
            </span>
        </div>
        <p class="tagline">
            Plan, Create, and Celebrate – <strong>Your Event, Your Way</strong>
        </p>
    </section>

    <!-- ========== TOOLS GRID ========== -->
    <section class="tools-container">
        <div class="section-label"><i class="fas fa-tools" style="margin-right:6px;"></i> All Tools</div>
        <div class="tools-grid" id="tools-grid">
            <!-- Cards will be injected by JS -->
        </div>
    </section>

    <!-- ========== TOAST CONTAINER ========== -->
    <div id="toast-container"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js">
    </script>

    <script>
        // ==============================================================
        // FIREBASE CONFIG
        // ==============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ==============================================================
        // TOOLS DATA (Filtered: removed subscription, support, contact)
        // ==============================================================
        const tools = [{
            id: 'overview',
            icon: 'fa-th-large',
            title: 'Overview',
            desc: 'Event summary, stats & activity feed',
            color: '#102838',
            link: 'manage-event.html?tool=overview'
        }, {
            id: 'blueprint',
            icon: 'fa-brain',
            title: 'AI Blueprint',
            desc: 'Generate smart event plan with AI',
            color: '#C0C800',
            link: 'manage-event.html?tool=blueprint'
        }, {
            id: 'edit',
            icon: 'fa-pen-to-square',
            title: 'Edit Event',
            desc: 'Update details, date, budget & more',
            color: '#F80070',
            link: 'manage-event.html?tool=edit'
        }, {
            id: 'vendors',
            icon: 'fa-store',
            title: 'Vendors',
            desc: 'Manage service providers & contacts',
            color: '#2e7d32',
            link: 'manage-event.html?tool=vendors'
        }, {
            id: 'security',
            icon: 'fa-shield-alt',
            title: 'Security',
            desc: 'Request Zone21 security team',
            color: '#e65100',
            link: 'manage-event.html?tool=security'
        }, {
            id: 'guests',
            icon: 'fa-envelope',
            title: 'Guests & Cards',
            desc: 'Invitations, RSVPs & guest list',
            color: '#283593',
            link: 'manage-event.html?tool=guests'
        }, {
            id: 'revenue',
            icon: 'fa-dollar-sign',
            title: 'Revenue',
            desc: 'Track earnings, fees & payouts',
            color: '#00838f',
            link: 'manage-event.html?tool=revenue'
        }, {
            id: 'analytics',
            icon: 'fa-chart-bar',
            title: 'Analytics',
            desc: 'Views, conversions & insights',
            color: '#6a1b9a',
            link: 'manage-event.html?tool=analytics'
        }, {
            id: 'profile',
            icon: 'fa-user',
            title: 'Profile',
            desc: 'Organizer account settings',
            color: '#37474f',
            link: 'manage-event.html?tool=profile'
        }, {
            id: 'publish',
            icon: 'fa-rocket',
            title: 'Publish Event',
            desc: 'Launch your event to the world',
            color: '#C0C800',
            link: '#',
            isPublish: true
        }, ];

        // ==============================================================
        // RENDER TOOLS
        // ==============================================================
        function renderTools() {
            const grid = document.getElementById('tools-grid');
            grid.innerHTML = tools.map(tool => {
                const isPublish = tool.isPublish || false;
                const iconBg = isPublish ? 'rgba(192,200,0,0.15)' : 'rgba(192,200,0,0.08)';
                const iconColor = isPublish ? 'var(--lime)' : 'var(--lime)';

                return `
                    <a class="tool-card ${isPublish ? 'publish' : ''}" 
                       href="${tool.link}" 
                       data-tool="${tool.id}"
                       onclick="${isPublish ? `publishEvent(event)` : ''}">
                        <div class="icon-wrap" style="background:${iconBg}; color:${iconColor};">
                            <i class="fas ${tool.icon}"></i>
                        </div>
                        <div class="tool-title">${tool.title}</div>
                        <div class="tool-desc">${tool.desc}</div>
                        <div class="tool-badge">
                            <i class="fas fa-arrow-right"></i> ${isPublish ? 'Launch Now' : 'Open Tool'}
                        </div>
                    </a>
                `;
            }).join('');
        }

        // ==============================================================
        // PUBLISH EVENT
        // ==============================================================
        function publishEvent(e) {
            e.preventDefault();
            showToast('🎉 Your event is now live! Share the link with your audience.', 'success');
            // In a real app, you'd update Firestore status to 'published'
        }

        // ==============================================================
        // TOAST SYSTEM
        // ==============================================================
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) { alert(msg); return; }
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            const iconMap = { success: 'fa-circle-check', error: 'fa-circle-exclamation', info: 'fa-circle-info' };
            t.innerHTML = `<i class="fa-solid ${iconMap[type] || 'fa-circle-info'}"></i> ${msg}`;
            container.appendChild(t);
            setTimeout(() => { t.style.opacity = '0';
                setTimeout(() => t.remove(), 300); }, 4500);
        }

        // ==============================================================
        // AUTH STATE
        // ==============================================================
        auth.onAuthStateChanged(user => {
            if (user) {
                const name = user.displayName || user.email || 'Organizer';
                document.getElementById('profile-name').textContent = name;
                document.getElementById('profile-avatar').textContent = name.charAt(0).toUpperCase();
            } else {
                window.location.href = 'login.html';
            }
        });

        // ==============================================================
        // LOGOUT
        // ==============================================================
        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = 'index.html');
        });

        // ==============================================================
        // INIT
        // ==============================================================
        document.addEventListener('DOMContentLoaded', renderTools);

        // Handle tool clicks (for non-publish tools, just navigate)
        document.addEventListener('click', function(e) {
            const card = e.target.closest('.tool-card:not(.publish)');
            if (card && card.dataset.tool && card.dataset.tool !== 'publish') {
                // The href will handle navigation, but we can add tracking here
                const toolId = card.dataset.tool;
                console.log(`🔧 Opening tool: ${toolId}`);
            }
        });
    </script>

</body>
</html>
