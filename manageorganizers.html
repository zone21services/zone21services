<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – Organizers | Zone21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ===== ROOT ===== */
        :root {
            --navy: #0a1f2e;
            --navy-light: #1a3a4a;
            --lime: #C0C800;
            --lime-glow: rgba(192, 200, 0, 0.25);
            --pink: #F80070;
            --pink-glow: rgba(248, 0, 112, 0.15);
            --bg: #f0f2f6;
            --card: #ffffff;
            --text: #0f1a24;
            --text-secondary: #3d4f5e;
            --muted: #7a8a9a;
            --border: #e6eaf0;
            --radius: 18px;
            --radius-sm: 10px;
            --shadow-sm: 0 2px 8px rgba(10, 31, 46, 0.04);
            --shadow: 0 8px 32px rgba(10, 31, 46, 0.07);
            --shadow-hover: 0 16px 48px rgba(10, 31, 46, 0.12);
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --topbar-height: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--lime);
            border-radius: 10px;
        }

        /* ===== MAIN WRAPPER ===== */
        .main-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            height: var(--topbar-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(230, 234, 240, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 900;
            gap: 16px;
        }
        .topbar .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg);
            border-radius: 30px;
            padding: 8px 18px;
            flex: 1;
            max-width: 340px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .topbar .search-bar:focus-within {
            border-color: var(--lime);
            box-shadow: 0 0 0 4px var(--lime-glow);
        }
        .topbar .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            flex: 1;
            font-size: 0.85rem;
            color: var(--text);
            font-weight: 500;
        }
        .topbar .search-bar input::placeholder {
            color: var(--muted);
            font-weight: 400;
        }
        .topbar .search-bar i {
            color: var(--muted);
        }

        .topbar .topbar-right {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-shrink: 0;
        }
        .topbar .notifications {
            position: relative;
            cursor: pointer;
            color: var(--navy);
            font-size: 1.1rem;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg);
            transition: var(--transition);
        }
        .topbar .notifications:hover {
            background: var(--border);
        }
        .topbar .notifications .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--pink);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.55rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

        .topbar .profile-dropdown {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 4px 12px 4px 4px;
            border-radius: 40px;
            background: var(--bg);
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
        }
        .topbar .profile-dropdown:hover {
            border-color: var(--lime);
            box-shadow: 0 2px 12px rgba(192, 200, 0, 0.1);
        }
        .topbar .profile-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--lime);
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid var(--lime);
        }
        .topbar .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .topbar .profile-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
            white-space: nowrap;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar .logout-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 6px;
            border-radius: 6px;
            transition: var(--transition);
        }
        .topbar .logout-btn:hover {
            color: var(--pink);
            background: rgba(248, 0, 112, 0.06);
        }

        /* ===== CONTENT ===== */
        .content {
            flex: 1;
            padding: 28px 32px 40px;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }
        .card .card-accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--lime), var(--pink));
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg);
            flex-wrap: wrap;
            gap: 10px;
        }
        .card-header h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header h3 i {
            color: var(--lime);
            font-size: 1.1rem;
        }
        .card-header .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            font-size: 0.8rem;
            white-space: nowrap;
            background: var(--bg);
            color: var(--text);
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-primary {
            background: var(--navy);
            color: #fff;
        }
        .btn-primary:hover {
            background: #14303f;
            box-shadow: 0 4px 16px rgba(10, 31, 46, 0.25);
        }
        .btn-lime {
            background: var(--lime);
            color: var(--navy);
        }
        .btn-lime:hover {
            background: #d4dd00;
            box-shadow: 0 4px 16px var(--lime-glow);
        }
        .btn-pink {
            background: var(--pink);
            color: #fff;
        }
        .btn-pink:hover {
            background: #e00066;
            box-shadow: 0 4px 16px var(--pink-glow);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--navy);
            color: var(--navy);
            background: rgba(10, 31, 46, 0.02);
        }
        .btn-sm {
            padding: 5px 14px;
            font-size: 0.7rem;
            border-radius: 20px;
        }
        .btn-danger {
            background: #dc3545;
            color: #fff;
        }
        .btn-danger:hover {
            background: #c82333;
            box-shadow: 0 4px 16px rgba(220, 53, 69, 0.3);
        }

        /* ===== TABLE ===== */
        .table-responsive {
            overflow-x: auto;
            margin-top: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        thead {
            background: var(--bg);
            border-radius: var(--radius-sm);
        }
        thead th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        tbody td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tbody tr:hover {
            background: rgba(192, 200, 0, 0.03);
        }
        tbody tr:last-child td {
            border-bottom: none;
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }
        .action-btns .btn {
            padding: 4px 10px;
            font-size: 0.7rem;
            border-radius: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--border);
            margin-bottom: 12px;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 31, 46, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px 36px;
            box-shadow: 0 24px 80px rgba(10, 31, 46, 0.3);
            animation: slideUp 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg);
        }
        .modal-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-header h2 i {
            color: var(--lime);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: var(--transition);
        }
        .modal-close:hover {
            background: var(--bg);
            color: var(--text);
        }

        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--navy);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: block;
            margin-bottom: 4px;
        }
        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.85rem;
            background: var(--bg);
            transition: var(--transition);
            outline: none;
            color: var(--text);
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus {
            border-color: var(--navy);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(10, 31, 46, 0.04);
        }
        .modal .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* ===== DELETE MODAL ===== */
        .modal-delete .modal {
            max-width: 440px;
            text-align: center;
        }
        .modal-delete .modal .delete-icon {
            font-size: 3rem;
            color: var(--pink);
            margin-bottom: 12px;
        }
        .modal-delete .modal p {
            color: var(--text-secondary);
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .modal-delete .modal .delete-name {
            font-weight: 700;
            color: var(--navy);
        }

        /* ===== LOADING ===== */
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }
        .loading-state .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid var(--border);
            border-top-color: var(--lime);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .topbar {
                padding: 0 16px;
                gap: 10px;
            }
            .topbar .search-bar {
                display: none;
            }
            .topbar .profile-name {
                display: none;
            }
            .content {
                padding: 16px;
            }
            .card {
                padding: 16px 18px;
            }
            .modal {
                padding: 24px 18px;
            }
            .table-responsive {
                font-size: 0.75rem;
            }
            thead th,
            tbody td {
                padding: 8px 10px;
            }
            .action-btns .btn {
                padding: 3px 8px;
                font-size: 0.6rem;
            }
        }

        @media (max-width: 400px) {
            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== MAIN WRAPPER ===== -->
    <div class="main-wrapper">

        <!-- ===== TOPBAR ===== -->
        <div class="topbar">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search organizers by name, email, company..." />
            </div>

            <div class="topbar-right">
                <div class="notifications" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="badge" id="notif-badge" style="display:none;">0</span>
                </div>
                <div class="profile-dropdown">
                    <div class="profile-avatar" id="topbar-avatar">
                        <span>AD</span>
                    </div>
                    <span class="profile-name" id="topbar-name">Admin</span>
                    <button class="logout-btn" id="logout-btn" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ===== CONTENT ===== -->
        <div class="content">

            <!-- ===== ORGANIZERS SECTION ===== -->
            <div class="card" id="organizers-section">
                <div class="card-accent"></div>
                <div class="card-header">
                    <h3><i class="fas fa-users"></i> All Organizers</h3>
                    <div class="card-actions">
                        <button class="btn btn-outline btn-sm" onclick="refreshOrganizers()">
                            <i class="fas fa-sync"></i> Refresh
                        </button>
                        <span id="organizer-count" style="font-size:0.8rem; color:var(--muted); font-weight:500;"></span>
                    </div>
                </div>

                <div id="organizers-table-container">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading organizers...</p>
                    </div>
                </div>
            </div>

        </div><!-- /content -->
    </div><!-- /main-wrapper -->

    <!-- ===== EDIT MODAL ===== -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> Edit Organizer</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div id="editForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="edit-name" placeholder="Full name" />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="edit-email" placeholder="Email" />
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="edit-phone" placeholder="Phone number" />
                </div>
                <div class="form-group">
                    <label>Company / Organization</label>
                    <input type="text" id="edit-company" placeholder="Company" />
                </div>
                <div class="form-group">
                    <label>Country</label>
                    <select id="edit-country">
                        <option value="">Select country</option>
                    </select>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" id="saveEditBtn" onclick="saveEditOrganizer()">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- ===== DELETE CONFIRM MODAL ===== -->
    <div class="modal-overlay modal-delete" id="deleteModal">
        <div class="modal">
            <div class="delete-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h2 style="font-size:1.2rem; font-weight:700; color:var(--navy); margin-bottom:6px;">Delete Organizer</h2>
            <p>Are you sure you want to delete <span class="delete-name" id="deleteOrganizerName"></span>?</p>
            <p style="font-size:0.85rem; color:var(--muted);">This will remove their profile data from the system. Their authentication account will remain but will have no profile.</p>
            <div style="display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
                <button class="btn btn-outline" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDeleteOrganizer()">
                    <i class="fas fa-trash"></i> Delete Permanently
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!--  FIREBASE – ADMIN CHECK & ORGANIZERS QUERY (FIXED)            -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        //  FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        //  STATE
        // ============================================================
        let allOrganizers = [];
        let filteredOrganizers = [];
        let editingOrganizerId = null;
        let deletingOrganizerId = null;
        let isAdmin = false;

        // ============================================================
        //  AUTH – CHECK AGAINST `admins` COLLECTION
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'admin-login.html';
                return;
            }

            try {
                const adminDoc = await db.collection('admins').doc(user.uid).get();

                if (!adminDoc.exists) {
                    document.getElementById('organizers-table-container').innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-lock" style="color:var(--pink);"></i>
                            <h3 style="color:var(--navy);">Access Denied</h3>
                            <p>You do not have administrator privileges.</p>
                            <button class="btn btn-primary" onclick="auth.signOut()" style="margin-top:12px;">Sign Out</button>
                        </div>
                    `;
                    return;
                }

                isAdmin = true;
                const adminData = adminDoc.data();
                document.getElementById('topbar-name').textContent = adminData.name || user.email.split('@')[0] || 'Admin';
                document.getElementById('topbar-avatar').innerHTML = '<span>AD</span>';
                loadOrganizers();

            } catch (error) {
                console.error('Admin check error:', error);
                document.getElementById('organizers-table-container').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color:var(--pink);"></i>
                        <h3 style="color:var(--navy);">Authentication Error</h3>
                        <p>${error.message}</p>
                        <button class="btn btn-primary" onclick="auth.signOut()" style="margin-top:12px;">Sign Out</button>
                    </div>
                `;
            }
        });

        // ============================================================
        //  LOAD ORGANIZERS – FIXED: NO orderBy() TO AVOID COMPOSITE INDEX
        // ============================================================
        function loadOrganizers() {
            const container = document.getElementById('organizers-table-container');
            container.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading organizers...</p>
                </div>
            `;

            // Query only by role – no orderBy to avoid needing a composite index
            db.collection('users')
                .where('role', '==', 'organizer')
                .onSnapshot((snapshot) => {
                    allOrganizers = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        allOrganizers.push({ id: doc.id, ...data });
                    });

                    // Sort client-side by createdAt (newest first)
                    allOrganizers.sort((a, b) => {
                        const aTime = a.createdAt && a.createdAt.toDate ? a.createdAt.toDate().getTime() : 0;
                        const bTime = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate().getTime() : 0;
                        return bTime - aTime;
                    });

                    applyFilters();
                }, (error) => {
                    console.error('Error loading organizers:', error);
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle" style="color:var(--pink);"></i>
                            <h3 style="color:var(--navy);">Failed to load organizers</h3>
                            <p>${error.message}</p>
                            <button class="btn btn-primary" onclick="loadOrganizers()" style="margin-top:12px;">Retry</button>
                        </div>
                    `;
                });
        }

        function refreshOrganizers() {
            loadOrganizers();
        }

        // ============================================================
        //  FILTER & SEARCH
        // ============================================================
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            filteredOrganizers = allOrganizers.filter(o => {
                if (!searchTerm) return true;
                const searchable = `${o.name || ''} ${o.email || ''} ${o.company || ''} ${o.phone || ''} ${o.country || ''}`
                    .toLowerCase();
                return searchable.includes(searchTerm);
            });
            renderOrganizersTable(filteredOrganizers);
            document.getElementById('organizer-count').textContent = `${filteredOrganizers.length} organizers`;
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);

        // ============================================================
        //  RENDER TABLE
        // ============================================================
        function renderOrganizersTable(organizers) {
            const container = document.getElementById('organizers-table-container');
            if (organizers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-users-slash"></i>
                        <h3 style="color:var(--navy);">No organizers found</h3>
                        <p>${allOrganizers.length === 0 ? 'No organizers have registered yet.' : 'Try adjusting your search filters.'}</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Company</th>
                                <th>Country</th>
                                <th>Joined</th>
                                <th style="text-align:center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            organizers.forEach(o => {
                const joined = o.createdAt && o.createdAt.toDate ? new Date(o.createdAt.toDate()).toLocaleDateString() :
                    '—';
                html += `
                    <tr>
                        <td><strong>${o.name || '—'}</strong></td>
                        <td>${o.email || '—'}</td>
                        <td>${o.phone || '—'}</td>
                        <td>${o.company || '—'}</td>
                        <td>${o.country || '—'}</td>
                        <td>${joined}</td>
                        <td>
                            <div class="action-btns" style="justify-content:center;">
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${o.id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="openDeleteModal('${o.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;
            container.innerHTML = html;
        }

        // ============================================================
        //  COUNTRY LIST
        // ============================================================
        const countriesList = [
            "Afghanistan", "Albania", "Algeria", "Andorra", "Angola", "Antigua and Barbuda", "Argentina", "Armenia",
            "Australia", "Austria", "Azerbaijan", "Bahamas", "Bahrain", "Bangladesh", "Barbados", "Belarus", "Belgium",
            "Belize", "Benin", "Bhutan", "Bolivia", "Bosnia and Herzegovina", "Botswana", "Brazil", "Brunei", "Bulgaria",
            "Burkina Faso", "Burundi", "Cabo Verde", "Cambodia", "Cameroon", "Canada", "Central African Republic", "Chad",
            "Chile", "China", "Colombia", "Comoros", "Congo", "Costa Rica", "Croatia", "Cuba", "Cyprus", "Czech Republic",
            "Democratic Republic of the Congo", "Denmark", "Djibouti", "Dominica", "Dominican Republic", "Ecuador", "Egypt",
            "El Salvador", "Equatorial Guinea", "Eritrea", "Estonia", "Eswatini", "Ethiopia", "Fiji", "Finland", "France",
            "Gabon", "Gambia", "Georgia", "Germany", "Ghana", "Greece", "Grenada", "Guatemala", "Guinea", "Guinea-Bissau",
            "Guyana", "Haiti", "Honduras", "Hungary", "Iceland", "India", "Indonesia", "Iran", "Iraq", "Ireland", "Israel",
            "Italy", "Ivory Coast", "Jamaica", "Japan", "Jordan", "Kazakhstan", "Kenya", "Kiribati", "Kosovo", "Kuwait",
            "Kyrgyzstan", "Laos", "Latvia", "Lebanon", "Lesotho", "Liberia", "Libya", "Liechtenstein", "Lithuania",
            "Luxembourg", "Madagascar", "Malawi", "Malaysia", "Maldives", "Mali", "Malta", "Marshall Islands", "Mauritania",
            "Mauritius", "Mexico", "Micronesia", "Moldova", "Monaco", "Mongolia", "Montenegro", "Morocco", "Mozambique",
            "Myanmar", "Namibia", "Nauru", "Nepal", "Netherlands", "New Zealand", "Nicaragua", "Niger", "Nigeria",
            "North Korea", "North Macedonia", "Norway", "Oman", "Pakistan", "Palau", "Palestine", "Panama",
            "Papua New Guinea", "Paraguay", "Peru", "Philippines", "Poland", "Portugal", "Qatar", "Romania", "Russia",
            "Rwanda", "Saint Kitts and Nevis", "Saint Lucia", "Saint Vincent and the Grenadines", "Samoa", "San Marino",
            "Sao Tome and Principe", "Saudi Arabia", "Senegal", "Serbia", "Seychelles", "Sierra Leone", "Singapore",
            "Slovakia", "Slovenia", "Solomon Islands", "Somalia", "South Africa", "South Korea", "South Sudan", "Spain",
            "Sri Lanka", "Sudan", "Suriname", "Sweden", "Switzerland", "Syria", "Taiwan", "Tajikistan", "Tanzania",
            "Thailand", "Timor-Leste", "Togo", "Tonga", "Trinidad and Tobago", "Tunisia", "Turkey", "Turkmenistan",
            "Tuvalu", "Uganda", "Ukraine", "United Arab Emirates", "United Kingdom", "United States", "Uruguay",
            "Uzbekistan", "Vanuatu", "Vatican City", "Venezuela", "Vietnam", "Yemen", "Zambia", "Zimbabwe"
        ];

        function populateCountrySelect(selectElement, selectedValue) {
            selectElement.innerHTML = '<option value="">Select country</option>';
            countriesList.forEach(country => {
                const opt = document.createElement('option');
                opt.value = country;
                opt.textContent = country;
                if (country === selectedValue) opt.selected = true;
                selectElement.appendChild(opt);
            });
        }

        // ============================================================
        //  EDIT MODAL
        // ============================================================
        function openEditModal(organizerId) {
            const organizer = allOrganizers.find(o => o.id === organizerId);
            if (!organizer) return;

            editingOrganizerId = organizerId;
            document.getElementById('edit-name').value = organizer.name || '';
            document.getElementById('edit-email').value = organizer.email || '';
            document.getElementById('edit-phone').value = organizer.phone || '';
            document.getElementById('edit-company').value = organizer.company || '';

            const countrySelect = document.getElementById('edit-country');
            populateCountrySelect(countrySelect, organizer.country || '');

            document.getElementById('editModal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('open');
            document.body.style.overflow = '';
            editingOrganizerId = null;
        }

        async function saveEditOrganizer() {
            if (!editingOrganizerId) return;

            const btn = document.getElementById('saveEditBtn');
            btn.innerHTML = '<span style="display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite;"></span> Saving...';
            btn.disabled = true;

            try {
                const updates = {
                    name: document.getElementById('edit-name').value.trim(),
                    email: document.getElementById('edit-email').value.trim(),
                    phone: document.getElementById('edit-phone').value.trim(),
                    company: document.getElementById('edit-company').value.trim(),
                    country: document.getElementById('edit-country').value,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                await db.collection('users').doc(editingOrganizerId).update(updates);

                const organizer = allOrganizers.find(o => o.id === editingOrganizerId);
                if (organizer) {
                    Object.assign(organizer, updates);
                }

                closeEditModal();
                applyFilters();

                btn.innerHTML = '<i class="fas fa-check"></i> Saved!';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
                    btn.disabled = false;
                }, 1500);

            } catch (error) {
                console.error('Error updating organizer:', error);
                alert('Failed to update organizer: ' + error.message);
                btn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
                btn.disabled = false;
            }
        }

        // ============================================================
        //  DELETE MODAL
        // ============================================================
        function openDeleteModal(organizerId) {
            const organizer = allOrganizers.find(o => o.id === organizerId);
            if (!organizer) return;
            deletingOrganizerId = organizerId;
            document.getElementById('deleteOrganizerName').textContent = organizer.name || 'Unnamed Organizer';
            document.getElementById('deleteModal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('open');
            document.body.style.overflow = '';
            deletingOrganizerId = null;
        }

        async function confirmDeleteOrganizer() {
            if (!deletingOrganizerId) return;

            const btn = document.getElementById('confirmDeleteBtn');
            btn.innerHTML = '<span style="display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite;"></span> Deleting...';
            btn.disabled = true;

            try {
                await db.collection('users').doc(deletingOrganizerId).delete();
                allOrganizers = allOrganizers.filter(o => o.id !== deletingOrganizerId);
                closeDeleteModal();
                applyFilters();

                btn.innerHTML = '<i class="fas fa-trash"></i> Delete Permanently';
                btn.disabled = false;

            } catch (error) {
                console.error('Error deleting organizer:', error);
                alert('Failed to delete organizer: ' + error.message);
                btn.innerHTML = '<i class="fas fa-trash"></i> Delete Permanently';
                btn.disabled = false;
            }
        }

        // ============================================================
        //  NAVIGATION & LOGOUT
        // ============================================================
        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = 'admin-login.html');
        });

        // Close modals on overlay click
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeEditModal();
        });
        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeDeleteModal();
        });

        // ESC to close
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeEditModal();
                closeDeleteModal();
            }
        });

        // ============================================================
        //  EXPOSE GLOBALS
        // ============================================================
        window.openEditModal = openEditModal;
        window.closeEditModal = closeEditModal;
        window.saveEditOrganizer = saveEditOrganizer;
        window.openDeleteModal = openDeleteModal;
        window.closeDeleteModal = closeDeleteModal;
        window.confirmDeleteOrganizer = confirmDeleteOrganizer;
        window.refreshOrganizers = refreshOrganizers;
        window.loadOrganizers = loadOrganizers;
        window.applyFilters = applyFilters;

        // ============================================================
        //  INITIALIZE COUNTRY SELECT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            populateCountrySelect(document.getElementById('edit-country'));
        });
    </script>

</body>
