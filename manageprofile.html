<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<title>Profile Hub · Zone21</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0A1E2C;--navy-800:#102838;--lime:#C0C800;--lime-deep:#8A9000;--lime-soft:rgba(192,200,0,.10);
  --gold:#C9A961;--gold-deep:#9C7F3F;--pink:#F80070;--green:#0F9D6E;
  --ink:#0F172A;--body:#475569;--muted:#7A8899;
  --line:#E6EAF0;--line-strong:#D3DAE3;--canvas:#F6F7F9;
  --radius:20px;--shadow-md:0 12px 40px rgba(10,30,44,.08);--shadow-lg:0 24px 60px rgba(10,30,44,.15);
  --t:.3s cubic-bezier(0.22, 1, 0.36, 1);
}
body{background:var(--canvas);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:30px 20px 60px;line-height:1.55;-webkit-font-smoothing:antialiased}
.container{max-width:1000px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;flex-wrap:wrap;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand .mark{width:44px;height:44px;background:var(--lime);color:var(--navy);border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1rem;box-shadow:0 8px 20px rgba(192,200,0,.3)}
.brand h1{font-family:'Fraunces',serif;font-size:1.5rem;color:var(--navy);font-weight:700;letter-spacing:-.02em}
.brand h1 span{color:var(--lime-deep);font-style:italic}
.nav-actions{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:10px;font-weight:700;font-size:.85rem;text-decoration:none;transition:var(--t);cursor:pointer;border:1px solid transparent;font-family:inherit}
.btn-outline{background:#fff;border-color:var(--line-strong);color:var(--navy)}
.btn-outline:hover{background:var(--canvas);border-color:var(--navy);transform:translateY(-1px)}
.btn-lime{background:var(--lime);color:var(--navy)}
.btn-lime:hover{background:#D4DC00;transform:translateY(-1px);box-shadow:0 8px 24px rgba(192,200,0,.3)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-800);transform:translateY(-1px)}

/* ONBOARDING HERO */
.onboard-hero{text-align:center;margin-bottom:40px}
.onboard-hero h2{font-family:'Fraunces',serif;font-size:2.2rem;color:var(--navy);margin-bottom:12px;letter-spacing:-.03em}
.onboard-hero p{font-size:.95rem;color:var(--body);max-width:600px;margin:0 auto;font-weight:500}

/* SELECTION CARDS */
.selection-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:40px}
@media(max-width:768px){.selection-grid{grid-template-columns:1fr}}
.sel-card{background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:36px 30px;text-align:center;transition:var(--t);cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
.sel-card:hover{border-color:var(--lime);transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.sel-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--line);transition:var(--t)}
.sel-card.venue:hover::before{background:var(--pink)}
.sel-card.vendor:hover::before{background:var(--lime)}
.sel-icon{width:80px;height:80px;border-radius:24px;display:grid;place-items:center;font-size:2rem;margin:0 auto 24px;transition:var(--t)}
.sel-card.venue .sel-icon{background:rgba(248,0,112,.1);color:var(--pink)}
.sel-card.vendor .sel-icon{background:rgba(192,200,0,.15);color:var(--lime-deep)}
.sel-card:hover .sel-icon{transform:scale(1.1) rotate(5deg)}
.sel-card h3{font-size:1.3rem;font-weight:800;color:var(--navy);margin-bottom:8px}
.sel-card p{font-size:.85rem;color:var(--muted);line-height:1.6;margin-bottom:24px;font-weight:500}
.sel-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;font-weight:800;font-size:.9rem;transition:var(--t)}
.sel-card.venue .sel-btn{background:var(--pink);color:#fff}
.sel-card.venue:hover .sel-btn{background:#CC005C;box-shadow:0 8px 24px rgba(248,0,112,.3)}
.sel-card.vendor .sel-btn{background:var(--lime);color:var(--navy)}
.sel-card.vendor:hover .sel-btn{background:#D4DC00;box-shadow:0 8px 24px rgba(192,200,0,.3)}

/* PROFILE MANAGER */
.manager-grid{display:grid;grid-template-columns:1fr;gap:20px}
.prof-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:flex;align-items:center;gap:24px;box-shadow:var(--shadow-md);transition:var(--t);position:relative;overflow:hidden}
.prof-card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.prof-card.venue{border-left:4px solid var(--pink)}
.prof-card.vendor{border-left:4px solid var(--lime)}
@media(max-width:640px){.prof-card{flex-direction:column;align-items:flex-start;text-align:center;gap:16px}.prof-card .prof-actions{width:100%;margin-left:0!important}}
.prof-avatar{width:80px;height:80px;border-radius:20px;background:var(--canvas);display:grid;place-items:center;font-size:1.8rem;color:var(--navy);flex-shrink:0;overflow:hidden}
.prof-avatar img{width:100%;height:100%;object-fit:cover}
.prof-card.venue .prof-avatar{color:var(--pink)}
.prof-card.vendor .prof-avatar{color:var(--lime-deep)}
.prof-info{flex:1}
.prof-info h3{font-size:1.15rem;font-weight:800;color:var(--navy);margin-bottom:4px}
.prof-info p{font-size:.8rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prof-status{font-size:.65rem;font-weight:800;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:var(--canvas);color:var(--muted);letter-spacing:.05em}
.prof-status.live{background:var(--green-soft);color:var(--green)}
.prof-actions{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}

/* NOTICE */
.central-notice{background:linear-gradient(135deg,var(--navy),var(--navy-800));color:#fff;border-radius:var(--radius);padding:24px 30px;display:flex;gap:20px;align-items:center;margin-top:30px;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.central-notice::before{content:'';position:absolute;top:-50%;right:-5%;width:300px;height:300px;background:radial-gradient(circle,rgba(192,200,0,.2),transparent 65%);border-radius:50%;pointer-events:none}
.central-notice .cn-icon{width:56px;height:56px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;display:grid;place-items:center;font-size:1.5rem;color:var(--lime);flex-shrink:0;position:relative;z-index:1}
.central-notice .cn-text{position:relative;z-index:1}
.central-notice h4{font-size:1.05rem;font-weight:800;margin-bottom:4px}
.central-notice p{font-size:.85rem;color:rgba(255,255,255,.75);font-weight:500;line-height:1.5}

.loading{text-align:center;padding:60px;color:var(--muted);font-weight:600}
.loading i{font-size:2rem;color:var(--lime);animation:spin 1s linear infinite;display:block;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{padding:14px 20px;border-radius:10px;background:var(--navy);color:#fff;font-size:.85rem;font-weight:700;box-shadow:var(--shadow-lg);animation:slideIn .3s;display:flex;align-items:center;gap:10px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>

<div id="toast"></div>

<div class="container">
  <div class="header">
    <a href="vendordashboard.html" class="brand">
      <div class="mark">Z21</div>
      <h1>Zone<span>21</span></h1>
    </a>
    <div class="nav-actions">
      <a href="vendordashboard.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>
  </div>

  <div id="mainContent">
    <div class="loading"><i class="fas fa-circle-notch"></i>Loading your workspace...</div>
  </div>

  <!-- Centralized Communication Notice -->
  <div class="central-notice" id="centralNotice" style="display:none;">
    <div class="cn-icon"><i class="fas fa-shield-halved"></i></div>
    <div class="cn-text">
      <h4>Zone21 Handles Your Bookings & Communication</h4>
      <p>We do not require or display your email, phone number, or social links. All enquiries, messages, and vendor payments are managed securely through the Zone21 platform.</p>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
  authDomain: "zone21.firebaseapp.com",
  projectId: "zone21",
  storageBucket: "zone21.firebasestorage.app",
  messagingSenderId: "405963057292",
  appId: "1:405963057292:web:80e9923ae84eb7029073a9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let currentUser = null;
let venueProfile = null;
let vendorProfile = null;

const $ = id => document.getElementById(id);

function toast(msg, type='info') {
  const c = $('toast');
  const t = document.createElement('div');
  t.className = 'toast';
  if(type === 'error') t.style.borderLeft = '4px solid var(--pink)';
  else if(type === 'success') t.style.borderLeft = '4px solid var(--green)';
  else t.style.borderLeft = '4px solid var(--lime)';
  t.innerHTML = `<i class="fas ${type==='success'?'fa-check-circle':'fa-info-circle'}"></i> <span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

auth.onAuthStateChanged(async user => {
  if(!user) { window.location.href = 'index.html'; return; }
  currentUser = user;
  await checkProfiles();
});

async function checkProfiles() {
  const content = $('mainContent');
  try {
    const vDoc = await db.collection('venues').doc(currentUser.uid).get();
    const sDoc = await db.collection('serviceProviders').doc(currentUser.uid).get();
    
    venueProfile = vDoc.exists ? { id: vDoc.id, ...vDoc.data() } : null;
    vendorProfile = sDoc.exists ? { id: sDoc.id, ...sDoc.data() } : null;

    $('centralNotice').style.display = 'flex';

    if(!venueProfile && !vendorProfile) {
      renderOnboarding();
    } else {
      renderManager();
    }
  } catch (error) {
    console.error(error);
    content.innerHTML = `<div class="loading" style="color:var(--pink)">Error loading profiles. Please refresh.</div>`;
  }
}

function renderOnboarding() {
  const content = $('mainContent');
  content.innerHTML = `
    <div class="onboard-hero">
      <h2>Welcome to Zone21</h2>
      <p>To start accepting bookings and selling tickets, you need to create a profile. Which type of business do you operate?</p>
    </div>
    
    <div class="selection-grid">
      <!-- VENUE CARD -->
      <div class="sel-card venue" onclick="createProfile('venue')">
        <div class="sel-icon"><i class="fas fa-building"></i></div>
        <h3>List a Venue</h3>
        <p>For event spaces, halls, gardens, conference centers, or outdoor grounds.</p>
        <button class="sel-btn" id="btnVenue"><i class="fas fa-plus-circle"></i> Create Venue Profile</button>
      </div>

      <!-- VENDOR CARD -->
      <div class="sel-card vendor" onclick="createProfile('vendor')">
        <div class="sel-icon"><i class="fas fa-briefcase"></i></div>
        <h3>List a Service</h3>
        <p>For photographers, caterers, DJs, decorators, planners, and other event services.</p>
        <button class="sel-btn" id="btnVendor"><i class="fas fa-plus-circle"></i> Create Service Profile</button>
      </div>
    </div>
  `;
}

window.createProfile = async function(type) {
  const btn = type === 'venue' ? $('btnVenue') : $('btnVendor');
  const orig = btn.innerHTML;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Creating...';
  btn.disabled = true;
  document.querySelectorAll('.sel-card').forEach(c => c.style.pointerEvents = 'none');

  try {
    if(type === 'venue') {
      await db.collection('venues').doc(currentUser.uid).set({
        name: currentUser.email.split('@')[0] || 'My Venue',
        category: 'Venue / Space Rental',
        services: ['Venue / Space Rental'],
        location: '', country: null, basePrice: 0, currency: 'USD',
        priceTiers: [], capacity: 0, venueType: 'Indoor', amenities: [],
        description: '', images: [], avatar: null,
        rating: 0, reviewsCount: 0, status: 'draft',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast('Venue profile created! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'venueprofile.html', 1000);
    } else {
      await db.collection('serviceProviders').doc(currentUser.uid).set({
        name: currentUser.email.split('@')[0] || 'My Business',
        category: '', services: [], secondaryServices: '',
        location: '', country: null, basePrice: 0, currency: 'USD',
        priceTiers: [], businessHours: '', yearsExperience: 0,
        serviceAreas: '', languages: '', paymentMethods: '', cancellationPolicy: '',
        description: '', images: [], avatar: null,
        rating: 0, reviewsCount: 0, status: 'draft',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast('Service profile created! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'vendorprofile.html', 1000);
    }
  } catch (e) {
    console.error(e);
    toast('Failed to create profile.', 'error');
    btn.innerHTML = orig;
    btn.disabled = false;
    document.querySelectorAll('.sel-card').forEach(c => c.style.pointerEvents = 'auto');
  }
}

function renderManager() {
  const content = $('mainContent');
  let html = `
    <div class="onboard-hero" style="margin-bottom:30px">
      <h2>My Profiles</h2>
      <p>Manage your public listings, set your prices, and upload photos.</p>
    </div>
    <div class="manager-grid">
  `;

  if(venueProfile) {
    const isLive = venueProfile.status === 'active' || venueProfile.status === 'approved';
    html += `
      <div class="prof-card venue">
        <div class="prof-avatar">
          ${venueProfile.avatar ? `<img src="${venueProfile.avatar}">` : '<i class="fas fa-building"></i>'}
        </div>
        <div class="prof-info">
          <h3>${venueProfile.name || 'Unnamed Venue'}</h3>
          <p>
            <i class="fas fa-map-marker-alt"></i> ${venueProfile.location || 'Location missing'}
            <span class="prof-status ${isLive ? 'live' : ''}">${isLive ? 'Live' : 'Draft'}</span>
          </p>
        </div>
        <div class="prof-actions">
          <a href="venueprofile.html" class="btn btn-outline"><i class="fas fa-pen"></i> Edit Profile</a>
          <a href="venueprofile.html?id=${venueProfile.id}" class="btn btn-navy" target="_blank"><i class="fas fa-eye"></i> View Public</a>
        </div>
      </div>
    `;
  }

  if(vendorProfile) {
    const isLive = vendorProfile.status === 'active' || vendorProfile.status === 'approved';
    html += `
      <div class="prof-card vendor">
        <div class="prof-avatar">
          ${vendorProfile.avatar ? `<img src="${vendorProfile.avatar}">` : '<i class="fas fa-briefcase"></i>'}
        </div>
        <div class="prof-info">
          <h3>${vendorProfile.name || 'Unnamed Business'}</h3>
          <p>
            <i class="fas fa-map-marker-alt"></i> ${vendorProfile.location || 'Location missing'}
            <span class="prof-status ${isLive ? 'live' : ''}">${isLive ? 'Live' : 'Draft'}</span>
          </p>
        </div>
        <div class="prof-actions">
          <a href="vendorprofile.html" class="btn btn-outline"><i class="fas fa-pen"></i> Edit Profile</a>
          <a href="vendorprofile.html?id=${vendorProfile.id}" class="btn btn-navy" target="_blank"><i class="fas fa-eye"></i> View Public</a>
        </div>
      </div>
    `;
  }

  // Option to add the other type if they only have one
  if(!venueProfile || !vendorProfile) {
    html += `
      <div style="text-align:center;margin-top:20px;padding:20px;border:2px dashed var(--line-strong);border-radius:20px;background:var(--canvas)">
        <p style="font-size:.85rem;color:var(--muted);margin-bottom:12px;font-weight:600">Do you also operate on the other side?</p>
        ${!venueProfile ? `<button onclick="createProfile('venue')" class="btn btn-outline" style="margin:4px"><i class="fas fa-plus"></i> Add Venue Profile</button>` : ''}
        ${!vendorProfile ? `<button onclick="createProfile('vendor')" class="btn btn-outline" style="margin:4px"><i class="fas fa-plus"></i> Add Service Profile</button>` : ''}
      </div>
    `;
  }

  html += `</div>`;
  content.innerHTML = html;
}
</script>
</body>
</html>
