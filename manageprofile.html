<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile · Zone21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --navy: #0a1f2e;
            --lime: #C0C800;
            --pink: #F80070;
            --bg: #f0f2f6;
            --card: #ffffff;
            --text: #0f1a24;
            --text-secondary: #3d4f5e;
            --muted: #7a8a9a;
            --border: #e6eaf0;
            --radius: 18px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(10,31,46,0.07);
            --shadow-hover: 0 16px 48px rgba(10,31,46,0.12);
            --transition: 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
            --success: #10B981;
            --danger: #DC2626;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items:center;
            justify-content:center;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 700px;
            width:100%;
            margin:0 auto;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem 2.5rem;
            border: 1px solid var(--border);
            transition: var(--transition);
            position:relative;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--bg);
        }
        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .card-header h1 i {
            color: var(--lime);
        }
        .card-header .back-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
        }
        .card-header .back-btn:hover {
            color: var(--navy);
        }
        .card-header .back-btn i {
            margin-right: 4px;
        }

        /* Plan Cards */
        .plan-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .plan-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            transition: var(--transition);
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .plan-item:hover {
            border-color: var(--lime);
        }
        .plan-item .plan-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .plan-item .plan-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--navy);
        }
        .plan-item .plan-name i {
            color: var(--lime);
            margin-right: 8px;
        }
        .plan-item .plan-status {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.15rem 0.8rem;
            border-radius: 20px;
            display: inline-block;
            width: fit-content;
        }
        .plan-status.active {
            background: var(--success);
            color: #fff;
        }
        .plan-status.pending {
            background: #ffc107;
            color: #856404;
        }
        .plan-status.rejected {
            background: var(--danger);
            color: #fff;
        }
        .plan-status.none {
            background: var(--border);
            color: var(--muted);
        }
        .plan-item .plan-actions {
            display: flex;
            gap: 0.5rem;
            align-items:center;
            flex-wrap: wrap;
        }
        .plan-item .plan-meta {
            font-size: 0.8rem;
            color: var(--muted);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            background: var(--bg);
            color: var(--text);
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-lime {
            background: var(--lime);
            color: var(--navy);
        }
        .btn-lime:hover {
            background: #d4dd00;
            box-shadow: 0 4px 16px rgba(192,200,0,0.25);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--navy);
            color: var(--navy);
        }
        .btn-sm {
            padding: 0.3rem 0.9rem;
            font-size: 0.7rem;
        }
        .btn:disabled {
            opacity:0.6;
            cursor:not-allowed;
            transform:none;
        }
        .btn-success {
            background: var(--success);
            color:#fff;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-pink {
            background: var(--pink);
            color:#fff;
        }
        .btn-pink:hover {
            background: #d00060;
        }

        /* Empty state */
        .empty-state {
            text-align:center;
            padding:2rem 0;
            color:var(--muted);
        }
        .empty-state i {
            font-size:3rem;
            color:var(--border);
            margin-bottom:1rem;
        }
        .empty-state h3 {
            color:var(--text-secondary);
            margin-bottom:0.3rem;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top:20px;
            right:20px;
            z-index:9999;
            display:flex;
            flex-direction:column;
            gap:8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius:8px;
            font-weight:600;
            font-size:0.85rem;
            color:#fff;
            box-shadow:0 4px 16px rgba(0,0,0,0.15);
            animation:slideInRight 0.3s ease;
            max-width:400px;
        }
        .toast.error { background:var(--pink); }
        .toast.success { background:var(--success); }
        .toast.info { background:var(--navy); }
        @keyframes slideInRight {
            from { transform:translateX(100%); opacity:0; }
            to { transform:translateX(0); opacity:1; }
        }

        .loading-overlay {
            position:absolute;
            inset:0;
            background:rgba(255,255,255,0.7);
            backdrop-filter:blur(3px);
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:var(--radius);
            z-index:10;
        }
        .loading-overlay i {
            font-size:2.5rem;
            color:var(--lime);
        }
        .hidden { display:none !important; }

        @media (max-width:600px) {
            .card { padding:1.2rem; }
            .plan-item {
                flex-direction:column;
                align-items:flex-start;
            }
            .plan-item .plan-actions {
                width:100%;
                justify-content:flex-start;
            }
            .card-header {
                flex-direction:column;
                align-items:flex-start;
                gap:0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="profileCard">
            <div class="loading-overlay" id="loadingOverlay">
                <i class="fas fa-spinner fa-spin"></i>
            </div>

            <div class="card-header">
                <h1><i class="fas fa-id-card"></i> My Plans</h1>
                <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Dashboard</button>
            </div>

            <div id="planListContainer">
                <!-- Rendered by JavaScript -->
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        //  FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        //  STATE
        // ============================================================
        let currentUser = null;
        let subscriptions = [];

        // ============================================================
        //  AUTH
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadSubscriptions();
            } else {
                window.location.href = 'index.html';
            }
        });

        // ============================================================
        //  LOAD SUBSCRIPTIONS
        // ============================================================
        async function loadSubscriptions() {
            const container = document.getElementById('planListContainer');
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');

            try {
                const snapshot = await db.collection('subscriptions')
                    .where('userId', '==', currentUser.uid)
                    .get();

                subscriptions = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Determine plan ID from planId or derive from planName
                    let planId = data.planId;
                    if (!planId && data.planName) {
                        planId = data.planName.toLowerCase().replace(/\s/g, '');
                    }
                    subscriptions.push({
                        id: doc.id,
                        planId: planId || 'unknown',
                        planName: data.planName || 'Unknown Plan',
                        status: data.status || 'pending',
                        months: data.months || 1,
                        total: data.total || 0,
                        invoiceNumber: data.invoiceNumber || null,
                        createdAt: data.createdAt || null,
                        ...data
                    });
                });

                // Sort: active first, then pending, then rejected
                const statusOrder = { 'active': 0, 'approved': 0, 'pending': 1, 'pending_payment': 1, 'rejected': 2 };
                subscriptions.sort((a, b) => {
                    return (statusOrder[a.status] ?? 3) - (statusOrder[b.status] ?? 3);
                });

                renderPlans();

            } catch (error) {
                console.error('Error loading subscriptions:', error);
                showToast('Failed to load your subscriptions.', 'error');
            } finally {
                overlay.classList.add('hidden');
            }
        }

        // ============================================================
        //  RENDER PLANS
        // ============================================================
        function renderPlans() {
            const container = document.getElementById('planListContainer');

            if (subscriptions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3>No Active Plans</h3>
                        <p>You haven't subscribed to any plan yet.</p>
                        <button class="btn btn-lime" style="margin-top:1rem;" onclick="goBack()">
                            <i class="fas fa-arrow-left"></i> Go to Dashboard
                        </button>
                    </div>
                `;
                return;
            }

            let html = `<div class="plan-list">`;

            for (const sub of subscriptions) {
                const isActive = sub.status === 'active' || sub.status === 'approved';
                const isPending = sub.status === 'pending' || sub.status === 'pending_payment';
                const isRejected = sub.status === 'rejected';

                let statusLabel = sub.status;
                let statusClass = 'none';
                if (isActive) { statusClass = 'active';
                    statusLabel = 'Active'; } else if (isPending) { statusClass = 'pending';
                    statusLabel = 'Pending Approval'; } else if (isRejected) { statusClass = 'rejected';
                    statusLabel = 'Rejected'; }

                // Determine which profile page to link to
                const planNameLower = sub.planName.toLowerCase();
                const profilePage = planNameLower.includes('venue') ? 'venueprofile.html' : 'vendorprofile.html';

                // Format date if exists
                let dateStr = '';
                if (sub.createdAt && sub.createdAt.toDate) {
                    dateStr = sub.createdAt.toDate().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                } else if (sub.createdAt && typeof sub.createdAt === 'string') {
                    dateStr = new Date(sub.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                }

                // Icon based on plan
                const icon = planNameLower.includes('venue') ? 'fa-building' : 'fa-briefcase';

                html += `
                    <div class="plan-item">
                        <div class="plan-info">
                            <div class="plan-name">
                                <i class="fas ${icon}"></i> ${sub.planName}
                            </div>
                            <div>
                                <span class="plan-status ${statusClass}">${statusLabel}</span>
                                ${dateStr ? `<span class="plan-meta" style="margin-left:0.8rem;"><i class="far fa-calendar-alt"></i> ${dateStr}</span>` : ''}
                                ${sub.months ? `<span class="plan-meta" style="margin-left:0.8rem;"><i class="far fa-clock"></i> ${sub.months} month${sub.months > 1 ? 's' : ''}</span>` : ''}
                                ${sub.total ? `<span class="plan-meta" style="margin-left:0.8rem;"><i class="fas fa-tag"></i> $${sub.total}</span>` : ''}
                            </div>
                        </div>
                        <div class="plan-actions">
                            ${isActive ? `
                                <a href="${profilePage}" class="btn btn-lime btn-sm">
                                    <i class="fas fa-user-cog"></i> Manage Profile
                                </a>
                            ` : ''}
                            ${isPending ? `
                                <button class="btn btn-outline btn-sm" onclick="viewInvoice('${sub.planId || sub.planName}')">
                                    <i class="fas fa-file-invoice"></i> View Invoice
                                </button>
                            ` : ''}
                            ${isRejected ? `
                                <button class="btn btn-pink btn-sm" onclick="goBack()">
                                    <i class="fas fa-rocket"></i> Try Again
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // ============================================================
        //  VIEW INVOICE (for pending plans)
        // ============================================================
        async function viewInvoice(planIdOrName) {
            try {
                // Find the subscription
                let targetSub = null;
                for (const sub of subscriptions) {
                    if (sub.planId === planIdOrName || sub.planName === planIdOrName) {
                        targetSub = sub;
                        break;
                    }
                }
                if (!targetSub || !targetSub.invoiceNumber) {
                    showToast('No invoice found for this plan.', 'error');
                    return;
                }

                const invDoc = await db.collection('invoices').doc(targetSub.invoiceNumber).get();
                if (!invDoc.exists) {
                    showToast('Invoice document not found.', 'error');
                    return;
                }

                // Simple alert with invoice info – you can replace with a modal
                const data = invDoc.data();
                alert(
                    `📄 Invoice: ${data.invoiceNumber}\n` +
                    `Plan: ${data.planName || targetSub.planName}\n` +
                    `Total: $${data.total || targetSub.total || 0}\n` +
                    `Status: ${data.status || 'pending'}\n\n` +
                    `Please make payment to:\n` +
                    `Ecocash: 078 991 2268\n` +
                    `Innbucks: 078 991 2268\n` +
                    `TN CyberTech Bank: 4638 3300 1429 9948`
                );

            } catch (error) {
                console.error('Error viewing invoice:', error);
                showToast('Failed to load invoice.', 'error');
            }
        }
        window.viewInvoice = viewInvoice;

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = '0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        function goBack() {
            window.location.href = 'vendordashboard.html';
        }
        window.goBack = goBack;

        console.log('✅ Profile page loaded.');
    </script>
</body>
</html>
