<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>My Profile · Zone21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ============================================================
                   ROOT & RESET
                   ============================================================ */
        :root {
            --navy: #0a1f2e;
            --navy-light: #1a3a4a;
            --lime: #C0C800;
            --lime-glow: rgba(192, 200, 0, 0.3);
            --pink: #F80070;
            --pink-glow: rgba(248, 0, 112, 0.2);
            --bg: #f0f2f6;
            --card: #ffffff;
            --text: #0f1a24;
            --text-secondary: #3d4f5e;
            --muted: #7a8a9a;
            --border: #e6eaf0;
            --radius: 20px;
            --radius-sm: 12px;
            --shadow: 0 8px 40px rgba(10, 31, 46, 0.06);
            --shadow-hover: 0 20px 60px rgba(10, 31, 46, 0.10);
            --shadow-lg: 0 30px 80px rgba(10, 31, 46, 0.12);
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --success: #10B981;
            --danger: #DC2626;
            --warning: #F59E0B;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(192, 200, 0, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 80%, rgba(248, 0, 112, 0.04) 0%, transparent 60%);
        }

        /* ============================================================
                   MAIN CONTAINER
                   ============================================================ */
        .container {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        /* ============================================================
                   CARD
                   ============================================================ */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }
        .card-accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--lime), var(--pink));
            border-radius: var(--radius) var(--radius) 0 0;
            z-index: 2;
        }

        /* ============================================================
                   LOADING OVERLAY
                   ============================================================ */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            z-index: 20;
            transition: opacity 0.4s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-overlay .spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }
        .loading-overlay .spinner i {
            font-size: 2.8rem;
            color: var(--lime);
            animation: spin 1s linear infinite;
        }
        .loading-overlay .spinner span {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
                   CARD BODY
                   ============================================================ */
        .card-body {
            padding: 2.2rem 2.5rem 2.5rem;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
                   PROFILE HEADER
                   ============================================================ */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--bg);
            flex-wrap: wrap;
        }
        .profile-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--lime);
            flex-shrink: 0;
            overflow: hidden;
            border: 3px solid var(--lime);
            box-shadow: 0 0 0 6px rgba(192, 200, 0, 0.12);
            transition: var(--transition);
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-avatar:hover {
            transform: scale(1.02);
            box-shadow: 0 0 0 8px rgba(192, 200, 0, 0.18);
        }

        .profile-info {
            flex: 1;
            min-width: 150px;
        }
        .profile-info .name {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .profile-info .name .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--muted);
            margin-left: 2px;
        }
        .profile-info .name .status-dot.active {
            background: var(--success);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }
        .profile-info .name .status-dot.pending {
            background: var(--warning);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }
        .profile-info .name .status-dot.rejected {
            background: var(--danger);
            box-shadow: 0 0 12px rgba(220, 38, 38, 0.4);
        }
        .profile-info .email {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 2px;
        }
        .profile-info .badge-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .profile-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.2rem 0.9rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            background: var(--bg);
            color: var(--text-secondary);
        }
        .profile-badge.active {
            background: var(--success);
            color: #fff;
        }
        .profile-badge.pending {
            background: var(--warning);
            color: #fff;
        }
        .profile-badge.rejected {
            background: var(--danger);
            color: #fff;
        }
        .profile-badge i {
            font-size: 0.6rem;
        }
        .profile-badge.lime {
            background: var(--lime);
            color: var(--navy);
        }

        .profile-actions-top {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-left: auto;
        }
        .profile-actions-top .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
        }
        .profile-actions-top .btn-icon:hover {
            border-color: var(--navy);
            color: var(--navy);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .profile-actions-top .btn-icon.danger:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        /* ============================================================
                   QUICK ACTION BUTTONS (MAIN)
                   ============================================================ */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2.2rem;
        }
        .quick-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-sm);
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: var(--navy);
            background: var(--bg);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .quick-action-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(192, 200, 0, 0.06), rgba(248, 0, 112, 0.04));
            opacity: 0;
            transition: var(--transition);
        }
        .quick-action-btn:hover::after {
            opacity: 1;
        }
        .quick-action-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: var(--lime);
        }
        .quick-action-btn i {
            font-size: 1.3rem;
            position: relative;
            z-index: 1;
        }
        .quick-action-btn span {
            position: relative;
            z-index: 1;
        }
        .quick-action-btn .badge-count {
            position: relative;
            z-index: 1;
            background: var(--pink);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            margin-left: 0.2rem;
        }
        .quick-action-btn.primary {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy);
        }
        .quick-action-btn.primary:hover {
            background: #14303f;
            border-color: #14303f;
        }
        .quick-action-btn.primary i {
            color: var(--lime);
        }
        .quick-action-btn.lime {
            background: var(--lime);
            color: var(--navy);
            border-color: var(--lime);
        }
        .quick-action-btn.lime:hover {
            background: #d4dd00;
            border-color: #d4dd00;
        }
        .quick-action-btn.lime i {
            color: var(--navy);
        }
        .quick-action-btn.pink {
            background: var(--pink);
            color: #fff;
            border-color: var(--pink);
        }
        .quick-action-btn.pink:hover {
            background: #e00066;
            border-color: #e00066;
        }
        .quick-action-btn.pink i {
            color: #fff;
        }

        @media (max-width: 500px) {
            .quick-actions {
                grid-template-columns: 1fr;
            }
        }

        /* ============================================================
                   SECTION TITLE
                   ============================================================ */
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 1.2rem;
        }
        .section-title i {
            color: var(--lime);
            font-size: 1.1rem;
        }
        .section-title .count {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            background: var(--bg);
            padding: 0.1rem 0.7rem;
            border-radius: 20px;
            margin-left: 0.2rem;
        }

        /* ============================================================
                   PLAN LIST
                   ============================================================ */
        .plan-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .plan-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.4rem;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            transition: var(--transition);
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .plan-item:hover {
            border-color: var(--lime);
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(10, 31, 46, 0.04);
        }
        .plan-item .plan-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            min-width: 150px;
        }
        .plan-item .plan-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--lime);
            flex-shrink: 0;
        }
        .plan-item .plan-icon.venue {
            color: var(--pink);
        }
        .plan-item .plan-info {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }
        .plan-item .plan-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--navy);
        }
        .plan-item .plan-meta {
            font-size: 0.75rem;
            color: var(--muted);
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .plan-item .plan-meta i {
            margin-right: 2px;
        }
        .plan-item .plan-status-badge {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.15rem 0.8rem;
            border-radius: 20px;
            display: inline-block;
            letter-spacing: 0.03em;
        }
        .plan-status-badge.active {
            background: var(--success);
            color: #fff;
        }
        .plan-status-badge.pending {
            background: var(--warning);
            color: #fff;
        }
        .plan-status-badge.rejected {
            background: var(--danger);
            color: #fff;
        }
        .plan-status-badge.expired {
            background: var(--muted);
            color: #fff;
        }
        .plan-status-badge.none {
            background: var(--border);
            color: var(--muted);
        }
        .plan-item .plan-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        /* ============================================================
                   BUTTONS
                   ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 1.2rem;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(10, 31, 46, 0.06);
        }
        .btn-lime {
            background: var(--lime);
            color: var(--navy);
            border-color: var(--lime);
        }
        .btn-lime:hover {
            background: #d4dd00;
            border-color: #d4dd00;
            box-shadow: 0 4px 20px var(--lime-glow);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--navy);
            color: var(--navy);
            background: rgba(10, 31, 46, 0.02);
        }
        .btn-sm {
            padding: 0.3rem 0.9rem;
            font-size: 0.65rem;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }
        .btn-success:hover {
            background: #059669;
            border-color: #059669;
        }
        .btn-pink {
            background: var(--pink);
            color: #fff;
            border-color: var(--pink);
        }
        .btn-pink:hover {
            background: #d00060;
            border-color: #d00060;
            box-shadow: 0 4px 20px var(--pink-glow);
        }
        .btn-outline-danger {
            background: transparent;
            border: 1.5px solid var(--danger);
            color: var(--danger);
        }
        .btn-outline-danger:hover {
            background: var(--danger);
            color: #fff;
        }

        /* ============================================================
                   EMPTY STATE
                   ============================================================ */
        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--muted);
        }
        .empty-state i {
            font-size: 3.2rem;
            color: var(--border);
            margin-bottom: 1rem;
            display: block;
        }
        .empty-state h3 {
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 0.3rem;
            font-size: 1.1rem;
        }
        .empty-state p {
            font-size: 0.9rem;
            max-width: 340px;
            margin: 0 auto 1.2rem;
        }

        /* ============================================================
                   TOAST
                   ============================================================ */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 14px 22px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            animation: slideInRight 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            max-width: 420px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .toast.error {
            background: var(--danger);
        }
        .toast.success {
            background: var(--success);
        }
        .toast.info {
            background: var(--navy);
        }
        .toast.warning {
            background: var(--warning);
            color: #1f2937;
        }
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 768px) {
            body {
                padding: 1rem 0.8rem;
            }
            .card-body {
                padding: 1.5rem 1.2rem 1.8rem;
            }
            .profile-header {
                flex-wrap: wrap;
                gap: 0.8rem;
            }
            .profile-avatar {
                width: 60px;
                height: 60px;
                font-size: 1.3rem;
            }
            .profile-info .name {
                font-size: 1.1rem;
            }
            .profile-actions-top {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }
            .plan-item {
                flex-direction: column;
                align-items: stretch;
                padding: 1rem;
            }
            .plan-item .plan-left {
                gap: 0.8rem;
            }
            .plan-item .plan-actions {
                justify-content: flex-start;
                margin-top: 0.2rem;
            }
            .quick-actions {
                grid-template-columns: 1fr;
            }
            .quick-action-btn {
                padding: 0.8rem 1.2rem;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 400px) {
            .card-body {
                padding: 1rem 0.8rem;
            }
            .profile-info .badge-row {
                gap: 0.3rem;
            }
            .profile-badge {
                font-size: 0.55rem;
                padding: 0.1rem 0.6rem;
            }
            .plan-item .plan-meta {
                font-size: 0.65rem;
                gap: 0.4rem;
            }
            .btn {
                font-size: 0.65rem;
                padding: 0.3rem 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    MAIN CONTAINER
    ============================================================ -->
    <div class="container">

        <div class="card" id="profileCard">

            <!-- Card Accent -->
            <div class="card-accent"></div>

            <!-- ===== CARD BODY ===== -->

                            Loading...

                <div class="quick-actions">

                <div class="section-title">

                <div id="planListContainer">

                </div>

            </div><!-- /card-body -->
        </div><!-- /card -->
    </div><!-- /container -->

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    FIREBASE + LOGIC
    ============================================================ -->
    <script>
        // ============================================================
        //  FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {

            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        //  STATE
        // ============================================================
        let currentUser = null;
        let subscriptions = [];
        let providerData = null;

        // ============================================================
        //  AUTH
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadProviderData(user);
                await loadSubscriptions();
                updateInboxBadge();
            } else {
                window.location.href = 'index.html';
            }
        });

        // ============================================================
        //  LOAD PROVIDER DATA
        // ============================================================
        async function loadProviderData(user) {
            try {
                const docSnap = await db.collection('serviceProviders').doc(user.uid).get();
                if (docSnap.exists) {
                    providerData = docSnap.data();
                } else {
                    providerData = { name: user.email.split('@')[0] || 'Provider', email: user.email };
                }
                updateProfileHeader();
            } catch (error) {
                console.error('Error loading provider data:', error);
            }
        }

        // ============================================================
        //  UPDATE PROFILE HEADER
        // ============================================================
        function updateProfileHeader() {
            if (!providerData) return;

            const name = providerData.name || 'Provider';
            const email = providerData.email || currentUser?.email || '';

            document.getElementById('profileName').innerHTML = `${name} <span class="status-dot" id="statusDot"></span>`;
            document.getElementById('profileEmail').textContent = email;

            // Avatar
            const avatarContainer = document.getElementById('profileAvatar');
            if (providerData.avatar && providerData.avatar.startsWith('data:image')) {
                avatarContainer.innerHTML = `<img src="${providerData.avatar}" alt="Avatar" />`;
            } else {
                const initials = name.split(' ').map(w => w.charAt(0)).join('').substring(0, 2).toUpperCase() || 'P';
                avatarContainer.innerHTML = `<span>${initials}</span>`;
            }
        }

        // ============================================================
        //  LOAD SUBSCRIPTIONS
        // ============================================================
        async function loadSubscriptions() {
            const container = document.getElementById('planListContainer');
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');

            try {
                const snapshot = await db.collection('subscriptions')
                    .where('userId', '==', currentUser.uid)
                    .get();

                subscriptions = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    let planId = data.planId;
                    if (!planId && data.planName) {
                        planId = data.planName.toLowerCase().replace(/\s/g, '');
                    }
                    subscriptions.push({
                        id: doc.id,
                        planId: planId || 'unknown',
                        planName: data.planName || 'Unknown Plan',
                        status: data.status || 'pending',
                        months: data.months || 1,
                        total: data.total || 0,
                        invoiceNumber: data.invoiceNumber || null,
                        createdAt: data.createdAt || null,
                        approvedAt: data.approvedAt || null,
                        ...data
                    });
                });

                // Sort: active first, then pending, then rejected
                const statusOrder = { 'active': 0, 'approved': 0, 'pending': 1, 'pending_payment': 1, 'rejected': 2 };
                subscriptions.sort((a, b) => {
                    return (statusOrder[a.status] ?? 3) - (statusOrder[b.status] ?? 3);
                });

                renderPlans();
                updateStatusBadge();

            } catch (error) {
                console.error('Error loading subscriptions:', error);
                showToast('Failed to load your subscriptions.', 'error');
            } finally {
                overlay.classList.add('hidden');
            }
        }

        // ============================================================
        //  UPDATE STATUS BADGE & DOT
        // ============================================================
        function updateStatusBadge() {
            const dot = document.getElementById('statusDot');
            const badge = document.getElementById('statusBadge');

            // Determine overall status
            let overallStatus = 'none';
            let label = 'No Active Plan';
            let dotClass = '';

            for (const sub of subscriptions) {
                const s = sub.status;
                if (s === 'active' || s === 'approved') {
                    overallStatus = 'active';
                    label = 'Active Plan';
                    dotClass = 'active';
                    break;
                } else if (s === 'pending' || s === 'pending_payment') {
                    if (overallStatus !== 'active') {
                        overallStatus = 'pending';
                        label = 'Pending Approval';
                        dotClass = 'pending';
                    }
                } else if (s === 'rejected') {
                    if (overallStatus !== 'active' && overallStatus !== 'pending') {
                        overallStatus = 'rejected';
                        label = 'Rejected';
                        dotClass = 'rejected';
                    }
                }
            }

            if (dot) dot.className = `status-dot ${dotClass}`;
            if (badge) {
                badge.className = `profile-badge ${overallStatus}`;
                const icon = overallStatus === 'active' ? 'fa-check-circle' :
                    overallStatus === 'pending' ? 'fa-clock' :
                    overallStatus === 'rejected' ? 'fa-times-circle' : 'fa-circle';
                badge.innerHTML = `<i class="fas ${icon}"></i> ${label}`;
            }

            // Update inbox badge (simple unread count simulation)
            updateInboxBadge();
        }

        // ============================================================
        //  UPDATE INBOX BADGE
        // ============================================================
        function updateInboxBadge() {
            const badge = document.getElementById('inboxBadge');
            // Simulate unread count from localStorage or default to 0
            const count = parseInt(localStorage.getItem('zone21_inbox_unread') || '0', 10);
            badge.textContent = count > 0 ? count : '0';
            if (count === 0) {
                badge.style.display = 'none';
            } else {
                badge.style.display = 'inline-block';
            }
        }

        // ============================================================
        //  RENDER PLANS
        // ============================================================
        function renderPlans() {
            const container = document.getElementById('planListContainer');
            const countEl = document.getElementById('planCount');

            countEl.textContent = subscriptions.length;

            if (subscriptions.length === 0) {
                container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-box-open"></i>
                                <h3>No Active Plans</h3>
                                <p>You haven't subscribed to any plan yet. Choose a plan to get started.</p>
                                <button class="btn btn-lime" onclick="goBack()">
                                    <i class="fas fa-arrow-left"></i> Browse Plans
                                </button>
                            </div>
                        `;
                return;
            }

            let html = `<div class="plan-list">`;

            for (const sub of subscriptions) {
                const isActive = sub.status === 'active' || sub.status === 'approved';
                const isPending = sub.status === 'pending' || sub.status === 'pending_payment';
                const isRejected = sub.status === 'rejected';

                let statusClass = 'none';
                let statusLabel = sub.status;
                if (isActive) { statusClass = 'active';
                    statusLabel = 'Active'; } else if (isPending) { statusClass = 'pending';
                    statusLabel = 'Pending'; } else if (isRejected) { statusClass = 'rejected';
                    statusLabel = 'Rejected'; }

                // Determine which profile page to link to
                const planNameLower = sub.planName.toLowerCase();
                const isVenue = planNameLower.includes('venue');
                const profilePage = isVenue ? 'venueprofile.html' : 'vendorprofile.html';

                // Format dates
                let dateStr = '';
                let expiryStr = '';
                if (sub.createdAt && sub.createdAt.toDate) {
                    dateStr = sub.createdAt.toDate().toLocaleDateString('en-US', { year: 'numeric', month: 'short',
                        day: 'numeric' });
                } else if (sub.createdAt && typeof sub.createdAt === 'string') {
                    dateStr = new Date(sub.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short',
                        day: 'numeric' });
                }

                // Calculate expiry for active plans
                if (isActive && sub.approvedAt) {
                    let startDate = sub.approvedAt.toDate ? sub.approvedAt.toDate() : new Date(sub.approvedAt);
                    const months = sub.months || 1;
                    const expiry = new Date(startDate);
                    expiry.setMonth(expiry.getMonth() + months);
                    expiryStr = `Expires: ${expiry.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}`;
                }

                const icon = isVenue ? 'fa-building' : 'fa-briefcase';
                const iconClass = isVenue ? 'venue' : '';

                html += `
                            <div class="plan-item">
                                <div class="plan-left">
                                    <div class="plan-icon ${iconClass}">
                                        <i class="fas ${icon}"></i>
                                    </div>
                                    <div class="plan-info">
                                        <div class="plan-name">${sub.planName}</div>
                                        <div class="plan-meta">
                                            <span><i class="far fa-calendar-alt"></i> ${dateStr || 'N/A'}</span>
                                            ${sub.months ? `<span><i class="far fa-clock"></i> ${sub.months} month${sub.months > 1 ? 's' : ''}</span>` : ''}
                                            ${sub.total ? `<span><i class="fas fa-tag"></i> $${sub.total}</span>` : ''}
                                            ${expiryStr ? `<span><i class="far fa-hourglass"></i> ${expiryStr}</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                                <div style="display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;">
                                    <span class="plan-status-badge ${statusClass}">${statusLabel}</span>
                                    <div class="plan-actions">
                                        ${isActive ? `
                                            <a href="${profilePage}" class="btn btn-lime btn-sm">
                                                <i class="fas fa-user-cog"></i> Manage
                                            </a>
                                        ` : ''}
                                        ${isPending ? `
                                            <button class="btn btn-outline btn-sm" onclick="viewInvoice('${sub.planId || sub.planName}')">
                                                <i class="fas fa-file-invoice"></i> Invoice
                                            </button>
                                        ` : ''}
                                        ${isRejected ? `
                                            <button class="btn btn-pink btn-sm" onclick="goBack()">
                                                <i class="fas fa-rocket"></i> Retry
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // ============================================================
        //  VIEW INVOICE
        // ============================================================
        async function viewInvoice(planIdOrName) {
            try {
                let targetSub = null;
                for (const sub of subscriptions) {
                    if (sub.planId === planIdOrName || sub.planName === planIdOrName) {
                        targetSub = sub;
                        break;
                    }
                }
                if (!targetSub || !targetSub.invoiceNumber) {
                    showToast('No invoice found for this plan.', 'error');
                    return;
                }

                const invDoc = await db.collection('invoices').doc(targetSub.invoiceNumber).get();
                if (!invDoc.exists) {
                    showToast('Invoice document not found.', 'error');
                    return;
                }

                const data = invDoc.data();
                alert(
                    `📄 INVOICE #${data.invoiceNumber || targetSub.invoiceNumber}\n` +
                    `━━━━━━━━━━━━━━━━━━━━━━\n` +
                    `Plan: ${data.planName || targetSub.planName}\n` +
                    `Months: ${data.months || targetSub.months || 1}\n` +
                    `Total: $${data.total || targetSub.total || 0}\n` +
                    `Status: ${data.status || 'pending'}\n` +
                    `Date: ${data.createdAt ? new Date(data.createdAt.toDate ? data.createdAt.toDate() : data.createdAt).toLocaleDateString() : 'N/A'}\n` +
                    `━━━━━━━━━━━━━━━━━━━━━━\n` +
                    `💳 PAYMENT DETAILS\n` +
                    `Ecocash: 078 991 2268\n` +
                    `Innbucks: 078 991 2268\n` +
                    `TN CyberTech Bank: 4638 3300 1429 9948\n` +
                    `━━━━━━━━━━━━━━━━━━━━━━\n` +
                    `📌 Use invoice number as reference.`
                );

            } catch (error) {
                console.error('Error viewing invoice:', error);
                showToast('Failed to load invoice.', 'error');
            }
        }
        window.viewInvoice = viewInvoice;

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? '✅' :
                type === 'error' ? '❌' :
                type === 'warning' ? '⚠️' : 'ℹ️';
            toast.innerHTML = `${icon} ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = '0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4500);
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        function goBack() {
            window.location.href = 'vendordashboard.html';
        }
        window.goBack = goBack;

        function handleLogout() {
            if (confirm('Are you sure you want to sign out?')) {
                auth.signOut().then(() => {
                    window.location.href = 'index.html';
                });
            }
        }
        window.handleLogout = handleLogout;

        // ============================================================
        //  EXPOSE GLOBALLY
        // ============================================================
        window.showToast = showToast;

        console.log('✅ My Profile (modern) loaded.');
        console.log('ℹ️  Quick actions: Discover Organisers → organisers.html | Inbox → vendorinbox.html');
    </script>
</body>
</html>
