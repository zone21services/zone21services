<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – Vendors & Venues | Zone21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --navy: #0a1f2e;
            --navy-light: #1a3a4a;
            --lime: #C0C800;
            --lime-glow: rgba(192, 200, 0, 0.25);
            --pink: #F80070;
            --pink-glow: rgba(248, 0, 112, 0.15);
            --bg: #f0f2f6;
            --card: #ffffff;
            --text: #0f1a24;
            --text-secondary: #3d4f5e;
            --muted: #7a8a9a;
            --border: #e6eaf0;
            --radius: 18px;
            --radius-sm: 10px;
            --shadow-sm: 0 2px 8px rgba(10, 31, 46, 0.04);
            --shadow: 0 8px 32px rgba(10, 31, 46, 0.07);
            --shadow-hover: 0 16px 48px rgba(10, 31, 46, 0.12);
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --topbar-height: 64px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--lime); border-radius: 10px; }

        .main-wrapper { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }

        /* TOPBAR */
        .topbar {
            height: var(--topbar-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(230, 234, 240, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 900;
            gap: 16px;
        }
        .search-bar {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg); border-radius: 30px; padding: 8px 18px;
            flex: 1; max-width: 400px; border: 1px solid var(--border); transition: var(--transition);
        }
        .search-bar:focus-within { border-color: var(--lime); box-shadow: 0 0 0 4px var(--lime-glow); }
        .search-bar input { border: none; background: transparent; outline: none; flex: 1; font-size: 0.85rem; color: var(--text); font-weight: 500; }
        .topbar-right { display: flex; align-items: center; gap: 18px; flex-shrink: 0; }
        .profile-dropdown {
            display: flex; align-items: center; gap: 12px; padding: 4px 12px 4px 4px;
            border-radius: 40px; background: var(--bg); border: 1px solid var(--border); transition: var(--transition);
        }
        .profile-avatar {
            width: 36px; height: 36px; border-radius: 50%; background: var(--navy);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.85rem; color: var(--lime); border: 2px solid var(--lime);
        }
        .profile-name { font-weight: 600; font-size: 0.85rem; color: var(--text); }
        .logout-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; padding: 4px 6px; border-radius: 6px; transition: var(--transition); }
        .logout-btn:hover { color: var(--pink); background: rgba(248, 0, 112, 0.06); }

        /* CONTENT */
        .content { flex: 1; padding: 28px 32px 40px; max-width: 1400px; margin: 0 auto; width: 100%; }

        /* TABS */
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 24px; }
        .admin-tab {
            padding: 10px 24px; border-radius: 30px; font-size: 0.9rem; font-weight: 700;
            cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--muted); transition: var(--transition);
        }
        .admin-tab.active { background: var(--navy); color: #fff; border-color: var(--navy); box-shadow: 0 4px 12px rgba(10,31,46,0.2); }
        .admin-tab:not(.active):hover { background: var(--bg); color: var(--navy); }

        /* CARD & TABLES */
        .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 28px; border: 1px solid var(--border); transition: var(--transition); position: relative; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid var(--bg); flex-wrap: wrap; gap: 10px; }
        .card-header h3 { font-size: 1.1rem; font-weight: 800; color: var(--navy); display: flex; align-items: center; gap: 10px; }
        .card-header h3 i { color: var(--lime); }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        thead { background: var(--bg); }
        thead th { padding: 14px; text-align: left; font-weight: 700; color: var(--text-secondary); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
        tbody td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tbody tr:hover { background: rgba(192, 200, 0, 0.02); }

        .table-cell-flex { display: flex; align-items: center; gap: 12px; }
        .table-avatar {
            width: 44px; height: 44px; border-radius: 12px; background: var(--navy);
            color: var(--lime); display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.85rem; overflow: hidden; flex-shrink: 0;
        }
        .table-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .info .name { font-weight: 800; color: var(--navy); font-size: 0.95rem; display: block; }
        .info .sub { font-size: 0.75rem; color: var(--muted); font-weight: 500; }

        .badge { font-size: 0.65rem; font-weight: 800; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; }
        .badge.active { background: rgba(15,157,110,0.1); color: #0F9D6E; }
        .badge.pending { background: rgba(245,180,0,0.1); color: #9A6E00; }
        .badge.draft { background: rgba(122,136,153,0.1); color: var(--muted); }

        .action-btns { display: flex; gap: 6px; justify-content: flex-end; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; transition: var(--transition); font-size: 0.8rem; text-decoration: none; white-space: nowrap; }
        .btn-primary { background: var(--navy); color: #fff; }
        .btn-primary:hover { background: #14303f; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(10, 31, 46, 0.2); }
        .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-secondary); }
        .btn-outline:hover { border-color: var(--navy); color: var(--navy); background: var(--bg); }
        .btn-danger { background: rgba(248, 0, 112, 0.1); color: var(--pink); border: 1px solid rgba(248, 0, 112, 0.2); }
        .btn-danger:hover { background: var(--pink); color: #fff; border-color: var(--pink); }
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; border-radius: 8px; }

        /* MODALS */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(10, 31, 46, 0.6); backdrop-filter: blur(6px);
            z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.25s ease;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--card); border-radius: var(--radius); max-width: 800px; width: 100%;
            max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 80px rgba(10, 31, 46, 0.3);
            animation: slideUp 0.3s cubic-bezier(0.22, 1, 0.36, 1); position: relative;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

        /* VIEW MODAL SPECIFIC */
        .profile-cover { height: 140px; background: linear-gradient(135deg, var(--navy) 0%, #1A3A4A 100%); position: relative; border-radius: var(--radius) var(--radius) 0 0; }
        .profile-header { padding: 0 30px 20px; position: relative; display: flex; align-items: flex-end; gap: 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .profile-avatar-lg {
            width: 100px; height: 100px; border-radius: 20px; background: var(--lime); color: var(--navy);
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 2.5rem;
            border: 4px solid #fff; margin-top: -50px; position: relative; z-index: 2; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .profile-avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
        .profile-title { flex: 1; min-width: 200px; padding-bottom: 5px; }
        .profile-title h2 { font-size: 1.5rem; font-weight: 800; color: var(--navy); margin-bottom: 2px; }
        .profile-title p { font-size: 0.85rem; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .profile-body { padding: 24px 30px 30px; }
        
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .detail-item { background: var(--bg); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); }
        .detail-item .lbl { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 4px; display: block; }
        .detail-item .val { font-size: 0.9rem; font-weight: 700; color: var(--navy); word-break: break-word; }

        .section-title { font-size: 0.9rem; font-weight: 800; color: var(--navy); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
        .tag { background: #fff; border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); }
        .tag.service { border-color: rgba(192,200,0,0.4); background: rgba(192,200,0,0.05); color: var(--lime-deep); }
        .tag.amenity { border-color: rgba(15,157,110,0.3); background: rgba(15,157,110,0.05); color: var(--green); }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .gallery-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1; background: var(--bg); border: 1px solid var(--border); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; transition: transform 0.3s; }
        .gallery-item:hover img { transform: scale(1.05); }
        
        .modal-close-top { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.4); color: #fff; display: grid; place-items: center; border: none; cursor: pointer; z-index: 10; transition: 0.2s; }
        .modal-close-top:hover { background: rgba(0,0,0,0.8); transform: rotate(90deg); }

        /* EDIT MODAL SPECIFIC */
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 24px 30px 16px; border-bottom: 1px solid var(--border); }
        .modal-header h2 { font-size: 1.1rem; font-weight: 800; color: var(--navy); display: flex; align-items: center; gap: 10px; }
        .modal-header h2 i { color: var(--lime); }
        .modal-close { background: var(--bg); border: none; width: 32px; height: 32px; border-radius: 50%; color: var(--muted); cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .modal-close:hover { background: var(--pink); color: #fff; }
        
        .edit-body { padding: 24px 30px 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-grid .full { grid-column: 1 / -1; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 0.7rem; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: 0.05em; }
        .input-group input, .input-group textarea, .input-group select {
            padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 0.85rem; background: var(--bg); transition: 0.2s; outline: none; width: 100%; font-family: inherit;
        }
        .input-group input:focus, .input-group textarea:focus, .input-group select:focus { border-color: var(--navy); background: #fff; box-shadow: 0 0 0 3px rgba(10,31,46,0.05); }
        .input-group textarea { resize: vertical; min-height: 80px; }
        
        .modal-actions { padding: 20px 30px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; background: var(--bg); border-radius: 0 0 var(--radius) var(--radius); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
        .empty-state i { font-size: 3rem; color: var(--border); margin-bottom: 12px; }
        
        .loading-state { text-align: center; padding: 40px; color: var(--muted); }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--lime); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .content { padding: 16px; }
            .topbar { padding: 0 16px; }
            .search-bar { display: none; }
            .admin-tabs { flex-direction: column; }
            .form-grid { grid-template-columns: 1fr; }
            .detail-grid { grid-template-columns: 1fr; }
            .profile-header { flex-direction: column; align-items: center; text-align: center; gap: 12px; }
            .profile-avatar-lg { margin-top: -60px; }
            .profile-body { padding: 20px; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- TOPBAR -->
        <div class="topbar">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search by name, category, location..." />
            </div>
            <div class="topbar-right">
                <div class="profile-dropdown">
                    <div class="profile-avatar">AD</div>
                    <span class="profile-name" id="topbar-name">Admin</span>
                    <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <div class="admin-tabs">
                <button class="admin-tab active" id="tab-vendors" onclick="switchTab('vendors')">
                    <i class="fas fa-briefcase"></i> Service Providers
                </button>
                <button class="admin-tab" id="tab-venues" onclick="switchTab('venues')">
                    <i class="fas fa-building"></i> Venues
                </button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 id="table-title"><i class="fas fa-store"></i> All Service Providers</h3>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <span id="item-count" style="font-size:0.8rem; font-weight:600; color:var(--muted);">0 items</span>
                        <button class="btn btn-outline btn-sm" onclick="loadData()"><i class="fas fa-sync"></i> Refresh</button>
                    </div>
                </div>
                <div id="table-container">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading records...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- VIEW PROFILE MODAL -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal">
            <button class="modal-close-top" onclick="closeViewModal()"><i class="fas fa-times"></i></button>
            <div id="viewModalContent"></div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> Edit Details</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="edit-body">
                <div class="form-grid" id="editForm">
                    <!-- Populated by JS -->
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" id="saveEditBtn" onclick="saveEdit()"><i class="fas fa-save"></i> Save Changes</button>
            </div>
        </div>
    </div>

    <!-- DELETE MODAL -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal" style="max-width:440px; text-align:center; padding: 30px;">
            <div style="font-size:3rem; color:var(--pink); margin-bottom:12px;"><i class="fas fa-exclamation-triangle"></i></div>
            <h2 style="font-size:1.2rem; font-weight:800; color:var(--navy); margin-bottom:8px;">Delete Record</h2>
            <p style="color:var(--text-secondary); margin-bottom:8px;">Are you sure you want to delete <strong id="deleteName"></strong>?</p>
            <p style="font-size:0.85rem; color:var(--muted); margin-bottom:20px;">This action cannot be undone. All associated data will be permanently removed.</p>
            <div style="display:flex; gap:12px; justify-content:center;">
                <button class="btn btn-outline" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()"><i class="fas fa-trash"></i> Delete Permanently</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let allData = [];
        let filteredData = [];
        let currentTab = 'vendors'; // 'vendors' or 'venues'
        let editingId = null;
        let deletingId = null;

        const SERVICES_LIST = [
            'Venue / Space Rental', 'Marquee / Tents & Chairs', 'PA System & Basic Sound', 
            'DJ Services', 'Stage & Decorative Lighting', 'Event Décor & Draping', 
            'Catering (Food & Buffet)', 'Beverages & Mobile Bar', 'Cake Designer / Baker', 
            'Photographer', 'Videographer', 'MC (Master of Ceremonies)', 'Makeup Artist', 
            'Hairstylist', 'Transport / Car Hire', 'Cleaning Services', 'Ushers & Hostesses'
        ];

        const AMENITIES_LIST = [
            'Parking','Catering Area','Stage','Dance Floor','Air Conditioning','Bar','Sound System',
            'WiFi','Backup Generator','Security','VIP Lounge','Outdoor Space','Swimming Pool',
            'Bridal Suite','Kitchen Facilities','Restrooms','Wheelchair Access','Bridal Room'
        ];

        // AUTHENTICATION
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'admin-login.html'; return; }
            try {
                const adminDoc = await db.collection('admins').doc(user.uid).get();
                if (!adminDoc.exists) {
                    document.getElementById('table-container').innerHTML = `<div class="empty-state"><h3>Access Denied</h3><p>Not an admin.</p></div>`;
                    return;
                }
                document.getElementById('topbar-name').textContent = adminDoc.data().name || 'Admin';
                loadData();
            } catch (e) {
                console.error(e);
            }
        });

        // TABS
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-vendors').classList.toggle('active', tab === 'vendors');
            document.getElementById('tab-venues').classList.toggle('active', tab === 'venues');
            document.getElementById('table-title').innerHTML = tab === 'vendors' 
                ? '<i class="fas fa-briefcase"></i> All Service Providers' 
                : '<i class="fas fa-building"></i> All Venues';
            
            document.getElementById('searchInput').value = '';
            loadData();
        }

        // LOAD DATA
        function loadData() {
            const container = document.getElementById('table-container');
            container.innerHTML = `<div class="loading-state"><div class="spinner"></div><p>Loading...</p></div>`;
            
            const collectionName = currentTab === 'vendors' ? 'serviceProviders' : 'venues';

            db.collection(collectionName).orderBy('createdAt', 'desc').onSnapshot(snap => {
                allData = [];
                snap.forEach(doc => {
                    allData.push({ id: doc.id, ...doc.data() });
                });
                applyFilters();
            }, err => {
                container.innerHTML = `<div class="empty-state"><h3>Error</h3><p>${err.message}</p></div>`;
            });
        }

        // SEARCH & FILTER
        document.getElementById('searchInput').addEventListener('input', applyFilters);

        function applyFilters() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            filteredData = allData.filter(item => {
                const searchable = `${item.name||''} ${item.category||''} ${item.location||''} ${(item.services||[]).join(' ')}`.toLowerCase();
                return searchable.includes(term);
            });
            renderTable();
            document.getElementById('item-count').textContent = `${filteredData.length} items`;
        }

        // RENDER TABLE
        function renderTable() {
            const container = document.getElementById('table-container');
            if (filteredData.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i><h3 style="color:var(--navy); margin:10px 0;">No records found</h3><p>Adjust your search or add a new record.</p></div>`;
                return;
            }

            let html = `<div class="table-responsive"><table><thead><tr>
                <th>${currentTab === 'vendors' ? 'Provider' : 'Venue'}</th>
                <th>Category / Type</th>
                <th>Location</th>
                <th>Starting Price</th>
                <th>Gallery</th>
                <th>Status</th>
                <th style="text-align:right;">Actions</th>
            </tr></thead><tbody>`;

            filteredData.forEach(item => {
                const initials = (item.name || '?').split(' ').map(w=>w.charAt(0)).join('').substring(0,2).toUpperCase();
                const avatar = item.avatar && item.avatar.startsWith('data:image') ? `<img src="${item.avatar}">` : initials;
                const price = item.basePrice ? `$${item.basePrice}` : '—';
                const imgs = (item.images || []).length;
                const status = item.status || 'draft';
                
                let badgeClass = 'draft';
                if(status === 'active' || status === 'approved') badgeClass = 'active';
                if(status === 'pending') badgeClass = 'pending';

                html += `
                    <tr>
                        <td>
                            <div class="table-cell-flex">
                                <div class="table-avatar">${avatar}</div>
                                <div class="info">
                                    <span class="name">${item.name || 'Unnamed'}</span>
                                    <span class="sub">${item.email || 'No email'}</span>
                                </div>
                            </div>
                        </td>
                        <td>${currentTab === 'vendors' ? (item.category || 'General') : (item.venueType || 'Venue')}</td>
                        <td>${item.location || '—'}</td>
                        <td>${price}</td>
                        <td><i class="fas fa-image" style="color:var(--muted);"></i> ${imgs}</td>
                        <td><span class="badge ${badgeClass}">${status}</span></td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-outline btn-sm" onclick="openViewModal('${item.id}')" title="View Profile"><i class="fas fa-eye"></i></button>
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${item.id}')" title="Edit"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-danger btn-sm" onclick="openDeleteModal('${item.id}')" title="Delete"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        // VIEW MODAL
        function openViewModal(id) {
            const item = allData.find(x => x.id === id);
            if (!item) return;

            const initials = (item.name || '?').split(' ').map(w=>w.charAt(0)).join('').substring(0,2).toUpperCase();
            const avatar = item.avatar && item.avatar.startsWith('data:image') ? `<img src="${item.avatar}">` : initials;
            
            let servicesHtml = '';
            if (item.services && item.services.length > 0) {
                servicesHtml = item.services.map(s => `<span class="tag service">${s}</span>`).join('');
            } else if (currentTab === 'venues') {
                servicesHtml = '<span class="tag">Venue Rental</span>';
            } else {
                servicesHtml = '<p style="font-size:0.8rem;color:var(--muted);">No specific services listed.</p>';
            }

            let amenitiesHtml = '';
            if (currentTab === 'venues' && item.amenities && item.amenities.length > 0) {
                amenitiesHtml = `
                    <div class="section-title"><i class="fas fa-star"></i> Amenities</div>
                    <div class="tag-list">${item.amenities.map(a => `<span class="tag amenity">${a}</span>`).join('')}</div>
                `;
            }

            let tiersHtml = '';
            if (item.priceTiers && item.priceTiers.length > 0) {
                tiersHtml = `
                    <div class="section-title"><i class="fas fa-layer-group"></i> Price Tiers</div>
                    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px;">
                        ${item.priceTiers.map(t => `
                            <div style="background:#fff; border:1px solid var(--border); padding:12px; border-radius:10px; display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <div style="font-weight:800;color:var(--navy);font-size:0.9rem;">${t.name}</div>
                                    ${t.desc ? `<div style="font-size:0.75rem;color:var(--muted);">${t.desc}</div>` : ''}
                                </div>
                                <div style="font-family:'Fraunces',serif;font-weight:800;color:var(--lime-deep);font-size:1.1rem;">
                                    $${t.priceUsd}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            let galleryHtml = '';
            if (item.images && item.images.length > 0) {
                galleryHtml = `
                    <div class="section-title"><i class="fas fa-images"></i> Gallery (${item.images.length})</div>
                    <div class="gallery-grid">
                        ${item.images.map((url, i) => `
                            <div class="gallery-item">
                                <img src="${url}" alt="Img ${i+1}" onclick="window.open('${url}', '_blank')">
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                galleryHtml = `<div class="section-title"><i class="fas fa-images"></i> Gallery</div><p style="font-size:0.8rem;color:var(--muted);margin-bottom:24px;">No images uploaded.</p>`;
            }

            const detailField = (lbl, val) => val ? `
                <div class="detail-item">
                    <span class="lbl">${lbl}</span>
                    <span class="val">${val}</span>
                </div>
            ` : '';

            document.getElementById('viewModalContent').innerHTML = `
                <div class="profile-cover"></div>
                <div class="profile-header">
                    <div class="profile-avatar-lg">${avatar}</div>
                    <div class="profile-title">
                        <h2>${item.name || 'Unnamed'}</h2>
                        <p><i class="fas fa-map-marker-alt" style="color:var(--pink);"></i> ${item.location || 'Location not set'}</p>
                    </div>
                </div>
                <div class="profile-body">
                    <div class="detail-grid">
                        ${detailField(currentTab === 'vendors' ? 'Category' : 'Venue Type', currentTab === 'vendors' ? item.category : item.venueType)}
                        ${detailField('Starting Price', item.basePrice ? '$'+item.basePrice : null)}
                        ${detailField('Capacity', item.capacity)}
                        ${detailField('Contact Email', item.email)}
                        ${detailField('Phone / WhatsApp', item.phone)}
                        ${detailField('Status', `<span class="badge ${item.status==='active'?'active':'pending'}">${item.status||'draft'}</span>`)}
                    </div>

                    ${item.description ? `
                        <div class="section-title"><i class="fas fa-align-left"></i> Description</div>
                        <p style="font-size:0.85rem; color:var(--text-secondary); line-height:1.6; margin-bottom:24px;">${item.description}</p>
                    ` : ''}

                    <div class="section-title"><i class="fas fa-tools"></i> Services</div>
                    <div class="tag-list">${servicesHtml}</div>

                    ${amenitiesHtml}
                    ${tiersHtml}
                    ${galleryHtml}
                </div>
            `;
            document.getElementById('viewModal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.remove('open');
            document.body.style.overflow = '';
        }

        // EDIT MODAL
        function openEditModal(id) {
            const item = allData.find(x => x.id === id);
            if (!item) return;
            editingId = id;

            let servicesHtml = '';
            if (currentTab === 'vendors') {
                SERVICES_LIST.forEach(svc => {
                    const checked = (item.services || []).includes(svc) ? 'checked' : '';
                    servicesHtml += `<label style="display:flex;align-items:center;gap:6px;font-size:0.8rem;cursor:pointer;"><input type="checkbox" class="edit-svc" value="${svc}" ${checked}> ${svc}</label>`;
                });
            }

            let amenitiesHtml = '';
            if (currentTab === 'venues') {
                AMENITIES_LIST.forEach(am => {
                    const checked = (item.amenities || []).includes(am) ? 'checked' : '';
                    amenitiesHtml += `<label style="display:flex;align-items:center;gap:6px;font-size:0.8rem;cursor:pointer;"><input type="checkbox" class="edit-amenity" value="${am}" ${checked}> ${am}</label>`;
                });
            }

            document.getElementById('editForm').innerHTML = `
                <div class="input-group full">
                    <label>${currentTab === 'vendors' ? 'Business Name' : 'Venue Name'}</label>
                    <input type="text" id="ed-name" value="${item.name || ''}">
                </div>
                <div class="input-group">
                    <label>${currentTab === 'vendors' ? 'Category' : 'Venue Type'}</label>
                    <input type="text" id="ed-cat" value="${currentTab === 'vendors' ? (item.category||'') : (item.venueType||'')}">
                </div>
                <div class="input-group">
                    <label>Location (City, Country)</label>
                    <input type="text" id="ed-loc" value="${item.location || ''}">
                </div>
                <div class="input-group">
                    <label>Starting Price ($)</label>
                    <input type="number" id="ed-price" value="${item.basePrice || 0}">
                </div>
                <div class="input-group">
                    <label>Status</label>
                    <select id="ed-status">
                        <option value="active" ${item.status==='active'?'selected':''}>Active (Live)</option>
                        <option value="pending" ${item.status==='pending'?'selected':''}>Pending</option>
                        <option value="draft" ${item.status==='draft'?'selected':''}>Draft</option>
                    </select>
                </div>
                ${currentTab === 'venues' ? `
                <div class="input-group full">
                    <label>Capacity</label>
                    <input type="number" id="ed-capacity" value="${item.capacity || 0}">
                </div>
                ` : ''}
                <div class="input-group full">
                    <label>Description</label>
                    <textarea id="ed-desc">${item.description || ''}</textarea>
                </div>
                ${currentTab === 'vendors' ? `
                <div class="input-group full">
                    <label>Services Offered</label>
                    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;background:var(--bg);padding:12px;border-radius:10px;border:1px solid var(--border);">
                        ${servicesHtml}
                    </div>
                </div>
                ` : `
                <div class="input-group full">
                    <label>Amenities</label>
                    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;background:var(--bg);padding:12px;border-radius:10px;border:1px solid var(--border);">
                        ${amenitiesHtml}
                    </div>
                </div>
                `}
            `;

            document.getElementById('editModal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('open');
            document.body.style.overflow = '';
            editingId = null;
        }

        async function saveEdit() {
            if (!editingId) return;
            const btn = document.getElementById('saveEditBtn');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Saving...';
            btn.disabled = true;

            try {
                const collectionName = currentTab === 'vendors' ? 'serviceProviders' : 'venues';
                const updates = {
                    name: document.getElementById('ed-name').value.trim(),
                    location: document.getElementById('ed-loc').value.trim(),
                    basePrice: Number(document.getElementById('ed-price').value) || 0,
                    status: document.getElementById('ed-status').value,
                    description: document.getElementById('ed-desc').value.trim(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                if (currentTab === 'vendors') {
                    updates.category = document.getElementById('ed-cat').value.trim();
                    updates.services = Array.from(document.querySelectorAll('.edit-svc:checked')).map(cb => cb.value);
                } else {
                    updates.venueType = document.getElementById('ed-cat').value.trim();
                    updates.capacity = Number(document.getElementById('ed-capacity').value) || 0;
                    updates.amenities = Array.from(document.querySelectorAll('.edit-amenity:checked')).map(cb => cb.value);
                }

                await db.collection(collectionName).doc(editingId).update(updates);
                
                closeEditModal();
                btn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
                btn.disabled = false;
            } catch (e) {
                console.error(e);
                alert('Failed to save: ' + e.message);
                btn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
                btn.disabled = false;
            }
        }

        // DELETE MODAL
        function openDeleteModal(id) {
            const item = allData.find(x => x.id === id);
            if (!item) return;
            deletingId = id;
            document.getElementById('deleteName').textContent = item.name || 'Unnamed';
            document.getElementById('deleteModal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('open');
            document.body.style.overflow = '';
            deletingId = null;
        }

        async function confirmDelete() {
            if (!deletingId) return;
            const btn = document.getElementById('confirmDeleteBtn');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Deleting...';
            btn.disabled = true;

            try {
                const collectionName = currentTab === 'vendors' ? 'serviceProviders' : 'venues';
                await db.collection(collectionName).doc(deletingId).delete();
                
                // Also clean up subcollections if any (like reviews)
                try {
                    const reviews = await db.collection(collectionName).doc(deletingId).collection('reviews').get();
                    const batch = db.batch();
                    reviews.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                } catch(e){}

                closeDeleteModal();
                btn.innerHTML = '<i class="fas fa-trash"></i> Delete Permanently';
                btn.disabled = false;
            } catch(e) {
                console.error(e);
                alert('Failed to delete: ' + e.message);
                btn.innerHTML = '<i class="fas fa-trash"></i> Delete Permanently';
                btn.disabled = false;
            }
        }

        // LOGOUT
        document.getElementById('logout-btn').onclick = () => auth.signOut().then(() => window.location.href = 'admin-login.html');

        // EXPOSE GLOBALS
        window.switchTab = switchTab;
        window.loadData = loadData;
        window.openViewModal = openViewModal;
        window.closeViewModal = closeViewModal;
        window.openEditModal = openEditModal;
        window.closeEditModal = closeEditModal;
        window.saveEdit = saveEdit;
        window.openDeleteModal = openDeleteModal;
        window.closeDeleteModal = closeDeleteModal;
        window.confirmDelete = confirmDelete;
    </script>
</body>
</html>
