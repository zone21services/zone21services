<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zone21 | My Events</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800;
            --pink: #F80070;
            --white: #F8F8F8;
            --grey: #E0E0E8;
            --bg: #f0f4f8;
            --surface: #FFFFFF;
            --text: #102838;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --success: #10B981;
            --radius-xl: 20px;
            --radius-md: 10px;
            --transition: 0.2s ease-in-out;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }

        /* --- CHAT APP CONTAINER --- */
        .chat-app {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: 0 15px 35px rgba(16, 40, 56, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            height: calc(100vh - 4rem);
            max-height: 850px;
        }

        /* --- HEADER --- */
        .chat-header {
            background: var(--navy);
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header .badge {
            background: var(--pink);
            color: white;
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
        }
        .chat-header .back-btn {
            color: var(--lime);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
        }
        .chat-header .back-btn:hover { opacity: 0.8; }

        /* --- SEARCH BAR --- */
        .search-bar {
            padding: 1rem;
            background: #FAFBFC;
            border-bottom: 1px solid var(--border);
        }
        .search-input-wrapper {
            position: relative;
        }
        .search-input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .search-input-wrapper input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-family: inherit;
            background: var(--white);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }
        .search-input-wrapper input:focus {
            border-color: var(--lime);
            box-shadow: 0 0 0 3px rgba(192, 200, 0, 0.1);
        }

        /* --- CHAT LIST --- */
        .chat-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            padding: 0;
            margin: 0;
            background: var(--surface);
        }
        /* Custom Scrollbar */
        .chat-list::-webkit-scrollbar { width: 6px; }
        .chat-list::-webkit-scrollbar-track { background: transparent; }
        .chat-list::-webkit-scrollbar-thumb { background: var(--grey); border-radius: 10px; }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.2rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .chat-item:hover {
            background: #F8FAFC;
        }
        .chat-item:active {
            background: #F1F5F9;
        }

        /* Avatar */
        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--lime) 0%, #A0A800 100%);
            color: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            margin-right: 15px;
            position: relative;
        }
        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: var(--success);
            border: 2px solid var(--surface);
            border-radius: 50%;
        }

        /* Content */
        .chat-content {
            flex: 1;
            min-width: 0; /* Ensures text truncation works */
        }
        .chat-top-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }
        .chat-name {
            font-weight: 700;
            color: var(--navy);
            font-size: 1.05rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            flex-shrink: 0;
            margin-left: 10px;
        }
        .chat-message {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .chat-message i { color: var(--success); font-size: 0.8rem; }

        /* Actions */
        .chat-actions {
            margin-left: 10px;
            display: flex;
            gap: 8px;
            opacity: 0; /* Hidden by default on desktop */
            transform: translateX(10px);
            transition: all 0.3s ease;
        }
        .chat-item:hover .chat-actions {
            opacity: 1;
            transform: translateX(0);
        }
        .action-btn {
            background: var(--white);
            border: 1px solid var(--border);
            color: var(--navy);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .action-btn:hover {
            background: var(--pink);
            color: white;
            border-color: var(--pink);
        }

        @media (max-width: 768px) {
            .chat-actions { opacity: 1; transform: translateX(0); } /* Always show on mobile */
            .chat-app { height: 100vh; max-height: none; border-radius: 0; border: none; }
            body { padding: 0; }
        }

        /* --- EMPTY STATE --- */
        .empty-state {
            padding: 3rem 2rem;
            text-align: center;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--grey);
            margin-bottom: 1rem;
        }
        .empty-state h3 { color: var(--navy); margin-bottom: 0.5rem; }

        /* --- RENAME MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(16, 40, 56, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: var(--transition);
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        
        .modal-card h3 { color: var(--navy); margin-bottom: 1rem; font-weight: 800; }
        .modal-card input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            outline: none;
        }
        .modal-card input:focus { border-color: var(--pink); }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
        }
        .btn-cancel { background: var(--grey); color: var(--text); }
        .btn-save { background: var(--navy); color: var(--lime); }
    </style>
</head>
<body>

    <div class="chat-app">
        <header class="chat-header">
            <h1><i class="fas fa-check-circle" style="color: var(--lime);"></i> Approved Events <span class="badge" id="event-count">0</span></h1>
            <a href="checkout.html" class="back-btn"><i class="fas fa-plus"></i> New Event</a>
        </header>

        <div class="search-bar">
            <div class="search-input-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Search events..." onkeyup="filterEvents()">
            </div>
        </div>

        <ul class="chat-list" id="chat-list-container">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <h3>Loading Events...</h3>
            </div>
        </ul>
    </div>

    <div class="modal-overlay" id="rename-modal">
        <div class="modal-card">
            <h3>Rename Event</h3>
            <input type="text" id="rename-input" placeholder="Enter new event name" autocomplete="off">
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeRenameModal()">Cancel</button>
                <button class="btn btn-save" id="save-rename-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeEventIdToRename = null;

        // Ensure user is logged in
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadApprovedEvents();
            } else {
                window.location.href = "index.html"; // Redirect if not logged in
            }
        });

        // Date Formatter helper
        function formatChatDate(timestamp) {
            if (!timestamp) return 'Just now';
            let dateObj;
            if (typeof timestamp.toDate === 'function') dateObj = timestamp.toDate();
            else if (timestamp.seconds) dateObj = new Date(timestamp.seconds * 1000);
            else dateObj = new Date(timestamp);

            const now = new Date();
            const diffInDays = Math.floor((now - dateObj) / (1000 * 60 * 60 * 24));
            
            if (diffInDays === 0) {
                return dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (diffInDays === 1) {
                return 'Yesterday';
            } else if (diffInDays < 7) {
                return dateObj.toLocaleDateString('en-US', { weekday: 'short' });
            } else {
                return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
        }

        // Load and render events
        async function loadApprovedEvents() {
            const container = document.getElementById('chat-list-container');
            
            try {
                // Fetch user's events
                const q = query(collection(db, 'events'), where('organizerId', '==', currentUser.uid));
                const querySnapshot = await getDocs(q);
                
                let events = [];
                querySnapshot.forEach(doc => {
                    events.push({ id: doc.id, ...doc.data() });
                });

                // Filter to ONLY show Approved/Draft (ignoring strictly 'pending_payment')
                const approvedEvents = events.filter(e => {
                    const status = (e.status || 'approved').toLowerCase();
                    return status === 'approved' || status === 'draft'; 
                });

                // Sort by date descending
                approvedEvents.sort((a, b) => {
                    const dateA = a.createdAt?.seconds || 0;
                    const dateB = b.createdAt?.seconds || 0;
                    return dateB - dateA;
                });

                document.getElementById('event-count').innerText = approvedEvents.length;

                if (approvedEvents.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <h3>No Approved Events</h3>
                            <p style="font-size:0.9rem;">You don't have any active event packages yet.</p>
                        </div>
                    `;
                    return;
                }

                // Render list
                container.innerHTML = approvedEvents.map(event => {
                    const eventName = event.name || 'Untitled Event';
                    const packageName = event.package || 'Event Package';
                    const timeString = formatChatDate(event.createdAt);

                    return `
                        <li class="chat-item" data-name="${eventName.toLowerCase()}" onclick="goToManageEvent('${event.id}')">
                            <div class="chat-avatar">
                                <i class="fas fa-calendar-star"></i>
                                <div class="status-dot"></div>
                            </div>
                            <div class="chat-content">
                                <div class="chat-top-row">
                                    <div class="chat-name" id="name-${event.id}">${eventName}</div>
                                    <div class="chat-time">${timeString}</div>
                                </div>
                                <div class="chat-message">
                                    <i class="fas fa-check-double"></i> Approved: ${packageName}
                                </div>
                            </div>
                            <div class="chat-actions">
                                <button class="action-btn" title="Rename Event" onclick="event.stopPropagation(); openRenameModal('${event.id}', '${eventName.replace(/'/g, "\\'")}')">
                                    <i class="fas fa-pen"></i>
                                </button>
                            </div>
                        </li>
                    `;
                }).join('');

            } catch (error) {
                console.error("Error loading events:", error);
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:var(--pink);"></i> <h3>Error Loading</h3><p>Please check your connection.</p></div>`;
            }
        }

        // Expose navigation function
        window.goToManageEvent = function(eventId) {
            window.location.href = `manageevent.html?eventId=${eventId}`;
        };

        // --- SEARCH FILTERING ---
        window.filterEvents = function() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const items = document.querySelectorAll('.chat-item');
            
            items.forEach(item => {
                const name = item.getAttribute('data-name');
                if (name.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        };

        // --- RENAME MODAL LOGIC ---
        const modal = document.getElementById('rename-modal');
        const renameInput = document.getElementById('rename-input');
        const saveBtn = document.getElementById('save-rename-btn');

        window.openRenameModal = function(eventId, currentName) {
            activeEventIdToRename = eventId;
            renameInput.value = currentName;
            modal.classList.add('active');
            setTimeout(() => renameInput.focus(), 100);
        };

        window.closeRenameModal = function() {
            modal.classList.remove('active');
            activeEventIdToRename = null;
        };

        // Handle the Save Button Click
        saveBtn.addEventListener('click', async () => {
            if (!activeEventIdToRename) return;
            
            const newName = renameInput.value.trim();
            if (!newName) {
                alert("Event name cannot be empty.");
                return;
            }

            const originalText = saveBtn.innerText;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            saveBtn.disabled = true;

            try {
                // Update Firestore Document
                const eventRef = doc(db, 'events', activeEventIdToRename);
                await setDoc(eventRef, { name: newName }, { merge: true });

                // Update UI instantly without full page reload
                const nameDisplay = document.getElementById(`name-${activeEventIdToRename}`);
                if (nameDisplay) {
                    nameDisplay.innerText = newName;
                    // update the data attribute for search filtering
                    nameDisplay.closest('.chat-item').setAttribute('data-name', newName.toLowerCase()); 
                }
                
                closeRenameModal();
            } catch (error) {
                console.error("Error renaming event:", error);
                alert("Failed to rename the event. Check permissions or connection.");
            } finally {
                saveBtn.innerText = originalText;
                saveBtn.disabled = false;
            }
        });

        // Close modal on outside click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeRenameModal();
        });

        // Allow pressing "Enter" to save
        renameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveBtn.click();
        });

    </script>
</body>
</html>
