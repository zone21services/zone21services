<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zone21 · My Events</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           ROOT – MODERN LIGHT THEME
           ============================================================ */
        :root {
            --bg-body: #f2f5f9;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f8faff;
            --border-subtle: #e9eef4;
            --text-primary: #0b1a2b;
            --text-secondary: #1f3347;
            --text-muted: #6a7f94;
            --text-dim: #a3b8cc;
            --lime: #b0b800;
            --lime-light: #e8ee88;
            --lime-glow: rgba(176, 184, 0, 0.10);
            --pink: #e0006a;
            --pink-glow: rgba(224, 0, 106, 0.06);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.08);
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1.5rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================================
           APP CONTAINER
           ============================================================ */
        .app-container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding: 0 0.25rem;
        }

        .page-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .page-header .brand .logo-mark {
            width: 40px;
            height: 40px;
            background: var(--lime);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
            color: #fff;
            flex-shrink: 0;
        }

        .page-header .brand h1 {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--lime);
            letter-spacing: -0.02em;
        }

        .page-header .brand h1 span {
            color: var(--text-primary);
            font-weight: 400;
        }

        .page-header .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header .header-actions .event-count {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid var(--border-subtle);
            letter-spacing: 0.02em;
        }

        .page-header .header-actions .event-count strong {
            color: var(--text-primary);
            font-weight: 700;
        }

        /* ============================================================
           SEARCH BAR
           ============================================================ */
        .search-wrapper {
            margin-bottom: 1.5rem;
        }

        .search-wrapper .search-input {
            width: 100%;
            padding: 0.9rem 1.2rem 0.9rem 3rem;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            font-family: inherit;
            font-size: 0.9rem;
            background: var(--bg-surface);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .search-wrapper .search-input:focus {
            border-color: var(--lime);
            box-shadow: 0 0 0 4px var(--lime-glow), var(--shadow-sm);
        }

        .search-wrapper .search-input::placeholder {
            color: var(--text-dim);
            font-weight: 400;
        }

        .search-wrapper .search-icon {
            position: relative;
        }

        .search-wrapper .search-icon i {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 0.95rem;
            pointer-events: none;
        }

        /* ============================================================
           EVENT LIST
           ============================================================ */
        .event-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .event-item {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 1.1rem 1.2rem;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
        }

        .event-item:hover {
            border-color: var(--lime);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .event-item:active {
            transform: scale(0.99);
        }

        /* Avatar / Icon */
        .event-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--lime) 0%, #9aa800 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            position: relative;
        }

        .event-avatar .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #10b981;
            border: 2px solid var(--bg-surface);
            border-radius: 50%;
        }

        .event-avatar .status-dot.draft {
            background: #f59e0b;
        }

        /* Content */
        .event-content {
            flex: 1;
            min-width: 0;
        }

        .event-top-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
            gap: 10px;
        }

        .event-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.01em;
        }

        .event-time {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        .event-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .event-meta i {
            color: var(--lime);
            font-size: 0.7rem;
        }

        .event-meta .badge-status {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 2px 12px;
            border-radius: 40px;
            background: rgba(16, 185, 129, 0.10);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.15);
        }

        .event-meta .badge-status.draft {
            background: rgba(245, 158, 11, 0.10);
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.15);
        }

        /* Actions (hover) */
        .event-actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transform: translateX(8px);
            transition: var(--transition);
            flex-shrink: 0;
        }

        .event-item:hover .event-actions {
            opacity: 1;
            transform: translateX(0);
        }

        .action-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border-subtle);
            background: var(--bg-surface);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
        }

        .action-btn:hover {
            background: var(--pink);
            color: #fff;
            border-color: var(--pink);
            box-shadow: 0 0 20px var(--pink-glow);
        }

        .action-btn.edit:hover {
            background: var(--lime);
            border-color: var(--lime);
            color: #fff;
        }

        /* ============================================================
           EMPTY STATE – WARM & INVITING
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 3.5rem 2rem 4rem;
            background: var(--bg-surface);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
            margin-top: 0.5rem;
        }

        .empty-state .empty-illustration {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--lime-light) 0%, rgba(176, 184, 0, 0.08) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            color: var(--lime);
            box-shadow: 0 0 60px var(--lime-glow);
        }

        .empty-state h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            font-size: 0.95rem;
            color: var(--text-muted);
            max-width: 380px;
            margin: 0 auto 1.8rem;
            line-height: 1.6;
        }

        .empty-state p em {
            font-style: normal;
            color: var(--pink);
            font-weight: 600;
        }

        .btn-create-event {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--lime), #9aa800);
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.9rem 2.4rem;
            border-radius: 60px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            letter-spacing: -0.01em;
            box-shadow: 0 0 40px rgba(176, 184, 0, 0.15);
        }

        .btn-create-event:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 0 60px rgba(176, 184, 0, 0.25);
        }

        .btn-create-event i {
            font-size: 1.1rem;
        }

        /* ============================================================
           RENAME MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 26, 43, 0.50);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-surface);
            padding: 2rem 2rem 1.8rem;
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
            transform: translateY(24px) scale(0.96);
            transition: var(--transition);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0) scale(1);
        }

        .modal-card h3 {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .modal-card .modal-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
        }

        .modal-card input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid var(--border-subtle);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--bg-body);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
            margin-bottom: 1.5rem;
        }

        .modal-card input:focus {
            border-color: var(--lime);
            box-shadow: 0 0 0 4px var(--lime-glow);
            background: var(--bg-surface);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 0.7rem 1.6rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.85rem;
            font-family: inherit;
            transition: var(--transition);
        }

        .btn-cancel {
            background: var(--bg-body);
            color: var(--text-muted);
        }

        .btn-cancel:hover {
            background: var(--border-subtle);
        }

        .btn-save {
            background: var(--text-primary);
            color: var(--lime);
        }

        .btn-save:hover {
            background: #0b1a2b;
            box-shadow: 0 0 24px rgba(176, 184, 0, 0.10);
        }

        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ============================================================
           LOADING STATE
           ============================================================ */
        .loading-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .loading-state i {
            font-size: 2rem;
            color: var(--lime);
            margin-bottom: 1rem;
            display: block;
        }

        .loading-state p {
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            body {
                padding: 1rem 0.75rem;
            }

            .page-header {
                margin-bottom: 1.25rem;
                flex-wrap: wrap;
                gap: 8px;
            }

            .page-header .brand .logo-mark {
                width: 34px;
                height: 34px;
                font-size: 1rem;
            }

            .page-header .brand h1 {
                font-size: 1rem;
            }

            .page-header .header-actions .event-count {
                font-size: 0.6rem;
                padding: 3px 10px;
            }

            .search-wrapper {
                margin-bottom: 1rem;
            }

            .search-wrapper .search-input {
                padding: 0.75rem 1rem 0.75rem 2.6rem;
                font-size: 0.85rem;
                border-radius: var(--radius-md);
            }

            .search-wrapper .search-icon i {
                left: 0.9rem;
                font-size: 0.85rem;
            }

            .event-item {
                padding: 0.9rem 1rem;
                border-radius: var(--radius-md);
                gap: 12px;
            }

            .event-avatar {
                width: 44px;
                height: 44px;
                font-size: 1rem;
            }

            .event-avatar .status-dot {
                width: 10px;
                height: 10px;
            }

            .event-name {
                font-size: 0.9rem;
            }

            .event-time {
                font-size: 0.6rem;
            }

            .event-meta {
                font-size: 0.7rem;
            }

            .event-meta .badge-status {
                font-size: 0.5rem;
                padding: 1px 10px;
            }

            .event-actions {
                opacity: 1;
                transform: translateX(0);
            }

            .action-btn {
                width: 30px;
                height: 30px;
                font-size: 0.7rem;
            }

            .empty-state {
                padding: 2.5rem 1.5rem 3rem;
            }

            .empty-state .empty-illustration {
                width: 90px;
                height: 90px;
                font-size: 2.4rem;
            }

            .empty-state h2 {
                font-size: 1.3rem;
            }

            .empty-state p {
                font-size: 0.85rem;
            }

            .btn-create-event {
                font-size: 0.9rem;
                padding: 0.75rem 1.8rem;
            }

            .modal-card {
                padding: 1.5rem;
            }
        }

        @media (max-width: 400px) {
            .event-top-row {
                flex-wrap: wrap;
            }

            .event-time {
                margin-left: auto;
            }
        }

        /* ============================================================
           UTILITY – HIDE SCROLLBAR
           ============================================================ */
        .event-list::-webkit-scrollbar {
            width: 4px;
        }

        .event-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .event-list::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ===== HEADER ===== -->
        <header class="page-header">
            <a href="index.html" class="brand">
                <div class="logo-mark">Z</div>
                <h1>Zone<span>21</span></h1>
            </a>
            <div class="header-actions">
                <span class="event-count" id="event-count"><strong>0</strong> events</span>
            </div>
        </header>

        <!-- ===== SEARCH ===== -->
        <div class="search-wrapper">
            <div class="search-icon">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" id="search-input" placeholder="Search your events..." onkeyup="filterEvents()">
            </div>
        </div>

        <!-- ===== EVENT LIST ===== -->
        <ul class="event-list" id="event-list-container">
            <!-- Injected by JavaScript -->
            <li class="loading-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading your events…</p>
            </li>
        </ul>

    </div>

    <!-- ===== RENAME MODAL ===== -->
    <div class="modal-overlay" id="rename-modal">
        <div class="modal-card">
            <h3>Rename Event</h3>
            <p class="modal-sub">Give your event a fresh name</p>
            <input type="text" id="rename-input" placeholder="Enter new event name" autocomplete="off">
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeRenameModal()">Cancel</button>
                <button class="btn btn-save" id="save-rename-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <script type="module">
        // ================================================================
        //  FIREBASE IMPORTS
        // ================================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ================================================================
        //  FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeEventIdToRename = null;

        // ================================================================
        //  AUTH GUARD
        // ================================================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadEvents();
            } else {
                window.location.href = "index.html";
            }
        });

        // ================================================================
        //  HELPERS
        // ================================================================
        function formatTime(timestamp) {
            if (!timestamp) return 'Just now';
            let dateObj;
            if (typeof timestamp.toDate === 'function') dateObj = timestamp.toDate();
            else if (timestamp.seconds) dateObj = new Date(timestamp.seconds * 1000);
            else dateObj = new Date(timestamp);

            const now = new Date();
            const diff = Math.floor((now - dateObj) / (1000 * 60 * 60 * 24));

            if (diff === 0) {
                return dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (diff === 1) {
                return 'Yesterday';
            } else if (diff < 7) {
                return dateObj.toLocaleDateString('en-US', { weekday: 'short' });
            } else {
                return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
        }

        function getStatusBadge(status) {
            const s = (status || 'approved').toLowerCase();
            if (s === 'draft') {
                return `<span class="badge-status draft">Draft</span>`;
            }
            return `<span class="badge-status">Approved</span>`;
        }

        // ================================================================
        //  LOAD EVENTS
        // ================================================================
        async function loadEvents() {
            const container = document.getElementById('event-list-container');

            try {
                const q = query(
                    collection(db, 'events'),
                    where('organizerId', '==', currentUser.uid)
                );
                const querySnapshot = await getDocs(q);

                let events = [];
                querySnapshot.forEach(doc => {
                    events.push({ id: doc.id, ...doc.data() });
                });

                // Show ONLY approved & draft (hide pending_payment etc.)
                const filtered = events.filter(e => {
                    const status = (e.status || 'approved').toLowerCase();
                    return status === 'approved' || status === 'draft';
                });

                // Sort by newest first
                filtered.sort((a, b) => {
                    const da = a.createdAt?.seconds || 0;
                    const db2 = b.createdAt?.seconds || 0;
                    return db2 - da;
                });

                const count = filtered.length;
                document.getElementById('event-count').innerHTML = `<strong>${count}</strong> event${count !== 1 ? 's' : ''}`;

                if (count === 0) {
                    // ---- EMPTY STATE - WARM & INVITING ----
                    container.innerHTML = `
                        <li class="empty-state">
                            <div class="empty-illustration">
                                <i class="fas fa-calendar-plus"></i>
                            </div>
                            <h2>Let's create something amazing</h2>
                            <p>
                                You haven't created any events yet. 
                                <em>Zone21's advanced tools</em> are waiting for you — 
                                start building your first event today.
                            </p>
                            <a href="subscription.html" class="btn-create-event">
                                <i class="fas fa-plus-circle"></i> Create Event
                            </a>
                        </li>
                    `;
                    return;
                }

                // ---- RENDER EVENT LIST ----
                container.innerHTML = filtered.map(event => {
                    const name = event.name || 'Untitled Event';
                    const pkg = event.package || 'Event Package';
                    const time = formatTime(event.createdAt);
                    const statusBadge = getStatusBadge(event.status);
                    const isDraft = (event.status || 'approved').toLowerCase() === 'draft';

                    return `
                        <li class="event-item" data-name="${name.toLowerCase()}" onclick="goToManageEvent('${event.id}')">
                            <div class="event-avatar">
                                <i class="fas fa-calendar-star"></i>
                                <div class="status-dot ${isDraft ? 'draft' : ''}"></div>
                            </div>
                            <div class="event-content">
                                <div class="event-top-row">
                                    <div class="event-name" id="name-${event.id}">${name}</div>
                                    <div class="event-time">${time}</div>
                                </div>
                                <div class="event-meta">
                                    <i class="fas fa-tag"></i> ${pkg}
                                    ${statusBadge}
                                </div>
                            </div>
                            <div class="event-actions">
                                <button class="action-btn edit" title="Rename" onclick="event.stopPropagation(); openRenameModal('${event.id}', '${name.replace(/'/g, "\\'")}')">
                                    <i class="fas fa-pen"></i>
                                </button>
                            </div>
                        </li>
                    `;
                }).join('');

            } catch (error) {
                console.error("Error loading events:", error);
                container.innerHTML = `
                    <li class="empty-state">
                        <div class="empty-illustration" style="background: rgba(224,0,106,0.06); color: var(--pink);">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <h2>Something went wrong</h2>
                        <p>We couldn't load your events. Please check your connection and try again.</p>
                        <button class="btn-create-event" onclick="location.reload()" style="font-size:0.9rem; padding:0.7rem 1.8rem;">
                            <i class="fas fa-sync"></i> Retry
                        </button>
                    </li>
                `;
            }
        }

        // ================================================================
        //  NAVIGATION
        // ================================================================
        window.goToManageEvent = function(eventId) {
            window.location.href = `manageevent.html?eventId=${eventId}`;
        };

        // ================================================================
        //  SEARCH
        // ================================================================
        window.filterEvents = function() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const items = document.querySelectorAll('.event-item');
            items.forEach(item => {
                const name = item.getAttribute('data-name');
                item.style.display = name && name.includes(query) ? 'flex' : 'none';
            });
        };

        // ================================================================
        //  RENAME MODAL
        // ================================================================
        const modal = document.getElementById('rename-modal');
        const renameInput = document.getElementById('rename-input');
        const saveBtn = document.getElementById('save-rename-btn');

        window.openRenameModal = function(eventId, currentName) {
            activeEventIdToRename = eventId;
            renameInput.value = currentName;
            modal.classList.add('active');
            setTimeout(() => renameInput.focus(), 120);
        };

        window.closeRenameModal = function() {
            modal.classList.remove('active');
            activeEventIdToRename = null;
        };

        saveBtn.addEventListener('click', async () => {
            if (!activeEventIdToRename) return;

            const newName = renameInput.value.trim();
            if (!newName) {
                alert("Event name cannot be empty.");
                return;
            }

            const originalText = saveBtn.innerText;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving';
            saveBtn.disabled = true;

            try {
                const ref = doc(db, 'events', activeEventIdToRename);
                await setDoc(ref, { name: newName }, { merge: true });

                // Update UI instantly
                const nameEl = document.getElementById(`name-${activeEventIdToRename}`);
                if (nameEl) {
                    nameEl.innerText = newName;
                    nameEl.closest('.event-item').setAttribute('data-name', newName.toLowerCase());
                }

                closeRenameModal();
            } catch (error) {
                console.error("Rename error:", error);
                alert("Failed to rename. Please check your permissions.");
            } finally {
                saveBtn.innerText = originalText;
                saveBtn.disabled = false;
            }
        });

        // Click outside to close
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeRenameModal();
        });

        // Enter key to save
        renameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveBtn.click();
        });
    </script>
</body>
</html>
