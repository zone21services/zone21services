<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>My Events · Zone21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0A1E2C;
            --navy-800: #102838;
            --lime: #C0C800;
            --lime-hover: #D4DC00;
            --lime-soft: rgba(192,200,0,.10);
            --gold: #C9A961;
            --gold-deep: #9C7F3F;
            --green: #0F9D6E;
            --green-soft: rgba(15,157,110,.10);
            --pink: #F80070;
            --pink-soft: rgba(248,0,112,.10);
            --amber: #F5B400;
            --amber-soft: rgba(245,180,0,.10);
            --purple: #7C3AED;
            --purple-soft: rgba(124,58,237,.10);
            --blue: #0A84FF;
            --blue-soft: rgba(10,132,255,.10);
            --ink: #0F172A;
            --body: #475569;
            --muted: #7A8899;
            --line: #E6EAF0;
            --line-strong: #D3DAE3;
            --canvas: #F6F7F9;
            --danger: #D92D20;
            --shadow-sm: 0 1px 3px rgba(10,30,44,.05);
            --shadow-md: 0 6px 20px -6px rgba(10,30,44,.10);
            --shadow-lg: 0 24px 48px -20px rgba(10,30,44,.20);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: var(--canvas);
            color: var(--ink);
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* ══════════════════════════════════════════════
           HEADER
        ══════════════════════════════════════════════ */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--navy);
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-left h1 i {
            color: var(--gold-deep);
            font-size: 1.6rem;
        }

        .header-left p {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 500;
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-create {
            background: var(--lime);
            color: var(--navy);
            padding: 12px 22px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 8px 24px -8px rgba(192,200,0,.4);
            border: none;
            cursor: pointer;
        }

        .btn-create:hover {
            background: var(--lime-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(192,200,0,.5);
        }

        .btn-refresh {
            background: #fff;
            color: var(--navy);
            border: 1px solid var(--line-strong);
            padding: 11px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-refresh:hover {
            background: var(--canvas);
            border-color: var(--navy);
        }

        /* ══════════════════════════════════════════════
           EVENT LIST
        ══════════════════════════════════════════════ */
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .event-card {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            overflow: hidden;
            position: relative;
        }

        .event-card:hover {
            border-color: var(--line-strong);
            box-shadow: var(--shadow-md);
        }

        .event-card.expanded {
            border-color: var(--lime);
            box-shadow: var(--shadow-lg);
        }

        /* Card Header (Clickable) */
        .event-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .event-header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 20px; right: 20px;
            height: 1px;
            background: var(--line);
            transition: var(--transition);
        }

        .event-card.expanded .event-header::after {
            background: transparent;
        }

        .event-icon {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--navy-800), var(--navy));
            color: var(--lime);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(10,30,44,.2);
        }

        .event-info {
            flex: 1;
            min-width: 0;
        }

        .event-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--navy);
            letter-spacing: -0.01em;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-meta {
            font-size: 0.78rem;
            color: var(--muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .event-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .event-meta i {
            color: var(--gold-deep);
            font-size: 0.7rem;
        }

        .event-chevron {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--canvas);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .event-card.expanded .event-chevron {
            transform: rotate(180deg);
            background: var(--lime-soft);
            color: var(--lime-deep);
        }

        /* Expandable Body */
        .event-body {
            display: none;
            padding: 20px;
            background: #fff;
            animation: slideDown 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .event-card.expanded .event-body {
            display: block;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--canvas);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
        }

        .stat-box .lbl {
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-box .val {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--navy);
            line-height: 1;
        }

        .stat-box .sub {
            font-size: 0.7rem;
            color: var(--muted);
            font-weight: 600;
            margin-top: 4px;
        }

        .stat-box.green .val { color: var(--green); }
        .stat-box.gold .val { color: var(--gold-deep); }

        /* Vendor Quick List */
        .section-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vendor-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .vendor-chip {
            background: #fff;
            border: 1px solid var(--line-strong);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--body);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vendor-chip i {
            font-size: 0.65rem;
            color: var(--green);
        }

        .vendor-chip.pending { border-color: rgba(245,180,0,.4); background: var(--amber-soft); }
        .vendor-chip.pending i { color: var(--amber); }
        .vendor-chip.declined { border-color: rgba(212,133,107,.4); background: var(--coral-soft); }
        .vendor-chip.declined i { color: var(--coral); }

        .vendor-chip.empty {
            border-style: dashed;
            background: transparent;
            color: var(--muted);
            font-style: italic;
        }

        /* Action Buttons */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            border-top: 1px solid var(--line);
            padding-top: 20px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 800;
            text-decoration: none;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .action-btn.primary {
            background: var(--navy);
            color: #fff;
        }
        .action-btn.primary:hover { background: var(--navy-800); transform: translateY(-2px); box-shadow: var(--shadow-md); }

        .action-btn.publish {
            background: var(--purple);
            color: #fff;
        }
        .action-btn.publish:hover { background: #6D28D9; transform: translateY(-2px); box-shadow: 0 6px 20px -6px rgba(124,58,237,.4); }

        .action-btn.pay {
            background: var(--green-soft);
            color: var(--green);
            border: 1px solid rgba(15,157,110,.2);
        }
        .action-btn.pay:hover { background: var(--green); color: #fff; transform: translateY(-2px); }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: #fff;
            border-radius: var(--radius);
            border: 1.5px dashed var(--line-strong);
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--lime-soft);
            color: var(--lime-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
        }

        .empty-state h3 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            font-size: 0.9rem;
            color: var(--muted);
            max-width: 400px;
            margin: 0 auto 1.5rem;
            line-height: 1.6;
        }

        /* Loading */
        .loading-state {
            text-align: center;
            padding: 4rem;
            color: var(--muted);
        }
        .loading-state i {
            font-size: 2rem;
            color: var(--lime-deep);
            margin-bottom: 1rem;
            display: block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Badges */
        .badge {
            font-size: 0.6rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 999px;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge.approved, .badge.active { background: var(--green-soft); color: var(--green); }
        .badge.draft { background: var(--blue-soft); color: var(--blue); }
        .badge.pending { background: var(--amber-soft); color: #9A6E00; }
        .badge.rejected { background: var(--pink-soft); color: var(--danger); }

        /* Toast */
        #toast { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast-msg { background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px; border-left: 3px solid var(--lime); animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 640px) {
            body { padding: 1rem 1rem 3rem; }
            .page-header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; }
            .btn-create { flex: 1; justify-content: center; }
            .event-header { padding: 16px; gap: 12px; }
            .event-icon { width: 44px; height: 44px; font-size: 1.1rem; border-radius: 12px; }
            .event-name { font-size: 1rem; }
            .event-body { padding: 16px; }
            .action-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <div class="app-container">
        <header class="page-header">
            <div class="header-left">
                <h1><i class="fas fa-calendar-check"></i> My Events</h1>
                <p>Manage your vendors, tickets, and event details.</p>
            </div>
            <div class="header-actions">
                <button class="btn-refresh" onclick="loadEventsData()" title="Refresh events">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
                <a href="createevent.html" class="btn-create">
                    <i class="fas fa-plus-circle"></i> Create New Event
                </a>
            </div>
        </header>

        <ul class="event-list" id="event-list-container">
            <li class="loading-state">
                <i class="fas fa-circle-notch"></i>
                <p>Loading your workspace…</p>
            </li>
        </ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userEvents = [];
        let userAssignments = [];
        let userBlueprints = [];
        
        let unsubEvents = null;
        let unsubAssign = null;

        // Start on auth
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                initDataListeners();
            } else {
                window.location.href = "index.html";
            }
        });

        // Realtime listeners for Events & Assignments (Vendors)
        function initDataListeners() {
            if (unsubEvents) unsubEvents();
            if (unsubAssign) unsubAssign();

            // Listen to Events
            const qEvents = query(collection(db, 'events'), where('organizerId', '==', currentUser.uid));
            unsubEvents = onSnapshot(qEvents, (snap) => {
                userEvents = [];
                snap.forEach(d => userEvents.push({ id: d.id, ...d.data() }));
                renderDashboard();
            });

            // Listen to Assignments (Vendors)
            const qAssign = query(collection(db, 'assignments'), where('organizerId', '==', currentUser.uid));
            unsubAssign = onSnapshot(qAssign, (snap) => {
                userAssignments = [];
                snap.forEach(d => userAssignments.push({ id: d.id, ...d.data() }));
                renderDashboard();
            });

            // Fetch Blueprints (one-time fetch or listen)
            fetchBlueprints();
        }

        async function fetchBlueprints() {
            try {
                const q = query(collection(db, 'blueprints'), where('userId', '==', currentUser.uid));
                const snap = await getDocs(q);
                userBlueprints = [];
                snap.forEach(d => userBlueprints.push({ id: d.id, ...d.data() }));
                renderDashboard();
            } catch(e) {
                console.warn("Blueprint fetch failed", e);
            }
        }

        window.loadEventsData = () => {
            toast("Refreshing data...");
            initDataListeners();
        };

        function renderDashboard() {
            const container = document.getElementById('event-list-container');
            if (!container) return;

            // Remove placeholders if any
            const validEvents = userEvents.filter(e => !e.fromSubscription && !e.isPlaceholder);
            
            // Sort by newest
            validEvents.sort((a, b) => {
                const da = a.createdAt?.toMillis?.() || a.createdAt?.seconds * 1000 || 0;
                const db2 = b.createdAt?.toMillis?.() || b.createdAt?.seconds * 1000 || 0;
                return db2 - da;
            });

            if (validEvents.length === 0) {
                container.innerHTML = `
                    <li class="empty-state">
                        <div class="empty-icon"><i class="fas fa-calendar-plus"></i></div>
                        <h3>No events yet</h3>
                        <p>Start planning your first event to manage vendors, generate blueprints, and sell tickets.</p>
                        <a href="createevent.html" class="btn-create" style="display:inline-flex;">
                            <i class="fas fa-plus-circle"></i> Create Your First Event
                        </a>
                    </li>`;
                return;
            }

            container.innerHTML = validEvents.map(event => {
                // 1. Calculate Stats for THIS event only
                const eventAssignments = userAssignments.filter(a => a.eventId === event.id);
                
                const acceptedVendors = eventAssignments.filter(a => a.status === 'accepted');
                const pendingVendors = eventAssignments.filter(a => a.status === 'invited');
                
                // Calculate finances
                let totalCommitted = 0;
                let totalPaid = 0;
                
                eventAssignments.forEach(a => {
                    if (['accepted', 'paid_deposit', 'paid_full'].includes(a.status)) {
                        const amt = Number(a.priceUsd) || Number(a.selectedTier?.priceUsd) || 0;
                        totalCommitted += amt;
                        if (a.status === 'paid_full') totalPaid += amt;
                        if (a.status === 'paid_deposit') totalPaid += (amt * 0.5);
                    }
                });

                // Format currency (simplified for this page)
                const fmtMoney = (val) => '$' + Math.round(val).toLocaleString();
                const budget = event.budget || event.eventBudget || 0;

                // 2. Check Blueprint
                const hasBlueprint = userBlueprints.some(b => b.sessionId === event.id || b.eventData?.name === event.name);
                
                // 3. Status Badge
                const status = String(event.status || 'draft').toLowerCase();
                let statusBadge = '';
                if (['approved', 'active'].includes(status)) statusBadge = '<span class="badge active"><i class="fas fa-check-circle"></i> Live</span>';
                else if (status === 'pending') statusBadge = '<span class="badge pending"><i class="fas fa-clock"></i> Pending</span>';
                else statusBadge = '<span class="badge draft"><i class="fas fa-pen"></i> Draft</span>';

                // 4. Build Vendor Chips
                let vendorHtml = '';
                if (eventAssignments.length === 0) {
                    vendorHtml = `<div class="vendor-chip empty"><i class="fas fa-search"></i> No vendors invited yet</div>`;
                } else {
                    vendorHtml = eventAssignments.slice(0, 6).map(a => {
                        const cls = a.status === 'accepted' ? '' : a.status === 'invited' ? 'pending' : 'declined';
                        const icon = a.status === 'accepted' ? 'fa-check-circle' : a.status === 'invited' ? 'fa-clock' : 'fa-times-circle';
                        return `<div class="vendor-chip ${cls}"><i class="fas ${icon}"></i> ${a.service || 'Vendor'}</div>`;
                    }).join('');
                    
                    if (eventAssignments.length > 6) {
                        vendorHtml += `<div class="vendor-chip empty">+${eventAssignments.length - 6} more</div>`;
                    }
                }

                // 5. Date formatting
                const dateStr = event.date || event.eventDate || 'Date TBD';

                return `
                <li class="event-card" id="card-${event.id}">
                    <div class="event-header" onclick="toggleEvent('${event.id}')">
                        <div class="event-icon"><i class="fas fa-calendar-star"></i></div>
                        <div class="event-info">
                            <div class="event-name">${event.name || event.eventName || 'Untitled Event'}</div>
                            <div class="event-meta">
                                <span><i class="fas fa-calendar-day"></i> ${dateStr}</span>
                                <span><i class="fas fa-tag"></i> ${event.type || 'Event'}</span>
                                ${statusBadge}
                            </div>
                        </div>
                        <div class="event-chevron"><i class="fas fa-chevron-down"></i></div>
                    </div>

                    <div class="event-body">
                        <!-- Stats Grid -->
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="lbl"><i class="fas fa-wallet"></i> Budget</div>
                                <div class="val">${fmtMoney(budget)}</div>
                            </div>
                            <div class="stat-box gold">
                                <div class="lbl"><i class="fas fa-file-invoice-dollar"></i> Committed</div>
                                <div class="val">${fmtMoney(totalCommitted)}</div>
                                <div class="sub">${eventAssignments.length} services</div>
                            </div>
                            <div class="stat-box green">
                                <div class="lbl"><i class="fas fa-check-double"></i> Paid</div>
                                <div class="val">${fmtMoney(totalPaid)}</div>
                                <div class="sub">${acceptedVendors.length} vendors ready</div>
                            </div>
                        </div>

                        <!-- Vendors -->
                        <div class="section-title"><i class="fas fa-users"></i> Vendors Overview</div>
                        <div class="vendor-chips">
                            ${vendorHtml}
                        </div>

                        <!-- Actions -->
                        <div class="action-grid">
                            <a href="ai-blueprint.html" class="action-btn primary">
                                <i class="fas fa-layer-group"></i> ${hasBlueprint ? 'View Blueprint' : 'Plan Event'}
                            </a>
                            <a href="createevent.html?eventId=${event.id}" class="action-btn publish">
                                <i class="fas fa-ticket-alt"></i> Create Tickets / Publish
                            </a>
                            <a href="vendorpayments.html" class="action-btn pay">
                                <i class="fas fa-coins"></i> Pay Vendors
                            </a>
                        </div>
                    </div>
                </li>
                `;
            }).join('');
        }

        // Toggle Expand/Collapse
        window.toggleEvent = (id) => {
            const card = document.getElementById(`card-${id}`);
            if (!card) return;

            // Optional: Close others
            document.querySelectorAll('.event-card').forEach(c => {
                if (c.id !== `card-${id}`) c.classList.remove('expanded');
            });

            card.classList.toggle('expanded');
        };

        // Toast utility
        function toast(msg) {
            const c = document.getElementById('toast');
            const t = document.createElement('div');
            t.className = 'toast-msg';
            t.innerHTML = `<i class="fas fa-info-circle" style="color:var(--lime);"></i> <span>${msg}</span>`;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }
    </script>
</body>
</html>
