<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Zone21 · Organizer Inbox</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ── ZONE21 · LIME · NAVY · PINK ── */
        :root {
            --bg-page: #F0F4F0;
            --bg-surface: #FFFFFF;
            --bg-input: #F2F6F2;
            --bg-hover: #F3F9F3;
            --bg-active: #E8F5E8;

            --navy: #0A2540;
            --navy-light: #1A3A5C;
            --navy-glow: rgba(10, 37, 64, 0.08);

            --lime: #84CC16;
            --lime-bright: #A3E635;
            --lime-soft: rgba(132, 204, 22, 0.12);
            --lime-glow: rgba(132, 204, 22, 0.25);

            --pink: #EC4899;
            --pink-soft: rgba(236, 72, 153, 0.10);
            --pink-glow: rgba(236, 72, 153, 0.20);

            --text-primary: #0A2540;
            --text-secondary: #3D5A73;
            --text-muted: #7A8F9F;
            --border-light: #DFE8DF;
            --border-strong: #C5D6C5;

            --shadow-sm: 0 1px 3px rgba(10, 37, 64, 0.06);
            --shadow-md: 0 4px 20px rgba(10, 37, 64, 0.07);
            --shadow-lg: 0 12px 48px rgba(10, 37, 64, 0.10);
            --shadow-xl: 0 20px 60px rgba(10, 37, 64, 0.16);

            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 9999px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: 0.25s cubic-bezier(0.16, 1, 0.3, 1);

            --unread-dot: #EC4899;
            --badge-unread: #EC4899;
            --online-green: #84CC16;

            --bubble-in: #FFFFFF;
            --bubble-out-start: #0A2540;
            --bubble-out-end: #1A3A5C;

            --accent-gradient: linear-gradient(135deg, #84CC16, #A3E635);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-page);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .app-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
            background: var(--bg-page);
            overflow: hidden;
        }

        .inbox-container {
            width: 100%;
            max-width: 1380px;
            height: calc(100vh - 24px);
            min-height: 560px;
            background: var(--bg-surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ── LEFT PANEL ── */
        .left-panel {
            width: 400px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-light);
            background: var(--bg-surface);
            flex-shrink: 0;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
            z-index: 2;
            position: relative;
        }

        .left-panel-header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            background: var(--bg-surface);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--navy);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--lime);
            font-size: 1.1rem;
            font-weight: 800;
            flex-shrink: 0;
            letter-spacing: -0.5px;
            box-shadow: 0 2px 8px rgba(10, 37, 64, 0.12);
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--navy);
            letter-spacing: -0.4px;
        }
        .brand-title .highlight {
            color: var(--lime);
        }
        .brand-title .role-tag {
            font-size: 0.6rem;
            font-weight: 700;
            color: #fff;
            background: var(--pink);
            padding: 2px 12px;
            border-radius: var(--radius-full);
            margin-left: 8px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            vertical-align: middle;
            box-shadow: 0 2px 6px rgba(236, 72, 153, 0.25);
        }

        .brand-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: -2px;
            padding-left: 52px;
        }
        .brand-sub i {
            color: var(--lime);
            margin-right: 4px;
        }

        .badge-unread-count {
            background: var(--badge-unread);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            min-width: 22px;
            height: 22px;
            padding: 0 8px;
            border-radius: var(--radius-full);
            display: none;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            animation: pulseBadge 2.5s infinite;
            margin-left: auto;
            box-shadow: 0 2px 8px rgba(236, 72, 153, 0.3);
        }
        .badge-unread-count.visible {
            display: inline-flex;
        }
        @keyframes pulseBadge {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(236, 72, 153, 0);
            }
        }

        .thread-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
        }

        .thread-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            margin: 2px 0;
            border: 1px solid transparent;
        }
        .thread-item:hover {
            background: var(--bg-hover);
            border-color: var(--border-light);
        }
        .thread-item.active {
            background: var(--bg-active);
            border-color: var(--lime);
            box-shadow: 0 0 0 2px var(--lime-soft);
        }
        .thread-item.unread .thread-name {
            font-weight: 700;
            color: var(--navy);
        }

        .thread-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
            background: linear-gradient(135deg, #E8F0E8, #D4E6D4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--navy);
            letter-spacing: -0.3px;
            overflow: hidden;
            position: relative;
            border: 2px solid var(--bg-surface);
            box-shadow: 0 2px 8px rgba(10, 37, 64, 0.06);
        }
        .thread-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thread-avatar .status-dot {
            position: absolute;
            bottom: 0px;
            right: 0px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--online-green);
            border: 2.5px solid var(--bg-surface);
            display: none;
            box-shadow: 0 0 0 1px rgba(132, 204, 22, 0.3);
        }
        .thread-avatar .status-dot.online {
            display: block;
        }

        .thread-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .thread-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .thread-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .thread-time {
            font-size: 0.6rem;
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
            font-weight: 500;
        }
        .thread-subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .thread-preview {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .thread-preview i {
            font-size: 0.6rem;
            color: var(--lime);
        }
        .thread-preview .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--unread-dot);
            flex-shrink: 0;
            display: none;
            box-shadow: 0 0 0 2px rgba(236, 72, 153, 0.2);
        }
        .thread-item.unread .unread-dot {
            display: inline-block;
        }

        .thread-item-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            opacity: 0;
            transition: var(--transition);
            align-items: center;
        }
        .thread-item:hover .thread-item-actions {
            opacity: 1;
        }
        .btn-icon-sm {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.7rem;
        }
        .btn-icon-sm:hover {
            background: #E8F0E8;
            color: var(--navy);
        }
        .btn-icon-sm.danger:hover {
            background: var(--pink-soft);
            color: var(--pink);
        }

        /* ── RIGHT PANEL ── */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-page);
            min-width: 0;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
        }
        .right-panel.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F6FAF6;
        }
        .empty-chat-state {
            text-align: center;
            color: var(--text-muted);
            padding: 48px;
        }
        .empty-chat-state .icon-wrap {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: var(--lime-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border: 2px solid rgba(132, 204, 22, 0.15);
        }
        .empty-chat-state .icon-wrap i {
            font-size: 2.4rem;
            color: var(--lime);
        }
        .empty-chat-state h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 4px;
        }
        .empty-chat-state p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* ── CHAT HEADER ── */
        .chat-header {
            background: var(--bg-surface);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 12px;
            border-bottom: 2px solid var(--border-light);
            flex-wrap: wrap;
        }
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            flex: 1;
        }
        .chat-header-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: linear-gradient(135deg, #E8F0E8, #D4E6D4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--navy);
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
            border: 2px solid var(--bg-surface);
            box-shadow: 0 2px 8px rgba(10, 37, 64, 0.06);
        }
        .chat-header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .chat-header-avatar .status-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--online-green);
            border: 2.5px solid var(--bg-surface);
            display: none;
            box-shadow: 0 0 0 1px rgba(132, 204, 22, 0.3);
        }
        .chat-header-avatar .status-dot.online {
            display: block;
        }
        .chat-header-info h3 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--navy);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-header-info span {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: block;
            font-weight: 500;
        }
        .chat-header-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .btn-header-action {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: var(--font);
        }
        .btn-header-action:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong);
        }
        .btn-header-action.delete {
            color: var(--pink);
            border-color: rgba(236, 72, 153, 0.2);
        }
        .btn-header-action.delete:hover {
            background: var(--pink-soft);
            border-color: rgba(236, 72, 153, 0.3);
        }
        .btn-header-action i {
            font-size: 0.7rem;
        }
        .btn-header-action .back-arrow {
            display: none;
        }

        /* ── CHAT MESSAGES ── */
        .chat-messages {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #F6FAF6;
        }

        .chat-date-divider {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-muted);
            padding: 10px 0 6px;
            letter-spacing: 0.4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .chat-bubble {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 0.88rem;
            line-height: 1.5;
            word-wrap: break-word;
            box-shadow: var(--shadow-sm);
            position: relative;
            animation: msgIn 0.25s ease;
        }
        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(6px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .bubble-in {
            background: var(--bubble-in);
            border: 1px solid var(--border-light);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
        }
        .bubble-out {
            background: linear-gradient(135deg, var(--bubble-out-start), var(--bubble-out-end));
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bubble-time {
            font-size: 0.6rem;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }
        .bubble-in .bubble-time {
            color: var(--text-muted);
        }
        .bubble-out .bubble-time {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ── CHAT IMAGE (BASE64) ── */
        .chat-image-wrap {
            margin: 4px 0 2px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.04);
            max-width: 320px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .chat-image-wrap:hover {
            opacity: 0.92;
        }
        .chat-image-wrap img {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            display: block;
            border-radius: 12px;
        }
        .bubble-out .chat-image-wrap {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .chat-image-caption {
            margin-top: 2px;
            font-size: 0.75rem;
            opacity: 0.7;
        }

        /* ── ATTACHMENT PREVIEW ── */
        #attachment-preview {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 8px 18px;
            background: var(--lime-soft);
            border-top: 2px solid rgba(132, 204, 22, 0.2);
            font-size: 0.8rem;
            color: var(--navy);
            flex-shrink: 0;
        }
        #attachment-preview .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }
        #attachment-preview .file-info i {
            font-size: 1rem;
            color: var(--lime);
        }
        #attachment-preview .file-info span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        #attachment-preview .file-info .file-size {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 400;
        }
        #attachment-preview .remove-file {
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 700;
            padding: 4px 8px;
            transition: var(--transition);
            font-size: 1rem;
            line-height: 1;
            border-radius: 50%;
        }
        #attachment-preview .remove-file:hover {
            background: rgba(0, 0, 0, 0.04);
            color: var(--pink);
        }

        /* ── CHAT INPUT ── */
        .chat-input-area {
            padding: 10px 16px 12px;
            background: var(--bg-surface);
            border-top: 2px solid var(--border-light);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-input-box {
            flex: 1;
            padding: 10px 18px;
            border: 2px solid var(--border-light);
            border-radius: var(--radius-full);
            font-size: 0.88rem;
            font-family: var(--font);
            outline: none;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: var(--transition);
            min-width: 0;
        }
        .chat-input-box:focus {
            background: #fff;
            border-color: var(--lime);
            box-shadow: 0 0 0 4px var(--lime-soft);
        }
        .chat-input-box::placeholder {
            color: var(--text-muted);
        }

        .btn-send {
            background: var(--navy);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font);
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(10, 37, 64, 0.15);
        }
        .btn-send:hover {
            background: var(--navy-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(10, 37, 64, 0.2);
        }
        .btn-send:active {
            transform: translateY(0);
        }
        .btn-send i {
            color: var(--lime);
        }

        .btn-attach {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--border-light);
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-attach:hover {
            background: var(--lime-soft);
            color: var(--lime);
            border-color: var(--lime);
        }

        /* ── TOAST ── */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            padding: 12px 18px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }
        .toast.success {
            background: var(--lime);
            color: var(--navy);
        }
        .toast.error {
            background: var(--pink);
        }
        .toast.info {
            background: var(--navy);
        }
        .toast i {
            font-size: 1.1rem;
        }
        @keyframes slideIn {
            from {
                transform: translateX(40px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ── EMPTY THREADS ── */
        .empty-threads {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            color: var(--text-muted);
            text-align: center;
            flex: 1;
        }
        .empty-threads i {

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, doc, getDoc, collection, query, where, orderBy, onSnapshot, addDoc, updateDoc,
            deleteDoc, serverTimestamp } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);

        window.fb = {
            doc,
            getDoc,
            collection,
            query,
            where,
            orderBy,
            onSnapshot,
            addDoc,
            updateDoc,
            deleteDoc,
            serverTimestamp
        };

        // ============================================================
        // FIXED: Correct role names and redirects
        // ============================================================
        onAuthStateChanged(window.auth, async (user) => {
            if (user) {
                const docRef = doc(window.db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) {
                    window.location.href = 'index.html';
                    return;
                }
                const data = docSnap.data();

                // Use 'organizer' (not 'organiser')
                if (data.role !== 'organizer') {
                    // Service providers go to vendorinbox.html (not service-provider-inbox.html)
                    if (data.role === 'service_provider') {
                        window.location.href = 'vendorinbox.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                    return;
                }

                const name = data.name || user.email.split('@')[0];
                window.currentUser = {
                    uid: user.uid,
                    name,
                    email: user.email,
                    avatarUrl: data.avatarUrl || null,
                    role: 'organizer' // store as 'organizer' consistently
                };
                window.setupRealtimeInbox();
            } else {
                window.location.href = 'index.html';
            }
        });

    <script>
        // ── TOAST ──
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'error' ? 'circle-exclamation' : type === 'info' ? 'circle-notch fa-spin' :
                'check-circle';
            toast.innerHTML = `<i class="fa-solid fa-${icon}"></i> ${message}`;
            container.appendChild(toast);
            if (type !== 'info') {
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3800);
            }
            return toast;
        };

        // ── STATE ──
        window.activeChatId = null;
        window.activeChatOtherUid = null;
        window.activeChatOtherData = null;
        let activeChatUnsubscribe = null;
        window.allThreads = [];
        window.chatImageData = null;
        window.userCache = {};
        window.lastReadTimestamps = {};

        try {
            const stored = localStorage.getItem('zone21_organizer_lastReadTimestamps');
            if (stored) window.lastReadTimestamps = JSON.parse(stored);
        } catch (e) { window.lastReadTimestamps = {}; }

        function saveLastReadTimestamps() {
            try {
                localStorage.setItem('zone21_organizer_lastReadTimestamps', JSON.stringify(window
                .lastReadTimestamps));
            } catch (e) { /* ignore */ }
        }

        async function getUserData(uid) {
            if (window.userCache[uid]) return window.userCache[uid];
            try {
                const snap = await window.fb.getDoc(window.fb.doc(window.db, 'users', uid));
                if (snap.exists()) {
                    const data = { id: uid, ...snap.data() };
                    window.userCache[uid] = data;
                    return data;
                }
            } catch (e) { /* ignore */ }
            window.userCache[uid] = { id: uid, name: 'Unknown', avatarUrl: null };
            return window.userCache[uid];
        }

        function formatTimeAgo(timestamp) {
            if (!timestamp) return '';
            let date;
            if (timestamp && typeof timestamp.toDate === 'function') {
                date = timestamp.toDate();
            } else if (timestamp instanceof Date) {
                date = timestamp;
            } else if (typeof timestamp === 'number') {
                date = new Date(timestamp);
            } else if (typeof timestamp === 'string') {
                date = new Date(timestamp);
            } else {
                return '';
            }
            if (isNaN(date.getTime())) return '';
            const now = new Date();
            const diffMs = now - date;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHr = Math.floor(diffMin / 60);
            const diffDays = Math.floor(diffHr / 24);
            if (diffSec < 60) return 'Just now';
            if (diffMin < 60) return `${diffMin}m`;
            if (diffHr < 24) return `${diffHr}h`;
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays}d`;
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function formatMessageTime(timestamp) {
            if (!timestamp) return '';
            let date;
            if (timestamp && typeof timestamp.toDate === 'function') {
                date = timestamp.toDate();
            } else if (timestamp instanceof Date) {
                date = timestamp;
            } else if (typeof timestamp === 'number') {
                date = new Date(timestamp);
            } else if (typeof timestamp === 'string') {
                date = new Date(timestamp);
            } else {
                return '';
            }
            if (isNaN(date.getTime())) return '';
            return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
            return (bytes / 1048576).toFixed(1) + 'MB';
        }

        window.setupRealtimeInbox = function() {
            const inboxQuery = window.fb.query(
                window.fb.collection(window.db, "threads"),
                window.fb.where("participants", "array-contains", window.currentUser.uid)
            );
            window.fb.onSnapshot(inboxQuery, async (snapshot) => {
                window.allThreads = [];
                snapshot.forEach((docSnap) => {
                    window.allThreads.push({ id: docSnap.id, ...docSnap.data() });
                });
                window.allThreads.sort((a, b) => {
                    const aTime = a.updatedAt ? (a.updatedAt.toDate ? a.updatedAt.toDate().getTime() : new Date(
                        a.updatedAt).getTime()) : 0;
                    const bTime = b.updatedAt ? (b.updatedAt.toDate ? b.updatedAt.toDate().getTime() : new Date(
                        b.updatedAt).getTime()) : 0;
                    return bTime - aTime;
                });
                await window.renderThreads(window.allThreads);
                updateGlobalUnreadBadge();
            });
        };

        window.renderThreads = async function(threadsToRender) {
            const container = document.getElementById('inbox-container');
            const empty = document.getElementById('empty-inbox');
            container.innerHTML = '';

            if (threadsToRender.length === 0) {
                empty.style.display = 'flex';
                updateGlobalUnreadBadge();
                return;
            }
            empty.style.display = 'none';

            const otherUids = new Set();
            threadsToRender.forEach(t => {
                const other = t.participants.find(uid => uid !== window.currentUser.uid);
                if (other) otherUids.add(other);
            });
            await Promise.all(Array.from(otherUids).map(uid => getUserData(uid)));

            threadsToRender.forEach((thread) => {
                const otherUid = thread.participants.find(uid => uid !== window.currentUser.uid);
                const otherUser = otherUid ? (window.userCache[otherUid] || { name: 'Unknown',
                    avatarUrl: null }) : { name: 'Unknown', avatarUrl: null };
                const providerName = otherUser.name || 'Unknown Provider';
                const providerAvatar = otherUser.avatarUrl || null;
                const jobTitle = thread.jobTitle || 'Service Provider';
                const lastMsgPreview = thread.lastMessageText || 'Start a conversation';
                const updatedAt = thread.updatedAt || null;
                const timeStr = formatTimeAgo(updatedAt);
                const initials = providerName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || '?';
                const lastReadAt = window.lastReadTimestamps[thread.id] || 0;
                let threadTime = 0;
                if (updatedAt) {
                    threadTime = updatedAt.toDate ? updatedAt.toDate().getTime() : new Date(updatedAt).getTime();
                }
                const isUnread = threadTime > lastReadAt;
                const isActive = window.activeChatId === thread.id;

                const avatarHTML = providerAvatar ?
                    `<img src="${providerAvatar}" alt="${providerName}" onerror="this.style.display='none';this.parentElement.innerHTML='<span>${initials}</span>';" />` :
                    `<span>${initials}</span>`;

                const html = `
                <div class="thread-item ${isUnread ? 'unread' : ''} ${isActive ? 'active' : ''}"
                     onclick="openChat('${thread.id}', '${providerName.replace(/'/g, "\\'")}', '${jobTitle.replace(/'/g, "\\'")}', '${otherUid || ''}')"
                     data-thread-id="${thread.id}">
                  <div class="thread-avatar">
                    ${avatarHTML}
                    <span class="status-dot online"></span>
                  </div>
                  <div class="thread-body">
                    <div class="thread-top-row">
                      <span class="thread-name">${providerName}</span>
                      <span class="thread-time">${timeStr}</span>
                    </div>
                    <div class="thread-subtitle">${jobTitle}</div>
                    <div class="thread-preview">
                      <span class="unread-dot"></span>
                      <i class="fa-regular fa-comment-dots"></i> ${lastMsgPreview}
                    </div>
                  </div>
                  <div class="thread-item-actions" onclick="event.stopPropagation();">
                    <button class="btn-icon-sm" onclick="event.stopPropagation(); viewProfileByUid('${otherUid || ''}')" title="Profile">
                      <i class="fa-solid fa-user"></i>
                    </button>

                      <i class="fa-regular fa-trash-can"></i>

        function updateGlobalUnreadBadge() {
            const badge = document.getElementById('global-unread-badge');
            let totalUnread = 0;
            window.allThreads.forEach(t => {
                const lastReadAt = window.lastReadTimestamps[t.id] || 0;
                let threadTime = 0;
                if (t.updatedAt) {
                    threadTime = t.updatedAt.toDate ? t.updatedAt.toDate().getTime() : new Date(t.updatedAt)
                        .getTime();
                }
                if (threadTime > lastReadAt) totalUnread++;
            });
            if (totalUnread > 0) {
                badge.textContent = totalUnread;
                badge.classList.add('visible');
            } else {
                badge.classList.remove('visible');
            }

        // ── CHAT ──
        window.openChat = async function(threadId, providerName, jobTitle, otherUid) {

            window.lastReadTimestamps[threadId] = Date.now();

            const rightPanel = document.getElementById('right-panel');

            const chatContent = document.getElementById('chat-content');

            chatContent.style.display = 'flex';

            document.getElementById('chat-title').textContent = providerName || 'Provider';
            document.getElementById('chat-subtitle').textContent = jobTitle || 'Service Provider';

            let otherAvatar = null;
            if (otherUid) {
                const userData = await getUserData(otherUid);
                window.activeChatOtherData = userData;
                otherAvatar = userData.avatarUrl || null;
                const roleLabel = userData.role === 'service_provider' ? 'Provider' : 'Organizer';
                document.getElementById('chat-subtitle').textContent = jobTitle || roleLabel;
            }
            const initials = (providerName || '?').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || '?';
            const avatarContainer = document.getElementById('chat-avatar');
            const avatarInitialsSpan = document.getElementById('chat-avatar-initials');
            const statusDot = document.getElementById('chat-status-dot');
            const existingImg = avatarContainer.querySelector('img');
            if (existingImg) existingImg.remove();

            if (otherAvatar) {
                avatarInitialsSpan.style.display = 'none';
                const img = document.createElement('img');
                img.src = otherAvatar;
                img.alt = providerName;
                img.onerror = function() {
                    this.style.display = 'none';
                    avatarInitialsSpan.style.display = 'inline';
                    avatarInitialsSpan.textContent = initials;
                };
                avatarContainer.appendChild(img);
                statusDot.classList.add('online');
            } else {
                avatarInitialsSpan.style.display = 'inline';
                avatarInitialsSpan.textContent = initials;
                statusDot.classList.add('online');
            }

            document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
            const activeThreadEl = document.querySelector(`.thread-item[data-thread-id="${threadId}"]`);
            if (activeThreadEl) {
                activeThreadEl.classList.add('active');
                activeThreadEl.classList.remove('unread');
                const dot = activeThreadEl.querySelector('.unread-dot');
                if (dot) dot.style.display = 'none';
            }
            updateGlobalUnreadBadge();

            if (window.innerWidth <= 860) {
                document.getElementById('left-panel').classList.add('hidden-on-mobile');
                rightPanel.classList.remove('hidden-on-mobile');
            }

            if (activeChatUnsubscribe) activeChatUnsubscribe();
            const msgsQuery = window.fb.query(
                window.fb.collection(window.db, `threads/${threadId}/messages`),
                window.fb.orderBy('timestamp', 'asc')
            );
            activeChatUnsubscribe = window.fb.onSnapshot(msgsQuery, (snapshot) => {
                const hist = document.getElementById('chat-history');
                hist.innerHTML = '';
                let lastDateStr = '';
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const msgDate = msg.timestamp ? (msg.timestamp.toDate ? msg.timestamp.toDate() :
                        new Date(msg.timestamp)) : null;
                    const dateStr = msgDate ? msgDate.toLocaleDateString('en-US', { weekday: 'short',
                        month: 'short', day: 'numeric' }) : '';
                    if (dateStr && dateStr !== lastDateStr) {
                        hist.insertAdjacentHTML('beforeend',
                            `<div class="chat-date-divider">${dateStr}</div>`);
                        lastDateStr = dateStr;
                    }
                    const timeStr = formatMessageTime(msg.timestamp);
                    const cls = msg.senderId === window.currentUser.uid ? 'bubble-out' : 'bubble-in';
                    let content = '';
                    if (msg.text) {
                        content += `<div>${msg.text}</div>`;
                    }
                    if (msg.imageBase64) {
                        const imgSrc = msg.imageBase64;
                        content += `
                          <div class="chat-image-wrap" onclick="openImageView('${imgSrc}')">
                            <img src="${imgSrc}" alt="Image" loading="lazy" />
                          </div>
                        `;
                        if (msg.imageCaption) {
                            content += `<div class="chat-image-caption">${msg.imageCaption}</div>`;
                        }
                    }
                    if (timeStr) {
                        content += `<div class="bubble-time">${timeStr}</div>`;
                    }
                    hist.insertAdjacentHTML('beforeend',
                        `<div class="chat-bubble ${cls}">${content}</div>`);
                });
                hist.scrollTop = hist.scrollHeight;
            });
        };

        // ── IMAGE SELECT ──
        window.handleImageSelect = function(input) {
            const file = input.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                window.showToast('Please select an image', 'error');
                input.value = '';
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                window.showToast('Image max 5MB', 'error');
                input.value = '';
                return;
            }

            const toast = window.showToast(`Processing ${file.name}…`, 'info');
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width,
                        height = img.height;
                    const MAX = 1200;
                    if (width > MAX || height > MAX) {
                        const ratio = Math.min(MAX / width, MAX / height);
                        width = Math.round(width * ratio);
                        height = Math.round(height * ratio);
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, width, height);
                    const quality = 0.85;
                    const mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                    const base64 = canvas.toDataURL(mimeType, quality);

                    toast.remove();
                    window.showToast('Image ready', 'success');

                    window.chatImageData = {
                        base64,
                        fileName: file.name,
                        fileSize: file.size,
                        mimeType
                    };
                    document.getElementById('attachment-preview').style.display = 'flex';
                    document.getElementById('attachment-name').textContent = file.name;
                    document.getElementById('attachment-size').textContent = formatFileSize(file.size);
                    input.value = '';
                };
                img.onerror = function() {
                    toast.remove();
                    window.showToast('Failed to load image', 'error');
                    input.value = '';
                };
                img.src = e.target.result;
            };
            reader.onerror = function() {
                toast.remove();
                window.showToast('Failed to read file', 'error');
                input.value = '';
            };
            reader.readAsDataURL(file);
        };

        window.clearAttachment = function() {
            window.chatImageData = null;
            document.getElementById('chat-file-input').value = '';
            document.getElementById('attachment-preview').style.display = 'none';
        };

        // ── SEND ──
        window.sendChatMessage = async function() {
            const input = document.getElementById('chat-input-box');
            const text = input.value.trim();
            const imageData = window.chatImageData;
            if ((!text && !imageData) || !window.activeChatId) return;

            const hasImage = !!imageData;
            input.value = '';
            const imgData = imageData ? { ...imageData } : null;
            window.clearAttachment();

            const msgData = {
                senderId: window.currentUser.uid,
                text: text || '',
                timestamp: window.fb.serverTimestamp()
            };
            if (hasImage && imgData) {
                msgData.imageBase64 = imgData.base64;
                msgData.imageName = imgData.fileName;
                msgData.imageSize = imgData.fileSize;
                msgData.imageMimeType = imgData.mimeType;
            }

            try {
                await window.fb.addDoc(window.fb.collection(window.db, `threads/${window.activeChatId}/messages`),
                    msgData);
                const previewText = text || (hasImage ? '📷 Image' : 'New message');
                await window.fb.updateDoc(window.fb.doc(window.db, 'threads', window.activeChatId), {
                    updatedAt: window.fb.serverTimestamp(),
                    lastMessageText: previewText.substring(0, 80),
                });
                window.lastReadTimestamps[window.activeChatId] = Date.now();
                saveLastReadTimestamps();
                const btn = document.querySelector('.btn-send');
                btn.classList.add('send-pulse');
                setTimeout(() => btn.classList.remove('send-pulse'), 400);
            } catch (err) {
                console.error(err);
                window.showToast('Failed to send', 'error');
            }
        };

        const SENSITIVE_KEYS = [
            'uid', 'id', 'role', 'avatarurl', 'videourl', 'name', 'bio',
            'createdat', 'updatedat', 'password', 'email', 'phone', 'telephone', 'mobile',
            'representativeemail', 'contactemail', 'lastmessagetext'
        ];

        function isSensitive(key) {
            const clean = key.toLowerCase().trim();
            if (SENSITIVE_KEYS.includes(clean)) return true;
            if (clean.includes('email') || clean.includes('phone') || clean.includes('password')) return true;
            return false;
        }

        window.viewProfileByUid = async function(uid) {

                const user = await getUserData(uid);
                if (!user || !user.name) return window.showToast('Profile not found', 'error');

                openProfileModal();

                console.error(err);
                window.showToast('Error loading profile', 'error');

        function renderProfileModal(user) {
            const isProvider = user.role === 'service_provider';
            document.getElementById('pm-name').textContent = user.name || 'Unnamed User';
            document.getElementById('pm-avatar').src = user.avatarUrl ||
                `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name||'U')}&background=0A2540&color=84CC16&size=180`;
            document.getElementById('pm-bio').textContent = user.bio || 'No summary provided.';

            let badges = '';
            if (isProvider) {
                if (user.serviceType) badges +=
                    `<span class="badge badge-lime"><i class="fa-solid fa-tag"></i> ${user.serviceType}</span>`;
                if (user.experience) badges +=
                    `<span class="badge badge-navy"><i class="fa-solid fa-briefcase"></i> ${user.experience} yrs</span>`;
                if (user.location) badges +=
                    `<span class="badge badge-navy"><i class="fa-solid fa-location-dot"></i> ${user.location}</span>`;
            } else {
                if (user.organisation) badges +=
                    `<span class="badge badge-pink"><i class="fa-solid fa-building"></i> ${user.organisation}</span>`;
                if (user.location) badges +=
                    `<span class="badge badge-navy"><i class="fa-solid fa-location-dot"></i> ${user.location}</span>`;
            }
            document.getElementById('pm-badges').innerHTML = badges;

            document.getElementById('pm-summary-title').textContent = isProvider ? 'About the Provider' :
                'About the Organizer';

            detailsContainer.innerHTML = '';
            tagsContainer.innerHTML = '';

            Object.keys(user).forEach(key => {
                const cleanKey = key.toLowerCase().trim();
                const value = user[key];
                if (isSensitive(cleanKey) || value === null || value === undefined || value === '') return;
                if (Array.isArray(value) && value.length === 0) return;

                const label = key.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());

                if (Array.isArray(value)) {
                    let html =
                        `<div style="margin-bottom:0.75rem;grid-column:1/-1;"><div class="detail-label">${label}</div><div class="tag-container">`;
                    value.forEach(item => {
                        if (typeof item === 'object' && item !== null) {

                                `<a href="${url}" target="_blank" class="btn-outline"><i class="fa-regular fa-file-pdf"></i> ${item.name || item.title || 'Document'}</a>`;

                                .startsWith('https://'))) {
                            html +=
                                `<a href="${item}" target="_blank" class="btn-outline"><i class="fa-solid fa-link"></i> View</a>`;
                        } else {
                            html += `<span class="tag-item">${item}</span>`;
                        }
                    });
                    html += `</div></div>`;
                    tagsContainer.insertAdjacentHTML('beforeend', html);
                } else if (typeof value === 'object' && value !== null) {
                    const url = value.url || value.link || value.file;
                    if (url) {
                        detailsContainer.insertAdjacentHTML('beforeend', `
                            <div class="detail-item">
                                <div class="detail-label">${label}</div>
                                <a href="${url}" target="_blank" class="btn-outline"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open</a>
                            </div>`);
                    }
                } else if (typeof value === 'string' && (value.startsWith('http://') || value.startsWith(
                        'https://'))) {
                    detailsContainer.insertAdjacentHTML('beforeend', `
                        <div class="detail-item">
                            <div class="detail-label">${label}</div>
                            <a href="${value}" target="_blank" class="btn-outline">Open Link</a>

            });

                right.classList.remove('hidden-on-mobile');
            } else {
                if (window.activeChatId) {
                    left.classList.add('hidden-on-mobile');
                    right.classList.remove('hidden-on-mobile');
                } else {
                    left.classList.remove('hidden-on-mobile');
                    if (right.classList.contains('empty')) {
                        right.classList.remove('hidden-on-mobile');
                    } else {
                        right.classList.add('hidden-on-mobile');
                    }
                }
            }
        }
        window.addEventListener('resize', handleResize);
        handleResize();

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (document.getElementById('profile-modal').classList.contains('active')) closeProfileModal();
                else if (document.getElementById('imageViewModal').classList.contains('active')) closeImageView();
                else if (window.activeChatId && window.innerWidth <= 860) closeChat();
            }
        });
    </script>
</body>
</html>
