<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone21 | Contact & Support</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root { --navy:#102838; --lime:#C0C800; --pink:#F80070; --bg:#f5f7fa; --card:#fff; --text:#1a1a2e; --muted:#6c757d; --border:#e0e0e8; --radius:16px; --shadow:0 8px 30px rgba(16,40,56,0.08); }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:var(--bg); color:var(--text); padding:20px; min-height:100vh; }
        .container { max-width:1100px; margin:0 auto; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:15px; }
        .header h1 { font-size:2rem; font-weight:800; color:var(--navy); }
        .back-btn { background:white; border:1px solid var(--border); color:var(--navy); border-radius:30px; padding:10px 20px; cursor:pointer; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:8px; transition:0.2s; }
        .back-btn:hover { background:#f0f0f0; }
        .tab-nav { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:25px; }
        .tab-btn { padding:14px 10px; border-radius:12px; border:2px solid var(--border); cursor:pointer; font-weight:700; font-size:0.85rem; transition:0.3s; background:white; color:var(--muted); display:flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; }
        .tab-btn:hover { border-color:var(--lime); color:var(--navy); }
        .tab-btn.active { background:var(--navy); color:var(--lime); border-color:var(--navy); }
        .tab-btn .badge { background:var(--pink); color:white; font-size:0.7rem; padding:2px 8px; border-radius:15px; font-weight:700; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:25px; margin-bottom:20px; }
        .card h2 { font-size:1.2rem; font-weight:700; color:var(--navy); margin-bottom:15px; border-bottom:3px solid var(--lime); padding-bottom:10px; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
        .form-group { margin-bottom:15px; }
        .form-group label { display:block; font-weight:600; margin-bottom:5px; color:var(--navy); font-size:0.85rem; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:0.9rem; outline:none; background:#fafbfc; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--lime); background:white; }
        .form-group textarea { min-height:90px; resize:vertical; }
        .btn { padding:12px 20px; border-radius:30px; font-weight:700; font-size:0.9rem; cursor:pointer; border:none; transition:0.3s; display:inline-flex; align-items:center; gap:8px; }
        .btn-lime { background:var(--lime); color:var(--navy); } .btn-lime:hover { background:#d0d800; }
        .btn-pink { background:var(--pink); color:white; } .btn-pink:hover { background:#d0005e; }
        .btn-navy { background:var(--navy); color:var(--lime); } .btn-navy:hover { background:#1a3a4a; }
        .btn-outline { background:#fff; border:1px solid var(--border); color:var(--navy); } .btn-outline:hover { background:#f0f0f0; }
        .btn-block { width:100%; justify-content:center; }
        .contact-methods { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
        .contact-method { background:#fafbfc; border:1px solid var(--border); border-radius:10px; padding:18px; text-align:center; transition:0.2s; text-decoration:none; color:inherit; cursor:pointer; }
        .contact-method:hover { border-color:var(--lime); transform:translateY(-2px); box-shadow:var(--shadow); }
        .contact-method i { font-size:1.5rem; color:var(--pink); margin-bottom:8px; }
        .contact-method h4 { color:var(--navy); font-size:0.9rem; margin-bottom:3px; }
        .contact-method p { color:var(--muted); font-size:0.8rem; word-break:break-all; }
        .social-handles { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
        .social-btn { display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 10px; border-radius:10px; text-decoration:none; font-weight:600; font-size:0.8rem; transition:0.3s; border:2px solid var(--border); color:var(--navy); }
        .social-btn:hover { transform:translateY(-2px); }
        .social-btn.tiktok:hover { border-color:#000; background:#000; color:white; }
        .social-btn.facebook:hover { border-color:#1877f2; background:#1877f2; color:white; }
        .social-btn.instagram:hover { border-color:#e4405f; background:#e4405f; color:white; }
        .social-btn.whatsapp:hover { border-color:#25d366; background:#25d366; color:white; }
        .notification-item { display:flex; gap:12px; padding:12px; background:#fafbfc; border-radius:10px; margin-bottom:8px; border-left:4px solid var(--lime); }
        .notification-item.unread { border-left-color:var(--pink); background:#fff5f8; }
        .notification-item .notif-icon { width:36px; height:36px; border-radius:50%; background:var(--navy); color:var(--lime); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:0.9rem; }
        .notification-item .notif-title { font-weight:700; font-size:0.85rem; color:var(--navy); }
        .notification-item .notif-message { font-size:0.78rem; color:var(--muted); margin-top:2px; }
        .notification-item .notif-time { font-size:0.7rem; color:#aaa; margin-top:3px; }
        .chat-messages { max-height:350px; min-height:200px; overflow-y:auto; margin-bottom:12px; padding:10px; background:#f9fbfd; border-radius:10px; border:1px solid var(--border); }
        .chat-message { display:flex; gap:8px; margin-bottom:12px; max-width:85%; }
        .chat-message.user { margin-left:auto; flex-direction:row-reverse; }
        .chat-message .msg-avatar { width:32px; height:32px; border-radius:50%; background:var(--lime); color:var(--navy); display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; font-size:0.75rem; }
        .chat-message.admin .msg-avatar { background:var(--navy); color:var(--lime); }
        .chat-message .msg-bubble { background:white; border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:0.85rem; line-height:1.4; }
        .chat-message.user .msg-bubble { background:var(--navy); color:white; border:none; }
        .chat-message .msg-time { font-size:0.65rem; color:#aaa; margin-top:3px; }
        .chat-attachment { max-width:200px; border-radius:8px; margin-top:5px; display:block; cursor:pointer; }
        .image-preview { max-width:100%; border-radius:8px; margin-top:5px; }
        @media(max-width:700px) { .tab-nav{grid-template-columns:1fr 1fr;} .form-row{grid-template-columns:1fr;} .contact-methods{grid-template-columns:1fr;} .social-handles{grid-template-columns:1fr 1fr;} }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-headset" style="color:var(--pink);"></i> Contact & Support</h1>
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="tab-nav">
        <button class="tab-btn active" data-tab="contact"><i class="fas fa-envelope"></i> Contact</button>
        <button class="tab-btn" data-tab="payment"><i class="fas fa-file-invoice-dollar"></i> Payment Proof</button>
        <button class="tab-btn" data-tab="notifications"><i class="fas fa-bell"></i> Notifications <span class="badge" id="notif-badge" style="display:none;">0</span></button>
        <button class="tab-btn" data-tab="chat"><i class="fas fa-comments"></i> Live Chat</button>
    </div>

    <div class="tab-content active" id="tab-contact">
        <div class="card">
            <h2>Contact Zone21 Admin</h2>
            <div class="contact-methods">
                <a href="tel:+263789912268" class="contact-method"><i class="fas fa-phone-alt"></i><h4>Call Us</h4><p>+263 78 991 2268</p></a>
                <a href="https://wa.me/263789912268" target="_blank" class="contact-method"><i class="fab fa-whatsapp"></i><h4>WhatsApp</h4><p>+263 78 991 2268</p></a>
                <button class="contact-method" onclick="revealEmail()"><i class="fas fa-envelope"></i><h4>Email Us</h4><p id="email-display">Click to reveal</p></button>
            </div>
        </div>
        <div class="card">
            <h2>Follow Zone21</h2>
            <div class="social-handles">
                <a href="https://www.tiktok.com/@zone21events?_r=1&_t=ZS-99Eytxy6GOK" target="_blank" class="social-btn tiktok"><i class="fab fa-tiktok"></i> TikTok</a>
                <a href="https://www.facebook.com/share/1Bqh2NvD2B/?mibextid=wwXIfr" target="_blank" class="social-btn facebook"><i class="fab fa-facebook"></i> Facebook</a>
                <a href="https://www.instagram.com/zone21_event_management?igsi=eDczcGI5ems1cDln" target="_blank" class="social-btn instagram"><i class="fab fa-instagram"></i> Instagram</a>
                <a href="https://wa.me/263789912268" target="_blank" class="social-btn whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            </div>
        </div>
        <div class="card">
            <h2>Send a General Query</h2>
            <form id="queryForm">
                <div class="form-row">
                    <div class="form-group"><label>Your Name *</label><input type="text" id="queryName" required></div>
                    <div class="form-group"><label>Your Email</label><input type="email" id="queryEmail"></div>
                </div>
                <div class="form-group"><label>Subject *</label><input type="text" id="querySubject" required></div>
                <div class="form-group"><label>Message *</label><textarea id="queryMessage" required></textarea></div>
                <button type="submit" class="btn btn-navy btn-block"><i class="fas fa-paper-plane"></i> Send Query</button>
            </form>
        </div>
    </div>

    <div class="tab-content" id="tab-payment">
        <div class="card">
            <h2>Submit Proof of Payment</h2>
            <form id="paymentForm">
                <div class="form-row">
                    <div class="form-group"><label>Your Name *</label><input type="text" id="payName" required></div>
                    <div class="form-group"><label>Phone Number (WhatsApp) *</label><input type="tel" id="payPhone" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Email Address</label><input type="email" id="payEmail"></div>
                    <div class="form-group"><label>Payment Method *</label><select id="payMethod" required><option value="">Select...</option><option>Ecocash</option><option>InnBucks</option><option>OneMoney</option><option>Bank Transfer</option><option>Visa / Mastercard</option><option>Other</option></select></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Amount Paid (USD) *</label><input type="number" id="payAmount" required min="1"></div>
                    <div class="form-group"><label>Reference / Transaction ID</label><input type="text" id="payReference"></div>
                </div>
                <div class="form-group"><label>What are you paying for? *</label><select id="payPurpose" required><option value="">Select...</option><option>Subscription Plan</option><option>Event Registration</option><option>Security Services</option><option>Ticket Purchase</option><option>Other</option></select></div>
                <div class="form-group"><label>Upload Proof of Payment (Screenshot) *</label><input type="file" id="payProof" accept="image/*" required></div>
                <div class="form-group"><label>Additional Notes</label><textarea id="payNotes"></textarea></div>
                <button type="submit" class="btn btn-lime btn-block"><i class="fas fa-upload"></i> Submit Proof</button>
            </form>
        </div>
    </div>

    <div class="tab-content" id="tab-notifications">
        <div class="card">
            <h2>Notifications</h2>
            <div id="notifications-list"><p style="color:var(--muted);">Loading notifications...</p></div>
        </div>
    </div>

    <div class="tab-content" id="tab-chat">
        <div class="card">
            <h2>Chat with Support Team</h2>
            <div class="chat-messages" id="chatMessages"><p style="color:var(--muted);text-align:center;">Loading live chat...</p></div>
            <div style="display:flex; gap:8px; align-items:center;">
                <input type="file" id="chatImageInput" accept="image/*" style="display:none;" onchange="previewChatImage(this)">
                <button class="btn btn-outline" onclick="document.getElementById('chatImageInput').click()"><i class="fas fa-image"></i></button>
                <input type="text" id="chatInput" placeholder="Type your message..." style="flex:1; padding:11px; border:1.5px solid var(--border); border-radius:25px; outline:none; font-size:0.9rem;">
                <button class="btn btn-navy" onclick="sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
            <img id="chatImagePreview" class="image-preview" style="display:none; margin-top:10px;">
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
        authDomain: "zone21.firebaseapp.com",
        projectId: "zone21",
        storageBucket: "zone21.firebasestorage.app",
        messagingSenderId: "405963057292",
        appId: "1:405963057292:web:80e9923ae84eb7029073a9",
        measurementId: "G-KE007Y89F1"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let currentUserId = null;
    let currentUserProfile = {};
    let chatImageBase64 = null;

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUserId = user.uid;
            db.collection('users').doc(user.uid).get().then(doc => {
                if(doc.exists) currentUserProfile = doc.data();
            });
            loadNotifications();
            loadChatMessages();
        } else {
            window.location.href = 'login.html';
        }
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
        });
    });

    function revealEmail(){ document.getElementById('email-display').textContent = 'zone21services@gmail.com'; }

    document.getElementById('queryForm').addEventListener('submit', async function(e){
        e.preventDefault();
        if (!currentUserId) return;
        try{
            await db.collection('messages').add({
                name: document.getElementById('queryName').value,
                email: document.getElementById('queryEmail').value || 'Not provided',
                subject: document.getElementById('querySubject').value,
                message: document.getElementById('queryMessage').value,
                type: 'general_query', 
                senderId: currentUserId,
                sender: 'user', 
                status: 'unread',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert('Query sent successfully!'); 
            this.reset();
        }catch(err){ 
            alert('Failed to send query.'); 
        }
    });

    document.getElementById('paymentForm').addEventListener('submit', async function(e){
        e.preventDefault();
        if (!currentUserId) return;
        const file = document.getElementById('payProof').files[0];
        if(!file){ alert('Please attach image proof.'); return; }
        
        try{
            const base64 = await fileToBase64(file, 800, 0.7);
            await db.collection('messages').add({
                name: document.getElementById('payName').value,
                phone: document.getElementById('payPhone').value,
                email: document.getElementById('payEmail').value || 'Not provided',
                method: document.getElementById('payMethod').value,
                amount: parseFloat(document.getElementById('payAmount').value),
                reference: document.getElementById('payReference').value || 'N/A',
                purpose: document.getElementById('payPurpose').value,
                proofImage: base64,
                notes: document.getElementById('payNotes').value || 'None',
                type: 'payment_proof', 
                senderId: currentUserId, 
                sender: 'user',
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert('Payment proof submitted successfully!'); 
            this.reset();
        }catch(err){ 
            alert('Failed to submit payment proof.'); 
        }
    });

    function previewChatImage(input){
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e){
            chatImageBase64 = e.target.result;
            document.getElementById('chatImagePreview').src = chatImageBase64;
            document.getElementById('chatImagePreview').style.display = 'block';
        };
        reader.readAsDataURL(file);
    }

    async function sendChatMessage(){
        if (!currentUserId) return;
        const msgInput = document.getElementById('chatInput');
        const msg = msgInput.value.trim();
        if(!msg && !chatImageBase64) return;
        
        try{
            await db.collection('messages').add({
                sender: 'user', 
                senderId: currentUserId,
                senderName: currentUserProfile.name || auth.currentUser.displayName || 'Client',
                message: msg,
                image: chatImageBase64 || null,
                type: 'chat', 
                status: 'unread',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            msgInput.value = '';
            chatImageBase64 = null;
            document.getElementById('chatImagePreview').style.display = 'none';
        }catch(err){ 
            alert('Failed to send message.'); 
        }
    }
    window.sendChatMessage = sendChatMessage;

    function loadChatMessages(){
        if (!currentUserId) return;
        
        db.collection('messages').onSnapshot(snapshot => {
            const chatDiv = document.getElementById('chatMessages');
            chatDiv.innerHTML = '';
            let messages = [];

            snapshot.forEach(doc => {
                const d = doc.data();
                // Match items where user is sender OR user is intended recipient
                if (d.senderId === currentUserId || d.recipientId === currentUserId) {
                    messages.push(d);
                }
            });

            // Client side sorting to eliminate query index errors
            messages.sort((a,b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));

            messages.forEach(d => {
                const div = document.createElement('div');
                const isMe = d.sender === 'user' || d.senderId === currentUserId;
                div.className = `chat-message ${isMe ? 'user' : 'admin'}`;
                let imgHtml = d.image ? `<img src="${d.image}" class="chat-attachment" onclick="window.open('${d.image}')">` : '';
                
                div.innerHTML = `
                    <div class="msg-avatar">${isMe ? 'ME' : 'AD'}</div>
                    <div>
                        <div class="msg-bubble">${d.message || d.subject || ''}${imgHtml}</div>
                        <div class="msg-time">${d.createdAt ? d.createdAt.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Now'}</div>
                    </div>`;
                chatDiv.appendChild(div);
            });

            if(messages.length === 0){
                chatDiv.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;">No message history. Send a query or direct message below!</p>';
            }

            chatDiv.scrollTop = chatDiv.scrollHeight;
        });
    }

    function loadNotifications(){
        if (!currentUserId) return;
        
        // Listen to broadcasts and dynamic account messages simultaneously
        db.collection('messages').onSnapshot(snapshot => {
            const list = document.getElementById('notifications-list');
            list.innerHTML = '';
            let unread = 0;
            let items = [];

            snapshot.forEach(doc => {
                const d = doc.data();
                if (d.senderId === currentUserId || d.recipientId === currentUserId) {
                    items.push(d);
                }
            });

            items.sort((a,b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));

            items.forEach(d => {
                if(d.status==='unread' || d.status==='pending') unread++;
                const div = document.createElement('div');
                div.className = `notification-item ${d.status==='unread'||d.status==='pending'?'unread':''}`;
                const icon = d.type==='payment_proof'?'fa-file-invoice-dollar':d.type==='chat'?'fa-comments':'fa-envelope';
                const title = d.sender==='admin' ? 'Admin Response' : (d.type==='payment_proof' ? `Payment Proof - ${d.purpose}` : d.subject || 'Support Request');
                const msg = d.sender==='admin' ? d.message : (d.type==='payment_proof' ? `$${d.amount} via ${d.method} (${d.status})` : d.message);
                
                div.innerHTML = `<div class="notif-icon"><i class="fas ${icon}"></i></div>
                    <div>
                        <div class="notif-title">${title}</div>
                        <div class="notif-message">${msg || ''}</div>
                        <div class="notif-time">${d.createdAt ? d.createdAt.toDate().toLocaleString() : 'Just now'}</div>
                    </div>`;
                list.appendChild(div);
            });

            const badge = document.getElementById('notif-badge');
            badge.style.display = unread > 0 ? 'inline' : 'none';
            badge.textContent = unread;

            if(items.length === 0){
                list.innerHTML = '<p style="color:var(--muted);">No notifications yet.</p>';
            }
        });
    }

    function fileToBase64(file, maxDimension=800, quality=0.7){
        return new Promise((resolve,reject)=>{
            const reader = new FileReader();
            reader.onload = function(e){
                const img = new Image();
                img.onload = function(){
                    const canvas = document.createElement('canvas');
                    let w=img.width, h=img.height;
                    if(w>maxDimension||h>maxDimension){ 
                        if(w>h){ h=Math.round(h*maxDimension/w); w=maxDimension; }
                        else{ w=Math.round(w*maxDimension/h); h=maxDimension; } 
                    }
                    canvas.width=w; canvas.height=h;
                    canvas.getContext('2d').drawImage(img,0,0,w,h);
                    resolve(canvas.toDataURL('image/jpeg',quality));
                };
                img.onerror=reject; 
                img.src=e.target.result;
            };
            reader.onerror=reject; 
            reader.readAsDataURL(file);
        });
    }
</script>
</body>
</html>
