<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone21 Admin – Ticket Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <!-- QRCode.js for generating QR codes directly -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- html5-qrcode for scanning -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800;
            --pink: #F80070;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-muted: #6c757d;
            --border: #e0e0e8;
            --radius: 16px;
            --shadow: 0 8px 30px rgba(16, 40, 56, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .header h1 { font-size: 2rem; font-weight: 800; color: var(--navy); }
        .btn { padding: 10px 18px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn-primary { background: var(--navy); color: var(--lime); }
        .btn-primary:hover { background: #1a3a4a; }
        .btn-lime { background: var(--lime); color: var(--navy); }
        .btn-lime:hover { background: #d0d800; }
        .btn-pink { background: var(--pink); color: white; }
        .btn-pink:hover { background: #d0005e; }
        .btn-green { background: #28a745; color: white; }
        .btn-green:hover { background: #218838; }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--navy); }
        .btn-outline:hover { background: #f0f0f0; }
        .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
        .card h2 { font-size: 1.3rem; font-weight: 700; color: var(--navy); margin-bottom: 15px; border-bottom: 3px solid var(--lime); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; }
        .ticket-type-section { border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 20px; background: #fafbfc; }
        .ticket-type-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .ticket-type-header h3 { margin: 0; font-size: 1.2rem; }
        .ticket-type-header .price { font-weight: 700; color: var(--pink); font-size: 1.1rem; }
        .ticket-stats { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; font-size: 0.9rem; }
        .ticket-stats span { background: white; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }
        
        /* Invoice List Defaults to Hidden */
        .invoice-list { margin-top: 15px; display: none; border-top: 1px dashed var(--border); padding-top: 15px; }
        
        .invoice-item { background: white; border-radius: 8px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .invoice-item .info { flex: 1; min-width: 200px; }
        .invoice-item .status { font-size: 0.8rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-paid { background: #d4edda; color: #155724; }
        .status-void { background: #e2e3e5; color: #383d41; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; border-radius: 16px; padding: 25px; max-width: 600px; width: 95%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h2 { font-size: 1.5rem; color: var(--navy); }
        .modal-close { background: none; border: none; font-size: 2rem; cursor: pointer; color: var(--text-muted); }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-ticket-alt" style="color:var(--pink);"></i> Zone21 Ticket Admin</h1>
            <div class="button-group">
                <button class="btn btn-primary" onclick="openScanner()"><i class="fas fa-qrcode"></i> Scan Ticket</button>
                <button class="btn btn-outline" onclick="location.reload()"><i class="fas fa-sync"></i> Refresh</button>
            </div>
        </div>

        <div class="card">
            <h2>Select Event</h2>
            <select id="event-select" class="form-group">
                <option value="">-- Choose an approved event --</option>
            </select>
            <div id="event-details" class="hidden" style="margin-top:15px; background: #f8f9fa; padding: 15px; border-radius: 8px;">
                <p><strong>Name:</strong> <span id="ev-name"></span></p>
                <p><strong>Date:</strong> <span id="ev-date"></span></p>
                <p><strong>Location:</strong> <span id="ev-location"></span></p>
            </div>
        </div>

        <div id="ticket-types-container"></div>

        <div class="card">
            <h2>Generated Tickets Overview</h2>
            <div id="all-tickets-list">Select an event to view tickets.</div>
        </div>
    </div>

    <!-- Verify Payment Modal -->
    <div class="modal" id="verify-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Verify Payment & Generate</h2>
                <button class="modal-close" onclick="closeModal('verify-modal')">&times;</button>
            </div>
            <div id="verify-content"></div>
        </div>
    </div>

    <!-- Share Ticket Modal -->
    <div class="modal" id="share-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Your Event Ticket</h2>
                <button class="modal-close" onclick="closeModal('share-modal')">&times;</button>
            </div>
            <div id="share-content"></div>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div class="modal" id="scanner-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Scan Ticket QR</h2>
                <button class="modal-close" onclick="closeScanner()">&times;</button>
            </div>
            <div id="qr-reader" style="width:100%; max-width:400px; margin:0 auto;"></div>
            <div id="scan-result" style="text-align:center; padding: 15px; margin-top: 15px; border-radius: 8px;" class="hidden"></div>
            
            <div style="margin-top:20px; text-align:center; border-top: 1px solid #eee; padding-top: 15px;">
                <p style="font-size: 0.9rem; color: #666; margin-bottom: 10px;">Camera not working?</p>
                <div class="button-group" style="justify-content:center;">
                    <button class="btn btn-lime" onclick="document.getElementById('qr-image-input').click()"><i class="fas fa-image"></i> Scan Image File</button>
                    <button class="btn btn-outline" onclick="manualScanEntry()">Enter ID</button>
                </div>
                <input type="file" id="qr-image-input" accept="image/*" style="display:none;" onchange="scanFromFile(this.files[0])">
            </div>
        </div>
    </div>

    <script>
        // ============ FIREBASE ============
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentEvent = null;
        let currentEventTicketTypes = [];
        let html5QrCode = null;
        let currentTicketCanvas = null; // Store canvas for sharing

        // ============ AUTHENTICATION ============
        auth.onAuthStateChanged((user) => {
            if (user) {
                loadApprovedEvents();
            } else {
                const email = prompt("Admin Login - Enter your email:");
                if (email) {
                    const password = prompt("Enter your password:");
                    auth.signInWithEmailAndPassword(email, password)
                        .catch((err) => {
                            alert("Login failed: " + err.message);
                            document.body.innerHTML = "<h2 style='padding:20px;'>Access Denied. Refresh to try again.</h2>";
                        });
                }
            }
        });

        // ============ LOAD EVENTS ============
        async function loadApprovedEvents() {
            const eventSelect = document.getElementById('event-select');
            try {
                const snapshot = await db.collection('events').where('status', '==', 'approved').get();
                let events = [];
                snapshot.forEach(doc => events.push({ id: doc.id, ...doc.data() }));
                events.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                
                eventSelect.innerHTML = '<option value="">-- Choose an approved event --</option>';
                events.forEach(ev => {
                    const option = document.createElement('option');
                    option.value = ev.id;
                    option.textContent = `${ev.eventName} (${new Date(ev.startDate).toLocaleDateString()})`;
                    eventSelect.appendChild(option);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('event-select').addEventListener('change', async function() {
            const eventId = this.value;
            if (!eventId) return;
            try {
                const doc = await db.collection('events').doc(eventId).get();
                if (doc.exists) {
                    currentEvent = { id: doc.id, ...doc.data() };
                    currentEventTicketTypes = currentEvent.ticketTypes || [];
                    
                    document.getElementById('event-details').classList.remove('hidden');
                    document.getElementById('ev-name').textContent = currentEvent.eventName;
                    document.getElementById('ev-date').textContent = new Date(currentEvent.startDate).toLocaleString();
                    document.getElementById('ev-location').textContent = currentEvent.location;
                    
                    displayTicketTypes(currentEventTicketTypes);
                    loadAllTickets(eventId);
                }
            } catch (err) { console.error(err); }
        });

        function displayTicketTypes(ticketTypes) {
            const container = document.getElementById('ticket-types-container');
            container.innerHTML = '';
            ticketTypes.forEach(ticketType => {
                const safeId = ticketType.name.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
                const section = document.createElement('div');
                section.className = 'ticket-type-section';
                section.innerHTML = `
                    <div class="ticket-type-header">
                        <h3>${ticketType.name}</h3>
                        <span class="price">$${ticketType.price}</span>
                        <button class="btn btn-lime" onclick="toggleInvoices('${safeId}')">
                            <i class="fas fa-list"></i> Show Invoices
                        </button>
                    </div>
                    <div class="ticket-stats">
                        <span>Total: ${ticketType.quantity}</span>
                        <span>Sold: <span id="sold-${safeId}">0</span></span>
                    </div>
                    <div class="invoice-list" id="invoices-${safeId}">
                        Loading invoices...
                    </div>
                `;
                container.appendChild(section);
                loadInvoicesForTicketType(currentEvent.id, ticketType.name, safeId);
            });
        }

        function toggleInvoices(safeId) {
            const container = document.getElementById(`invoices-${safeId}`);
            if (container) {
                container.style.display = container.style.display === 'block' ? 'none' : 'block';
            }
        }

        // ============ LOAD INVOICES (FIXED TO AVOID INDEX ERROR) ============
        async function loadInvoicesForTicketType(eventId, ticketTypeName, safeId) {
            const container = document.getElementById(`invoices-${safeId}`);
            if (!container) return;
            
            try {
                // Fetch ALL invoices for this event first to avoid composite index requirements
                const snapshot = await db.collection('invoices').where('eventId', '==', eventId).get();
                let invoices = [];
                
                // Filter locally by ticketTypeName
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.ticketTypeName === ticketTypeName) {
                        invoices.push({ id: doc.id, ...data });
                    }
                });

                container.innerHTML = '';
                if (invoices.length === 0) {
                    container.innerHTML = '<p style="padding:10px; color:#666;">No invoices found yet.</p>';
                    return;
                }

                invoices.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                
                // Update sold count
                const soldCount = invoices.filter(i => i.status === 'paid').length;
                document.getElementById(`sold-${safeId}`).textContent = soldCount;

                invoices.forEach(inv => {
                    const div = document.createElement('div');
                    div.className = 'invoice-item';
                    const statusClass = inv.status === 'paid' ? 'status-paid' : (inv.status === 'pending' ? 'status-pending' : 'status-void');
                    div.innerHTML = `
                        <div class="info">
                            <strong>${inv.buyerName}</strong> <br>
                            <span style="font-size:0.85rem; color:#666;">${inv.buyerEmail} | ${inv.buyerPhone}</span><br>
                            <strong>$${inv.amount.toFixed(2)}</strong>
                            ${inv.paymentProofBase64 ? `<br><a href="${inv.paymentProofBase64}" target="_blank" style="color:var(--pink); font-size:0.85rem; font-weight:bold;">View Payment Proof Image</a>` : ''}
                        </div>
                        <span class="status ${statusClass}">${inv.status.toUpperCase()}</span>
                        <div class="button-group" style="margin-top:5px;">
                            ${inv.status === 'pending' ? `<button class="btn btn-green" onclick="verifyPayment('${inv.id}')">Verify & Generate</button>` : ''}
                            ${inv.status === 'paid' && inv.ticketId ? `<button class="btn btn-primary" onclick="openShareModal('${inv.ticketId}')"><i class="fas fa-share"></i> View Ticket</button>` : ''}
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="color:red;">Error loading invoices.</p>';
            }
        }

        // ============ PAYMENT VERIFICATION ============
        async function verifyPayment(invoiceId) {
            const modal = document.getElementById('verify-modal');
            const content = document.getElementById('verify-content');
            modal.style.display = 'flex';
            content.innerHTML = 'Loading...';

            try {
                const doc = await db.collection('invoices').doc(invoiceId).get();
                const inv = doc.data();
                
                content.innerHTML = `
                    <p><strong>Buyer:</strong> ${inv.buyerName}</p>
                    <p><strong>Amount:</strong> $${inv.amount}</p>
                    ${inv.paymentProofBase64 ? `<img src="${inv.paymentProofBase64}" style="width:100%; border-radius:8px; margin: 10px 0;">` : '<p>No proof uploaded.</p>'}
                    <div class="button-group" style="justify-content:center; margin-top:15px;">
                        <button class="btn btn-green" onclick="confirmGenerateTicket('${doc.id}')">Approve & Generate</button>
                        <button class="btn btn-pink" onclick="voidInvoice('${doc.id}')">Reject (Void)</button>
                    </div>
                `;
            } catch (e) { console.error(e); }
        }

        async function confirmGenerateTicket(invoiceId) {
            try {
                const invDoc = await db.collection('invoices').doc(invoiceId).get();
                const inv = invDoc.data();
                const ticketId = 'tkt_' + Date.now() + Math.random().toString(36).substr(2, 5);
                
                await db.collection('tickets').doc(ticketId).set({
                    eventId: inv.eventId,
                    ticketTypeName: inv.ticketTypeName,
                    buyerName: inv.buyerName,
                    buyerEmail: inv.buyerEmail,
                    buyerPhone: inv.buyerPhone,
                    invoiceId: invoiceId,
                    status: 'approved',
                    createdAt: new Date().toISOString(),
                    qrCodeData: ticketId
                });

                await db.collection('invoices').doc(invoiceId).update({ status: 'paid', ticketId: ticketId });

                alert('Ticket generated successfully!');
                closeModal('verify-modal');
                
                // Refresh specific ticket list
                const safeId = inv.ticketTypeName.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
                loadInvoicesForTicketType(inv.eventId, inv.ticketTypeName, safeId);
            } catch (err) { console.error(err); alert('Failed'); }
        }

        async function voidInvoice(invoiceId) {
            if (!confirm('Reject this invoice?')) return;
            await db.collection('invoices').doc(invoiceId).update({ status: 'void' });
            closeModal('verify-modal');
            document.getElementById('event-select').dispatchEvent(new Event('change')); // Refresh UI
        }

        // ============ TICKET COMPOSITION & SHARING ============
        function drawRoundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        async function generateTicketCanvas(ticket, ticketId) {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 1000;
            const ctx = canvas.getContext('2d');

            // 1. Background
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#102838'); 
            gradient.addColorStop(1, '#0a1924');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Branding Bars
            ctx.fillStyle = '#C0C800'; ctx.fillRect(0, 0, canvas.width, 15);
            ctx.fillStyle = '#F80070'; ctx.fillRect(0, 15, canvas.width, 10);

            // 3. Text Details
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.font = 'bold 42px Inter, sans-serif';
            ctx.fillText(currentEvent ? currentEvent.eventName : 'Zone21 Event', canvas.width/2, 110);

            ctx.font = 'bold 30px Inter, sans-serif';
            ctx.fillStyle = '#C0C800'; 
            ctx.fillText((ticket.ticketTypeName + ' TICKET').toUpperCase(), canvas.width/2, 170);

            ctx.fillStyle = '#ffffff';
            ctx.font = '22px Inter, sans-serif';
            ctx.fillText('Name: ' + ticket.buyerName, canvas.width/2, 220);
            ctx.font = '18px Inter, sans-serif';
            ctx.fillText('Ticket ID: ' + ticketId, canvas.width/2, 255);

            // 4. White box for QR
            const boxWidth = 460;
            const boxHeight = 540;
            const boxX = (canvas.width - boxWidth) / 2;
            const boxY = 300;
            ctx.fillStyle = '#ffffff';
            drawRoundRect(ctx, boxX, boxY, boxWidth, boxHeight, 24);

            // 5. Generate QR using Local Library (Reliable)
            const qrTempDiv = document.createElement('div');
            new QRCode(qrTempDiv, {
                text: ticket.qrCodeData || ticketId,
                width: 360, height: 360,
                colorDark : "#102838",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Wait for QRCode.js to draw to its canvas
            await new Promise(resolve => setTimeout(resolve, 300));
            const qrCanvas = qrTempDiv.querySelector('canvas');
            if(qrCanvas) {
                ctx.drawImage(qrCanvas, boxX + 50, boxY + 50, 360, 360);
            }

            // QR bottom text
            ctx.fillStyle = '#102838';
            ctx.font = 'bold 24px Inter, sans-serif';
            ctx.fillText('SCAN AT ENTRANCE', canvas.width/2, boxY + 460);
            ctx.font = '16px Inter, sans-serif';
            ctx.fillText('Powered by Zone21', canvas.width/2, boxY + 495);

            return canvas;
        }

        async function openShareModal(ticketId) {
            const modal = document.getElementById('share-modal');
            const content = document.getElementById('share-content');
            modal.style.display = 'flex';
            content.innerHTML = '<p style="text-align:center;">Generating Ticket Image...</p>';

            try {
                const doc = await db.collection('tickets').doc(ticketId).get();
                const ticket = doc.data();

                // Draw canvas
                const canvas = await generateTicketCanvas(ticket, ticketId);
                const dataUrl = canvas.toDataURL('image/png');
                currentTicketCanvas = canvas; // Save globally for sharing function

                content.innerHTML = `
                    <div style="text-align:center;">
                        <img src="${dataUrl}" style="max-width:100%; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.2); max-height:400px; object-fit:contain;">
                        
                        <div style="margin-top:20px; padding:15px; background:#f5f7fa; border-radius:12px;">
                            <h3 style="margin-bottom: 10px; font-size:1rem;">Send Image to Buyer</h3>
                            <p style="font-size:0.8rem; color:#666; margin-bottom:15px;">Use the button below to open your phone's share menu and attach the image directly to WhatsApp or Email.</p>
                            
                            <div class="button-group" style="justify-content:center;">
                                <button class="btn btn-lime" onclick="shareTicketNative('${ticketId}', '${ticket.buyerName}')" style="font-size:1rem; padding: 12px 20px;">
                                    <i class="fas fa-share-alt"></i> Share Image via App
                                </button>
                                
                                <a href="${dataUrl}" download="Zone21_Ticket_${ticket.buyerName.replace(/\s+/g,'_')}.png" class="btn btn-outline" style="font-size:1rem; padding: 12px 20px;">
                                    <i class="fas fa-download"></i> Save to Device
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                content.innerHTML = '<p style="color:red; text-align:center;">Failed to generate ticket.</p>';
            }
        }

        async function shareTicketNative(ticketId, buyerName) {
            if (!currentTicketCanvas) return;
            
            currentTicketCanvas.toBlob(async (blob) => {
                const file = new File([blob], `Zone21_Ticket_${buyerName}.png`, { type: 'image/png' });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'Zone21 Event Ticket',
                            text: `Hi ${buyerName}, attached is your official event ticket! Present the QR code at the entrance.`,
                            files: [file]
                        });
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            alert('Native sharing failed. Please use the Save/Download button instead.');
                        }
                    }
                } else {
                    alert('Direct image sharing is not supported on this browser. Click "Save to Device" and send it manually.');
                }
            }, 'image/png');
        }

        // ============ TICKET OVERVIEW LIST ============
        function loadAllTickets(eventId) {
            const list = document.getElementById('all-tickets-list');
            list.innerHTML = 'Loading...';
            db.collection('tickets').where('eventId', '==', eventId).onSnapshot(snapshot => {
                list.innerHTML = '';
                if (snapshot.empty) return list.innerHTML = 'No tickets yet.';
                
                let tickets = [];
                snapshot.forEach(doc => tickets.push({id: doc.id, ...doc.data()}));
                tickets.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                
                tickets.forEach(ticket => {
                    const div = document.createElement('div');
                    div.className = 'invoice-item';
                    div.innerHTML = `
                        <div class="info">
                            <strong>${ticket.buyerName}</strong> - ${ticket.ticketTypeName}
                        </div>
                        <button class="btn btn-outline" onclick="openShareModal('${ticket.id}')">View Ticket</button>
                    `;
                    list.appendChild(div);
                });
            });
        }

        // ============ SCANNER ============
        function openScanner() {
            document.getElementById('scanner-modal').style.display = 'flex';
            document.getElementById('scan-result').classList.add('hidden');
            startScanner();
        }

        function startScanner() {
            if (html5QrCode) html5QrCode.clear();
            html5QrCode = new Html5Qrcode("qr-reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    html5QrCode.stop().then(() => validateTicket(decodedText));
                },
                (err) => {}
            ).catch(err => {
                console.error("Camera error", err);
            });
        }

        async function scanFromFile(file) {
            if (!file) return;
            const tempScanner = new Html5Qrcode("qr-reader");
            try {
                const result = await tempScanner.scanFile(file, false);
                validateTicket(result);
            } catch(e) {
                alert("Could not read QR code from image.");
            }
        }
        
        function manualScanEntry() {
            const id = prompt("Enter Ticket ID:");
            if(id) validateTicket(id);
        }

        function closeScanner() {
            document.getElementById('scanner-modal').style.display = 'none';
            if (html5QrCode) html5QrCode.stop().catch(e=>console.log(e));
        }

        async function validateTicket(ticketId) {
            const resultDiv = document.getElementById('scan-result');
            resultDiv.className = 'scan-result';
            resultDiv.innerHTML = 'Validating...';

            try {
                const ticketDoc = await db.collection('tickets').doc(ticketId).get();
                if (!ticketDoc.exists) {
                    resultDiv.className = 'scan-result scan-invalid';
                    resultDiv.innerHTML = '<h3>❌ Ticket Not Found</h3>';
                    return;
                }
                const ticket = ticketDoc.data();

                if (ticket.status === 'scanned') {
                    resultDiv.className = 'scan-result scan-invalid';
                    resultDiv.innerHTML = `<h3>❌ Already Scanned</h3>`;
                    return;
                }

                await db.collection('tickets').doc(ticketId).update({ status: 'scanned', scannedAt: new Date().toISOString() });
                resultDiv.className = 'scan-result scan-valid';
                resultDiv.innerHTML = `<h3>✅ Valid Ticket</h3><p>Entry Granted: ${ticket.buyerName}</p>`;
            } catch (err) {
                resultDiv.className = 'scan-result scan-invalid';
                resultDiv.innerHTML = `<h3>❌ Error</h3>`;
            }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        window.onclick = function(e) { if(e.target.classList.contains('modal')) e.target.style.display = 'none'; }
    </script>
</body>
</html>
