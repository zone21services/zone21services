<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provider Hub | Zone21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        /* ===== ROOT & RESET ===== */
        :root {
            --navy: #0a1f2e;
            --navy-light: #1a3a4a;
            --lime: #C0C800;
            --lime-glow: rgba(192, 200, 0, 0.25);
            --pink: #F80070;
            --pink-glow: rgba(248, 0, 112, 0.15);
            --bg: #f0f2f6;
            --card: #ffffff;
            --text: #0f1a24;
            --text-secondary: #3d4f5e;
            --muted: #7a8a9a;
            --border: #e6eaf0;
            --radius: 18px;
            --radius-sm: 10px;
            --shadow-sm: 0 2px 8px rgba(10, 31, 46, 0.04);
            --shadow: 0 8px 32px rgba(10, 31, 46, 0.07);
            --shadow-hover: 0 16px 48px rgba(10, 31, 46, 0.12);
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --sidebar-width: 260px;
            --topbar-height: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--lime);
            border-radius: 10px;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--navy);
            color: #fff;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 40px rgba(10, 31, 46, 0.2);
            overflow-y: auto;
        }

        .sidebar .logo {
            padding: 22px 24px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--lime);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.02em;
        }
        .sidebar .logo i {
            font-size: 1.6rem;
            color: var(--lime);
        }
        .sidebar .logo span {
            color: #fff;
            font-weight: 400;
        }

        .sidebar .nav-links {
            flex: 1;
            padding: 20px 12px;
        }
        .sidebar .nav-links a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 2px;
            position: relative;
        }
        .sidebar .nav-links a:hover {
            background: rgba(192, 200, 0, 0.08);
            color: #fff;
        }
        .sidebar .nav-links a.active {
            background: rgba(192, 200, 0, 0.12);
            color: var(--lime);
            box-shadow: inset 0 0 0 1px rgba(192, 200, 0, 0.15);
        }
        .sidebar .nav-links a i {
            width: 20px;
            text-align: center;
            font-size: 1rem;
        }
        .sidebar .nav-links a .badge-nav {
            margin-left: auto;
            background: var(--pink);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .sidebar .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
            letter-spacing: 0.03em;
        }

        /* ===== MAIN WRAPPER ===== */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            height: var(--topbar-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(230, 234, 240, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 900;
            gap: 16px;
        }
        .topbar .menu-toggle {
            display: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--navy);
            background: none;
            border: none;
            padding: 4px;
        }
        .topbar .profile-dropdown {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 4px 12px 4px 4px;
            border-radius: 40px;
            background: var(--bg);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .topbar .profile-dropdown:hover {
            border-color: var(--lime);
            box-shadow: 0 2px 12px rgba(192, 200, 0, 0.1);
        }
        .topbar .profile-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--lime);
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid var(--lime);
        }
        .topbar .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .topbar .profile-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
            white-space: nowrap;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar .logout-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 6px;
            border-radius: 6px;
            transition: var(--transition);
        }
        .topbar .logout-btn:hover {
            color: var(--pink);
            background: rgba(248, 0, 112, 0.06);
        }

        /* ===== CONTENT ===== */
        .content {
            flex: 1;
            padding: 28px 32px 40px;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }
        .card .card-accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--lime), var(--pink));
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg);
        }
        .card-header h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header h3 i {
            color: var(--lime);
            font-size: 1.1rem;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            font-size: 0.8rem;
            white-space: nowrap;
            background: var(--bg);
            color: var(--text);
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-primary {
            background: var(--navy);
            color: #fff;
        }
        .btn-primary:hover {
            background: #14303f;
            box-shadow: 0 4px 16px rgba(10, 31, 46, 0.25);
        }
        .btn-lime {
            background: var(--lime);
            color: var(--navy);
        }
        .btn-lime:hover {
            background: #d4dd00;
            box-shadow: 0 4px 16px var(--lime-glow);
        }
        .btn-pink {
            background: var(--pink);
            color: #fff;
        }
        .btn-pink:hover {
            background: #e00066;
            box-shadow: 0 4px 16px var(--pink-glow);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--navy);
            color: var(--navy);
            background: rgba(10, 31, 46, 0.02);
        }
        .btn-sm {
            padding: 5px 14px;
            font-size: 0.7rem;
            border-radius: 20px;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }

        /* ===== SUBSCRIPTION STATUS CARD ===== */
        .sub-status {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            border-left: 4px solid var(--lime);
            margin-bottom: 20px;
        }
        .sub-status .info {
            flex: 1;
        }
        .sub-status .info h4 {
            font-size: 1rem;
            color: var(--navy);
        }
        .sub-status .info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .sub-status .badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            background: var(--lime);
            color: var(--navy);
        }
        .sub-status .badge.pending {
            background: #ffc107;
            color: #856404;
        }
        .sub-status .badge.expired {
            background: var(--pink);
            color: #fff;
        }
        .sub-status .badge.active {
            background: #28a745;
            color: #fff;
        }

        /* ===== RENEW FORM ===== */
        .renew-form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-top: 12px;
        }
        .renew-form select {
            padding: 8px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            background: #fff;
            min-width: 120px;
        }
        .renew-form .btn {
            margin-top: 0;
        }

        /* ===== PROFILE EDIT FORM ===== */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .input-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--navy);
        }
        .input-group input,
        .input-group textarea,
        .input-group select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            background: #f9fafb;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus,
        .input-group textarea:focus {
            border-color: var(--navy);
            background: white;
        }
        .full-width {
            grid-column: 1 / -1;
        }

        /* ===== PROFILE DISPLAY ===== */
        .profile-summary {
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }
        .profile-summary .avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--navy);
            color: var(--lime);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            flex-shrink: 0;
            overflow: hidden;
            border: 3px solid var(--lime);
            box-shadow: 0 4px 16px rgba(192, 200, 0, 0.2);
        }
        .profile-summary .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-summary .info h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--navy);
            letter-spacing: -0.02em;
        }
        .profile-summary .info .subtitle {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 4px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .profile-summary .info .subtitle span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .profile-summary .info .subtitle i {
            color: var(--lime);
            width: 16px;
        }

        /* ===== MODAL FOR INVOICE ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: var(--radius);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 0;
            position: relative;
        }
        .modal-close-btn {
            position: sticky;
            top: 0;
            right: 0;
            float: right;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--navy);
            padding: 12px 20px;
            z-index: 10;
        }
        .modal-close-btn:hover {
            color: var(--pink);
        }

        /* ===== INVOICE STYLES ===== */
        .invoice-wrapper {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            margin: 0;
        }
        .invoice-header-bar {
            background: var(--navy);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .invoice-header-bar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .invoice-header-bar .brand .logo-mark {
            width: 38px;
            height: 38px;
            background: var(--lime);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--navy);
        }
        .invoice-header-bar .brand h2 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .invoice-header-bar .brand h2 span {
            color: var(--lime);
        }
        .invoice-header-bar .invoice-number {
            text-align: right;
        }
        .invoice-header-bar .invoice-number .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            opacity: 0.6;
            font-weight: 600;
        }
        .invoice-header-bar .invoice-number .number {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }
        .invoice-body {
            padding: 2.5rem 2.5rem 2rem;
            position: relative;
        }
        .unpaid-stamp {
            position: absolute;
            top: 2rem;
            right: 2.5rem;
            transform: rotate(18deg);
            border: 4px solid var(--danger);
            color: var(--danger);
            font-size: 1.8rem;
            font-weight: 900;
            padding: 0.4rem 1.2rem;
            border-radius: 8px;
            opacity: 0.55;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            pointer-events: none;
            background: rgba(220, 38, 38, 0.04);
            font-family: 'Inter', sans-serif;
            line-height: 1.2;
            text-align: center;
            z-index: 5;
        }
        .unpaid-stamp small {
            display: block;
            font-size: 0.65rem;
            font-weight: 600;
            opacity: 0.7;
        }
        .invoice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .invoice-grid .bill-to h4,
        .invoice-grid .invoice-meta h4 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .invoice-grid .bill-to .name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--navy);
        }
        .invoice-grid .bill-to .email {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .invoice-grid .invoice-meta .meta-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }
        .invoice-grid .invoice-meta .meta-row:last-child {
            border-bottom: none;
        }
        .invoice-grid .invoice-meta .meta-row .meta-label {
            color: var(--text-muted);
            font-weight: 500;
        }
        .invoice-grid .invoice-meta .meta-row .meta-value {
            font-weight: 700;
            color: var(--navy);
        }
        .invoice-grid .invoice-meta .meta-row .meta-value.danger {
            color: var(--danger);
        }
        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0 2rem;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .invoice-table thead {
            background: var(--navy);
            color: #fff;
        }
        .invoice-table thead th {
            padding: 0.9rem 1.2rem;
            text-align: left;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 700;
        }
        .invoice-table tbody td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .invoice-table tbody tr:last-child td {
            border-bottom: none;
        }
        .invoice-table tbody .item-desc {
            font-weight: 600;
            color: var(--navy);
        }
        .invoice-table tbody .item-amount {
            font-weight: 700;
            color: var(--navy);
        }
        .invoice-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            background: var(--bg);
            border-radius: var(--radius-md);
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }
        .invoice-total-row .total-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .invoice-total-row .total-amount {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--pink);
        }
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin: 1.5rem 0 1.8rem;
        }
        .payment-method-card {
            background: var(--bg);
            border-radius: var(--radius-md);
            padding: 1.2rem 1.2rem 1rem;
            border: 1px solid var(--border);
            text-align: center;
            transition: var(--transition);
        }
        .payment-method-card:hover {
            border-color: var(--navy);
            background: var(--card);
            box-shadow: var(--shadow-sm);
        }
        .payment-method-card .method-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            overflow: hidden;
            padding: 6px;
        }
        .payment-method-card .method-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .payment-method-card .method-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--navy);
            margin-bottom: 2px;
        }
        .payment-method-card .method-detail {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .payment-method-card .method-account {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 2px;
        }
        .payment-instructions {
            background: rgba(11, 26, 43, 0.02);
            border-left: 4px solid var(--lime);
            padding: 1.2rem 1.5rem;
            border-radius: var(--radius-md);
            margin: 1.5rem 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .payment-instructions strong {
            color: var(--navy);
        }
        .invoice-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        .invoice-actions .btn {
            flex: 1;
            min-width: 160px;
        }
        .invoice-footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1.5rem;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .invoice-footer-note i {
            color: var(--lime);
        }

        /* ===== BENEFITS LIST ===== */
        .benefits-list {
            list-style: none;
            margin: 10px 0 14px;
            padding: 0;
        }
        .benefits-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 4px 0;
        }
        .benefits-list li i {
            color: var(--lime);
            width: 18px;
            text-align: center;
        }

        /* ===== HIDDEN ===== */
        .hidden {
            display: none !important;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            animation: slideInRight 0.3s ease;
            max-width: 400px;
        }
        .toast.error {
            background: var(--pink);
        }
        .toast.success {
            background: #28a745;
        }
        .toast.info {
            background: var(--navy);
        }
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-wrapper {
                margin-left: 0;
                width: 100%;
            }
            .topbar {
                padding: 0 16px;
            }
            .topbar .menu-toggle {
                display: block;
            }
            .topbar .profile-name {
                display: none;
            }
            .content {
                padding: 16px;
            }
            .card {
                padding: 16px 18px;
            }
            .profile-summary {
                flex-direction: column;
                align-items: flex-start;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .renew-form {
                flex-direction: column;
                align-items: stretch;
            }
            .invoice-body {
                padding: 1.2rem 1rem 1.2rem;
            }
            .invoice-header-bar {
                padding: 0.8rem 1rem;
                flex-direction: column;
                align-items: flex-start;
            }
            .invoice-header-bar .invoice-number {
                text-align: left;
                width: 100%;
            }
            .unpaid-stamp {
                font-size: 1rem;
                padding: 0.15rem 0.6rem;
                top: 1rem;
                right: 1rem;
                transform: rotate(15deg);
            }
            .unpaid-stamp small {
                font-size: 0.45rem;
            }
            .invoice-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .payment-methods {
                grid-template-columns: 1fr;
            }
            .invoice-actions {
                flex-direction: column;
            }
            .invoice-actions .btn {
                min-width: auto;
            }
        }
    </style>
</head>
<body>

            <!-- ===== SUBSCRIPTION TAB ===== -->

            <!-- ===== SETTINGS TAB ===== -->

    <!-- ===== INVOICE MODAL ===== -->
    <div class="modal-overlay" id="invoiceModal">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="closeInvoiceModal()">&times;</button>
            <div id="invoice-container"></div>
        </div>
    </div>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    FIREBASE + FULL LOGIC
    ============================================================ -->
    <script>
        // ============================================================
        //  FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        //  STATE
        // ============================================================
        let currentUser = null;
        let providerDocId = null;
        let providerData = null;
        let subscriptionData = null;
        let isEditingProfile = false;

        // ============================================================
        //  AUTH STATE
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('topbar-name').textContent = user.email || 'Provider';
                await loadProviderData(user);
                await loadSubscriptionData();
                renderDashboard();
                switchTab('dashboard');
            } else {
                window.location.href = 'index.html';
            }
        });

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = '0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
        window.showToast = showToast;

        // ============================================================
        //  LOAD PROVIDER DATA
        // ============================================================
        async function loadProviderData(user) {
            try {
                let docSnap = await db.collection('serviceProviders').doc(user.uid).get();
                if (docSnap.exists) {
                    providerDocId = docSnap.id;
                    providerData = docSnap.data();
                } else {
                    const snapshot = await db.collection('serviceProviders')
                        .where('email', '==', user.email)
                        .limit(1)
                        .get();
                    if (!snapshot.empty) {
                        providerDocId = snapshot.docs[0].id;
                        providerData = snapshot.docs[0].data();
                    } else {
                        const defaultData = {
                            name: user.email.split('@')[0] || 'My Business',
                            category: '',
                            service: '',
                            description: '',
                            phone: '',
                            email: user.email,
                            location: '',
                            basePrice: 0,
                            avatar: null,
                            rating: 0,
                            reviewsCount: 0,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            subscriptionActive: false,
                            subscriptionPlan: null,
                            subscriptionExpiry: null,
                            subscriptionStatus: 'none'
                        };
                        await db.collection('serviceProviders').doc(user.uid).set(defaultData);
                        providerDocId = user.uid;
                        providerData = defaultData;
                    }
                }
                updateTopbarAvatar();
            } catch (error) {
                console.error('Error loading provider data:', error);
                showToast('Failed to load profile data', 'error');
            }
        }

        // ============================================================
        //  LOAD SUBSCRIPTION DATA
        // ============================================================
        async function loadSubscriptionData() {
            if (!providerDocId) return;
            try {
                const subSnap = await db.collection('subscriptions')
                    .where('providerId', '==', providerDocId)
                    .orderBy('createdAt', 'desc')
                    .limit(1)
                    .get();
                if (!subSnap.empty) {
                    subscriptionData = subSnap.docs[0].data();
                    subscriptionData.id = subSnap.docs[0].id;
                    // Update providerData with subscription info
                    if (subscriptionData.status === 'active' && subscriptionData.expiryDate) {
                        providerData.subscriptionActive = true;
                        providerData.subscriptionExpiry = subscriptionData.expiryDate;
                        providerData.subscriptionStatus = 'active';
                    } else if (subscriptionData.status === 'pending') {
                        providerData.subscriptionActive = false;
                        providerData.subscriptionStatus = 'pending';
                    } else {
                        providerData.subscriptionActive = false;
                        providerData.subscriptionStatus = 'none';
                    }
                    providerData.subscriptionPlan = subscriptionData.planName || null;
                } else {
                    subscriptionData = null;
                    providerData.subscriptionActive = false;
                    providerData.subscriptionStatus = 'none';
                    providerData.subscriptionPlan = null;
                }
            } catch (error) {
                console.error('Error loading subscription:', error);
            }
        }

        // ============================================================
        //  UPDATE TOPBAR AVATAR
        // ============================================================
        function updateTopbarAvatar() {
            const container = document.getElementById('topbar-avatar');
            if (providerData && providerData.avatar && providerData.avatar.startsWith('data:image')) {
                container.innerHTML = `<img src="${providerData.avatar}" alt="Avatar" />`;
            } else {
                const initials = (providerData && providerData.name) ? providerData.name.split(' ').map(w => w.charAt(0)).join('')
                    .substring(0, 2).toUpperCase() : 'P';
                container.innerHTML = `<span>${initials}</span>`;
            }
            if (providerData && providerData.name) {
                document.getElementById('topbar-name').textContent = providerData.name;
            }
        }

        // ============================================================
        //  RENDER DASHBOARD
        // ============================================================
        function renderDashboard() {
            const container = document.getElementById('dashboard-content');
            const status = providerData ? providerData.subscriptionStatus : 'none';
            const plan = providerData ? providerData.subscriptionPlan : null;
            const expiry = providerData && providerData.subscriptionExpiry ? (providerData.subscriptionExpiry.toDate ?
                providerData.subscriptionExpiry.toDate() : new Date(providerData.subscriptionExpiry)) : null;
            const now = new Date();
            const expired = expiry && expiry < now;

            let html = '';

            // Subscription status card
            let statusBadge = '';
            let statusText = '';
            if (status === 'pending') {
                statusBadge = 'badge pending';
                statusText = 'Pending Approval';
            } else if (status === 'active' && !expired) {
                statusBadge = 'badge active';
                statusText = 'Active';
            } else if (status === 'active' && expired) {
                statusBadge = 'badge expired';
                statusText = 'Expired';
            } else {
                statusBadge = 'badge expired';
                statusText = 'No Subscription';
            }

            html += `
                <div class="sub-status">
                    <div class="info">
                        <h4>Subscription Status</h4>
                        <p>${plan ? `Plan: ${plan}` : 'No plan selected'}</p>
                        ${expiry ? `<p>Expires: ${expiry.toLocaleDateString()}</p>` : ''}
                        ${status === 'pending' ? '<p>Your payment is being verified. You will get access once approved.</p>' : ''}
                    </div>
                    <span class="badge ${statusBadge}">${statusText}</span>
                </div>
            `;

            if (status === 'active' && !expired) {
                html += `
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:16px; margin-top:12px;">
                        <div style="background:var(--bg); padding:14px; border-radius:var(--radius-sm);">
                            <div style="font-size:1.2rem; font-weight:800; color:var(--navy);">${providerData.rating || 0}</div>
                            <div style="font-size:0.7rem; color:var(--muted);">Rating</div>
                        </div>
                        <div style="background:var(--bg); padding:14px; border-radius:var(--radius-sm);">
                            <div style="font-size:1.2rem; font-weight:800; color:var(--navy);">${providerData.reviewsCount || 0}</div>
                            <div style="font-size:0.7rem; color:var(--muted);">Reviews</div>
                        </div>
                        <div style="background:var(--bg); padding:14px; border-radius:var(--radius-sm);">
                            <div style="font-size:1.2rem; font-weight:800; color:var(--navy);">${providerData.views || 0}</div>
                            <div style="font-size:0.7rem; color:var(--muted);">Profile Views</div>
                        </div>
                    </div>
                `;
                html += `
                    <div style="margin-top:16px;">
                        <a href="#" onclick="switchTab('renew'); return false;" class="btn btn-lime btn-sm"><i class="fas fa-sync-alt"></i> Renew Subscription</a>
                        <a href="#" onclick="switchTab('profile'); return false;" class="btn btn-outline btn-sm"><i class="fas fa-user-edit"></i> Manage Profile</a>
                    </div>
                `;
            } else if (status === 'pending') {
                html += `
                    <div style="margin-top:16px; padding:12px; background:#fff3cd; border-radius:var(--radius-sm);">
                        <p><i class="fas fa-hourglass-half"></i> Your subscription is pending approval. Please wait or <a href="#" onclick="viewInvoice()">view invoice</a>.</p>
                    </div>
                `;
            } else {
                html += `
                    <div style="margin-top:16px; padding:20px; text-align:center; background:#f8f9fa; border-radius:var(--radius-sm);">
                        <i class="fas fa-lock" style="font-size:2rem; color:var(--pink);"></i>
                        <h4 style="margin:10px 0;">Subscribe to activate your profile</h4>
                        <p style="color:var(--text-secondary);">Choose a plan that fits your needs and start offering your services.</p>
                        <a href="#" onclick="switchTab('renew'); return false;" class="btn btn-lime" style="margin-top:12px;"><i class="fas fa-rocket"></i> Subscribe Now</a>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // ============================================================
        //  RENDER PROFILE
        // ============================================================
        function renderProfile() {
            const container = document.getElementById('profile-content');
            const isActive = providerData && providerData.subscriptionActive;
            const isExpired = providerData && providerData.subscriptionExpiry && new Date(providerData.subscriptionExpiry.toDate ?
                providerData.subscriptionExpiry.toDate() : providerData.subscriptionExpiry) < new Date();

            if (!isActive || isExpired) {
                container.innerHTML = `
                    <div style="padding:30px; text-align:center; background:#f8f9fa; border-radius:var(--radius-sm);">
                        <i class="fas fa-lock" style="font-size:2.5rem; color:var(--pink);"></i>
                        <h4 style="margin:12px 0;">Profile Locked</h4>
                        <p style="color:var(--text-secondary);">You need an active subscription to manage your profile.</p>
                        <a href="#" onclick="switchTab('renew'); return false;" class="btn btn-lime" style="margin-top:12px;"><i class="fas fa-rocket"></i> Subscribe Now</a>
                    </div>
                `;
                document.getElementById('editProfileToggle').style.display = 'none';
                return;
            }

            document.getElementById('editProfileToggle').style.display = 'inline-flex';

            if (isEditingProfile) {
                // Edit form
                const servicesList = [
                    "Venue / Space Rental",
                    "Marquee / Tents & Chairs",
                    "PA System & Basic Sound",
                    "DJ Services",
                    "Stage & Decorative Lighting",
                    "Event Décor & Draping",
                    "Catering (Food & Buffet)",
                    "Beverages & Mobile Bar",
                    "Cake Designer / Baker",
                    "Photographer",
                    "Videographer",
                    "MC (Master of Ceremonies)",
                    "Makeup Artist",
                    "Hairstylist",
                    "Transport / Car Hire",
                    "Cleaning Services",
                    "Ushers & Hostesses"
                ];
                const selected = providerData.service || '';

                container.innerHTML = `
                    <div class="form-grid">
                        <div class="input-group"><label>Business/Company Name</label><input type="text" id="e-name" value="${providerData.name || ''}" /></div>
                        <div class="input-group"><label>Location</label><input type="text" id="e-loc" value="${providerData.location || ''}" /></div>
                        <div class="input-group"><label>Main Service *</label>
                            <select id="e-service">
                                <option value="">-- Select your main service --</option>
                                ${servicesList.map(s => `<option value="${s}" ${s === selected ? 'selected' : ''}>${s}</option>`).join('')}
                                <option value="Other" ${selected === 'Other' ? 'selected' : ''}>Other (specify below)</option>
                            </select>
                        </div>
                        <div class="input-group" id="other-service-group" style="${selected === 'Other' ? 'display:block' : 'display:none'}">
                            <label>Other Service</label>
                            <input type="text" id="e-other-service" value="${selected === 'Other' ? providerData.service : ''}" placeholder="Specify your service" />
                        </div>
                        <div class="input-group"><label>Base Price ($)</label><input type="number" id="e-price" value="${providerData.basePrice || ''}" /></div>
                        <div class="input-group"><label>WhatsApp/Phone</label><input type="text" id="e-phone" value="${providerData.phone || ''}" /></div>
                        <div class="input-group full-width"><label>Description</label><textarea id="e-desc" rows="3">${providerData.description || ''}</textarea></div>
                        <div class="input-group full-width"><label>Social Links (optional)</label></div>
                        <div class="input-group"><label>Facebook</label><input type="text" id="e-fb" value="${providerData.facebook || ''}" /></div>
                        <div class="input-group"><label>Instagram</label><input type="text" id="e-ig" value="${providerData.instagram || ''}" /></div>
                        <div class="input-group"><label>TikTok</label><input type="text" id="e-tt" value="${providerData.tiktok || ''}" /></div>
                        <div class="input-group"><label>YouTube</label><input type="text" id="e-yt" value="${providerData.youtube || ''}" /></div>
                        <div class="input-group"><label>Website</label><input type="text" id="e-web" value="${providerData.website || ''}" /></div>
                    </div>
                    <button class="btn btn-lime btn-block" onclick="saveProfile()" style="margin-top:16px;"><i class="fas fa-save"></i> Save Changes</button>
                    <button class="btn btn-outline btn-block" onclick="cancelEditProfile()" style="margin-top:8px;">Cancel</button>
                `;

                document.getElementById('e-service').addEventListener('change', function() {
                    const group = document.getElementById('other-service-group');
                    if (this.value === 'Other') {
                        group.style.display = 'block';
                    } else {
                        group.style.display = 'none';
                    }
                });

            } else {
                // View mode
                const initials = (providerData.name || '?').split(' ').map(w => w.charAt(0)).join('').substring(0, 2).toUpperCase();
                const avatarHtml = providerData.avatar ? `<img src="${providerData.avatar}" alt="Avatar">` : initials;
                const service = providerData.service || 'Not specified';

                container.innerHTML = `
                    <div class="profile-summary">
                        <div class="avatar-large">${avatarHtml}</div>
                        <div class="info">
                            <h2>${providerData.name || 'Unnamed Provider'}</h2>
                            <div class="subtitle">
                                <span><i class="fas fa-tag"></i> ${service}</span>
                                <span><i class="fas fa-map-pin"></i> ${providerData.location || 'Location not set'}</span>
                                <span><i class="fas fa-star" style="color:#ffb400;"></i> ${(providerData.rating || 0).toFixed(1)} (${providerData.reviewsCount || 0} reviews)</span>
                            </div>
                            ${providerData.basePrice ? `<div style="margin-top:6px; font-weight:600; color:var(--pink);"><i class="fas fa-tag"></i> Starts at $${providerData.basePrice}</div>` : ''}
                            ${providerData.description ? `<div style="margin-top:10px; line-height:1.6;">${providerData.description}</div>` : ''}
                            ${providerData.phone ? `<div style="margin-top:8px;"><i class="fas fa-phone"></i> ${providerData.phone}</div>` : ''}

        // ============================================================
        //  PROFILE EDIT CONTROLS
        // ============================================================
        function toggleProfileEdit() {
            isEditingProfile = !isEditingProfile;
            renderProfile();
        }
        window.toggleProfileEdit = toggleProfileEdit;

        function cancelEditProfile() {
            isEditingProfile = false;
            renderProfile();
        }
        window.cancelEditProfile = cancelEditProfile;

        async function saveProfile() {
            const name = document.getElementById('e-name').value.trim();
            const location = document.getElementById('e-loc').value.trim();
            const serviceSelect = document.getElementById('e-service');
            let service = serviceSelect.value;
            if (service === 'Other') {
                service = document.getElementById('e-other-service').value.trim() || 'Other';
            }
            const price = parseFloat(document.getElementById('e-price').value) || 0;
            const phone = document.getElementById('e-phone').value.trim();
            const desc = document.getElementById('e-desc').value.trim();
            const fb = document.getElementById('e-fb').value.trim();
            const ig = document.getElementById('e-ig').value.trim();
            const tt = document.getElementById('e-tt').value.trim();
            const yt = document.getElementById('e-yt').value.trim();
            const web = document.getElementById('e-web').value.trim();

            if (!name) { showToast('Business name is required.', 'error'); return; }
            if (!service) { showToast('Please select your main service.', 'error'); return; }

            try {
                await db.collection('serviceProviders').doc(providerDocId).update({
                    name,
                    location,
                    service,
                    basePrice: price,
                    phone,
                    description: desc,
                    facebook: fb,
                    instagram: ig,
                    tiktok: tt,
                    youtube: yt,
                    website: web,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                providerData = { ...providerData, name, location, service, basePrice: price, phone, description: desc,
                    facebook: fb, instagram: ig, tiktok: tt, youtube: yt, website: web };
                isEditingProfile = false;
                renderProfile();
                updateTopbarAvatar();
                showToast('Profile updated successfully!', 'success');
            } catch (error) {
                console.error('Error saving profile:', error);
                showToast('Failed to save profile: ' + error.message, 'error');
            }
        }
        window.saveProfile = saveProfile;

        // ============================================================
        //  RENDER SUBSCRIPTION TAB
        // ============================================================
        function renderSubscription() {
            const container = document.getElementById('subscription-content');

                        <p style="margin-top:10px;">No subscription found. <a href="#" onclick="switchTab('renew'); return false;">Subscribe now</a></p>
                    </div>
                `;
                return;
            }
            const status = subscriptionData.status || 'pending';
            const plan = subscriptionData.planName || 'Unknown';
            const months = subscriptionData.months || 1;
            const total = subscriptionData.total || 0;
            const createdAt = subscriptionData.createdAt ? (subscriptionData.createdAt.toDate ? subscriptionData.createdAt.toDate() :
                new Date(subscriptionData.createdAt)) : null;
            const expiry = providerData && providerData.subscriptionExpiry ? (providerData.subscriptionExpiry.toDate ? providerData
                .subscriptionExpiry.toDate() : new Date(providerData.subscriptionExpiry)) : null;

            let statusHtml = '';
            if (status === 'pending') statusHtml = '<span class="badge pending">Pending Approval</span>';
            else if (status === 'active') statusHtml = '<span class="badge active">Active</span>';
            else if (status === 'expired') statusHtml = '<span class="badge expired">Expired</span>';
            else statusHtml = '<span class="badge">Unknown</span>';

            container.innerHTML = `
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                    <div style="background:var(--bg); padding:14px; border-radius:var(--radius-sm);">
                        <div style="font-size:0.8rem; color:var(--muted);">Plan</div>
                        <div style="font-weight:700; font-size:1.1rem;">${plan}</div>
                    </div>
                    <div style="background:var(--bg); padding:14px; border-radius:var(--radius-sm);">
                        <div style="font-size:0.8rem; color:var(--muted);">Status</div>
                        <div>${statusHtml}</div>
                    </div>
                    <div style="background:var(--bg); padding:14px; border-radius:var(--radius-sm);">
                        <div style="font-size:0.8rem; color:var(--muted);">Months Paid</div>
                        <div style="font-weight:700;">${months}</div>
                    </div>
                    <div style="background:var(--bg); padding:14px; border-radius:var(--radius-sm);">
                        <div style="font-size:0.8rem; color:var(--muted);">Total Paid</div>
                        <div style="font-weight:700; color:var(--pink);">$${total}</div>
                    </div>
                    ${createdAt ? `<div style="background:var(--bg); padding:14px; border-radius:var(--radius-sm); grid-column: 1/-1;">
                        <div style="font-size:0.8rem; color:var(--muted);">Subscription Start</div>
                        <div>${createdAt.toLocaleDateString()}</div>
                    </div>` : ''}
                    ${expiry ? `<div style="background:var(--bg); padding:14px; border-radius:var(--radius-sm); grid-column: 1/-1;">

                    </div>` : ''}

                ${status === 'pending' ? `<div style="margin-top:16px;"><button class="btn btn-outline" onclick="viewInvoice()"><i class="fas fa-file-invoice"></i> View Invoice</button></div>` : ''}
                ${status === 'active' && expiry && expiry < new Date() ? `<div style="margin-top:16px; padding:12px; background:#ffebee; border-radius:var(--radius-sm);">
                    <p><i class="fas fa-exclamation-triangle" style="color:var(--pink);"></i> Your subscription has expired. <a href="#" onclick="switchTab('renew'); return false;">Renew now</a></p>
                </div>` : ''}
            `;
        }

                    Total cost: $<span id="renew-total">${planPrice}</span> (${planPrice} per month)

            document.getElementById('months-select').addEventListener('change', function() {
                const months = parseInt(this.value);
                document.getElementById('renew-total').textContent = (planPrice * months).toFixed(2);

        // ============================================================
        //  PLAN SELECTION
        // ============================================================
        function selectPlan(planName, price) {
            localStorage.setItem('zone21_provider_plan_name', planName);
            localStorage.setItem('zone21_provider_plan_price', price);
            localStorage.setItem('zone21_provider_plan_id', planName.toLowerCase().replace(/\s/g, ''));
            window.location.href = 'provider-checkout.html';
        }
        window.selectPlan = selectPlan;

        // ============================================================
        //  RENEW SUBSCRIPTION
        // ============================================================
        async function renewSubscription() {
            if (!currentUser) { showToast('Please sign in.', 'error'); return; }
            const months = parseInt(document.getElementById('months-select').value);
            const planName = providerData.subscriptionPlan;
            const price = planName === 'Venue' ? 50 : 10;
            const total = price * months;

            const invNumber = 'INV-' + Math.floor(100000 + Math.random() * 900000);
            const dateStr = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

            try {
                await db.collection('invoices').add({
                    providerId: providerDocId,
                    userId: currentUser.uid,
                    invoiceNumber: invNumber,
                    planName: planName,
                    months: months,
                    total: total,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    type: 'subscription_renewal'
                });

                const subRef = db.collection('subscriptions').doc();
                await subRef.set({
                    providerId: providerDocId,
                    userId: currentUser.uid,
                    planName: planName,
                    months: months,
                    total: total,
                    invoiceNumber: invNumber,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                await db.collection('serviceProviders').doc(providerDocId).update({
                    subscriptionStatus: 'pending',
                    subscriptionPlan: planName
                });

                showToast('Invoice generated! Please make payment and submit proof.', 'success');
                await loadSubscriptionData();
                renderSubscription();
                renderDashboard();
                switchTab('subscription');
            } catch (error) {
                console.error('Renew error:', error);
                showToast('Failed to process renewal: ' + error.message, 'error');
            }
        }
        window.renewSubscription = renewSubscription;

        // ============================================================
        //  CLOSE INVOICE MODAL
        // ============================================================
        function closeInvoiceModal() {
            document.getElementById('invoiceModal').classList.remove('active');
        }
        window.closeInvoiceModal = closeInvoiceModal;

        // ============================================================
        //  TAB SWITCHING
        // ============================================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById('tab-' + tab);
            if (target) target.classList.remove('hidden');

            document.querySelectorAll('.sidebar .nav-links a').forEach(link => link.classList.remove('active'));
            const activeLink = document.querySelector(`.sidebar .nav-links a[data-tab="${tab}"]`);
            if (activeLink) activeLink.classList.add('active');

            if (tab === 'dashboard') renderDashboard();
            else if (tab === 'profile') renderProfile();
            else if (tab === 'subscription') renderSubscription();
            else if (tab === 'renew') renderRenew();

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }
        window.switchTab = switchTab;

        // ============================================================
        //  EVENT LISTENERS
        // ============================================================
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });

        document.querySelectorAll('.sidebar .nav-links a[data-tab]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                switchTab(link.dataset.tab);
            });
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = 'index.html');
        });
        document.getElementById('logout-link').addEventListener('click', (e) => {
            e.preventDefault();
            auth.signOut().then(() => window.location.href = 'index.html');
        });

        document.getElementById('editProfileToggle').addEventListener('click', () => {
            toggleProfileEdit();
        });

        // ============================================================
        //  SETTINGS FUNCTIONS
        // ============================================================
        async function changeEmail() {
            const newEmail = document.getElementById('new-email').value.trim();
            if (!newEmail) { showToast('Enter a new email address.', 'error'); return; }
            try {
                await currentUser.updateEmail(newEmail);
                await db.collection('serviceProviders').doc(providerDocId).update({ email: newEmail });
                showToast('Email updated. Please re-login.', 'success');
                await auth.signOut();
            } catch (error) {
                showToast('Failed to update email: ' + error.message, 'error');
            }
        }
        window.changeEmail = changeEmail;

        async function changePassword() {
            const newPassword = document.getElementById('new-password').value;
            if (!newPassword || newPassword.length < 6) { showToast('Password must be at least 6 characters.', 'error'); return; }
            try {
                await currentUser.updatePassword(newPassword);
                showToast('Password updated successfully.', 'success');
                document.getElementById('new-password').value = '';
            } catch (error) {
                showToast('Failed to update password: ' + error.message, 'error');
            }
        }
        window.changePassword = changePassword;

        console.log('Provider Hub with Invoice Viewer loaded.');
    </script>
