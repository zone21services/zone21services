<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provider Hub | Zone21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <style>
        /* ===== ROOT & RESET ===== */
        :root {
            --navy: #0a1f2e;
            --navy-light: #1a3a4a;
            --lime: #C0C800;
            --lime-glow: rgba(192, 200, 0, 0.25);
            --pink: #F80070;
            --pink-glow: rgba(248, 0, 112, 0.15);
            --bg: #f0f2f6;
            --card: #ffffff;
            --text: #0f1a24;
            --text-secondary: #3d4f5e;
            --muted: #7a8a9a;
            --border: #e6eaf0;
            --radius: 18px;
            --radius-sm: 10px;
            --shadow-sm: 0 2px 8px rgba(10, 31, 46, 0.04);
            --shadow: 0 8px 32px rgba(10, 31, 46, 0.07);
            --shadow-hover: 0 16px 48px rgba(10, 31, 46, 0.12);
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --sidebar-width: 260px;
            --topbar-height: 64px;
            --danger: #DC2626;
            --success: #10B981;
            --warning: #F59E0B;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--lime);
            border-radius: 10px;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--navy);
            color: #fff;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 40px rgba(10, 31, 46, 0.2);
            overflow-y: auto;
        }
        .sidebar .logo {
            padding: 22px 24px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--lime);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .logo i {
            font-size: 1.6rem;
            color: var(--lime);
        }
        .sidebar .logo span {
            color: #fff;
            font-weight: 400;
        }
        .sidebar .nav-links {
            flex: 1;
            padding: 20px 12px;
        }
        .sidebar .nav-links a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 2px;
        }
        .sidebar .nav-links a:hover {
            background: rgba(192, 200, 0, 0.08);
            color: #fff;
        }
        .sidebar .nav-links a.active {
            background: rgba(192, 200, 0, 0.12);
            color: var(--lime);
            box-shadow: inset 0 0 0 1px rgba(192, 200, 0, 0.15);
        }
        .sidebar .nav-links a i {
            width: 20px;
            text-align: center;
            font-size: 1rem;
        }
        .sidebar .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
        }

        /* ===== MAIN WRAPPER ===== */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== TOPBAR ===== */
        .topbar {
            height: var(--topbar-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(230, 234, 240, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 900;
            gap: 16px;
        }
        .topbar .menu-toggle {
            display: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--navy);
            background: none;
            border: none;
            padding: 4px;
        }
        .topbar .profile-dropdown {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 4px 12px 4px 4px;
            border-radius: 40px;
            background: var(--bg);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .topbar .profile-dropdown:hover {
            border-color: var(--lime);
            box-shadow: 0 2px 12px rgba(192, 200, 0, 0.1);
        }
        .topbar .profile-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--lime);
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid var(--lime);
        }
        .topbar .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .topbar .profile-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
            white-space: nowrap;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar .logout-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 6px;
            border-radius: 6px;
            transition: var(--transition);
        }
        .topbar .logout-btn:hover {
            color: var(--pink);
            background: rgba(248, 0, 112, 0.06);
        }

        /* ===== CONTENT ===== */
        .content {
            flex: 1;
            padding: 28px 32px 40px;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }
        .card .card-accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--lime), var(--pink));
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg);
        }
        .card-header h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header h3 i {
            color: var(--lime);
            font-size: 1.1rem;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            font-size: 0.8rem;
            white-space: nowrap;
            background: var(--bg);
            color: var(--text);
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-primary {
            background: var(--navy);
            color: #fff;
        }
        .btn-primary:hover {
            background: #14303f;
            box-shadow: 0 4px 16px rgba(10, 31, 46, 0.25);
        }
        .btn-lime {
            background: var(--lime);
            color: var(--navy);
        }
        .btn-lime:hover {
            background: #d4dd00;
            box-shadow: 0 4px 16px var(--lime-glow);
        }
        .btn-pink {
            background: var(--pink);
            color: #fff;
        }
        .btn-pink:hover {
            background: #e00066;
            box-shadow: 0 4px 16px var(--pink-glow);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--navy);
            color: var(--navy);
            background: rgba(10, 31, 46, 0.02);
        }
        .btn-sm {
            padding: 5px 14px;
            font-size: 0.7rem;
            border-radius: 20px;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-warning {
            background: var(--warning);
            color: #fff;
        }
        .btn-warning:hover {
            background: #d97706;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== PLAN CARDS ===== */
        .plans-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .plan-card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            background: #fff;
            transition: var(--transition);
            position: relative;
        }
        .plan-card:hover {
            box-shadow: var(--shadow-hover);
        }
        .plan-card.locked {
            opacity: 0.6;
            filter: grayscale(0.4);
            pointer-events: none;
        }
        .plan-card.locked::after {
            content: "🔒 LOCKED";
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--danger);
            background: rgba(220, 38, 38, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--danger);
        }
        .plan-card .lock-banner {
            background: rgba(220, 38, 38, 0.06);
            border: 1px solid var(--danger);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--danger);
            font-weight: 600;
            font-size: 0.8rem;
        }
        .plan-card .lock-banner i {
            font-size: 1rem;
        }
        .plan-card h4 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--navy);
        }
        .plan-card .price {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--pink);
            margin: 6px 0 12px;
        }
        .plan-card .price small {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--muted);
        }
        .plan-card .benefits {
            list-style: none;
            margin: 0 0 16px;
            padding: 0;
        }
        .plan-card .benefits li {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 3px 0;
        }
        .plan-card .benefits li i {
            color: var(--lime);
            width: 18px;
            text-align: center;
        }
        .plan-card .actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
        }
        .plan-card .actions .btn {
            width: 100%;
            justify-content: center;
        }

        /* ===== STATUS BADGE ===== */
        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            background: var(--lime);
            color: var(--navy);
        }
        .badge.pending {
            background: #ffc107;
            color: #856404;
        }
        .badge.active {
            background: var(--success);
            color: #fff;
        }
        .badge.expired {
            background: var(--danger);
            color: #fff;
        }
        .badge.rejected {
            background: var(--pink);
            color: #fff;
        }
        .badge.locked {
            background: var(--muted);
            color: #fff;
        }

        /* ===== SUBSCRIPTION STATUS BAR ===== */
        .sub-status {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            border-left: 4px solid var(--lime);
            margin-bottom: 20px;
        }
        .sub-status .info {
            flex: 1;
        }
        .sub-status .info h4 {
            font-size: 1rem;
            color: var(--navy);
        }
        .sub-status .info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .sub-status .info .expiry-warning {
            color: var(--danger);
            font-weight: 600;
            font-size: 0.8rem;
            margin-top: 4px;
        }
        .sub-status .info .expiry-warning i {
            margin-right: 4px;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            animation: slideInRight 0.3s ease;
            max-width: 400px;
        }
        .toast.error {
            background: var(--pink);
        }
        .toast.success {
            background: var(--success);
        }
        .toast.info {
            background: var(--navy);
        }
        .toast.warning {
            background: var(--warning);
            color: #1f2937;
        }
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: var(--radius);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 0;
            position: relative;
        }
        .modal-close-btn {
            position: sticky;
            top: 0;
            right: 0;
            float: right;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--navy);
            padding: 12px 20px;
            z-index: 10;
        }
        .modal-close-btn:hover {
            color: var(--pink);
        }

        /* ===== INVOICE STYLES ===== */
        .invoice-wrapper {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .invoice-header-bar {
            background: var(--navy);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .invoice-header-bar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .invoice-header-bar .brand .logo-mark {
            width: 38px;
            height: 38px;
            background: var(--lime);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--navy);
        }
        .invoice-header-bar .brand h2 {
            font-size: 1.2rem;
            font-weight: 800;
        }
        .invoice-header-bar .brand h2 span {
            color: var(--lime);
        }
        .invoice-header-bar .invoice-number {
            text-align: right;
        }
        .invoice-header-bar .invoice-number .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            opacity: 0.6;
            font-weight: 600;
        }
        .invoice-header-bar .invoice-number .number {
            font-size: 1.1rem;
            font-weight: 800;
        }
        .invoice-body {
            padding: 2.5rem 2.5rem 2rem;
            position: relative;
        }
        .unpaid-stamp {
            position: absolute;
            top: 2rem;
            right: 2.5rem;
            transform: rotate(18deg);
            border: 4px solid var(--danger);
            color: var(--danger);
            font-size: 1.8rem;
            font-weight: 900;
            padding: 0.4rem 1.2rem;
            border-radius: 8px;
            opacity: 0.55;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            pointer-events: none;
            background: rgba(220, 38, 38, 0.04);
            line-height: 1.2;
            text-align: center;
            z-index: 5;
        }
        .unpaid-stamp small {
            display: block;
            font-size: 0.65rem;
            font-weight: 600;
            opacity: 0.7;
        }
        .invoice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .invoice-grid .bill-to h4,
        .invoice-grid .invoice-meta h4 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .invoice-grid .bill-to .name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--navy);
        }
        .invoice-grid .bill-to .email {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .invoice-grid .invoice-meta .meta-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }
        .invoice-grid .invoice-meta .meta-row:last-child {
            border-bottom: none;
        }
        .invoice-grid .invoice-meta .meta-row .meta-label {
            color: var(--text-muted);
            font-weight: 500;
        }
        .invoice-grid .invoice-meta .meta-row .meta-value {
            font-weight: 700;
            color: var(--navy);
        }
        .invoice-grid .invoice-meta .meta-row .meta-value.danger {
            color: var(--danger);
        }
        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0 2rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .invoice-table thead {
            background: var(--navy);
            color: #fff;
        }
        .invoice-table thead th {
            padding: 0.9rem 1.2rem;
            text-align: left;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 700;
        }
        .invoice-table tbody td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .invoice-table tbody tr:last-child td {
            border-bottom: none;
        }
        .invoice-table tbody .item-desc {
            font-weight: 600;
            color: var(--navy);
        }
        .invoice-table tbody .item-amount {
            font-weight: 700;
            color: var(--navy);
        }
        .invoice-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            background: var(--bg);
            border-radius: var(--radius-sm);
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }
        .invoice-total-row .total-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .invoice-total-row .total-amount {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--pink);
        }
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin: 1.5rem 0 1.8rem;
        }
        .payment-method-card {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 1.2rem 1.2rem 1rem;
            border: 1px solid var(--border);
            text-align: center;
            transition: var(--transition);
        }
        .payment-method-card:hover {
            border-color: var(--navy);
            background: var(--card);
            box-shadow: var(--shadow-sm);
        }
        .payment-method-card .method-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            overflow: hidden;
            padding: 6px;
        }
        .payment-method-card .method-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .payment-method-card .method-name {
            font-weight: 700;

</head>

    </div>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ================================================================
    FIREBASE + FULL LOGIC
    ================================================================ -->
    <script>
        // ============================================================
        //  FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        //  STATE
        // ============================================================
        let currentUser = null;
        let providerDocId = null;
        let providerData = null;
        let subscriptionMap = {}; // key: planId, value: subscription doc data
        let unsubscribeSubscriptions = null;
        let unsubscribeProvider = null;

        // Plan definitions
        const PLANS = [
            { id: 'service_provider', name: 'Service Provider Package', price: 10, profilePage: 'manageprofile.html' },
            { id: 'venue', name: 'Venue Package', price: 50, profilePage: 'manageprofile.html' }
        ];

        // Helper: map plan name to plan ID
        function mapPlanNameToId(planName) {
            if (!planName) return null;
            const lower = planName.toLowerCase().trim();
            // Exact matches
            if (lower === 'service provider package' || lower === 'serviceproviderpackage' || lower === 'service_provider' ||
                lower === 'serviceprovider') return 'service_provider';
            if (lower === 'venue package' || lower === 'venuepackage' || lower === 'venue') return 'venue';
            // Fuzzy match
            if (lower.includes('service provider') || lower.includes('serviceprovider')) return 'service_provider';
            if (lower.includes('venue')) return 'venue';
            return null;
        }

        // ============================================================
        //  AUTH STATE
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('topbar-name').textContent = user.email || 'Provider';
                await loadProviderData(user);
                startSubscriptionListener();
                startProviderListener();
                renderDashboard();
                switchTab('dashboard');
            } else {
                window.location.href = 'index.html';
            }
        });

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = '0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
        window.showToast = showToast;

        // ============================================================
        //  LOAD PROVIDER DATA
        // ============================================================
        async function loadProviderData(user) {
            try {
                let docSnap = await db.collection('serviceProviders').doc(user.uid).get();
                if (docSnap.exists) {
                    providerDocId = docSnap.id;
                    providerData = docSnap.data();
                } else {
                    const defaultData = {
                        name: user.email.split('@')[0] || 'My Business',
                        email: user.email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await db.collection('serviceProviders').doc(user.uid).set(defaultData);
                    providerDocId = user.uid;
                    providerData = defaultData;
                }
                updateTopbarAvatar();
            } catch (error) {
                console.error('Error loading provider data:', error);
                showToast('Failed to load profile data', 'error');
            }
        }

        // ============================================================
        //  REAL-TIME PROVIDER LISTENER
        // ============================================================
        function startProviderListener() {
            if (!providerDocId) return;
            if (unsubscribeProvider) unsubscribeProvider();
            unsubscribeProvider = db.collection('serviceProviders').doc(providerDocId)
                .onSnapshot((doc) => {
                    if (doc.exists) {
                        providerData = doc.data();
                        updateTopbarAvatar();
                        const activeTab = document.querySelector('.tab-content:not(.hidden)')?.id;
                        if (activeTab === 'tab-dashboard') renderDashboard();
                        else if (activeTab === 'tab-subscription') renderSubscription();
                    }
                }, (error) => {
                    console.error('Provider listener error:', error);
                });
        }

        // ============================================================
        //  REAL-TIME SUBSCRIPTION LISTENER (with planId mapping fix + expiry)
        // ============================================================
        function startSubscriptionListener() {
            if (!currentUser) return;
            if (unsubscribeSubscriptions) unsubscribeSubscriptions();

            unsubscribeSubscriptions = db.collection('subscriptions')
                .where('userId', '==', currentUser.uid)
                .onSnapshot((snapshot) => {
                    subscriptionMap = {};
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        // --- FIXED: map planId from data.planId or derive from planName ---
                        let planId = data.planId;
                        if (!planId && data.planName) {
                            planId = mapPlanNameToId(data.planName);
                        }
                        // If still no planId, fallback to a slug
                        if (!planId && data.planName) {
                            planId = data.planName.toLowerCase().replace(/[^a-z0-9]/g, '_');
                        }
                        if (planId) {
                            // Keep the most recent subscription per plan (by createdAt)
                            const existing = subscriptionMap[planId];
                            const existingTs = existing?.createdAt?.toMillis?.() || 0;
                            const newTs = data.createdAt?.toMillis?.() || 0;
                            if (!existing || newTs > existingTs) {
                                subscriptionMap[planId] = { id: doc.id, ...data };
                            }
                        } else {
                            // Fallback: store by doc.id if we can't determine planId
                            console.warn('Could not determine planId for subscription:', data);
                        }
                    });

                    // Refresh views
                    const activeTab = document.querySelector('.tab-content:not(.hidden)')?.id;
                    if (activeTab === 'tab-dashboard') renderDashboard();
                    else if (activeTab === 'tab-subscription') renderSubscription();
                }, (error) => {
                    console.error('Subscription listener error:', error);
                });
        }

        // ============================================================
        //  UPDATE TOPBAR AVATAR
        // ============================================================
        function updateTopbarAvatar() {
            const container = document.getElementById('topbar-avatar');
            if (providerData && providerData.avatar && providerData.avatar.startsWith('data:image')) {
                container.innerHTML = `<img src="${providerData.avatar}" alt="Avatar" />`;
            } else {
                const initials = (providerData && providerData.name) ? providerData.name.split(' ').map(w => w.charAt(0)).join('')
                    .substring(0, 2).toUpperCase() : 'P';
                container.innerHTML = `<span>${initials}</span>`;
            }
            if (providerData && providerData.name) {
                document.getElementById('topbar-name').textContent = providerData.name;
            }
        }

        // ============================================================
        //  CHECK SUBSCRIPTION EXPIRY
        // ============================================================
        function getSubscriptionStatusWithExpiry(planId) {
            const sub = subscriptionMap[planId];
            if (!sub) return { status: 'none', sub: null, expired: false, daysRemaining: 0 };

            // If status is not active/approved, return as-is
            if (sub.status !== 'active' && sub.status !== 'approved') {
                return { status: sub.status || 'pending', sub, expired: false, daysRemaining: 0 };
            }

            // Calculate expiry: use approvedAt if available, otherwise createdAt
            let startDate = null;
            if (sub.approvedAt) {
                startDate = sub.approvedAt.toDate ? sub.approvedAt.toDate() : new Date(sub.approvedAt);
            } else if (sub.createdAt) {
                startDate = sub.createdAt.toDate ? sub.createdAt.toDate() : new Date(sub.createdAt);
            }
            if (!startDate) {
                return { status: sub.status, sub, expired: false, daysRemaining: 0 };
            }

            const months = sub.months || 1;
            const expiryDate = new Date(startDate);
            expiryDate.setMonth(expiryDate.getMonth() + months);

            const now = new Date();
            const diffMs = expiryDate.getTime() - now.getTime();
            const daysRemaining = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

            if (daysRemaining <= 0) {
                return { status: 'expired', sub, expired: true, daysRemaining: 0 };
            }
            return { status: sub.status, sub, expired: false, daysRemaining };
        }

        function getOverallStatus() {
            let best = { status: 'none', sub: null, expired: false, daysRemaining: 0, planId: null };
            for (const plan of PLANS) {
                const result = getSubscriptionStatusWithExpiry(plan.id);
                // Prioritize active > pending > expired > none
                const priority = { 'active': 4, 'approved': 4, 'pending': 3, 'pending_payment': 3, 'expired': 2, 'rejected': 1,
                    'none': 0 };
                const currentPriority = priority[result.status] || 0;
                const bestPriority = priority[best.status] || 0;
                if (currentPriority > bestPriority || (currentPriority === bestPriority && result.daysRemaining > best
                        .daysRemaining)) {
                    best = { ...result, planId: plan.id };
                }
            }
            return best;
        }

        // ============================================================
        //  RENDER DASHBOARD (Plan Cards with Expiry & Locking)
        // ============================================================
        function renderDashboard() {
            const container = document.getElementById('dashboard-content');
            const overall = getOverallStatus();

            // Build status bar
            let statusHtml = '';
            let expiryWarning = '';
            if (overall.status === 'active' || overall.status === 'approved') {
                if (overall.expired) {
                    statusHtml = `<span class="badge expired">EXPIRED</span>`;
                    expiryWarning =
                        `<div class="expiry-warning"><i class="fas fa-exclamation-triangle"></i> Your subscription has expired. Please renew to continue.</div>`;
                } else if (overall.daysRemaining > 0 && overall.daysRemaining <= 7) {
                    statusHtml = `<span class="badge active">Active (${overall.daysRemaining} days left)</span>`;
                    expiryWarning =
                        `<div class="expiry-warning"><i class="fas fa-clock"></i> Your subscription expires in ${overall.daysRemaining} days. Renew soon!</div>`;
                } else {
                    const plan = PLANS.find(p => p.id === overall.planId);
                    statusHtml =
                    `<span class="badge active">Active (${plan ? plan.name : ''})</span>`;
                }
            } else if (overall.status === 'pending' || overall.status === 'pending_payment') {
                statusHtml = `<span class="badge pending">Pending Approval</span>`;
            } else if (overall.status === 'rejected') {
                statusHtml = `<span class="badge rejected">Rejected</span>`;
            } else if (overall.status === 'expired') {
                statusHtml = `<span class="badge expired">EXPIRED</span>`;
                expiryWarning =
                    `<div class="expiry-warning"><i class="fas fa-exclamation-triangle"></i> Your subscription has expired. Please subscribe again.</div>`;
            } else {
                statusHtml = `<span class="badge">No active subscription</span>`;
            }

            // Build plan cards
            let plansHtml = '';
            for (const plan of PLANS) {
                const result = getSubscriptionStatusWithExpiry(plan.id);
                const status = result.status;
                const sub = result.sub;
                const expired = result.expired;
                const daysLeft = result.daysRemaining;

                let actionHtml = '';
                let lockHtml = '';
                let isLocked = false;

                // Determine if this plan is locked (expired or rejected or none)
                if (status === 'expired') {
                    isLocked = true;
                    lockHtml = `
                        <div class="lock-banner">
                            <i class="fas fa-lock"></i> Subscription expired on ${sub?.approvedAt ? new Date(sub.approvedAt.toDate ? sub.approvedAt.toDate() : sub.approvedAt).toLocaleDateString() : ''}
                        </div>
                    `;
                    actionHtml =
                        `<button class="btn btn-warning" onclick="selectPlan('${plan.id}','${plan.name}',${plan.price})"><i class="fas fa-redo"></i> Subscribe Again</button>`;
                } else if (status === 'none') {
                    actionHtml =
                        `<button class="btn btn-lime" onclick="selectPlan('${plan.id}','${plan.name}',${plan.price})">Select Plan</button>`;
                } else if (status === 'pending' || status === 'pending_payment') {
                    actionHtml = `
                        <button class="btn btn-outline" disabled><i class="fa-solid fa-clock"></i> Pending Payment</button>
                        <button class="btn btn-outline" onclick="viewInvoice('${plan.id}')"><i class="fa-solid fa-file-invoice"></i> View Invoice</button>
                    `;
                } else if (status === 'active' || status === 'approved') {
                    if (expired) {
                        isLocked = true;
                        lockHtml = `
                            <div class="lock-banner">
                                <i class="fas fa-lock"></i> Subscription expired — please renew
                            </div>
                        `;
                        actionHtml =
                            `<button class="btn btn-warning" onclick="selectPlan('${plan.id}','${plan.name}',${plan.price})"><i class="fas fa-redo"></i> Renew Subscription</button>`;
                    } else {
                        // Active - show Manage Profile
                        actionHtml = `
                            <button class="btn btn-success" onclick="window.location.href='manageprofile.html'"><i class="fa-solid fa-user-cog"></i> Manage Profile</button>
                            ${daysLeft > 0 && daysLeft <= 7 ? `<button class="btn btn-outline" onclick="selectPlan('${plan.id}','${plan.name}',${plan.price})"><i class="fas fa-sync-alt"></i> Renew (${daysLeft} days left)</button>` : ''}
                        `;
                    }
                } else if (status === 'rejected') {
                    isLocked = true;
                    lockHtml = `
                        <div class="lock-banner">
                            <i class="fas fa-times-circle"></i> Payment was rejected
                        </div>
                    `;
                    actionHtml = `
                        <button class="btn btn-outline" disabled><i class="fa-solid fa-xmark"></i> Payment Rejected</button>
                        <button class="btn btn-lime" onclick="selectPlan('${plan.id}','${plan.name}',${plan.price})">Try Again</button>
                    `;
                }

                const benefits = plan.id === 'service_provider' ?
                    ['Get priority visibility to event organizers', 'Receive instant notifications via WhatsApp, email, and calls',
                        'Showcase your work with an image gallery', 'Manage all your social media handles in one place',
                        'Build your brand with a professional profile'
                    ] :
                    ['Get priority visibility to event organizers', 'Receive instant notifications via WhatsApp, email, and calls',
                        'Showcase your work with an image gallery', 'Manage all your social media handles in one place',
                        'Build your brand with a professional profile', 'Premium listing with venue spotlight'
                    ];

                const lockedClass = isLocked ? 'locked' : '';

                plansHtml += `
                    <div class="plan-card ${lockedClass}">
                        ${lockHtml}
                        <h4>${plan.name}</h4>
                        <div class="price">$${plan.price} <small>/month</small></div>
                        <ul class="benefits">
                            ${benefits.map(b => `<li><i class="fas fa-check"></i> ${b}</li>`).join('')}
                        </ul>
                        <div class="actions">
                            ${actionHtml}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="sub-status" style="border-left-color: ${overall.status === 'expired' ? 'var(--danger)' : overall.status === 'active' || overall.status === 'approved' ? 'var(--success)' : 'var(--lime)'};">
                    <div class="info">
                        <h4>Your Subscription</h4>
                        <p>${overall.status === 'none' ? 'You are not subscribed to any plan.' : overall.status === 'expired' ? 'Your subscription has expired.' : 'Current status: ' + overall.status}</p>
                        ${expiryWarning}
                    </div>
                    ${statusHtml}
                </div>
                <div class="plans-grid">
                    ${plansHtml}
                </div>
            `;
        }

        // ============================================================
        //  RENDER SUBSCRIPTION TAB (with expiry info)
        // ============================================================
        function renderSubscription() {
            const container = document.getElementById('subscription-content');
            const entries = Object.entries(subscriptionMap);
            if (entries.length === 0) {
                container.innerHTML = `
                    <div style="padding:20px; text-align:center; color:var(--muted);">
                        <i class="fas fa-credit-card" style="font-size:2rem;"></i>
                        <p style="margin-top:10px;">No subscriptions found.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const [planId, sub] of entries) {
                const plan = PLANS.find(p => p.id === planId);
                const planName = plan ? plan.name : (sub.planName || planId);
                const status = sub.status || 'pending';
                const months = sub.months || 1;
                const total = sub.total || 0;
                const createdAt = sub.createdAt ? (sub.createdAt.toDate ? sub.createdAt.toDate() : new Date(sub.createdAt)) :
                    null;
                const approvedAt = sub.approvedAt ? (sub.approvedAt.toDate ? sub.approvedAt.toDate() : new Date(sub
                    .approvedAt)) : null;

                // Calculate expiry
                let expiryDate = null;
                let daysRemaining = null;
                let isExpired = false;
                const startDate = approvedAt || createdAt;
                if (startDate && (status === 'active' || status === 'approved')) {
                    expiryDate = new Date(startDate);
                    expiryDate.setMonth(expiryDate.getMonth() + months);
                    const now = new Date();
                    const diffMs = expiryDate.getTime() - now.getTime();
                    daysRemaining = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
                    isExpired = daysRemaining <= 0;
                }

                let statusBadge = '';
                if (isExpired && (status === 'active' || status === 'approved')) {
                    statusBadge = 'badge expired';
                } else if (status === 'pending' || status === 'pending_payment') {
                    statusBadge = 'badge pending';
                } else if (status === 'active' || status === 'approved') {
                    statusBadge = 'badge active';
                } else if (status === 'rejected') {
                    statusBadge = 'badge rejected';
                } else {
                    statusBadge = 'badge';
                }

                const statusLabel = isExpired && (status === 'active' || status === 'approved') ? 'EXPIRED' : status
                    .toUpperCase();

                html += `
                    <div style="border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px; margin-bottom:16px; ${isExpired ? 'border-left:4px solid var(--danger);' : 'border-left:4px solid var(--lime);'}">
                        <h4>${planName}</h4>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px;">
                            <div><span style="color:var(--muted);">Status</span> <span class="${statusBadge}">${statusLabel}</span></div>
                            <div><span style="color:var(--muted);">Months</span> ${months}</div>
                            <div><span style="color:var(--muted);">Total Paid</span> $${total}</div>
                            ${createdAt ? `<div><span style="color:var(--muted);">Created</span> ${createdAt.toLocaleDateString()}</div>` : ''}
                            ${approvedAt ? `<div><span style="color:var(--muted);">Approved</span> ${approvedAt.toLocaleDateString()}</div>` : ''}
                            ${expiryDate ? `<div><span style="color:var(--muted);">Expires</span> ${expiryDate.toLocaleDateString()} ${isExpired ? '⚠️' : ''}</div>` : ''}
                            ${daysRemaining !== null && !isExpired ? `<div><span style="color:var(--muted);">Days Left</span> ${daysRemaining}</div>` : ''}
                        </div>
                        <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
                            ${(status === 'pending' || status === 'pending_payment') ? `<button class="btn btn-outline btn-sm" onclick="viewInvoice('${planId}')"><i class="fas fa-file-invoice"></i> View Invoice</button>` : ''}
                            ${(isExpired && (status === 'active' || status === 'approved')) ? `<button class="btn btn-warning btn-sm" onclick="selectPlan('${planId}','${planName}',${plan.price || 0})"><i class="fas fa-redo"></i> Renew</button>` : ''}
                            ${(status === 'active' || status === 'approved') && !isExpired ? `<button class="btn btn-success btn-sm" onclick="window.location.href='manageprofile.html'"><i class="fas fa-user-cog"></i> Manage Profile</button>` : ''}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // ============================================================
        //  PLAN SELECTION (redirect to checkout)
        // ============================================================
        function selectPlan(planId, planName, price) {
            localStorage.setItem('zone21_provider_plan_id', planId);
            localStorage.setItem('zone21_provider_plan_name', planName);
            localStorage.setItem('zone21_provider_plan_price', price);
            window.location.href = 'provider-checkout.html';
        }
        window.selectPlan = selectPlan;

        // ============================================================
        //  VIEW INVOICE (per plan)
        // ============================================================
        async function viewInvoice(planId) {
            const sub = subscriptionMap[planId];
            if (!sub) {
                showToast('No subscription found for this plan.', 'error');
                return;
            }
            const invoiceNumber = sub.invoiceNumber;
            if (!invoiceNumber) {
                showToast('No invoice associated with this subscription.', 'error');
                return;
            }

            try {
                const invDoc = await db.collection('invoices').doc(invoiceNumber).get();
                if (!invDoc.exists) {
                    showToast('Invoice not found.', 'error');
                    return;
                }
                const invData = invDoc.data();

                const container = document.getElementById('invoice-container');
                const dateStr = invData.createdAt ? (invData.createdAt.toDate ? invData.createdAt.toDate().toLocaleDateString(
                    'en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : new Date(invData.createdAt)
                    .toLocaleDateString()) : 'N/A';
                const customer = invData.customerInfo || {};
                const fName = customer.firstName || '';
                const lName = customer.lastName || '';
                const fullName = (fName + ' ' + lName).trim() || 'N/A';
                const email = customer.email || 'N/A';
                const phone = customer.phone || 'N/A';
                const company = customer.company || '';
                const plan = invData.planName || 'Subscription';
                const total = invData.total || 0;
                const months = invData.months || 1;
                const status = invData.status || 'pending';

                const invoiceHtml = `
                    <div class="invoice-wrapper">
                        <div class="invoice-header-bar">
                            <div class="brand">
                                <div class="logo-mark">Z</div>
                                <h2>Zone<span>21</span></h2>
                            </div>
                            <div class="invoice-number">
                                <div class="label">Invoice Number</div>
                                <div class="number">${invoiceNumber}</div>
                            </div>
                        </div>
                        <div class="invoice-body">
                            <div class="unpaid-stamp" style="border-color:${status === 'active' || status === 'approved' ? 'var(--success)' : 'var(--danger)'};">
                                ${status === 'active' || status === 'approved' ? 'APPROVED' : status === 'pending' ? 'UNPAID' : status.toUpperCase()}
                                <small>${status === 'active' || status === 'approved' ? 'payment confirmed' : 'payment pending'}</small>
                            </div>
                            <div class="invoice-grid">
                                <div class="bill-to">
                                    <h4>Bill To</h4>
                                    <div class="name">${fullName}</div>
                                    <div class="email">${email}</div>
                                    ${company ? `<div style="font-size:0.8rem; color:var(--text-muted);">${company}</div>` : ''}
                                    ${phone !== 'N/A' ? `<div style="font-size:0.8rem; color:var(--text-muted);">${phone}</div>` : ''}
                                </div>
                                <div class="invoice-meta">
                                    <h4>Invoice Details</h4>
                                    <div class="meta-row">
                                        <span class="meta-label">Date</span>
                                        <span class="meta-value">${dateStr}</span>
                                    </div>
                                    <div class="meta-row">
                                        <span class="meta-label">Status</span>
                                        <span class="meta-value ${status === 'active' || status === 'approved' ? '' : 'danger'}">${status.toUpperCase()}</span>
                                    </div>
                                    <div class="meta-row">
                                        <span class="meta-label">Payment Method</span>
                                        <span class="meta-value">Manual Transfer</span>
                                    </div>
                                </div>
                            </div>
                            <table class="invoice-table">
                                <thead>
                                    <tr>
                                        <th>Description</th>
                                        <th style="text-align:right;">Amount</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="item-desc">${plan} (${months} month${months > 1 ? 's' : ''})</td>
                                        <td class="item-amount" style="text-align:right;">$${total.toFixed(2)}</td>
                                    </tr>
                                </tbody>
                            </table>
                            <div class="invoice-total-row">
                                <span class="total-label">Total Payable</span>
                                <span class="total-amount">$${total.toFixed(2)}</span>
                            </div>
                            ${status === 'pending' || status === 'pending_payment' ? `
                            <div class="payment-instructions">
                                <strong>📌 Manual Payment Required</strong><br>
                                Please transfer the exact total amount to one of the accounts below.<br>
                                Kindly use your <strong>Invoice Number</strong> as the payment reference.
                            </div>
                            <div class="payment-methods">
                                <div class="payment-method-card">
                                    <div class="method-icon">
                                        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgwnfhozjpovvXfL0xyqpu46qT3PjiQqNnUI97upb7S5JgCPPviUCxlPmJX27y7p9qa1qGWXB8qGKKG6SUrWnW9dNQrFLrNkbCH7OPynH0v-hErLb3LwkDDNrljlrAK1RBs1QniSaJkQJNPcg1D0xeCCxKN28WEbV3egQWEb43iSD-PeRYC5uI1loZcEhYY/s1600/722de7bfbab2b24020b8fb404bc9fe58_icon.png" alt="Ecocash">
                                    </div>
                                    <div class="method-name">Ecocash</div>
                                    <div class="method-detail">078 991 2268</div>
                                    <div class="method-account">Tanatswa Dean Mwanza</div>
                                </div>
                                <div class="payment-method-card">
                                    <div class="method-icon">
                                        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiol9STr7ImEkAH6KsKj4n5XsA6edceL24btsYwwo426RfFGa7uuqVMJrBY2U6FCFFPYX5Daf50iTun5jmqp9bx-sN1Ukmy0N2e7TSjPtT7TvRLfmS1FBjkeADvjzI2WpEpr0pB179sZBxNvZoH06DUdJzIkwa7JMzt_T1UH1ELIDMQKX8T3lhRaVrVR4K6/s1600/APP_ICON.png" alt="Innbucks">
                                    </div>
                                    <div class="method-name">Innbucks</div>
                                    <div class="method-detail">078 991 2268</div>
                                    <div class="method-account">Tanatswa Dean Mwanza</div>
                                </div>
                                <div class="payment-method-card">
                                    <div class="method-icon">
                                        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjcQFUEJrA33gQlP3kceYEdQCuJ1gXImN7b031MmiGlTdgqdD6An640fWWVV0R7jBsL2If96hrnDv9PypAbNBK_yQDH8z8Quefrt1Xc2xi6sShTFmHRgrO_sdGbvckOeMVoJZFIjA6DV_AJm9qLzliGiyU0DZXYT0SvPCvDR1_8J1aP4mEKObQk-3KfWJaV/s1600/kiev-ukraine-september-visa-mastercard-logos-printed-white-paper-visa-mastercard-american-multinational-102631953.jpg" alt="TN CyberTech Bank">
                                    </div>
                                    <div class="method-name">TN CyberTech Bank</div>
                                    <div class="method-detail">4638 3300 1429 9948</div>
                                    <div class="method-account">Corporate Account</div>
                                </div>
                            </div>
                            <div class="invoice-actions">
                                <button class="btn btn-outline" onclick="window.print()"><i class="fas fa-print"></i> Print Invoice</button>
                                <a href="support.html" target="_blank" class="btn btn-pink"><i class="fas fa-upload"></i> Submit Proof of Payment</a>
                            </div>
                            ` : `
                            <div style="padding:12px; background:#e8f5e9; border-radius:var(--radius-sm); border:1px solid var(--success);">
                                <p style="color:var(--success);"><i class="fas fa-check-circle"></i> This invoice has been approved.</p>
                            </div>
                            <div class="invoice-actions">
                                <button class="btn btn-outline" onclick="window.print()"><i class="fas fa-print"></i> Print Invoice</button>
                            </div>
                            `}
                            <div class="invoice-footer-note">
                                <i class="fas fa-shield-alt"></i> After payment, please submit your proof to activate your provider account.
                            </div>
                        </div>
                    </div>
                `;

                container.innerHTML = invoiceHtml;
                document.getElementById('invoiceModal').classList.add('active');

            } catch (error) {
                console.error('Error fetching invoice:', error);
                showToast('Failed to load invoice.', 'error');
            }
        }
        window.viewInvoice = viewInvoice;

        // ============================================================
        //  CLOSE INVOICE MODAL
        // ============================================================
        function closeInvoiceModal() {
            document.getElementById('invoiceModal').classList.remove('active');
        }
        window.closeInvoiceModal = closeInvoiceModal;

        // ============================================================
        //  TAB SWITCHING
        // ============================================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById('tab-' + tab);
            if (target) target.classList.remove('hidden');

            document.querySelectorAll('.sidebar .nav-links a[data-tab]').forEach(link => link.classList.remove('active'));
            const activeLink = document.querySelector(`.sidebar .nav-links a[data-tab="${tab}"]`);
            if (activeLink) activeLink.classList.add('active');

            if (tab === 'dashboard') renderDashboard();
            else if (tab === 'subscription') renderSubscription();

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }
        window.switchTab = switchTab;

        // ============================================================
        //  EVENT LISTENERS
        // ============================================================
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });

        document.querySelectorAll('.sidebar .nav-links a[data-tab]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                switchTab(link.dataset.tab);
            });
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = 'index.html');
        });
        document.getElementById('logout-link').addEventListener('click', (e) => {
            e.preventDefault();
            auth.signOut().then(() => window.location.href = 'index.html');
        });

        // ============================================================
        //  SETTINGS FUNCTIONS
        // ============================================================
        async function changeEmail() {
            const newEmail = document.getElementById('new-email').value.trim();
            if (!newEmail) { showToast('Enter a new email address.', 'error'); return; }
            try {
                await currentUser.updateEmail(newEmail);
                await db.collection('serviceProviders').doc(providerDocId).update({ email: newEmail });
                showToast('Email updated. Please re-login.', 'success');
                await auth.signOut();
            } catch (error) {
                showToast('Failed to update email: ' + error.message, 'error');
            }
        }
        window.changeEmail = changeEmail;

        async function changePassword() {
            const newPassword = document.getElementById('new-password').value;
            if (!newPassword || newPassword.length < 6) { showToast('Password must be at least 6 characters.', 'error');
                return; }
            try {
                await currentUser.updatePassword(newPassword);
                showToast('Password updated successfully.', 'success');
                document.getElementById('new-password').value = '';
            } catch (error) {
                showToast('Failed to update password: ' + error.message, 'error');
            }
        }
        window.changePassword = changePassword;

        console.log('✅ Provider Hub loaded with expiry/locking logic.');
        console.log('ℹ️  My Profile redirects to manageprofile.html');
    </script>
</body>
</html>
