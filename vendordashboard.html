<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provider Hub | Zone21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --navy: #0a1f2e;
            --navy-light: #1a3a4a;
            --lime: #C0C800;
            --lime-glow: rgba(192, 200, 0, 0.25);
            --pink: #F80070;
            --pink-glow: rgba(248, 0, 112, 0.15);
            --bg: #f0f2f6;
            --card: #ffffff;
            --text: #0f1a24;
            --text-secondary: #3d4f5e;
            --muted: #7a8a9a;
            --border: #e6eaf0;
            --radius: 18px;
            --radius-sm: 10px;
            --shadow-sm: 0 2px 8px rgba(10, 31, 46, 0.04);
            --shadow: 0 8px 32px rgba(10, 31, 46, 0.07);
            --shadow-hover: 0 16px 48px rgba(10, 31, 46, 0.12);
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --sidebar-width: 260px;
            --topbar-height: 64px;
            --danger: #DC2626;
            --success: #10B981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--lime); border-radius: 10px; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--navy);
            color: #fff;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 40px rgba(10, 31, 46, 0.2);
            overflow-y: auto;
        }

        .sidebar .logo {
            padding: 22px 24px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--lime);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.02em;
        }
        .sidebar .logo i { font-size: 1.6rem; color: var(--lime); }
        .sidebar .logo span { color: #fff; font-weight: 400; }

        .sidebar .nav-links { flex: 1; padding: 20px 12px; }
        .sidebar .nav-links a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 2px;
        }
        .sidebar .nav-links a:hover { background: rgba(192, 200, 0, 0.08); color: #fff; }
        .sidebar .nav-links a.active {
            background: rgba(192, 200, 0, 0.12);
            color: var(--lime);
            box-shadow: inset 0 0 0 1px rgba(192, 200, 0, 0.15);
        }
        .sidebar .nav-links a i { width: 20px; text-align: center; }
        .sidebar .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
        }

        /* ===== MAIN WRAPPER ===== */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            height: var(--topbar-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(230, 234, 240, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 900;
        }
        .topbar .menu-toggle {
            display: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--navy);
            background: none;
            border: none;
        }
        .topbar .profile-dropdown {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 4px 12px 4px 4px;
            border-radius: 40px;
            background: var(--bg);
            border: 1px solid var(--border);
        }
        .topbar .profile-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--lime);
            overflow: hidden;
            border: 2px solid var(--lime);
        }
        .topbar .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .topbar .profile-name { font-weight: 600; font-size: 0.85rem; color: var(--text); }
        .topbar .logout-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; }
        .topbar .logout-btn:hover { color: var(--pink); }

        /* ===== CONTENT ===== */
        .content { flex: 1; padding: 28px 32px 40px; }

        /* ===== CARDS ===== */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .card .card-accent {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--lime), var(--pink));
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg);
        }
        .card-header h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header h3 i { color: var(--lime); }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            font-size: 0.8rem;
            background: var(--bg);
            color: var(--text);
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: var(--navy); color: #fff; }
        .btn-lime { background: var(--lime); color: var(--navy); }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-secondary); }
        .btn-outline:hover { border-color: var(--navy); color: var(--navy); }
        .btn-sm { padding: 5px 14px; font-size: 0.7rem; }

        /* ===== SUBSCRIPTION STATUS BOX ===== */
        .sub-status {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            border-left: 4px solid var(--lime);
            margin-bottom: 20px;
        }
        .sub-status .info { flex: 1; }
        .sub-status .info h4 { font-size: 1rem; color: var(--navy); }
        .sub-status .info p { font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px; }
        .sub-status .badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
        .badge.active { background: var(--success); color: #fff; }
        .badge.pending { background: #ffc107; color: #856404; }
        .badge.expired, .badge.rejected { background: var(--pink); color: #fff; }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: var(--radius);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }
        .modal-close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            font-size: 1.8rem; cursor: pointer;
            color: var(--navy);
        }

        .hidden { display: none !important; }

        /* ===== TOAST ===== */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; color: #fff; animation: slideIn 0.3s ease; }
        .toast.error { background: var(--pink); }
        .toast.success { background: var(--success); }
        .toast.info { background: var(--navy); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-wrapper { margin-left: 0; width: 100%; }
            .topbar { padding: 0 16px; }
            .topbar .menu-toggle { display: block; }
            .content { padding: 16px; }
        }
    </style>
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <i class="fas fa-crown"></i> Zone<span>21</span>
        </div>
        <div class="nav-links">
            <a href="#" class="active" data-tab="dashboard"><i class="fas fa-home"></i> Dashboard</a>
            <a href="#" data-tab="profile"><i class="fas fa-user"></i> My Profile</a>
            <a href="#" data-tab="subscription"><i class="fas fa-credit-card"></i> Subscription</a>
            <a href="#" data-tab="settings"><i class="fas fa-cog"></i> Settings</a>
            <a href="index.html" id="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
        <div class="sidebar-footer">
            <p>Provider Hub v3.1</p>
        </div>
    </div>

    <!-- ===== MAIN WRAPPER ===== -->
    <div class="main-wrapper">
        <div class="topbar">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <div style="flex:1;"></div>
            <div class="profile-dropdown">
                <div class="profile-avatar" id="topbar-avatar"><span>P</span></div>
                <span class="profile-name" id="topbar-name">Loading...</span>
                <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div class="content">
            <!-- DASHBOARD TAB -->
            <div id="tab-dashboard" class="tab-content">
                <div class="card">
                    <div class="card-accent"></div>
                    <div class="card-header">
                        <h3><i class="fas fa-home"></i> Dashboard Overview</h3>
                    </div>
                    <div id="dashboard-content">
                        <div style="text-align:center; padding:20px;">
                            <i class="fas fa-spinner fa-spin" style="color:var(--lime);"></i>
                            <p style="margin-top:10px; color:var(--muted);">Syncing account details...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PROFILE TAB -->
            <div id="tab-profile" class="tab-content hidden">
                <div class="card">
                    <div class="card-accent"></div>
                    <div class="card-header">
                        <h3><i class="fas fa-user"></i> Profile Status</h3>
                        <a id="editProfileLink" href="#" class="btn btn-outline btn-sm hidden">Manage External Profile</a>
                    </div>
                    <div id="profile-content"></div>
                </div>
            </div>

            <!-- SUBSCRIPTION TAB -->
            <div id="tab-subscription" class="tab-content hidden">
                <div class="card">
                    <div class="card-accent"></div>
                    <div class="card-header">
                        <h3><i class="fas fa-credit-card"></i> Billing & Subscriptions</h3>
                    </div>
                    <div id="subscription-content"></div>
                </div>
            </div>

            <!-- SETTINGS TAB -->
            <div id="tab-settings" class="tab-content hidden">
                <div class="card">
                    <div class="card-accent"></div>
                    <div class="card-header"><h3><i class="fas fa-cog"></i> Account Settings</h3></div>
                    <div style="display:flex; flex-direction:column; gap:14px; max-width:400px;">
                        <div>
                            <label style="font-size:0.8rem; font-weight:600;">New Email</label>
                            <input type="email" id="new-email" placeholder="name@example.com" style="width:100%; padding:8px; margin-top:4px; border:1px solid var(--border); border-radius:6px;" />
                            <button class="btn btn-outline btn-sm" style="margin-top:6px;" onclick="changeEmail()">Update Email</button>
                        </div>
                        <div>
                            <label style="font-size:0.8rem; font-weight:600;">New Password</label>
                            <input type="password" id="new-password" placeholder="••••••••" style="width:100%; padding:8px; margin-top:4px; border:1px solid var(--border); border-radius:6px;" />
                            <button class="btn btn-outline btn-sm" style="margin-top:6px;" onclick="changePassword()">Update Password</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- INVOICE MODAL -->
    <div class="modal-overlay" id="invoiceModal">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="document.getElementById('invoiceModal').classList.remove('active')">&times;</button>
            <div id="invoice-container"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let providerDocId = null;
        let providerData = null;
        let subscriptionData = null;
        let subListener = null;

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('topbar-name').textContent = user.email;
                await loadProviderData(user);
                startSubListener();
                switchTab('dashboard');
            } else {
                window.location.href = 'index.html';
            }
        });

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function loadProviderData(user) {
            const snap = await db.collection('serviceProviders').doc(user.uid).get();
            if (snap.exists) {
                providerDocId = snap.id;
                providerData = snap.data();
            } else {
                providerDocId = user.uid;
                providerData = { name: user.email.split('@')[0], email: user.email, subscriptionStatus: 'none' };
            }
            updateAvatar();
        }

        function updateAvatar() {
            const container = document.getElementById('topbar-avatar');
            if (providerData?.avatar) {
                container.innerHTML = `<img src="${providerData.avatar}" />`;
            } else {
                container.innerHTML = `<span>${(providerData?.name || 'P').substring(0,2).toUpperCase()}</span>`;
            }
        }

        function startSubListener() {
            if (!providerDocId) return;
            if (subListener) subListener();

            subListener = db.collection('subscriptions').where('providerId', '==', providerDocId).onSnapshot((snapshot) => {
                let latest = null;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (!latest || (data.createdAt?.toMillis?.() > (latest.createdAt?.toMillis?.() || 0))) {
                        latest = { id: doc.id, ...data };
                    }
                });
                subscriptionData = latest;
                refreshActiveTab();
            });
        }

        function getStatus() {
            if (subscriptionData) {
                if (subscriptionData.status === 'active' || subscriptionData.status === 'approved') return 'active';
                if (subscriptionData.status === 'pending' || subscriptionData.status === 'pending_payment') return 'pending';
                if (subscriptionData.status === 'rejected') return 'rejected';
            }
            return providerData?.subscriptionStatus || 'none';
        }

        function refreshActiveTab() {
            const currentTab = document.querySelector('.tab-content:not(.hidden)')?.id.replace('tab-', '');
            if (currentTab) switchTab(currentTab);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.querySelectorAll('.sidebar .nav-links a').forEach(l => l.classList.remove('active'));
            document.querySelector(`.sidebar .nav-links a[data-tab="${tab}"]`)?.classList.add('active');

            if (tab === 'dashboard') renderDashboard();
            else if (tab === 'profile') renderProfile();
            else if (tab === 'subscription') renderSubscription();

            if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function renderDashboard() {
            const container = document.getElementById('dashboard-content');
            const status = getStatus();
            const plan = providerData?.subscriptionPlan || subscriptionData?.planName || 'None';

            let badgeClass = 'badge pending';
            let badgeText = 'Pending Approval';
            if (status === 'active') { badgeClass = 'badge active'; badgeText = 'Active & Verified'; }
            else if (status === 'rejected') { badgeClass = 'badge rejected'; badgeText = 'Payment Rejected'; }
            else if (status === 'none') { badgeClass = 'badge expired'; badgeText = 'No Subscription'; }

            container.innerHTML = `
                <div class="sub-status">
                    <div class="info">
                        <h4>Subscription Status</h4>
                        <p>Current Plan: <strong>${plan}</strong></p>
                    </div>
                    <span class="${badgeClass}">${badgeText}</span>
                </div>
                ${status === 'pending' ? `
                    <div style="background:#fff3cd; padding:14px; border-radius:var(--radius-sm); border:1px solid #ffc107;">
                        <p style="font-size:0.85rem;"><i class="fas fa-clock" style="color:#856404;"></i> Payment pending approval. Once verified by admin, your profile unlocks automatically.</p>
                        <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="viewInvoice()"><i class="fas fa-file-invoice"></i> View Invoice Details</button>
                    </div>
                ` : status === 'active' ? `
                    <p style="color:var(--text-secondary); font-size:0.9rem;">Your provider status is active. You can manage your dedicated profile pages directly.</p>
                ` : `
                    <div style="text-align:center; padding:20px;">
                        <p style="margin-bottom:12px;">Choose a pricing plan to get your services listed on Zone21.</p>
                        <a href="provider-checkout.html" class="btn btn-lime"><i class="fas fa-rocket"></i> Subscribe Now</a>
                    </div>
                `}
            `;
        }

        function renderProfile() {
            const container = document.getElementById('profile-content');
            const status = getStatus();
            const editBtn = document.getElementById('editProfileLink');

            if (status !== 'active') {
                editBtn.classList.add('hidden');
                container.innerHTML = `<p style="color:var(--muted);">Profile editing is unlocked automatically once your subscription is approved.</p>`;
                return;
            }

            const profileUrl = providerData?.subscriptionPlan === 'Venue' ? 'venueprofile.html' : 'vendorprofile.html';
            editBtn.href = profileUrl;
            editBtn.classList.remove('hidden');

            container.innerHTML = `
                <div style="display:flex; align-items:center; gap:16px;">
                    <div style="font-size:2rem; font-weight:800; color:var(--navy);">${providerData?.name || ''}</div>
                </div>
                <p style="margin-top:10px; color:var(--text-secondary);">Your profile is online and visible to users.</p>
            `;
        }

        function renderSubscription() {
            const container = document.getElementById('subscription-content');
            if (!subscriptionData) {
                container.innerHTML = `<p>No active subscription history found.</p>`;
                return;
            }
            container.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <p><strong>Plan:</strong> ${subscriptionData.planName}</p>
                    <p><strong>Status:</strong> ${subscriptionData.status}</p>
                    <p><strong>Total Amount:</strong> $${subscriptionData.total}</p>
                    <button class="btn btn-primary btn-sm" onclick="viewInvoice()"><i class="fas fa-file-invoice"></i> View Invoice</button>
                </div>
            `;
        }

        async function viewInvoice() {
            if (!subscriptionData?.invoiceNumber) {
                showToast('No invoice generated yet.', 'error');
                return;
            }
            const snap = await db.collection('invoices').doc(subscriptionData.invoiceNumber).get();
            if (!snap.exists) { showToast('Invoice record missing.', 'error'); return; }
            const inv = snap.data();

            document.getElementById('invoice-container').innerHTML = `
                <h2>Invoice: ${inv.invoiceNumber}</h2>
                <p>Plan: ${inv.planName} (${inv.months} mos)</p>
                <p>Total: $${inv.total}</p>
                <p>Status: <strong>${inv.status.toUpperCase()}</strong></p>
                <hr style="margin:15px 0;">
                <p>Make payment via Ecocash/Innbucks and submit proof on support page.</p>
            `;
            document.getElementById('invoiceModal').classList.add('active');
        }

        async function changeEmail() {
            const email = document.getElementById('new-email').value;
            if(!email) return showToast('Enter valid email', 'error');
            try {
                await currentUser.updateEmail(email);
                showToast('Email updated successfully', 'success');
            } catch(e) { showToast(e.message, 'error'); }
        }

        async function changePassword() {
            const pwd = document.getElementById('new-password').value;
            if(!pwd || pwd.length < 6) return showToast('Password too short', 'error');
            try {
                await currentUser.updatePassword(pwd);
                showToast('Password updated successfully', 'success');
            } catch(e) { showToast(e.message, 'error'); }
        }

        document.getElementById('menuToggle').onclick = () => document.getElementById('sidebar').classList.toggle('open');
        document.querySelectorAll('.nav-links a[data-tab]').forEach(a => a.onclick = (e) => { e.preventDefault(); switchTab(a.dataset.tab); });
        document.getElementById('logout-btn').onclick = () => auth.signOut().then(() => window.location.href = 'index.html');
        document.getElementById('logout-link').onclick = (e) => { e.preventDefault(); auth.signOut().then(() => window.location.href = 'index.html'); };
    </script>
</body>
</html>
