<html lang="en">

<body>
    <div class="container">
        <div class="header">
            <a href="vendordashboard.html" class="back-btn" id="dash-btn" style="display:none;"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <div class="logo">Zone<span>21</span> Provider</div>
        </div>

        <div id="profile-content">

    <template id="review-template">
        <div class="review-item">
            <div class="review-header">
                <span class="reviewer-name"></span>
                <span class="review-date"></span>
            </div>
            <div class="review-stars"></div>
            <div class="review-comment"></div>
        </div>
    </template>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ===== SERVICES LIST =====
        const servicesList = [
            "Marquee / Tents & Chairs", "PA System & Basic Sound", "DJ Services",
            "Stage & Decorative Lighting", "Event Décor & Draping", "Catering (Food & Buffet)",
            "Beverages & Mobile Bar", "Cake Designer / Baker", "Photographer", "Videographer",
            "MC (Master of Ceremonies)", "Makeup Artist", "Hairstylist",
            "Transport / Car Hire", "Cleaning Services", "Ushers & Hostesses"
        ];

        let currentProviderId = null;
        let providerData = null;
        let isOwner = false;
        let viewMode = 'public';
        let uploadedImages = [];
        let currentUser = null;

        // ===== RESOLVE PROVIDER ID =====
        async function resolveProviderId(user) {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = urlParams.get('id');
            if (idFromUrl && idFromUrl !== 'null' && idFromUrl !== 'undefined') {
                return idFromUrl;
            }
            if (user) {
                try {
                    const doc = await db.collection('serviceProviders').doc(user.uid).get();
                    if (doc.exists) return user.uid;
                    if (user.email) {
                        const snap = await db.collection('serviceProviders').where('email', '==', user.email)
                            .limit(1).get();
                        if (!snap.empty) return snap.docs[0].id;
                    }
                } catch (error) { console.error("Error resolving provider ID:", error); }
            }
            return null;
        }

        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            currentProviderId = await resolveProviderId(user);
            if (currentProviderId) {
                isOwner = user && (user.uid === currentProviderId || (providerData && providerData.email === user.email));
                if (isOwner) document.getElementById('dash-btn').style.display = 'block';
                loadProviderProfile();
            } else if (user) {
                showProfileNotFound(true);
            } else {
                showProfileNotFound(false);
            }
        });

        function showProfileNotFound(isLoggedIn) {
            const content = document.getElementById('profile-content');
            if (isLoggedIn) {
                content.innerHTML = `
                    <div class="error">
                        <i class="fas fa-user-plus" style="font-size:3rem; color:var(--navy);"></i>
                        <h3>No Service Provider Profile Found</h3>
                        <p style="margin:10px 0;">You don't have a service provider profile yet.</p>
                        <button class="btn-create" onclick="createProviderProfile()"><i class="fas fa-plus"></i> Create My Profile</button>
                    </div>`;
            } else {
                content.innerHTML = `
                    <div class="error">
                        <i class="fas fa-lock" style="font-size:3rem; color:var(--navy);"></i>
                        <h3>Please Sign In</h3>
                        <p style="margin:10px 0;">Log in to view or create your provider profile.</p>
                        <a href="login.html" class="btn-create"><i class="fas fa-sign-in-alt"></i> Go to Login</a>
                    </div>`;
            }
        }

        async function createProviderProfile() {
            if (!auth.currentUser) return;
            const uid = auth.currentUser.uid;
            const email = auth.currentUser.email || '';
            const defaultData = {
                name: email.split('@')[0] || 'My Business',
                category: '',
                services: [],
                secondaryServices: '',
                businessHours: '',
                yearsExperience: 0,
                serviceAreas: '',
                languages: '',
                paymentMethods: '',
                cancellationPolicy: '',
                description: '',
                location: '',
                basePrice: 0,
                rating: 0,
                reviewsCount: 0,
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection('serviceProviders').doc(uid).set(defaultData);
            window.location.reload();
        }

        async function loadProviderProfile() {
            try {
                const doc = await db.collection('serviceProviders').doc(currentProviderId).get();
                if (!doc.exists) { showProfileNotFound(auth.currentUser ? true : false); return; }
                providerData = doc.data();
                uploadedImages = providerData.images || [];
                if (viewMode === 'public') renderPublicView();
                else renderEditView();
                if (viewMode === 'public') loadReviews(currentProviderId);
            } catch (error) {
                document.getElementById('profile-content').innerHTML =
                    '<div class="error">Failed to load profile.</div>';
            }
        }

        function toggleMode() {
            viewMode = viewMode === 'public' ? 'edit' : 'public';
            loadProviderProfile();
        }

        // ===== IMAGE COMPRESSION =====
        function compressToBase64(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    callback(dataUrl);
                };
            };
        }

        // ===== RENDER PUBLIC VIEW =====
        function renderPublicView() {
            const initials = (providerData.name || '?').split(' ').map(w => w.charAt(0)).join('').substring(0, 2)
                .toUpperCase();
            const avatarHtml = providerData.avatar ?
                `<img src="${providerData.avatar}" alt="Avatar">` :
                initials;

            const socialLinks = [];
            if (providerData.facebook) socialLinks.push({ class: 'social-facebook', icon: 'fab fa-facebook-f',
                url: providerData.facebook, label: 'Facebook' });
            if (providerData.instagram) socialLinks.push({ class: 'social-instagram', icon: 'fab fa-instagram',
                url: providerData.instagram, label: 'Instagram' });
            if (providerData.tiktok) socialLinks.push({ class: 'social-tiktok', icon: 'fab fa-tiktok', url: providerData
                    .tiktok, label: 'TikTok' });
            if (providerData.youtube) socialLinks.push({ class: 'social-youtube', icon: 'fab fa-youtube', url: providerData
                    .youtube, label: 'YouTube' });
            if (providerData.website) socialLinks.push({ class: 'social-website', icon: 'fas fa-globe', url: providerData
                    .website, label: 'Website' });

            const servicesHtml = (providerData.services || []).map(s => `<span class="service-tag">${s}</span>`).join('');

            const galleryHtml = (providerData.images || []).length > 0 ?
                providerData.images.map(img =>
                    `<div class="gallery-item" onclick="window.open('${img}', '_blank')"><img src="${img}" alt="Gallery"></div>`
                    ).join('') :
                '<p style="color:var(--muted); grid-column: 1/-1;">No images available</p>';

            const rating = providerData.rating || 0;
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 >= 0.5;
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= fullStars) starsHtml += '<i class="fas fa-star"></i>';
                else if (i === fullStars + 1 && halfStar) starsHtml += '<i class="fas fa-star-half-alt"></i>';
                else starsHtml += '<i class="far fa-star"></i>';
            }

            // ---- DETAIL GRID (provider-specific) ----
            const detailItems = [];
            if (providerData.secondaryServices) {
                detailItems.push({
                    icon: 'fa-chevron-circle-right',
                    label: 'Secondary Services',
                    value: providerData.secondaryServices,
                    cls: 'secondary-svc'
                });
            }
            if (providerData.businessHours) {
                detailItems.push({
                    icon: 'fa-clock',
                    label: 'Business Hours',
                    value: providerData.businessHours
                });
            }
            if (providerData.yearsExperience) {
                detailItems.push({
                    icon: 'fa-award',
                    label: 'Years of Experience',
                    value: providerData.yearsExperience + ' years'
                });
            }
            if (providerData.serviceAreas) {
                detailItems.push({
                    icon: 'fa-map-pin',
                    label: 'Service Areas',
                    value: providerData.serviceAreas
                });
            }
            if (providerData.languages) {
                detailItems.push({
                    icon: 'fa-language',
                    label: 'Languages Spoken',
                    value: providerData.languages
                });
            }
            if (providerData.paymentMethods) {
                detailItems.push({
                    icon: 'fa-credit-card',
                    label: 'Payment Methods',
                    value: providerData.paymentMethods
                });
            }
            if (providerData.cancellationPolicy) {
                detailItems.push({
                    icon: 'fa-file-contract',
                    label: 'Cancellation Policy',
                    value: providerData.cancellationPolicy,
                    cls: 'secondary-svc'
                });
            }
            if (providerData.location) {
                detailItems.push({
                    icon: 'fa-map-marker-alt',
                    label: 'Location',
                    value: providerData.location
                });
            }

            const detailHtml = detailItems.length > 0 ?
                detailItems.map(item =>
                    `<div class="detail-item">
                            <i class="fas ${item.icon}"></i>
                            <div>
                                <span class="label">${item.label}</span>
                                <div class="value ${item.cls || ''}">${item.value}</div>
                            </div>
                        </div>`
                ).join('') :
                '<p style="color:var(--muted); grid-column:1/-1; padding:8px 0;">No additional details provided.</p>';

            // ---- REVIEW FORM (same logic) ----
            let reviewFormHtml = '';
            if (!isOwner && currentUser) {
                reviewFormHtml = `
                    <div class="review-form" id="review-form-container">
                        <h3>Rate this provider</h3>
                        <div class="star-rating-input" id="star-input">
                            <i class="far fa-star" data-value="1"></i><i class="far fa-star" data-value="2"></i><i class="far fa-star" data-value="3"></i><i class="far fa-star" data-value="4"></i><i class="far fa-star" data-value="5"></i>
                        </div>
                        <input type="text" id="reviewer-name" placeholder="Your name (optional)">
                        <textarea id="review-comment" placeholder="Write your review..."></textarea>
                        <button class="submit-review-btn" id="submit-review-btn"><i class="fas fa-paper-plane"></i> Submit Review</button>
                        <div id="review-status" style="margin-top:8px; font-size:0.85rem; color:var(--muted);"></div>
                    </div>
                `;
            } else if (isOwner) {
                reviewFormHtml = `<p style="color:var(--muted); padding:10px 0;">You cannot review your own profile.</p>`;
            } else {
                reviewFormHtml = `<p style="color:var(--muted); padding:10px 0;">Please <a href="login.html" style="color:var(--pink);">sign in</a> to leave a review.</p>`;
            }

            const html = `
                <div class="profile-card">
                    <div class="profile-cover"></div>
                    <div class="profile-avatar">${avatarHtml}</div>
                    <div class="profile-info">
                        ${isOwner ? `<button class="edit-toggle-btn" onclick="toggleMode()"><i class="fas fa-pen"></i> Edit Profile</button>` : ''}

                        <div class="name">${providerData.name || 'Unnamed Provider'}</div>
                        <div class="category">${providerData.category || 'General Service'} ${providerData.basePrice ? ` • Starts at $${providerData.basePrice}` : ''}</div>

                        <div class="rating-summary">
                            <span class="stars">${starsHtml}</span>
                            <span class="rating-number">${rating.toFixed(1)}</span>
                            <span class="reviews-count">(${providerData.reviewsCount || 0} reviews)</span>
                        </div>

                        ${servicesHtml ? `<div class="services-tags">${servicesHtml}</div>` : ''}
                        ${providerData.description ? `<div class="description">${providerData.description}</div>` : ''}

                        <div class="detail-grid">${detailHtml}</div>

                        ${socialLinks.length ? `<div class="social-links">${socialLinks.map(link => `<a href="${link.url}" target="_blank" class="social-link ${link.class}" title="${link.label}"><i class="${link.icon}"></i></a>`).join('')}</div>` : ''}

                        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">
                            <button class="share-btn" onclick="copyProfileLink('${currentProviderId}')"><i class="fas fa-share-alt"></i> Share Profile</button>
                        </div>
                    </div>
                </div>

                <div class="profile-card" style="padding:20px;">
                    <div class="gallery-section">
                        <h2 style="font-size:1.2rem; color:var(--navy); margin-bottom:15px;"><i class="fas fa-images" style="color:var(--pink);"></i> Gallery</h2>
                        <div class="standard-gallery">${galleryHtml}</div>
                    </div>
                </div>

                <div class="profile-card" style="padding:20px;">
                    <div class="review-section">
                        <h2 style="font-size:1.2rem; color:var(--navy); margin-bottom:15px;"><i class="fas fa-star" style="color:var(--pink);"></i> Ratings & Reviews</h2>
                        ${reviewFormHtml}
                        <div class="review-list" id="review-list"></div>
                    </div>
                </div>
            `;
            document.getElementById('profile-content').innerHTML = html;

            if (!isOwner && currentUser) {
                setupStarRating();
                checkExistingReview(currentProviderId, 'serviceProviders').then(existing => {
                    if (existing) {
                        document.getElementById('review-status').textContent = 'You have already reviewed. Edit below.';
                        document.getElementById('submit-review-btn').textContent = 'Update Review';
                        document.getElementById('reviewer-name').value = existing.reviewerName || '';
                        document.getElementById('review-comment').value = existing.comment || '';
                        selectedRating = existing.rating;
                        updateStarInputUI(selectedRating);
                        document.getElementById('submit-review-btn').dataset.reviewId = existing.id;
                    } else {
                        document.getElementById('submit-review-btn').dataset.reviewId = '';
                    }
                });
                document.getElementById('submit-review-btn').addEventListener('click', () => submitReview(currentProviderId,
                    'serviceProviders'));
            }
        }

        // ===== RENDER EDIT VIEW (unchanged) =====
        function renderEditView() {
            let checkboxesHtml = servicesList.map(svc => `
                <label class="service-checkbox">
                    <input type="checkbox" class="edit-svc-chk" value="${svc}" ${(providerData.services || []).includes(svc) ? 'checked' : ''}>
                    ${svc}
                </label>
            `).join('');

            let imagesHtml = uploadedImages.map((url, i) => `
                <div class="gallery-item">
                    <img src="${url}">
                    <button class="delete-img-btn" onclick="removeImage(${i})"><i class="fas fa-times"></i></button>
                </div>
            `).join('');

            const initials = (providerData.name || '?').split(' ').map(w => w.charAt(0)).join('').substring(0, 2)
                .toUpperCase();
            const avatarHtml = providerData.avatar ? `<img src="${providerData.avatar}" alt="Avatar">` : initials;

            const html = `
                <div class="profile-card" style="padding:30px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; border-bottom:2px solid var(--lime); padding-bottom:10px;">
                        <h2 style="color:var(--navy);"><i class="fas fa-edit"></i> Edit Profile</h2>
                        <button class="edit-toggle-btn" style="position:relative; top:0; right:0;" onclick="toggleMode()"><i class="fas fa-eye"></i> View Public</button>
                    </div>

                    <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:25px;">
                        <div class="profile-avatar editable" style="margin:0; cursor:pointer;" onclick="document.getElementById('avatar-upload').click()" id="avatar-preview-box">
                            ${avatarHtml}
                            <div class="avatar-edit-overlay"><i class="fas fa-camera"></i></div>
                        </div>
                        <input type="file" id="avatar-upload" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
                        <p style="color:var(--muted); font-size:0.8rem; margin-top:10px;">Click to change profile picture</p>
                    </div>

                    <h3 style="color:var(--navy); margin-bottom:15px; font-size:1.1rem;">Basic Information</h3>
                    <div class="form-grid">
                        <div class="input-group"><label>Company Name</label><input type="text" id="e-name" value="${providerData.name || ''}"></div>
                        <div class="input-group"><label>Location</label><input type="text" id="e-loc" value="${providerData.location || ''}"></div>
                        <div class="input-group"><label>Primary Category</label><input type="text" id="e-cat" value="${providerData.category || ''}" placeholder="e.g. Wedding DJ"></div>
                        <div class="input-group"><label>Base Starting Price ($)</label><input type="number" id="e-price" value="${providerData.basePrice || ''}"></div>
                        <div class="input-group full-width"><label>Description</label><textarea id="e-desc" rows="3">${providerData.description || ''}</textarea></div>
                    </div>

                    <h3 style="color:var(--navy); margin:25px 0 15px; font-size:1.1rem;">Primary Services</h3>
                    <div class="services-check-grid">${checkboxesHtml}</div>

                    <h3 style="color:var(--navy); margin:25px 0 15px; font-size:1.1rem;">Additional Details</h3>
                    <div class="form-grid">
                        <div class="input-group full-width"><label>Secondary Services <span style="font-weight:400;color:var(--muted);">(list any additional services not shown above)</span></label>
                            <textarea id="e-secondary" rows="2">${providerData.secondaryServices || ''}</textarea>
                        </div>
                        <div class="input-group"><label>Business Hours</label>
                            <input type="text" id="e-hours" value="${providerData.businessHours || ''}" placeholder="e.g. Mon–Fri 9am–6pm">
                        </div>
                        <div class="input-group"><label>Years of Experience</label>
                            <input type="number" id="e-experience" value="${providerData.yearsExperience || ''}" placeholder="e.g. 5">
                        </div>
                        <div class="input-group"><label>Service Areas</label>
                            <input type="text" id="e-areas" value="${providerData.serviceAreas || ''}" placeholder="e.g. Lagos, Abuja, Port Harcourt">
                        </div>
                        <div class="input-group"><label>Languages Spoken</label>
                            <input type="text" id="e-languages" value="${providerData.languages || ''}" placeholder="e.g. English, Yoruba, French">
                        </div>
                        <div class="input-group"><label>Payment Methods</label>
                            <input type="text" id="e-payment" value="${providerData.paymentMethods || ''}" placeholder="e.g. Cash, Bank Transfer, Card">
                        </div>
                        <div class="input-group full-width"><label>Cancellation Policy</label>
                            <textarea id="e-cancellation" rows="2">${providerData.cancellationPolicy || ''}</textarea>
                        </div>
                    </div>

                    <h3 style="color:var(--navy); margin:25px 0 15px; font-size:1.1rem;">Social Media (no phone/email)</h3>
                    <div class="form-grid">
                        <div class="input-group"><label>TikTok Link</label><input type="text" id="e-tt" value="${providerData.tiktok || ''}"></div>
                        <div class="input-group"><label>Instagram Link</label><input type="text" id="e-ig" value="${providerData.instagram || ''}"></div>
                        <div class="input-group"><label>Facebook Link</label><input type="text" id="e-fb" value="${providerData.facebook || ''}"></div>
                        <div class="input-group"><label>YouTube Link</label><input type="text" id="e-yt" value="${providerData.youtube || ''}"></div>
                        <div class="input-group full-width"><label>Website</label><input type="text" id="e-web" value="${providerData.website || ''}"></div>
                    </div>

                    <h3 style="color:var(--navy); margin:25px 0 15px; font-size:1.1rem;">Gallery (Max 5 Images)</h3>
                    <div class="upload-area" onclick="document.getElementById('gallery-upload').click()" id="upload-box">
                        <i class="fas fa-cloud-upload-alt" style="font-size:2rem; color:var(--navy); margin-bottom:10px;"></i>
                        <p id="upload-text">Click to add gallery images.</p>
                        <input type="file" id="gallery-upload" accept="image/*" multiple style="display:none;" onchange="handleGalleryUpload(event)">
                    </div>
                    <div class="standard-gallery" id="edit-gallery">${imagesHtml}</div>

                    <button class="btn-create" style="width:100%; margin-top:30px;" id="save-btn" onclick="saveProfileData()"><i class="fas fa-save"></i> Save All Changes</button>
                </div>
            `;
            document.getElementById('profile-content').innerHTML = html;
        }

        // ===== EDIT HANDLERS (unchanged) =====
        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const box = document.getElementById('avatar-preview-box');
            box.innerHTML = '<div class="spinner-sm" style="border-left-color:var(--navy);"></div><div class="avatar-edit-overlay"><i class="fas fa-camera"></i></div>';
            compressToBase64(file, 400, 0.7, (base64) => {
                providerData.avatar = base64;
                box.innerHTML =
                    `<img src="${base64}" alt="Avatar"><div class="avatar-edit-overlay"><i class="fas fa-camera"></i></div>`;
            });
        }

        function handleGalleryUpload(event) {
            const files = Array.from(event.target.files);
            if (uploadedImages.length + files.length > 5) { alert("Maximum 5 images allowed in the gallery."); return; }
            const txt = document.getElementById('upload-text');
            txt.innerHTML = '<span class="spinner-sm" style="border-left-color:var(--navy);"></span> Processing images...';
            let processed = 0;
            files.forEach(file => {
                compressToBase64(file, 800, 0.6, (base64) => {
                    uploadedImages.push(base64);
                    processed++;
                    if (processed === files.length) renderEditView();
                });
            });
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderEditView();
        }

        async function saveProfileData() {
            const btn = document.getElementById('save-btn');
            btn.innerHTML = '<span class="spinner-sm"></span> Saving...';
            btn.disabled = true;

            const selectedSvc = Array.from(document.querySelectorAll('.edit-svc-chk:checked')).map(cb => cb.value);

            const updates = {
                name: document.getElementById('e-name').value.trim(),
                location: document.getElementById('e-loc').value.trim(),
                category: document.getElementById('e-cat').value.trim(),
                basePrice: Number(document.getElementById('e-price').value) || 0,
                description: document.getElementById('e-desc').value.trim(),
                services: selectedSvc,
                secondaryServices: document.getElementById('e-secondary').value.trim(),
                businessHours: document.getElementById('e-hours').value.trim(),
                yearsExperience: Number(document.getElementById('e-experience').value) || 0,
                serviceAreas: document.getElementById('e-areas').value.trim(),
                languages: document.getElementById('e-languages').value.trim(),
                paymentMethods: document.getElementById('e-payment').value.trim(),
                cancellationPolicy: document.getElementById('e-cancellation').value.trim(),
                tiktok: document.getElementById('e-tt').value.trim(),
                instagram: document.getElementById('e-ig').value.trim(),
                facebook: document.getElementById('e-fb').value.trim(),
                youtube: document.getElementById('e-yt').value.trim(),
                website: document.getElementById('e-web').value.trim(),
                avatar: providerData.avatar || null,
                images: uploadedImages,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection('serviceProviders').doc(currentProviderId).set(updates, { merge: true });
                providerData = { ...providerData, ...updates };
                toggleMode();
            } catch (e) {
                console.error(e);
                alert("Error saving profile. Ensure document size is within limits.");
                btn.innerHTML = '<i class="fas fa-save"></i> Save All Changes';
                btn.disabled = false;
            }
        }

        // ============================================================
        //  REVIEW SYSTEM (same as venue but with collection param)
        // ============================================================
        let selectedRating = 0;

        function setupStarRating() {
            const stars = document.querySelectorAll('#star-input i');
            stars.forEach(star => {
                star.addEventListener('mouseover', () => updateStarInputUI(parseInt(star.dataset.value)));
                star.addEventListener('mouseleave', () => updateStarInputUI(selectedRating));
                star.addEventListener('click', () => { selectedRating = parseInt(star.dataset.value);
                    updateStarInputUI(selectedRating); });
            });
        }

        function updateStarInputUI(val) {
            document.querySelectorAll('#star-input i').forEach(star => {
                star.className = parseInt(star.dataset.value) <= val ? 'fas fa-star active' : 'far fa-star';
            });
        }

        async function checkExistingReview(profileId, collectionName) {
            if (!currentUser) return null;
            try {
                const snap = await db.collection(collectionName).doc(profileId).collection('reviews')
                    .where('reviewerId', '==', currentUser.uid).get();
                if (!snap.empty) {
                    const doc = snap.docs[0];
                    return { id: doc.id, ...doc.data() };
                }
                return null;
            } catch (e) {
                console.error('Error checking existing review:', e);
                return null;
            }
        }

        async function submitReview(profileId, collectionName) {
            if (selectedRating === 0) {
                alert('Please select a star rating.');
                return;
            }
            const comment = document.getElementById('review-comment').value.trim();
            if (!comment) {
                alert('Please write a comment.');
                return;
            }
            const reviewerName = document.getElementById('reviewer-name').value.trim() || 'Anonymous';
            const btn = document.getElementById('submit-review-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-sm"></span> Sending...';

            const existingReviewId = btn.dataset.reviewId || null;

            try {
                const reviewData = {
                    rating: selectedRating,
                    reviewerName: reviewerName,
                    comment: comment,
                    reviewerId: currentUser.uid,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                if (existingReviewId) {
                    await db.collection(collectionName).doc(profileId).collection('reviews').doc(existingReviewId)
                        .update(reviewData);
                } else {
                    reviewData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection(collectionName).doc(profileId).collection('reviews').add(reviewData);
                }

                await updateProfileRating(profileId, collectionName);
                loadReviews(profileId);
                document.getElementById('review-status').textContent = 'Review saved successfully!';
                btn.textContent = 'Update Review';
                const updatedReview = await checkExistingReview(profileId, collectionName);
                if (updatedReview) {
                    btn.dataset.reviewId = updatedReview.id;
                }
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Update Review';
            } catch (e) {
                console.error(e);
                alert('Failed to submit review. Please try again.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Review';
            }
        }

        async function updateProfileRating(profileId, collectionName) {
            try {
                const reviewsSnap = await db.collection(collectionName).doc(profileId).collection('reviews').get();
                let total = 0;
                let count = 0;
                reviewsSnap.forEach(doc => {
                    const data = doc.data();
                    if (data.rating) {
                        total += data.rating;
                        count++;
                    }
                });
                const avg = count > 0 ? total / count : 0;
                await db.collection(collectionName).doc(profileId).update({
                    rating: avg,
                    reviewsCount: count
                });
            } catch (e) {
                console.error('Error updating profile rating:', e);
            }
        }

        async function loadReviews(profileId) {
            const list = document.getElementById('review-list');
            list.innerHTML = '<p style="color:var(--muted);"><span class="spinner-sm" style="border-left-color:var(--navy);"></span> Loading reviews...</p>';
            try {
                const snap = await db.collection('serviceProviders').doc(profileId).collection('reviews').orderBy(
                    'createdAt', 'desc').get();
                list.innerHTML = '';
                if (snap.empty) { list.innerHTML = '<p style="color:var(--muted);">No reviews yet.</p>'; return; }
                const tmpl = document.getElementById('review-template');
                snap.forEach(doc => {
                    const r = doc.data();
                    const clone = tmpl.content.cloneNode(true);
                    clone.querySelector('.reviewer-name').textContent = r.reviewerName || 'Anonymous';
                    let d = 'Recently';
                    if (r.createdAt && r.createdAt.toDate) d = new Date(r.createdAt.toDate()).toLocaleDateString();
                    clone.querySelector('.review-date').textContent = d;
                    clone.querySelector('.review-stars').textContent = '★'.repeat(r.rating) + '☆'.repeat(5 - r
                        .rating);
                    clone.querySelector('.review-comment').textContent = r.comment || '';
                    list.appendChild(clone);
                });
            } catch (e) { list.innerHTML = '<p style="color:var(--pink);">Failed to load reviews.</p>'; }
        }

        function copyProfileLink(pid) {
            navigator.clipboard.writeText(window.location.href).then(() => alert('Profile link copied!'));
        }
    </script>
</body>
</html>
