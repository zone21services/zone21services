<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<body>
    <!-- Toast, Chat Modal, Profile Modal (unchanged) -->

    <!--  FIREBASE SCRIPT – with review integration in modal           -->

    <script>
        // (Firebase config and all existing code from previous discover.html, with the following additions/changes)

        // -------- ADD THESE FUNCTIONS INSIDE THE SCRIPT --------

        // Override the renderVendorProfileModal to include review section
        // We'll replace the existing function with one that adds a review container.

        // We'll also add functions: loadReviewsForModal, checkExistingReview, submitReviewFromModal, updateProfileRating.

        // Here is the modified renderVendorProfileModal and supporting review functions.
        // I'll provide the full script with the changes integrated.

        // Since the file is long, I'll highlight the changes.

        // 1. In the modal HTML, after the actions, add a review section:
        // We'll add a div with id "modal-reviews" and a review form.

        // 2. After rendering the modal, call loadReviewsForModal(uid, collectionName).

        // 3. Implement loadReviewsForModal, checkExistingReview, submitReviewFromModal.

        // I'll give you the complete updated script block for discover.html.
        // For brevity, I'll paste only the script part, but you need to combine with the existing HTML structure.
        // (The HTML structure remains the same; only the script changes.)

        // ===== UPDATED SCRIPT =====

        // (Keep all existing code: Firebase config, state, auth, loadListings, renderListings, chat functions, etc.)
        // Then add/replace the following functions:

        // ---- Override renderVendorProfileModal ----
        async function openVendorProfile(uid, collectionName) {
            try {
                const doc = await db.collection(collectionName).doc(uid).get();
                if (!doc.exists) {
                    showToast('Profile not found', 'error');
                    return;
                }
                const data = doc.data();
                const userSnap = await db.collection('users').doc(uid).get();
                const userData = userSnap.exists ? userSnap.data() : {};

                const merged = {
                    uid: uid,
                    ...data,
                    name: data.name || userData.name || 'Unnamed',
                    avatarUrl: data.avatar || userData.avatarUrl || null,
                    type: collectionName === 'venues' ? 'venue' : 'provider',
                    collection: collectionName,
                };

                renderVendorProfileModal(merged);
                // After rendering, load reviews
                loadReviewsForModal(uid, collectionName);
            } catch (error) {
                console.error('Error fetching profile:', error);
                showToast('Failed to load profile', 'error');
            }
        }

        function renderVendorProfileModal(item) {
            // ... (same as before, but we'll add a review section at the end of profile-info)
            // I'll show only the modified parts.

            // At the end of the modal content, after the actions, add:
            const reviewSection = `
                <div style="margin-top:20px; border-top:1px solid var(--border-light); padding-top:16px;">
                    <h4 style="font-size:0.95rem; color:var(--navy); margin-bottom:10px;"><i class="fas fa-comment" style="color:var(--pink);"></i> Reviews</h4>
                    <div id="modal-review-list" style="display:flex; flex-direction:column; gap:10px; max-height:200px; overflow-y:auto; margin-bottom:12px;"></div>
                    <div id="modal-review-form-container"></div>
                </div>
            `;

            // Insert this after the actionsHtml inside profile-info.
            // We'll use a placeholder and append it in the script.

            // For simplicity, I'll rebuild the profile-info HTML with the review section.
            // I'll include the full render function again with the addition.
        }

        // I'll provide the complete renderVendorProfileModal with review section:
        function renderVendorProfileModal(item) {
            const name = item.name || 'Unnamed';
            const initials = name.split(' ').map(w => w.charAt(0)).join('').substring(0, 2).toUpperCase();
            let avatarHtml = item.avatarUrl ?
                `<img src="${item.avatarUrl}" alt="Avatar">` :
                initials;

            const category = item.category || item.serviceType || (item.type === 'venue' ? 'Venue' : 'Service Provider');
            const rating = item.rating || 0;
            const reviewsCount = item.reviewsCount || 0;
            const description = item.description || item.bio || 'No description provided.';
            const basePrice = item.basePrice || 0;

            // Stars
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 >= 0.5;
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= fullStars) starsHtml += '<i class="fas fa-star"></i>';
                else if (i === fullStars + 1 && halfStar) starsHtml += '<i class="fas fa-star-half-alt"></i>';
                else starsHtml += '<i class="far fa-star"></i>';
            }

            // Services / Amenities
            let services = [];
            if (item.services && item.services.length) {
                services = item.services;
            } else if (item.amenities && item.amenities.length) {
                services = item.amenities;
            } else if (item.secondaryServices) {
                services = item.secondaryServices.split(',').map(s => s.trim());
            }
            const servicesHtml = services.map(s => `<span class="service-tag">${s}</span>`).join('');

            // Details
            const detailItems = [];
            if (item.type === 'venue') {
                if (item.capacity) detailItems.push({ icon: 'fa-users', label: 'Capacity', value: item.capacity +
                        ' guests' });
                if (item.venueType) detailItems.push({ icon: 'fa-archway', label: 'Venue Type', value: item
                        .venueType });
                if (item.pricingPackages) detailItems.push({ icon: 'fa-layer-group', label: 'Pricing Packages',
                    value: item.pricingPackages });
                if (item.rentalPolicies) detailItems.push({ icon: 'fa-file-contract', label: 'Rental Policies',
                    value: item.rentalPolicies });
                if (item.deposit) detailItems.push({ icon: 'fa-hand-holding-usd', label: 'Deposit Required',
                    value: item.deposit });
                if (item.operatingHours) detailItems.push({ icon: 'fa-clock', label: 'Operating Hours', value: item
                        .operatingHours });
                if (item.parking) detailItems.push({ icon: 'fa-parking', label: 'Parking Information', value: item
                        .parking });
                if (item.catering) detailItems.push({ icon: 'fa-utensils', label: 'Catering Options', value: item
                        .catering });
            } else {
                if (item.secondaryServices) detailItems.push({ icon: 'fa-chevron-circle-right',
                    label: 'Secondary Services', value: item.secondaryServices });
                if (item.businessHours) detailItems.push({ icon: 'fa-clock', label: 'Business Hours', value: item
                        .businessHours });
                if (item.yearsExperience) detailItems.push({ icon: 'fa-award', label: 'Years of Experience',
                    value: item.yearsExperience + ' years' });
                if (item.serviceAreas) detailItems.push({ icon: 'fa-map-pin', label: 'Service Areas', value: item
                        .serviceAreas });
                if (item.languages) detailItems.push({ icon: 'fa-language', label: 'Languages Spoken', value: item
                        .languages });
                if (item.paymentMethods) detailItems.push({ icon: 'fa-credit-card', label: 'Payment Methods',
                    value: item.paymentMethods });
                if (item.cancellationPolicy) detailItems.push({ icon: 'fa-file-contract', label: 'Cancellation Policy',
                    value: item.cancellationPolicy });
            }
            if (item.location) detailItems.push({ icon: 'fa-map-marker-alt', label: 'Location', value: item
                    .location });

            const detailHtml = detailItems.length > 0 ?
                detailItems.map(d =>
                    `<div class="detail-item">
                                <i class="fas ${d.icon}"></i>
                                <div>
                                    <span class="label">${d.label}</span>
                                    <div class="value">${d.value}</div>
                                </div>
                            </div>`
                ).join('') :
                '<p style="grid-column:1/-1; color:var(--text-muted); font-size:0.85rem;">No additional details available.</p>';

            // Social
            const socialLinks = [];
            if (item.facebook) socialLinks.push({ class: 'social-facebook', icon: 'fab fa-facebook-f', url: item
                    .facebook, label: 'Facebook' });
            if (item.instagram) socialLinks.push({ class: 'social-instagram', icon: 'fab fa-instagram', url: item
                    .instagram, label: 'Instagram' });
            if (item.tiktok) socialLinks.push({ class: 'social-tiktok', icon: 'fab fa-tiktok', url: item.tiktok,
                label: 'TikTok' });
            if (item.youtube) socialLinks.push({ class: 'social-youtube', icon: 'fab fa-youtube', url: item.youtube,
                label: 'YouTube' });
            if (item.website) socialLinks.push({ class: 'social-website', icon: 'fas fa-globe', url: item.website,
                label: 'Website' });
            const socialHtml = socialLinks.length > 0 ?
                socialLinks.map(link =>
                    `<a href="${link.url}" target="_blank" class="social-link ${link.class}" title="${link.label}"><i class="${link.icon}"></i></a>`
                ).join('') :
                '';

            // Gallery
            const images = item.images || [];
            let galleryHtml = '';
            if (images.length > 0) {
                const validImages = images.filter(url => url && typeof url === 'string' && (url.startsWith('data:') || url
                    .startsWith('http')));
                if (validImages.length > 0) {
                    galleryHtml = `
                                <div class="gallery-section">
                                    <h4><i class="fas fa-images"></i> Gallery</h4>
                                    <div class="gallery-grid">
                                        ${validImages.map((url, i) => `<div class="gallery-item"><img src="${url}" alt="Gallery ${i+1}" loading="lazy"></div>`).join('')}
                                    </div>
                                </div>
                            `;
                }
            }

            const actionsHtml = `
                        <div class="modal-actions">
                            <button class="btn btn-message" onclick="closeVendorProfileModal(); openChatForVendor('${item.uid}')">
                                <i class="fas fa-paper-plane"></i> Message
                            </button>
                            <button class="btn btn-outline" onclick="copyVendorProfileLink('${item.uid}')">
                                <i class="fas fa-share-alt"></i> Share
                            </button>
                        </div>
                    `;

            // ---- Review section (will be populated later) ----
            const reviewSection = `
                        <div style="margin-top:20px; border-top:1px solid var(--border-light); padding-top:16px;">
                            <h4 style="font-size:0.95rem; color:var(--navy); margin-bottom:10px;"><i class="fas fa-comment" style="color:var(--pink);"></i> Reviews</h4>
                            <div id="modal-review-list" style="display:flex; flex-direction:column; gap:10px; max-height:200px; overflow-y:auto; margin-bottom:12px;"></div>
                            <div id="modal-review-form-container"></div>
                        </div>
                    `;

            vendorProfileBody.innerHTML = `
                        <div class="profile-cover"></div>
                        <div class="profile-avatar">${avatarHtml}</div>
                        <div class="profile-info">
                            <div class="name">${name}</div>
                            <div class="category">${category} ${basePrice ? `• Starts at $${basePrice}` : ''}</div>
                            <div class="rating-summary">
                                <span class="stars">${starsHtml}</span>
                                <span class="rating-number">${rating.toFixed(1)}</span>
                                <span class="reviews-count">(${reviewsCount} reviews)</span>
                            </div>
                            ${servicesHtml ? `<div class="services-tags">${servicesHtml}</div>` : ''}
                            ${description ? `<div class="description">${description}</div>` : ''}
                            <div class="detail-grid">${detailHtml}</div>
                            ${socialHtml ? `<div class="social-links">${socialHtml}</div>` : ''}
                            ${galleryHtml}
                            ${actionsHtml}
                            ${reviewSection}
                        </div>
                    `;

            vendorProfileModal.classList.add('active');
            document.body.style.overflow = 'hidden';

            // Store profile data for review functions
            vendorProfileModal.dataset.profileId = item.uid;
            vendorProfileModal.dataset.collection = item.collection;
            // Also store the item for later use
            vendorProfileModal._item = item;
        }

        // ---- Review functions for modal ----
        async function loadReviewsForModal(profileId, collectionName) {
            const list = document.getElementById('modal-review-list');
            if (!list) return;
            list.innerHTML = '<p style="color:var(--text-muted); font-size:0.8rem;">Loading reviews...</p>';

            try {
                const snap = await db.collection(collectionName).doc(profileId).collection('reviews')
                    .orderBy('createdAt', 'desc').get();
                list.innerHTML = '';
                if (snap.empty) {
                    list.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">No reviews yet.</p>';
                } else {
                    snap.forEach(doc => {
                        const r = doc.data();
                        const div = document.createElement('div');
                        div.style.cssText =
                            'padding:10px; background:var(--bg-page); border-radius:8px; border:1px solid var(--border-light);';
                        const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
                        const date = r.createdAt && r.createdAt.toDate ? new Date(r.createdAt.toDate())
                            .toLocaleDateString() : 'Recently';
                        div.innerHTML = `
                                    <div style="display:flex; justify-content:space-between; align-items:center;">
                                        <strong style="font-size:0.85rem;">${r.reviewerName || 'Anonymous'}</strong>
                                        <span style="font-size:0.7rem; color:var(--text-muted);">${date}</span>
                                    </div>
                                    <div style="color:#FBBF24; font-size:0.8rem; letter-spacing:1px;">${stars}</div>
                                    <p style="font-size:0.85rem; margin-top:4px;">${r.comment || ''}</p>
                                `;
                        list.appendChild(div);
                    });
                }

                // Now show/hide review form
                const container = document.getElementById('modal-review-form-container');
                if (!container) return;
                const item = vendorProfileModal._item;
                if (!item) return;

                // Check if current user is owner
                if (currentUser && currentUser.uid === profileId) {
                    container.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">You cannot review your own profile.</p>';
                    return;
                }
                if (!currentUser) {
                    container.innerHTML =
                        '<p style="color:var(--text-muted); font-size:0.85rem;">Please <a href="login.html" style="color:var(--pink);">sign in</a> to leave a review.</p>';
                    return;
                }

                // Check if user already reviewed
                const existing = await checkExistingReviewModal(profileId, collectionName, currentUser.uid);
                if (existing) {
                    container.innerHTML = `
                                <div style="background:#f8f9fa; padding:12px; border-radius:8px;">
                                    <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:6px;">You have already reviewed. Edit your review below:</p>
                                    <div class="star-rating-input" id="modal-star-input" style="display:flex; gap:5px; font-size:1.3rem; margin-bottom:6px;">
                                        <i class="fas fa-star" data-value="1"></i><i class="fas fa-star" data-value="2"></i><i class="fas fa-star" data-value="3"></i><i class="fas fa-star" data-value="4"></i><i class="fas fa-star" data-value="5"></i>
                                    </div>
                                    <input type="text" id="modal-reviewer-name" value="${existing.reviewerName || ''}" placeholder="Your name" style="width:100%; padding:6px; margin-bottom:6px; border:1px solid var(--border); border-radius:6px; font-size:0.85rem;">
                                    <textarea id="modal-review-comment" rows="2" style="width:100%; padding:6px; border:1px solid var(--border); border-radius:6px; font-size:0.85rem;">${existing.comment || ''}</textarea>
                                    <button class="btn btn-primary btn-sm" onclick="submitReviewFromModal('${profileId}','${collectionName}')" style="margin-top:6px;">Update Review</button>
                                    <span id="modal-review-status" style="font-size:0.75rem; color:var(--text-muted); margin-left:8px;"></span>
                                </div>
                            `;
                    // Set rating
                    const stars = container.querySelectorAll('#modal-star-input i');
                    const rating = existing.rating || 0;
                    stars.forEach(star => {
                        star.style.color = parseInt(star.dataset.value) <= rating ? '#ffb400' : '#ccc';
                    });
                    // Store review id for update
                    container.querySelector('button').dataset.reviewId = existing.id;
                    // Attach star click
                    stars.forEach(star => {
                        star.addEventListener('click', function() {
                            const val = parseInt(this.dataset.value);
                            stars.forEach(s => {
                                s.style.color = parseInt(s.dataset.value) <= val ? '#ffb400' :
                                    '#ccc';
                            });
                            // Store selected rating in a data attribute
                            container.querySelector('button').dataset.selectedRating = val;
                        });
                    });
                } else {
                    container.innerHTML = `
                                <div style="background:#f8f9fa; padding:12px; border-radius:8px;">
                                    <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:6px;">Leave a review:</p>
                                    <div class="star-rating-input" id="modal-star-input" style="display:flex; gap:5px; font-size:1.3rem; margin-bottom:6px;">
                                        <i class="far fa-star" data-value="1"></i><i class="far fa-star" data-value="2"></i><i class="far fa-star" data-value="3"></i><i class="far fa-star" data-value="4"></i><i class="far fa-star" data-value="5"></i>
                                    </div>
                                    <input type="text" id="modal-reviewer-name" placeholder="Your name" style="width:100%; padding:6px; margin-bottom:6px; border:1px solid var(--border); border-radius:6px; font-size:0.85rem;">
                                    <textarea id="modal-review-comment" rows="2" placeholder="Write your review..." style="width:100%; padding:6px; border:1px solid var(--border); border-radius:6px; font-size:0.85rem;"></textarea>
                                    <button class="btn btn-primary btn-sm" onclick="submitReviewFromModal('${profileId}','${collectionName}')" style="margin-top:6px;">Submit Review</button>
                                    <span id="modal-review-status" style="font-size:0.75rem; color:var(--text-muted); margin-left:8px;"></span>
                                </div>
                            `;
                    // Attach star click for new review
                    const stars = container.querySelectorAll('#modal-star-input i');
                    stars.forEach(star => {
                        star.addEventListener('click', function() {
                            const val = parseInt(this.dataset.value);
                            stars.forEach(s => {
                                s.className = parseInt(s.dataset.value) <= val ?
                                    'fas fa-star' : 'far fa-star';
                            });
                            container.querySelector('button').dataset.selectedRating = val;
                        });
                    });
                }
            } catch (e) {
                console.error('Error loading reviews for modal:', e);
                list.innerHTML = '<p style="color:var(--pink);">Failed to load reviews.</p>';
            }
        }

        async function checkExistingReviewModal(profileId, collectionName, userId) {
            try {
                const snap = await db.collection(collectionName).doc(profileId).collection('reviews')
                    .where('reviewerId', '==', userId).get();
                if (!snap.empty) {
                    const doc = snap.docs[0];
                    return { id: doc.id, ...doc.data() };
                }
                return null;
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        async function submitReviewFromModal(profileId, collectionName) {
            const container = document.getElementById('modal-review-form-container');
            const btn = container.querySelector('button');
            const rating = parseInt(btn.dataset.selectedRating) || 0;
            if (rating === 0) {
                document.getElementById('modal-review-status').textContent = 'Please select a rating.';
                return;
            }
            const comment = document.getElementById('modal-review-comment').value.trim();
            if (!comment) {
                document.getElementById('modal-review-status').textContent = 'Please write a comment.';
                return;
            }
            const reviewerName = document.getElementById('modal-reviewer-name').value.trim() || 'Anonymous';
            const existingId = btn.dataset.reviewId || null;
            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                const reviewData = {
                    rating: rating,
                    reviewerName: reviewerName,
                    comment: comment,
                    reviewerId: currentUser.uid,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                if (existingId) {
                    await db.collection(collectionName).doc(profileId).collection('reviews').doc(existingId)
                        .update(reviewData);
                } else {
                    reviewData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection(collectionName).doc(profileId).collection('reviews').add(reviewData);
                }
                // Update profile rating
                await updateProfileRatingModal(profileId, collectionName);
                document.getElementById('modal-review-status').textContent = 'Review saved!';
                // Reload reviews
                loadReviewsForModal(profileId, collectionName);
                // Update the rating summary in the modal header (optional)
                // We'll just close and reopen? Better to refresh the whole modal.
                // For simplicity, we'll reload the modal profile.
                // But we have the item, we can re-fetch and re-render? 
                // Instead, we can just update the rating numbers in the DOM.
                // We'll do a simpler approach: re-fetch the profile and re-render.
                // But that would lose the review form state. Instead, we just reload reviews.
                // Also update the rating stars and count in the header.
                // We'll update the rating summary in the modal by fetching the updated profile.
                const doc = await db.collection(collectionName).doc(profileId).get();
                const data = doc.data();
                const ratingNum = data.rating || 0;
                const reviewsCount = data.reviewsCount || 0;
                const summary = document.querySelector('.profile-modal-body .rating-summary');
                if (summary) {
                    const stars = summary.querySelector('.stars');
                    if (stars) {
                        const full = Math.floor(ratingNum);
                        const half = ratingNum % 1 >= 0.5;
                        let starHtml = '';
                        for (let i = 1; i <= 5; i++) {
                            if (i <= full) starHtml += '<i class="fas fa-star"></i>';
                            else if (i === full + 1 && half) starHtml += '<i class="fas fa-star-half-alt"></i>';
                            else starHtml += '<i class="far fa-star"></i>';
                        }
                        stars.innerHTML = starHtml;
                    }
                    const num = summary.querySelector('.rating-number');
                    if (num) num.textContent = ratingNum.toFixed(1);
                    const count = summary.querySelector('.reviews-count');
                    if (count) count.textContent = `(${reviewsCount} reviews)`;
                }
                btn.disabled = false;
                btn.textContent = existingId ? 'Update Review' : 'Submit Review';
                // Also update the button's dataset.reviewId after saving
                // We can query again to get the id if new
                if (!existingId) {
                    const existing = await checkExistingReviewModal(profileId, collectionName, currentUser.uid);
                    if (existing) btn.dataset.reviewId = existing.id;
                }
            } catch (e) {
                console.error(e);
                document.getElementById('modal-review-status').textContent = 'Error saving review.';
                btn.disabled = false;
                btn.textContent = existingId ? 'Update Review' : 'Submit Review';
            }
        }

        async function updateProfileRatingModal(profileId, collectionName) {
            try {
                const snap = await db.collection(collectionName).doc(profileId).collection('reviews').get();
                let total = 0,
                    count = 0;
                snap.forEach(doc => {
                    const data = doc.data();
                    if (data.rating) {
                        total += data.rating;
                        count++;
                    }
                });
                const avg = count > 0 ? total / count : 0;
                await db.collection(collectionName).doc(profileId).update({
                    rating: avg,
                    reviewsCount: count
                });
            } catch (e) {
                console.error('Error updating rating:', e);
            }
        }

        // ---- Expose new functions globally ----
        window.openVendorProfile = openVendorProfile;
        window.submitReviewFromModal = submitReviewFromModal;
        window.loadReviewsForModal = loadReviewsForModal;

        // Also ensure that closeVendorProfileModal clears any intervals/timeouts if needed.
        // (No changes needed)

        console.log('✅ Discover page with review system integrated.');
    </script>
</body>
</html>
