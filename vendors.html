<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone21 – Service Provider Directory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --navy: #102838;
            --lime: #C0C800;
            --pink: #F80070;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1a1a2e;
            --muted: #6c757d;
            --border: #e0e0e8;
            --radius: 16px;
            --radius-sm: 12px;
            --shadow: 0 8px 30px rgba(16, 40, 56, 0.08);
            --transition: 0.25s;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--navy) 0%, #1a3a4a 100%);
            border-radius: var(--radius);
            padding: 40px 30px;
            margin-bottom: 30px;
            color: white;
            text-align: center;
            box-shadow: 0 15px 40px rgba(16, 40, 56, 0.3);
        }
        .hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; color: var(--lime); }
        .hero p { font-size: 1.1rem; opacity: 0.9; max-width: 700px; margin: 0 auto 25px; }
        .hero-search {
            display: flex;
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 50px;
            padding: 6px 6px 6px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .hero-search i { color: var(--muted); align-self: center; }
        .hero-search input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1rem;
            padding: 12px 10px;
            background: transparent;
            color: var(--navy);
        }
        .hero-search button {
            background: var(--lime);
            color: var(--navy);
            border: none;
            border-radius: 50px;
            padding: 12px 25px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .hero-search button:hover { background: #d0d800; }

        /* Browse by Service */
        .services-cloud {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 25px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .services-cloud h3 {
            color: var(--navy);
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .services-cloud h3 i { color: var(--pink); }
        .services-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .service-chip {
            background: #f0f4f8;
            color: var(--navy);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .service-chip:hover, .service-chip.active {
            background: var(--navy);
            color: var(--lime);
            border-color: var(--navy);
        }

        /* Filter Bar */
        .filter-bar {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 20px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: end;
        }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
        .filter-group select, .filter-group input { padding: 9px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 0.85rem; background: white; min-width: 150px; outline: none; transition: border 0.2s; }
        .filter-group select:focus, .filter-group input:focus { border-color: var(--lime); }
        .filter-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn { padding: 10px 20px; border-radius: 30px; font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; transition: var(--transition); display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
        .btn-primary { background: var(--navy); color: var(--lime); }
        .btn-primary:hover { background: #1a3a4a; transform: translateY(-2px); }
        .btn-lime { background: var(--lime); color: var(--navy); }
        .btn-lime:hover { background: #d0d800; }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--navy); }
        .btn-outline:hover { background: #f0f0f0; }

        /* Providers Grid */
        .providers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .provider-card {
            background: var(--card);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            padding: 20px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            border: 1px solid transparent;
            animation: fadeIn 0.4s ease forwards;
        }
        .provider-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 45px rgba(16, 40, 56, 0.15);
            border-color: var(--lime);
        }
        .provider-card .top { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 15px; }
        .provider-card .avatar {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: var(--navy);
            color: var(--lime);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .provider-card .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .provider-card .info { flex: 1; }
        .provider-card .name { font-weight: 700; font-size: 1.15rem; color: var(--navy); margin-bottom: 3px; }
        .provider-card .category { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
        .provider-card .rating { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: #ffb400; margin-top: 5px; }
        .provider-card .rating span { color: var(--muted); font-size: 0.75rem; margin-left: 2px; }

        .provider-card .service-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .provider-card .service-tags span {
            background: #f0f4f8;
            color: var(--navy);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .provider-card .description {
            font-size: 0.88rem;
            color: var(--text);
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .provider-card .details {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 600;
        }
        .provider-card .details span { display: flex; align-items: center; gap: 5px; }
        .provider-card .actions {
            margin-top: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            grid-column: 1/-1;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            grid-column: 1/-1;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .hero { padding: 30px 15px; }
            .hero h1 { font-size: 1.8rem; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .providers-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hero Section -->
        <div class="hero">
            <h1><i class="fas fa-concierge-bell" style="color:var(--lime);"></i> Zone21 Service Directory</h1>
            <p>Discover trusted event vendors, from planning and décor to security and entertainment. All in one place.</p>
            <div class="hero-search">
                <i class="fas fa-search"></i>
                <input type="text" id="hero-search-input" placeholder="Search by name, category, or tag..." oninput="applyFilters()">
                <button onclick="document.getElementById('hero-search-input').focus()">Search</button>
            </div>
        </div>

        <!-- Browse by Service (All services from vendorprofile + official) -->
        <div class="services-cloud">
            <h3><i class="fas fa-th-large"></i> Browse by Service</h3>
            <div class="services-scroll" id="services-scroll"></div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <label>Category</label>
                <select id="category-filter">
                    <option value="all">All Categories</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Location</label>
                <select id="location-filter">
                    <option value="all">All Locations</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Max Base Price</label>
                <select id="price-filter">
                    <option value="all">Any Price</option>
                    <option value="100">Under $100</option>
                    <option value="300">Under $300</option>
                    <option value="500">Under $500</option>
                    <option value="1000">Under $1000</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Min Rating</label>
                <select id="rating-filter">
                    <option value="0">Any Rating</option>
                    <option value="4">4.0+ Stars</option>
                    <option value="4.5">4.5+ Stars</option>
                </select>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="applyFilters()"><i class="fas fa-filter"></i> Apply</button>
                <button class="btn btn-outline" onclick="resetFilters()"><i class="fas fa-undo"></i> Reset</button>
            </div>
        </div>

        <!-- Providers Grid -->
        <div id="providers-grid" class="providers-grid">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading all service providers...</div>
        </div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-search" style="font-size:3rem; margin-bottom:15px; color:var(--border);"></i>
            <h3>No providers found</h3>
            <p style="margin-top:5px;">Try adjusting your filters or search terms.</p>
        </div>
    </div>

    <script>
        // ========== FIREBASE CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ========== STATE ==========
        let allProviders = [];
        let filteredProviders = [];
        let availableCategories = new Set();
        let availableLocations = new Set();

        // DOM elements
        const grid = document.getElementById('providers-grid');
        const emptyState = document.getElementById('empty-state');
        const categoryFilter = document.getElementById('category-filter');
        const locationFilter = document.getElementById('location-filter');
        const searchInput = document.getElementById('hero-search-input');
        const priceFilter = document.getElementById('price-filter');
        const ratingFilter = document.getElementById('rating-filter');

        // ========== SERVICES LIST (from vendorprofile + official) ==========
        const allServices = [
            "Venue / Space Rental", "Marquee / Tents & Chairs", "PA System & Basic Sound",
            "DJ Services", "Stage & Decorative Lighting", "Event Décor & Draping",
            "Catering (Food & Buffet)", "Beverages & Mobile Bar", "Cake Designer / Baker",
            "Photographer", "Videographer", "MC (Master of Ceremonies)",
            "Makeup Artist", "Hairstylist", "Transport / Car Hire",
            "Cleaning Services", "Ushers & Hostesses",
            "Event Planning", "Event Management", "Zone21 Security",
            "Crowd Control", "VIP Protection"
        ];

        // ========== LIVE DATA LISTENER ==========
        function startListening() {
            db.collection('serviceProviders').onSnapshot(snapshot => {
                allProviders = [];
                availableCategories.clear();
                availableLocations.clear();

                snapshot.forEach(doc => {
                    const data = doc.data();
                    allProviders.push({ id: doc.id, ...data });
                    if (data.category) availableCategories.add(data.category);
                    if (data.location) availableLocations.add(data.location);
                    if (data.services && Array.isArray(data.services)) {
                        data.services.forEach(svc => availableCategories.add(svc));
                    }
                });

                populateFilters();
                applyFilters();
            }, err => {
                console.error('Error fetching providers:', err);
                grid.innerHTML = '<div class="loading" style="color:var(--pink);">Failed to load providers. Check database permissions.</div>';
            });
        }

        // ========== POPULATE FILTERS ==========
        function populateFilters() {
            // Category filter
            const currentCat = categoryFilter.value;
            categoryFilter.innerHTML = '<option value="all">All Categories & Services</option>';
            const sortedCategories = Array.from(availableCategories).sort();
            sortedCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categoryFilter.appendChild(opt);
            });
            categoryFilter.value = currentCat;

            // Location filter
            const currentLoc = locationFilter.value;
            locationFilter.innerHTML = '<option value="all">All Locations</option>';
            const sortedLocations = Array.from(availableLocations).sort();
            sortedLocations.forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc;
                opt.textContent = loc;
                locationFilter.appendChild(opt);
            });
            locationFilter.value = currentLoc;

            // Populate service chips
            const servicesScroll = document.getElementById('services-scroll');
            servicesScroll.innerHTML = '';
            allServices.forEach(service => {
                const chip = document.createElement('span');
                chip.className = 'service-chip';
                chip.textContent = service;
                chip.addEventListener('click', () => {
                    document.querySelectorAll('.service-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    categoryFilter.value = service;
                    applyFilters();
                });
                servicesScroll.appendChild(chip);
            });
        }

        // ========== APPLY FILTERS ==========
        function applyFilters() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            const selectedCategory = categoryFilter.value;
            const selectedLocation = locationFilter.value;
            const maxPrice = priceFilter.value;
            const minRating = parseFloat(ratingFilter.value) || 0;

            filteredProviders = allProviders.filter(provider => {
                if (searchTerm) {
                    const searchable = `${provider.name || ''} ${provider.category || ''} ${provider.description || ''} ${(provider.services || []).join(' ')}`.toLowerCase();
                    if (!searchable.includes(searchTerm)) return false;
                }
                if (selectedCategory !== 'all') {
                    const matchesCategory = provider.category === selectedCategory;
                    const matchesService = provider.services && provider.services.includes(selectedCategory);
                    if (!matchesCategory && !matchesService) return false;
                }
                if (selectedLocation !== 'all' && provider.location !== selectedLocation) return false;
                if (maxPrice !== 'all' && (provider.basePrice || 0) > parseInt(maxPrice)) return false;
                if (minRating > 0 && (provider.rating || 0) < minRating) return false;
                return true;
            });

            renderProviders();
        }

        function resetFilters() {
            searchInput.value = '';
            categoryFilter.value = 'all';
            locationFilter.value = 'all';
            priceFilter.value = 'all';
            ratingFilter.value = '0';
            document.querySelectorAll('.service-chip').forEach(c => c.classList.remove('active'));
            applyFilters();
        }

        // ========== RENDER PROVIDERS ==========
        function renderProviders() {
            if (filteredProviders.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';
            grid.innerHTML = '';

            filteredProviders.forEach(provider => {
                const card = document.createElement('div');
                card.className = 'provider-card';

                const initials = (provider.name || '?').split(' ').map(word => word.charAt(0)).join('').substring(0, 2).toUpperCase();
                const avatarHtml = provider.avatar ? `<img src="${provider.avatar}" alt="Avatar">` : initials;

                const ratingNum = provider.rating || 0;
                const reviewsCount = provider.reviewsCount || 0;
                const ratingStars = ratingNum > 0 ?
                    `<span class="rating"><i class="fas fa-star"></i> ${ratingNum.toFixed(1)} <span>(${reviewsCount})</span></span>` :
                    '<span class="rating" style="color:var(--muted);"><i class="far fa-star"></i> New</span>';

                let tagsHtml = '';
                if (provider.services && provider.services.length > 0) {
                    const displayTags = provider.services.slice(0, 3);
                    tagsHtml = displayTags.map(tag => `<span>${tag}</span>`).join('');
                    if (provider.services.length > 3) tagsHtml += `<span>+${provider.services.length - 3} more</span>`;
                }

                const waLink = provider.phone ? `https://wa.me/${provider.phone.replace(/[^0-9]/g, '')}` : '#';

                card.innerHTML = `
                    <div class="top">
                        <div class="avatar">${avatarHtml}</div>
                        <div class="info">
                            <div class="name">${provider.name || 'Unnamed Business'}</div>
                            <div class="category">${provider.category || 'Service Provider'}</div>
                            ${ratingStars}
                        </div>
                    </div>
                    ${tagsHtml ? `<div class="service-tags">${tagsHtml}</div>` : ''}
                    <div class="description">${provider.description || 'No description provided by this vendor.'}</div>
                    <div class="details">
                        <span style="color:var(--pink);"><i class="fas fa-map-marker-alt"></i> ${provider.location || 'Location Not Set'}</span>
                        <span style="color:var(--lime);"><i class="fas fa-tag"></i> Starts at $${provider.basePrice || 0}</span>
                    </div>
                    <div class="actions">
                        <a href="vendorprofile.html?id=${provider.id}" class="btn btn-primary"><i class="fas fa-eye"></i> View Profile</a>
                        ${provider.phone ? `<a href="${waLink}" target="_blank" class="btn btn-outline" style="background:#25D366; color:white; border:none;"><i class="fab fa-whatsapp"></i> Chat</a>` : `<button class="btn btn-outline" disabled style="opacity:0.5;">No Contact</button>`}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ========== EVENT LISTENERS ==========
        searchInput.addEventListener('input', applyFilters);
        categoryFilter.addEventListener('change', applyFilters);
        locationFilter.addEventListener('change', applyFilters);
        priceFilter.addEventListener('change', applyFilters);
        ratingFilter.addEventListener('change', applyFilters);

        // ========== INIT ==========
        startListening();
    </script>
</body>
</html>
