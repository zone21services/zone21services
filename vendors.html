<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Zone21 · Organiser Directory</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>

    <style>
        /* ============================================================
                   ROOT · ZONE21 CORPORATE
                   ============================================================ */
        :root {
            --navy: #0A1F2E;
            --navy-light: #1A3A4E;
            --navy-dark: #071520;
            --lime: #C0C800;
            --lime-bright: #D4DD00;
            --lime-soft: rgba(192, 200, 0, 0.10);
            --lime-glow: rgba(192, 200, 0, 0.20);
            --pink: #F80070;
            --pink-soft: rgba(248, 0, 112, 0.08);
            --pink-glow: rgba(248, 0, 112, 0.15);
            --bg-page: #F4F6FA;
            --bg-surface: #FFFFFF;
            --bg-input: #F0F2F6;
            --text-primary: #0A1F2E;
            --text-secondary: #4A5A6A;
            --text-muted: #7A8A9A;
            --border-light: #E6EAF0;
            --border-strong: #C5D0D8;
            --shadow-sm: 0 2px 8px rgba(10, 31, 46, 0.04);
            --shadow-md: 0 8px 32px rgba(10, 31, 46, 0.07);
            --shadow-lg: 0 16px 56px rgba(10, 31, 46, 0.10);
            --shadow-xl: 0 24px 72px rgba(10, 31, 46, 0.14);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 9999px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* ============================================================
                   RESET & BASE
                   ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-page);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--lime);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--lime-bright);
        }

        /* ============================================================
                   ANIMATIONS
                   ============================================================ */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-in {
            animation: fadeUp 0.5s ease forwards;
        }

        /* ============================================================
                   LAYOUT
                   ============================================================ */
        .app-wrapper {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 24px 32px;
            min-height: 100vh;
        }

        /* ============================================================
                   HEADER
                   ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px 24px;
            background: var(--bg-surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            margin-bottom: 24px;
            transition: var(--transition);
        }
        .header:hover {
            box-shadow: var(--shadow-md);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-brand .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, var(--navy), var(--navy-light));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--lime);
            font-size: 1.4rem;
            box-shadow: 0 4px 12px rgba(10, 31, 46, 0.18);
        }
        .header-brand h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--navy);
            letter-spacing: -0.03em;
        }
        .header-brand h1 span {
            color: var(--lime);
        }
        .header-brand .sub {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            display: block;
            margin-top: -2px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* ============================================================
                   BUTTONS
                   ============================================================ */
        .btn {
            padding: 10px 22px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-family: var(--font);
            letter-spacing: 0.01em;
            white-space: nowrap;
        }
        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--navy);
            color: var(--lime);
        }
        .btn-primary:hover {
            background: var(--navy-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(10, 31, 46, 0.20);
        }

        .btn-lime {
            background: var(--lime);
            color: var(--navy);
        }
        .btn-lime:hover {
            background: var(--lime-bright);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(192, 200, 0, 0.30);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border-light);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            background: var(--bg-page);
            border-color: var(--navy);
            color: var(--navy);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
        }
        .btn-ghost:hover {
            color: var(--navy);
            background: rgba(10, 31, 46, 0.04);
        }

        .btn-pink {
            background: var(--pink);
            color: #fff;
        }
        .btn-pink:hover {
            background: #e00066;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(248, 0, 112, 0.30);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.72rem;
            border-radius: var(--radius-full);
        }

        /* ============================================================
                   FILTER BAR
                   ============================================================ */
        .filter-bar {
            background: var(--bg-surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 18px 22px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px 18px;
            align-items: center;
            border: 1px solid var(--border-light);
            transition: var(--transition);
        }
        .filter-bar:hover {
            box-shadow: var(--shadow-md);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .filter-group label {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .filter-group select,
        .filter-group input {
            padding: 8px 14px;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-full);
            font-size: 0.82rem;
            background: var(--bg-input);
            min-width: 130px;
            outline: none;
            transition: var(--transition);
            font-weight: 500;
            color: var(--text-primary);
            font-family: var(--font);
            cursor: pointer;
        }
        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--lime);
            box-shadow: 0 0 0 4px var(--lime-soft);
            background: #fff;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-full);
            padding: 8px 18px;
            gap: 10px;
            transition: var(--transition);
        }
        .search-box:focus-within {
            border-color: var(--lime);
            box-shadow: 0 0 0 4px var(--lime-soft);
            background: #fff;
        }
        .search-box i {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .search-box input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 0.85rem;
            background: transparent;
            font-weight: 500;
            color: var(--text-primary);
            font-family: var(--font);
        }
        .search-box input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .filter-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-stats {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            padding: 0 4px;
        }
        .filter-stats strong {
            color: var(--text-primary);
        }

        /* ============================================================
                   PROVIDERS GRID
                   ============================================================ */
        .providers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* ============================================================
                   PROVIDER CARD
                   ============================================================ */
        .provider-card {
            background: var(--bg-surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 20px 20px 18px;
            transition: var(--transition);
            border: 1px solid var(--border-light);
            animation: fadeUp 0.5s ease forwards;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .provider-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: var(--lime);
        }
        .provider-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius);
            border: 2px solid transparent;
            pointer-events: none;
            transition: var(--transition);
        }
        .provider-card:hover::before {
            border-color: var(--lime);
        }

        .provider-card .card-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 12px;
        }

        .provider-card .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--navy), var(--navy-light));
            color: var(--lime);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            flex-shrink: 0;
            overflow: hidden;
            border: 3px solid var(--lime);
            box-shadow: 0 4px 12px rgba(192, 200, 0, 0.12);
            position: relative;
        }
        .provider-card .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .provider-card .avatar .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: #22C55E;
            border-radius: 50%;
            border: 2.5px solid #fff;
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
        }

        .provider-card .card-info {
            flex: 1;
            min-width: 0;
        }
        .provider-card .name {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--navy);
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .provider-card .name .verified {
            color: var(--lime);
            font-size: 0.7rem;
        }
        .provider-card .category-badge {
            font-size: 0.62rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            background: var(--bg-input);
            padding: 2px 12px;
            border-radius: var(--radius-full);
            display: inline-block;
            margin-top: 3px;
        }

        .provider-card .rating-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .provider-card .rating-row .stars {
            color: #FBBF24;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .provider-card .rating-row .stars .empty {
            color: var(--border-light);
        }
        .provider-card .rating-row .rating-num {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        .provider-card .rating-row .review-count {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .provider-card .service-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 10px 0 8px;
        }
        .provider-card .service-tags span {
            background: var(--bg-input);
            color: var(--text-secondary);
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 0.62rem;
            font-weight: 600;
            border: 1px solid var(--border-light);
        }
        .provider-card .service-tags span.more {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-weight: 500;
        }

        .provider-card .description {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .provider-card .details-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border-light);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .provider-card .details-row span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .provider-card .details-row .loc {
            color: var(--navy);
        }
        .provider-card .details-row .price {
            color: var(--pink);
            font-weight: 700;
        }

        .provider-card .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: auto;
        }
        .provider-card .card-actions .btn {
            justify-content: center;
            padding: 8px 10px;
            font-size: 0.72rem;
        }
        .provider-card .card-actions .btn-message {
            background: var(--lime);
            color: var(--navy);
        }
        .provider-card .card-actions .btn-message:hover {
            background: var(--lime-bright);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(192, 200, 0, 0.30);
        }

        /* ============================================================
                   EMPTY / LOADING
                   ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: var(--bg-surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            grid-column: 1 / -1;
            border: 1px solid var(--border-light);
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--border-strong);
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .empty-state p {
            color: var(--text-secondary);
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .loading-state .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-light);
            border-top-color: var(--lime);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        .loading-state p {
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ============================================================
                   CHAT MODAL
                   ============================================================ */
        .chat-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 31, 46, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeInOverlay 0.3s ease;
        }
        .chat-modal-overlay.active {
            display: flex;
        }
        @keyframes fadeInOverlay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .chat-modal {
            background: var(--bg-surface);
            border-radius: var(--radius);
            max-width: 640px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
            border: 1px solid var(--border-light);
        }

        .chat-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-surface);
            flex-shrink: 0;
        }
        .chat-modal-header .chat-recipient {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-modal-header .chat-recipient .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--navy), var(--navy-light));
            color: var(--lime);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            overflow: hidden;
        }
        .chat-modal-header .chat-recipient .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .chat-modal-header .chat-recipient .info h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--navy);
        }
        .chat-modal-header .chat-recipient .info span {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .chat-modal-header .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--bg-input);
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-modal-header .close-btn:hover {
            background: var(--pink-soft);
            color: var(--pink);
        }

        .chat-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 18px 22px;
            background: var(--bg-page);
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 200px;
            max-height: 400px;
        }
        .chat-modal-body .empty-chat {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: 0.9rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .chat-modal-body .empty-chat i {
            font-size: 2.4rem;
            color: var(--border-strong);
            margin-bottom: 12px;
        }

        .chat-message {
            max-width: 78%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeUp 0.25s ease;
        }
        .chat-message.in {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }
        .chat-message.out {
            background: var(--navy);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: var(--shadow-sm);
        }
        .chat-message .time {
            font-size: 0.55rem;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }
        .chat-message.in .time {
            color: var(--text-muted);
        }
        .chat-message.out .time {
            color: rgba(255, 255, 255, 0.7);
        }

        .chat-modal-footer {
            padding: 12px 18px 14px;
            border-top: 1px solid var(--border-light);
            background: var(--bg-surface);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-modal-footer input {
            flex: 1;
            padding: 10px 18px;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-family: var(--font);
            outline: none;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: var(--transition);
        }
        .chat-modal-footer input:focus {
            border-color: var(--lime);
            box-shadow: 0 0 0 4px var(--lime-soft);
            background: #fff;
        }
        .chat-modal-footer input::placeholder {
            color: var(--text-muted);
        }
        .chat-modal-footer .btn-send {
            background: var(--navy);
            color: var(--lime);
            border: none;
            padding: 10px 22px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .chat-modal-footer .btn-send:hover {
            background: var(--navy-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(10, 31, 46, 0.20);
        }
        .chat-modal-footer .btn-send:active {
            transform: scale(0.96);
        }

        /* ============================================================
                   TOAST
                   ============================================================ */
        #toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .toast.success {
            background: var(--lime);
            color: var(--navy);
        }
        .toast.error {
            background: var(--pink);
        }
        .toast.info {
            background: var(--navy);
        }
        .toast i {
            font-size: 1.1rem;
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 992px) {
            .providers-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            }
            .provider-card .card-actions {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .app-wrapper {
                padding: 12px 14px 20px;
            }
            .header {
                padding: 14px 18px;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-brand h1 {
                font-size: 1.2rem;
            }
            .header-actions {
                justify-content: flex-start;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 16px;
                gap: 12px;
            }
            .search-box {
                width: 100%;
            }
            .filter-group select,
            .filter-group input {
                min-width: 100%;
                width: 100%;
            }
            .filter-actions {
                justify-content: stretch;
            }
            .filter-actions .btn {
                flex: 1;
                justify-content: center;
            }
            .providers-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .provider-card {
                padding: 16px;
            }
            .provider-card .card-actions {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .chat-modal {
                max-width: 100%;
                max-height: 95vh;
                border-radius: var(--radius-sm);
            }
            .chat-modal-body {
                max-height: 300px;
                padding: 14px 16px;
            }
            .chat-modal-header {
                padding: 12px 16px;
            }
            .chat-modal-footer {
                padding: 10px 14px 12px;
            }
            #toast-container {
                bottom: 16px;
                right: 16px;
                max-width: calc(100% - 32px);
            }
            .toast {
                font-size: 0.78rem;
                padding: 12px 16px;
            }
        }

        @media (max-width: 480px) {
            .header-brand .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }
            .header-brand h1 {
                font-size: 1rem;
            }
            .btn {
                font-size: 0.7rem;
                padding: 6px 12px;
            }
            .provider-card .card-actions {
                grid-template-columns: 1fr 1fr;
            }
            .provider-card .card-actions .btn {
                font-size: 0.65rem;
                padding: 6px 8px;
            }
            .filter-stats {
                font-size: 0.65rem;
            }
        }

        /* ============================================================
                   UTILITY
                   ============================================================ */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ===== TOAST CONTAINER ===== -->
    <div id="toast-container"></div>

    <!-- ===== CHAT MODAL ===== -->
    <div class="chat-modal-overlay" id="chatModal">
        <div class="chat-modal">
            <div class="chat-modal-header">
                <div class="chat-recipient">
                    <div class="avatar" id="modalChatAvatar">
                        <span id="modalChatInitials">?</span>
                    </div>
                    <div class="info">
                        <h4 id="modalChatName">Provider</h4>
                        <span id="modalChatSub">Service Provider</span>
                    </div>
                </div>
                <button class="close-btn" onclick="closeChatModal()">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            <div class="chat-modal-body" id="modalChatMessages">
                <div class="empty-chat">
                    <i class="fa-regular fa-comment-dots"></i>
                    <p>No messages yet.<br />Start the conversation!</p>
                </div>
            </div>
            <div class="chat-modal-footer">
                <input type="text" id="modalChatInput" placeholder="Type a message…" onkeydown="if(event.key==='Enter') sendModalMessage()" />
                <button class="btn-send" onclick="sendModalMessage()">
                    Send <i class="fa-solid fa-paper-plane" style="font-size:0.6rem;"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div class="app-wrapper">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-brand">
                <div class="logo-icon"><i class="fas fa-crown"></i></div>
                <div>
                    <h1>Zone<span>21</span></h1>
                    <span class="sub">Organiser · Service Directory</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline btn-sm" onclick="resetFilters()">
                    <i class="fas fa-undo"></i> Reset
                </button>
                <button class="btn btn-primary btn-sm" onclick="window.location.reload()">
                    <i class="fas fa-sync"></i> Refresh
                </button>
                <a href="organiseinbox.html" class="btn btn-lime btn-sm">
                    <i class="fas fa-inbox"></i> Inbox
                </a>
            </div>
        </header>

        <!-- ===== FILTER BAR ===== -->
        <div class="filter-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search providers, services, tags…" oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <label>Category</label>
                <select id="categoryFilter" onchange="applyFilters()">
                    <option value="all">All Categories</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Location</label>
                <select id="locationFilter" onchange="applyFilters()">
                    <option value="all">All Locations</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Max Price</label>
                <select id="priceFilter" onchange="applyFilters()">
                    <option value="all">Any Price</option>
                    <option value="100">Under $100</option>
                    <option value="300">Under $300</option>
                    <option value="500">Under $500</option>
                    <option value="1000">Under $1000</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Min Rating</label>
                <select id="ratingFilter" onchange="applyFilters()">
                    <option value="0">Any Rating</option>
                    <option value="4">4.0+ ★</option>
                    <option value="4.5">4.5+ ★</option>
                </select>
            </div>
            <div class="filter-actions">
                <span class="filter-stats" id="filterStats"><strong>0</strong> providers</span>
                <button class="btn btn-primary btn-sm" onclick="applyFilters()">
                    <i class="fas fa-filter"></i> Apply
                </button>
            </div>
        </div>

        <!-- ===== PROVIDERS GRID ===== -->
        <div id="providersGrid" class="providers-grid">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading service providers…</p>
            </div>
        </div>

        <!-- ===== EMPTY STATE (hidden by default) ===== -->
        <div id="emptyState" class="empty-state" style="display:none;">
            <i class="fas fa-search"></i>
            <h3>No providers found</h3>
            <p>Try adjusting your filters or search terms.</p>
        </div>

    </div>

    <script>
        // ============================================================
        //  FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
            authDomain: "zone21.firebaseapp.com",
            projectId: "zone21",
            storageBucket: "zone21.firebasestorage.app",
            messagingSenderId: "405963057292",
            appId: "1:405963057292:web:80e9923ae84eb7029073a9",
            measurementId: "G-KE007Y89F1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        //  ALL SERVICES (static reference)
        // ============================================================
        const ALL_SERVICES = [
            'Venue / Space Rental',
            'Marquee / Tents & Chairs',
            'PA System & Basic Sound',
            'DJ Services',
            'Stage & Decorative Lighting',
            'Event Décor & Draping',
            'Catering (Food & Buffet)',
            'Beverages & Mobile Bar',
            'Cake Designer / Baker',
            'Photographer',
            'Videographer',
            'MC (Master of Ceremonies)',
            'Makeup Artist',
            'Hairstylist',
            'Transport / Car Hire',
            'Cleaning Services',
            'Ushers & Hostesses'
        ];

        // ============================================================
        //  STATE
        // ============================================================
        let allProviders = [];
        let filteredProviders = [];
        let availableCategories = new Set();
        let availableLocations = new Set();
        let currentUser = null;

        // Chat modal state
        let chatThreadId = null;
        let chatOtherUid = null;
        let chatOtherName = '';
        let chatOtherAvatar = null;
        let chatUnsubscribe = null;

        // DOM refs
        const grid = document.getElementById('providersGrid');
        const emptyState = document.getElementById('emptyState');
        const filterStats = document.getElementById('filterStats');
        const categoryFilter = document.getElementById('categoryFilter');
        const locationFilter = document.getElementById('locationFilter');
        const searchInput = document.getElementById('searchInput');
        const priceFilter = document.getElementById('priceFilter');
        const ratingFilter = document.getElementById('ratingFilter');

        // ============================================================
        //  AUTH
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const docRef = db.collection('users').doc(user.uid);
                const docSnap = await docRef.get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    if (data.role !== 'organiser') {
                        // Redirect if not organiser
                        if (data.role === 'serviceProvider') {
                            window.location.href = 'service-provider-inbox.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                        return;
                    }
                    currentUser = {
                        uid: user.uid,
                        name: data.name || user.email.split('@')[0],
                        email: user.email,
                        avatarUrl: data.avatarUrl || null,
                        role: 'organiser'
                    };
                } else {
                    currentUser = {
                        uid: user.uid,
                        name: user.email.split('@')[0],
                        email: user.email,
                        avatarUrl: null,
                        role: 'organiser'
                    };
                }
                // Start listening for providers
                startListening();
            } else {
                // Redirect to login
                window.location.href = 'index.html';
            }
        });

        // ============================================================
        //  TOAST SYSTEM
        // ============================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'error' ? 'circle-exclamation' :
                type === 'info' ? 'circle-notch fa-spin' : 'check-circle';
            toast.innerHTML = `<i class="fa-solid fa-${icon}"></i> ${message}`;
            container.appendChild(toast);
            if (type !== 'info') {
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3800);
            }
            return toast;
        }

        // ============================================================
        //  FIREBASE LISTENER – Providers
        // ============================================================
        function startListening() {
            db.collection('serviceProviders').onSnapshot(snapshot => {
                allProviders = [];
                availableCategories.clear();
                availableLocations.clear();

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const provider = { id: doc.id, ...data };
                    allProviders.push(provider);

                    if (data.category) availableCategories.add(data.category);
                    if (data.location) availableLocations.add(data.location);
                    if (data.services && Array.isArray(data.services)) {
                        data.services.forEach(svc => availableCategories.add(svc));
                    }
                });

                populateFilters();
                applyFilters();
            }, err => {
                console.error('Error fetching providers:', err);
                grid.innerHTML = `
                            <div class="empty-state" style="color:var(--pink);">
                                <i class="fas fa-exclamation-triangle" style="color:var(--pink);"></i>
                                <h3>Failed to load providers</h3>
                                <p>Check database permissions or network.</p>
                            </div>
                        `;
            });
        }

        // ============================================================
        //  POPULATE FILTERS
        // ============================================================
        function populateFilters() {
            // Category
            const currentCat = categoryFilter.value;
            categoryFilter.innerHTML = '<option value="all">All Categories</option>';
            const combined = new Set([...availableCategories, ...ALL_SERVICES]);
            Array.from(combined).sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categoryFilter.appendChild(opt);
            });
            if (Array.from(categoryFilter.options).some(o => o.value === currentCat)) {
                categoryFilter.value = currentCat;
            } else {
                categoryFilter.value = 'all';
            }

            // Location
            const currentLoc = locationFilter.value;
            locationFilter.innerHTML = '<option value="all">All Locations</option>';
            Array.from(availableLocations).sort().forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc;
                opt.textContent = loc;
                locationFilter.appendChild(opt);
            });
            if (Array.from(locationFilter.options).some(o => o.value === currentLoc)) {
                locationFilter.value = currentLoc;
            } else {
                locationFilter.value = 'all';
            }
        }

        // ============================================================
        //  FILTER LOGIC
        // ============================================================
        function applyFilters() {
            const term = searchInput.value.trim().toLowerCase();
            const selectedCategory = categoryFilter.value;
            const selectedLocation = locationFilter.value;
            const maxPrice = priceFilter.value;
            const minRating = parseFloat(ratingFilter.value) || 0;

            filteredProviders = allProviders.filter(p => {
                if (term) {
                    const searchable =
                        `${p.name||''} ${p.category||''} ${p.description||''} ${(p.services||[]).join(' ')}`
                        .toLowerCase();
                    if (!searchable.includes(term)) return false;
                }
                if (selectedCategory !== 'all') {
                    const matchCat = p.category === selectedCategory;
                    const matchSvc = p.services && p.services.includes(selectedCategory);
                    if (!matchCat && !matchSvc) return false;
                }
                if (selectedLocation !== 'all' && p.location !== selectedLocation) return false;
                if (maxPrice !== 'all' && (p.basePrice || 0) > parseInt(maxPrice)) return false;
                if (minRating > 0 && (p.rating || 0) < minRating) return false;
                return true;
            });

            renderProviders();
        }

        function resetFilters() {
            searchInput.value = '';
            categoryFilter.value = 'all';
            locationFilter.value = 'all';
            priceFilter.value = 'all';
            ratingFilter.value = '0';
            applyFilters();
        }

        // ============================================================
        //  RENDER PROVIDERS
        // ============================================================
        function renderProviders() {
            filterStats.innerHTML = `<strong>${filteredProviders.length}</strong> providers`;

            if (filteredProviders.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';
            grid.innerHTML = '';

            filteredProviders.forEach((provider, index) => {
                const card = document.createElement('div');
                card.className = 'provider-card animate-in';
                card.style.animationDelay = `${(index % 12) * 0.04}s`;

                const initials = (provider.name || '?')
                    .split(' ')
                    .map(w => w.charAt(0))
                    .join('')
                    .substring(0, 2)
                    .toUpperCase();

                const avatarHtml = provider.avatar ?
                    `<img src="${provider.avatar}" alt="Avatar">` :
                    initials;
                const onlineDot = provider.isOnline !== false ?
                    '<div class="online-dot"></div>' : '';

                const ratingNum = provider.rating || 0;
                const reviewsCount = provider.reviewsCount || 0;
                const fullStars = Math.floor(ratingNum);
                const hasHalf = ratingNum % 1 >= 0.5;
                let starHtml = '';
                for (let i = 0; i < 5; i++) {
                    if (i < fullStars) starHtml += '★';
                    else if (i === fullStars && hasHalf) starHtml += '★';
                    else starHtml += '<span class="empty">☆</span>';
                }
                const ratingDisplay = ratingNum > 0 ?
                    `<span class="stars">${starHtml}</span>
                             <span class="rating-num">${ratingNum.toFixed(1)}</span>
                             <span class="review-count">(${reviewsCount})</span>` :
                    `<span class="stars"><span class="empty">☆☆☆☆☆</span></span>
                             <span class="review-count" style="color:var(--text-muted);">New</span>`;

                let tagsHtml = '';
                if (provider.services && provider.services.length > 0) {
                    const displayTags = provider.services.slice(0, 3);
                    tagsHtml = displayTags.map(tag => `<span>${tag}</span>`).join('');
                    if (provider.services.length > 3) {
                        tagsHtml += `<span class="more">+${provider.services.length - 3} more</span>`;
                    }
                }

                const verifiedBadge = provider.verified ?
                    `<span class="verified" title="Verified Provider"><i class="fas fa-check-circle"></i></span>` :
                    '';

                card.innerHTML = `
                            <div class="card-top">
                                <div class="avatar">
                                    ${avatarHtml}
                                    ${onlineDot}
                                </div>
                                <div class="card-info">
                                    <div class="name">
                                        ${provider.name || 'Unnamed Business'}
                                        ${verifiedBadge}
                                    </div>
                                    <div class="category-badge">${provider.category || 'Service Provider'}</div>
                                    <div class="rating-row">${ratingDisplay}</div>
                                </div>
                            </div>
                            ${tagsHtml ? `<div class="service-tags">${tagsHtml}</div>` : ''}
                            <div class="description">${provider.description || 'No description provided.'}</div>
                            <div class="details-row">
                                <span class="loc"><i class="fas fa-map-pin"></i> ${provider.location || 'Location not set'}</span>
                                <span class="price"><i class="fas fa-tag"></i> $${provider.basePrice || 0}</span>
                            </div>
                            <div class="card-actions">
                                <a href="vendorprofile.html?id=${provider.id}" class="btn btn-primary btn-sm">
                                    <i class="fas fa-eye"></i> Profile
                                </a>
                                <button class="btn btn-message btn-sm" onclick="openChatForProvider('${provider.id}')">
                                    <i class="fas fa-paper-plane"></i> Message
                                </button>
                                ${provider.phone ?
                                    `<a href="https://wa.me/${provider.phone.replace(/[^0-9]/g,'')}" target="_blank" class="btn btn-outline btn-sm" style="border-color:#25D366;color:#25D366;">
                                        <i class="fab fa-whatsapp"></i> WhatsApp
                                    </a>` :
                                    `<button class="btn btn-outline btn-sm" disabled style="opacity:0.4;cursor:default;">
                                        <i class="fas fa-phone-slash"></i>
                                    </button>`
                                }
                            </div>
                        `;
                grid.appendChild(card);
            });
        }

        // ============================================================
        //  CHAT MODAL
        // ============================================================
        let modalProviderId = null;

        function openChatForProvider(providerId) {
            if (!currentUser) {
                showToast('Please sign in first', 'error');
                return;
            }

            const provider = allProviders.find(p => p.id === providerId);
            if (!provider) {
                showToast('Provider not found', 'error');
                return;
            }

            modalProviderId = providerId;
            chatOtherUid = provider.userId || provider.uid || providerId;
            chatOtherName = provider.name || 'Provider';
            chatOtherAvatar = provider.avatar || null;

            // Set modal header
            document.getElementById('modalChatName').textContent = chatOtherName;
            document.getElementById('modalChatSub').textContent = provider.category || 'Service Provider';

            const avatarEl = document.getElementById('modalChatAvatar');
            const initialsEl = document.getElementById('modalChatInitials');
            const existingImg = avatarEl.querySelector('img');
            if (existingImg) existingImg.remove();

            const initials = chatOtherName.split(' ').map(w => w.charAt(0)).join('').substring(0, 2).toUpperCase() ||
            '?';
            if (chatOtherAvatar) {
                initialsEl.style.display = 'none';
                const img = document.createElement('img');
                img.src = chatOtherAvatar;
                img.alt = chatOtherName;
                img.onerror = function() {
                    this.style.display = 'none';
                    initialsEl.style.display = 'inline';
                    initialsEl.textContent = initials;
                };
                avatarEl.appendChild(img);
            } else {
                initialsEl.style.display = 'inline';
                initialsEl.textContent = initials;
            }

            // Show modal
            document.getElementById('chatModal').classList.add('active');
            document.body.style.overflow = 'hidden';

            // Clear messages
            const msgContainer = document.getElementById('modalChatMessages');
            msgContainer.innerHTML =
                '<div class="empty-chat"><i class="fa-regular fa-comment-dots"></i><p>Loading conversation…</p></div>';

            // Find or create thread
            findOrCreateThread(provider);
        }

        function closeChatModal() {
            document.getElementById('chatModal').classList.remove('active');
            document.body.style.overflow = '';
            if (chatUnsubscribe) {
                chatUnsubscribe();
                chatUnsubscribe = null;
            }
            chatThreadId = null;
            modalProviderId = null;
        }

        async function findOrCreateThread(provider) {
            if (!currentUser) return;

            try {
                // Look for existing thread
                const threadsRef = db.collection('threads');
                const q = threadsRef
                    .where('participants', 'array-contains', currentUser.uid)
                    .where('participants', 'array-contains', chatOtherUid);

                const snap = await q.get();
                let threadId = null;

                if (!snap.empty) {
                    // Use existing thread
                    threadId = snap.docs[0].id;
                    chatThreadId = threadId;
                    subscribeToMessages(threadId);
                } else {
                    // Create new thread
                    const newThread = {
                        participants: [currentUser.uid, chatOtherUid],
                        jobTitle: provider.category || 'Service Provider',
                        lastMessageText: 'Start your conversation',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    const docRef = await threadsRef.add(newThread);
                    threadId = docRef.id;
                    chatThreadId = threadId;
                    subscribeToMessages(threadId);
                }
            } catch (err) {
                console.error('Error finding/creating thread:', err);
                showToast('Failed to start conversation', 'error');
                const msgContainer = document.getElementById('modalChatMessages');
                msgContainer.innerHTML =
                    '<div class="empty-chat"><i class="fas fa-exclamation-circle" style="color:var(--pink);"></i><p>Could not load conversation.</p></div>';
            }
        }

        function subscribeToMessages(threadId) {
            if (chatUnsubscribe) {
                chatUnsubscribe();
                chatUnsubscribe = null;
            }

            const msgContainer = document.getElementById('modalChatMessages');

            chatUnsubscribe = db
                .collection(`threads/${threadId}/messages`)
                .orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    if (snapshot.empty) {
                        msgContainer.innerHTML =
                            '<div class="empty-chat"><i class="fa-regular fa-comment-dots"></i><p>No messages yet.<br />Start the conversation!</p></div>';
                        return;
                    }

                    msgContainer.innerHTML = '';
                    let lastDate = '';
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const msgDate = msg.timestamp ? msg.timestamp.toDate() : new Date();
                        const dateStr = msgDate.toLocaleDateString('en-US', {
                            weekday: 'short',
                            month: 'short',
                            day: 'numeric'
                        });
                        if (dateStr !== lastDate) {
                            const div = document.createElement('div');
                            div.className = 'chat-date-divider';
                            div.style.cssText =
                                'text-align:center;font-size:0.6rem;color:var(--text-muted);padding:6px 0;font-weight:600;letter-spacing:0.03em;';
                            div.textContent = dateStr;
                            msgContainer.appendChild(div);
                            lastDate = dateStr;
                        }

                        const isOut = msg.senderId === currentUser.uid;
                        const bubble = document.createElement('div');
                        bubble.className = `chat-message ${isOut ? 'out' : 'in'}`;

                        let content = '';
                        if (msg.text) {
                            content += msg.text;
                        }
                        if (msg.imageBase64) {
                            content +=
                                `<div style="margin-top:4px;"><img src="${msg.imageBase64}" style="max-width:200px;max-height:160px;border-radius:8px;width:100%;height:auto;object-fit:cover;" /></div>`;
                        }
                        const timeStr = msg.timestamp ?
                            msg.timestamp.toDate().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit',
                                hour12: true }) :
                            '';
                        content += `<div class="time">${timeStr}</div>`;
                        bubble.innerHTML = content;
                        msgContainer.appendChild(bubble);
                    });
                    msgContainer.scrollTop = msgContainer.scrollHeight;
                }, err => {
                    console.error('Message subscription error:', err);
                    msgContainer.innerHTML =
                        '<div class="empty-chat"><i class="fas fa-exclamation-circle" style="color:var(--pink);"></i><p>Error loading messages.</p></div>';
                });
        }

        async function sendModalMessage() {
            const input = document.getElementById('modalChatInput');
            const text = input.value.trim();
            if (!text || !chatThreadId || !currentUser) return;

            input.value = '';

            try {
                await db.collection(`threads/${chatThreadId}/messages`).add({
                    senderId: currentUser.uid,
                    text: text,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Update thread last message
                await db.collection('threads').doc(chatThreadId).update({
                    lastMessageText: text.substring(0, 80),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('Message sent', 'success');
            } catch (err) {
                console.error('Send error:', err);
                showToast('Failed to send message', 'error');
            }
        }

        // Close modal on overlay click
        document.getElementById('chatModal').addEventListener('click', function(e) {
            if (e.target === this) closeChatModal();
        });

        // Close on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (document.getElementById('chatModal').classList.contains('active')) {
                    closeChatModal();
                }
            }
        });

        // ============================================================
        //  EXPOSE FOR INLINE ONCLICK
        // ============================================================
        window.openChatForProvider = openChatForProvider;
        window.closeChatModal = closeChatModal;
        window.sendModalMessage = sendModalMessage;
        window.applyFilters = applyFilters;
        window.resetFilters = resetFilters;

        console.log('✅ Zone21 Organiser Directory loaded');
    </script>
</body>
</html>
