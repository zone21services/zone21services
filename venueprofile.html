<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Venue Profile | Zone21</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<style>
:root{--navy:#102838;--navy-2:#0A1E2C;--lime:#C0C800;--lime-deep:#8A9000;--gold:#C9A961;--gold-deep:#9C7F3F;--pink:#F80070;--bg:#F6F7F9;--card:#fff;--text:#0F172A;--body:#475569;--muted:#7A8899;--border:#E6EAF0;--border-strong:#D3DAE3;--radius:18px;--radius-sm:11px;--shadow-sm:0 1px 3px rgba(10,30,44,.05);--shadow:0 12px 40px rgba(10,30,44,.10);--shadow-lg:0 24px 48px -20px rgba(10,30,44,.20);--success:#0F9D6E;--danger:#D92D20;--amber:#F5B400}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.55;-webkit-font-smoothing:antialiased}
.container{max-width:1000px;margin:0 auto}
.header{text-align:center;margin-bottom:24px;position:relative}
.header .logo{font-family:'Fraunces',Georgia,serif;font-size:1.8rem;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.header .logo span{color:var(--lime-deep);font-style:italic}
.back-btn{position:absolute;left:0;top:0;background:var(--navy);color:#fff;border:none;padding:8px 15px;border-radius:20px;cursor:pointer;text-decoration:none;font-size:.85rem;font-weight:700;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.back-btn:hover{background:var(--lime);color:var(--navy)}

/* Detection bar */
.detect-bar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
@media(max-width:640px){.detect-bar{grid-template-columns:1fr}}
.detect-chip{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);transition:.25s}
.detect-chip.ok{border-color:var(--lime);background:linear-gradient(135deg,#FAFFEC,#fff);box-shadow:0 0 0 3px rgba(192,200,0,.12)}
.detect-chip.err{border-color:var(--danger);background:linear-gradient(135deg,#FEF2F2,#fff);box-shadow:0 0 0 3px rgba(217,45,32,.10)}
.detect-chip .dc-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1rem;background:#F0F4F8;color:var(--muted);flex-shrink:0}
.detect-chip.ok .dc-icon{background:rgba(192,200,0,.15);color:var(--lime-deep)}
.detect-chip.err .dc-icon{background:rgba(217,45,32,.10);color:var(--danger)}
.detect-chip .dc-label{font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.detect-chip .dc-value{font-size:.88rem;font-weight:800;color:var(--navy);line-height:1.2}
.detect-chip.err .dc-value{color:var(--danger)}
.detect-chip .dc-sub{font-size:.68rem;color:var(--muted);font-weight:500;margin-top:2px}
.curr-switch{display:flex;gap:2px;background:#F0F4F8;border:1px solid var(--border);border-radius:999px;padding:3px;flex-shrink:0}
.curr-switch button{border:0;background:transparent;font-family:inherit;font-size:.7rem;font-weight:800;color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.2s}
.curr-switch button.active{background:var(--navy);color:#fff}
.curr-switch button.active[data-curr="ZAR"]{background:#007A4D;color:#FFB612}

/* Cards */
.profile-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px;border:1px solid var(--border);animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.profile-cover{height:160px;background:linear-gradient(135deg,var(--navy) 0%,#1A3A4A 100%)}
.profile-avatar{width:120px;height:120px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:800;color:var(--navy);border:4px solid #fff;margin-top:-60px;margin-left:30px;position:relative;z-index:2;box-shadow:0 4px 15px rgba(0,0,0,.18);overflow:hidden;cursor:pointer}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.avatar-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:.3s;font-size:1.4rem}
.profile-avatar:hover .avatar-overlay{opacity:1}
.profile-info{padding:20px 30px 30px;position:relative}
.edit-toggle-btn{position:absolute;top:18px;right:30px;background:#F0F4F8;color:var(--navy);border:1px solid var(--border);padding:8px 16px;border-radius:20px;font-weight:700;font-size:.78rem;cursor:pointer;transition:.2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.edit-toggle-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.name{font-family:'Fraunces',Georgia,serif;font-size:1.7rem;font-weight:700;color:var(--navy);letter-spacing:-.02em;margin-bottom:4px}
.category{color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;font-weight:700}
.rating-summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.stars{color:var(--amber);font-size:1.2rem;letter-spacing:2px}
.rating-number{font-weight:800;font-size:1.05rem}
.reviews-count{color:var(--muted);font-size:.82rem;font-weight:500}
.services-tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;align-items:center}
.service-tag{background:#F0F4F8;padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:700;color:var(--navy)}
.description{margin:14px 0;line-height:1.65;color:var(--body);font-size:.9rem}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.detail-item{display:flex;align-items:flex-start;gap:10px;padding:12px 15px;background:#F8F9FA;border-radius:10px;font-size:.88rem;border:1px solid transparent;transition:.2s}
.detail-item:hover{background:#E9ECEF;border-color:var(--border)}
.detail-item i{width:20px;text-align:center;font-size:1rem;margin-top:2px;color:var(--gold-deep);flex-shrink:0}
.detail-item .label{font-weight:800;color:var(--navy);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.detail-item .value{color:var(--text);word-break:break-word;font-weight:600}
.social-links{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.social-link{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.05rem;text-decoration:none;transition:.2s}
.social-link:hover{transform:scale(1.1)}
.social-facebook{background:#1877F2}
.social-instagram{background:#E4405F}
.social-tiktok{background:#000}
.social-youtube{background:#FF0000}
.social-website{background:var(--navy)}

/* Pricing tiers */
.tiers-section{margin:18px 0}
.tier-card{background:linear-gradient(135deg,#FAFBFC,#fff);border:1.5px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:10px;position:relative;overflow:hidden;transition:.25s}
.tier-card:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(201,169,97,.15)}
.tier-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),var(--gold-deep))}
.tier-name{font-size:.92rem;font-weight:800;color:var(--navy);letter-spacing:-.01em;margin-bottom:4px}
.tier-desc{font-size:.78rem;color:var(--body);margin-bottom:8px;line-height:1.5}
.tier-price{font-family:'Fraunces',Georgia,serif;font-size:1.35rem;font-weight:700;color:var(--gold-deep);letter-spacing:-.02em}
.tier-price small{font-size:.72rem;color:var(--muted);font-weight:600;font-family:inherit;margin-left:4px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 22px;border-radius:11px;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;transition:.25s;border:1px solid transparent;text-decoration:none;letter-spacing:-.005em;white-space:nowrap}
.btn i{font-size:.85em}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-lime{background:var(--lime);color:var(--navy)}
.btn-lime:hover{background:#D4DC00;transform:translateY(-1px);box-shadow:0 8px 22px -8px rgba(192,200,0,.5)}
.btn-outline{background:#fff;border-color:var(--border-strong);color:var(--navy)}
.btn-outline:hover{background:#F8F9FA;border-color:var(--navy)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#B91C1C;transform:translateY(-1px)}
.btn-sm{padding:6px 14px;font-size:.75rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* Gallery */
.gallery-section{margin:22px 0}
.standard-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.gallery-item{border-radius:12px;overflow:hidden;aspect-ratio:1;background:#E9ECEF;cursor:pointer;transition:.3s;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.05)}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gallery-item:hover img{transform:scale(1.05)}
.delete-img-btn{position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s;font-size:.75rem}
.delete-img-btn:hover{transform:scale(1.1)}

/* Edit form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
.input-group{display:flex;flex-direction:column;gap:6px;min-width:0}
.input-group label{font-size:.72rem;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.input-group label .req{color:var(--danger);font-weight:900}
.input-group .hint{font-size:.68rem;color:var(--muted);font-weight:500}
.input-group input,.input-group textarea,.input-group select{padding:11px 13px;border:1.5px solid var(--border-strong);border-radius:10px;font-size:.88rem;font-family:inherit;background:#F9FAFB;outline:none;transition:.2s;width:100%}
.input-group input:focus,.input-group textarea:focus,.input-group select:focus{border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(16,40,56,.08)}
.input-group input.invalid,.input-group textarea.invalid{border-color:var(--danger);background:#FEF2F2}
.input-group textarea{resize:vertical;min-height:70px}
.full-width{grid-column:1/-1}
.field-error{font-size:.7rem;color:var(--danger);font-weight:700;margin-top:2px;display:none}
.field-error.visible{display:block}

/* Currency prefix */
.price-input-wrap{position:relative}
.price-input-wrap .cur-prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted);font-size:.9rem;pointer-events:none}
.price-input-wrap input{padding-left:32px}

/* Tier builder */
.tier-builder{background:#F8FAFC;border:1.5px dashed var(--border-strong);border-radius:12px;padding:14px;margin-bottom:12px}
.tier-builder-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.tier-builder-head strong{font-size:.82rem;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.05em}
.tier-builder-row{display:grid;grid-template-columns:1fr 2fr 1fr auto;gap:8px;margin-bottom:8px;align-items:start}
@media(max-width:640px){.tier-builder-row{grid-template-columns:1fr}}
.tier-builder-row input,.tier-builder-row textarea{padding:9px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:.82rem;font-family:inherit;background:#fff;outline:none}
.tier-builder-row input:focus,.tier-builder-row textarea:focus{border-color:var(--navy)}
.tier-builder-row .tier-price-wrap{position:relative}
.tier-builder-row .tier-price-wrap .cur-prefix{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted);font-size:.82rem;pointer-events:none}
.tier-builder-row .tier-price-wrap input{padding-left:28px}
.btn-remove-tier{background:rgba(217,45,32,.10);color:var(--danger);border:none;border-radius:8px;padding:9px 12px;cursor:pointer;font-size:.85rem;font-weight:700;transition:.2s}
.btn-remove-tier:hover{background:var(--danger);color:#fff}

/* Amenities */
.amenities-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.amenity-checkbox{display:flex;align-items:center;gap:6px;background:#F0F4F8;padding:8px 14px;border-radius:20px;font-size:.8rem;font-weight:700;color:var(--navy);cursor:pointer;transition:.2s;border:1.5px solid transparent}
.amenity-checkbox:hover{background:#E0E8F0}
.amenity-checkbox.checked{background:rgba(192,200,0,.14);border-color:rgba(192,200,0,.5)}
.amenity-checkbox input{accent-color:var(--navy)}

/* Upload */
.upload-area{border:2px dashed var(--border-strong);border-radius:12px;padding:26px;text-align:center;cursor:pointer;background:#F9FAFB;margin-bottom:14px;transition:.3s}
.upload-area:hover{border-color:var(--navy);background:#F0F4F8}

/* Reviews */
.review-section{margin:22px 0}
.review-form{background:#F8F9FA;padding:18px;border-radius:12px;margin-bottom:18px}
.review-form h3{margin-bottom:10px;font-size:1rem;color:var(--navy)}
.star-rating-input{display:flex;gap:5px;margin-bottom:10px;font-size:1.4rem}
.star-rating-input i{cursor:pointer;color:#ccc;transition:.15s}
.star-rating-input i:hover{transform:scale(1.15)}
.star-rating-input i.active{color:var(--amber)}
.review-form input,.review-form textarea{width:100%;padding:10px 12px;margin-bottom:10px;border:1px solid var(--border-strong);border-radius:8px;font-size:.86rem;font-family:inherit;outline:none}
.review-form input:focus,.review-form textarea:focus{border-color:var(--navy)}
.review-list{display:flex;flex-direction:column;gap:12px}
.review-item{padding:14px 16px;background:#fff;border-radius:10px;border:1px solid var(--border)}
.review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.reviewer-name{font-weight:800;font-size:.85rem;color:var(--navy)}
.review-date{font-size:.72rem;color:var(--muted);font-weight:600}
.review-stars{color:var(--amber);font-size:.85rem;margin-bottom:4px}
.review-comment{font-size:.86rem;line-height:1.55;color:var(--body)}

/* Toast */
.toast-wrap{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:92vw;pointer-events:none}
.toast{padding:12px 20px;background:var(--navy);color:#fff;border-radius:30px;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px rgba(16,40,56,.35);pointer-events:auto;animation:toastIn .3s ease;max-width:100%}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
.toast.success{background:var(--lime);color:var(--navy)}
.toast.error{background:var(--danger);color:#fff}
.toast.warn{background:var(--amber);color:#4a3500}

/* Draft banner */
.draft-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:linear-gradient(135deg,#FFF8E1,#FFECB3);border:1px solid #FFD54F;border-left:4px solid #FFA000;border-radius:10px;margin-bottom:20px;font-size:.86rem;color:#6D4C00;flex-wrap:wrap;font-weight:600}
.draft-banner strong{color:#4E342E;font-weight:800}
.draft-banner button{padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:800;cursor:pointer;border:1px solid #FFB300;background:transparent;color:#6D4C00;font-family:inherit;transition:.2s}
.draft-banner button:hover{background:rgba(255,167,0,.12)}

/* Save-status pill */
.save-status{position:fixed;bottom:24px;right:24px;background:var(--navy);color:var(--lime);padding:10px 18px;border-radius:30px;font-size:.78rem;font-weight:700;box-shadow:0 8px 24px rgba(16,40,56,.25);display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(20px);transition:opacity .3s,transform .3s;pointer-events:none;z-index:9999;max-width:calc(100% - 48px)}
.save-status.visible{opacity:1;transform:translateY(0)}

.loading,.error{text-align:center;padding:60px 20px;font-size:1rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.spinner{width:38px;height:38px;border:4px solid rgba(16,40,56,.1);border-left-color:var(--pink);border-radius:50%;animation:spin 1s linear infinite}
.spinner-sm{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-left-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-create{display:inline-block;padding:12px 30px;background:var(--navy);color:var(--lime);border-radius:30px;font-weight:700;text-decoration:none;margin-top:15px;cursor:pointer;border:none;font-size:.95rem;transition:.2s;font-family:inherit}
.btn-create:hover{background:var(--navy-2)}
.submit-review-btn{background:var(--navy);color:var(--lime);border:none;padding:11px 24px;border-radius:30px;font-weight:700;font-size:.88rem;cursor:pointer;transition:.2s;font-family:inherit}
.submit-review-btn:hover{background:var(--navy-2);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="vendordashboard.html" class="back-btn" id="dash-btn" style="display:none"><i class="fas fa-arrow-left"></i> Dashboard</a>
    <div class="logo">Zone<span>21</span> Venue</div>
  </div>

  <div class="detect-bar" id="detectBar">
    <div class="detect-chip" id="countryChip">
      <div class="dc-icon"><i class="fas fa-globe-africa" id="countryChipIcon"></i></div>
      <div style="flex:1;min-width:0">
        <div class="dc-label">Venue Country</div>
        <div class="dc-value" id="countryChipValue">Add your location below</div>
        <div class="dc-sub" id="countryChipSub">Include city & country — e.g. "Harare, Zimbabwe"</div>
      </div>
    </div>
    <div class="detect-chip" id="currencyChip">
      <div class="dc-icon"><i class="fas fa-coins"></i></div>
      <div style="flex:1;min-width:0">
        <div class="dc-label">Pricing Currency</div>
        <div class="dc-value" id="currencyChipValue">USD $</div>
        <div class="dc-sub" id="currencyChipSub">Auto-matched to your country</div>
      </div>
      <div class="curr-switch" id="currSwitch">
        <button type="button" data-curr="USD" onclick="setCurrency('USD',true)">🇺🇸 USD</button>
        <button type="button" data-curr="ZAR" onclick="setCurrency('ZAR',true)">🇿🇦 ZAR</button>
      </div>
    </div>
  </div>

  <div id="profile-content">
    <div class="loading"><div class="spinner"></div> Loading venue profile...</div>
  </div>
</div>

<div class="save-status" id="saveStatus"><i class="fas fa-cloud-arrow-up"></i> <span id="saveStatusText">Saved</span></div>
<div class="toast-wrap" id="toastWrap"></div>

<template id="review-template">
  <div class="review-item">
    <div class="review-header"><span class="reviewer-name"></span><span class="review-date"></span></div>
    <div class="review-stars"></div>
    <div class="review-comment"></div>
  </div>
</template>

<script>
/* ============================================================
   FIREBASE
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
  authDomain: "zone21.firebaseapp.com",
  projectId: "zone21",
  storageBucket: "zone21.firebasestorage.app",
  messagingSenderId: "405963057292",
  appId: "1:405963057292:web:80e9923ae84eb7029073a9",
  measurementId: "G-KE007Y89F1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

/* ============================================================
   CONSTANTS
============================================================ */
const CURRENCIES = { USD:{sym:'$',code:'USD',label:'US Dollar'}, ZAR:{sym:'R',code:'ZAR',label:'South African Rand'} };
const USD_TO_ZAR = 19;
const ZAR_COUNTRIES = new Set(['south africa','lesotho','eswatini','namibia']);

const COUNTRY_DB = {
  'zimbabwe':{ name:'Zimbabwe', flag:'🇿🇼', display:'Zimbabwe',
    aliases:['zimbabwe','zim','zw','republic of zimbabwe'],
    cities:['harare','bulawayo','mutare','gweru','kwekwe','masvingo','chinhoyi','victoria falls','kadoma','chitungwiza','marondera','hwange','chegutu','bindura','zvishavane','beitbridge','kariba','chiredzi','rusape','chipinge','shurugwi','plumtree','gwanda','lupane','esigodini','nyanga','chimanimani','chivhu','murehwa','ruwa','epworth','norton','banket','glendale','centenary','mazowe','shamva','concession','mount darwin','karoi','chirundu'],
    regions:['mashonaland','matabeleland','midlands','manicaland','masvingo province','harare province','bulawayo province'] },

/* ============================================================
   COUNTRY / CURRENCY HELPERS
============================================================ */
function norm(str){ return String(str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\s,]/g,' ').replace(/\s+/g,' ').trim(); }
function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function detectCountry(loc){
  const n = norm(loc); if(!n) return null;
  for(const [key,meta] of Object.entries(COUNTRY_DB)){
    for(const alias of meta.aliases){
      const a = norm(alias); if(!a) continue;
      if(new RegExp(`(^|[\\s,])${escRe(a)}($|[\\s,])`,'i').test(n)) return key;
    }
  }
  const allCities = [];
  for(const [key,meta] of Object.entries(COUNTRY_DB)){
    for(const c of meta.cities){
      const cn = norm(c); if(cn) allCities.push({key,city:cn});
    }
  }
  allCities.sort((a,b)=>b.city.length-a.city.length);
  for(const {key,city} of allCities){
    if(new RegExp(`(^|[\\s,])${escRe(city)}($|[\\s,])`,'i').test(n)) return key;
  }
  for(const [key,meta] of Object.entries(COUNTRY_DB)){
    for(const r of (meta.regions||[])){
      const rn = norm(r); if(!rn) continue;
      if(new RegExp(`(^|[\\s,])${escRe(rn)}($|[\\s,])`,'i').test(n)) return key;
    }
  }
  return null;
}
function metaOf(k){ return k ? COUNTRY_DB[k] : null; }
function currencyForCountry(k){ return ZAR_COUNTRIES.has(k) ? 'ZAR' : 'USD'; }
function curSym(c){ c = c || activeCurrency; return CURRENCIES[c].sym; }

function convertAmount(usd, curr){
  const n = Number(usd) || 0;
  return curr === 'ZAR' ? n * USD_TO_ZAR : n;
}
function fmtMoney(amount, curr){
  curr = curr || activeCurrency;
  const n = Math.round(Number(amount) || 0);
  return `${curSym(curr)}${n.toLocaleString('en-US')}`;
}
function fmtFromUSD(usd, curr){ return fmtMoney(convertAmount(usd, curr), curr); }

============================================================ */
function toast(msg, type='info'){
  const c = $('toastWrap'); if(!c) return;
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success:'fa-circle-check', error:'fa-circle-exclamation', warn:'fa-triangle-exclamation', info:'fa-circle-info' };
  t.innerHTML = `<i class="fas ${icons[type]||icons.info}"></i><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); }, 4000);
}

/* ============================================================
   DETECTION UI
============================================================ */
function updateDetectionUI(){
  // Country chip
  const loc = viewMode === 'edit' ? ($('e-loc')?.value || '') : (venueData?.location || '');
  const cc = $('countryChip'), ccIcon = $('countryChipIcon'), ccVal = $('countryChipValue'), ccSub = $('countryChipSub');
  if(!loc.trim()){
    cc.className = 'detect-chip';
    ccIcon.className = 'fas fa-globe-africa';
    ccVal.textContent = 'Add your location below';
    ccSub.textContent = 'Include city & country — e.g. "Harare, Zimbabwe"';
  } else {
    const key = detectCountry(loc);
    if(key){
      const m = metaOf(key);
      cc.className = 'detect-chip ok';
      ccIcon.className = 'fas fa-check-circle';
      ccVal.textContent = `${m.flag}  ${m.display}`;
      ccSub.textContent = `Venue listed in ${m.display}`;
    } else {
      cc.className = 'detect-chip err';
      ccIcon.className = 'fas fa-exclamation-triangle';
      ccVal.textContent = 'Country not recognised';
      ccSub.textContent = 'Try "Harare, Zimbabwe" or "Pretoria, South Africa"';
    }
  }

  // Currency chip
  const cur = CURRENCIES[activeCurrency];
  const flag = activeCurrency === 'ZAR' ? '🇿🇦' : '🇺🇸';
  $('currencyChipValue').textContent = `${flag}  ${cur.code} ${cur.sym}`;
  $('currencyChipSub').textContent = currencyManual ? 'Manually selected' : 'Auto-matched to country';
  document.querySelectorAll('#currSwitch button').forEach(b => b.classList.toggle('active', b.dataset.curr === activeCurrency));
}

function setCurrency(curr, isManual){
  if(!CURRENCIES[curr]) return;
  activeCurrency = curr;
  if(isManual){
    currencyManual = true;
    try { localStorage.setItem('zone21_currency_manual','1'); localStorage.setItem('zone21_currency',curr); } catch(e){}
  }
  // Re-render prices in current view
  if(viewMode === 'public' && venueData) renderPublic();
  else if(viewMode === 'edit') applyCurrencyToForm();
  updateDetectionUI();
}

function autoDetectCurrency(){
  if(currencyManual) return;
  const loc = viewMode === 'edit' ? ($('e-loc')?.value || '') : (venueData?.location || '');
  const key = detectCountry(loc);
  if(!key) return;
  const next = currencyForCountry(key);
  if(next !== activeCurrency){
    activeCurrency = next;
    try { localStorage.setItem('zone21_currency',next); } catch(e){}
    updateDetectionUI();
    if(viewMode === 'edit') applyCurrencyToForm();
  }
}

/* ============================================================
   AUTH
============================================================ */
auth.onAuthStateChanged(async user => {
  currentUser = user;
  const params = new URLSearchParams(window.location.search);
  const idFromUrl = params.get('id');
  if(idFromUrl && idFromUrl !== 'null' && idFromUrl !== 'undefined'){
    venueId = idFromUrl;
  } else if(user){
    try {
      const doc = await db.collection('venues').doc(user.uid).get();
      if(doc.exists) venueId = user.uid;
      else if(user.email){
        const snap = await db.collection('venues').where('email','==',user.email).limit(1).get();
        if(!snap.empty) venueId = snap.docs[0].id;
      }
    } catch(e){}
  }
  if(!venueId){ showNotFound(!!user); return; }
  isOwner = user && user.uid === venueId;
  if(isOwner) $('dash-btn').style.display = 'inline-flex';
  await loadVenue();
});

async function loadVenue(){
  try {
    const doc = await db.collection('venues').doc(venueId).get();
    if(!doc.exists){ showNotFound(!!currentUser); return; }
    venueData = doc.data();
    uploadedImages = venueData.images || [];
    priceTiers = venueData.priceTiers || [];

    if(!currencyManual && venueData.country){
      const next = currencyForCountry(venueData.country);
      if(next !== activeCurrency){ activeCurrency = next; }
    }

    if(viewMode === 'edit') renderEdit();
    else { renderPublic(); loadReviews(); }
    updateDetectionUI();
  } catch(e){
    console.error(e);
    $('profile-content').innerHTML = '<div class="error">Failed to load profile.</div>';
  }
}

function showNotFound(isLoggedIn){
  $('profile-content').innerHTML = isLoggedIn
    ? `<div class="error"><i class="fas fa-building" style="font-size:3rem;color:var(--navy)"></i><h3>No Venue Profile Found</h3><p>You don't have a venue profile yet.</p><button class="btn-create" onclick="createVenue()"><i class="fas fa-plus"></i> Create Venue Profile</button></div>`
    : `<div class="error"><i class="fas fa-lock" style="font-size:3rem;color:var(--navy)"></i><h3>Please Sign In</h3><a href="login.html" class="btn-create"><i class="fas fa-sign-in-alt"></i> Go to Login</a></div>`;
}

async function createVenue(){
  if(!auth.currentUser) return;
  const uid = auth.currentUser.uid;
  await db.collection('venues').doc(uid).set({
    name: auth.currentUser.email.split('@')[0] || 'My Venue',
    category: 'Venue / Space Rental',
    services: ['Venue / Space Rental'],
    location:'', country:null, basePrice:0, currency:'USD',
    priceTiers:[], capacity:0, venueType:'Indoor', amenities:[],
    description:'', images:[], avatar:null,
    rating:0, reviewsCount:0, status:'pending',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  window.location.reload();
}

function toggleMode(){
  viewMode = viewMode === 'public' ? 'edit' : 'public';
  if(viewMode === 'edit') renderEdit();
  else { loadVenue(); }
  window.scrollTo({top:0,behavior:'smooth'});
}

          <span class="field-error" id="err-loc">Please add a recognised country to your location.</span>
        </div>
        <div class="input-group">
          <label>Base Starting Price <span class="req">*</span> <span style="font-size:.65rem;color:var(--muted);font-weight:600">(${activeCurrency})</span></label>
          <div class="price-input-wrap">
            <span class="cur-prefix" id="pricePrefix">${curSym()}</span>
            <input type="number" id="e-price" value="${displayBasePrice}" placeholder="0" min="1" required>
          </div>
          <span class="hint">Your cheapest venue hire option. Blueprint matching uses this figure.</span>
          <span class="field-error" id="err-price">A starting price is required for blueprint matching.</span>
        </div>
        <div class="input-group">
          <label>Capacity</label>
          <input type="number" id="e-capacity" value="${venueData.capacity||''}" placeholder="e.g. 200">
        </div>
        <div class="input-group">
          <label>Venue Type</label>
          <select id="e-venue-type">
            <option value="Indoor" ${venueData.venueType==='Indoor'?'selected':''}>Indoor</option>
            <option value="Outdoor" ${venueData.venueType==='Outdoor'?'selected':''}>Outdoor</option>
            <option value="Both" ${venueData.venueType==='Both'?'selected':''}>Both</option>
          </select>
        </div>
        <div class="input-group full-width">
          <label>Description</label>
          <textarea id="e-desc" placeholder="What makes your venue special?">${escapeHtml(venueData.description||'')}</textarea>
        </div>
      </div>

      <h3 style="color:var(--navy);margin:24px 0 12px;font-size:1rem;font-weight:800"><i class="fas fa-layer-group" style="color:var(--gold-deep)"></i> Pricing Tiers <span style="font-size:.65rem;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0">(optional — add Full Day, Half Day, VIP, Stage levels, etc.)</span></h3>
      <div class="tier-builder" id="tierBuilder">
        <div class="tier-builder-head">
          <strong>Your Price Options</strong>
          <button class="btn btn-sm btn-lime" onclick="addTier()"><i class="fas fa-plus"></i> Add Tier</button>
        </div>
        <div id="tierList">${tiersHtml || '<p style="font-size:.8rem;color:var(--muted);text-align:center;padding:12px">No tiers yet. Click "Add Tier" to create package options.</p>'}</div>
      </div>

      <h3 style="color:var(--navy);margin:24px 0 12px;font-size:1rem;font-weight:800"><i class="fas fa-star" style="color:var(--gold-deep)"></i> Amenities</h3>
      <div class="amenities-grid">${amenitiesHtml}</div>

      <h3 style="color:var(--navy);margin:24px 0 12px;font-size:1rem;font-weight:800"><i class="fas fa-list" style="color:var(--gold-deep)"></i> Details</h3>
      <div class="form-grid">
        <div class="input-group"><label>Deposit Required</label><input type="text" id="e-deposit" value="${escapeHtml(venueData.deposit||'')}" placeholder="e.g. 30% or $500"></div>
        <div class="input-group"><label>Operating Hours</label><input type="text" id="e-hours" value="${escapeHtml(venueData.operatingHours||'')}" placeholder="e.g. Mon–Sun 8am–11pm"></div>
        <div class="input-group"><label>Parking</label><input type="text" id="e-parking" value="${escapeHtml(venueData.parking||'')}" placeholder="e.g. 50 spaces, free"></div>
        <div class="input-group"><label>Catering</label><input type="text" id="e-catering" value="${escapeHtml(venueData.catering||'')}" placeholder="e.g. In-house only"></div>
        <div class="input-group full-width"><label>Rental Policies</label><textarea id="e-policies" placeholder="Cancellation, security deposit, damage terms…">${escapeHtml(venueData.rentalPolicies||'')}</textarea></div>
      </div>

      <h3 style="color:var(--navy);margin:24px 0 12px;font-size:1rem;font-weight:800"><i class="fas fa-share-nodes" style="color:var(--gold-deep)"></i> Social Media</h3>
      <div class="form-grid">
        <div class="input-group"><label>TikTok</label><input type="text" id="e-tt" value="${escapeHtml(venueData.tiktok||'')}" placeholder="@yourname"></div>
        <div class="input-group"><label>Instagram</label><input type="text" id="e-ig" value="${escapeHtml(venueData.instagram||'')}" placeholder="@yourname"></div>
        <div class="input-group"><label>Facebook</label><input type="text" id="e-fb" value="${escapeHtml(venueData.facebook||'')}" placeholder="yourpage"></div>
        <div class="input-group"><label>YouTube</label><input type="text" id="e-yt" value="${escapeHtml(venueData.youtube||'')}" placeholder="@yourchannel"></div>
        <div class="input-group full-width"><label>Website</label><input type="text" id="e-web" value="${escapeHtml(venueData.website||'')}" placeholder="yourbusiness.com"></div>
      </div>

      <h3 style="color:var(--navy);margin:24px 0 12px;font-size:1rem;font-weight:800"><i class="fas fa-images" style="color:var(--gold-deep)"></i> Gallery <span style="font-size:.65rem;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0">(max 5 images)</span></h3>
      <div class="upload-area" onclick="document.getElementById('galleryUpload').click()" id="uploadBox">
        <i class="fas fa-cloud-upload-alt" style="font-size:2rem;color:var(--navy);margin-bottom:8px"></i>
        <p id="uploadText" style="font-size:.85rem;font-weight:600">Click to add gallery images.</p>
        <input type="file" id="galleryUpload" accept="image/*" multiple style="display:none" onchange="handleGallery(event)">
      </div>
      <div class="standard-gallery" id="editGallery">${imagesHtml}</div>

      <div style="margin-top:28px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" id="saveBtn" onclick="saveProfile()" style="flex:1;min-width:220px"><i class="fas fa-save"></i> Save All Changes</button>
        <button class="btn btn-outline" onclick="toggleMode()"><i class="fas fa-xmark"></i> Cancel</button>
      </div>
    </div>`;

  attachFormListeners();
  updateDetectionUI();
}

function attachFormListeners(){
  // Location input
  const loc = $('e-loc');
  if(loc){
    let t = null;
    loc.addEventListener('input', () => {
      updateDetectionUI();
      clearTimeout(t);
      t = setTimeout(autoDetectCurrency, 250);
      scheduleDraft();
    });
    loc.addEventListener('blur', () => { updateDetectionUI(); autoDetectCurrency(); });
  }
  // Price inputs
  document.querySelectorAll('#e-price, .tier-price-input').forEach(inp => {
    inp.addEventListener('input', scheduleDraft);
  });
  // All other inputs — auto-save draft
  ['e-name','e-capacity','e-venue-type','e-desc','e-deposit','e-hours','e-parking','e-catering','e-policies','e-tt','e-ig','e-fb','e-yt','e-web'].forEach(id => {
    const el = $(id); if(el){ el.addEventListener('input', scheduleDraft); el.addEventListener('change', scheduleDraft); }
  });
  document.querySelectorAll('.amenity-chk').forEach(cb => {
    cb.addEventListener('change', (e) => {
      e.target.closest('.amenity-checkbox').classList.toggle('checked', e.target.checked);
      scheduleDraft();
    });
  });
  // Tier inputs
  document.querySelectorAll('.tier-name-input, .tier-desc-input, .tier-price-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const i = parseInt(inp.dataset.i,10);
      if(!priceTiers[i]) return;
      if(inp.classList.contains('tier-name-input')) priceTiers[i].name = inp.value;
      else if(inp.classList.contains('tier-desc-input')) priceTiers[i].desc = inp.value;
      else if(inp.classList.contains('tier-price-input')){
        const displayed = Number(inp.value)||0;
        priceTiers[i].priceUsd = activeCurrency === 'ZAR' ? Math.round(displayed/USD_TO_ZAR*100)/100 : displayed;
      }
      scheduleDraft();
    });
  });
}

function applyCurrencyToForm(){
  const prefix = $('pricePrefix'); if(prefix) prefix.textContent = curSym();
  document.querySelectorAll('.tier-price-wrap .cur-prefix').forEach(p => p.textContent = curSym());
  // Re-convert existing displayed prices
  const baseInp = $('e-price');
  if(baseInp && venueData?.basePrice){
    baseInp.value = Math.round(convertAmount(venueData.basePrice, activeCurrency));
  }
  priceTiers.forEach((t,i) => {
    const inp = document.querySelector(`.tier-price-input[data-i="${i}"]`);
    if(inp) inp.value = Math.round(convertAmount(t.priceUsd, activeCurrency));
  });
}

/* ============================================================
   TIER MANAGEMENT
============================================================ */
function addTier(){
  priceTiers.push({ name:'', desc:'', priceUsd:0 });
  renderEdit();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.tier-name-input');
    inputs[inputs.length-1]?.focus();
  }, 100);
}
function removeTier(i){
  priceTiers.splice(i,1);
  renderEdit();
  scheduleDraft();
}

/* ============================================================
   IMAGE HANDLING
============================================================ */
function compressImage(file, maxW, q, cb){
  const r = new FileReader();
  r.onload = e => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      let w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg', q));
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(file);
}
function handleAvatar(e){
  const f = e.target.files[0]; if(!f) return;
  compressImage(f, 400, 0.7, b64 => {
    venueData.avatar = b64;
    renderEdit();
    scheduleDraft();
    toast('Avatar updated — remember to save.', 'success');
  });
  e.target.value = '';
}
function handleGallery(e){
  const files = Array.from(e.target.files);
  if(uploadedImages.length + files.length > 5){ toast('Maximum 5 images allowed.', 'warn'); return; }
  const txt = $('uploadText');
  txt.innerHTML = '<span class="spinner-sm" style="border-left-color:var(--navy)"></span> Processing…';
  let done = 0;
  files.forEach(f => {
    if(!f.type.startsWith('image/')){ done++; return; }
    compressImage(f, 900, 0.6, b64 => {
      uploadedImages.push(b64);
      done++;
      if(done === files.length){ renderEdit(); scheduleDraft(); toast('Images added.', 'success'); }
    });
  });
  e.target.value = '';
}
function removeImage(i){
  uploadedImages.splice(i,1);
  renderEdit();
  scheduleDraft();
}

/* ============================================================
   DRAFT AUTO-SAVE
============================================================ */
function getDraftKey(){ return 'z21_venue_draft_' + venueId; }
function scheduleDraft(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraft, 500);
}
function saveDraft(){
  try {
    const state = collectForm();
    localStorage.setItem(getDraftKey(), JSON.stringify({ ...state, _ts: Date.now() }));
    showSaveStatus('Progress saved • ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
  } catch(e){}
}
function collectForm(){
  return {
    name: $('e-name')?.value || '',
    location: $('e-loc')?.value || '',
    basePriceDisplay: Number($('e-price')?.value) || 0,
    capacity: Number($('e-capacity')?.value) || 0,
    venueType: $('e-venue-type')?.value || 'Indoor',
    description: $('e-desc')?.value || '',
    amenities: Array.from(document.querySelectorAll('.amenity-chk:checked')).map(c => c.value),
    deposit: $('e-deposit')?.value || '',
    operatingHours: $('e-hours')?.value || '',
    parking: $('e-parking')?.value || '',
    catering: $('e-catering')?.value || '',
    rentalPolicies: $('e-policies')?.value || '',
    tiktok: $('e-tt')?.value || '',
    instagram: $('e-ig')?.value || '',
    facebook: $('e-fb')?.value || '',
    youtube: $('e-yt')?.value || '',
    website: $('e-web')?.value || '',
    images: uploadedImages,
    avatar: venueData?.avatar || null,
    priceTiers,
    currency: activeCurrency,
    isEdit: true
  };
}
function showSaveStatus(msg){
  const el = $('saveStatus'); const txt = $('saveStatusText');
  if(!el||!txt) return;
  txt.textContent = msg;
  el.classList.add('visible');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('visible'), 2400);
}

/* ============================================================
   SAVE PROFILE — hard validation
============================================================ */
async function saveProfile(){
  const locVal = ($('e-loc').value || '').trim();
  const priceVal = Number($('e-price').value) || 0;

  let errors = false;

  // Location + country
  if(!locVal){
    $('err-loc').classList.add('visible');
    $('e-loc').classList.add('invalid');
    errors = true;
  } else if(!detectCountry(locVal)){
    $('err-loc').classList.add('visible');
    $('e-loc').classList.add('invalid');
    errors = true;
  } else {
    $('err-loc').classList.remove('visible');
    $('e-loc').classList.remove('invalid');
  }

  // Price
  if(priceVal <= 0){
    $('err-price').classList.add('visible');
    $('e-price').classList.add('invalid');
    errors = true;
  } else {
    $('err-price').classList.remove('visible');
    $('e-price').classList.remove('invalid');
  }

  if(errors){
    toast('Please fix the highlighted fields before saving.', 'error');
    // Scroll to first error
    const firstErr = document.querySelector('.invalid');
    firstErr?.scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }

  const btn = $('saveBtn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> Saving…';

  const country = detectCountry(locVal);

  // Convert displayed prices to USD for storage
  const basePriceUsd = activeCurrency === 'ZAR'
    ? Math.round((priceVal / USD_TO_ZAR) * 100) / 100
    : Math.round(priceVal * 100) / 100;

  const cleanTiers = priceTiers
    .filter(t => t.name && t.name.trim() && t.priceUsd > 0)
    .map(t => ({
      name: t.name.trim(),
      desc: (t.desc || '').trim(),
      priceUsd: Number(t.priceUsd) || 0
    }));

  const updates = {
    name: ($('e-name').value || '').trim(),
    location: locVal,
    country,
    basePrice: basePriceUsd,
    basePriceCurrency: activeCurrency,
    basePriceDisplay: priceVal,
    priceTiers: cleanTiers,
    capacity: Number($('e-capacity').value) || 0,
    venueType: $('e-venue-type').value,
    description: ($('e-desc').value || '').trim(),
    amenities: Array.from(document.querySelectorAll('.amenity-chk:checked')).map(c => c.value),
    deposit: ($('e-deposit').value || '').trim(),
    operatingHours: ($('e-hours').value || '').trim(),
    parking: ($('e-parking').value || '').trim(),
    catering: ($('e-catering').value || '').trim(),
    rentalPolicies: ($('e-policies').value || '').trim(),
    tiktok: fixLink($('e-tt').value, 'https://tiktok.com/@'),
    instagram: fixLink($('e-ig').value, 'https://instagram.com/'),
    facebook: fixLink($('e-fb').value, 'https://facebook.com/'),
    youtube: fixLink($('e-yt').value, 'https://youtube.com/@'),
    website: fixLink($('e-web').value, 'https://'),
    currency: activeCurrency,
    avatar: venueData.avatar || null,
    images: uploadedImages,
    services: ['Venue / Space Rental'],
    category: 'Venue / Space Rental',
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    await db.collection('venues').doc(venueId).set(updates, { merge:true });
    venueData = { ...venueData, ...updates };
    localStorage.removeItem(getDraftKey());
    toast('Venue profile saved successfully.', 'success');
    showSaveStatus('Saved ✓');
    setTimeout(() => { toggleMode(); }, 600);
  } catch(e){
    console.error(e);
    let msg = 'Failed to save. ';
    if(e.code === 'permission-denied') msg += 'Please sign in to the correct account.';
    else msg += 'Please try again.';
    toast(msg, 'error');
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

/* ============================================================
   REVIEWS
============================================================ */
function setupReviews(){
  document.querySelectorAll('#starInput i').forEach(star => {
    star.addEventListener('mouseover', () => setStarUI(parseInt(star.dataset.v)));
    star.addEventListener('mouseleave', () => setStarUI(selectedRating));
    star.addEventListener('click', () => { selectedRating = parseInt(star.dataset.v); setStarUI(selectedRating); });
  });
  $('submitReviewBtn').addEventListener('click', submitReview);
  checkExistingReview().then(existing => {
    if(existing){
      $('reviewStatus').textContent = 'You have already reviewed — you can update below.';
      $('reviewerName').value = existing.reviewerName || '';
      $('reviewComment').value = existing.comment || '';
      selectedRating = existing.rating;
      setStarUI(selectedRating);
      $('submitReviewBtn').dataset.reviewId = existing.id;
    }
  });
}
function setStarUI(v){
  document.querySelectorAll('#starInput i').forEach(s => {
    s.className = parseInt(s.dataset.v) <= v ? 'fas fa-star active' : 'far fa-star';
  });
}
async function checkExistingReview(){
  if(!currentUser) return null;
  try {
    const snap = await db.collection('venues').doc(venueId).collection('reviews')
      .where('reviewerId','==',currentUser.uid).get();
    if(!snap.empty) return { id: snap.docs[0].id, ...snap.docs[0].data() };
    return null;
  } catch(e){ return null; }
}
async function submitReview(){
  if(!selectedRating){ toast('Please select a star rating.', 'warn'); return; }
  const comment = $('reviewComment').value.trim();
  if(!comment){ toast('Please write a comment.', 'warn'); return; }
  const reviewerName = $('reviewerName').value.trim() || 'Anonymous';
  const btn = $('submitReviewBtn');
  const existingId = btn.dataset.reviewId;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> Sending…';
  try {
    const data = {
      rating: selectedRating,
      reviewerName,
      comment,
      reviewerId: currentUser.uid,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if(existingId){
      await db.collection('venues').doc(venueId).collection('reviews').doc(existingId).update(data);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('venues').doc(venueId).collection('reviews').add(data);
    }
    await updateRating();
    loadReviews();
    toast('Review saved.', 'success');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Update Review';
  } catch(e){
    console.error(e);
    toast('Failed to save review.', 'error');
    btn.disabled = false;
  }
}
async function updateRating(){
  try {
    const snap = await db.collection('venues').doc(venueId).collection('reviews').get();
    let total = 0, count = 0;
    snap.forEach(d => { const r = d.data(); if(r.rating){ total += r.rating; count++; } });
    const avg = count ? total/count : 0;
    await db.collection('venues').doc(venueId).update({ rating: avg, reviewsCount: count });
    if(venueData){ venueData.rating = avg; venueData.reviewsCount = count; }
  } catch(e){}
}
async function loadReviews(){
  const list = $('reviewList'); if(!list) return;
  list.innerHTML = '<p style="color:var(--muted);font-size:.82rem">Loading reviews…</p>';
  try {
    const snap = await db.collection('venues').doc(venueId).collection('reviews')
      .orderBy('createdAt','desc').limit(20).get();
    if(snap.empty){ list.innerHTML = '<p style="color:var(--muted);font-size:.82rem">No reviews yet.</p>'; return; }
    const tmpl = $('review-template');
    list.innerHTML = '';
    snap.forEach(d => {
      const r = d.data();
      const clone = tmpl.content.cloneNode(true);
      clone.querySelector('.reviewer-name').textContent = r.reviewerName || 'Anonymous';
      const dateStr = r.createdAt?.toDate ? new Date(r.createdAt.toDate()).toLocaleDateString() : 'Recently';
      clone.querySelector('.review-date').textContent = dateStr;
      clone.querySelector('.review-stars').textContent = '★'.repeat(r.rating) + '☆'.repeat(5-r.rating);
      clone.querySelector('.review-comment').textContent = r.comment || '';
      list.appendChild(clone);
    });
  } catch(e){ list.innerHTML = '<p style="color:var(--muted);font-size:.82rem">Failed to load reviews.</p>'; }
}

/* ============================================================
   UTILITIES
============================================================ */
function escapeHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fixLink(v, base){
  if(!v) return '';
  let s = String(v).trim(); if(!s) return '';
  if(s.startsWith('http://') || s.startsWith('https://')) return s;
  if(s.startsWith('@')) s = s.slice(1);
  return base + s.replace(/^\/+/,'');
}
function copyLink(){
  navigator.clipboard.writeText(window.location.href).then(() => toast('Profile link copied!','success'));
}

/* ============================================================
   BOOT
============================================================ */
updateDetectionUI();
</script>
