<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Venue Profile | Zone21</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<style>
:root{--navy:#102838;--lime:#C0C800;--pink:#F80070;--bg:#f5f7fa;--card:#ffffff;
  --text:#1a1a2e;--muted:#6c757d;--border:#e0e0e8;--radius:20px;
  --shadow:0 12px 40px rgba(16,40,56,0.1);}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:20px;}
.container{max-width:1000px;margin:0 auto;}
.header{text-align:center;margin-bottom:30px;position:relative;}
.header .logo{font-size:1.8rem;font-weight:800;color:var(--navy);}
.header .logo span{color:var(--pink);}
.back-btn{position:absolute;left:0;top:0;background:var(--navy);color:white;border:none;padding:8px 15px;
  border-radius:20px;cursor:pointer;text-decoration:none;font-size:0.9rem;font-weight:600;transition:0.2s;}
.back-btn:hover{background:var(--lime);color:var(--navy);}

/* ⭐ DETECT BAR */
.detect-bar{display:flex;align-items:stretch;gap:10px;margin-bottom:20px;flex-wrap:wrap;}

.detect-chip{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:10px;
  padding:12px 16px;border-radius:12px;border:1.5px solid var(--border);transition:.25s;
  background:var(--card);box-shadow:0 4px 16px rgba(16,40,56,.08);}
.detect-chip.country{background:linear-gradient(135deg,#f0f7f9,#fff);}
.detect-chip.country.ok{border-color:var(--lime);box-shadow:0 0 0 3px rgba(192,200,0,.18);}
.detect-chip.country.err{border-color:var(--pink);background:linear-gradient(135deg,#fdf2f5,#fff);
  box-shadow:0 0 0 3px rgba(248,0,112,.12);}
.detect-chip.country.hidden-chip{display:none;}
.detect-chip.country .dc-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:1.05rem;flex-shrink:0;background:#f0f4f8;border:1px solid var(--border);}
.detect-chip.country.ok .dc-icon{background:rgba(192,200,0,.15);color:#7a8200;border-color:var(--lime);}
.detect-chip.country.err .dc-icon{background:rgba(248,0,112,.12);color:var(--pink);border-color:var(--pink);}
.detect-chip.country .dc-text{flex:1;min-width:0;}
.detect-chip.country .dc-label{font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:3px;}
.detect-chip.country .dc-value{font-size:.92rem;font-weight:800;color:var(--navy);line-height:1.2;}
.detect-chip.country.err .dc-value{color:var(--pink);}
.detect-chip.country .dc-sub{font-size:.7rem;color:var(--muted);font-weight:500;margin-top:3px;line-height:1.4;}

/* ⭐ COMPACT CURRENCY CHIP — locked to 52px */
.detect-chip.currency{
  flex:1 1 auto !important;min-width:0 !important;
  display:flex !important;align-items:center !important;gap:8px !important;
  padding:6px 8px 6px 10px !important;
  height:52px !important;min-height:52px !important;max-height:52px !important;
  border-radius:12px !important;border:1.5px solid var(--border);
  background:linear-gradient(135deg,#f5f7f9,#fff);
  box-shadow:0 4px 16px rgba(16,40,56,.08);
  overflow:hidden;box-sizing:border-box;transition:.25s;}
.detect-chip.currency.zar{background:linear-gradient(135deg,#fff9e6,#fff);border-color:#f5b400;}
.detect-chip.currency.usd{background:linear-gradient(135deg,#f0f6ff,#fff);border-color:#6b9f9f;}
.detect-chip.currency .dc-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:.9rem;flex-shrink:0;border:none;color:#fff;background:var(--navy);}
.detect-chip.currency.zar .dc-icon{background:#007A4D;color:#FFB612;}
.detect-chip.currency.usd .dc-icon{background:#B22234;color:#fff;}
.detect-chip.currency .dc-text{flex:1;min-width:0;display:flex;flex-direction:column;
  justify-content:center;overflow:hidden;}
.detect-chip.currency .dc-value{font-size:.85rem;font-weight:800;color:var(--navy);line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.detect-chip.currency .dc-sub{font-size:.62rem;color:var(--muted);font-weight:600;line-height:1.15;
  margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.currency-switch{display:flex;gap:2px;background:#e8ecf0;border:1px solid var(--border);
  border-radius:30px;padding:3px;flex-shrink:0;height:32px;align-items:center;}
.currency-switch button{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;
  font-family:inherit;font-size:.68rem;font-weight:700;color:var(--muted);padding:5px 10px;
  border-radius:30px;cursor:pointer;white-space:nowrap;line-height:1;height:26px;transition:.2s;}
.currency-switch button:hover{color:var(--navy);}
.currency-switch button.active{background:var(--navy);color:#fff;}
.currency-switch button.active[data-currency="ZAR"]{background:linear-gradient(135deg,#007A4D,#007A4D);color:#FFB612;}

/* Profile cards (unchanged) */
.profile-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:20px;animation:fadeIn 0.4s ease-out;}
.profile-cover{height:180px;background:linear-gradient(135deg,var(--navy) 0%,#1a3a4a 100%);}
.profile-avatar{width:120px;height:120px;border-radius:50%;background:var(--lime);display:flex;
  align-items:center;justify-content:center;font-size:2.5rem;font-weight:800;color:var(--navy);
  border:4px solid white;margin-top:-60px;margin-left:30px;position:relative;z-index:2;
  box-shadow:0 4px 15px rgba(0,0,0,0.2);overflow:hidden;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.avatar-edit-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5);color:white;display:flex;
  align-items:center;justify-content:center;opacity:0;transition:0.3s;font-size:1.5rem;}
.profile-avatar.editable:hover .avatar-edit-overlay{opacity:1;}
.profile-info{padding:20px 30px 30px;position:relative;}
.edit-toggle-btn{position:absolute;top:20px;right:30px;background:#f0f4f8;color:var(--navy);
  border:1px solid var(--border);padding:8px 16px;border-radius:20px;font-weight:600;
  cursor:pointer;transition:0.2s;}
.edit-toggle-btn:hover{background:var(--navy);color:white;}
.name{font-size:1.8rem;font-weight:800;color:var(--navy);margin-bottom:4px;}
.category{color:var(--muted);font-size:0.9rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px;}
.rating-summary{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px;}
.stars{color:#ffb400;font-size:1.4rem;letter-spacing:2px;}
.rating-number{font-weight:700;font-size:1.1rem;}
.reviews-count{color:var(--muted);font-size:0.85rem;}
.services-tags{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0;align-items:center;}
.service-tag{background:#f0f4f8;padding:6px 14px;border-radius:20px;font-size:0.8rem;
  font-weight:600;color:var(--navy);}
.description{margin:15px 0;line-height:1.6;color:#444;}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0;}
.detail-item{display:flex;align-items:flex-start;gap:10px;padding:12px 15px;background:#f8f9fa;
  border-radius:10px;font-size:0.9rem;border:1px solid transparent;transition:0.2s;}
.detail-item:hover{background:#e9ecef;border-color:var(--border);}
.detail-item i{width:20px;text-align:center;font-size:1.1rem;margin-top:2px;color:var(--pink);flex-shrink:0;}
.detail-item .label{font-weight:600;color:var(--navy);font-size:0.75rem;text-transform:uppercase;
  letter-spacing:0.03em;display:block;}
.detail-item .value{color:var(--text);word-break:break-word;}
.detail-item .value.secondary-svc{font-size:0.85rem;line-height:1.5;}
.social-links{display:flex;gap:12px;margin:15px 0;flex-wrap:wrap;}
.social-link{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:white;font-size:1.2rem;text-decoration:none;transition:0.2s;}
.social-link:hover{transform:scale(1.1);}
.social-facebook{background:#1877F2;}
.social-instagram{background:#E4405F;}
.social-tiktok{background:#000;}
.social-youtube{background:#FF0000;}
.social-website{background:var(--navy);}
.share-btn{background:var(--lime);color:var(--navy);padding:10px 20px;border-radius:30px;
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;border:none;transition:0.2s;}
.share-btn:hover{background:#d4dc00;}
.gallery-section{margin:25px 0;}
.standard-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;}
.standard-gallery .gallery-item{border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:#e9ecef;
  cursor:pointer;transition:0.3s;position:relative;box-shadow:0 4px 10px rgba(0,0,0,0.05);}
.standard-gallery .gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s;}
.standard-gallery .gallery-item:hover img{transform:scale(1.05);}
.review-section{margin:25px 0;}
.review-form{background:#f8f9fa;padding:20px;border-radius:12px;margin-bottom:20px;}
.review-form h3{margin-bottom:10px;}
.star-rating-input{display:flex;gap:5px;margin-bottom:10px;font-size:1.5rem;}
.star-rating-input i{cursor:pointer;color:#ccc;}
.star-rating-input i.active{color:#ffb400;}
.review-form input,.review-form textarea{width:100%;padding:10px;margin-bottom:10px;
  border:1px solid var(--border);border-radius:8px;font-size:0.9rem;}
.review-list{display:flex;flex-direction:column;gap:15px;}
.review-item{padding:15px;background:#fff;border-radius:10px;border:1px solid var(--border);
  animation:fadeIn 0.4s ease-out;}
.review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.reviewer-name{font-weight:700;}
.review-date{font-size:0.75rem;color:var(--muted);}
.review-stars{color:#ffb400;}
.review-comment{font-size:0.9rem;line-height:1.5;}
.loading,.error{text-align:center;padding:60px 20px;font-size:1.1rem;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:15px;}
.btn-create{display:inline-block;padding:12px 30px;background:var(--navy);color:var(--lime);
  border-radius:30px;font-weight:600;text-decoration:none;margin-top:15px;cursor:pointer;
  border:none;font-size:1rem;transition:0.2s;}
.btn-create:hover{background:#1a3a4a;}
.submit-review-btn{background:var(--navy);color:var(--lime);border:none;padding:12px 24px;
  border-radius:30px;font-weight:700;font-size:1rem;cursor:pointer;transition:0.2s;}
.submit-review-btn:hover{background:#1a3a4a;transform:translateY(-2px);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px;}
.input-group{display:flex;flex-direction:column;gap:5px;}
.input-group label{font-size:0.85rem;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.input-group .hint{font-size:.7rem;color:var(--muted);font-weight:500;margin-top:2px;}
.input-group input,.input-group textarea,.input-group select{padding:10px;border:1px solid var(--border);
  border-radius:8px;font-size:0.9rem;background:#f9fafb;outline:none;transition:0.3s;}
.input-group input:focus,.input-group textarea:focus{border-color:var(--navy);background:white;}
.full-width{grid-column:1/-1;}
.amenities-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
.amenity-checkbox{display:flex;align-items:center;gap:5px;background:#f0f4f8;padding:8px 12px;
  border-radius:20px;font-size:0.85rem;font-weight:600;color:var(--navy);cursor:pointer;transition:0.2s;}
.amenity-checkbox:hover{background:#e0e8f0;}
.amenity-checkbox input{accent-color:var(--pink);}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;
  cursor:pointer;background:#f9fafb;margin-bottom:15px;transition:0.3s;}
.upload-area:hover{border-color:var(--navy);background:#f0f4f8;}
.delete-img-btn{position:absolute;top:8px;right:8px;background:var(--pink);color:white;
  border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,0.2);transition:0.2s;}
.delete-img-btn:hover{transform:scale(1.1);}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.spinner{width:40px;height:40px;border:4px solid rgba(16,40,56,0.1);border-left-color:var(--pink);
  border-radius:50%;animation:spin 1s linear infinite;}
.spinner-sm{width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-left-color:#fff;
  border-radius:50%;animation:spin 1s linear infinite;display:inline-block;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ⭐ Currency prefix in price input + badge */
.budget-input-wrap{position:relative;display:flex;align-items:stretch;width:100%;}
.budget-input-wrap .currency-prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-weight:800;color:var(--muted);font-size:.95rem;pointer-events:none;transition:.2s;z-index:1;}
.budget-input-wrap input{padding-left:32px !important;}
.currency-mini-badge{display:inline-block;font-size:.62rem;background:rgba(16,40,56,.1);color:var(--navy);
  padding:2px 8px;border-radius:10px;font-weight:700;border:1px solid var(--border);
  text-transform:uppercase;letter-spacing:.06em;}
.currency-mini-badge.zar{background:rgba(0,122,77,.12);color:#007A4D;border-color:rgba(0,122,77,.35);}

/* ===== DRAFT BANNER ===== */
.draft-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 18px;background:linear-gradient(135deg,#FFF8E1 0%,#FFECB3 100%);
  border:1px solid #FFD54F;border-left:4px solid #FFA000;border-radius:10px;margin-bottom:20px;
  font-size:0.9rem;color:#6D4C00;animation:fadeIn 0.3s ease-out;flex-wrap:wrap;}
.draft-banner .draft-info{display:flex;align-items:center;gap:10px;flex:1;min-width:200px;}
.draft-banner .draft-info i{font-size:1.2rem;color:#EF6C00;}
.draft-banner .draft-info strong{color:#4E342E;}
.draft-banner .draft-actions{display:flex;gap:8px;flex-wrap:wrap;}
.draft-banner button{padding:6px 14px;border-radius:20px;font-size:0.8rem;font-weight:700;
  cursor:pointer;border:none;font-family:inherit;transition:0.2s;}
.draft-banner .btn-discard{background:transparent;color:#6D4C00;border:1px solid #FFB300;}
.draft-banner .btn-discard:hover{background:rgba(255,167,0,0.12);}
.draft-status{position:fixed;bottom:24px;right:24px;background:var(--navy);color:var(--lime);
  padding:10px 18px;border-radius:30px;font-size:0.8rem;font-weight:600;
  box-shadow:0 8px 24px rgba(16,40,56,0.25);display:flex;align-items:center;gap:8px;
  opacity:0;transform:translateY(20px);transition:opacity 0.3s,transform 0.3s;
  pointer-events:none;z-index:9999;max-width:calc(100% - 48px);}
.draft-status.visible{opacity:1;transform:translateY(0);}

/* Toast */
.z21-toast-wrap{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:9998;
  display:flex;flex-direction:column;gap:8px;max-width:92vw;pointer-events:none;}
.z21-toast{padding:12px 20px;background:var(--navy);color:#fff;border-radius:30px;
  font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:10px;
  box-shadow:0 12px 32px rgba(16,40,56,.35);pointer-events:auto;animation:toastIn .3s ease;max-width:100%;}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}
.z21-toast.success{background:var(--lime);color:var(--navy);}
.z21-toast.error{background:var(--pink);color:#fff;}

@media (max-width:600px){
  .profile-info{padding:15px;}
  .profile-avatar{margin-left:20px;width:90px;height:90px;font-size:1.8rem;margin-top:-45px;}
  .detail-grid{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .edit-toggle-btn{top:10px;right:10px;font-size:0.8rem;padding:6px 12px;}
  .draft-status{bottom:12px;right:12px;left:12px;justify-content:center;}
  .detect-bar{flex-direction:column;}
  .detect-chip{min-width:100%;}
  .detect-chip.currency{height:48px !important;min-height:48px !important;max-height:48px !important;
    padding:4px 6px 4px 8px !important;gap:6px !important;}
  .detect-chip.currency .dc-icon{width:28px;height:28px;font-size:.8rem;}
  .detect-chip.currency .dc-value{font-size:.78rem;}
  .detect-chip.currency .dc-sub{display:none;}
  .currency-switch{height:28px;}
  .currency-switch button{padding:4px 8px;font-size:.62rem;height:22px;}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="vendordashboard.html" class="back-btn" id="dash-btn" style="display:none;">
      <i class="fas fa-arrow-left"></i> Dashboard
    </a>
    <div class="logo">Zone<span>21</span> Venue</div>
  </div>

  <!-- ⭐ DETECT BAR -->
  <div class="detect-bar" id="detectBar">
    <div class="detect-chip country hidden-chip" id="countryChip" style="display:none;">
      <div class="dc-icon"><i class="fas fa-globe-africa" id="countryChipIcon"></i></div>
      <div class="dc-text">
        <div class="dc-label">Venue Country</div>
        <div class="dc-value" id="countryChipValue">Waiting for location…</div>
        <div class="dc-sub" id="countryChipSub">Include city &amp; country in the location field</div>
      </div>
    </div>

    <div class="detect-chip currency" id="currencyChip">
      <div class="dc-icon"><i class="fas fa-coins" id="currencyChipIcon"></i></div>
      <div class="dc-text">
        <div class="dc-value" id="currencyChipValue">USD $</div>
        <div class="dc-sub" id="currencyChipSub">Auto-detected from your location</div>
      </div>
      <div class="currency-switch" id="currencySwitch">
        <button type="button" data-currency="USD" onclick="setCurrency('USD', true)">🇺🇸 USD $</button>
        <button type="button" data-currency="ZAR" onclick="setCurrency('ZAR', true)">🇿🇦 ZAR R</button>
      </div>
    </div>
  </div>

  <div id="profile-content">
    <div class="loading"><div class="spinner"></div> Loading venue profile...</div>
  </div>
</div>

<div class="draft-status" id="draft-status">
  <i class="fas fa-cloud-arrow-up"></i>
  <span id="draft-status-text">Draft saved</span>
</div>

<div class="z21-toast-wrap" id="toastWrap"></div>

<template id="review-template">
  <div class="review-item">
    <div class="review-header">
      <span class="reviewer-name"></span>
      <span class="review-date"></span>
    </div>
    <div class="review-stars"></div>
    <div class="review-comment"></div>
  </div>
</template>

<script>
/* ═══════════════════════════════════════════════════════════
   FIREBASE
   ═══════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyBQj0hNKz07wfbimTtjb9tm92fd-G62PVo",
  authDomain: "zone21.firebaseapp.com",
  projectId: "zone21",
  storageBucket: "zone21.firebasestorage.app",
  messagingSenderId: "405963057292",
  appId: "1:405963057292:web:80e9923ae84eb7029073a9",
  measurementKind: "G-KE007Y89F1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

/* ═══════════════════════════════════════════════════════════
   CURRENCY ENGINE
   ═══════════════════════════════════════════════════════════ */
const CURRENCIES = {
  USD: { symbol: '$', code: 'USD', label: 'US Dollar' },
  ZAR: { symbol: 'R', code: 'ZAR', label: 'South African Rand' }
};
const USD_TO_ZAR = 19;
const ZAR_NATIVE_COUNTRIES = new Set(['south africa', 'lesotho', 'eswatini', 'namibia']);

/* ═══════════════════════════════════════════════════════════
   COUNTRY DATABASE (strict — same as blueprint)
   ═══════════════════════════════════════════════════════════ */
const COUNTRY_DB = {
  'zimbabwe': {
    name:'Zimbabwe', display:'Zimbabwe', flag:'🇿🇼', code:'ZW',
    aliases:['zimbabwe','zim','zw','republic of zimbabwe'],
    cities:['harare','bulawayo','mutare','gweru','kwekwe','masvingo','chinhoyi','victoria falls','kadoma','chitungwiza','marondera','hwange','chegutu','bindura','zvishavane','beitbridge','kariba','chiredzi','rusape','chipinge','shurugwi','plumtree','gwanda','lupane','esigodini','nyanga','chimanimani','chivhu','murehwa','ruwa','epworth','norton','banket','glendale','centenary','mazowe','shamva','concession','mount darwin','karoi','chirundu'],
    regions:['mashonaland','matabeleland','midlands','manicaland','masvingo province','harare province','bulawayo province']
  },

/* ═══════════════════════════════════════════════════════════
   COUNTRY DETECTION HELPERS
   ═══════════════════════════════════════════════════════════ */
function normalizeLocation(str) {
  if (!str) return '';
  return String(str).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\w\s,]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function escapeRegex(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function detectCountryFromLocation(locationStr){
  const norm = normalizeLocation(locationStr);
  if (!norm) return null;

  // PASS 1 — country name/alias
  for (const [key, meta] of Object.entries(COUNTRY_DB)) {
    for (const alias of meta.aliases) {
      const a = normalizeLocation(alias);
      if (!a) continue;
      const re = new RegExp(`(^|[\\s,])${escapeRegex(a)}($|[\\s,])`,'i');
      if (re.test(norm)) return key;
    }
  }
  // PASS 2 — cities, longest-first
  const allCities = [];
  for (const [key, meta] of Object.entries(COUNTRY_DB)) {
    for (const city of meta.cities) {
      const c = normalizeLocation(city);
      if (c) allCities.push({ key, city: c });
    }
  }
  allCities.sort((a,b) => b.city.length - a.city.length);
  for (const { key, city } of allCities) {
    const re = new RegExp(`(^|[\\s,])${escapeRegex(city)}($|[\\s,])`,'i');
    if (re.test(norm)) return key;
  }
  // PASS 3 — regions
  for (const [key, meta] of Object.entries(COUNTRY_DB)) {
    for (const region of meta.regions) {
      const r = normalizeLocation(region);
      if (!r) continue;
      const re = new RegExp(`(^|[\\s,])${escapeRegex(r)}($|[\\s,])`,'i');
      if (re.test(norm)) return key;
    }
  }
  return null;
}
function getCountryMeta(key){ return key ? (COUNTRY_DB[key] || null) : null; }
function getCurrencyForCountry(countryKey){
  if (!countryKey) return 'USD';
  return ZAR_NATIVE_COUNTRIES.has(countryKey) ? 'ZAR' : 'USD';
}

/* ═══════════════════════════════════════════════════════════
   CURRENCY HELPERS
   ═══════════════════════════════════════════════════════════ */
function currencySymbol(c = activeCurrency){ return (CURRENCIES[c] && CURRENCIES[c].symbol) || '$'; }
function convertAmount(usdAmount, currency = activeCurrency){
  const n = Number(usdAmount) || 0;
  return currency === 'ZAR' ? n * USD_TO_ZAR : n;
}
function formatMoney(amount, currency = activeCurrency){
  const n = Math.round(Number(amount) || 0);
  return `${currencySymbol(currency)}${n.toLocaleString('en-US')}`;
}
function formatFromUSD(usdAmount, currency = activeCurrency){
  return formatMoney(convertAmount(usdAmount, currency), currency);
}

function updateCountryChip() {
  if (!countryChip) return;
  let key = null, locText = '';

  if (viewMode === 'edit') {
    const el = $('e-loc');
    locText = el ? el.value : '';
    if (!locText.trim()) {
      countryChip.classList.add('hidden-chip');
      countryChip.style.display = 'none';
      return;
    }
    key = detectCountryFromLocation(locText);
  } else {
    key = venueData?.country || detectCountryFromLocation(venueData?.location || '');
    locText = venueData?.location || '';
    if (!locText) {
      countryChip.classList.add('hidden-chip');
      countryChip.style.display = 'none';
      return;
    }
  }

  countryChip.classList.remove('hidden-chip');
  countryChip.style.display = 'flex';

  if (key) {
    const meta = getCountryMeta(key);
    countryChip.className = 'detect-chip country ok';
    countryChipIcon.className = 'fas fa-check-circle';
    countryChipValue.textContent = `${meta.flag}  ${meta.display}`;
    countryChipSub.textContent = `Vendors strictly scoped to ${meta.display}`;
  } else {
    countryChip.className = 'detect-chip country err';
    countryChipIcon.className = 'fas fa-exclamation-triangle';
    countryChipValue.textContent = 'Country not recognised';
    countryChipSub.textContent = 'Try "Harare, Zimbabwe" or "Pretoria, South Africa"';

function autoDetectCurrencyFromLocation() {
  if (currencyManuallySet) return;
  const loc = viewMode === 'edit' ? ($('e-loc')?.value || '') : (venueData?.location || '');
  const key = detectCountryFromLocation(loc);
  if (!key) return;
  const next = getCurrencyForCountry(key);
  if (next !== activeCurrency) {
    activeCurrency = next;
    try { localStorage.setItem('zone21_currency', next); } catch (e) {}
    applyCurrencyUI();
  }
}

/* ═══════════════════════════════════════════════════════════
   LINK FIX
   ═══════════════════════════════════════════════════════════ */
function fixLink(value, base) {
  if (!value) return '';
  let v = String(value).trim();
  if (!v) return '';
  if (v.startsWith('http://') || v.startsWith('https://')) return v;
  if (v.startsWith('@')) v = v.slice(1);
  return base + v.replace(/^\/+/, '');
}

/* ═══════════════════════════════════════════════════════════
   IMAGE COMPRESSION
   ═══════════════════════════════════════════════════════════ */
function compressToBase64(file, maxWidth, quality, callback) {
  const reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onload = function(event) {
    const img = new Image();
    img.src = event.target.result;
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let width = img.width;
      let height = img.height;
      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
  };
}

function scheduleDraftSave() {
  clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(saveDraftNow, 400);
}

function saveDraftNow() {
  try {
    const state = collectFormState();
    const payload = JSON.stringify(state);
    try {
      localStorage.setItem(getDraftKey(), payload);
    } catch (quotaErr) {
      const slim = { ...state, images: [], avatar: null, _slim: true };
      localStorage.setItem(getDraftKey(), JSON.stringify(slim));
      showDraftStatus('Progress saved');
      return;
    }
    showDraftStatus('Progress saved • ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
  } catch (e) { console.warn('Draft save failed:', e); }
}

function loadDraft() {
  try {
    const raw = localStorage.getItem(getDraftKey());
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function clearDraft() {
  try { localStorage.removeItem(getDraftKey()); } catch (e) {}
  draftRestoredFromStorage = false;

function showDraftStatus(text) {
  const el = $('draft-status');

  txt.textContent = text;
  el.classList.add('visible');
  clearTimeout(draftStatusTimer);

function attachDraftListeners() {
  ['e-name','e-loc','e-price','e-capacity','e-venue-type','e-desc','e-pricing','e-policies',
   'e-deposit','e-hours','e-parking','e-catering','e-tt','e-ig','e-fb','e-yt','e-web'].forEach(id => {
    const el = $(id);
    if (el) { el.addEventListener('input', scheduleDraftSave); el.addEventListener('change', scheduleDraftSave); }
  });
  document.querySelectorAll('.edit-amenity-chk').forEach(cb => cb.addEventListener('change', scheduleDraftSave));

  // ⭐ Location-specific listener for country detection
  const locInput = $('e-loc');
  if (locInput) {
    let debounceTimer = null;
    locInput.addEventListener('input', () => {
      updateCountryChip();
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        autoDetectCurrencyFromLocation();
        // Re-detect if user is typing a fully new location
        if (!currencyManuallySet) {
          const key = detectCountryFromLocation(locInput.value);
          if (key) {
            const next = getCurrencyForCountry(key);
            if (next !== activeCurrency) {
              activeCurrency = next;
              try { localStorage.setItem('zone21_currency', next); } catch (e) {}
              applyCurrencyUI();
            }
          }
        }
      }, 200);
    });
    locInput.addEventListener('blur', () => {
      updateCountryChip();
      autoDetectCurrencyFromLocation();
    });
  }
}

  if (!draft) return;
  const setVal = (id, val) => { const el = $(id); if (el && val !== undefined && val !== null) el.value = val; };
  setVal('e-name', draft.name); setVal('e-loc', draft.location);

/* ═══════════════════════════════════════════════════════════
   RESOLVE VENUE ID & AUTH
   ═══════════════════════════════════════════════════════════ */
async function resolveVenueId(user) {
  const urlParams = new URLSearchParams(window.location.search);
  const idFromUrl = urlParams.get('id');
  if (idFromUrl && idFromUrl !== 'null' && idFromUrl !== 'undefined') return idFromUrl;
  if (user) {
    try {
      const doc = await db.collection('venues').doc(user.uid).get();
      if (doc.exists) return user.uid;
      if (user.email) {
        const snap = await db.collection('venues').where('email','==',user.email).limit(1).get();
        if (!snap.empty) return snap.docs[0].id;
      }
    } catch (error) { console.error("Error resolving venue ID:", error); }
  }
  return null;
}

auth.onAuthStateChanged(async (user) => {
  currentUser = user;
  currentVenueId = await resolveVenueId(user);
  if (currentVenueId) {
    isOwner = !!(user && (user.uid === currentVenueId));
    if (isOwner) $('dash-btn').style.display = 'block';
    loadVenueProfile();
  } else if (user) {
    showProfileNotFound(true);
  } else {
    showProfileNotFound(false);
  }
});

function showProfileNotFound(isLoggedIn) {
  const content = $('profile-content');
  if (isLoggedIn) {
    content.innerHTML = `
      <div class="error">
        <i class="fas fa-building" style="font-size:3rem; color:var(--navy);"></i>
        <h3>No Venue Profile Found</h3>

        <button class="btn-create" onclick="createVenueProfile()"><i class="fas fa-plus"></i> Create Venue Profile</button>
      </div>`;
  } else {
    content.innerHTML = `
      <div class="error">
        <i class="fas fa-lock" style="font-size:3rem; color:var(--navy);"></i>
        <h3>Please Sign In</h3>

        <a href="login.html" class="btn-create"><i class="fas fa-sign-in-alt"></i> Go to Login</a>
      </div>`;
  }
}

async function createVenueProfile() {
  if (!auth.currentUser) return;
  const uid = auth.currentUser.uid;
  const email = auth.currentUser.email || '';
  const defaultData = {
    name: email.split('@')[0] || 'My Venue',
    category: 'Venue / Space Rental',
    services: ['Venue / Space Rental'],
    description: '', location: '', basePrice: 0, capacity: 0, venueType: 'Indoor',
    amenities: [], pricingPackages: '', rentalPolicies: '', deposit: '',
    operatingHours: '', parking: '', catering: '',
    country: null, currency: 'USD',
    rating: 0, reviewsCount: 0, status: 'pending',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  await db.collection('venues').doc(uid).set(defaultData);
  window.location.reload();
}

async function loadVenueProfile() {
  try {
    const doc = await db.collection('venues').doc(currentVenueId).get();
    if (!doc.exists) { showProfileNotFound(!!auth.currentUser); return; }
    venueData = doc.data();
    if (currentUser) {
      isOwner = currentUser.uid === currentVenueId ||
               (venueData.email && venueData.email === currentUser.email);
      $('dash-btn').style.display = isOwner ? 'block' : 'none';
    } else { isOwner = false; }
    uploadedImages = venueData.images || [];

    // Auto-detect currency from venue's country if not manually set
    if (!currencyManuallySet && venueData.country) {
      const next = getCurrencyForCountry(venueData.country);
      if (next !== activeCurrency) {
        activeCurrency = next;
        try { localStorage.setItem('zone21_currency', next); } catch (e) {}
      }
    }

    if (viewMode === 'public') { renderPublicView(); loadReviews(currentVenueId); }
    else renderEditView();
  } catch (error) {
    console.error(error);
    $('profile-content').innerHTML = '<div class="error">Failed to load profile.</div>';
  }
}

function toggleMode() {
  if (viewMode === 'edit') clearTimeout(draftSaveTimer);
  viewMode = viewMode === 'public' ? 'edit' : 'public';
  draftRestoredFromStorage = false;
  loadVenueProfile();
}

/* ═══════════════════════════════════════════════════════════
   PUBLIC VIEW

function renderPublicView() {

  const avatarHtml = venueData.avatar ? `<img src="${venueData.avatar}" alt="Avatar">` : initials;

  if (venueData.instagram) socialLinks.push({ class:'social-instagram', icon:'fab fa-instagram', url:fixLink(venueData.instagram,'https://instagram.com/'), label:'Instagram' });
  if (venueData.tiktok) socialLinks.push({ class:'social-tiktok', icon:'fab fa-tiktok', url:fixLink(venueData.tiktok,'https://tiktok.com/@'), label:'TikTok' });
  if (venueData.youtube) socialLinks.push({ class:'social-youtube', icon:'fab fa-youtube', url:fixLink(venueData.youtube,'https://youtube.com/@'), label:'YouTube' });
  if (venueData.website) socialLinks.push({ class:'social-website', icon:'fas fa-globe', url:fixLink(venueData.website,'https://'), label:'Website' });

/* ═══════════════════════════════════════════════════════════
   EDIT HANDLERS
   ═══════════════════════════════════════════════════════════ */
async function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('Please select an image file.'); return; }
  const box = $('avatar-preview-box');
  box.innerHTML = '<div class="spinner-sm" style="border-left-color:var(--navy);"></div>';
  compressToBase64(file, 400, 0.7, (base64) => {
    venueData.avatar = base64;
    box.innerHTML = `<img src="${base64}" alt="Avatar"><div class="avatar-edit-overlay"><i class="fas fa-camera"></i></div>`;
    showDraftStatus('Avatar updated');
    scheduleDraftSave();
  });
  event.target.value = '';
}

async function handleGalleryUpload(event) {
  const files = Array.from(event.target.files);
  if (uploadedImages.length + files.length > 5) {
    alert("Maximum 5 images allowed in the gallery.");
    event.target.value = '';
    return;
  }
  const txt = $('upload-text');
  txt.innerHTML = `<span class="spinner-sm" style="border-left-color:var(--navy);"></span> Processing...`;

  let added = 0, processed = 0;
  files.forEach(file => {
    if (!file.type.startsWith('image/')) { processed++; return; }
    compressToBase64(file, 800, 0.6, (base64) => {
      uploadedImages.push(base64);
      added++;
      processed++;
      if (processed === files.length) {
        renderEditView();
        if (added > 0) {
          showDraftStatus(`${added} image${added > 1 ? 's' : ''} added`);
          scheduleDraftSave();
        }
      }
    });
  });
  event.target.value = '';
}

function removeImage(index) {
  uploadedImages.splice(index, 1);
  renderEditView();
  scheduleDraftSave();
}

/* ═══════════════════════════════════════════════════════════
   SAVE — strict country validation + ZAR support
   ═══════════════════════════════════════════════════════════ */
async function saveProfileData() {
  const btn = $('save-btn');
  const locationVal = $('e-loc').value.trim();

  // ⭐ STRICT COUNTRY CHECK — block if country can't be resolved
  const resolvedCountry = detectCountryFromLocation(locationVal);
  if (!resolvedCountry) {
    showToast('Please include a recognized country in the location — e.g. "Harare, Zimbabwe" or "Pretoria, South Africa".', 'error');
    $('e-loc').focus();
    updateCountryChip();
    return;
  }

  btn.innerHTML = '<span class="spinner-sm"></span> Saving...';
  btn.disabled = true;

  const selectedAmenities = Array.from(document.querySelectorAll('.edit-amenity-chk:checked')).map(cb => cb.value);

  // ⭐ Convert price input (in activeCurrency) to USD for storage
  const basePriceDisplay = Number($('e-price').value) || 0;
  const basePriceUsd = activeCurrency === 'ZAR'
    ? Math.round((basePriceDisplay / USD_TO_ZAR) * 100) / 100
    : Math.round(basePriceDisplay * 100) / 100;

  const updates = {
    name: $('e-name').value.trim(),
    location: locationVal,
    country: resolvedCountry,           // ⭐ stored country key for strict scoping
    basePrice: basePriceUsd,             // ⭐ canonical USD value
    basePriceCurrency: activeCurrency,   // ⭐ what the owner priced in
    basePriceDisplay: basePriceDisplay,  // ⭐ exact number they typed
    capacity: parseInt($('e-capacity').value) || 0,
    venueType: $('e-venue-type').value,
    description: $('e-desc').value.trim(),
    services: ['Venue / Space Rental'],
    amenities: selectedAmenities,
    pricingPackages: $('e-pricing').value.trim(),
    rentalPolicies: $('e-policies').value.trim(),
    deposit: $('e-deposit').value.trim(),
    operatingHours: $('e-hours').value.trim(),
    parking: $('e-parking').value.trim(),
    catering: $('e-catering').value.trim(),
    tiktok:    fixLink($('e-tt').value, 'https://tiktok.com/@'),
    instagram: fixLink($('e-ig').value, 'https://instagram.com/'),
    facebook:  fixLink($('e-fb').value, 'https://facebook.com/'),
    youtube:   fixLink($('e-yt').value, 'https://youtube.com/@'),
    website:   fixLink($('e-web').value, 'https://'),
    currency: activeCurrency,
    avatar: venueData.avatar || null,
    images: uploadedImages,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    await db.collection('venues').doc(currentVenueId).set(updates, { merge: true });
    venueData = { ...venueData, ...updates };
    clearDraft();
    showDraftStatus('Saved ✓');
    toggleMode();
  } catch (e) {
    console.error('Save error:', e);
    let msg = 'Could not save your changes right now. ';
    if (e.code === 'permission-denied') {
      msg += 'Please make sure you are signed in to the correct account and try again.';
    } else if (e.code === 'unavailable' || e.code === 'deadline-exceeded') {
      msg += 'Please check your internet connection and try again.';
    } else {
      msg += 'Please try again in a moment.';
    }
    alert(msg);
    btn.innerHTML = '<i class="fas fa-save"></i> Save All Changes';
    btn.disabled = false;
  }
}

/* ═══════════════════════════════════════════════════════════
   REVIEW SYSTEM
   ═══════════════════════════════════════════════════════════ */
function setupStarRating() {
  document.querySelectorAll('#star-input i').forEach(star => {
    star.addEventListener('mouseover', () => updateStarInputUI(parseInt(star.dataset.value)));
    star.addEventListener('mouseleave', () => updateStarInputUI(selectedRating));
    star.addEventListener('click', () => { selectedRating = parseInt(star.dataset.value); updateStarInputUI(selectedRating); });
  });
}

function updateStarInputUI(val) {
  document.querySelectorAll('#star-input i').forEach(star => {
    star.className = parseInt(star.dataset.value) <= val ? 'fas fa-star active' : 'far fa-star';
  });
}

async function checkExistingReview(profileId, collectionName) {
  if (!currentUser) return null;
  try {
    const snap = await db.collection(collectionName).doc(profileId).collection('reviews')
      .where('reviewerId','==',currentUser.uid).get();
    if (!snap.empty) { const doc = snap.docs[0]; return { id: doc.id, ...doc.data() }; }
    return null;
  } catch (e) { console.error('Error checking existing review:', e); return null; }
}

async function submitReview(profileId, collectionName) {
  if (selectedRating === 0) { alert('Please select a star rating.'); return; }
  const comment = $('review-comment').value.trim();
  if (!comment) { alert('Please write a comment.'); return; }
  const reviewerName = $('reviewer-name').value.trim() || 'Anonymous';
  const btn = $('submit-review-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> Sending...';
  const existingReviewId = btn.dataset.reviewId || null;

  try {
    const reviewData = {
      rating: selectedRating, reviewerName, comment,
      reviewerId: currentUser.uid,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (existingReviewId) {
      await db.collection(collectionName).doc(profileId).collection('reviews').doc(existingReviewId).update(reviewData);
    } else {
      reviewData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection(collectionName).doc(profileId).collection('reviews').add(reviewData);
    }
    await updateProfileRating(profileId, collectionName);
    loadReviews(profileId);
    $('review-status').textContent = 'Review saved successfully!';
    btn.textContent = 'Update Review';
    if (!existingReviewId) {
      const updated = await checkExistingReview(profileId, collectionName);
      if (updated) btn.dataset.reviewId = updated.id;
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Update Review';
  } catch (e) {
    console.error(e);
    alert('Failed to submit review. Please try again.');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Review';
  }
}

async function updateProfileRating(profileId, collectionName) {
  try {
    const reviewsSnap = await db.collection(collectionName).doc(profileId).collection('reviews').get();
    let total = 0, count = 0;
    reviewsSnap.forEach(doc => {
      const data = doc.data();
      if (data.rating) { total += data.rating; count++; }
    });
    const avg = count > 0 ? total / count : 0;
    await db.collection(collectionName).doc(profileId).update({ rating: avg, reviewsCount: count });
  } catch (e) { console.error('Error updating profile rating:', e); }
}

async function loadReviews(profileId) {
  const list = $('review-list');
  if (!list) return;
  list.innerHTML = '<p style="color:var(--muted);"><span class="spinner-sm" style="border-left-color:var(--navy);"></span> Loading reviews...</p>';
  try {
    const snap = await db.collection('venues').doc(profileId).collection('reviews').orderBy('createdAt','desc').get();
    list.innerHTML = '';
    if (snap.empty) { list.innerHTML = '<p style="color:var(--muted);">No reviews yet.</p>'; return; }
    const tmpl = $('review-template');
    snap.forEach(doc => {
      const r = doc.data();
      const clone = tmpl.content.cloneNode(true);
      clone.querySelector('.reviewer-name').textContent = r.reviewerName || 'Anonymous';
      let d = 'Recently';
      if (r.createdAt && r.createdAt.toDate) d = new Date(r.createdAt.toDate()).toLocaleDateString();
      clone.querySelector('.review-date').textContent = d;
      clone.querySelector('.review-stars').textContent = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
      clone.querySelector('.review-comment').textContent = r.comment || '';
      list.appendChild(clone);
    });
  } catch (e) { list.innerHTML = '<p style="color:var(--pink);">Failed to load reviews.</p>'; }
}

function copyProfileLink(pid) {
  navigator.clipboard.writeText(window.location.href).then(() => alert('Profile link copied!'));
}
